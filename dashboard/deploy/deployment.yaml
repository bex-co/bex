apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    app.kubernetes.io/name: bex-dashboard
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  # w1/m52: explicit surge-then-kill (the replicas=1 default already resolves
  # to 0/1 — pinned so a future replica bump can't reintroduce kill-first) and
  # a short soak before a new pod is trusted with the handover.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: bex-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bex-dashboard
    spec:
      # w1/m19 t003: platform pool
      nodeSelector:
        bex.co/pool: platform
      tolerations:
        - key: bex.co/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        # node:22-alpine's `node` user (Dockerfile's USER node) — Kubernetes
        # can't resolve a named user for the runAsNonRoot check, only a UID.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          # CI's image override (dashboard=...) rewrites this tag — see
          # deploy/gitops/base/dashboard.yaml and .github/workflows/deploy.yml.
          #
          # NOTE: VITE_API_URL / VITE_KRATOS_PUBLIC_URL / VITE_KRATOS_SSR_URL
          # are Vite build-time values (dashboard/Dockerfile ARGs) baked into
          # the JS bundle at image build — setting them here as container env
          # vars would have no effect. Rebuild the image to change them.
          image: dashboard:latest
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "3000"
            # OAuth2 consent acceptor (docs/ADR012-auth.md §7, w4/m9): SSR-only env for
            # the /auth/consent server route — Hydra's urls.consent points here.
            # Runtime env (not a VITE_ build ARG) because only the Node server
            # reads it; it must never reach the client bundle.
            - name: HYDRA_ADMIN_URL
              value: http://hydra-admin.auth.svc:4445
            # Browser-reachable issuer used to start Hydra's device verification
            # redirect. This cannot be the in-cluster admin Service URL.
            - name: HYDRA_PUBLIC_URL
              value: https://oauth.bex.co
            # Extra trusted client_ids beyond Hydra's own skip_consent flag;
            # empty by default — unknown clients are denied.
            - name: OAUTH_TRUSTED_CLIENTS
              value: ""
            # Operator-owned platform-client registry used for the bex.api
            # compatibility alias. Never derive this from DCR-writable client
            # metadata. Keep aligned with bex-api's BEX_OAUTH_PLATFORM_CLIENTS.
            - name: OAUTH_PLATFORM_CLIENTS
              value: 429024F5E608930E2A65EF92591A25CC,bex-mobile
            # The control-plane capability OAuth scope (round-14 #1,
            # docs/ADR069-security-review-round14.md): a client requesting an
            # access-token audience must also request this scope, or consent
            # refuses the flow — otherwise a dynamic client could show a
            # consent screen of identity-only scopes while receiving a token
            # with the user's full API authority. MUST equal bex-api's
            # BEX_OAUTH_API_SCOPE (both default to bex.api).
            - name: OAUTH_API_SCOPE
              value: bex.api
            # Ops-workspace gate for ops-gated OIDC clients (w5/m86,
            # docs/ADR087-platform-observability-ui.md §4): before ANY accept
            # for a client listed here, consent resolves the subject's role in
            # the pinned ops workspace via bex-api's cluster-internal verb and
            # stamps ops_role/email/name id_token claims; non-members reject
            # access_denied. Fail closed: a listed client with the URL or token
            # missing is rejected at consent; unlisted clients are untouched.
            # The token rides the out-of-band dashboard/bex-ops Secret and must
            # equal bex-system/bex-ops BEX_OPS_ROLE_TOKEN.
            - name: OAUTH_OPS_CLIENTS
              value: bex-obs
            - name: BEX_OPS_ROLE_URL
              value: http://bex-api.bex-system.svc:8091/internal/ops-role
            - name: BEX_OPS_ROLE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bex-ops
                  key: BEX_OPS_ROLE_TOKEN
                  optional: true
          ports:
            - name: http
              containerPort: 3000
          # w1/m52: the Node server exits the instant SIGTERM lands, but
          # Traefik keeps routing to a terminating pod for a few seconds
          # (measured 2026-07-18: ~3s of 502s on every roll). preStop delays
          # the SIGTERM while the pod — already withdrawn from endpoints the
          # moment deletion starts — keeps serving late-routed requests.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          # timeoutSeconds 5: a cold pod's first SSR render can exceed the 1s
          # default (observed 2026-07-18: "context deadline exceeded" probe
          # failures on fresh pods) — liveness must tolerate the warm-up, and
          # probing `/` doubles as the SSR warm-up before readiness admits
          # traffic.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 5
          # w1/m52 (inbox 036): readiness gates on upstream reachability —
          # `GET /` renders fine even when the pod can't reach bex-api yet, so
          # it measured the wrong thing and fresh pods took traffic they could
          # only answer with the SSR error page. /healthz 503s until the pod
          # has reached bex-api once (latched — a steady-state bex-api outage
          # degrades to inline error states, it does not turn every dashboard
          # pod NotReady). timeoutSeconds must exceed the route's 1.5s
          # upstream-probe budget.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 1
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Vite/Nitro writes a small cache under /app at boot
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
