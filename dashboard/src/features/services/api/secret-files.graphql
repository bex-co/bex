# bex-api's per-service secret-files surface (backend/internal/secrets/files.go,
# docs/ADR006-bex-api.md). The list is the paged, top-level `secretFiles` query —
# the exact twin of `envVars` — selecting names only (each with an id == name),
# with the per-item `cursor` the client walks to fetch every page. A file's
# contents are fetched per name via the nested `secretFile(name)` ("Show
# contents"), never in the bulk list. Mutations are top-level and return a success
# boolean.

query SecretFileNames($serviceId: String!, $cursor: String, $limit: Int) {
  secretFiles(serviceId: $serviceId, cursor: $cursor, limit: $limit) {
    secretFile {
      id
      name
    }
    cursor
  }
}

query SecretFileContent($id: String!, $name: String!) {
  service(id: $id) {
    id
    secretFile(name: $name) {
      id
      name
      content
    }
  }
}

mutation SetSecretFile($serviceId: String!, $name: String!, $content: String) {
  setSecretFile(serviceId: $serviceId, name: $name, content: $content)
}

mutation DeleteSecretFile($serviceId: String!, $name: String!) {
  deleteSecretFile(serviceId: $serviceId, name: $name)
}
