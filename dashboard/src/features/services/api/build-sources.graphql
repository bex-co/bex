# Service-to-Build-Source linking (w2/m254, ADR097).
# BuildSources/BuildSource/BuildSourceBuilds queries and CRUD live in
# dashboard/src/features/build-sources/api/build-sources.graphql.
mutation LinkBuildSource(
  $serviceId: String!
  $buildSourceId: String!
  $startCommand: String
  $deploy: Boolean
) {
  linkBuildSource(
    serviceId: $serviceId
    buildSourceId: $buildSourceId
    startCommand: $startCommand
    deploy: $deploy
  ) {
    # Linking clears the service's own source and build settings.
    id
    repo
    branch
    imagePath
    buildSourceId
    startCommand
    command
    runtime
    builder
    buildCommand
    rootDir
    dockerfilePath
    dockerContext
    registryCredentialId
    latestDeployId
    buildFilter {
      paths
      ignoredPaths
    }
  }
}
