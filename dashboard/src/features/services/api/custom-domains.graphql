# bex-api's custom-domains surface, Render dashboard-shaped. `verificationStatus`
# is Render's field with Render's meaning: "unverified" until the traffic DNS
# record points at the service, then "verified" (verification runs automatically
# in the background; `verifyCustomDomain` is the manual trigger). `dnsRecord` is
# the one record the tenant creates (CNAME/ALIAS -> the app's platform host,
# w5/m10). `certificateStatus` is "verified"/"pending" (TLS cert issued?);
# `serverStatus` is "active"/"pending" (cert issued and not suspended).
# `domainType` is "apex"/"subdomain". `certificateReason` is cert-manager's own
# explanation of a stalled TLS issuance (w3/m85) — null once issued.
# Mutations are Render-dashboard-shaped: addCustomDomain returns the new domain;
# deleteCustomDomain returns a success boolean; verifyCustomDomain re-checks the
# domain's traffic DNS now and returns its fresh status (still "unverified",
# without an error, when the record does not point here yet).

fragment CustomDomainFields on CustomDomain {
  id
  name
  domainType
  verificationStatus
  certificateStatus
  serverStatus
  redirectForName
  certificateReason
  dnsRecord {
    type
    name
    value
  }
  edgeAddresses
}

query CustomDomains($id: String!) {
  customDomains(id: $id) {
    ...CustomDomainFields
  }
}

mutation AddCustomDomain($id: String!, $name: String!) {
  addCustomDomain(id: $id, name: $name) {
    ...CustomDomainFields
  }
}

mutation DeleteCustomDomain($id: String!, $name: String!) {
  deleteCustomDomain(id: $id, name: $name)
}

mutation VerifyCustomDomain($id: String!, $name: String!) {
  verifyCustomDomain(id: $id, name: $name) {
    ...CustomDomainFields
  }
}
