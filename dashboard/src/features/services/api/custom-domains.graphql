# bex-api's custom-domains surface, Render dashboard-shaped. Managed domains are
# durable claims: `ownershipStatus` gates projection into App.spec.host(s), and
# `ownershipDnsRecord` is the exact pending TXT proof. `verificationStatus` is
# "verified"/"pending" (TLS cert issued?); `serverStatus`
# is "active"/"pending" (cert issued and not suspended). `domainType` is
# "apex"/"subdomain"; `dnsRecord` is the record the tenant must create to point the
# domain at the service (CNAME/ALIAS -> the app's platform host, w5/m10).
# Mutations are Render-dashboard-shaped: addCustomDomain returns the new domain;
# deleteCustomDomain returns a success boolean; verifyCustomDomain re-checks the
# domain's DNS/cert state now and returns its fresh status.

fragment CustomDomainFields on CustomDomain {
  id
  name
  domainType
  ownershipStatus
  verificationStatus
  serverStatus
  redirectForName
  dnsRecord {
    type
    name
    value
  }
  ownershipDnsRecord {
    type
    name
    value
  }
}

query CustomDomains($id: String!) {
  customDomains(id: $id) {
    ...CustomDomainFields
  }
}

mutation AddCustomDomain($id: String!, $name: String!) {
  addCustomDomain(id: $id, name: $name) {
    ...CustomDomainFields
  }
}

mutation DeleteCustomDomain($id: String!, $name: String!) {
  deleteCustomDomain(id: $id, name: $name)
}

mutation VerifyCustomDomain($id: String!, $name: String!) {
  verifyCustomDomain(id: $id, name: $name) {
    ...CustomDomainFields
  }
}
