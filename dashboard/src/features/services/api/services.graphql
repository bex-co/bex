# bex-api's services surface (backend/internal/api/graphql.go), Render-shaped:
# `services` lists every App; `suspendService`/`resumeService`/`restartServer`
# are Render's dashboard mutation names, each returning the updated Service.
# `suspended` is Render's string enum ("suspended"/"not_suspended"), NOT a bool;
# `phase`/`replicas`/`revision`/`plan` are bex-native extras (a superset Render
# ignores). `plan` (w1/m8) is null for an untiered (bare-CR) App. GraphQL
# exposes the live URL as a flat `url` field (REST nests it under
# serviceDetails.url — the two surfaces differ here by design).

# ownerId scopes the list to one workspace (w6/m2/t004's REST/GraphQL filter) —
# the dashboard's workspace switcher (w6/m3) passes the selected workspace's id;
# omitted, bex-api falls back to the caller's default workspace.
query Services($ownerId: String) {
  services(ownerId: $ownerId) {
    id
    name
    displayName
    type
    suspended
    dashboardUrl
    url
    createdAt
    phase
    replicas
    revision
    plan
    idleTTLSeconds
  }
}

mutation SuspendService($id: String!, $confirm: String) {
  suspendService(id: $id, confirm: $confirm) {
    id
    suspended
    phase
  }
}

mutation ResumeService($id: String!) {
  resumeService(id: $id) {
    id
    suspended
    phase
  }
}

# restartServer removed (w2/m30): restart now routes through triggerDeploy
# so every restart opens a deploy-history row in the Events tab.

# deleteService returns a success boolean — there's no service left to select
# (backend/internal/apps/graphql.go, following the deleteDatabase shape). The
# dashboard danger zone (w5/m14) gates it behind a typed-name confirm.
mutation DeleteService($id: String!, $confirm: String) {
  deleteService(id: $id, confirm: $confirm)
}

# The create wizard's submit (w5/m15, extended in w5/m17): exactly one of repo
# (build-from-git) or image must be set; branch/rootDir/autoDeploy apply to git
# sources only. type selects the service kind (web_service default); schedule and
# command are cron_job-only; publishPath is static_site-only.
# updateCronJob: change a cron_job's schedule and/or command (w5/m18).
# schedule is required; command is optional (empty clears the entrypoint override).
mutation UpdateCronJob($id: String!, $schedule: String!, $command: String) {
  updateCronJob(id: $id, schedule: $schedule, command: $command) {
    id
    schedule
    command
  }
}

# `ownerId` (w6/m14) names the workspace to create the service in — the switcher's
# selection, mirroring the `services` list query above. Omitted => the caller's
# default (oldest) workspace; a workspace the caller isn't a member of => forbidden.
mutation CreateService(
  $name: String!
  $ownerId: String
  $environmentId: String
  $type: String
  $repo: String
  $image: String
  $branch: String
  $rootDir: String
  $runtime: String
  $buildCommand: String
  $startCommand: String
  $dockerfilePath: String
  $plan: String
  $autoDeploy: Boolean
  $schedule: String
  $command: String
  $publishPath: String
  $envVars: [EnvVarInput]
  $secretFiles: [SecretFileInput]
) {
  createService(
    name: $name
    ownerId: $ownerId
    environmentId: $environmentId
    type: $type
    repo: $repo
    image: $image
    branch: $branch
    rootDir: $rootDir
    runtime: $runtime
    buildCommand: $buildCommand
    startCommand: $startCommand
    dockerfilePath: $dockerfilePath
    plan: $plan
    autoDeploy: $autoDeploy
    schedule: $schedule
    command: $command
    publishPath: $publishPath
    envVars: $envVars
    secretFiles: $secretFiles
  ) {
    id
    name
    type
    phase
    projectId
    environmentId
  }
}

# The create form's debounced availability check (w4/m19) — a bex extension,
# Render has no public availability API. Scoped to the caller's own workspace
# (the resolved default; the form has no ownerId argument to override it with
# yet, matching bex-api's own core method). available=false carries a concrete
# next-free-name suggestion ("beancount-cms-v2" taken -> "beancount-cms-v2-1").
query ServiceNameAvailable($name: String!) {
  serviceNameAvailable(name: $name) {
    available
    suggestion
  }
}
