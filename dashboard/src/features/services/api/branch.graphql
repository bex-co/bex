# setBranch changes the Git branch a repo-backed service builds and deploys
# from (Render's editable Branch field, w5/m48/t005). The backend's shared
# source verb persists it (spec.branch), so the next deploy builds the new
# branch and push-to-deploy matches it; the REST PATCH `branch` field and MCP
# update_service(branch) are the sibling surfaces (backend/internal/apps/graphql.go).
mutation SetBranch($id: String!, $branch: String!, $confirm: String) {
  setBranch(id: $id, branch: $branch, confirm: $confirm) {
    id
    repo
    branch
    phase
  }
}

# setRepo switches the Git repository a service builds from (Render's editable
# Source field, w5/m54, w4/m593). Shares the backend's source verb with
# setBranch, carries Render's Update Source build confirmations (runtime,
# buildCommand, startCommand/command, static-site publishPath), and when deploy
# is true immediately starts one deploy and returns its id in latestDeployId.
mutation SetRepo(
  $id: String!
  $repo: String!
  $branch: String
  $runtime: String
  $buildCommand: String
  $startCommand: String
  $command: String
  $publishPath: String
  $deploy: Boolean
  $confirm: String
) {
  setRepo(
    id: $id
    repo: $repo
    branch: $branch
    runtime: $runtime
    buildCommand: $buildCommand
    startCommand: $startCommand
    command: $command
    publishPath: $publishPath
    deploy: $deploy
    confirm: $confirm
  ) {
    id
    repo
    branch
    imagePath
    buildSourceId
    registryCredentialId
    runtime
    builder
    buildCommand
    startCommand
    command
    publishPath
    phase
    latestDeployId
  }
}
