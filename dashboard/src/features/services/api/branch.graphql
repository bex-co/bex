# setBranch changes the Git branch a repo-backed service builds and deploys
# from (Render's editable Branch field, w5/m48/t005). The backend's shared
# source verb persists it (spec.branch), so the next deploy builds the new
# branch and push-to-deploy matches it; the REST PATCH `branch` field and MCP
# update_service(branch) are the sibling surfaces (backend/internal/apps/graphql.go).
mutation SetBranch($id: String!, $branch: String!) {
  setBranch(id: $id, branch: $branch) {
    id
    repo
    branch
    phase
  }
}

# setRepo switches the Git repository a service builds from (Render's editable
# Source field, w5/m54). Shares the backend's source verb with setBranch, so a
# repo switch validates and triggers the documented rebuild path.
mutation SetRepo($id: String!, $repo: String!) {
  setRepo(id: $id, repo: $repo) {
    id
    repo
    branch
    phase
  }
}
