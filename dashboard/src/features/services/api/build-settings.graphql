# Existing-service Build & Deploy setters (w5/m30, extended w7/m41).
# setBuildCommand is for static_site and native-runtime services (w7/m41).
# setStartCommand / setDockerfilePath delegate to the same bex-api Service
# verbs as REST/MCP. dockerfilePath is relative to rootDir and only applies to
# a repo-backed Dockerfile build; an empty value restores the default Dockerfile.
# startCommand maps to Render's Start Command for native runtimes and Docker
# Command for Docker services.
mutation SetBuildCommand($id: String!, $command: String!, $confirm: String) {
  setBuildCommand(id: $id, command: $command, confirm: $confirm) {
    id
    buildCommand
    phase
  }
}

mutation SetStartCommand($id: String!, $command: String!, $confirm: String) {
  setStartCommand(id: $id, command: $command, confirm: $confirm) {
    id
    startCommand
    phase
  }
}

mutation SetDockerfilePath(
  $id: String!
  $dockerfilePath: String!
  $confirm: String
) {
  setDockerfilePath(
    id: $id
    dockerfilePath: $dockerfilePath
    confirm: $confirm
  ) {
    id
    dockerfilePath
    phase
  }
}
