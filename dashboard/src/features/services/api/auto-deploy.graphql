# setAutoDeploy is Render's Auto-Deploy toggle (w2/m9): whether a signed git push
# to the tracked branch redeploys the App (spec.autoDeploy). Backs the Settings
# tab's Build & Deploy section (backend/internal/apps/graphql.go). It does not
# itself redeploy — it changes future push behavior.
mutation SetAutoDeploy($id: String!, $enabled: Boolean!) {
  setAutoDeploy(id: $id, enabled: $enabled) {
    id
    autoDeploy
    autoDeployTrigger
  }
}

# setAutoDeployTrigger is the Settings Auto-Deploy picker with Render's three
# choices (w1/m181): off | commit | checksPass. checksPass waits for the pushed
# commit's GitHub checks and is refused, with the reason, when the GitHub App
# lacks Checks: read.
mutation SetAutoDeployTrigger($id: String!, $trigger: String!) {
  setAutoDeployTrigger(id: $id, trigger: $trigger) {
    id
    autoDeploy
    autoDeployTrigger
  }
}
