# setAutoDeploy is Render's Auto-Deploy toggle (w2/m9): whether a signed git push
# to the tracked branch redeploys the App (spec.autoDeploy). Backs the Settings
# tab's Build & Deploy section (backend/internal/apps/graphql.go). It does not
# itself redeploy — it changes future push behavior.
mutation SetAutoDeploy($id: String!, $enabled: Boolean!) {
  setAutoDeploy(id: $id, enabled: $enabled) {
    id
    autoDeploy
  }
}
