# setServiceIpAllowList replaces the inbound IP allowlist for a web service or
# static site. Entries preserve Render's CIDR + description pair; an empty
# entries array clears the allowlist (open to all source IPs).
mutation SetServiceIpAllowList(
  $id: String!
  $entries: [IPAllowListEntryInput!]
) {
  setServiceIpAllowList(id: $id, entries: $entries) {
    id
    ipAllowListEntries {
      cidrBlock
      description
    }
    # The save is accepted either way; this names the Cloudflare-proxied
    # custom domains it cannot filter (w1/m171) and refreshes the cached
    # service so the Networking card's notice follows the new list.
    ipAllowListProxiedDomains
  }
}
