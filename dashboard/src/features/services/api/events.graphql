# serviceEvents returns a flat [ServiceEvent] (no cursor/events envelope) —
# each event carries its OWN cursor (backend/internal/events/graphql.go).
# ServiceEventDetails has no image/rollbackTarget/message fields and its
# `trigger` is the Trigger object (boolean flags), not a plain string — a
# different shape from Deploy.trigger (a plain string) the mutations below
# return.
query ServiceEvents($serviceId: String!, $cursor: String, $limit: Int) {
  serviceEvents(serviceId: $serviceId, cursor: $cursor, limit: $limit) {
    id
    type
    timestamp
    cursor
    details {
      deployStatus
      actor
      triggeredByUser
      trigger {
        firstBuild
        envUpdated
        manual
        deployedByRender
        clearCache
        rollback
      }
    }
  }
}

mutation TriggerDeploy($serviceId: String!) {
  triggerDeploy(serviceId: $serviceId) {
    id
    status
    createdAt
    trigger
    rollbackOf
    image
  }
}

mutation CancelDeploy($serviceId: String!, $deployId: String!) {
  cancelDeploy(serviceId: $serviceId, deployId: $deployId) {
    id
    status
  }
}

mutation RollbackService($serviceId: String!, $deployId: String!) {
  rollbackService(serviceId: $serviceId, deployId: $deployId) {
    id
    status
    createdAt
    trigger
    rollbackOf
    image
  }
}
