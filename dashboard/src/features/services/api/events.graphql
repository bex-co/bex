# serviceEvents returns a flat [ServiceEvent] (no cursor/events envelope) —
# each event carries its OWN cursor (backend/internal/events/graphql.go).
# Deploy links/actions use details.deployId: ServiceEvent.id is an evt-… id and
# must never be treated as a deploy id.
query ServiceEvents(
  $serviceId: String!
  $startTime: String!
  $endTime: String!
  $cursor: String
  $limit: Int
) {
  serviceEvents(
    serviceId: $serviceId
    startTime: $startTime
    endTime: $endTime
    cursor: $cursor
    limit: $limit
  ) {
    id
    type
    timestamp
    cursor
    details {
      deployId
      deployStatus
      # preDeployStatus is the deploy's pre-deploy step outcome (w1/m33):
      # running | succeeded | failed; empty when no pre-deploy step ran.
      preDeployStatus
      # status is a lifecycle-step event's terminal outcome (w7/m66):
      # build_ended | pre_deploy_ended | job_run_ended → succeeded|failed|canceled.
      status
      actor
      triggeredByUser
      # Deploy enrichment (w1/m47): image, commit info, timing for dashboard display
      image
      commitId
      commitMessage
      startedAt
      finishedAt
      reasonCode
      instanceId
      fromCount
      toCount
      branchFrom
      branchTo
      commitUrl
      trigger {
        firstBuild
        envUpdated
        manual
        deployedByRender
        clearCache
        rollback
      }
    }
  }
}

mutation TriggerDeploy(
  $serviceId: String!
  $commitId: String
  $deployMode: String
  $clearCache: String
) {
  triggerDeploy(
    serviceId: $serviceId
    commitId: $commitId
    deployMode: $deployMode
    clearCache: $clearCache
  ) {
    id
    status
    createdAt
    trigger
    rollbackOf
    image
  }
}

mutation CancelDeploy($serviceId: String!, $deployId: String!) {
  cancelDeploy(serviceId: $serviceId, deployId: $deployId) {
    id
    status
  }
}

mutation RollbackService($serviceId: String!, $deployId: String!) {
  rollbackService(serviceId: $serviceId, deployId: $deployId) {
    id
    status
    createdAt
    trigger
    rollbackOf
    image
  }
}
