# server(id) is Render's dashboard query name for a single service — the same
# Render-shaped `Service` the `services` list returns (backend/internal/api/graphql.go).
# GraphQL exposes the live URL as a flat `url` field (REST nests it under
# serviceDetails.url); `phase`/`replicas`/`revision` are bex-native extras.
# `plan` (w1/m8) is null for an untiered (bare-CR) App — the Settings tab's
# Instance Type row renders an honest "not set" state for that case, not a
# fake selection (backend/internal/apps/service.go's AppView.Plan doc comment).

query Server($id: String!) {
  server(id: $id) {
    id
    name
    # slug is the globally-unique platform-host segment (Render's "slug" field;
    # bex's spec.subdomain, minted w4/m19) — distinct from name, which is only
    # workspace-unique. Read-only; the header shows it (w4/m20/t002).
    slug
    displayName
    type
    suspended
    dashboardUrl
    # region is the platform placement projected from BEX_REGION (w1/m53); shown
    # read-only in the Settings → General card, hidden when the install sets none.
    region
    url
    # publicRoutingNotice explains why an exposed service has NO url (w7/m79):
    # the platform subdomain is unavailable on this installation and no custom
    # domain is attached. Empty when the service is routed or is not the kind
    # that carries a public URL, so the header can render it unconditionally.
    publicRoutingNotice
    # internalAddress is the private-network "<slug>:<port>" sibling services
    # connect to (web/private only, empty otherwise) — Render's Connect →
    # Internal string; a private service's header shows it as its Service
    # Address instead of a dead cluster-internal url link (ADR041 D4, w9/m58).
    internalAddress
    createdAt
    # Copy-ready raw OpenSSH target, null for unsupported/free/unconfigured services.
    sshAddress
    phase
    replicas
    revision
    plan
    idleTTLSeconds
    maintenanceMode {
      enabled
      uri
    }
    # Build-from-git source (empty for an image-backed App); rootDir is
    # Render's Root Directory setting (w1/m18) — the Settings tab's
    # Build & Deploy section (w5/m13).
    repo
    branch
    # imagePath is the CONFIGURED prebuilt image (empty for a repo-backed App) —
    # the Source card shows/edits it and enables the repo↔image switch (w5/m76).
    imagePath
    rootDir
    runtime
    builder
    # buildCommand is Render's Build Command (w7/m41) — the shell command that
    # produces the build artifacts (e.g. npm run build for a static site).
    # Null/empty means the runtime default. Readable in the Build & Deploy section.
    buildCommand
    startCommand
    dockerfilePath
    # Explicit private-registry binding for prebuilt images and repository
    # Docker builds. Empty/null means no stored credential is attached.
    registryCredentialId
    # buildFilter is Render's Build Filters (w1/m34) — the glob patterns gating
    # git-push auto-deploys, read by the Build & Deploy section. Null when unset.
    buildFilter {
      paths
      ignoredPaths
    }
    # Auto-Deploy toggle (w2/m9) — whether a signed git push redeploys the App.
    autoDeploy
    # notifyOnFail is Render's per-service deploy-failure notification override
    # (w4/m21, docs/render-artifacts/notify-on-fail.md): default | notify | ignore.
    notifyOnFail
    notificationsToSend
    # renderSubdomainPolicy controls whether the platform subdomain is active
    # (enabled|disabled, Render's renderSubdomainPolicy, w7/m31).
    renderSubdomainPolicy
    # healthCheckPath is the HTTP path the ReadinessProbe pings (w1/m23/t001);
    # empty means the default "/". Only applies to web_service/private_service.
    healthCheckPath
    # Graceful window after SIGTERM before SIGKILL. Render/Kubernetes default 30;
    # only web/private/background-worker services expose it.
    maxShutdownDelaySeconds
    # preDeployCommand is Render's Pre-Deploy Command (w1/m33) — the Build &
    # Deploy section reads it; empty means no pre-deploy step.
    preDeployCommand
    # cron_job fields (null/empty for other service types)
    schedule
    command
    lastSuccessfulRunAt
    runs {
      id
      name
      startedAt
      finishedAt
      status
    }
    # static_site fields (null/empty for other service types): the published
    # output directory and its edge rules (w1/m21).
    publishPath
    routes {
      type
      source
      destination
    }
    headers {
      path
      name
      value
    }
    # Description-preserving Render allowlist entries. The legacy flat
    # ipAllowList remains in the schema for older clients.
    ipAllowList
    ipAllowListEntries {
      cidrBlock
      description
    }
    # maintenanceMode is Render's maintenanceMode object (w1/m37): takes a
    # web_service offline behind an interstitial page without suspending it.
    # Always present (never null), even when never configured.
    maintenanceMode {
      enabled
      uri
    }
  }
}
