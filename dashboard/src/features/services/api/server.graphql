# server(id) is Render's dashboard query name for a single service — the same
# Render-shaped `Service` the `services` list returns (backend/internal/api/graphql.go).
# GraphQL exposes the live URL as a flat `url` field (REST nests it under
# serviceDetails.url); `phase`/`replicas`/`revision` are bex-native extras.
# `plan` (w1/m8) is null for an untiered (bare-CR) App — the Settings tab's
# Instance Type row renders an honest "not set" state for that case, not a
# fake selection (backend/internal/apps/service.go's AppView.Plan doc comment).

query Server($id: String!) {
  server(id: $id) {
    id
    name
    # slug is the globally-unique platform-host segment (Render's "slug" field;
    # bex's spec.subdomain, minted w4/m19) — distinct from name, which is only
    # workspace-unique. Read-only; the header shows it (w4/m20/t002).
    slug
    displayName
    type
    suspended
    dashboardUrl
    url
    createdAt
    phase
    replicas
    revision
    plan
    idleTTLSeconds
    # Build-from-git source (empty for an image-backed App); rootDir is
    # Render's Root Directory setting (w1/m18) — the Settings tab's
    # Build & Deploy section (w5/m13).
    repo
    branch
    rootDir
    # buildFilter is Render's Build Filters (w1/m34) — the glob patterns gating
    # git-push auto-deploys, read by the Build & Deploy section. Null when unset.
    buildFilter {
      paths
      ignoredPaths
    }
    # Auto-Deploy toggle (w2/m9) — whether a signed git push redeploys the App.
    autoDeploy
    # notifyOnFail is Render's per-service deploy-failure notification override
    # (w4/m21, docs/render-artifacts/notify-on-fail.md): default | notify | ignore.
    notifyOnFail
    # renderSubdomainPolicy controls whether the platform subdomain is active
    # (enabled|disabled, Render's renderSubdomainPolicy, w7/m31).
    renderSubdomainPolicy
    # healthCheckPath is the HTTP path the ReadinessProbe pings (w1/m23/t001);
    # empty means the default "/". Only applies to web_service/private_service.
    healthCheckPath
    # Graceful window after SIGTERM before SIGKILL. Render/Kubernetes default 30;
    # only web/private/background-worker services expose it.
    maxShutdownDelaySeconds
    # preDeployCommand is Render's Pre-Deploy Command (w1/m33) — the Build &
    # Deploy section reads it; empty means no pre-deploy step.
    preDeployCommand
    # cron_job fields (null/empty for other service types)
    schedule
    command
    lastSuccessfulRunAt
    runs {
      id
      name
      startedAt
      finishedAt
      status
    }
    # static_site fields (null/empty for other service types): the published
    # output directory and its edge rules (w1/m21).
    publishPath
    routes {
      type
      source
      destination
    }
    headers {
      path
      name
      value
    }
  }
}
