# setImage switches a service to a prebuilt container image (Render's Update
# Source repo→image, w5/m76). The shared source verb persists spec.image and
# clears the repo/branch source (mutual exclusion); the optional
# registryCredentialId is validated against the image host. Neither this nor
# setRepo triggers a deploy — the next deploy uses the new source. REST PATCH
# `image` and MCP are the sibling surfaces (backend/internal/apps/graphql.go).
mutation SetImage(
  $id: String!
  $image: String!
  $registryCredentialId: String
) {
  setImage(id: $id, image: $image, registryCredentialId: $registryCredentialId) {
    id
    repo
    branch
    imagePath
    registryCredentialId
  }
}
