# Workspace environment groups. List/detail reads are keys/names-only; the
# dedicated per-value queries reveal sensitive data only when the user asks.

# ownerId (w6/m24): the workspace to list/create in — the dashboard always
# sends the switcher's selection so a multi-workspace caller manages the right
# workspace's groups, not just whichever workspace they resolve to implicitly.
query EnvGroupScopeIndex($ownerId: String!) {
  projects(ownerId: $ownerId) {
    ...ProjectFields
  }
  workspaceEnvironments(ownerId: $ownerId) {
    ...EnvironmentFields
  }
}

query EnvGroups($ownerId: String) {
  envGroups(ownerId: $ownerId) {
    id
    name
    ownerId
    environmentId
    createdAt
    updatedAt
    revision
    serviceLinks
    envVars {
      key
    }
    secretFiles {
      name
    }
  }
}

query EnvGroup($id: String!) {
  envGroup(id: $id) {
    id
    name
    ownerId
    environmentId
    createdAt
    updatedAt
    revision
    serviceLinks
    envVars {
      key
    }
    secretFiles {
      name
    }
  }
}

query EnvGroupVarValue($id: String!, $key: String!) {
  envGroupVar(id: $id, key: $key) {
    key
    value
  }
}

query EnvGroupSecretFileContent($id: String!, $name: String!) {
  envGroupSecretFile(id: $id, name: $name) {
    name
    content
  }
}

mutation CreateEnvGroup(
  $name: String!
  $ownerId: String
  $envVars: [EnvGroupVarInput!]
  $secretFiles: [EnvGroupSecretFileInput!]
  $serviceIds: [String!]
) {
  createEnvGroup(
    name: $name
    ownerId: $ownerId
    envVars: $envVars
    secretFiles: $secretFiles
    serviceIds: $serviceIds
  ) {
    id
    name
  }
}

mutation RenameEnvGroup($id: String!, $name: String!) {
  renameEnvGroup(id: $id, name: $name) {
    id
    name
  }
}

mutation MoveEnvGroup($id: String!, $environmentId: String!) {
  moveEnvGroup(id: $id, environmentId: $environmentId) {
    id
    environmentId
    updatedAt
  }
}

mutation CloneEnvGroup(
  $id: String!
  $name: String!
  $ownerId: String
  $environmentId: String
) {
  cloneEnvGroup(
    id: $id
    name: $name
    ownerId: $ownerId
    environmentId: $environmentId
  ) {
    id
    name
    ownerId
    environmentId
  }
}

mutation DeleteEnvGroup($id: String!) {
  deleteEnvGroup(id: $id)
}

mutation PatchEnvGroupEnvironment(
  $id: String!
  $envVars: [EnvGroupVarPatchInput!]
  $secretFiles: [EnvGroupSecretFilePatchInput!]
  $saveMode: String!
  $expectedRevision: String
) {
  patchEnvGroupEnvironment(
    id: $id
    envVars: $envVars
    secretFiles: $secretFiles
    saveMode: $saveMode
    expectedRevision: $expectedRevision
  ) {
    envVarKeys
    secretFileNames
    revision
    affectedServiceIds
    failedServiceIds
    rolledOut
  }
}

mutation SetEnvGroupVars($id: String!, $envVars: [EnvGroupVarInput!]!) {
  setEnvGroupVars(id: $id, envVars: $envVars)
}

mutation SetEnvGroupVar(
  $id: String!
  $key: String!
  $value: String
  $generateValue: Boolean
) {
  setEnvGroupVar(
    id: $id
    key: $key
    value: $value
    generateValue: $generateValue
  )
}

mutation DeleteEnvGroupVar($id: String!, $key: String!) {
  deleteEnvGroupVar(id: $id, key: $key)
}

mutation SetEnvGroupSecretFile($id: String!, $name: String!, $content: String) {
  setEnvGroupSecretFile(id: $id, name: $name, content: $content)
}

mutation DeleteEnvGroupSecretFile($id: String!, $name: String!) {
  deleteEnvGroupSecretFile(id: $id, name: $name)
}

mutation LinkEnvGroup($id: String!, $serviceId: String!) {
  linkEnvGroup(id: $id, serviceId: $serviceId)
}

mutation UnlinkEnvGroup($id: String!, $serviceId: String!) {
  unlinkEnvGroup(id: $id, serviceId: $serviceId)
}
