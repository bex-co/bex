# bex-api's workspace-lifecycle surface (backend/internal/workspaces/graphql.go,
# w6/m1): `workspaces` lists the caller's workspaces (the switcher's data
# source); create/rename/delete are dashboard-only (Render exposes no REST
# workspace-mutation API — w6/RESEARCH-workspaces.md finding 9). `deleteWorkspace`
# returns the deleted workspace's id (a Render-dashboard-mutation convention),
# not a bare boolean, so a caller can react to which workspace just disappeared.

query Workspaces {
  workspaces {
    id
    name
    slug
    plan
    role
    createdAt
    # Workspace Settings -> Two-factor authentication (w22/m402). Readable by
    # every member, and the list is exempt from enforcement, so a blocked member
    # can still read it.
    requireTwoFactor
  }
}

mutation CreateWorkspace($name: String!, $plan: String) {
  createWorkspace(name: $name, plan: $plan) {
    id
    name
    slug
    plan
    role
    createdAt
    requireTwoFactor
  }
}

query WorkspaceCreationPolicy($plan: String!) {
  workspaceCreationPolicy(plan: $plan) {
    mode
    paymentRequired
    providerAvailable
  }
}

query WorkspaceCreationAttempt($id: String!) {
  workspaceCreationAttempt(id: $id) {
    id
    name
    plan
    billingEmail
    paymentRequired
    state
    clientSecret
    publishableKey
  }
}

mutation PrepareWorkspaceCreation(
  $name: String!
  $plan: String!
  $billingEmail: String!
  $attemptId: String
  $collectPaymentMethod: Boolean
) {
  prepareWorkspaceCreation(
    name: $name
    plan: $plan
    billingEmail: $billingEmail
    attemptId: $attemptId
    collectPaymentMethod: $collectPaymentMethod
  ) {
    id
    name
    plan
    billingEmail
    paymentRequired
    state
    clientSecret
    publishableKey
  }
}

mutation FinalizeWorkspaceCreation($attemptId: String!) {
  finalizeWorkspaceCreation(attemptId: $attemptId) {
    id
    name
    slug
    plan
    role
    createdAt
    requireTwoFactor
  }
}

mutation CancelWorkspaceCreation($attemptId: String!) {
  cancelWorkspaceCreation(attemptId: $attemptId)
}

mutation RenameWorkspace($id: String!, $name: String!) {
  renameWorkspace(id: $id, name: $name) {
    id
    name
    slug
    plan
    role
    createdAt
    requireTwoFactor
  }
}

mutation ChangeWorkspacePlan($id: String!, $plan: String!) {
  changeWorkspacePlan(id: $id, plan: $plan) {
    id
    name
    plan
    role
    createdAt
  }
}

mutation DeleteWorkspace($id: String!, $confirmation: String!) {
  deleteWorkspace(id: $id, confirmation: $confirmation)
}

# The workspace's inbound IP rules (w9/m388, Render's owner.ipAllowList): what
# an Admin saved, or Render's seeded allow-all pair when nobody did; an empty
# list is deny-all. Read only by the Workspace Settings card, never by the
# polled `Workspaces` list (bex-api resolves the field only when selected).
query WorkspaceIPAllowList($id: String!) {
  workspace(id: $id) {
    id
    ipAllowList {
      cidrBlock
      description
    }
  }
}

# Full-replaces the workspace's inbound IP rules (w9/m388): Admin only, and
# below Scale only the stored list or the allow-all pair is accepted
# (PLAN_FEATURE_REQUIRED, feature inboundIPRules). The returned list is what
# bex-api saved, which the normalized Workspace entity picks up.
mutation SetWorkspaceIPAllowList(
  $id: String!
  $ipAllowList: [IPAllowListEntryInput!]!
) {
  setWorkspaceIPAllowList(id: $id, ipAllowList: $ipAllowList) {
    id
    ipAllowList {
      cidrBlock
      description
    }
  }
}

# Workspace Settings -> Two-factor authentication (w22/m402, docs/ADR012-auth.md
# 9a). Admin-only; the argument is a String!, not an ID!. The mutation can refuse
# with the coded 409s WORKSPACE_2FA_ADMIN_NOT_ENROLLED and
# WORKSPACE_2FA_UNAVAILABLE.
mutation SetWorkspaceRequireTwoFactor(
  $workspaceId: String!
  $enabled: Boolean!
) {
  setWorkspaceRequireTwoFactor(workspaceId: $workspaceId, enabled: $enabled) {
    id
    requireTwoFactor
  }
}
