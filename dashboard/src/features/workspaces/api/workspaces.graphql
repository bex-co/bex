# bex-api's workspace-lifecycle surface (backend/internal/workspaces/graphql.go,
# w6/m1): `workspaces` lists the caller's workspaces (the switcher's data
# source); create/rename/delete are dashboard-only (Render exposes no REST
# workspace-mutation API — w6/RESEARCH-workspaces.md finding 9). `deleteWorkspace`
# returns the deleted workspace's id (a Render-dashboard-mutation convention),
# not a bare boolean, so a caller can react to which workspace just disappeared.

query Workspaces {
  workspaces {
    id
    name
    slug
    plan
    role
    createdAt
    # Workspace Settings -> Two-factor authentication (w22/m402) and Google
    # login (w7/m465). Readable by every member, and the list is exempt from
    # enforcement, so a blocked member can still read them.
    requireTwoFactor
    requireGoogleLogin
    # The org the workspace belongs to (w7/m464, ADR115): null, false and
    # null for a standalone workspace. The switcher groups by it; plan
    # surfaces read primary. The org's login settings (w7/m466) lock the
    # workspace's own 2FA and Google login switches on while they are on.
    organization {
      id
      name
      primaryWorkspaceId
      requireTwoFactor
      requireGoogleLogin
    }
    primary
    privacy
    # The workspace's uploaded avatar (w1/m648): the switcher and Workspace
    # Settings show it, else the monogram of its name.
    avatarDownload {
      url
    }
  }
}

mutation CreateWorkspace($name: String!, $plan: String) {
  createWorkspace(name: $name, plan: $plan) {
    id
    name
    slug
    plan
    role
    createdAt
    requireTwoFactor
    requireGoogleLogin
    organization {
      id
      name
      primaryWorkspaceId
      requireTwoFactor
      requireGoogleLogin
    }
    primary
    privacy
  }
}

query WorkspaceCreationPolicy($plan: String!) {
  workspaceCreationPolicy(plan: $plan) {
    mode
    paymentRequired
    providerAvailable
  }
}

query WorkspaceCreationAttempt($id: String!) {
  workspaceCreationAttempt(id: $id) {
    id
    name
    plan
    billingEmail
    paymentRequired
    state
    clientSecret
    publishableKey
  }
}

mutation PrepareWorkspaceCreation(
  $name: String!
  $plan: String!
  $billingEmail: String!
  $attemptId: String
  $collectPaymentMethod: Boolean
) {
  prepareWorkspaceCreation(
    name: $name
    plan: $plan
    billingEmail: $billingEmail
    attemptId: $attemptId
    collectPaymentMethod: $collectPaymentMethod
  ) {
    id
    name
    plan
    billingEmail
    paymentRequired
    state
    clientSecret
    publishableKey
  }
}

mutation FinalizeWorkspaceCreation($attemptId: String!) {
  finalizeWorkspaceCreation(attemptId: $attemptId) {
    id
    name
    slug
    plan
    role
    createdAt
    requireTwoFactor
    requireGoogleLogin
    organization {
      id
      name
      primaryWorkspaceId
      requireTwoFactor
      requireGoogleLogin
    }
    primary
    privacy
  }
}

mutation CancelWorkspaceCreation($attemptId: String!) {
  cancelWorkspaceCreation(attemptId: $attemptId)
}

mutation RenameWorkspace($id: String!, $name: String!) {
  renameWorkspace(id: $id, name: $name) {
    id
    name
    slug
    plan
    role
    createdAt
    requireTwoFactor
    requireGoogleLogin
  }
}

mutation ChangeWorkspacePlan($id: String!, $plan: String!) {
  changeWorkspacePlan(id: $id, plan: $plan) {
    id
    name
    plan
    role
    createdAt
  }
}

mutation DeleteWorkspace($id: String!, $confirmation: String!) {
  deleteWorkspace(id: $id, confirmation: $confirmation)
}

# The workspace's inbound IP rules (w9/m388, Render's owner.ipAllowList): what
# an Admin saved, or Render's seeded allow-all pair when nobody did; an empty
# list is deny-all. Read only by the Workspace Settings card, never by the
# polled `Workspaces` list (bex-api resolves the field only when selected).
query WorkspaceIPAllowList($id: String!) {
  workspace(id: $id) {
    id
    ipAllowList {
      cidrBlock
      description
    }
  }
}

# Full-replaces the workspace's inbound IP rules (w9/m388): Admin only, and
# below Scale only the stored list or the allow-all pair is accepted
# (PLAN_FEATURE_REQUIRED, feature inboundIPRules). The returned list is what
# bex-api saved, which the normalized Workspace entity picks up.
mutation SetWorkspaceIPAllowList(
  $id: String!
  $ipAllowList: [IPAllowListEntryInput!]!
) {
  setWorkspaceIPAllowList(id: $id, ipAllowList: $ipAllowList) {
    id
    ipAllowList {
      cidrBlock
      description
    }
  }
}

# Workspace Settings -> Two-factor authentication (w22/m402, docs/ADR012-auth.md
# 9a). Admin-only; the argument is a String!, not an ID!. The mutation can refuse
# with the coded 409s WORKSPACE_2FA_ADMIN_NOT_ENROLLED and
# WORKSPACE_2FA_UNAVAILABLE.
mutation SetWorkspaceRequireTwoFactor(
  $workspaceId: String!
  $enabled: Boolean!
) {
  setWorkspaceRequireTwoFactor(workspaceId: $workspaceId, enabled: $enabled) {
    id
    requireTwoFactor
  }
}

# Workspace Settings -> Google login (w7/m465, docs/ADR012-auth.md 9b): Render's
# "Enforce Google login". Admin-only, Pro plan or higher. The mutation can
# refuse with the coded 409s WORKSPACE_GOOGLE_LOGIN_ADMIN_NOT_SIGNED_IN and
# WORKSPACE_GOOGLE_LOGIN_UNAVAILABLE, and below Pro with PLAN_FEATURE_REQUIRED.
mutation SetWorkspaceRequireGoogleLogin(
  $workspaceId: String!
  $enabled: Boolean!
) {
  setWorkspaceRequireGoogleLogin(workspaceId: $workspaceId, enabled: $enabled) {
    id
    requireGoogleLogin
  }
}

# The confirmation before an admin turns a login requirement on (w7/m471,
# docs/ADR012-auth.md 9c): who it would block in the workspace, with what the
# workspace already requires, by the enforcement gate's own checks. Admin
# only. A lookup that cannot answer refuses the read; it never answers empty.
query WorkspaceLoginRequirementImpact(
  $workspaceId: String!
  $requirement: LoginRequirement!
) {
  workspaceLoginRequirementImpact(
    workspaceId: $workspaceId
    requirement: $requirement
  ) {
    members {
      userId
      email
      name
      losesAccess
      apiKeys {
        id
        name
      }
      sshKeys {
        id
        name
        fingerprint
      }
    }
    unattributedApiKeys {
      id
      name
    }
  }
}

# Once a login requirement is enforced (w1/m647): the members who do not meet
# it right now, by the enforcement gate's own check of that requirement alone.
# Admin only. A lookup that cannot answer refuses the read; it never answers
# empty.
query WorkspaceNonCompliantMembers(
  $workspaceId: String!
  $requirement: LoginRequirement!
) {
  workspaceNonCompliantMembers(
    workspaceId: $workspaceId
    requirement: $requirement
  ) {
    userId
    email
    name
  }
}

# Render's Send reminders (w1/m647): emails each member without 2FA a
# reminder. Admin only; once per workspace per UTC day, the batch turning 2FA
# on included (429 WORKSPACE_2FA_REMINDER_LIMIT). Answers how many were sent.
mutation SendWorkspaceTwoFactorReminders($workspaceId: String!) {
  sendWorkspaceTwoFactorReminders(workspaceId: $workspaceId)
}

# Workspace Settings → Overlapping Deploy Policy (w4/653): "wait" (Render's
# default for workspaces created on or after 2025-07-14) or "override". Every
# member reads it; only an Admin sets it. GraphQL-only, as on Render.
query WorkspaceOverlappingDeployPolicy($id: String!) {
  workspace(id: $id) {
    id
    overlappingDeployPolicy
  }
}

mutation SetWorkspaceOverlappingDeployPolicy($id: String!, $policy: String!) {
  setWorkspaceOverlappingDeployPolicy(id: $id, policy: $policy) {
    id
    overlappingDeployPolicy
  }
}
