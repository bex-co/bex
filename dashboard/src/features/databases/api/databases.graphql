# bex-api's managed-Postgres surface, Render dashboard-shaped
# (backend/internal/postgres/graphql.go, docs/ADR006-bex-api.md §Managed Postgres).
# Render's dashboard GraphQL noun is `database` (its REST noun is `postgres`);
# bex mirrors that split. `status` is Render's databaseStatus enum
# (available/unavailable/creating); `suspended` is the string enum shared with
# services; `plan` is the Database CRD's spec.plan spelling (the
# databaseInstanceTypes id). `databaseName`/`databaseUser` are the normalized
# unquoted-identifier db + owner role (list omits them; the detail query reads them).

# ownerId scopes the list to one workspace (w6/m2/t004's REST/GraphQL filter) —
# the dashboard's workspace switcher (w6/m3) passes the selected workspace's id;
# omitted, bex-api falls back to the caller's default workspace.
query Databases($ownerId: String) {
  databases(ownerId: $ownerId) {
    id
    name
    plan
    version
    status
    diskSizeGB
    diskAutoscalingEnabled
    suspended
    createdAt
    updatedAt
    region
    public
  }
}

query Database($id: String!) {
  database(id: $id) {
    id
    name
    plan
    version
    status
    databaseName
    databaseUser
    diskSizeGB
    diskAutoscalingEnabled
    highAvailabilityEnabled
    readReplicas {
      name
      connectionInfo {
        internalHost
        externalHost
      }
    }
    suspended
    createdAt
    updatedAt
    externalHost
    public
    poolerEnabled
    backupsEnabled
    ipAllowList
    region
  }
}

# The one place the DB password is surfaced (docs/ADR006-bex-api.md §Managed Postgres):
# fetched on demand from the detail page's "Reveal", never in the bulk list and
# never on page load. Returns the Render-shaped `PostgresConnectionInfo`.
query DatabaseConnectionInfo($id: String!) {
  databaseConnectionInfo(id: $id) {
    password
    internalConnectionString
    externalConnectionString
    internalConnectionPoolString
    externalConnectionPoolString
    psqlCommand
    serverCaCertificate
    readReplicaConnectionStrings {
      name
      internalConnectionString
      externalConnectionString
    }
  }
}

# The pooled-connection subset of connection info (PgBouncer surface): read on
# its own so the pooler panel never fetches the password-bearing fields above.
query DatabasePooledConnection($id: String!) {
  databaseConnectionInfo(id: $id) {
    internalConnectionPoolString
    externalConnectionPoolString
  }
}

# --- advanced managed-Postgres surface (w1/m17) ---

query DatabaseRecoveryInfo($id: String!) {
  databaseRecoveryInfo(id: $id) {
    enabled
    earliestRecoveryTime
    latestRecoveryTime
    backups {
      id
      status
      createdAt
    }
  }
}

query DatabaseExports($id: String!) {
  databaseExports(id: $id) {
    id
    status
    createdAt
    url
    urlExpiresAt
    expiresAt
    filename
    failureReason
  }
}

query DatabaseUsers($id: String!) {
  databaseUsers(id: $id) {
    name
  }
}

# Entries carry a per-entry description alongside the CIDR (w4/m24) — the
# editor round-trips both, so the label a human gave an entry survives edits.
query DatabaseIpAllowList($id: String!) {
  database(id: $id) {
    id
    ipAllowListEntries {
      cidrBlock
      description
    }
  }
}

mutation FailoverDatabase($id: String!) {
  failoverDatabase(id: $id)
}

mutation SuspendDatabase($id: String!, $confirm: String) {
  suspendDatabase(id: $id, confirm: $confirm) {
    id
    suspended
    status
  }
}

mutation ResumeDatabase($id: String!) {
  resumeDatabase(id: $id) {
    id
    suspended
    status
  }
}

mutation RestartDatabase($id: String!) {
  restartDatabase(id: $id) {
    id
    suspended
    status
  }
}

mutation RecoverDatabase(
  $id: String!
  $name: String!
  $targetTime: String
  $plan: String
  $version: String
) {
  recoverDatabase(
    id: $id
    name: $name
    targetTime: $targetTime
    plan: $plan
    version: $version
  ) {
    id
    name
    plan
    status
  }
}

mutation CreateDatabaseExport($id: String!) {
  createDatabaseExport(id: $id) {
    id
    status
    createdAt
    url
    urlExpiresAt
    expiresAt
    filename
    failureReason
  }
}

mutation SetDatabaseIpAllowList(
  $id: String!
  $entries: [IPAllowListEntryInput!]
) {
  setDatabaseIpAllowList(id: $id, entries: $entries) {
    id
    ipAllowListEntries {
      cidrBlock
      description
    }
  }
}

mutation CreateDatabaseUser($id: String!, $name: String!) {
  createDatabaseUser(id: $id, name: $name) {
    name
    password
  }
}

mutation DeleteDatabaseUser($id: String!, $name: String!) {
  deleteDatabaseUser(id: $id, name: $name)
}

# The create dialog's plan-picker source (w5/m8): the shared lego/types/tiers
# Postgres family, read live — never a hardcoded ladder in the frontend.
query DatabaseInstanceTypes {
  databaseInstanceTypes {
    id
    name
    cpu
    memory
    storageGB
  }
}

# `ownerId` (w6/m14) names the workspace to create the database in — the switcher's
# selection, mirroring the `databases` list query. Omitted => the caller's default
# (oldest) workspace; a workspace the caller isn't a member of => forbidden.
mutation CreateDatabase(
  $name: String!
  $databaseName: String
  $databaseUser: String
  $ownerId: String
  $environmentId: String
  $plan: String
  $version: String
  $diskSizeGB: Int
  $public: Boolean
) {
  createDatabase(
    name: $name
    databaseName: $databaseName
    databaseUser: $databaseUser
    ownerId: $ownerId
    environmentId: $environmentId
    plan: $plan
    version: $version
    diskSizeGB: $diskSizeGB
    public: $public
  ) {
    id
    name
    databaseName
    databaseUser
    plan
    status
    projectId
    environmentId
  }
}

mutation UpdateDatabasePlan($id: String!, $plan: String!) {
  updateDatabasePlan(id: $id, plan: $plan) {
    id
    name
    plan
    status
  }
}

mutation UpdateDatabaseVersion($id: String!, $version: String!) {
  updateDatabaseVersion(id: $id, version: $version) {
    id
    version
    status
  }
}

mutation UpdateDatabaseDiskAutoscaling($id: String!, $enabled: Boolean!) {
  updateDatabaseDiskAutoscaling(id: $id, enabled: $enabled) {
    id
    diskSizeGB
    diskAutoscalingEnabled
  }
}

mutation RenameDatabase($id: String!, $name: String!) {
  renameDatabase(id: $id, name: $name) {
    id
    name
    databaseName
    databaseUser
    externalHost
  }
}

mutation DeleteDatabase($id: String!, $confirm: String) {
  deleteDatabase(id: $id, confirm: $confirm)
}

# --- Postgres observability (w2/m25) ---

query DatabaseProcesses($id: String!) {
  databaseProcesses(id: $id) {
    pid
    userName
    applicationName
    state
    query
    waitEventType
    waitEvent
    durationSeconds
  }
}

query DatabaseTopQueries($id: String!) {
  databaseTopQueries(id: $id) {
    query
    calls
    totalTimeMs
    meanTimeMs
    rows
    sharedHitBlks
    sharedReadBlks
  }
}

query DatabaseSizes($id: String!) {
  databaseSizes(id: $id) {
    database {
      name
      sizeBytes
      sizePretty
    }
    tables {
      schema
      name
      sizeBytes
      sizePretty
    }
  }
}

query DatabaseTableScans($id: String!) {
  databaseTableScans(id: $id) {
    schema
    name
    seqScans
    seqScanRows
    indexScans
    indexScanRows
    liveRows
    deadRows
  }
}

query DatabaseParameterOverrides($id: String!) {
  databaseParameterOverrides(id: $id) {
    name
    setting
    unit
    source
    description
  }
}

# The DECLARED overrides — what this database sets, and what a write replaces.
# DatabaseParameterOverrides above is the observed pg_settings config and is
# mostly the operator's, so it is a read-only diagnostic, never editor state
# (w6/m133).
query DatabaseParameterSpec($id: String!) {
  databaseParameterSpec(id: $id) {
    name
    value
  }
}

mutation SetDatabaseParameterOverrides(
  $id: String!
  $parameters: [ParameterInput!]
) {
  setDatabaseParameterOverrides(id: $id, parameters: $parameters) {
    id
    name
  }
}

# bex dashboard extension: SELECT/SHOW/EXPLAIN use the same read-only path as
# query_render_postgres. The console only sends allowWrites=true after an
# explicit destructive-query confirmation; the backend then requires can_create.
mutation ExecuteDatabaseQuery(
  $id: String!
  $sql: String!
  $allowWrites: Boolean
) {
  executeDatabaseQuery(id: $id, sql: $sql, allowWrites: $allowWrites) {
    columns
    rows {
      values
    }
    rowCount
    truncated
  }
}
