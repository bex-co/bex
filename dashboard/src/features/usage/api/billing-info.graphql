# A workspace's billing info (w6/m628): the company name, address and VAT or
# tax ID its invoices carry, as on Render's Billing page ("add additional
# billing info to be displayed on all invoices"). billTo is the name invoices
# print: the company name when set, else the workspace's name. customerReady is
# false until a payment method was first added; a write then answers
# BILLING_CUSTOMER_NOT_READY. Read by Admin, Developer and Billing; set by
# Admin and Billing. The write replaces all three parts: an empty company name
# bills the workspace's name again, an omitted address or tax ID removes it,
# and a refused field answers BILLING_INFO_INVALID naming it (params.field).
fragment WorkspaceBillingInfoFields on WorkspaceBillingInfo {
  workspaceId
  customerReady
  billTo
  companyName
  address {
    line1
    line2
    city
    state
    postalCode
    country
  }
  taxId {
    type
    value
  }
}

query WorkspaceBillingInfo($workspaceId: String!) {
  workspaceBillingInfo(workspaceId: $workspaceId) {
    ...WorkspaceBillingInfoFields
  }
}

mutation SetWorkspaceBillingInfo(
  $workspaceId: String!
  $companyName: String
  $address: BillingAddressInput
  $taxId: BillingTaxIdInput
) {
  setWorkspaceBillingInfo(
    workspaceId: $workspaceId
    companyName: $companyName
    address: $address
    taxId: $taxId
  ) {
    ...WorkspaceBillingInfoFields
  }
}
