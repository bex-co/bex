# Workspace-scoped usage (bex extension, no Render equivalent).
# Four kinds: instance_seconds (compute), egress_bytes (bandwidth),
# build_seconds (CI/build), and storage_gb_seconds (managed datastore storage).
# resourceKind distinguishes App services from managed Postgres/KeyValue instances.
# period: optional calendar month YYYY-MM; defaults to the current month.
# ownerId: workspace to query (w6/m18); the dashboard always sends the
# switcher's selection so multi-workspace callers see the right workspace's
# usage, not just whichever workspace they resolve to implicitly.
# estimatedCost: USD estimate (30% below Render on compute/Postgres/KV/build/
# Postgres storage, 90% below on bandwidth). Estimate only — not an invoice.
query Usage($period: String, $ownerId: String) {
  usage(period: $period, ownerId: $ownerId) {
    workspaceId
    period
    services {
      serviceId
      serviceName
      resourceKind
      rows {
        kind
        tier
        total
      }
    }
    estimatedCost {
      totalUsd
      meters {
        kind
        tier
        resourceKind
        costUsd
      }
    }
    # billing: real Stripe invoice preview + finalized invoices (m48/m50). null
    # when no subscription exists, Mode-A excluded, billing off, or degraded.
    billing {
      currentCost {
        amountUsd
        currency
        periodStart
        periodEnd
      }
      invoices {
        id
        status
        amountUsd
        currency
        periodStart
        periodEnd
      }
    }
  }
}

# Creation-count caps are independent of metered usage, but belong on the same
# workspace Usage page so a human can see both consumption and remaining
# capacity before a create call is rejected.
query WorkspaceLimits($ownerId: String!) {
  workspaceLimits(ownerId: $ownerId) {
    services {
      used
      limit
    }
    postgres {
      used
      limit
    }
    keyValues {
      used
      limit
    }
  }
}

# Workspace-admin customer billing onboarding. Stripe-hosted URLs are created
# server-side; no Stripe server credential or payment detail reaches this app.
query BillingReadiness($workspaceId: String!) {
  workspaceBillingReadiness(workspaceId: $workspaceId) {
    workspaceId
    mode
    customerReady
    subscriptionReady
    paymentMethodReady
    tax {
      configured
      enabled
      reason
      productTaxCode
      taxBehavior
      registrationCount
    }
  }
}

mutation CreateBillingCheckoutSession(
  $workspaceId: String!
  $successUrl: String!
  $cancelUrl: String!
) {
  createBillingCheckoutSession(
    workspaceId: $workspaceId
    successUrl: $successUrl
    cancelUrl: $cancelUrl
  ) {
    url
    expiresAt
  }
}

mutation CreateBillingPortalSession(
  $workspaceId: String!
  $returnUrl: String!
) {
  createBillingPortalSession(workspaceId: $workspaceId, returnUrl: $returnUrl) {
    url
    expiresAt
  }
}
