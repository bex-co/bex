# Workspace-scoped usage (bex extension, no Render equivalent).
# Four kinds: instance_seconds (compute), egress_bytes (bandwidth),
# build_seconds (CI/build), and storage_gb_seconds (managed datastore storage).
# resourceKind distinguishes App services from managed Postgres/KeyValue instances.
# period: optional calendar month YYYY-MM; defaults to the current month.
# estimatedCost: USD estimate (30% below Render on compute/Postgres/KV/build/
# Postgres storage, 90% below on bandwidth). Estimate only — not an invoice.
query Usage($period: String) {
  usage(period: $period) {
    workspaceId
    period
    services {
      serviceId
      resourceKind
      rows {
        kind
        tier
        total
      }
    }
    estimatedCost {
      totalUsd
      meters {
        kind
        tier
        resourceKind
        costUsd
      }
    }
  }
}
