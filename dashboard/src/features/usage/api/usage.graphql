# Workspace-scoped usage (bex extension, no Render equivalent).
# Kinds: instance_seconds (compute), egress_bytes (bandwidth),
# build_seconds (CI/build), storage_gb_seconds (managed datastore storage),
# sandbox_compute_seconds (weighted hosted-sandbox compute: every sandbox
# before estimatedCost.sandboxUsageBilledFrom, an agent session's sandbox
# after), sandbox_cpu_seconds (the CPU a running sandbox used) and
# sandbox_memory_gb_seconds (the memory it was allocated), which replace the
# weighted charge from that instant (w22/m314; what was recorded before it is
# an `unbilled` line), sandbox_snapshot_gb_seconds (the image a suspended
# sandbox retains), and the object storage meters
# (object_storage_gb_seconds, object_storage_ingress_bytes and
# object_storage_egress_bytes, shown at $0 until Render publishes a price).
# resourceKind distinguishes App services, managed Postgres/KeyValue instances,
# hosted sandboxes and a workspace's object storage.
# period: optional calendar month YYYY-MM; defaults to the current month.
# ownerId: workspace to query (w6/m18); the dashboard always sends the
# switcher's selection so multi-workspace callers see the right workspace's
# usage, not just whichever workspace they resolve to implicitly.
# estimatedCost: USD estimate (30% below Render on compute/Postgres/KV/build/
# Postgres storage, 90% below on bandwidth). Estimate only — not an invoice.
query Usage($period: String, $ownerId: String) {
  usage(period: $period, ownerId: $ownerId) {
    workspaceId
    period
    # coverage: how complete/degraded the metering behind estimatedCost is
    # (ADR040 — failures degrade to estimate-only rather than 500). state is
    # complete | partial | unknown; `through` bounds a partial estimate and
    # degradedSources names the unhealthy meters, so the page can caveat a
    # money figure built on incomplete data (w4/048).
    coverage {
      state
      through
      degradedSources
    }
    # freeInstanceHours: Render's "Monthly included usage" for Free web
    # services — hours used against the workspace's monthly allowance (750).
    freeInstanceHours {
      used
      included
    }
    # buildMinutes: the month's build minutes against the build minutes the
    # workspace plan includes (w6/m308); only those above are charged.
    buildMinutes {
      used
      included
    }
    # includedBandwidth: the month's outbound bandwidth in GB against the
    # bandwidth the workspace plan includes (w6/m319); only the GB above it
    # are charged.
    includedBandwidth {
      used
      included
    }
    # customDomains: the verified custom domains now against the count the
    # workspace plan includes (w7/m429; bex-api's core.IncludedCustomDomains),
    # unlimited on Enterprise. Each one above it is charged per domain-month (the
    # custom_domain_seconds charge line); none is refused for the count. null
    # for a past period and where no plan applies.
    customDomains {
      used
      included
      unlimited
    }
    # agentModel: the period's platform-route agent model spend (ADR091 D6),
    # billed at the model provider's cost + 30%, by model and token kind.
    agentModel {
      monthToDateUsd
      models {
        model
        costUsd
        inputTokens
        outputTokens
        cacheReadTokens
        cacheWriteTokens
      }
    }
    estimatedCost {
      totalUsd
      # sandboxUsageBilledFrom: the RFC 3339 instant from which a running
      # sandbox is billed for used CPU and allocated memory instead of the
      # weighted sandbox compute charge (w22/m314); empty when the period has
      # no sandbox usage.
      sandboxUsageBilledFrom
      # agentSandboxUsageBilledFrom: the instant from which an agent session's
      # sandbox is billed the same way; before it, it kept the weighted charge
      # (w6/m566). Empty when sandboxUsageBilledFrom is.
      agentSandboxUsageBilledFrom
      # resources is the same total grouped by the resource that incurred it,
      # each with the charge lines behind it (rate x quantity = cost, all in
      # one display unit). This is what the billing page's charge tree renders;
      # `meters` aggregates every resource together and cannot answer "which
      # service costs me money".
      resources {
        serviceId
        serviceName
        # deleted: the resource is gone but bex retained the name its charges
        # accrued under (w2/m96). serviceName empty + deleted false is a
        # pre-retention row that has no name at all.
        deleted
        resourceKind
        costUsd
        charges {
          kind
          tier
          unit
          rateUsd
          quantity
          # included: the part of quantity the plan's included build minutes
          # covered; costUsd prices only the rest.
          included
          costUsd
          # unbilled: sandbox CPU or memory recorded before
          # sandboxUsageBilledFrom, shown at a rate of 0 because the sandbox
          # compute line charged for those hours.
          unbilled
        }
      }
    }
    # billing: real Stripe invoice preview + finalized invoices (m48/m50). null
    # when no subscription exists, Mode-A excluded, billing off, or degraded.
    billing {
      # amountUsd is the gross rated charge; creditsAppliedUsd is what credit
      # took off it and amountDueUsd what Stripe actually collects (w6/m98).
      currentCost {
        amountUsd
        creditsAppliedUsd
        amountDueUsd
        currency
        periodStart
        periodEnd
      }
      # hostedInvoiceUrl and invoicePdfUrl: Stripe's hosted invoice page (Pay
      # Now on an open invoice) and its PDF (Download PDF); null where Stripe
      # gives none (w6/m625).
      invoices {
        id
        status
        kind
        amountUsd
        creditsAppliedUsd
        amountDueUsd
        currency
        periodStart
        periodEnd
        hostedInvoiceUrl
        invoicePdfUrl
      }
      # credits: remaining Stripe billing-credit balance (w5/m70). Absent when
      # zero or the read degrades; never derived from the invoice preview.
      credits {
        availableUsd
        currency
        grants {
          name
          remainingUsd
          expiresAt
        }
      }
    }
  }
}

# Creation-count caps are independent of metered usage, but belong on the same
# workspace Usage page so a human can see both consumption and remaining
# capacity before a create call is rejected.
# `used` counts every resource that still holds quota, including ones finishing
# deletion; `terminating` is how many of `used` are mid-deletion — the count that
# reconciles this figure with the (shorter) resource list, which drops those rows
# but whose quota they still consume (w6/m129).
query WorkspaceLimits($ownerId: String!) {
  workspaceLimits(ownerId: $ownerId) {
    services {
      used
      terminating
      limit
    }
    postgres {
      used
      terminating
      limit
      freeUsed
      freeLimit
    }
    keyValues {
      used
      terminating
      limit
      freeUsed
      freeLimit
    }
  }
}

# Workspace-admin customer billing onboarding. Stripe-hosted URLs are created
# server-side; no Stripe server credential or payment detail reaches this app.
query BillingReadiness($workspaceId: String!) {
  workspaceBillingReadiness(workspaceId: $workspaceId) {
    workspaceId
    mode
    customerReady
    subscriptionReady
    paymentMethodReady
    # brand/last4 of the card Stripe will charge, so the billing page can name
    # it ("Visa ending in 4242") instead of only reporting that one exists.
    # Empty for a non-card method or an unexpanded read — fall back to the flag.
    paymentMethodBrand
    paymentMethodLast4
    paymentMethodRequired
    # The sign-up wall's one input (features/onboarding): true only when the
    # gate runs in `all` mode AND the marker read every create consults refuses
    # this workspace — so the wall and the API's 402 cannot disagree.
    paymentMethodOnboardingRequired
    # Why the last card offered was refused at binding (ADR091 D10.5–D10.6):
    # PREPAID_CARD or UNPAID_BALANCE; null when none is pending.
    paymentMethodRejection
    lifecycle {
      status
      reason
      graceDeadline
      enforcementOwned
      recoveryPending
      allowedActions
      updatedAt
      # The invoice owed while the workspace is in grace or enforcement, with
      # Stripe's hosted page to pay it (the alert's Pay now); null otherwise.
      overdueInvoice {
        id
        hostedInvoiceUrl
      }
    }
    tax {
      configured
      enabled
      reason
      productTaxCode
      taxBehavior
      registrationCount
    }
  }
}

mutation CreateBillingCheckoutSession(
  $workspaceId: String!
  $successUrl: String!
  $cancelUrl: String!
) {
  createBillingCheckoutSession(
    workspaceId: $workspaceId
    successUrl: $successUrl
    cancelUrl: $cancelUrl
  ) {
    url
    expiresAt
  }
}

mutation CreateBillingPortalSession(
  $workspaceId: String!
  $returnUrl: String!
) {
  createBillingPortalSession(workspaceId: $workspaceId, returnUrl: $returnUrl) {
    url
    expiresAt
  }
}
