# Workspace-scoped month-to-date usage (bex extension, no Render equivalent).
# Three kinds: instance_seconds (compute), egress_bytes (bandwidth),
# build_seconds (CI/build) — displayed as hours, MB/GB, and minutes respectively.
# resourceKind distinguishes App services from managed Postgres/KeyValue instances.
query Usage {
  usage {
    workspaceId
    services {
      serviceId
      resourceKind
      rows {
        kind
        tier
        total
      }
    }
  }
}
