# Workspace-scoped usage (bex extension, no Render equivalent).
# Five kinds: instance_seconds (compute), egress_bytes (bandwidth),
# build_seconds (CI/build), storage_gb_seconds (managed datastore storage), and
# sandbox_compute_seconds (weighted hosted-sandbox compute).
# resourceKind distinguishes App services, managed Postgres/KeyValue instances,
# and hosted sandboxes.
# period: optional calendar month YYYY-MM; defaults to the current month.
# ownerId: workspace to query (w6/m18); the dashboard always sends the
# switcher's selection so multi-workspace callers see the right workspace's
# usage, not just whichever workspace they resolve to implicitly.
# estimatedCost: USD estimate (30% below Render on compute/Postgres/KV/build/
# Postgres storage, 90% below on bandwidth). Estimate only — not an invoice.
query Usage($period: String, $ownerId: String) {
  usage(period: $period, ownerId: $ownerId) {
    workspaceId
    period
    # coverage: how complete/degraded the metering behind estimatedCost is
    # (ADR040 — failures degrade to estimate-only rather than 500). state is
    # complete | partial | unknown; `through` bounds a partial estimate and
    # degradedSources names the unhealthy meters, so the page can caveat a
    # money figure built on incomplete data (w4/048).
    coverage {
      state
      through
      degradedSources
    }
    estimatedCost {
      totalUsd
      # resources is the same total grouped by the resource that incurred it,
      # each with the charge lines behind it (rate x quantity = cost, all in
      # one display unit). This is what the billing page's charge tree renders;
      # `meters` aggregates every resource together and cannot answer "which
      # service costs me money".
      resources {
        serviceId
        serviceName
        resourceKind
        costUsd
        charges {
          kind
          tier
          unit
          rateUsd
          quantity
          costUsd
        }
      }
    }
    # billing: real Stripe invoice preview + finalized invoices (m48/m50). null
    # when no subscription exists, Mode-A excluded, billing off, or degraded.
    billing {
      # amountUsd is the gross rated charge; creditsAppliedUsd is what credit
      # took off it and amountDueUsd what Stripe actually collects (w6/m98).
      currentCost {
        amountUsd
        creditsAppliedUsd
        amountDueUsd
        currency
        periodStart
        periodEnd
      }
      invoices {
        id
        status
        amountUsd
        creditsAppliedUsd
        amountDueUsd
        currency
        periodStart
        periodEnd
      }
      # credits: remaining Stripe billing-credit balance (w5/m70). Absent when
      # zero or the read degrades; never derived from the invoice preview.
      credits {
        availableUsd
        currency
        grants {
          name
          remainingUsd
          expiresAt
        }
      }
    }
  }
}

# Creation-count caps are independent of metered usage, but belong on the same
# workspace Usage page so a human can see both consumption and remaining
# capacity before a create call is rejected.
# `used` counts every resource that still holds quota, including ones finishing
# deletion; `terminating` is how many of `used` are mid-deletion — the count that
# reconciles this figure with the (shorter) resource list, which drops those rows
# but whose quota they still consume (w6/m129).
query WorkspaceLimits($ownerId: String!) {
  workspaceLimits(ownerId: $ownerId) {
    services {
      used
      terminating
      limit
    }
    postgres {
      used
      terminating
      limit
    }
    keyValues {
      used
      terminating
      limit
    }
  }
}

# Workspace-admin customer billing onboarding. Stripe-hosted URLs are created
# server-side; no Stripe server credential or payment detail reaches this app.
query BillingReadiness($workspaceId: String!) {
  workspaceBillingReadiness(workspaceId: $workspaceId) {
    workspaceId
    mode
    customerReady
    subscriptionReady
    paymentMethodReady
    # brand/last4 of the card Stripe will charge, so the billing page can name
    # it ("Visa ending in 4242") instead of only reporting that one exists.
    # Empty for a non-card method or an unexpanded read — fall back to the flag.
    paymentMethodBrand
    paymentMethodLast4
    paymentMethodRequired
    # The sign-up wall's one input (features/onboarding): true only when the
    # gate runs in `all` mode AND the marker read every create consults refuses
    # this workspace — so the wall and the API's 402 cannot disagree.
    paymentMethodOnboardingRequired
    lifecycle {
      status
      reason
      graceDeadline
      enforcementOwned
      recoveryPending
      allowedActions
      updatedAt
    }
    tax {
      configured
      enabled
      reason
      productTaxCode
      taxBehavior
      registrationCount
    }
  }
}

mutation CreateBillingCheckoutSession(
  $workspaceId: String!
  $successUrl: String!
  $cancelUrl: String!
) {
  createBillingCheckoutSession(
    workspaceId: $workspaceId
    successUrl: $successUrl
    cancelUrl: $cancelUrl
  ) {
    url
    expiresAt
  }
}

mutation CreateBillingPortalSession(
  $workspaceId: String!
  $returnUrl: String!
) {
  createBillingPortalSession(workspaceId: $workspaceId, returnUrl: $returnUrl) {
    url
    expiresAt
  }
}
