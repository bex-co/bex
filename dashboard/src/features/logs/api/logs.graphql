# bex-api's logs read (internal/logs/graphql.go), Render-shaped: a historical
# query across an App's replicas. Serves BOTH types (w3/m8) — `type=app` is the
# service's own output, `type=request` its Traefik access lines; only `type=build`
# is empty (bex builds run in a separate plane). The flat `LogEntry` row is the
# GraphQL projection of Core's LogEntry; the REST adapter renders the same data as
# Render's labels array instead. Live tail is a separate stream (SSE), not a
# GraphQL field.
#
# The query below asks for the fields the current UI renders. The schema also
# offers the structured filters (level/statusCode/method/path/instance) and the
# `logLabelValues` discovery query that feeds their dropdowns — the filter UI that
# consumes them is .pm/w5/008. Note: without the durable store those filters (and
# type=request) answer 503 rather than an empty page (docs/ADR010-observability.md).
query Logs($resource: String!, $type: String, $text: String, $limit: Int) {
  logs(resource: $resource, type: $type, text: $text, limit: $limit) {
    timestamp
    message
    type
    instance
  }
}
