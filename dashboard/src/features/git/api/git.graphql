# bex-api's GitHub-connect surface (backend/internal/github/graphql.go, ADR075).
# A workspace connects SEVERAL GitHub App installations (org + personal accounts);
# the connectGit mutation redirects the browser to GitHub's install screen with a
# stateful, single-use install URL and GitHub's callback records it. A backend 503
# (BEX_GITHUB_APP_* unset) surfaces as a query error the card treats as
# "unavailable".

# The connected installations' repositories (private included), each annotated
# with the GitHub account it belongs to so the picker can group by account
# (ADR075). Empty until a connection exists.
query Repos {
  repos {
    id
    fullName
    private
    defaultBranch
    htmlUrl
    cloneUrl
    accountLogin
    installationId
  }
}

# The actual branches of a connected GitHub repo — feeds the Settings Branch
# combobox (w5/m54). Empty for a non-GitHub repo or no connection, so the UI
# degrades to free-text branch entry.
query RepoBranches($repo: String!) {
  repoBranches(repo: $repo)
}

# Every GitHub account/org this workspace has connected (ADR075). Empty list ⇒
# not connected; each row's installUrl is the bare "configure grants" deep link.
query GitConnections {
  gitConnections {
    connected
    accountLogin
    installationId
    createdAt
    installUrl
  }
}

mutation ConnectGit {
  connectGit {
    connected
    installUrl
  }
}

# installationId names the exact connection to remove; omitted ⇒ the sole
# connection (an error when the workspace holds several).
mutation DisconnectGit($installationId: Float) {
  disconnectGit(installationId: $installationId)
}
