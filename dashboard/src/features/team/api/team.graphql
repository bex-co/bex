# bex-api's workspace members & roles surface (backend/internal/members —
# w4/m12; docs/ADR012-auth.md role matrix). The Team page lists a workspace's members
# and their roles, invites teammates by email, changes roles, and removes
# members. Roles are Render's UPPERCASE enum on the wire
# (VIEWER/CONTRIBUTOR/DEVELOPER/ADMIN/BILLING). The caller's workspace list
# (the switcher / current-workspace source) is the `Workspaces` query owned by
# features/workspaces/api/workspaces.graphql — one operation name, one document.

# Members + seat usage in ONE request (both viewer-and-up): seat usage is
# Render's owner.usage.users {used, limit} (w1/m33) — used counts accepted
# members plus outstanding invites; limit 0 means unlimited.
query WorkspaceMembers($workspaceId: String!) {
  workspaceMembers(workspaceId: $workspaceId) {
    subject
    userId
    email
    role
    createdAt
    mfaEnabled
  }
  workspaceSeatUsage(workspaceId: $workspaceId) {
    used
    limit
  }
}

query WorkspaceInvites($workspaceId: String!) {
  workspaceInvites(workspaceId: $workspaceId) {
    id
    email
    role
    expiresAt
    createdAt
  }
}

mutation InviteWorkspaceMember(
  $workspaceId: String!
  $email: String!
  $role: String!
) {
  inviteWorkspaceMember(workspaceId: $workspaceId, email: $email, role: $role) {
    id
    email
    role
    expiresAt
    createdAt
  }
}

mutation ChangeWorkspaceMemberRole(
  $workspaceId: String!
  $subject: String!
  $role: String!
) {
  changeWorkspaceMemberRole(
    workspaceId: $workspaceId
    subject: $subject
    role: $role
  ) {
    subject
    role
    createdAt
  }
}

mutation RemoveWorkspaceMember($workspaceId: String!, $subject: String!) {
  removeWorkspaceMember(workspaceId: $workspaceId, subject: $subject)
}

mutation RevokeWorkspaceInvite($workspaceId: String!, $inviteId: String!) {
  revokeWorkspaceInvite(workspaceId: $workspaceId, inviteId: $inviteId)
}

# Resend a pending invite (w1/m33): fresh email, refreshed expiry, same id and
# token — no revoke + re-invite churn.
mutation ResendWorkspaceInvite($workspaceId: String!, $inviteId: String!) {
  resendWorkspaceInvite(workspaceId: $workspaceId, inviteId: $inviteId) {
    id
    email
    role
    expiresAt
    createdAt
  }
}

# Redeem an emailed invite token for the authenticated caller (w1/m33) — joins
# the inviting workspace even when the caller signed up under a different email.
mutation AcceptWorkspaceInvite($token: String!) {
  acceptWorkspaceInvite(token: $token) {
    workspaceId
    workspaceName
    role
  }
}
