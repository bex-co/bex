# bex-api's API-key surface (backend/internal/apikeys/graphql.go, docs/ADR012-auth.md).
# Keys are workspace-shared machine credentials (Hydra OAuth2 clients), not
# per-user — the list query never requests `secret` (the server always resolves
# it empty for `apiKeys` anyway, but the dashboard doesn't even ask): the only
# place a secret is ever fetched is the create mutation's response, exactly
# once, matching Render's "shown only at creation" API-key UX.

# ownerId (w6/m18): the workspace to list/mint/revoke in — the dashboard always
# sends the switcher's selection so a multi-workspace caller manages the right
# workspace's keys, not just whichever workspace they resolve to implicitly.
query ApiKeys($ownerId: String) {
  apiKeys(ownerId: $ownerId) {
    id
    name
    createdAt
    createdBy
    lastUsedAt
  }
}

mutation CreateApiKey($name: String!, $ownerId: String) {
  createApiKey(name: $name, ownerId: $ownerId) {
    id
    name
    secret
    createdAt
  }
}

mutation RevokeApiKey($id: String!, $ownerId: String) {
  revokeApiKey(id: $id, ownerId: $ownerId)
}
