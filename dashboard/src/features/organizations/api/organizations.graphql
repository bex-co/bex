# bex-api's organizations (w7/m464, docs/ADR115-organizations.md): a Scale or
# Enterprise workspace is the primary of an org that holds unlimited
# workspaces under its plan. The switcher lists the caller's orgs; the org's
# Workspaces, Members and Settings pages read and change it. Roles are
# OWNER, MEMBER and GUEST; privacy is public or invite_only. The org's login
# settings (w7/m466) bind every one of its workspaces and its own pages.

fragment OrganizationFields on Organization {
  id
  name
  plan
  primaryWorkspaceId
  viewerRole
  createdAt
  requireTwoFactor
  requireGoogleLogin
  workspaces {
    id
    name
    slug
    plan
    privacy
    primary
    viewerIsMember
  }
}

query Organizations {
  organizations {
    ...OrganizationFields
  }
}

query Organization($id: String!) {
  organization(id: $id) {
    ...OrganizationFields
  }
}

mutation CreateOrganizationWorkspace(
  $organizationId: String!
  $name: String!
  $privacy: String
) {
  createOrganizationWorkspace(
    organizationId: $organizationId
    name: $name
    privacy: $privacy
  ) {
    id
    name
    slug
    plan
    privacy
  }
}

mutation SetWorkspacePrivacy($workspaceId: String!, $privacy: String!) {
  setWorkspacePrivacy(workspaceId: $workspaceId, privacy: $privacy) {
    id
    privacy
  }
}

mutation RenameOrganization($organizationId: String!, $name: String!) {
  renameOrganization(organizationId: $organizationId, name: $name) {
    ...OrganizationFields
  }
}

# Org Settings -> Security (w7/m466): Owner only. Turning one on is refused
# while the Owner does not meet it (WORKSPACE_2FA_ADMIN_NOT_ENROLLED,
# WORKSPACE_GOOGLE_LOGIN_ADMIN_NOT_SIGNED_IN) or the deployment cannot
# enforce it (WORKSPACE_2FA_UNAVAILABLE, WORKSPACE_GOOGLE_LOGIN_UNAVAILABLE).
mutation SetOrganizationRequireTwoFactor(
  $organizationId: String!
  $enabled: Boolean!
) {
  setOrganizationRequireTwoFactor(
    organizationId: $organizationId
    enabled: $enabled
  ) {
    ...OrganizationFields
  }
}

mutation SetOrganizationRequireGoogleLogin(
  $organizationId: String!
  $enabled: Boolean!
) {
  setOrganizationRequireGoogleLogin(
    organizationId: $organizationId
    enabled: $enabled
  ) {
    ...OrganizationFields
  }
}

mutation JoinWorkspace($workspaceId: String!) {
  joinWorkspace(workspaceId: $workspaceId) {
    workspaceId
    role
    joined
  }
}

mutation JoinWorkspaceAsAdmin($workspaceId: String!) {
  joinWorkspaceAsAdmin(workspaceId: $workspaceId) {
    workspaceId
    role
    joined
  }
}

query OrganizationMembers($organizationId: String!) {
  organizationMembers(organizationId: $organizationId) {
    subject
    userId
    email
    role
    createdAt
    workspaces
    isSelf
  }
}

query OrganizationInvites($organizationId: String!) {
  organizationInvites(organizationId: $organizationId) {
    id
    email
    role
    expiresAt
    createdAt
  }
}

mutation InviteOrganizationMember(
  $organizationId: String!
  $email: String!
  $role: String!
) {
  inviteOrganizationMember(
    organizationId: $organizationId
    email: $email
    role: $role
  ) {
    id
    email
    role
    expiresAt
    createdAt
  }
}

mutation RevokeOrganizationInvite(
  $organizationId: String!
  $inviteId: String!
) {
  revokeOrganizationInvite(organizationId: $organizationId, inviteId: $inviteId)
}

mutation ChangeOrganizationMemberRole(
  $organizationId: String!
  $subject: String!
  $role: String!
) {
  changeOrganizationMemberRole(
    organizationId: $organizationId
    subject: $subject
    role: $role
  ) {
    subject
    role
    workspaces
  }
}

mutation RemoveOrganizationMember($organizationId: String!, $subject: String!) {
  removeOrganizationMember(organizationId: $organizationId, subject: $subject)
}

# An org invite's emailed link (/invite#org-invite=<token>, w7/083): review it
# without accepting, then redeem it for the signed-in caller, whatever email
# they signed in with. A used link answers INVITE_ALREADY_ACCEPTED, a lapsed
# one INVITE_EXPIRED, an unknown one INVITE_INVALID.
query OrganizationInvitePreview($token: String!) {
  organizationInvitePreview(token: $token) {
    organizationId
    organizationName
    role
    inviterEmail
    alreadyMember
  }
}

mutation AcceptOrganizationInvite($token: String!) {
  acceptOrganizationInvite(token: $token) {
    organizationId
    organizationName
    role
    joined
  }
}
