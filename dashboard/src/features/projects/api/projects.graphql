fragment ProjectFields on Project {
  id
  name
  ownerId
  createdAt
  serviceIds
  databaseIds
  keyValueIds
}

query Projects($ownerId: String!) {
  projects(ownerId: $ownerId) {
    ...ProjectFields
  }
}

# Single-project read used by the route loader and its two child pages.
# Deliberately NOT ...ProjectFields: this byte-matches the selection the
# hand-written document shipped (no createdAt) so migrating provenance does
# not change the wire query. Fragment hygiene is tracked in w1/067.
query Project($id: String!) {
  project(id: $id) {
    id
    name
    ownerId
    serviceIds
    databaseIds
    keyValueIds
  }
}

mutation CreateProject(
  $name: String!
  $ownerId: String!
  $environments: [ProjectEnvironmentInput!]
) {
  createProject(name: $name, ownerId: $ownerId, environments: $environments) {
    ...ProjectFields
  }
}

mutation RenameProject($id: String!, $name: String!) {
  renameProject(id: $id, name: $name) {
    ...ProjectFields
  }
}

mutation DeleteProject($id: String!) {
  deleteProject(id: $id)
}

mutation SetProjectServices($id: String!, $serviceIds: [String!]!) {
  setProjectServices(id: $id, serviceIds: $serviceIds) {
    ...ProjectFields
  }
}

mutation SetProjectDatabases($id: String!, $databaseIds: [String!]!) {
  setProjectDatabases(id: $id, databaseIds: $databaseIds) {
    ...ProjectFields
  }
}

mutation SetProjectKeyValues($id: String!, $keyValueIds: [String!]!) {
  setProjectKeyValues(id: $id, keyValueIds: $keyValueIds) {
    ...ProjectFields
  }
}

# A project's observability views (w3/m505): Render's saved searches. The
# sidebar lists them and a view page finds its own in the same list, so one
# read serves both (Render's savedSearch(id) single read is not needed here).
fragment SavedSearchFields on SavedSearch {
  id
  name
  type
  filters
}

query SavedSearches($projectId: String!, $type: SavedSearchType) {
  savedSearches(projectId: $projectId, type: $type) {
    ...SavedSearchFields
  }
}

# Managing a project's views (w3/m507): New View, Edit view, Duplicate and
# Delete, each by whoever may edit the project.
mutation CreateSavedSearch(
  $projectId: String!
  $type: SavedSearchType!
  $name: String!
  $filters: JSONObject
) {
  createSavedSearch(
    projectId: $projectId
    type: $type
    name: $name
    filters: $filters
  ) {
    ...SavedSearchFields
  }
}

mutation UpdateSavedSearch($id: String!, $name: String, $filters: JSONObject) {
  updateSavedSearch(id: $id, name: $name, filters: $filters) {
    ...SavedSearchFields
  }
}

mutation DuplicateSavedSearch($id: String!) {
  duplicateSavedSearch(id: $id) {
    ...SavedSearchFields
  }
}

mutation DeleteSavedSearch($id: String!) {
  deleteSavedSearch(id: $id)
}
