fragment ProjectFields on Project {
  id
  name
  ownerId
  createdAt
  serviceIds
  databaseIds
  keyValueIds
}

query Projects($ownerId: String!) {
  projects(ownerId: $ownerId) {
    ...ProjectFields
  }
}

# Single-project read used by the route loader and its two child pages.
# Deliberately NOT ...ProjectFields: this byte-matches the selection the
# hand-written document shipped (no createdAt) so migrating provenance does
# not change the wire query. Fragment hygiene is tracked in w1/067.
query Project($id: String!) {
  project(id: $id) {
    id
    name
    ownerId
    serviceIds
    databaseIds
    keyValueIds
  }
}

mutation CreateProject($name: String!, $ownerId: String!) {
  createProject(name: $name, ownerId: $ownerId) {
    ...ProjectFields
  }
}

mutation RenameProject($id: String!, $name: String!) {
  renameProject(id: $id, name: $name) {
    ...ProjectFields
  }
}

mutation DeleteProject($id: String!) {
  deleteProject(id: $id)
}

mutation SetProjectServices($id: String!, $serviceIds: [String!]!) {
  setProjectServices(id: $id, serviceIds: $serviceIds) {
    ...ProjectFields
  }
}

mutation SetProjectDatabases($id: String!, $databaseIds: [String!]!) {
  setProjectDatabases(id: $id, databaseIds: $databaseIds) {
    ...ProjectFields
  }
}

mutation SetProjectKeyValues($id: String!, $keyValueIds: [String!]!) {
  setProjectKeyValues(id: $id, keyValueIds: $keyValueIds) {
    ...ProjectFields
  }
}
