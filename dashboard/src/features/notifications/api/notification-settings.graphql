# bex-api's deploy-notification settings (backend/internal/notifications/graphql.go,
# w3/m9). Self-service, scoped to the caller — no workspaceId arg (same shape as
# `usage`).

query NotificationSettings {
  notificationSettings {
    deployStarted
    deploySucceeded
    deployFailed
  }
}

mutation UpdateNotificationSettings(
  $deployStarted: Boolean!
  $deploySucceeded: Boolean!
  $deployFailed: Boolean!
) {
  updateNotificationSettings(
    deployStarted: $deployStarted
    deploySucceeded: $deploySucceeded
    deployFailed: $deployFailed
  ) {
    deployStarted
    deploySucceeded
    deployFailed
  }
}

# bex-native mobile push extension. It remains caller-scoped like the email
# settings above, but uses a separate typed projection so Render-compatible
# email fields remain byte-compatible.
query PushNotificationSettings {
  pushNotificationsAvailable
  pushNotificationSettings {
    enabled
    events
    minimumUrgency
    timeZone
    workingHours {
      weekdays
      start
      end
    }
    quietHours {
      weekdays
      start
      end
    }
    maxDeferralSeconds
    serviceOverrides {
      serviceId
      enabled
      events
      minimumUrgency
    }
  }
}

mutation UpdatePushNotificationSettings(
  $settings: PushNotificationSettingsInput!
) {
  updatePushNotificationSettings(settings: $settings) {
    enabled
    events
    minimumUrgency
    timeZone
    workingHours {
      weekdays
      start
      end
    }
    quietHours {
      weekdays
      start
      end
    }
    maxDeferralSeconds
    serviceOverrides {
      serviceId
      enabled
      events
      minimumUrgency
    }
  }
}
