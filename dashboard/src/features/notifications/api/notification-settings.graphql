# bex-api's deploy-notification settings (backend/internal/notifications/graphql.go,
# w3/m9). Self-service — always the caller's own preferences, never another
# member's. `ownerId` names the WORKSPACE those preferences belong to (w4/m128):
# the row is keyed (tenant, subject) and the mail fan-out joins on that pair, so
# a member in several workspaces has one set of preferences per workspace, and
# the panel must ask about the one it is showing.

query NotificationSettings($ownerId: String) {
  notificationSettings(ownerId: $ownerId) {
    deployStarted
    deploySucceeded
    deployFailed
  }
}

mutation UpdateNotificationSettings(
  $deployStarted: Boolean!
  $deploySucceeded: Boolean!
  $deployFailed: Boolean!
  $ownerId: String
) {
  updateNotificationSettings(
    deployStarted: $deployStarted
    deploySucceeded: $deploySucceeded
    deployFailed: $deployFailed
    ownerId: $ownerId
  ) {
    deployStarted
    deploySucceeded
    deployFailed
  }
}

# bex-native mobile push extension. It remains caller-scoped like the email
# settings above, but uses a separate typed projection so Render-compatible
# email fields remain byte-compatible. Browser web push reuses the same policy
# picker; availability is a distinct field so native Expo stays byte-identical.
query PushNotificationSettings {
  pushNotificationsAvailable
  webPushAvailable
  webPushVapidPublicKey
  pushNotificationSettings {
    enabled
    events
    minimumUrgency
    timeZone
    workingHours {
      weekdays
      start
      end
    }
    quietHours {
      weekdays
      start
      end
    }
    maxDeferralSeconds
    serviceOverrides {
      serviceId
      enabled
      events
      minimumUrgency
    }
  }
}

mutation UpdatePushNotificationSettings(
  $settings: PushNotificationSettingsInput!
) {
  updatePushNotificationSettings(settings: $settings) {
    enabled
    events
    minimumUrgency
    timeZone
    workingHours {
      weekdays
      start
      end
    }
    quietHours {
      weekdays
      start
      end
    }
    maxDeferralSeconds
    serviceOverrides {
      serviceId
      enabled
      events
      minimumUrgency
    }
  }
}

mutation RegisterNotificationWebPushSubscription(
  $browserId: String!
  $endpoint: String!
  $p256dh: String!
  $auth: String!
) {
  registerNotificationWebPushSubscription(
    browserId: $browserId
    endpoint: $endpoint
    p256dh: $p256dh
    auth: $auth
  ) {
    browserId
    createdAt
    updatedAt
    lastRegisteredAt
  }
}

mutation UnregisterNotificationWebPushSubscription($browserId: String!) {
  unregisterNotificationWebPushSubscription(browserId: $browserId)
}
