# The caller's own effective permissions in a workspace (w9/m84, refreshed
# w6/m144). ownerId is the active workspace; fresh=true bypasses the short
# positive-decision cache after an access change (ADR087). Tri-state grants
# distinguish role denial from an unanswerable check. The server stays
# authoritative — this only shapes the UI.
query ViewerCapabilities($ownerId: String, $fresh: Boolean) {
  viewerCapabilities(ownerId: $ownerId, fresh: $fresh) {
    role
    canView
    canViewLogs
    canOperate
    canCreate
    canViewSensitive
    canManageKeys
    canManage
    canManageBilling
    fresh
    grants {
      action
      outcome
      reason
    }
  }
}
