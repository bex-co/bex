# Per-resource action projections (ADR087 / w6/m143). Minimum fields for
# target/action permission, blocking precondition, and confirmation — no
# configuration, secrets, or scopes. The selected workspace travels with each
# query so a shared workspace never falls back to the caller's personal one.
query ServerActions($id: String!, $ownerId: String!) {
  serverActions(id: $id, ownerId: $ownerId) {
    action
    outcome
    reason
    precondition
  }
}

query DeployActions($serviceId: String!, $ownerId: String!) {
  deployActions(serviceId: $serviceId, ownerId: $ownerId) {
    action
    outcome
    reason
    precondition
  }
}
