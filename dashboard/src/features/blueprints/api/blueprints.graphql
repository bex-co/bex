# The Blueprints dashboard surface (w7/m27) — mirrors the GraphQL operations
# bex-api registers in apps/graphql.go (w2/m15 + w7/m27 + w2/m62). Selections
# byte-match the previously hand-written TypedDocumentNodes (w1/m79/t001) so
# the provenance change is not a wire change.

# --- queries ---

query Blueprints($ownerId: String) {
  blueprints(ownerId: $ownerId) {
    id
    name
    # The suffix a create_new Blueprint adds to its resource names; it tells
    # apart several Blueprints made from one file (w8/m153).
    resourceSuffix
    repo
    branch
    path
    autoSync
    status
    lastSync
    createdAt
    updatedAt
  }
}

query Blueprint($id: String!, $ownerId: String) {
  blueprint(id: $id, ownerId: $ownerId) {
    id
    name
    resourceSuffix
    repo
    branch
    path
    autoSync
    manifest
    status
    lastSync
    resources {
      id
      name
      type
    }
    createdAt
    updatedAt
  }
}

query BlueprintSyncs(
  $id: String!
  $ownerId: String
  $cursor: String
  $limit: Int
) {
  blueprintSyncs(id: $id, ownerId: $ownerId, cursor: $cursor, limit: $limit) {
    id
    commitId
    state
    startedAt
    completedAt
    errorMessage
    note
  }
}

# blueprintId scopes the check to that Blueprint's own workspace, so it sees the
# same existing services an apply would (w8/m64).
query ValidateBlueprint($bexYaml: String!, $blueprintId: String) {
  validateBlueprint(bexYaml: $bexYaml, blueprintId: $blueprintId) {
    valid
    errors
    # Each error's code and source location (w8/019), rendered beside it (w4/151).
    errorDetails {
      code
      line
      column
      path
      error
    }
  }
}

query BlueprintPreview(
  $repo: String!
  # Omitted: the repository's default branch, reported back as branch (w4/532).
  $branch: String
  $path: String
  $ownerId: String
  $blueprintId: String
  # "create_new" reviews a Blueprint not yet created as a separate set of
  # resources under a new suffix (w8/m153). Omitted: "adopt". Never sent with
  # blueprintId, which bex-api refuses.
  $existingResources: String
) {
  blueprintPreview(
    repo: $repo
    branch: $branch
    path: $path
    ownerId: $ownerId
    blueprintId: $blueprintId
    existingResources: $existingResources
  ) {
    found
    branch
    commitId
    error
    # Set only for a Blueprint not yet created (w8/m153): the mode the file was
    # reviewed in, the suffix a create_new review planned under, and the
    # declared resources whose names already exist in the workspace.
    existingResources
    resourceSuffix
    matchedResources {
      kind
      name
    }
    # reason/retryable (w2/m97): the machine-readable cause, so the page picks
    # its own copy per failure instead of rendering raw backend text.
    reason
    retryable
    validation {
      valid
      errors
      # code tells a takeover conflict from an ordinary problem (w5/m125).
      errorDetails {
        code
        line
        column
        path
        error
      }
      plan {
        mode
        services
        databases
        keyValue
        envGroups
        syncFalseVars
        totalActions
        actions {
          operation
          kind
          name
          sourcePath
          resourceId
          changedFields {
            path
          }
          message
        }
      }
      estimatedPricing {
        totalUsd
        lines {
          name
          tierLabel
          monthlyUsd
          instanceUsd
          storageUsd
          storageGb
        }
        variable {
          name
          reason
        }
      }
    }
  }
}

query GenerateBlueprint(
  $ownerId: String
  $serviceIds: [String]
  $postgresIds: [String]
  $keyValueIds: [String]
  $envGroupIds: [String]
) {
  generateBlueprint(
    ownerId: $ownerId
    serviceIds: $serviceIds
    postgresIds: $postgresIds
    keyValueIds: $keyValueIds
    envGroupIds: $envGroupIds
  ) {
    manifest
    filename
  }
}

# --- mutations ---

mutation CreateBlueprint(
  $repo: String!
  $branch: String!
  $path: String
  $name: String
  $confirm: String
  $ownerId: String
  $envVarValues: [BlueprintEnvVarValueInput]
  # "create_new" with the suffix the preview reviewed (w8/m153); both omitted
  # for a Blueprint that manages the names its file gives.
  $existingResources: String
  $resourceSuffix: String
) {
  createBlueprint(
    repo: $repo
    branch: $branch
    path: $path
    name: $name
    confirm: $confirm
    ownerId: $ownerId
    envVarValues: $envVarValues
    existingResources: $existingResources
    resourceSuffix: $resourceSuffix
  ) {
    id
    name
    resourceSuffix
    repo
    branch
    path
    autoSync
    status
    lastSync
    createdAt
    updatedAt
  }
}

mutation UpdateBlueprint(
  $id: String!
  $name: String
  $autoSync: Boolean
  $path: String
  $ownerId: String
) {
  updateBlueprint(
    id: $id
    name: $name
    autoSync: $autoSync
    path: $path
    ownerId: $ownerId
  ) {
    id
    name
    repo
    branch
    path
    autoSync
    status
    lastSync
    updatedAt
  }
}

mutation DisconnectBlueprint($id: String!, $ownerId: String) {
  disconnectBlueprint(id: $id, ownerId: $ownerId)
}

mutation SyncBlueprint(
  $id: String!
  $ownerId: String
  $bexYaml: String
  $confirm: String
  $commitId: String
  $path: String
  $repo: String
) {
  syncBlueprint(
    id: $id
    ownerId: $ownerId
    bexYaml: $bexYaml
    confirm: $confirm
    commitId: $commitId
    path: $path
    repo: $repo
  ) {
    blueprint {
      id
      name
      status
      lastSync
      updatedAt
    }
    services {
      id
      name
    }
    databases
    detachedResources {
      id
      name
      type
    }
  }
}

# --- plan-then-approve (w2/m256 t012) ---

# The plan a created Blueprint waits to have approved; null when there is none.
query BlueprintPlannedSync($id: String!, $ownerId: String) {
  blueprintPlannedSync(id: $id, ownerId: $ownerId) {
    id
    commitId
    state
    actions {
      operation
      kind
      name
      sourcePath
      resourceId
      changedFields {
        path
      }
      message
    }
    requiredManualEnvVars {
      serviceType
      serviceName
      key
    }
  }
}

mutation PlanBlueprintSync($id: String!, $ownerId: String) {
  planBlueprintSync(id: $id, ownerId: $ownerId) {
    planningOutcome
    notices {
      severity
      message
    }
  }
}

mutation ApproveBlueprint(
  $id: String!
  $ownerId: String
  $manualEnvVars: [BlueprintManualEnvVarInput]
) {
  approveBlueprint(id: $id, ownerId: $ownerId, manualEnvVars: $manualEnvVars) {
    id
    state
  }
}
