# bex-api's outbound-webhooks surface (backend/internal/webhooks/graphql.go,
# w3/m11). Endpoints are workspace-scoped destinations bex pushes signed event
# notifications to. The list query never requests `secret` (the server resolves
# it empty everywhere but the create mutation anyway): the only place a signing
# secret is ever fetched is CreateWebhookEndpoint's response, exactly once —
# the API-key mint-once precedent.

query WebhookEndpoints($ownerId: String) {
  webhookEndpoints(ownerId: $ownerId) {
    id
    name
    url
    eventTypes
    enabled
    disabledReason
    createdAt
  }
}

# One endpoint by id — the /webhook/$webhookId detail page (w1/m49). Never
# requests `secret` (the server resolves it empty on reads anyway).
query WebhookEndpoint($id: String!, $ownerId: String) {
  webhookEndpoint(id: $id, ownerId: $ownerId) {
    id
    name
    url
    eventTypes
    enabled
    disabledReason
    createdAt
    createdBy
  }
}

# The subscribable event-type vocabulary — drives the create form's picker so
# the dashboard never hardcodes (and drifts from) the server's set.
query WebhookEventTypes {
  webhookEventTypes
}

query WebhookDeliveries(
  $endpointId: String!
  $ownerId: String
  $cursor: String
  $limit: Int
) {
  webhookDeliveries(
    endpointId: $endpointId
    ownerId: $ownerId
    cursor: $cursor
    limit: $limit
  ) {
    id
    eventType
    serviceId
    status
    attemptCount
    lastStatusCode
    lastError
    nextAttemptAt
    deliveredAt
    createdAt
    cursor
  }
}

mutation CreateWebhookEndpoint(
  $ownerId: String
  $name: String
  $url: String!
  $eventTypes: [String]!
) {
  createWebhookEndpoint(
    ownerId: $ownerId
    name: $name
    url: $url
    eventTypes: $eventTypes
  ) {
    id
    name
    url
    eventTypes
    enabled
    secret
    createdAt
  }
}

# Edit an endpoint in place — the detail Settings tab (w1/m49/t005). The
# backend verb shipped with w3/m11 (service.Update: URL re-validation +
# event-type normalization; omitted args keep their current values); this is
# the dashboard finally wiring it. Same field semantics as REST's
# `PATCH /v1/webhooks/{id}`.
mutation UpdateWebhookEndpoint(
  $id: String!
  $ownerId: String
  $name: String
  $url: String
  $eventTypes: [String]
  $enabled: Boolean
) {
  updateWebhookEndpoint(
    id: $id
    ownerId: $ownerId
    name: $name
    url: $url
    eventTypes: $eventTypes
    enabled: $enabled
  ) {
    id
    name
    url
    eventTypes
    enabled
    disabledReason
    createdAt
    createdBy
  }
}

mutation SetWebhookEndpointEnabled(
  $id: String!
  $ownerId: String
  $enabled: Boolean!
) {
  setWebhookEndpointEnabled(id: $id, ownerId: $ownerId, enabled: $enabled) {
    id
    enabled
    disabledReason
  }
}

mutation DeleteWebhookEndpoint($id: String!, $ownerId: String) {
  deleteWebhookEndpoint(id: $id, ownerId: $ownerId)
}
