# Repository environments for agent sessions (ADR109): per repository, the
# setup steps the driver runs from the repository root before the agent
# starts, and the checks the agent runs before it delivers. Members who can
# start sessions read them; only admins (can_manage) set or delete them.
query AgentRepoEnvironments($ownerId: String!) {
  agentRepoEnvironments(ownerId: $ownerId) {
    ownerId
    environments {
      repo
      # The SHA-256 of the setup steps (ADR111 D7): a build of another version
      # is stale, and sessions fall back to running the steps.
      version
      setup {
        name
        run
      }
      checks {
        name
        run
      }
      # The newest build (ADR111 D10), for the row's status and time; null for
      # a repository that never built (a checks-only environment never does).
      latestBuild {
        ...AgentRepoEnvironmentBuildFields
      }
    }
  }
}

# A build of a repository environment's setup steps into the image its
# sessions boot from (ADR111). `steps` (the redacted log) is selected only by
# the single-build read: lists never carry it, so it stays off this fragment.
fragment AgentRepoEnvironmentBuildFields on AgentRepoEnvironmentBuild {
  id
  ownerId
  repo
  version
  trigger
  status
  failureCode
  failureReason
  headSha
  sizeBytes
  imageAvailable
  createdAt
  startedAt
  finishedAt
}

# A repository's last 20 builds, newest first (ADR111 D8, D10).
query AgentRepoEnvironmentBuilds($ownerId: String!, $repo: String!) {
  agentRepoEnvironmentBuilds(ownerId: $ownerId, repo: $repo) {
    ownerId
    repo
    builds {
      ...AgentRepoEnvironmentBuildFields
    }
  }
}

# One build with its log: each setup step's exit, duration and redacted output.
query AgentRepoEnvironmentBuild($ownerId: String!, $id: String!) {
  agentRepoEnvironmentBuild(ownerId: $ownerId, id: $id) {
    ...AgentRepoEnvironmentBuildFields
    steps {
      name
      exitCode
      durationMs
      output
    }
  }
}

# Build now (admins only, ADR111 D3): replaces a queued build, never stops a
# running one; at most 12 starts per repository in 24 hours.
mutation BuildAgentRepoEnvironment($ownerId: String!, $repo: String!) {
  buildAgentRepoEnvironment(ownerId: $ownerId, repo: $repo) {
    ...AgentRepoEnvironmentBuildFields
  }
}

# Create or replace a repository's whole environment: the lists sent are the
# lists stored, in order. `repo` is owner/name; the server stores it lowercased.
mutation SetAgentRepoEnvironment(
  $ownerId: String!
  $repo: String!
  $setup: [AgentRepoStepInput!]!
  $checks: [AgentRepoStepInput!]!
) {
  setAgentRepoEnvironment(
    ownerId: $ownerId
    repo: $repo
    setup: $setup
    checks: $checks
  ) {
    repo
  }
}

mutation DeleteAgentRepoEnvironment($ownerId: String!, $repo: String!) {
  deleteAgentRepoEnvironment(ownerId: $ownerId, repo: $repo)
}
