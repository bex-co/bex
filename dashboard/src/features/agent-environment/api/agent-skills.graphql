# Workspace skills for cloud agents (ADR099): SKILL.md documents every session
# of the workspace receives. Members list, read and invoke them; only admins
# (can_manage) create, update or delete. The list carries no bodies.
query AgentSkills($ownerId: String!) {
  agentSkills(ownerId: $ownerId) {
    ownerId
    skills {
      id
      name
      description
      triggers
      enabled
      version
    }
  }
}

query AgentSkill($ownerId: String!, $skill: String!) {
  agentSkill(ownerId: $ownerId, skill: $skill) {
    id
    name
    description
    triggers
    enabled
    version
    body
    content
  }
}

mutation CreateAgentSkill($ownerId: String!, $input: AgentSkillInput!) {
  createAgentSkill(ownerId: $ownerId, input: $input) {
    id
    name
    version
  }
}

mutation UpdateAgentSkill(
  $ownerId: String!
  $skill: String!
  $input: AgentSkillInput!
) {
  updateAgentSkill(ownerId: $ownerId, skill: $skill, input: $input) {
    id
    name
    enabled
    version
  }
}

mutation DeleteAgentSkill($ownerId: String!, $skill: String!) {
  deleteAgentSkill(ownerId: $ownerId, skill: $skill)
}

# Version history (ADR099 D3): every save keeps a version. The list carries no
# content; one version carries the whole SKILL.md and the diff against the
# version before it.
query AgentSkillVersions(
  $ownerId: String!
  $id: String!
  $cursor: String
  $limit: Int
) {
  agentSkillVersions(
    ownerId: $ownerId
    id: $id
    cursor: $cursor
    limit: $limit
  ) {
    skillId
    ownerId
    nextCursor
    versions {
      version
      shortId
      message
      createdBy
      createdAt
      current
    }
  }
}

query AgentSkillVersion($ownerId: String!, $id: String!, $version: Int!) {
  agentSkillVersion(ownerId: $ownerId, id: $id, version: $version) {
    skillId
    version
    shortId
    message
    createdBy
    createdAt
    current
    content
    previousVersion
    diff
  }
}
