# Workspace agent secrets (ADR098): env vars a session can be given by name.
# Write-only: every read returns names and scopes, never values. Developers
# list them to attach; only admins (can_manage) set or delete them.
#
# A secret's scope (ADR098 D9, w9/m385) says which sessions receive it without
# naming it: workspace (every session), repo (sessions on `repo`, owner/name)
# or explicit (only sessions that pick it). Secrets from before scopes read
# explicit.
query AgentSecrets($ownerId: String!) {
  agentSecrets(ownerId: $ownerId) {
    ownerId
    secrets {
      name
      scope
      repo
    }
  }
}

# Create, rotate or rescope. Omit `value` to change only an existing secret's
# scope; omit `scope` to keep it (a new secret without one is workspace-wide).
mutation SetAgentSecret(
  $ownerId: String!
  $name: String!
  $value: String
  $scope: String
  $repo: String
) {
  setAgentSecret(
    ownerId: $ownerId
    name: $name
    value: $value
    scope: $scope
    repo: $repo
  ) {
    name
    scope
    repo
  }
}

mutation DeleteAgentSecret($ownerId: String!, $name: String!) {
  deleteAgentSecret(ownerId: $ownerId, name: $name)
}
