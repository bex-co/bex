# Workspace agent secrets (ADR098): env vars a session can be given by name.
# Write-only: every read returns names, never values. Developers list them to
# attach; only admins (can_manage) set or delete them.
query AgentSecrets($ownerId: String!) {
  agentSecrets(ownerId: $ownerId) {
    ownerId
    secrets {
      name
    }
  }
}

mutation SetAgentSecret($ownerId: String!, $name: String!, $value: String!) {
  setAgentSecret(ownerId: $ownerId, name: $name, value: $value) {
    name
  }
}

mutation DeleteAgentSecret($ownerId: String!, $name: String!) {
  deleteAgentSecret(ownerId: $ownerId, name: $name)
}
