# The workspace agent environment (w10/m17, ADR047 D5): the sandbox network
# tier, the custom hostnames the CUSTOM tier opens, and the default model.
# Any member reads it; only admins (can_manage) write it. The workspace's own
# model provider key (ADR091 D7) is write-only: input.modelApiKey sets it,
# input.clearModelApiKey removes it, and reads see only modelKeySet and
# modelSource.
fragment AgentEnvironmentFields on AgentEnvironment {
  ownerId
  networkTier
  customHosts
  defaultModel
  modelPinned
  pinnedModel
  modelKeySet
  modelSource
  registryHosts
  updatedAt
}

query AgentEnvironment($ownerId: String!) {
  agentEnvironment(ownerId: $ownerId) {
    ...AgentEnvironmentFields
  }
}

# Partial update: omitted fields keep their value; customHosts [] clears the
# list and defaultModel "" returns to the provider default.
mutation UpdateAgentEnvironment(
  $ownerId: String!
  $input: AgentEnvironmentInput!
) {
  updateAgentEnvironment(ownerId: $ownerId, input: $input) {
    ...AgentEnvironmentFields
  }
}
