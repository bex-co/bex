# The workspace agent environment (w10/m17, ADR047 D5): the sandbox network
# tier, the custom hostnames the CUSTOM tier opens, the default model and the
# default sandbox template (w10/m519).
# Any member reads it; only admins (can_manage) write it. The workspace's own
# model provider key (ADR091 D7) is write-only: input.modelApiKey sets it,
# input.clearModelApiKey removes it, and reads see only modelKeySet and
# modelSource.
fragment AgentEnvironmentFields on AgentEnvironment {
  ownerId
  networkTier
  customHosts
  defaultModel
  # The platform model catalog, its default first (w10/m516). Empty on the
  # workspace's own key, where defaultModel is free-form.
  models
  # The catalog models the workspace's admins left on (w10/m527), in catalog
  # order with the catalog's default always among them: the choices for
  # defaultModel and every member's model pickers. Empty on the own key.
  enabledModels
  # The catalog models off only because they joined the catalog after an
  # admin narrowed the list (w10/m568); Settings labels them "New in the
  # catalog". Empty while every model is allowed, under a filter by provider
  # and on the own key.
  newModels
  # The catalog's providers in catalog order (w10/m573), a model's provider
  # being its id's prefix before "/", and the ones the filter by provider
  # lists: every catalog model of a listed provider is offered, a later one
  # included, plus the catalog's default. enabledProviders is null while the
  # list is by model (Devin's one filter type at a time).
  providers
  enabledProviders
  # The sandbox template a session or automation run that names none runs on
  # (w10/m519), and every agent template a session may name, smallest first.
  defaultTemplate
  templates {
    name
    cpu
    memoryGb
  }
  modelKeySet
  modelSource
  registryHosts
  # Whether the workspace's repo sessions get a gh that reaches their
  # repository through bex (w10/m524); true unless an admin turned it off.
  githubCliEnabled
  # The gh binding of the sessions automations start (w10/m561): null
  # inherits githubCliEnabled, true or false binds them. An automation's own
  # template.agentConfig.githubCli wins over it.
  automationsGithubCliEnabled
  # Whether the workspace's gh off is mandatory (w10/m561): while
  # githubCliEnabled is false, no automations default, automation or session
  # turns gh back on. No effect while githubCliEnabled is true.
  githubCliMandatory
  # How long, in minutes, the sandbox of a session a person started stays up
  # after its turn ends or its last editor disconnects (w6/m563): the
  # workspace's own on Enterprise, else the platform's 5. Automations' and
  # child sessions' sandboxes close when their turn ends.
  idleTimeoutMinutes
  # Whether the plan lets admins set idleTimeoutMinutes (Enterprise only).
  idleTimeoutConfigurable
  # The agent profiles members can start sessions with, and each profile
  # whose model provider may train on session data with its admin
  # acknowledgement (w7/m392).
  enabledAgents
  agentDataUse {
    agent
    acknowledgedAt
    acknowledgedBy
  }
  updatedAt
  # Agent-model spend controls (ADR091 D5, D10.1); null when the store is off.
  # agentModelMonthlySpendCapUsd is the effective cap: min(the admin override
  # or plan default, the trust tier's ceiling).
  agentModelMonthlySpendCapUsd
  agentModelPlanSpendCapUsd
  agentModelSpendCapOverrideUsd
  agentModelMaxSpendCapUsd
  agentModelSpendMonthToDateUsd
  agentModelSpendCapTierLimited
  trustTier
  trustTierLocked
  nextChargeThresholdUsd
  agentModelCreditUsd
  agentModelUnbilledUsd
  # An unpaid failed invoice refuses platform-model requests (D10.3).
  billingBalanceDue
  # The mint refuses new platform-model requests at the cap now; false while
  # the next request would charge the card at the tier's threshold (D10.2a).
  agentModelSpendCapReached
  # Reaching nextChargeThresholdUsd charges the card and the workspace keeps
  # working; false where bex cannot charge it or a payment hold applies.
  agentModelChargesAtThreshold
}

query AgentEnvironment($ownerId: String!) {
  agentEnvironment(ownerId: $ownerId) {
    ...AgentEnvironmentFields
  }
}

# Partial update: omitted fields keep their value; customHosts [] clears the
# list, defaultModel "" returns to the provider default and defaultTemplate ""
# to the platform's; githubCliEnabled false turns the sessions' gh off;
# automationsGithubCliEnabled null returns automations to inheriting it and
# githubCliMandatory true makes its off a floor (w10/m561); enabledModels
# replaces the catalog models members may choose (w10/m527), and
# enabledProviders filters them by provider instead (w10/m573);
# idleTimeoutMinutes (5 to 120, Enterprise only) sets the idle close
# (w6/m563).
mutation UpdateAgentEnvironment(
  $ownerId: String!
  $input: AgentEnvironmentInput!
) {
  updateAgentEnvironment(ownerId: $ownerId, input: $input) {
    ...AgentEnvironmentFields
  }
}
