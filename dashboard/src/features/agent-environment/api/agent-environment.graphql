# The workspace agent environment (w10/m17, ADR047 D5): the sandbox network
# tier, the custom hostnames the CUSTOM tier opens, and the default model.
# Any member reads it; only admins (can_manage) write it. The workspace's own
# model provider key (ADR091 D7) is write-only: input.modelApiKey sets it,
# input.clearModelApiKey removes it, and reads see only modelKeySet and
# modelSource.
fragment AgentEnvironmentFields on AgentEnvironment {
  ownerId
  networkTier
  customHosts
  defaultModel
  modelPinned
  pinnedModel
  modelKeySet
  modelSource
  registryHosts
  # When agents pause for approval (ADR100 D3): autonomous | risky | all, and
  # whether a session may start below it.
  approvalMode
  approvalBypassAllowed
  updatedAt
  # Agent-model spend controls (ADR091 D5, D10.1); null when the store is off.
  # agentModelMonthlySpendCapUsd is the effective cap: min(the admin override
  # or plan default, the trust tier's ceiling).
  agentModelMonthlySpendCapUsd
  agentModelPlanSpendCapUsd
  agentModelSpendCapOverrideUsd
  agentModelMaxSpendCapUsd
  agentModelSpendMonthToDateUsd
  agentModelSpendCapTierLimited
  trustTier
  trustTierLocked
  nextChargeThresholdUsd
  # An unpaid failed invoice refuses platform-model requests (D10.3).
  billingBalanceDue
}

query AgentEnvironment($ownerId: String!) {
  agentEnvironment(ownerId: $ownerId) {
    ...AgentEnvironmentFields
  }
}

# Partial update: omitted fields keep their value; customHosts [] clears the
# list and defaultModel "" returns to the provider default.
mutation UpdateAgentEnvironment(
  $ownerId: String!
  $input: AgentEnvironmentInput!
) {
  updateAgentEnvironment(ownerId: $ownerId, input: $input) {
    ...AgentEnvironmentFields
  }
}
