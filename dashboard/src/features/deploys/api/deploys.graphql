# bex-api's deploy-history list (internal/deploys/graphql.go, GraphQL-parity'd
# since w2/m31) — the dedicated Deploys tab's read (w9/002). Same filter args
# as REST's GET .../deploys: status[], createdBefore/After, keyset cursor (a
# previously returned deploy's id), limit. Field selection mirrors
# deploy.graphql so the list rows and the detail header render from the same
# shape.
query Deploys(
  $serviceId: String!
  $status: [String]
  $createdBefore: String
  $createdAfter: String
  $updatedBefore: String
  $updatedAfter: String
  $finishedBefore: String
  $finishedAfter: String
  $cursor: String
  $limit: Int
) {
  deploys(
    serviceId: $serviceId
    status: $status
    createdBefore: $createdBefore
    createdAfter: $createdAfter
    updatedBefore: $updatedBefore
    updatedAfter: $updatedAfter
    finishedBefore: $finishedBefore
    finishedAfter: $finishedAfter
    cursor: $cursor
    limit: $limit
  ) {
    id
    status
    trigger
    image
    imageSha
    rollbackOf
    buildAvailable
    commitId
    commitMessage
    commitCreatedAt
    createdAt
    updatedAt
    startedAt
    finishedAt
    preDeployStatus
    failureReason
    cancelReason
    stallReason
    # The three sentences by code, worded in the dashboard's language
    # (w4/566, w4/591), a hint's or cause's sentences as parts
    # (w5/m356).
    failureReasonTemplate {
      code
      params {
        name
        value
      }
      remainder
      parts {
        code
        text
        params {
          name
          value
        }
      }
    }
    stallReasonTemplate {
      code
      params {
        name
        value
      }
      remainder
      parts {
        code
        text
        params {
          name
          value
        }
      }
    }
    cancelReasonTemplate {
      code
      params {
        name
        value
      }
      remainder
      parts {
        code
        text
        params {
          name
          value
        }
      }
    }
  }
}

# Which of a service's recent deploys ran on a build the registry no longer
# holds (w8/m156). The Events feed has no per-deploy build state of its own,
# so its rows read it from here and offer Rollback only where the build is
# still stored. Newest 100; an older row is not in the map and is decided by
# the server when the rollback is requested.
query DeployBuildAvailability($serviceId: String!) {
  deploys(serviceId: $serviceId, limit: 100) {
    id
    buildAvailable
  }
}
