# bex-api's single-deploy read (internal/deploys/graphql.go, w9/m1/t001) — the
# by-id twin of services/api/events.graphql's list-oriented `deploys(serviceId)`.
# Feeds the deploy detail page's header; field selection mirrors what the
# triggerDeploy/rollbackService mutations already return.
query Deploy($serviceId: String!, $deployId: String!) {
  deploy(serviceId: $serviceId, deployId: $deployId) {
    id
    status
    trigger
    image
    imageSha
    rollbackOf
    buildAvailable
    buildId
    commitId
    commitMessage
    commitCreatedAt
    createdAt
    updatedAt
    startedAt
    finishedAt
    preDeployStatus
    # The Blueprint's one-time initialDeployHook, which runs after the deploy
    # is live (w33/m435): its state, and when it ended. The log panel keeps
    # its window open through the run.
    initialDeployHookStatus
    initialDeployHookFinishedAt
    failureReason
    cancelReason
    stallReason
    # The facts the page's Notices read (w1/m659): a cleared build cache, a
    # move to the free plan, the Blueprint sync that opened the deploy, the
    # rollout budget a failed deploy ran out of, and a reserved port its
    # instance serves HTTP on.
    clearCache
    isTransitionToFreeTier
    blueprintId
    blueprintSyncId
    timedOutSeconds
    reservedPort
    # The three sentences by code, worded in the dashboard's language
    # (w4/566, w4/591), a hint's or cause's sentences as parts
    # (w5/m356).
    failureReasonTemplate {
      code
      params {
        name
        value
      }
      remainder
      parts {
        code
        text
        params {
          name
          value
        }
      }
    }
    stallReasonTemplate {
      code
      params {
        name
        value
      }
      remainder
      parts {
        code
        text
        params {
          name
          value
        }
      }
    }
    cancelReasonTemplate {
      code
      params {
        name
        value
      }
      remainder
      parts {
        code
        text
        params {
          name
          value
        }
      }
    }
  }
}

# Service events inside one deploy's time window. The hook filters the result by
# details.deployId because unrelated audit activity may occur in the same window;
# ServiceEvent.id itself is an evt-… id and is never a deploy id.
query DeployTimelineEvents(
  $serviceId: String!
  $startTime: String
  $endTime: String
  $limit: Int
) {
  serviceEvents(
    serviceId: $serviceId
    startTime: $startTime
    endTime: $endTime
    limit: $limit
  ) {
    id
    type
    timestamp
    details {
      deployId
      deployStatus
    }
  }
}

# One deploy's continued pre-deploy step end (w4/m198): a canceled deploy's
# already-running step may finish after the cancellation closed the deploy, and
# its pre_deploy_ended fact (details.deployId) then marks where that step's
# output really ends. Typed + cursor-paged so the matching fact is found behind
# other deploys' step ends in the same interval.
query DeployPreDeployEnd(
  $serviceId: String!
  $startTime: String
  $endTime: String
  $cursor: String
  $limit: Int
) {
  serviceEvents(
    serviceId: $serviceId
    type: "pre_deploy_ended"
    startTime: $startTime
    endTime: $endTime
    cursor: $cursor
    limit: $limit
  ) {
    id
    timestamp
    cursor
    details {
      deployId
    }
  }
}
