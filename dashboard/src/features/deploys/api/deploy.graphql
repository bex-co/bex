# bex-api's single-deploy read (internal/deploys/graphql.go, w9/m1/t001) — the
# by-id twin of services/api/events.graphql's list-oriented `deploys(serviceId)`.
# Feeds the deploy detail page's header; field selection mirrors what the
# triggerDeploy/rollbackService mutations already return.
query Deploy($serviceId: String!, $deployId: String!) {
  deploy(serviceId: $serviceId, deployId: $deployId) {
    id
    status
    trigger
    image
    rollbackOf
    commitId
    commitMessage
    commitCreatedAt
    createdAt
    updatedAt
    startedAt
    finishedAt
    preDeployStatus
    failureReason
    cancelReason
    stallReason
  }
}

# Service events inside one deploy's time window. The hook filters the result by
# details.deployId because unrelated audit activity may occur in the same window;
# ServiceEvent.id itself is an evt-… id and is never a deploy id.
query DeployTimelineEvents(
  $serviceId: String!
  $startTime: String
  $endTime: String
  $limit: Int
) {
  serviceEvents(
    serviceId: $serviceId
    startTime: $startTime
    endTime: $endTime
    limit: $limit
  ) {
    id
    type
    timestamp
    details {
      deployId
      deployStatus
    }
  }
}

# One deploy's continued pre-deploy step end (w4/m198): a canceled deploy's
# already-running step may finish after the cancellation closed the deploy, and
# its pre_deploy_ended fact (details.deployId) then marks where that step's
# output really ends. Typed + cursor-paged so the matching fact is found behind
# other deploys' step ends in the same interval.
query DeployPreDeployEnd(
  $serviceId: String!
  $startTime: String
  $endTime: String
  $cursor: String
  $limit: Int
) {
  serviceEvents(
    serviceId: $serviceId
    type: "pre_deploy_ended"
    startTime: $startTime
    endTime: $endTime
    cursor: $cursor
    limit: $limit
  ) {
    id
    timestamp
    cursor
    details {
      deployId
    }
  }
}
