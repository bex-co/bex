fragment EnvironmentFields on Environment {
  id
  projectId
  name
  ownerId
  createdAt
  serviceIds
  databaseIds
  keyValueIds
  envGroupIds
  protectedStatus
  networkIsolationEnabled
  ipAllowList
  ipAllowListEntries {
    cidrBlock
    description
  }
  ipAllowListProxiedDomains
}

query Environments($projectId: String!) {
  environments(projectId: $projectId) {
    ...EnvironmentFields
  }
}

# One environment's inbound IP rules, read by every Networking panel of a
# resource in it (w4/m710): Render's "Affected by:" Environment level, and
# the projectId its View rules link needs. Normalized by id, so it shares the
# environments list's cache entry.
query EnvironmentIpAllowList($id: String!) {
  environment(id: $id) {
    id
    projectId
    ipAllowListEntries {
      cidrBlock
      description
    }
  }
}

mutation CreateEnvironment($name: String!, $projectId: String!) {
  createEnvironment(name: $name, projectId: $projectId) {
    ...EnvironmentFields
  }
}

# Render's updateEnvironment patch (w1/m683): only the fields sent change, as
# the environment settings page's cards each save one of them.
mutation UpdateEnvironment(
  $id: String!
  $name: String
  $protectedStatus: String
  $networkIsolationEnabled: Boolean
  $ipAllowListEntries: [IPAllowListEntryInput!]
) {
  updateEnvironment(
    id: $id
    name: $name
    protectedStatus: $protectedStatus
    networkIsolationEnabled: $networkIsolationEnabled
    ipAllowListEntries: $ipAllowListEntries
  ) {
    ...EnvironmentFields
  }
}

mutation DeleteEnvironment($id: String!) {
  deleteEnvironment(id: $id)
}

mutation SetEnvironmentServices($id: String!, $serviceIds: [String!]!) {
  setEnvironmentServices(id: $id, serviceIds: $serviceIds) {
    ...EnvironmentFields
  }
}

mutation SetEnvironmentDatabases($id: String!, $databaseIds: [String!]!) {
  setEnvironmentDatabases(id: $id, databaseIds: $databaseIds) {
    ...EnvironmentFields
  }
}

mutation SetEnvironmentKeyValues($id: String!, $keyValueIds: [String!]!) {
  setEnvironmentKeyValues(id: $id, keyValueIds: $keyValueIds) {
    ...EnvironmentFields
  }
}

mutation SetEnvironmentEnvGroups($id: String!, $envGroupIds: [String!]!) {
  setEnvironmentEnvGroups(id: $id, envGroupIds: $envGroupIds) {
    ...EnvironmentFields
  }
}

