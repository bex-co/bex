# bex-api's registry-credentials surface (backend/internal/registrycreds/graphql.go,
# w2/m14). A workspace's stored credentials for a private external image
# registry, so an existing-image service can pull from a non-public, non-Zot
# source. The secret (authToken) is accepted on create/update but never
# requested by any query here — the server structurally never returns it past
# creation (its read queries don't even carry the column).

query RegistryCredentials {
  registryCredentials {
    id
    name
    host
    username
    expiresAt
    status
    createdAt
  }
}

mutation CreateRegistryCredential(
  $host: String!
  $username: String!
  $authToken: String!
  $name: String
  $expiresAt: String
) {
  createRegistryCredential(
    host: $host
    username: $username
    authToken: $authToken
    name: $name
    expiresAt: $expiresAt
  ) {
    id
    name
    host
    username
    expiresAt
    status
    createdAt
  }
}

mutation DeleteRegistryCredential($id: String!) {
  deleteRegistryCredential(id: $id)
}

# Single-credential detail (w5/m60): the edit dialog prefills name/host/username
# from this read. Host is immutable (not an update arg) but shown for context;
# the secret is never returned (see the header note).
query RegistryCredential($id: String!) {
  registryCredential(id: $id) {
    id
    name
    host
    username
    expiresAt
    status
    createdAt
  }
}

# Edit / rotate (w5/m60): rename, change the username, rotate the token, or
# update the expiry. authToken is write-only — omitting it (or sending null)
# keeps the stored secret; host is immutable so it is not an argument.
mutation UpdateRegistryCredential(
  $id: String!
  $name: String
  $username: String
  $authToken: String
  $expiresAt: String
) {
  updateRegistryCredential(
    id: $id
    name: $name
    username: $username
    authToken: $authToken
    expiresAt: $expiresAt
  ) {
    id
    name
    host
    username
    expiresAt
    status
    createdAt
  }
}
