# bex-api's registry-credentials surface (backend/internal/registrycreds/graphql.go,
# w2/m14). A workspace's stored credentials for a private external image
# registry, so an existing-image service can pull from a non-public, non-Zot
# source. The secret (authToken) is accepted on create/update but never
# requested by any query here — the server structurally never returns it past
# creation (its read queries don't even carry the column).

query RegistryCredentials {
  registryCredentials {
    id
    name
    host
    username
    expiresAt
    status
    createdAt
  }
}

mutation CreateRegistryCredential(
  $host: String!
  $username: String!
  $authToken: String!
  $name: String
  $expiresAt: String
) {
  createRegistryCredential(
    host: $host
    username: $username
    authToken: $authToken
    name: $name
    expiresAt: $expiresAt
  ) {
    id
    name
    host
    username
    expiresAt
    status
    createdAt
  }
}

mutation DeleteRegistryCredential($id: String!) {
  deleteRegistryCredential(id: $id)
}
