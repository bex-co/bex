# Cloud coding-agent sessions — the control-plane metadata surface (ADR047 D9,
# backend/internal/agentsessions/graphql.go). The dashboard polls these ops for
# metadata (phase, PR, turns); the live conversation column is NOT polled — it
# rides the same-origin stream endpoint (w3/m43), never GraphQL.
#
# Key off `phase` (creating/running/resuming/redispatching/completed/failed/
# canceling/canceled), not the free-text `status`. The mint fields
# (ticket/url/expiresAt) are selected ONLY on the mint ops (create/steer/resume/
# attach) — list/get never mint ambient attach authority, so they omit them.

fragment AgentSessionFields on AgentSession {
  id
  ownerId
  repo
  branch
  title
  tags
  maxSpendUSD
  # The automation (ADR101) that started the session, when one did.
  automationId
  # Who started it (w7/m296): a member's identity id or an API key's client id.
  # An automation's sessions carry its creator. Absent on older rows.
  createdBy
  # The lineage (ADR102): the session that spawned this one, the top of its
  # tree, and the distance from that top. Absent/0 on a top-level session.
  parentSessionId
  rootSessionId
  depth
  # Names of the attached secrets (ADR098); values are never readable.
  secretNames
  # The repository environment build (arb-…) the latest turn's sandbox booted
  # from (ADR111 D4); null when it ran the setup steps itself.
  environmentBuildId
  agentConfig {
    agent
    model
    modelEndpoint
    task
    template
  }
  sandboxId
  sshAddress
  phase
  state
  steerable
  outcome {
    state
    steerable
    turn
    summary
    deliveryNote
    failureReasonCode
    result
    cost {
      modelUSD
      computeUSD
      totalUSD
    }
    pullRequest {
      url
      number
      headSha
    }
  }
  status
  headSha
  prUrl
  prNumber
  # The PR's state as bex last read it from GitHub (Devin's
  # pr_state): open (a draft counts as open), merged or closed; null until
  # bex has read it, and for a session with no PR.
  prState
  turns
  deliveryMode
  failureReason
  failureReasonCode
  deliveryNote
  createdAt
  updatedAt
  canceledAt
  archivedAt
}

# A message sent to a session while its turn ran, waiting to run as its own turn
# (ADR047 D12). `position` is its 1-based place (1 runs next); `blockedReason`
# is why the last attempt to run it failed (a spend or live-sandbox limit),
# which the dispatcher retries within seconds. Only pending messages are listed.
fragment AgentSessionQueuedMessageFields on AgentSessionQueuedMessage {
  id
  sessionId
  position
  prompt
  author
  attachmentIds
  blockedReason
  createdAt
}

# The short-lived attach ticket (+ gateway origin + expiry) the browser presents
# to the m43 stream endpoint. Selected ONLY on the mint ops. `url` is the
# phase-2 raw-ACP WebSocket gateway origin — not the phase-1 stream endpoint.
# `streamUrl` is that (w10/m9 t003, w3/013): the server-authoritative
# `<id>/stream` URL, empty when the backend has no BEX_API_PUBLIC_URL
# configured (transport.ts falls back to deriving it locally in that case).
fragment AgentSessionMintFields on AgentSession {
  ticket
  url
  streamUrl
  expiresAt
}

# Secret-free composer readiness. The dashboard uses the individual gates
# rather than `ready`: chat-only sessions require a model key but not GitHub.
query AgentSessionCapabilities($ownerId: String) {
  agentSessionCapabilities(ownerId: $ownerId) {
    enabled
    modelKeyReady
    agents {
      id
    }
    github {
      connected
    }
    attachments {
      enabled
      maxBytes
      maxPerTurn
    }
  }
}

# One filtered page (ADR065 D3): the backend defaults to the unarchived
# working set, newest first, limit 50. `archived` selects false|true|all;
# `cursor` is the prior page's last session id (a shorter/empty page = end).
# `prStates` keeps only sessions whose PR is in one of open|merged|closed
#.
query AgentSessions(
  $ownerId: String
  $archived: String
  $phases: [String!]
  $repo: String
  $tag: String
  $mine: Boolean
  $prStates: [String!]
  $cursor: String
  $limit: Int
) {
  agentSessions(
    ownerId: $ownerId
    archived: $archived
    phases: $phases
    repo: $repo
    tag: $tag
    mine: $mine
    prStates: $prStates
    cursor: $cursor
    limit: $limit
  ) {
    ...AgentSessionFields
  }
}

query AgentSession($id: String!) {
  agentSession(id: $id) {
    ...AgentSessionFields
    # What started each steering turn PR feedback delivered (w9/m344): a PR
    # comment, a review or a failed CI run. Filled on this single read only,
    # so it stays off the list fragment.
    turnOrigins {
      turn
      kind
      author
      url
      baseFailingRef
    }
    # The secrets the latest turn received and why (w9/m385, ADR098 D9):
    # inline, explicit (picked), repo or workspace. Names only. Like
    # turnOrigins it stays off the list fragment.
    appliedSecrets {
      name
      source
    }
  }
}

# The whole spawn tree the session belongs to (ADR102 D8): the root first, then
# by depth and creation. Read by the session page's Agents panel and child
# cards; the list rows never run it.
query AgentSessionTree($id: String!) {
  agentSessionTree(id: $id) {
    rootSessionId
    sessions {
      ...AgentSessionFields
    }
  }
}

# The messages waiting behind the session's turn, next first (ADR047 D12). Its
# own read, not part of AgentSession above: the detail page's poll and every
# lifecycle result write that query whole, and the queue changes on its own
# schedule (each send, edit, move, remove and each dispatch). Single-session
# reads fill it; a list row carries only the count.
query AgentSessionQueue($id: String!) {
  agentSession(id: $id) {
    id
    pendingMessages
    queuedMessages {
      ...AgentSessionQueuedMessageFields
    }
  }
}

mutation CreateAgentSession(
  $ownerId: String
  $repo: String!
  $branch: String!
  $agentConfig: AgentSessionConfigInput!
  $egressAllowlist: [String!]
  $attachmentIds: [String!]
  $idempotencyKey: String
  $maxSpendUSD: Float
  $secretNames: [String!]
  $secrets: [AgentSessionSecretInput!]
  $skills: [AgentSessionSkillInput!]
) {
  createAgentSession(
    ownerId: $ownerId
    repo: $repo
    branch: $branch
    agentConfig: $agentConfig
    egressAllowlist: $egressAllowlist
    attachmentIds: $attachmentIds
    idempotencyKey: $idempotencyKey
    maxSpendUSD: $maxSpendUSD
    secretNames: $secretNames
    secrets: $secrets
    skills: $skills
  ) {
    ...AgentSessionFields
    ...AgentSessionMintFields
    created
  }
}

# A steer on a session whose turn is running (or that has messages waiting) is
# queued, not refused (ADR047 D12): `queuedMessage` is then the queued message,
# and null when the steer started a turn. `idempotencyKey` makes a retried send
# of a queued message harmless.
mutation SteerAgentSession(
  $id: String!
  $prompt: String!
  $egressAllowlist: [String!]
  $attachmentIds: [String!]
  $skills: [AgentSessionSkillInput!]
  $idempotencyKey: String
) {
  steerAgentSession(
    id: $id
    prompt: $prompt
    egressAllowlist: $egressAllowlist
    attachmentIds: $attachmentIds
    skills: $skills
    idempotencyKey: $idempotencyKey
  ) {
    ...AgentSessionFields
    ...AgentSessionMintFields
    queuedMessage {
      ...AgentSessionQueuedMessageFields
    }
  }
}

mutation ResumeAgentSession($id: String!) {
  resumeAgentSession(id: $id) {
    ...AgentSessionFields
    ...AgentSessionMintFields
  }
}

# Reconnect mint (m43): re-issues a stream ticket for an already-running session
# so a dropped browser can re-attach without a fresh turn (prepareReconnect...).
mutation AttachAgentSession($id: String!) {
  attachAgentSession(id: $id) {
    ...AgentSessionFields
    ...AgentSessionMintFields
  }
}

mutation CancelAgentSession($id: String!) {
  cancelAgentSession(id: $id) {
    ...AgentSessionFields
  }
}

# Stop turn (ADR047 D12): ends only the running turn, never the session. The
# call answers once the request is delivered; the turn settles within about 15
# seconds as completed with the turn interrupted, and the session stays
# steerable with its queue in place. Cancel, above, is the terminal verb.
# AGENT_SESSION_NO_TURN_RUNNING when idle; AGENT_SESSION_TURN_STARTING while the
# turn's sandbox is not up yet.
mutation InterruptAgentSession($id: String!) {
  interruptAgentSession(id: $id) {
    ...AgentSessionFields
  }
}

# Replaces a pending message's prompt; the turn then runs as the editor.
# AGENT_QUEUED_MESSAGE_DISPATCHED once it has started, and
# AGENT_QUEUED_MESSAGE_ATTACHMENTS_OWNED for anyone but the sender of a
# message that carries attachments.
mutation EditQueuedAgentSessionMessage(
  $id: String!
  $messageId: String!
  $prompt: String!
) {
  editQueuedAgentSessionMessage(
    id: $id
    messageId: $messageId
    prompt: $prompt
  ) {
    ...AgentSessionQueuedMessageFields
  }
}

mutation DeleteQueuedAgentSessionMessage($id: String!, $messageId: String!) {
  deleteQueuedAgentSessionMessage(id: $id, messageId: $messageId)
}

# Puts a pending message at a 1-based place (1 runs next; past the end is last)
# and answers the whole queue, next first.
mutation MoveQueuedAgentSessionMessage(
  $id: String!
  $messageId: String!
  $position: Int!
) {
  moveQueuedAgentSessionMessage(
    id: $id
    messageId: $messageId
    position: $position
  ) {
    ...AgentSessionQueuedMessageFields
  }
}

# ADR065 D1 archive: list-state only — the session leaves the working set
# (mutation verbs 409 AGENT_SESSION_ARCHIVED until unarchived) but stays
# viewable, transcript included.
mutation ArchiveAgentSession($id: String!) {
  archiveAgentSession(id: $id) {
    ...AgentSessionFields
  }
}

# Replaces all of a session's tags (w7/m296, Devin's PUT …/tags); [] clears them.
mutation SetAgentSessionTags($id: String!, $tags: [String!]!) {
  setAgentSessionTags(id: $id, tags: $tags) {
    ...AgentSessionFields
  }
}

mutation UnarchiveAgentSession($id: String!) {
  unarchiveAgentSession(id: $id) {
    ...AgentSessionFields
  }
}

# ADR065 D4 hard delete: row + transcript destroyed; terminal sessions only
# (live phases must cancel first). Irreversible.
mutation DeleteAgentSession($id: String!) {
  deleteAgentSession(id: $id)
}

# One tool call's complete output (w10/m18, ADR051 amendment 2026-10-27). A
# replayed tool part flagged `resultProviderMetadata["bex-transcript"].fullOutput`
# (a terminal snapshot: `data.fullOutput`) stores only a head and tail inline;
# "Show full output" loads the rest on demand. Not found
# (AGENT_SESSION_TOOL_OUTPUT_NOT_FOUND) when no full copy was kept.
query AgentSessionToolOutput($id: String!, $turn: Int!, $toolCallId: String!) {
  agentSessionToolOutput(id: $id, turn: $turn, toolCallId: $toolCallId) {
    sessionId
    turn
    toolCallId
    outputs {
      field
      text
    }
  }
}

# What a session's bex-provided model requests cost (ADR091 D6): the total
# (provider cost + 30%) and each turn's cost and tokens. A session on the
# workspace's own model key records none; its provider bills it.
# The turns' structured-output state (ADR094 D5, w21/003) without any parts: an
# afterSeq past every part leaves the page's `parts` empty, so the poll that
# watches a running turn's draft `result` stays small. `outcome.result` carries
# the final value; this carries the partial one.
query AgentSessionTurnResults($id: String!) {
  agentSessionTranscript(id: $id, afterSeq: 2147483647, limit: 1) {
    turns {
      turn
      outputSchema
      result
      resultFinal
    }
  }
}

# The workspace skills each turn invoked (ADR099 D4), for the transcript's
# pills. Like AgentSessionTurnResults, the afterSeq past every part keeps the
# page to its turns.
query AgentSessionTurnSkills($id: String!) {
  agentSessionTranscript(id: $id, afterSeq: 2147483647, limit: 1) {
    turns {
      turn
      skills {
        name
        arguments
      }
    }
  }
}

# Which turns a person stopped with Stop turn (ADR047 D12), so the transcript
# can mark them "interrupted" rather than leave them looking cut off. Like the
# two turn reads above it pages past every part. Its page size differs from
# theirs (limit 2, not 1) only to keep it under its own cache key: `turns` has
# no identity to merge by, so reads of one key that select different fields can
# replace each other's list.
query AgentSessionTurnInterrupts($id: String!) {
  agentSessionTranscript(id: $id, afterSeq: 2147483647, limit: 2) {
    turns {
      turn
      interrupted
    }
  }
}

query AgentSessionModelCost($id: String!) {
  agentSessionModelCost(id: $id) {
    sessionId
    modelSource
    costUsd
    requests
    turns {
      turn
      costUsd
      requests
      inputTokens
      outputTokens
      cacheReadTokens
      cacheWriteTokens
      models
    }
  }
}

# One attachment with a fresh 15-minute downloadUrl on the storage origin
# (ADR095 D7). The conversation reads this per rendered attachment and
# refetches when an expired URL fails to load.
query AgentAttachment($id: String!) {
  agentAttachment(id: $id) {
    id
    sessionId
    direction
    name
    mediaType
    size
    downloadUrl
  }
}

# A session's files, inputs and agent outputs, oldest first, one keyset page
# at a time (ADR095 D10 Files sheet). The cursor is the previous page's last
# id. No downloadUrl: a click signs a fresh one (AgentAttachment).
query AgentSessionAttachments($id: String!, $cursor: String, $limit: Int) {
  agentSessionAttachments(id: $id, cursor: $cursor, limit: $limit) {
    id
    direction
    turn
    name
    mediaType
    size
    createdAt
  }
}
