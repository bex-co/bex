# Cloud coding-agent sessions — the control-plane metadata surface (ADR047 D9,
# backend/internal/agentsessions/graphql.go). The dashboard polls these ops for
# metadata (phase, PR, turns); the live conversation column is NOT polled — it
# rides the same-origin stream endpoint (w3/m43), never GraphQL.
#
# Key off `phase` (creating/running/resuming/redispatching/completed/failed/
# canceling/canceled), not the free-text `status`. The mint fields
# (ticket/url/expiresAt) are selected ONLY on the mint ops (create/steer/resume/
# attach) — list/get never mint ambient attach authority, so they omit them.

fragment AgentSessionFields on AgentSession {
  id
  ownerId
  repo
  branch
  title
  tags
  maxSpendUSD
  # Names of the attached secrets (ADR098); values are never readable.
  secretNames
  agentConfig {
    agent
    model
    modelEndpoint
    task
    template
  }
  sandboxId
  sshAddress
  phase
  state
  # Why a needs_input turn is paused (ADR100 D1): approval | user.
  waitingFor
  # The session's approval mode (ADR100 D3), fixed at create.
  approvalMode
  steerable
  outcome {
    state
    steerable
    turn
    waitingFor
    # The oldest open decision (ADR100 D2); filled on the single-session read,
    # null on a list read (the cache keeps the detail read's copy).
    pendingDecision {
      id
      kind
      title
      detail
      state
      createdAt
      expiresAt
    }
    summary
    deliveryNote
    failureReasonCode
    result
    cost {
      modelUSD
    }
    pullRequest {
      url
      number
      headSha
    }
  }
  status
  headSha
  prUrl
  prNumber
  turns
  deliveryMode
  failureReason
  failureReasonCode
  deliveryNote
  createdAt
  updatedAt
  canceledAt
  archivedAt
}

# The short-lived attach ticket (+ gateway origin + expiry) the browser presents
# to the m43 stream endpoint. Selected ONLY on the mint ops. `url` is the
# phase-2 raw-ACP WebSocket gateway origin — not the phase-1 stream endpoint.
# `streamUrl` is that (w10/m9 t003, w3/013): the server-authoritative
# `<id>/stream` URL, empty when the backend has no BEX_API_PUBLIC_URL
# configured (transport.ts falls back to deriving it locally in that case).
fragment AgentSessionMintFields on AgentSession {
  ticket
  url
  streamUrl
  expiresAt
}

# Secret-free composer readiness. The dashboard uses the individual gates
# rather than `ready`: chat-only sessions require a model key but not GitHub.
query AgentSessionCapabilities($ownerId: String) {
  agentSessionCapabilities(ownerId: $ownerId) {
    enabled
    modelKeyReady
    github {
      connected
    }
    attachments {
      enabled
      maxBytes
      maxPerTurn
    }
  }
}

# One filtered page (ADR065 D3): the backend defaults to the unarchived
# working set, newest first, limit 50. `archived` selects false|true|all;
# `cursor` is the prior page's last session id (a shorter/empty page = end).
query AgentSessions(
  $ownerId: String
  $archived: String
  $phases: [String!]
  $states: [String!]
  $repo: String
  $tag: String
  $cursor: String
  $limit: Int
) {
  agentSessions(
    ownerId: $ownerId
    archived: $archived
    phases: $phases
    states: $states
    repo: $repo
    tag: $tag
    cursor: $cursor
    limit: $limit
  ) {
    ...AgentSessionFields
  }
}

query AgentSession($id: String!) {
  agentSession(id: $id) {
    ...AgentSessionFields
  }
}

mutation CreateAgentSession(
  $ownerId: String
  $repo: String!
  $branch: String!
  $agentConfig: AgentSessionConfigInput!
  $egressAllowlist: [String!]
  $attachmentIds: [String!]
  $idempotencyKey: String
  $maxSpendUSD: Float
  $secretNames: [String!]
  $secrets: [AgentSessionSecretInput!]
  $skills: [AgentSessionSkillInput!]
  $approvalMode: String
  $bypassApproval: Boolean
) {
  createAgentSession(
    ownerId: $ownerId
    repo: $repo
    branch: $branch
    agentConfig: $agentConfig
    egressAllowlist: $egressAllowlist
    attachmentIds: $attachmentIds
    idempotencyKey: $idempotencyKey
    maxSpendUSD: $maxSpendUSD
    secretNames: $secretNames
    secrets: $secrets
    skills: $skills
    approvalMode: $approvalMode
    bypassApproval: $bypassApproval
  ) {
    ...AgentSessionFields
    ...AgentSessionMintFields
    created
  }
}

mutation SteerAgentSession(
  $id: String!
  $prompt: String!
  $egressAllowlist: [String!]
  $attachmentIds: [String!]
  $skills: [AgentSessionSkillInput!]
) {
  steerAgentSession(
    id: $id
    prompt: $prompt
    egressAllowlist: $egressAllowlist
    attachmentIds: $attachmentIds
    skills: $skills
  ) {
    ...AgentSessionFields
    ...AgentSessionMintFields
  }
}

mutation ResumeAgentSession($id: String!) {
  resumeAgentSession(id: $id) {
    ...AgentSessionFields
    ...AgentSessionMintFields
  }
}

# Reconnect mint (m43): re-issues a stream ticket for an already-running session
# so a dropped browser can re-attach without a fresh turn (prepareReconnect...).
mutation AttachAgentSession($id: String!) {
  attachAgentSession(id: $id) {
    ...AgentSessionFields
    ...AgentSessionMintFields
  }
}

mutation CancelAgentSession($id: String!) {
  cancelAgentSession(id: $id) {
    ...AgentSessionFields
  }
}

# ADR065 D1 archive: list-state only — the session leaves the working set
# (mutation verbs 409 AGENT_SESSION_ARCHIVED until unarchived) but stays
# viewable, transcript included.
mutation ArchiveAgentSession($id: String!) {
  archiveAgentSession(id: $id) {
    ...AgentSessionFields
  }
}

mutation UnarchiveAgentSession($id: String!) {
  unarchiveAgentSession(id: $id) {
    ...AgentSessionFields
  }
}

# ADR065 D4 hard delete: row + transcript destroyed; terminal sessions only
# (live phases must cancel first). Irreversible.
mutation DeleteAgentSession($id: String!) {
  deleteAgentSession(id: $id)
}

# One tool call's complete output (w10/m18, ADR051 amendment 2026-10-27). A
# replayed tool part flagged `resultProviderMetadata["bex-transcript"].fullOutput`
# (a terminal snapshot: `data.fullOutput`) stores only a head and tail inline;
# "Show full output" loads the rest on demand. Not found
# (AGENT_SESSION_TOOL_OUTPUT_NOT_FOUND) when no full copy was kept.
query AgentSessionToolOutput($id: String!, $turn: Int!, $toolCallId: String!) {
  agentSessionToolOutput(id: $id, turn: $turn, toolCallId: $toolCallId) {
    sessionId
    turn
    toolCallId
    outputs {
      field
      text
    }
  }
}

# What a session's bex-provided model requests cost (ADR091 D6): the total
# (provider cost + 30%) and each turn's cost and tokens. A session on the
# workspace's own model key records none; its provider bills it.
# The turns' structured-output state (ADR094 D5, w21/003) without any parts: an
# afterSeq past every part leaves the page's `parts` empty, so the poll that
# watches a running turn's draft `result` stays small. `outcome.result` carries
# the final value; this carries the partial one.
query AgentSessionTurnResults($id: String!) {
  agentSessionTranscript(id: $id, afterSeq: 2147483647, limit: 1) {
    turns {
      turn
      outputSchema
      result
      resultFinal
    }
  }
}

# The workspace skills each turn invoked (ADR099 D4), for the transcript's
# pills. Like AgentSessionTurnResults, the afterSeq past every part keeps the
# page to its turns.
query AgentSessionTurnSkills($id: String!) {
  agentSessionTranscript(id: $id, afterSeq: 2147483647, limit: 1) {
    turns {
      turn
      skills {
        name
        arguments
      }
    }
  }
}

query AgentSessionModelCost($id: String!) {
  agentSessionModelCost(id: $id) {
    sessionId
    modelSource
    costUsd
    requests
    turns {
      turn
      costUsd
      requests
      inputTokens
      outputTokens
      cacheReadTokens
      cacheWriteTokens
      models
    }
  }
}

# One attachment with a fresh 15-minute downloadUrl on the storage origin
# (ADR095 D7). The conversation reads this per rendered attachment and
# refetches when an expired URL fails to load.
query AgentAttachment($id: String!) {
  agentAttachment(id: $id) {
    id
    sessionId
    direction
    name
    mediaType
    size
    downloadUrl
  }
}

# A session's files, inputs and agent outputs, oldest first, one keyset page
# at a time (ADR095 D10 Files sheet). The cursor is the previous page's last
# id. No downloadUrl: a click signs a fresh one (AgentAttachment).
query AgentSessionAttachments($id: String!, $cursor: String, $limit: Int) {
  agentSessionAttachments(id: $id, cursor: $cursor, limit: $limit) {
    id
    direction
    turn
    name
    mediaType
    size
    createdAt
  }
}

# Answer a pending decision (ADR100 D2): {allow, scope} approves or denies an
# approval ("session" also allows the same rule for the rest of the session),
# {answer} replies to a question. Idempotent by decision id; a second answer is
# AGENT_SESSION_DECISION_ANSWERED and a late one AGENT_SESSION_DECISION_EXPIRED.
mutation AnswerAgentSessionDecision(
  $id: String!
  $decisionId: String!
  $allow: Boolean
  $scope: String
  $answer: String
) {
  answerAgentSessionDecision(
    id: $id
    decisionId: $decisionId
    allow: $allow
    scope: $scope
    answer: $answer
  ) {
    id
    state
    answeredAt
  }
}
