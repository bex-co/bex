# dev-__N__ overlay for Ory Kratos (workstream w__N__) — layered on top of the
# repo's own ../../../../deploy/gitops/base/values/kratos.values.yaml (helm
# -f order: base first, this second, later wins), the same later-wins pattern
# deploy/gitops/overlays/local/values/kratos.values.yaml uses for the shared
# cluster's "auth" namespace. Same idea, different ports/namespace so it
# never collides with the shared cluster's Kratos on :5173/:4433, nor with
# any other workstream's dev-N (ui_url and allowed_return_urls are
# single-valued / allowlist entries — two dashboards on two different ports
# cannot share one Kratos deployment cleanly).
#
# Rendered per N by scripts/dev-env.sh, which substitutes the ports it derives —
# so a port change lands in one place instead of ten values files (w1/m72):
#   dashboard  -> http://localhost:__DASHBOARD_PORT__
#   kratos-public port-forward -> http://localhost:__KRATOS_PUBLIC_PORT__
kratos:
  config:
    oauth2_provider:
      url: http://hydra-admin.__DEV_AUTH_NS__.svc.cluster.local:4445
    serve:
      public:
        base_url: http://localhost:__KRATOS_PUBLIC_PORT__/
        cors:
          enabled: true
          allowed_origins:
            - http://localhost:__DASHBOARD_PORT__
          allow_credentials: true
    selfservice:
      default_browser_return_url: http://localhost:__DASHBOARD_PORT__/
      allowed_return_urls:
        - http://localhost:__DASHBOARD_PORT__
      methods:
        password:
          config:
            # LOCAL DEV ONLY. Kratos's password method checks every new password
            # against haveibeenpwned.com's range API on the registration request
            # path. From a CAPD pod that round trip is slow enough to blow the
            # client deadline, and Kratos then fails the whole flow with a 500
            # ("Unable to initialize string scanner: context deadline exceeded")
            # — registration is impossible and the cause is not obvious from the
            # browser, which only sees a generic internal error.
            #
            # Disabled here so a local dev-N can create an account offline. This
            # values file is the dev-N overlay only; production Kratos keeps the
            # breach check (deploy/gitops/base/values/kratos.values.yaml).
            haveibeenpwned_enabled: false
        webauthn:
          config:
            rp:
              id: localhost
              origins:
                - http://localhost:__DASHBOARD_PORT__
      flows:
        login:
          ui_url: http://localhost:__DASHBOARD_PORT__/auth/login
        registration:
          enabled: true
          ui_url: http://localhost:__DASHBOARD_PORT__/auth/sign-up
        recovery:
          enabled: true
          ui_url: http://localhost:__DASHBOARD_PORT__/auth/forgot-password
        settings:
          ui_url: http://localhost:__DASHBOARD_PORT__/settings
        verification:
          enabled: true
          ui_url: http://localhost:__DASHBOARD_PORT__/auth/verification
        error:
          ui_url: http://localhost:__DASHBOARD_PORT__/auth/error
    session:
      cookie:
        domain: ""
        same_site: Lax
