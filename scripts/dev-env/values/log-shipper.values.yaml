# dev-__N__ log-shipper values — the local counterpart of
# deploy/gitops/base/log-shipper.yaml's Argo Application (w5/m62). A Grafana
# Alloy DaemonSet that tails tenant App pod logs into dev-__N__'s Loki with exactly
# the labels bex-api's LogQL selects on (namespace/app/pod/container/type=app —
# see lokiSelectorFor, docs/ADR010-observability.md § Log labels), so a dev-__N__
# service's logs read back through bex-api's log verbs (non-503) instead of only
# the live-pod-log fallback.
#
# Deliberately MINIMAL vs the prod shipper: only the `type=app` pipeline. dev-__N__
# proves the store-gated log path end to end; the prod shipper's datastore /
# build / Traefik-request pipelines (and its JSON-`level` parsing) are prod-scale
# concerns and stay out — dev-__N__'s `level` defaults to `unknown` (the honest
# answer of a shipper that doesn't parse it), and the request-log (type=request)
# pipeline that w5/m58's host/path metrics need is the prod-only residue m62's
# note 028 names. No double-brace River template stages here, so no Helm-tpl
# escaping is needed (the fragile part of the prod config).
fullnameOverride: log-shipper
# The prod shipper's image (deploy/gitops/base/log-shipper.yaml): app_logs'
# stage.limit below needs its carried refill_by_entry_timestamp (w8/m525).
image:
  registry: ghcr.io
  repository: bex-co/bex-alloy
  digest: sha256:56d02b11e69b375e373badce2fbaf91d9a4a93a0ae656350bfabf2658d99c044
controller:
  type: daemonset
  tolerations:
    - operator: Exists # tail on every node (control-plane included)
alloy:
  configMap:
    content: |-
      // Node-scoped, as in prod (w3/m13): each replica tails only its own
      // node's pods, so a line ships once and its pod's line cap (below) is
      // one bucket, not one per node. The chart sets K8S_NODE_NAME itself.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
        }
      }

      // type=app: tenant App container logs (labelled app.bex.co/app).
      discovery.relabel "app_pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_bex_co_app"]
          regex         = ""
          action        = "drop"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_bex_co_app"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "app_pods" {
        targets    = discovery.relabel.app_pods.output
        forward_to = [loki.process.app_logs.receiver]
      }

      loki.process "app_logs" {
        // Render's per-instance cap, as the prod shipper keeps it (w3/m506):
        // 6,000 application lines a minute per pod, the excess dropped and
        // counted. bex-api's live tail applies the same bucket, and both
        // count each line at its own timestamp (w8/m525).
        stage.limit {
          rate                      = 100
          burst                     = 6000
          by_label_name             = "pod"
          max_distinct_labels       = 10000
          drop                      = true
          refill_by_entry_timestamp = true
        }
        // dev-__N__ minimal: no JSON `level` parse (prod does) — default to unknown,
        // the honest value, and stamp Render's `type` vocabulary.
        stage.static_labels {
          values = {
            type  = "app",
            level = "unknown",
          }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }
  resources:
    requests: { cpu: 25m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }
serviceMonitor: { enabled: false }
