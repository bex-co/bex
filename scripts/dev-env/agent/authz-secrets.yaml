# LOCAL-DEV OpenFGA + OpenBao for `dev-env.sh N agent-up`, both in __DEV_AUTH_NS__
# so they share the workstream's isolation boundary with Kratos/Hydra/Mailpit.
#
# WHY THESE EXIST AT ALL — the base `dev-env.sh N up` deliberately runs without
# either (see .pm/wN/dev-N/README.md "What's deliberately NOT duplicated"):
# bex-api treats an unset BEX_OPENFGA_URL as authz allow-all and an unset
# BEX_OPENBAO_URL as "env-vars verbs 503", which is enough for the datastore CRUD
# flows that environment targets. The agent-session path needs both for real:
#
#   * OpenFGA — lego/backend/cmd/ssh-gateway/main.go calls
#     requiredEnv("BEX_OPENFGA_URL"). The gateway has NO allow-all escape hatch
#     (bex-api's BEX_ALLOW_INSECURE_AUTHZ is bex-api-only), and it re-checks the
#     session relation at ticket redemption. If bex-api ran allow-all while the
#     gateway asked OpenFGA, every attach would be denied against an empty store
#     — so agent-up points BOTH at this instance.
#   * OpenBao — the BYO model key lives at agent-sessions/<ws>/model-key
#     (ADR062); the gateway mints it per exchange. bex-api reads the same path
#     for the `modelKeyReady` capability that gates a session as launchable.
#
# Both run at local scale with EPHEMERAL storage: OpenFGA on its in-memory
# datastore, OpenBao in `server -dev` mode. Tuples and secrets therefore do not
# survive a pod restart, which is why `agent-up` re-seeds both every run.
#
# OpenBao dev mode is also what keeps this environment away from
# scripts/bao-init.sh: that script writes BAO_ROOT_TOKEN and the unseal quorum
# into the repo's `.env`, which holds the PRODUCTION OpenBao credentials. Pointing
# it at a throwaway local cluster would overwrite them. Dev mode needs no init,
# no unseal, and no `.env` write at all.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfga
  namespace: __DEV_AUTH_NS__
  labels:
    app.kubernetes.io/name: openfga
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openfga
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openfga
    spec:
      # Same OrbStack+Calico constraint as coredns in scripts/mock-cluster.sh:
      # keep apiserver-independent workloads reachable by pinning to the
      # control-plane node, where cross-node service routing is not involved.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: openfga
          image: openfga/openfga:v1.8.3
          args: ["run"]
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: memory
            - name: OPENFGA_AUTHN_METHOD
              value: preshared
            - name: OPENFGA_AUTHN_PRESHARED_KEYS
              value: __OPENFGA_KEY__
            - name: OPENFGA_HTTP_ADDR
              value: "0.0.0.0:8080"
            - name: OPENFGA_GRPC_ADDR
              value: "0.0.0.0:8081"
            - name: OPENFGA_PLAYGROUND_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: openfga
  namespace: __DEV_AUTH_NS__
spec:
  selector:
    app.kubernetes.io/name: openfga
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 8081
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  namespace: __DEV_AUTH_NS__
  labels:
    app.kubernetes.io/name: openbao
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: openbao
          image: openbao/openbao:2.4.1
          args: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
          env:
            - name: BAO_DEV_ROOT_TOKEN_ID
              value: __BAO_DEV_TOKEN__
            # OpenBao's Kubernetes auth method verifies sandbox/bex-api tokens
            # through the apiserver's TokenReview API using its OWN pod token,
            # so it needs no explicit reviewer JWT here.
            - name: BAO_ADDR
              value: http://127.0.0.1:8200
          ports:
            - name: http
              containerPort: 8200
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            capabilities:
              # OpenBao mlock()s its memory; dev mode disables that, but the
              # image still probes for the capability at startup.
              add: ["IPC_LOCK"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: __DEV_AUTH_NS__
spec:
  selector:
    app.kubernetes.io/name: openbao
  ports:
    - name: http
      port: 8200
      targetPort: http
---
# OpenBao's `kubernetes` auth method calls TokenReview to verify the JWT a
# client presents. Its own ServiceAccount must therefore hold the
# system:auth-delegator ClusterRole, exactly as the production chart's
# server.authDelegator does.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-auth-delegator-__DEV_NS__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: default
    namespace: __DEV_AUTH_NS__
