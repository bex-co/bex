# LOCAL-DEV BatchSandbox template for `dev-env.sh N agent-up`.
#
# Sibling of deploy/opensandbox/batchsandbox-template.yaml with the three
# hosted-only scheduling constraints adjusted for the CAPD mock cluster:
#   - runtimeClassName: gvisor   (no runsc handler on a kind node)
#   - nodeSelector bex.co/pool=sandbox
#   - toleration     bex.co/sandbox
# The local replacement pins the pod to the control-plane node. Under
# OrbStack+Calico the in-cluster gateway is pinned there too, and cross-node
# Pod routing is unreliable; co-location keeps gateway -> driver :8787 stable.
#
# The `app.bex.co/regime: sandbox` label is KEPT: bex-api's namespace
# reconciler, the gateway's pod checks, and the sandbox NetworkPolicies all key
# off it, so dropping it would diverge from the code under test.
metadata:
  labels:
    app.bex.co/regime: sandbox
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app.bex.co/regime: sandbox
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
