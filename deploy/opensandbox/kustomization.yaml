apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - gvisor-runtimeclass.yaml
  - server-in-cluster.yaml

generatorOptions:
  labels:
    app.kubernetes.io/part-of: bex

configMapGenerator:
  - name: opensandbox-config
    namespace: opensandbox-system
    files:
      - sandbox-cluster.toml
      - batchsandbox-template.yaml

images:
  # Fail-closed bootstrap placeholder. deploy.yml replaces this with the
  # pushed, signed, scanned manifest digest before applying GitOps. A fresh
  # checkout can never race Argo into pulling a mutable release tag.
  - name: opensandbox-server
    newName: ghcr.io/bex-co/opensandbox-server
    digest: sha256:714b6a9d676bd665e168bd1bc8d1e01ef2f25e1cf59f1ef0c102f0c4fd3cfceb
