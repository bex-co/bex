# Example BatchSandbox CR template for OpenSandbox Kubernetes runtime
# This is a complete BatchSandbox CR template that will be merged with runtime values
#
# Usage in config.toml:
#   [kubernetes]
#   batchsandbox_template_file = "/path/to/this/file.yaml"

# Metadata template (will be merged with runtime-generated metadata)
metadata:
  labels:
    app.bex.co/regime: sandbox
# Spec template
spec:
  replicas: 1
  # Pod template specification
  template:
    metadata:
      labels:
        app.bex.co/regime: sandbox
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      # A sandbox started from an imported image (w2/m358) pulls it from its
      # workspace's snapshot repositories with the namespace's own read-only
      # Secret, the one the operator mints and the controller's resume pull
      # uses (--resume-pull-secret). Guarded by scripts/gitops-validate.sh.
      imagePullSecrets:
        - name: bex-snapshot-pull
      nodeSelector:
        bex.co/pool: sandbox
      restartPolicy: Never
      # A sandbox's DNS policy admits only the names it may reach, and Cilium
      # answers every other query REFUSED. With the kubelet's default ndots:5 a
      # program first asks `example.com.<ns>.svc.cluster.local`; musl (the
      # Alpine base image) takes that refusal as the lookup's answer, so no
      # listed name resolved (w8/m152). ndots:1 asks a dotted name as an
      # absolute name first. Guarded by scripts/gitops-validate.sh.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      tolerations:
        - key: bex.co/sandbox
          operator: Equal
          value: "true"
          effect: NoSchedule
        # A sandbox outlives a short node stall: the cluster default evicts a
        # pod 45 s after its node goes NotReady or unreachable, which ended
        # agent sessions over a brief kubelet or network hiccup (w9/m349
        # t006). 300 s stays under the sandbox MachineHealthCheck's 600 s, so
        # a node that is really gone is still replaced.
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
