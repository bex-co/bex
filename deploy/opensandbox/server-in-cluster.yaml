# In-cluster OpenSandbox lifecycle server (ADR042 D1 / w3/m32 t002).
#
# GitOps owns this server and its security configuration. Sandbox Pods run in
# per-tenant `<ws>-sandbox` baseline-PSS namespaces; gVisor is the host boundary.
# The HTTP tenant provider authenticates every per-workspace key, so the server
# must never run with OPENSANDBOX_INSECURE_SERVER or a shared server API key.
# bex-api's
# BEX_OPENSANDBOX_URL points at the Service below
# (http://opensandbox-server.opensandbox-system.svc:8077).
---
apiVersion: v1
kind: Namespace
metadata:
  name: opensandbox-system
  labels:
    app.kubernetes.io/part-of: bex
    # Trusted platform namespace: only bex-api may reach the server (t006
    # NetworkPolicy). Tenant/sandbox pods are denied.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensandbox-server
  namespace: opensandbox-system
---
# Cluster-wide authority is informer-only. All mutation comes exclusively from
# the per-`<ws>-sandbox` RoleBindings stamped by the NamespaceReconciler.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # Keep the pre-GitOps object name so Argo converges the previously hand-applied
  # mutation role in place instead of leaving it active beside a new role.
  name: opensandbox-server
rules:
  - apiGroups: ["sandbox.opensandbox.io"]
    resources: ["batchsandboxes", "pools", "sandboxsnapshots"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  # OpenSandbox resolves and verifies secure_runtime at startup. RuntimeClass
  # is cluster-scoped, but only an exact-name read is needed by the client.
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    resourceNames: ["gvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opensandbox-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opensandbox-server
subjects:
  - kind: ServiceAccount
    name: opensandbox-server
    namespace: opensandbox-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opensandbox-store
  namespace: opensandbox-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensandbox-server
  namespace: opensandbox-system
  labels:
    app.kubernetes.io/name: opensandbox-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opensandbox-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensandbox-server
    spec:
      serviceAccountName: opensandbox-server
      nodeSelector:
        bex.co/pool: platform
      tolerations:
        - key: bex.co/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-config
          image: opensandbox-server:0.2.2
          command:
            - python
            - -c
            - |
              import os
              import re
              from pathlib import Path
              source = Path("/config-template/sandbox-cluster.toml").read_text()
              marker = "__BEX_CP_TOKEN__"
              token = os.environ["BEX_CP_TOKEN"]
              if source.count(marker) != 1:
                  raise SystemExit("sandbox config must contain exactly one token marker")
              if not re.fullmatch(r"[A-Za-z0-9._~-]{32,256}", token):
                  raise SystemExit("control-plane token has an unsafe format")
              Path("/rendered/sandbox-cluster.toml").write_text(source.replace(marker, token))
          env:
            - name: BEX_CP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opensandbox-server-auth
                  key: cp_token
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: rendered-config
              mountPath: /rendered
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      containers:
        - name: server
          # CI rewrites the kustomize image to the pushed content digest.
          image: opensandbox-server:0.2.2
          args: ["--config", "/etc/opensandbox/sandbox-cluster.toml"]
          ports:
            - name: http
              containerPort: 8077
          volumeMounts:
            - name: rendered-config
              mountPath: /etc/opensandbox
              readOnly: true
            - name: store
              mountPath: /var/lib/opensandbox
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config-template
          configMap:
            name: opensandbox-config
        - name: rendered-config
          emptyDir: {}
        - name: store
          persistentVolumeClaim:
            claimName: opensandbox-store
---
apiVersion: v1
kind: Service
metadata:
  name: opensandbox-server
  namespace: opensandbox-system
spec:
  selector:
    app.kubernetes.io/name: opensandbox-server
  ports:
    - name: http
      port: 8077
      targetPort: http
---
# Defense-in-depth ingress default deny. The positive allow is the Cilium
# `opensandbox-server-ingress` policy in tenant-node-egress.yaml, which matches
# bex-api's namespace, ServiceAccount, and workload label. A portable Kubernetes
# NetworkPolicy cannot authenticate the source ServiceAccount and would allow a
# label-spoofing Pod, so it deliberately contains no positive rule here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  # Preserve the legacy object name so the former label-only allow is replaced
  # rather than surviving as an additive policy beside this deny.
  name: admit-only-bex-api
  namespace: opensandbox-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opensandbox-server
  policyTypes: ["Ingress"]
  # Explicit empty list overwrites the legacy object's positive rule even when
  # that hand-applied object has no Argo/client-side last-applied annotation.
  ingress: []
