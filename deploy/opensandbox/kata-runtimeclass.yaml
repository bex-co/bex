# Kata microVM RuntimeClass for untrusted sandbox workloads (ADR042 D3 / w3/m32
# t004). Sandbox pods set `runtimeClassName: kata` so agent-generated code runs
# under a hypervisor boundary, not just a container (ADR042 "Isolation = Kata now").
#
# NOT wired into deploy/gitops/base/kustomization.yaml yet: the `kata` handler
# must first exist on the nodes — i.e. `kata-containerd` baked into the CAPH
# worker image and a containerd `[plugins.'io.containerd.grpc.v1.cri'.containerd
# .runtimes.kata]` config on the dedicated `bex-sandbox` node pool (the other
# half of t004). Applying this before the handler exists is harmless (it just
# can't schedule kata pods), but it stays unwired until the node image ships so
# the gitops tree never advertises a runtime the fleet can't honor.
#
# The dedicated pool is tainted `bex.co/sandbox=true:NoSchedule` and labeled
# `bex.co/pool: sandbox`; the BatchSandbox template (t004 step 3) sets the
# matching nodeSelector + toleration so only sandbox pods land there, keeping
# sandbox capacity off the tenant/platform pools (ADR042 D3).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata
scheduling:
  nodeSelector:
    bex.co/pool: sandbox
  tolerations:
    - key: bex.co/sandbox
      operator: Equal
      value: "true"
      effect: NoSchedule
