# OpenSandbox server config for the IN-CLUSTER deployment (ADR042 D1 / w3/m32
# t002). Unlike sandbox-k8s.toml (the host-local dev config with a hardcoded
# /Users/... kubeconfig), this runs inside the cluster: no kubeconfig_path (the
# pod's ServiceAccount is used), and multi-tenancy is enabled so each
# workspace's OPEN-SANDBOX-API-KEY resolves
# to its own `<ws>-sandbox` namespace (OSEP-0014, ADR042 D4, t006).
#
# Mounted at /etc/opensandbox/sandbox-cluster.toml by the server Deployment
# (t002); the BatchSandbox template is mounted from a ConfigMap.

[server]
host = "0.0.0.0"
port = 8077
max_sandbox_timeout_seconds = 86400
# Multi-tenant mode below authenticates every request through its workspace key.
# Do not set server.api_key, OPENSANDBOX_SERVER_API_KEY, or
# OPENSANDBOX_INSECURE_SERVER: a shared credential would collapse the tenant
# boundary that the HTTP provider enforces.

[log]
level = "INFO"

[runtime]
type = "kubernetes"
execd_image = "opensandbox/execd:v1.0.16@sha256:af7b55c861926c1304371c4578007fbaa424538219154a6a49a5d636217d2a3a"

# gVisor is the host/kernel boundary. A missing RuntimeClass fails scheduling
# rather than falling back to runc.
[secure_runtime]
type = "gvisor"
k8s_runtime_class = "gvisor"

[storage]
allowed_host_paths = []
volume_default_size = "1Gi"

[store]
type = "sqlite"
path = "/var/lib/opensandbox/opensandbox.db"

[kubernetes]
# No kubeconfig_path: the in-cluster ServiceAccount (SA + Role in
# opensandbox-system, plus the per-tenant `<ws>-sandbox` grants) is used.
# namespace is the DEFAULT target; multi-tenant lookups override it per request.
namespace = "opensandbox-system"
informer_enabled = true
informer_resync_seconds = 300
informer_watch_timeout_seconds = 300
workload_provider = "batchsandbox"
image_pull_policy = "IfNotPresent"
snapshot_create_timeout_seconds = 900
# Mounted from the batchsandbox-template ConfigMap; gVisor + sandbox-pool
# scheduling are pinned in both the template and secure_runtime block.
batchsandbox_template_file = "/etc/opensandbox/batchsandbox-template.yaml"

[ingress]
mode = "direct"

# No [egress] sidecar: it requires iptables/nftables inside the shared network
# namespace and is not a valid gVisor security control. bex never forwards a
# per-request OpenSandbox networkPolicy; Cilium enforces the supported posture.

# Multi-tenant mode (OSEP-0014, ADR042 D4 / m32 t006): an HTTP tenant-lookup
# provider resolves each caller's OPEN-SANDBOX-API-KEY to a `<ws>-sandbox`
# namespace via bex-api's control-plane endpoint. Lifecycle ops (create/list/get/
# delete) are then auto-scoped to that namespace; a stolen key cannot cross
# tenants even if bex-api has a bug (opensandbox_server/tenants/http_provider.py:
# GET {endpoint}, header OPEN-SANDBOX-API-KEY → 200 {namespace,ttl} | 401).
#
# Presence of this block flips the server into multi-tenant mode; drop it (and
# set OPENSANDBOX_INSECURE_SERVER) only for a single-tenant bring-up. The route
# sits behind the CP bearer, so auth_token must be `Bearer <BEX_CP_TOKEN>`. The
# server does NOT env-expand auth_token (config.py only overrides server.api_key
# from OPENSANDBOX_SERVER_API_KEY), so this whole file is rendered from a Secret
# at deploy time with the real token filled in — never committed with the token.
[tenants]
provider = "http"
endpoint = "http://bex-api.bex-system.svc:8091/v1/sandbox-tenants"
max_stale_seconds = 60
timeout_seconds = 5
auth_header = "Authorization"
auth_token = "Bearer __BEX_CP_TOKEN__" # placeholder; rendered from a Secret at deploy
