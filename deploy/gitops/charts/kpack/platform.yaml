# A two-label *.local Service name makes go-containerregistry (and therefore
# upstream kpack) use HTTP for the existing development Zot endpoint. It is an
# alias of the same Service, not another registry. Kubernetes' DNS search path
# expands zot.local to zot.local.svc.cluster.local.
apiVersion: v1
kind: Namespace
metadata:
  name: local
---
apiVersion: v1
kind: Service
metadata:
  name: zot
  namespace: local
spec:
  type: ExternalName
  externalName: zot.bex-registry.svc.cluster.local
  ports:
    - name: registry
      port: 5000
      targetPort: 5000
---
# One source of truth for the complete builder image kpack imports and the tag
# of the ClusterBuilder it composes. The operator's checked-in
# BEX_CNB_BUILDER/BEX_KPACK_REGISTRY values intentionally match these values.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bex-kpack-config
  namespace: bex-system
data:
  cnbBuilder: paketobuildpacks/builder-jammy-base@sha256:c0642791404793f276f92c926c4fe910c0fa5f9dce6b3de8b693323a5962236b
  clusterBuilderTag: zot.local:5000/bex-cnb-builder:latest
---
# The out-of-band registry bootstrap creates bex-registry-push-kpack as a
# dockerconfigjson Secret. kpack watches this ServiceAccount and recovers if the
# Secret arrives after the GitOps resources.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bex-kpack-builder
  namespace: bex-system
secrets:
  - name: bex-registry-push-kpack
imagePullSecrets:
  - name: bex-registry-push-kpack
---
apiVersion: kpack.io/v1alpha2
kind: ClusterStore
metadata:
  name: bex
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceAccountRef:
    name: bex-kpack-builder
    namespace: bex-system
  # Replaced from bex-kpack-config by kustomize.
  sources:
    - image: paketobuildpacks/builder-jammy-base@sha256:c0642791404793f276f92c926c4fe910c0fa5f9dce6b3de8b693323a5962236b
---
apiVersion: kpack.io/v1alpha2
kind: ClusterStack
metadata:
  name: bex-jammy-base
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  id: io.buildpacks.stacks.jammy
  buildImage:
    image: paketobuildpacks/build-jammy-base@sha256:b8f6a39ca0764598885087bdc0a034c195e4f63a72de8945d7201d9a3234d7f8
  # bex run image (w1/m169): run-jammy-base plus libatomic1, so current Node
  # majors (25+, which link libatomic.so.1) start. Published and Node-checked by
  # .github/workflows/cnb-run-image.yml; recipe in deploy/cnb-run/Dockerfile.
  runImage:
    image: ghcr.io/bex-co/bex-cnb-run@sha256:e737036058ca4fb01ac1fbc344a8d56ea926f9ed77bef471c4d796830b589fe6
---
# kpack v0.18 does not accept a complete builder image directly on Image.
# Instead, ClusterStore imports its buildpackages and this ClusterBuilder
# recreates the complete Paketo detection order against the matching Jammy
# stack. Versions are intentionally omitted so a deliberate cnbBuilder update
# selects the newest matching versions found in that imported image.
apiVersion: kpack.io/v1alpha2
kind: ClusterBuilder
metadata:
  name: bex
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Replaced from bex-kpack-config by kustomize.
  tag: zot.local:5000/bex-cnb-builder:latest
  serviceAccountRef:
    name: bex-kpack-builder
    namespace: bex-system
  stack:
    name: bex-jammy-base
    kind: ClusterStack
  store:
    name: bex
    kind: ClusterStore
  order:
    - group: [{ id: paketo-buildpacks/ruby }]
    - group: [{ id: paketo-buildpacks/dotnet-core }]
    - group: [{ id: paketo-buildpacks/go }]
    - group: [{ id: paketo-buildpacks/java-native-image }]
    - group: [{ id: paketo-buildpacks/java }]
    - group: [{ id: paketo-buildpacks/web-servers }]
    - group: [{ id: paketo-buildpacks/nodejs }]
    - group: [{ id: paketo-buildpacks/python }]
    - group: [{ id: paketo-buildpacks/procfile }]
