# The Render CLI saves its dashboard origin from the device grant's
# verification URI, which Hydra serves on oauth.bex.co, so every link it
# builds on that origin would get Hydra's 404 (w8/089). This sends to the
# dashboard, with the full path and query kept:
#   - the Render-alias prefixes (dashboard/src/common/lib/render-alias.ts)
#     behind upstream's Dashboard actions;
#   - agents/<id>, which `bex agent open --dashboard` builds (w32/054);
#   - settings, upstream logout's "revoke your token" link
#     (settings#cli-tokens; the browser keeps the fragment) (w32/054).
# Hydra serves none of these, so every OAuth/OIDC route keeps reaching it.
# Delivered by the hydra Application itself, a sync wave ahead of the chart's
# Ingress that references it: a missing middleware would fail every
# oauth.bex.co route.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cli-dashboard-redirect
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  redirectRegex:
    regex: "^https://oauth[.]bex[.]co/((web|worker|pserv|static|cron|d|r|agents)/.+|settings([/?].*)?)$"
    replacement: "https://dashboard.bex.co/${1}"
    permanent: false
