apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../bex-postgres
patches:
  # The local CAPD cluster deliberately has no credential-backed ObjectStore.
  # Keep bex-db itself available, but disable its backup transport and schedule.
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: bex-db
    patch: |-
      - op: remove
        path: /spec/plugins
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: ScheduledBackup
      name: bex-db-nightly
    patch: |-
      $patch: delete
      apiVersion: postgresql.cnpg.io/v1
      kind: ScheduledBackup
      metadata:
        name: bex-db-nightly
  # CAPD has no hcloud CSI: the base class would leave bex-db-1's PVC Pending
  # forever (w1/108 bring-up, 2026-09-30). Mirror the auth-dbs local shrink.
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: bex-db
    patch: |-
      - { op: replace, path: /spec/storage/storageClass, value: local-path }
      - { op: replace, path: /spec/storage/size, value: 1Gi }
