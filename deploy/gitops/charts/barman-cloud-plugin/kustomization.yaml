apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Exact upstream v0.13.0 release manifest. Its SHA-256 is recorded in README.
  - upstream/manifest-0.13.0.yaml
patches:
  # The plugin controller is platform infrastructure. Backup/restore sidecars
  # are injected into the CNPG instance pods and retain each database's own
  # placement; only this control-plane Deployment is pinned here.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: barman-cloud
      namespace: cnpg-system
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          bex.co/pool: platform
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 500m, memory: 256Mi }
