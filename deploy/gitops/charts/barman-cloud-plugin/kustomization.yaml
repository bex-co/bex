apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Exact upstream v0.13.0 release manifest. Its SHA-256 is recorded in README.
  - upstream/manifest-0.13.0.yaml
patches:
  # Upstream v0.13.0 grants the controller create/delete/get/list/watch on every
  # Secret cluster-wide. Its ObjectStore reconciler never reads or mutates one,
  # so most of that is unused — but it cannot be dropped ENTIRELY, and an earlier
  # revision of this patch that did so broke every new managed Postgres on the
  # platform (w7/m77, 2026-08-19).
  #
  # The controller creates a per-cluster Role granting get/watch/list on that
  # cluster's backup credential, which the CNPG instance sidecar then uses.
  # Kubernetes privilege-escalation prevention requires that whoever CREATES a
  # Role granting X must themselves hold X (or hold `escalate`). Removing the
  # controller's own Secret access therefore removed its ability to create the
  # very Roles this comment cites as the reason it is safe to remove — every
  # Cluster then wedges before provisioning a pod:
  #
  #   roles.rbac.authorization.k8s.io "<cluster>-barman-cloud" is forbidden:
  #   user "system:serviceaccount:cnpg-system:plugin-barman-cloud" is attempting
  #   to grant RBAC permissions not currently held
  #
  # It is silent: Roles created before the change keep working, so existing
  # databases are unaffected and only NEW ones hang in Provisioning.
  #
  # Narrow the rule to exactly what escalation prevention needs — the read verbs
  # the delegated Roles grant — and keep create/delete dropped.
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      name: plugin-barman-cloud
    patch: |-
      - op: replace
        path: /rules/0
        value:
          apiGroups: [""]
          resources: ["secrets"]
          verbs: ["get", "list", "watch"]
  # Keep upstream source byte-for-byte reproducible while pinning both executed
  # images in the rendered deployment contract.
  - target:
      version: v1
      kind: Secret
      name: plugin-barman-cloud-m5m67kfh8f
    patch: |-
      - op: replace
        path: /data/SIDECAR_IMAGE
        value: Z2hjci5pby9jbG91ZG5hdGl2ZS1wZy9wbHVnaW4tYmFybWFuLWNsb3VkLXNpZGVjYXI6djAuMTMuMEBzaGEyNTY6OTkwMzYxYWYzMzE5ZjllMjNhYWZhMGY2ZDc5ODFmOTliZjFmNjliNGU2YTg1Y2YxYmM3ZDcxZDZmMDliYjI4OA==
  # The plugin controller is platform infrastructure. Backup/restore sidecars
  # are injected into the CNPG instance pods and retain each database's own
  # placement; only this control-plane Deployment is pinned here.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: barman-cloud
      namespace: cnpg-system
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          bex.co/pool: platform
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 500m, memory: 256Mi }
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/cloudnative-pg/plugin-barman-cloud:v0.13.0@sha256:71589dbac582333442812b07b31f7ea4d00324a8358aac7ca507dabf9f4b6c96
