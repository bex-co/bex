# ObjectStore for the control-plane database. The destination, retention, and
# out-of-band Secret reference preserve bex-db's pre-plugin transport contract.
# The bex-postgres chart references this object for WAL, base backup, and restore.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: bex-db
  namespace: bex-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  configuration:
    destinationPath: s3://bex-tfstate/bex-db
    endpointURL: https://s3.eu-central-2.wasabisys.com
    s3Credentials:
      accessKeyId:
        name: bex-db-backup-s3
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: bex-db-backup-s3
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
      # SSE-S3 at rest (ADR050 Tier B): forces the x-amz-server-side-encryption
      # header on every WAL/base-backup object. Weaker than Tier A's client-side
      # age encryption (SSE decrypts transparently on any authenticated GET) —
      # the write-only per-store credential (ADR050 §3) is what protects this
      # archive against a leaked backup credential. Confirm Wasabi accepts AES256
      # before relying on it; aws:kms needs a bucket/account default CMK.
      encryption: AES256
    data:
      compression: gzip
      encryption: AES256
  retentionPolicy: 7d
