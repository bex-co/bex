# The OpenFGA authorization database — same shape as kratos-db.yaml (see its
# header for the separate-clusters rationale). CNPG creates openfga-db-rw +
# openfga-db-app; scripts/auth-secrets.sh composes the DSN into auth/openfga.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openfga-db
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true # CRD may be mid-install
spec:
  instances: 2
  primaryUpdateMethod: switchover
  # w1/m19 t003 + w1/m38: platform-only, with the standby required to land on
  # another node so CNPG can switch over before a drain evicts the primary.
  affinity:
    podAntiAffinityType: required
    nodeSelector:
      bex.co/pool: platform
    tolerations:
      - key: bex.co/platform
        operator: Equal
        value: "true"
        effect: NoSchedule
  storage:
    size: 5Gi
    storageClass: hcloud-volumes
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  bootstrap:
    initdb:
      database: openfga
      owner: openfga
