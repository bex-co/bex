# The Kratos identity database — a dedicated CloudNativePG Cluster (Ory requires
# Kratos and Hydra to have separate databases; separate *clusters* keep failover,
# upgrades, and backups independent — same reasoning as bex-db, see
# charts/bex-postgres/cluster.yaml). Two instances on distinct platform nodes let
# CNPG switch over before a node drain (w1/m38).
# CNPG creates:
#   - service  kratos-db-rw    (read-write endpoint Kratos connects to)
#   - secret   kratos-db-app   (user/password for database `kratos`; the DSN is
#                               composed from it by scripts/auth-secrets.sh)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kratos-db
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true # CRD may be mid-install
spec:
  instances: 2
  # Pod-template changes must promote the ready standby before replacing the
  # primary; the default `restart` method creates an avoidable write outage.
  primaryUpdateMethod: switchover
  # w1/m19 t003: platform pool (CNPG's affinity block carries both knobs).
  # Required pod anti-affinity keeps the primary and standby on different nodes,
  # which is the drain-safety invariant guarded by scripts/gitops-validate.sh.
  affinity:
    podAntiAffinityType: required
    nodeSelector:
      bex.co/pool: platform
    tolerations:
      - key: bex.co/platform
        operator: Equal
        value: "true"
        effect: NoSchedule
  storage:
    size: 5Gi
    storageClass: hcloud-volumes
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  bootstrap:
    initdb:
      database: kratos
      owner: kratos
  # The running cluster is PostgreSQL 18. Keep the major in the archive identity
  # so a future major upgrade starts a new, non-overlapping WAL history.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: auth-dbs
        serverName: kratos-db-pg18
