# Nightly etcd snapshot → S3-compatible object storage (Hetzner Object Storage).
#
# Why: App state lives only in the single control-plane node's etcd (local disk,
# no HA) — a node rebuild loses every App CR. Until the control-plane Postgres is
# the source of truth, this ships a daily `etcdctl snapshot save` off-node.
# Restore runbook: docs/ADR011-etcd-backup-restore.md.
#
# Wiring:
#  - Runs on the control-plane node (nodeSelector + toleration) with hostNetwork
#    so etcd is reachable on https://127.0.0.1:2379, and a read-only hostPath for
#    the etcd client certs in /etc/kubernetes/pki/etcd.
#  - The client image stays on etcd 3.6 because that line contains both
#    `etcdctl` (snapshot) and `etcdutl` (restore). The wire-level snapshot path
#    is exercised after every Kubernetes minor hop; do not downgrade it to the
#    stacked-etcd image when kubeadm still selects an older 3.5 patch.
#  - Credentials come from the `etcd-backup-s3` Secret (NOT in git), created
#    once per cluster from .env — exact command in the runbook.
#  - Optional client-side encryption (ADR050 Tier A): the `encrypt` init step
#    age-encrypts the snapshot before upload when the OPTIONAL bex-backup-age
#    ConfigMap provides AGE_PUBLIC_KEY; unset ⇒ plain .gz upload (unchanged).
#  - aws-cli pinned <2.23: newer CLIs send CRC64 checksums many S3-compatibles
#    reject (same quirk as `skip_s3_checksum` in infra/terraform/versions.tf).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: kube-system
spec:
  schedule: "15 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          hostNetwork: true
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          initContainers:
            - name: snapshot
              image: registry.k8s.io/etcd:3.6.8-0@sha256:397189418d1a00e500c0605ad18d1baf3b541a1004d768448c367e48071622e5 # k8s 1.36.x kubeadm etcd; keep in sync with cluster
              command:
                - etcdctl
                - --endpoints=https://127.0.0.1:2379
                - --cacert=/etc/kubernetes/pki/etcd/ca.crt
                - --cert=/etc/kubernetes/pki/etcd/server.crt
                - --key=/etc/kubernetes/pki/etcd/server.key
                - snapshot
                - save
                - /backup/etcd-snapshot.db
              volumeMounts:
                - name: etcd-certs
                  mountPath: /etc/kubernetes/pki/etcd
                  readOnly: true
                - name: backup
                  mountPath: /backup
            - name: compress # separate step: neither the etcd nor aws-cli image ships gzip
              image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
              command: ["gzip", "-9", "/backup/etcd-snapshot.db"]
              volumeMounts:
                - name: backup
                  mountPath: /backup
            # ADR050 Tier A: client-side age encryption between compress and upload.
            # Opt-in — runs only when AGE_PUBLIC_KEY is supplied by the OPTIONAL
            # bex-backup-age ConfigMap in this namespace (key AGE_PUBLIC_KEY, the
            # committed public half; the private key stays out-of-band in .env/CI,
            # ADR050 §1). Unset/absent ConfigMap ⇒ pass-through, byte-identical to
            # the pre-ADR050 plain .gz upload.
            #
            # NO RUNTIME PACKAGE INSTALL (w1/m66 F16). This step previously ran
            # `apk add --no-cache age`, resolving code from a mutable package
            # repository INSIDE the stage that holds the plaintext snapshot and
            # shares a volume with the credentialed upload step. It now fetches one
            # pinned release artifact and verifies it against the SHA-256 reviewed
            # in this file before executing it; a mismatch fails the Job, so
            # nothing is uploaded rather than uploaded unencrypted.
            - name: encrypt
              image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
              command: ["/bin/sh", "-ceu"]
              env:
                - name: AGE_VERSION
                  value: "1.3.1"
                - name: AGE_SHA256 # age-v1.3.1-linux-amd64.tar.gz, reviewed + pinned here
                  value: "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377"
              args:
                - |
                  if [ -z "${AGE_PUBLIC_KEY:-}" ]; then exit 0; fi
                  cd /tmp
                  wget -q -O age.tgz \
                    "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
                  echo "${AGE_SHA256}  age.tgz" | sha256sum -c -
                  tar xzf age.tgz age/age
                  ./age/age -r "$AGE_PUBLIC_KEY" \
                    -o /backup/etcd-snapshot.db.gz.age /backup/etcd-snapshot.db.gz
                  rm -f /backup/etcd-snapshot.db.gz
              envFrom:
                - configMapRef:
                    name: bex-backup-age
                    optional: true
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: amazon/aws-cli:2.22.35@sha256:6977c83ae3dc99f28fcf8276b9ea5eec33833cd5be40574b34112e98113ec7a2
              command: ["/bin/bash", "-ceu"]
              args:
                - |
                  retain=7 # rolling window: keep the newest N snapshots
                  aws configure set default.s3.addressing_style path
                  ts="$(date -u +%Y%m%d-%H%M%S)"
                  # Upload whichever artifact the encrypt step produced; the remote
                  # suffix follows suit (.db.gz.age when encrypted, .db.gz when not).
                  if [ -f /backup/etcd-snapshot.db.gz.age ]; then
                    src=/backup/etcd-snapshot.db.gz.age; suffix=db.gz.age
                  else
                    src=/backup/etcd-snapshot.db.gz; suffix=db.gz
                  fi
                  aws --endpoint-url "$S3_ENDPOINT" s3 cp \
                    "$src" "s3://$S3_BUCKET/etcd-snapshots/etcd-$ts.$suffix"
                  # Retention keeps the newest N across both suffixes, so plain
                  # snapshots from before encryption age out normally.
                  aws --endpoint-url "$S3_ENDPOINT" s3 ls "s3://$S3_BUCKET/etcd-snapshots/" \
                    | awk '{print $NF}' | grep -E '^etcd-.*\.db\.gz(\.age)?$' | sort | head -n "-$retain" \
                    | while read -r old; do
                        aws --endpoint-url "$S3_ENDPOINT" s3 rm "s3://$S3_BUCKET/etcd-snapshots/$old"
                      done
              envFrom:
                - secretRef:
                    name: etcd-backup-s3
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: etcd-certs
              hostPath:
                path: /etc/kubernetes/pki/etcd
                type: Directory
            - name: backup
              emptyDir: {}
