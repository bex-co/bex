# The identity the openbao-backup CronJob authenticates to OpenBao as. Its token
# is exchanged (Kubernetes auth) for a short-lived OpenBao token scoped by the
# `bao-snapshot` role → `snapshot` policy (read on sys/storage/raft/snapshot only),
# both created idempotently by scripts/bao-k8s-auth.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bao-snapshot
  namespace: secrets
