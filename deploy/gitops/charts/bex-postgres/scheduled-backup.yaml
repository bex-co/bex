# Nightly full base backup for bex-db via CNPG's ScheduledBackup.
# Staggered after etcd-backup (03:15) and openbao-backup (03:45).
# WAL archiving is continuous through cluster.yaml's Barman Cloud plugin; this
# triggers the periodic full base backup that makes PITR viable. ObjectStore
# `bex-db` owns the destination, retention, and out-of-band Secret reference;
# see docs/ADR031-platform-data-backup.md.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: bex-db-nightly
  namespace: bex-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true # CRD may be mid-install
spec:
  # CNPG uses six-field cron syntax (seconds first): daily at 04:00 UTC.
  schedule: "0 0 4 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: bex-db
