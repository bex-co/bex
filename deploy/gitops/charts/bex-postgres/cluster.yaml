# The bex control-plane database — a CloudNativePG Cluster. Two instances on
# distinct platform nodes let CNPG switch over before a node drain (w1/m38).
# Storage is a Hetzner Cloud Volume (hcloud-csi) — separate from the node's local
# disk, so it survives a node rebuild (unlike etcd). CNPG creates:
#   - service  bex-db-rw   (read-write endpoint the control plane connects to)
#   - secret   bex-db-app  (app user/password for database `bex`)
# Backup: the Barman Cloud plugin continuously archives WAL and the nightly
# ScheduledBackup takes base backups through ObjectStore `bex-db` (see
# scheduled-backup.yaml). Credentials stay behind that ObjectStore's out-of-band
# Secret; setup + restore runbook: docs/ADR031-platform-data-backup.md.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bex-db
  namespace: bex-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true # CRD may be mid-install
spec:
  instances: 2
  # Pod-template changes must promote the ready standby before replacing the
  # primary; the default `restart` method creates an avoidable write outage.
  primaryUpdateMethod: switchover
  # w1/m19 t003: platform pool (CNPG's affinity block carries both knobs).
  # Required pod anti-affinity keeps the primary and standby on different nodes,
  # which is the drain-safety invariant guarded by scripts/gitops-validate.sh.
  affinity:
    podAntiAffinityType: required
    nodeSelector:
      bex.co/pool: platform
    tolerations:
      - key: bex.co/platform
        operator: Equal
        value: "true"
        effect: NoSchedule
  storage:
    size: 5Gi
    storageClass: hcloud-volumes
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  bootstrap:
    initdb:
      database: bex
      owner: bex
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: bex-db
        serverName: bex-db
