# The bex control-plane database — a CloudNativePG Cluster.
# 1 instance for now (single-node app cluster); bump `instances` to 3 for HA later.
# Storage is a Hetzner Cloud Volume (hcloud-csi) — separate from the node's local
# disk, so it survives a node rebuild (unlike etcd). CNPG creates:
#   - service  bex-db-rw   (read-write endpoint the control plane connects to)
#   - secret   bex-db-app  (app user/password for database `bex`)
# Backup: nightly ScheduledBackup + continuous WAL archiving to the shared object-store
# bucket (see scheduled-backup.yaml). Credentials in Secret `bex-db-backup-s3` (NOT in
# git); creation command + restore runbook: docs/ADR031-platform-data-backup.md.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bex-db
  namespace: bex-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true # CRD may be mid-install
spec:
  instances: 1
  # w1/m19 t003: platform pool (CNPG's affinity block carries both knobs)
  affinity:
    nodeSelector:
      bex.co/pool: platform
    tolerations:
      - key: bex.co/platform
        operator: Equal
        value: "true"
        effect: NoSchedule
  storage:
    size: 5Gi
    storageClass: hcloud-volumes
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  bootstrap:
    initdb:
      database: bex
      owner: bex
  backup:
    # Mirrors the tenant-Postgres backup config the operator builds via BEX_DB_BACKUP_*.
    # endpointURL / destinationPath must match $TF_STATE_ENDPOINT / s3://$TF_STATE_BUCKET.
    # Update endpointURL for Hetzner Object Storage: https://fsn1.your-objectstorage.com.
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: s3://bex-tfstate/bex-db
      endpointURL: https://s3.eu-central-2.wasabisys.com
      s3Credentials:
        accessKeyId:
          name: bex-db-backup-s3
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: bex-db-backup-s3
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
