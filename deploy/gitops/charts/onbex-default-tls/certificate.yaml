# Wave 1 waits for cert-manager to issue the wildcard before Argo exposes it as
# Traefik's default in wave 2. Per-App and custom-domain Certificates are
# untouched and remain more-specific SNI matches in the same default store.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: onbex-default-wildcard
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: onbex-default-wildcard-tls
  dnsNames:
    - "*.onbex.co"
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: onbex-dns01
  privateKey:
    rotationPolicy: Always
