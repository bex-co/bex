# A namespaced Issuer keeps both the Cloudflare token reference and ACME account
# key inside the trusted edge namespace. The token must grant only DNS edit and
# zone read for onbex.co; it is installed out of band by deploy.yml.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: onbex-dns01
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: dorathynoda@gmail.com
    privateKeySecretRef:
      name: onbex-dns01-account-key
    solvers:
      - selector:
          dnsZones:
            - onbex.co
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: onbex-dns01-cloudflare
              key: api-token
