# Traefik serves the cert-manager-issued wildcard (certificate.yaml) only when
# SNI does not match a routed host's certificate. It also serves the
# lowest-priority platform-host fallback Ingress (bex-platform-host-fallback,
# w4/m235 t008), which sends a host no App route claims yet to the activator:
# a just-created service answers its first-deploy response, and an unknown
# host a bex 404 instead of Traefik's raw one.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  defaultCertificate:
    secretName: onbex-default-wildcard-tls
