# bex-api's namespace-scoped grants for the bootstrap/default apps namespace
# (w6/002, RBAC least-privilege audit). ADR043 later moved hosted resources into
# per-workspace tea-<id> namespaces; their equivalent grants now live on
# bex-tenant-api in tenant-namespace-clusterroles.yaml and are activated only by
# each namespace's RoleBinding. Keep this Role for the bootstrap namespace and
# installations that still set BEX_API_NAMESPACE / BEX_CP_APPS_NAMESPACE to
# default. In both regimes a compromised bex-api pod cannot read platform
# secrets (Kratos/Hydra in auth, OpenBao in secrets, the GitHub App key, CNPG
# creds elsewhere) or tail arbitrary pods.
#
# This file lives in deploy/gitops (not lego/operator/config/api) deliberately:
# config/api inherits the bex-system namespace transform from config/default,
# which would rewrite a Role's namespace to bex-system. deploy/gitops resources
# keep their explicit namespace, so the Role lands in the apps namespace.
#
# The app.bex.co verbs stay cluster-wide (in lego/operator/config/api/rbac.yaml)
# so the API can locate resources across dynamic tenant namespaces; sensitive
# core/CNPG reads remain namespaced through this Role or bex-tenant-api.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bex-api-apps
  namespace: default
rules:
  # Read the CNPG-generated "<db>-app" Secret to assemble connection strings;
  # create/update the per-app "<app>-env" Secret the env-vars API materializes
  # from OpenBao (docs/ADR013-secrets.md) so the Deployment consumes it via envFrom.
  # Delete is required to remove the per-App clone and external-registry pull
  # Secrets during service deletion. Watch remains deliberately omitted.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Read-only pod access for the logs + metrics verbs: list pods by App label,
  # read logs (pods/log), and read pod resource limits for percentage-mode metrics.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Resource metrics (cpu/memory) from metrics-server's aggregated API.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Read-only Job access for usage metering's build_seconds component
  # (docs/ADR023-usage-metering.md): usage.queryBuildSeconds lists the build Jobs
  # in this namespace by app-name label and sums their run time. Without this the
  # rollup fails closed on EVERY reconcile ("jobs.batch is forbidden") and build
  # seconds are silently under-reported — observed live on prod (w6/m13), the same
  # species of gap as the missing `keyvalues` grant m11 found. List-only: the
  # build Jobs themselves are created by the operator, never by bex-api.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  # Resolve each projected App's exact Traefik router labels for HTTP egress
  # accounting, then list peer Ingresses to reject normalized-name collisions.
  # These are tenant routing objects in this namespace; platform Ingresses stay
  # outside the grant.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  # Read-only managed-Postgres recovery surface (docs/ADR009-postgresql-management.md,
  # w6/m117): the Recovery card lists the CNPG Backup objects the operator manages
  # in this namespace. The Barman ObjectStore rule below supplies the authoritative
  # PITR window. WITHOUT these grants recovery-info cannot distinguish unreadable
  # state from verified absence. The operator owns both resources' lifecycle.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["backups"]
    verbs: ["list"]
  # The plugin keys each database's exact recovery window under this shared,
  # namespaced ObjectStore. Restrict the read to that one projected object.
  - apiGroups: ["barmancloud.cnpg.io"]
    resources: ["objectstores"]
    resourceNames: ["bex-tenant-postgres"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bex-api-apps
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bex-api-apps
subjects:
  # The bex-api ServiceAccount lives in bex-system (rendered from config/api);
  # a RoleBinding may reference a ServiceAccount in another namespace.
  - kind: ServiceAccount
    name: bex-api
    namespace: bex-system
