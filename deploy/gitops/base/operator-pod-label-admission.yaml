# The operator may relabel a running datastore or App pod with the
# network-isolation and environment-id labels and nothing else (w8/m136,
# w4/451, w4/m342). Toggling an environment's isolation, or moving a store or
# service between environments, must take effect without restarting a Valkey
# or service pod, so the operator needs Pod
# `patch` RBAC; RBAC cannot narrow a patch to one label, and an unrestricted pod
# patch would also let compromised controller code rewrite a running container's
# image. This policy closes that: for the exact operator identity a Pod UPDATE
# must leave spec, annotations, owner references and finalizers untouched and
# change no label except app.bex.co/network-isolation and
# app.bex.co/environment-id (inPlacePodLabels in the operator's
# keyvalue_isolation.go; w3/055). (Pod status is the
# separate pods/status resource and is not matched.) Pod CREATE and DELETE are
# not granted by RBAC at all. See ADR032 §Datastores under network isolation.
#
# One annotation is the exception (w4/m347): on the registry pod
# bex-registry/zot-0 the operator may set or change
# bex.co/registry-credentials-written (registry.ZotReloadAnnotation). That write
# is the nudge that makes the kubelet re-project zot's credential Secrets at
# once, so a new App's registry credential activates by hot reload in seconds
# instead of at the next periodic kubelet sync (ADR022 § Credential
# activation). It changes nothing zot runs; every other rule still holds for
# that pod.
#
# The edge-cache control annotations are the other exception (w3/m486): on a
# pod that runs bex's edge-cache proxy (a container named edge-cache), the
# operator may set or change app.bex.co/cache-purged-at and
# app.bex.co/cache-profile (edgecache.PurgedAtAnnotation,
# edgecache.ProfileAnnotation). The proxy reads them from its pod's downward-API
# annotations file, so a manual purge or a profile switch reaches it without
# restarting the instance. They change nothing the kubelet runs; removing one is
# still denied, and every other rule still holds for that pod.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bex-operator-pod-labels
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: bex-operator-service-account
      expression: request.userInfo.username == 'system:serviceaccount:bex-system:bex-controller-manager'
  variables:
    - name: labels
      expression: object.metadata.?labels.orValue({})
    - name: oldLabels
      expression: oldObject.metadata.?labels.orValue({})
    - name: inPlace
      expression: "['app.bex.co/network-isolation', 'app.bex.co/environment-id']"
    - name: annotations
      expression: object.metadata.?annotations.orValue({})
    - name: oldAnnotations
      expression: oldObject.metadata.?annotations.orValue({})
    - name: zotReload
      expression: >-
        object.metadata.namespace == 'bex-registry' && object.metadata.name == 'zot-0'
        ? ['bex.co/registry-credentials-written'] : []
    - name: edgeCacheControl
      expression: >-
        object.spec.containers.exists(c, c.name == 'edge-cache')
        ? ['app.bex.co/cache-purged-at', 'app.bex.co/cache-profile'] : []
  validations:
    - expression: object.spec == oldObject.spec
      message: the operator may relabel a pod but never change its spec
    - expression: >-
        variables.annotations.all(k, k in variables.zotReload || k in variables.edgeCacheControl ||
          (k in variables.oldAnnotations && variables.oldAnnotations[k] == variables.annotations[k])) &&
        variables.oldAnnotations.all(k, k in variables.annotations) &&
        object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([]) && object.metadata.?finalizers.orValue([]) == oldObject.metadata.?finalizers.orValue([])

      message: the operator may relabel a pod but never change its annotations, owners or finalizers
    - expression: >-
        variables.labels.all(k, k in variables.inPlace ||
          (k in variables.oldLabels && variables.oldLabels[k] == variables.labels[k])) &&
        variables.oldLabels.all(k, k in variables.inPlace || k in variables.labels)

      message: the operator may change only the app.bex.co/network-isolation and app.bex.co/environment-id labels on a pod
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bex-operator-pod-labels
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  policyName: bex-operator-pod-labels
  validationActions: [Deny, Audit]
