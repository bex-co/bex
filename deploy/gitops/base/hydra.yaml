# Ory Hydra — the platform OAuth2/OIDC provider (token issuance + introspection;
# see docs/ADR012-auth.md). The reviewed chart is mirrored to controlled OCI;
# this is a multi-source Application: the immutable artifact provides the chart, the git
# source (ref: values) provides base/values/hydra.values.yaml.
# sync-wave 3: after the CNPG operator (1) and hydra-db (2). Runtime secrets
# (DSN + system/cookie/pairwise-salt) are NOT in git — scripts/auth-secrets.sh
# creates the `hydra` Secret out-of-band from .env + the CNPG DB credentials.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hydra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: bex-platform
  sources:
    - repoURL: oci://ghcr.io/bex-co/bex-charts/hydra
      path: .
      targetRevision: "sha256:40704eadfffa49f76fc33bdda8e53cd454e1be9644fc484e15399e6531fa9e4d"
      helm:
        valueFiles:
          - $values/deploy/gitops/base/values/hydra.values.yaml
    - repoURL: git@github.com:bex-co/bex.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: auth
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    # first sync can race the out-of-band `hydra` Secret (deploy.yml wave 4b);
    # the migration hook fails until it exists — retry instead of staying red.
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
