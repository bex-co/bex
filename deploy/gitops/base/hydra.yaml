# Ory Hydra — the platform OAuth2/OIDC provider (token issuance + introspection;
# see docs/auth.md). Pinned upstream chart; values are vendored in this repo, so
# this is a multi-source Application: the Helm repo provides the chart, the git
# source (ref: values) provides base/values/hydra.values.yaml.
# sync-wave 3: after the CNPG operator (1) and hydra-db (2). Runtime secrets
# (DSN + system/cookie/pairwise-salt) are NOT in git — scripts/auth-secrets.sh
# creates the `hydra` Secret out-of-band from .env + the CNPG DB credentials.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hydra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://k8s.ory.sh/helm/charts
      chart: hydra
      targetRevision: "0.62.1" # app v26.2.0; pin exact for reproducibility
      helm:
        valueFiles:
          - $values/deploy/gitops/base/values/hydra.values.yaml
    - repoURL: git@github.com:bex-co/bex.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: auth
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    # first sync can race the out-of-band `hydra` Secret (deploy.yml wave 4b);
    # the migration hook fails until it exists — retry instead of staying red.
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
