# The bex control-plane Postgres Cluster (CNPG), vendored in this repo (Argo reads it
# via the SSH deploy key, like bex.yaml). Sync wave 4 follows the Barman plugin
# (wave 2) and ObjectStore (wave 3), so fresh clusters never reference a missing
# plugin transport.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bex-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: git@github.com:bex-co/bex.git
    targetRevision: main
    path: deploy/gitops/charts/bex-postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: bex-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
