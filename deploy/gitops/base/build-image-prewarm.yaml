# build-image-prewarm (w1/030) — keeps the BuildKit image warm on every worker
# so a tenant build's pod never spends minutes in Pending/ContainerCreating
# pulling it on a cold node. Evidence: dep-d9d8r3h07a5s73dj32ag (2026-07-17)
# sat ~2 min with zero build output while a cold tenant node pulled
# moby/buildkit — the silent window behind the deploy-page build-log incident
# (docs/render-artifacts/live-deploy-following.md § 2026-07-17).
#
# Mechanism: a DaemonSet whose one container IS the BuildKit image, idling. The
# kubelet pulls it the moment any node joins (autoscaled nodes included), and
# the running container pins the image against kubelet image GC. Build Jobs
# (lego/operator/internal/build/build.go) are pinned to bex.co/pool=tenant, so
# this DaemonSet warms only the same untrusted tenant pool. On a node minted BY a pending build, the DaemonSet's pull
# and the Job's pull are the same image — kubelet coalesces them, so this never
# adds work to the hot path.
#
# The image ref MUST stay in lockstep with build.go's defaultBuildkitImage —
# a drifted ref warms the wrong image and silently reverts cold-node builds to
# the 2-minute pull. (If BEX_TENANT_SIGNING_KEY_SECRET ever turns on in prod,
# the cosign image becomes a second candidate to warm the same way.)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: build-image-prewarm
  namespace: bex-system
  labels:
    app: build-image-prewarm
spec:
  selector:
    matchLabels:
      app: build-image-prewarm
  template:
    metadata:
      labels:
        app: build-image-prewarm
    spec:
      nodeSelector:
        bex.co/pool: tenant
      # ADR060 D8 (2026-08-15) tainted bex-tenant-lg / bex-tenant-burst with
      # bex.co/build-only so serving pods stop pinning the build pools. Both
      # still carry bex.co/pool=tenant, so the selector above kept matching while
      # the taint silently excluded this DaemonSet from the only nodes that run
      # builds: measured on hetzner-prod 2026-08-17 as DESIRED 2 / READY 2 with
      # both pods on the SERVING nodes and none on bex-tenant-lg. Warm nodes hid
      # it (kubelet's own image cache covers a node that has already built), so
      # what was actually lost is the cold case — a burst scale-from-zero, or lg
      # being replaced — which is exactly when a build is most latency-sensitive
      # and the ~2-minute silent ContainerCreating window this DaemonSet exists
      # to remove (w1/030) reappears.
      #
      # scripts/clusterapi-validate.sh fails closed if a build-tainted
      # MachineDeployment ever exists without a matching toleration here.
      tolerations:
        - key: bex.co/build-only
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: buildkit
          # = lego/operator/internal/build/build.go defaultBuildkitImage
          image: moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
          command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
