# Loki — the durable log-history backend. bex-api's logs query path
# (GET /v1/logs, GraphQL logs(...), MCP list_logs, via NewLokiSource) reads
# pre-restart history from Loki's query_range API instead of the kubelet ring
# buffer, so a crash-looping App's logs survive the restart that prompted the
# investigation. bex-api points at it with
# BEX_LOKI_URL=http://loki.monitoring.svc:3100 (docs/ADR010-observability.md). Without
# this, QueryLogs falls back to live pod logs (no history) — byte-identical to
# the pre-Loki behavior. The live SSE tail always reads pod logs, never Loki.
#
# Single-binary mode on a filesystem PVC — the same "buy, don't build, keep it
# single-replica" posture as prometheus.yaml: no object store (S3/minio), no
# read/write/backend split, no caches. The log-shipper DaemonSet
# (log-shipper.yaml) tails App pod logs into it, labelled namespace/app/pod/
# container so bex-api can select on the App's namespace+name.
#
# Retention is 7 days (168h) — Render's Hobby-tier searchable window
# (docs/ADR010-observability.md); paid Render tiers reach 14/30 days, a knob to raise
# here (limits_config.retention_period) alongside the PVC. Like prometheus.yaml's
# PV and etcd/OpenBao's Raft volumes, the PVC rides the cluster's default
# StorageClass: hcloud-volumes on prod (a Hetzner Cloud Volume — a network volume
# that survives a node rebuild/loss), local-path on the disposable CAPD mock
# (node-local, so a node loss loses it there). History always survives a pod
# restart; on prod it survives a node loss too.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1" # before the shipper (log-shipper.yaml, wave 2)
spec:
  project: bex-platform
  source:
    repoURL: oci://ghcr.io/bex-co/bex-charts/loki
    path: .
    targetRevision: "sha256:56dff1080a34b4ded90b738cf7779afd03944548d05830ef3b4c273af4d12b91"
    helm:
      releaseName: loki
      values: |
        fullnameOverride: loki  # => Service `loki` on :3100 (BEX_LOKI_URL host)
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false   # single-tenant platform; bex-api scopes by label, not X-Scope-OrgID
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem     # no object store — single-replica filesystem, like Prometheus's PV
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index: { prefix: index_, period: 24h }
          # Retention: 7 days, enforced by the compactor. Render's Hobby window;
          # raise (with the PVC) for the 14/30-day paid-tier equivalent.
          limits_config:
            retention_period: 168h
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
          # Silence the chart's structured-metadata requirement for schema v13.
          pattern_ingester: { enabled: false }
        singleBinary:
          replicas: 1
          # The user-facing durable window: sized for 7d of tenant App logs at
          # platform scale. local overlay shrinks this to CAPD scale. The PVC
          # rides the cluster default StorageClass — hcloud-volumes on prod
          # (network volume, survives a node loss), local-path on the CAPD mock
          # (node-local) — so history survives a pod restart (and a node loss on
          # prod), the whole point.
          persistence:
            enabled: true
            size: 20Gi
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          # w1/m19 t003: platform pool
          nodeSelector:
            bex.co/pool: platform
          tolerations:
            - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
        # Single-binary minimal: no gateway, no caches, no canary/tests, no
        # self-monitoring, no bundled minio — this exists solely to answer
        # bex-api's query_range calls.
        gateway: { enabled: false }
        chunksCache: { enabled: false }
        resultsCache: { enabled: false }
        lokiCanary: { enabled: false }
        test: { enabled: false }
        minio: { enabled: false }
        monitoring:
          selfMonitoring: { enabled: false }
          serviceMonitor: { enabled: false }
        # Zero out the other deployment modes' components (SingleBinary only).
        backend: { replicas: 0 }
        read: { replicas: 0 }
        write: { replicas: 0 }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
