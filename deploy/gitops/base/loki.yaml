# Loki — the durable log-history backend. bex-api's logs query path
# (GET /v1/logs, GraphQL logs(...), MCP list_logs, via NewLokiSource) reads
# pre-restart history from Loki's query_range API instead of the kubelet ring
# buffer, so a crash-looping App's logs survive the restart that prompted the
# investigation. bex-api points at it with
# BEX_LOKI_URL=http://loki.monitoring.svc:3100 (docs/ADR010-observability.md). Without
# this, QueryLogs falls back to live pod logs (no history) — byte-identical to
# the pre-Loki behavior. The live SSE tail always reads pod logs, never Loki.
#
# Single-binary mode on a filesystem PVC — the same "buy, don't build, keep it
# single-replica" posture as prometheus.yaml: no object store (S3/minio), no
# read/write/backend split, no caches. The log-shipper DaemonSet
# (log-shipper.yaml) tails App pod logs into it, labelled namespace/app/pod/
# container so bex-api can select on the App's namespace+name.
#
# Retention is 30 days (720h), Render's longest plan window; bex-api floors each
# read at the workspace plan's own window (w9/m389, docs/ADR010-observability.md).
# Raise it with the PVC. Like prometheus.yaml's PV and etcd/OpenBao's Raft
# volumes, the PVC rides the cluster's default StorageClass: hcloud-volumes on
# prod (a Hetzner Cloud Volume — a network volume that survives a node
# rebuild/loss), local-path on the disposable CAPD mock (node-local, so a node
# loss loses it there). History always survives a pod restart; on prod it
# survives a node loss too.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1" # before the shipper (log-shipper.yaml, wave 2)
spec:
  project: bex-platform
  source:
    repoURL: oci://ghcr.io/bex-co/bex-charts/loki
    path: .
    targetRevision: "sha256:e0361dd45bbeedc12f18a0d4d55c81c92cdcda4475e21c316ebe8c379cc9fa54"
    helm:
      releaseName: loki
      values: |
        fullnameOverride: loki  # => Service `loki` on :3100 (BEX_LOKI_URL host)
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false   # single-tenant platform; bex-api scopes by label, not X-Scope-OrgID
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem     # no object store — single-replica filesystem, like Prometheus's PV
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index: { prefix: index_, period: 24h }
          # Retention: 30 days, enforced by the compactor — Render's longest
          # plan window (Scale/Enterprise). bex-api floors every read at the
          # workspace plan's window (Hobby 7 d, Pro 14 d; ADR010, w9/m389), so
          # storage holds the longest one. ≈31 MB/day raw (2026-09-28) puts
          # 30 days near 3 GB, far inside the claim below.
          #
          # Ingestion limits (w3/m506), explicit instead of Loki 3.6's defaults
          # (4 MB/s, 6 MB burst). Single-tenant, so the tenant limit is the
          # whole platform's. Measured on production over 14 days to
          # 2026-11-19: peak 3.3 MB and 38,172 lines in one minute (0.06 MB/s),
          # 267 active streams, 21 running instances, app lines 151 B on
          # average, and no 429 or discarded sample. The shipper caps each
          # instance at 100 lines/s with a 6,000-line burst (log-shipper.yaml,
          # RENDER'S PER-INSTANCE CAP), so the worst case is every instance
          # flooding at once: 21 × 100 × 1 KiB lines = 2.1 MB/s, one
          # instance's burst 6 MB. 8 MB/s holds that 4× over; 16 MB absorbs
          # two instances' bursts together. Per stream (one instance's
          # pod/container/level), 3 MB/s is 30× a capped instance's 1 KiB-line
          # rate and the 15 MB burst holds its whole burst at up to ~2.5 KiB a
          # line. A push over these is refused 429 and retried by the shipper;
          # LogDeliveryLokiRejected and LogDeliveryRetriesPersistent fire on it.
          limits_config:
            retention_period: 720h
            ingestion_rate_mb: 8
            ingestion_burst_size_mb: 16
            per_stream_rate_limit: 3MB
            per_stream_rate_limit_burst: 15MB
            max_global_streams_per_user: 5000
            max_line_size: 256KB
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
          # Silence the chart's structured-metadata requirement for schema v13.
          pattern_ingester: { enabled: false }
        singleBinary:
          replicas: 1
          # The user-facing durable window. 20Gi is production's live claim
          # (monitoring/storage-loki-0); 30 days of every stream is about 3 GB
          # (measured 2026-11-17, ADR010 § Durability & retention). local overlay
          # shrinks this to CAPD scale. The PVC rides the cluster default
          # StorageClass — hcloud-volumes on prod (network volume, survives a
          # node loss), local-path on the CAPD mock (node-local) — so history
          # survives a pod restart (and a node loss on prod), the whole point.
          # StatefulSet volumeClaimTemplates never resize an existing claim:
          # patch the live claim first (hcloud-volumes grows it online), then
          # change this value, the gitops-validate.sh guard and ADR010 together.
          persistence:
            enabled: true
            size: 20Gi
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          # w1/m19 t003: platform pool
          nodeSelector:
            bex.co/pool: platform
          tolerations:
            - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
        # Single-binary minimal: no gateway, no caches, no canary/tests, no
        # self-monitoring, no bundled minio — this exists solely to answer
        # bex-api's query_range calls.
        gateway: { enabled: false }
        chunksCache: { enabled: false }
        resultsCache: { enabled: false }
        lokiCanary: { enabled: false }
        test: { enabled: false }
        minio: { enabled: false }
        monitoring:
          selfMonitoring: { enabled: false }
          serviceMonitor: { enabled: false }
        # Zero out the other deployment modes' components (SingleBinary only).
        backend: { replicas: 0 }
        read: { replicas: 0 }
        write: { replicas: 0 }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # StatefulSet volumeClaimTemplates are immutable. Grow the live PVC online
  # (hcloud volume expand) when raising size; ignore the embedded template so
  # Argo does not thrash on apiVersion/kind defaults + the size field.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: loki
      namespace: monitoring
      jsonPointers:
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
        - /spec/volumeClaimTemplates/0/spec/resources/requests
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]
