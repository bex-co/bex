# metrics-server — the resource-metrics backend. Serves the aggregated
# metrics.k8s.io/v1beta1 API (pod/node CPU + memory), which is what `kubectl top`
# and bex-api's resource metrics (GET /v1/metrics/{cpu,memory}, via
# NewResourceMetricsSource) read. Without it those endpoints return 503
# (ErrMetricsUnavailable); instance-count still works (it counts pods directly).
#
# Production kubelets rotate serving certificates and Metrics Server verifies
# them. The disposable CAPD environment adds its insecure compatibility flag in
# the local overlay only; it can never flow through the production render.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: bex-platform
  source:
    repoURL: oci://ghcr.io/bex-co/bex-charts/metrics-server
    path: .
    targetRevision: "sha256:d7f01ba2b1b2d9c3f5e505cf8cda6e9712ca145d073ebf28779e2973f2b45077"
    helm:
      values: |
        args:
          - --kubelet-preferred-address-types=InternalIP,Hostname,ExternalIP
        # Fast enough resolution for a metrics page without hammering kubelets.
        metrics:
          enabled: false                    # metrics-server's own /metrics, not needed here
        # w1/m19 t003: platform pool
        nodeSelector:
          bex.co/pool: platform
        tolerations:
          - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
