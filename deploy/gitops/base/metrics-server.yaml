# metrics-server — the resource-metrics backend. Serves the aggregated
# metrics.k8s.io/v1beta1 API (pod/node CPU + memory), which is what `kubectl top`
# and bex-api's resource metrics (GET /v1/metrics/{cpu,memory}, via
# NewResourceMetricsSource) read. Without it those endpoints return 503
# (ErrMetricsUnavailable); instance-count still works (it counts pods directly).
#
# Production kubelets rotate serving certificates (w2/m81, docs/ADR072-security-review-round7.md
# finding 5 / ADR061 #11 / ADR063 #9) and Metrics Server verifies them against
# the cluster CA below, mounted from the `kube-root-ca.crt` ConfigMap every
# namespace already carries — no hostPath onto node PKI required. The
# disposable CAPD environment used to add an insecure compatibility flag in
# the local overlay only (never the production render); w2/m81 t003 retired
# that patch once the kubelet-csr-approver (kubelet-csr-approver.yaml) made
# local kubelets present real, verifiable serving certs too.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: bex-platform
  source:
    repoURL: oci://ghcr.io/bex-co/bex-charts/metrics-server
    path: .
    targetRevision: "sha256:6f84c5fc6e9ccf9535e6bd152db58ba59edc0d70705f1add93696f524a6553c7"
    helm:
      values: |
        args:
          - --kubelet-preferred-address-types=InternalIP,Hostname,ExternalIP
          - --kubelet-certificate-authority=/etc/kubernetes/pki/kubelet-ca/ca.crt
        extraVolumes:
          - name: kubelet-ca
            configMap:
              name: kube-root-ca.crt
        extraVolumeMounts:
          - name: kubelet-ca
            mountPath: /etc/kubernetes/pki/kubelet-ca
            readOnly: true
        # Fast enough resolution for a metrics page without hammering kubelets.
        metrics:
          enabled: false                    # metrics-server's own /metrics, not needed here
        # w1/m19 t003: platform pool
        nodeSelector:
          bex.co/pool: platform
        tolerations:
          - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
