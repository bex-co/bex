# metrics-server — the resource-metrics backend. Serves the aggregated
# metrics.k8s.io/v1beta1 API (pod/node CPU + memory), which is what `kubectl top`
# and bex-api's resource metrics (GET /v1/metrics/{cpu,memory}, via
# NewResourceMetricsSource) read. Without it those endpoints return 503
# (ErrMetricsUnavailable); instance-count still works (it counts pods directly).
#
# --kubelet-insecure-tls is required on CAPD (local mock) and other clusters whose
# kubelets serve certs the metrics-server can't verify; safe for dev, revisit for
# a hardened prod (drop it once kubelet serving certs are signed by the cluster CA).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server
    chart: metrics-server
    targetRevision: "3.12.*" # pin minor; metrics-server serves metrics.k8s.io/v1beta1
    helm:
      values: |
        args:
          - --kubelet-insecure-tls          # CAPD/dev kubelets: skip serving-cert verification
          - --kubelet-preferred-address-types=InternalIP,Hostname,ExternalIP
        # Fast enough resolution for a metrics page without hammering kubelets.
        metrics:
          enabled: false                    # metrics-server's own /metrics, not needed here
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
