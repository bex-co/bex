# CloudNativePG — the Postgres operator. Manages the bex control-plane database
# (see bex-postgres.yaml). Chosen over a plain StatefulSet / Bitnami chart for
# operator-managed lifecycle, smooth path to HA, and built-in backups to S3
# (Wasabi) for the "source of truth" durability story (docs/ADR003-control-plane.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1" # operator + CRDs before the Cluster (wave 2)
spec:
  project: bex-platform
  source:
    repoURL: oci://ghcr.io/bex-co/bex-charts/cloudnative-pg
    path: .
    targetRevision: "sha256:4ab30b6a4d8aa029ff551102ec2fd9835c9f16c91f73963618a970b0b10f5a67"
    helm:
      values: |
        image:
          tag: 1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07
        # Operator upgrades must preserve running single-instance tenant databases.
        config:
          data:
            ENABLE_INSTANCE_MANAGER_INPLACE_UPDATES: "true"
        # w1/m19 t003: platform pool
        nodeSelector:
          bex.co/pool: platform
        tolerations:
          - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CNPG CRDs exceed kubectl's 256KB last-applied-config annotation limit
