# Prometheus — the metrics-history backend AND bex's platform-alerting brain.
#
# Metrics history: bex-api's request metrics
# (GET /v1/metrics/{http-requests,http-latency,bandwidth}, via
# NewPrometheusRequestSource) query Traefik's per-service counters
# (traefik_service_requests_total / _request_duration_seconds_bucket /
# _responses_bytes_total, exposed by traefik.yaml's metrics.prometheus with
# addServicesLabels), and its resource metrics (cpu/memory/instance-count, via
# NewPrometheusResourceSource) query the kubelets' cAdvisor series
# (container_cpu_usage_seconds_total / container_memory_working_set_bytes).
# Without this, request metrics return 503 and resource metrics fall back to
# metrics-server's single-point snapshot.
#
# Platform alerting (w3/m6): Alertmanager is now enabled with one email receiver
# on bex's existing SendGrid relay, plus a small high-signal rule pack over
# platform and bex-specific invariants (serverFiles.alerting_rules.yml below).
# The chart auto-wires the server → bundled Alertmanager (cm.yaml injects the
# `alerting:` block whenever alertmanager.enabled), so we only declare rule_files
# here. The SendGrid API key is delivered OUT-OF-BAND — Secret `alertmanager-smtp`
# (key `smtp-password`) in the `monitoring` namespace, never in git
# (docs/ADR010-observability.md, same custody rule as the etcd/openbao-backup S3
# creds). Until it exists the Alertmanager pod stays in ContainerCreating — a
# deliberate one-time bootstrap step, like unsealing OpenBao. The LOCAL overlay
# disables Alertmanager (alertmanager.enabled=false) so the disposable CAPD
# cluster — which has no SMTP cred, exactly as it has no backup S3 creds — doesn't
# carry a permanently-pending pod; the server still evaluates the rules (visible
# in the Prometheus UI), and scripts/alerts-verify.sh stands up its own throwaway
# AM with a capture-webhook receiver (no real email sent).
#
# Exporter posture (was "server-only, no exporters"): still deliberately minimal.
# Enabled: Alertmanager (paging) + kube-state-metrics (object-state series the
# rule pack needs: kube_pod/deployment/node/cronjob/statefulset_*). Still OFF:
# pushgateway and node-exporter — the rules need no host-level series (PVC usage
# comes from the kubelet /metrics endpoint scraped below; node readiness comes
# from kube-state-metrics). Days-scale retention on a small PV; bex-api points at
# the server with BEX_PROM_URL=http://prometheus-server.monitoring.
#
# NOTE: the Traefik scrape target below matches pods labelled
# app.kubernetes.io/name=traefik on port 9100 (the metrics entrypoint). If the
# ingress chart's pod labels/port differ on this cluster, tune the relabel keep +
# port here (the label matching is the one cluster-specific knob).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1" # after traefik/metrics-server exist
spec:
  project: bex-platform
  source:
    repoURL: oci://ghcr.io/bex-co/bex-charts/prometheus
    path: .
    targetRevision: "sha256:79966b9d29997efc43b93b2df12b628479fcac2868d97a2d98b3e3d12d326ef7"
    helm:
      releaseName: prometheus
      values: |
        fullnameOverride: prometheus
        prometheus-pushgateway: { enabled: false }
        prometheus-node-exporter: { enabled: false }
        # Object-state series for the rule pack (pods/deployments/nodes/cronjobs/
        # statefulsets). The only exporter this milestone adds. Platform pool
        # (w1/m19), like the server.
        kube-state-metrics:
          enabled: true
          nodeSelector:
            bex.co/pool: platform
          tolerations:
            - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
        # Single-replica Alertmanager: the paging fan-out. No persistence — the
        # silence/notification log is ephemeral by design here (minimal footprint;
        # a restart at worst re-notifies once). One email receiver on the SendGrid
        # relay bex already runs (the w4/m12 invite / Kratos-courier relay,
        # smtp.sendgrid.net:587 STARTTLS, docs/ADR012-auth.md §Email) — no new
        # credential to mint. The SendGrid API key is read from a file mounted off
        # the out-of-band Secret `alertmanager-smtp` (key `smtp-password`), so no
        # credential ever lands in git; `to`/`from` are non-secret and committed.
        alertmanager:
          enabled: true
          replicaCount: 1
          persistence:
            enabled: false
          nodeSelector:
            bex.co/pool: platform
          tolerations:
            - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          extraSecretMounts:
            - name: smtp-password
              secretName: alertmanager-smtp
              mountPath: /etc/alertmanager/secrets
              readOnly: true
          config:
            global:
              resolve_timeout: 5m
              # SendGrid on 587/STARTTLS (465 is blocked from Hetzner — ADR012 §11).
              smtp_smarthost: smtp.sendgrid.net:587
              smtp_from: no-reply@bex.co
              smtp_auth_username: apikey # SendGrid's literal SMTP username; key is the password
              smtp_auth_password_file: /etc/alertmanager/secrets/smtp-password
              smtp_require_tls: true
            route:
              receiver: platform
              group_by: [alertname, namespace]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
            receivers:
              - name: platform
                email_configs:
                  - to: platform-alerts@bex.co # adjust to the on-call inbox; non-secret
                    send_resolved: true
        server:
          # Covers the dashboard's widest range preset (24h) with headroom;
          # cardinality is tiny (a handful of scrape jobs), so this is
          # disk-bounded, not memory-bounded. The PV rides the cluster default
          # StorageClass — hcloud-volumes on prod (a network volume, survives a
          # node loss), local-path on the CAPD mock (node-local) — so history
          # survives a pod restart (and a node loss on prod); with emptyDir a
          # reschedule silently wiped every chart.
          retention: 3d
          persistentVolume:
            enabled: true
            size: 8Gi
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          # w1/m19 t003: platform pool
          nodeSelector:
            bex.co/pool: platform
          tolerations:
            - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
        serverFiles:
          # Server config: rule files + scrape jobs. The `alerting:` block
          # (server → Alertmanager discovery) is injected by the chart because
          # alertmanager.enabled — do NOT also set it here (it would duplicate).
          prometheus.yml:
            rule_files:
              - /etc/config/alerting_rules.yml # the alerting_rules.yml key below
            scrape_configs:
              - job_name: traefik
                scrape_interval: 15s # fine-grained so request-metric rates resolve quickly
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [traefik]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    action: keep
                    regex: traefik
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9100
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
              - job_name: traefik-websocket-meter
                scrape_interval: 15s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [traefik]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    action: keep
                    regex: traefik
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9101
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: bex_websocket_(egress_bytes_total|meter_healthy|meter_process_start_time_seconds)
                    action: keep
              # cAdvisor: the raw series behind bex-api's cpu/memory/instance-count
              # history. Node SD, scraped THROUGH the apiserver proxy
              # (/api/v1/nodes/<node>/proxy/metrics/cadvisor) rather than the
              # kubelet directly: the pod network can't always reach every node's
              # :10250 (true on the CAPD mock), the apiserver always can, and the
              # ServiceAccount CA verifies the apiserver properly (no
              # insecure_skip_verify). The chart's default ClusterRole already
              # grants nodes + nodes/proxy + nodes/metrics, so no extra RBAC.
              # cAdvisor series natively carry namespace/pod/container labels; App
              # pods are matched downstream by Deployment pod-name shape
              # (<app>-<rs-hash>-<suffix>, see promResourceQueryFor) since kubelet
              # metrics don't carry pod labels like app.bex.co/app.
              - job_name: kubernetes-cadvisor
                scrape_interval: 15s
                scheme: https
                kubernetes_sd_configs:
                  - role: node
                tls_config:
                  ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                authorization:
                  credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                relabel_configs:
                  - target_label: __address__
                    replacement: kubernetes.default.svc:443
                  - source_labels: [__meta_kubernetes_node_name]
                    regex: (.+)
                    target_label: __metrics_path__
                    replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
                  - source_labels: [__meta_kubernetes_node_name]
                    target_label: node
                metric_relabel_configs:
                  # keep only real-container series; drop the pod-sandbox/aggregate
                  # rows (container="") that would double-count sum-by-pod queries
                  - source_labels: [container]
                    regex: ""
                    action: drop
              # kube-state-metrics: object-state series (Deployment/Pod/Node/
              # CronJob/StatefulSet status) that back the rule pack. Its Service is
              # a stable ClusterIP — a static target is enough.
              - job_name: kube-state-metrics
                scrape_interval: 60s # every consuming alert is for: 5m+ — 60s is plenty
                static_configs:
                  - targets: [prometheus-kube-state-metrics.monitoring.svc:8080]
              # SSH gateway operational metrics carry bounded result/scope
              # labels only—never subjects, targets, commands, or stream data.
              - job_name: bex-ssh-gateway
                scrape_interval: 15s
                static_configs:
                  - targets: [bex-ssh-gateway.bex-system.svc:9090]
              # Stripe Billing operations expose only account-wide gauges and
              # bounded operation/result labels. No workspace, provider object,
              # invoice, transaction, payment, or secret value is a label.
              - job_name: bex-api
                scrape_interval: 15s
                metrics_path: /metrics
                static_configs:
                  - targets: [bex-api.bex-system.svc:8091]
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: bex_billing_.*
                    action: keep
              # Build-plane SLIs from the operator's own registry (docs/ADR060
              # D5). This job is why the series are readable at all: the manager
              # binds its metrics endpoint only because config/manager sets
              # --metrics-bind-address, and nothing scraped it before w7/m83 —
              # so the w2/m72 build-outcome alerts were evaluating series that
              # never arrived. Labels are bounded by construction: an outcome
              # class, a retry reason from a closed set, and a workspace id on
              # the correlated-failure counter alone.
              #
              # The keep-list drops controller-runtime's and Go's default
              # families rather than storing them for nothing; add a family here
              # when something actually consumes it.
              - job_name: bex-operator
                scrape_interval: 15s
                static_configs:
                  - targets: [bex-controller-manager-metrics-service.bex-system.svc:8080]
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: bex_build.*
                    action: keep
              # One post-policy netfilter meter per untainted tenant node. Pod discovery
              # (rather than the round-robin Service) preserves the node and
              # source_instance labels needed to detect a missing/reset source.
              - job_name: bex-egress-meter
                scrape_interval: 15s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [bex-system]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_bex_co_component]
                    action: keep
                    regex: egress-meter
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9091
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    target_label: node
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: bex_(app_direct_egress_bytes_total|egress_meter_.*)
                    action: keep
              # Public Postgres front doors: backend→client bytes are counted
              # inside the SNI splice, labeled by the parent Database id.
              - job_name: bex-pg-proxy
                scrape_interval: 15s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [bex-system]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_bex_co_component]
                    action: keep
                    regex: pg-sni-proxy
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9092
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: bex_pg_proxy_(egress_bytes_total|healthy|process_start_time_seconds)
                    action: keep
              - job_name: bex-kv-proxy
                scrape_interval: 15s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [bex-system]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_bex_co_component]
                    action: keep
                    regex: kv-sni-proxy
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9093
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: bex_kv_proxy_(egress_bytes_total|healthy|process_start_time_seconds)
                    action: keep
              # kubelet /metrics (NOT cadvisor): only kubelet_volume_stats_* — the
              # PVC used/capacity bytes behind the PersistentVolumeFillingUp alert.
              # Same apiserver-proxy pattern as cadvisor; metric_relabel keeps just
              # those two series so this stays near-zero cardinality. 60s: the whole
              # kubelet /metrics payload is fetched per scrape (keep runs after), and
              # the only consumer is a for:15m alert over slow-moving disk usage.
              - job_name: kubernetes-kubelet
                scrape_interval: 60s
                scheme: https
                kubernetes_sd_configs:
                  - role: node
                tls_config:
                  ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                authorization:
                  credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                relabel_configs:
                  - target_label: __address__
                    replacement: kubernetes.default.svc:443
                  - source_labels: [__meta_kubernetes_node_name]
                    regex: (.+)
                    target_label: __metrics_path__
                    replacement: /api/v1/nodes/${1}/proxy/metrics
                  - source_labels: [__meta_kubernetes_node_name]
                    target_label: node
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: kubelet_volume_stats_(used|capacity)_bytes
                    action: keep
              # cert-manager controller metrics (:9402) — certmanager_certificate_*
              # for the CertificateNotReady / CertificateExpiringSoon alerts. Pod SD
              # scoped to the controller pod (webhook/cainjector don't serve these).
              - job_name: cert-manager
                scrape_interval: 60s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [cert-manager]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    action: keep
                    regex: cert-manager
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
                    action: keep
                    regex: controller
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9402
              # OpenBao PER-POD telemetry (:8200 /v1/sys/metrics) — seal state for
              # the OpenBaoSealed alert. Per-pod (not the round-robin Service) so a
              # single sealed raft follower is visible; sealed members still serve
              # /v1/sys/metrics (unauthenticated_metrics_access, set in
              # openbao.values.yaml) reporting vault_core_unsealed=0. The pod label
              # lets the alert name the sealed member.
              - job_name: openbao
                scrape_interval: 30s
                metrics_path: /v1/sys/metrics
                params:
                  format: [prometheus]
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [secrets]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    action: keep
                    regex: openbao
                  - source_labels: [__meta_kubernetes_pod_label_component]
                    action: keep
                    regex: server
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:8200
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                metric_relabel_configs:
                  # keep only the seal gauge (OpenBao keeps Vault's metric name; match
                  # a bao_ prefix too in case a future release rebrands it)
                  - source_labels: [__name__]
                    regex: (vault|bao)_core_unsealed
                    action: keep
              # Platform CNPG primary metrics (:9187) — pg_stat_archiver for the
              # PlatformDatabaseBackupStale alert. Scrape each primary directly
              # (not a round-robin Service), and stamp namespace + cluster labels
              # because the SQL metric itself carries neither.
              # Verify metric names on first deploy:
              #   kubectl -n auth exec kratos-db-1 -- curl -s :9187/metrics | grep archiver
              - job_name: cnpg-platform-db
                scrape_interval: 60s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [bex-system, auth]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
                    action: keep
                    regex: bex-db|kratos-db|hydra-db|openfga-db
                  - source_labels: [__meta_kubernetes_pod_label_role]
                    action: keep
                    regex: primary
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9187
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                  - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
                    target_label: cnpg_io_cluster
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: cnpg_pg_stat_archiver_.*
                    action: keep
              # CNPG TENANT database per-pod metrics (:9187) — w3/m10's
              # active-connections + replication-lag series, for every managed
              # Postgres (w1/m17) across every app namespace (bex's own bex-db
              # stays on the tightly-scoped cnpg-bex-db job above; dropped here
              # to avoid a double scrape). cnpg_backends_total's `total` column
              # has no cluster/namespace label of its own (CNPG's SQL query only
              # labels by datname/usename/application_name/state), so
              # cnpg_io_cluster/namespace/pod are stamped at scrape time —
              # exactly the label vocabulary lego/backend/internal/metrics's
              # DBConnections/ReplicationLag sources select on.
              - job_name: cnpg-tenant-db
                scrape_interval: 60s
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels: [__meta_kubernetes_namespace]
                    action: drop
                    regex: bex-system
                  - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
                    action: keep
                    regex: (.+)
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9187
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                  - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
                    target_label: cnpg_io_cluster
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: cnpg_backends_total|cnpg_pg_replication_.*
                    action: keep
              # Managed Key Value (Valkey) instances: the redis_exporter sidecar
              # the operator attaches to every KeyValue StatefulSet pod (w5/011),
              # scraped on :9121 across all namespaces (a KeyValue lives in its
              # App's namespace). Kept by the app.bex.co/keyvalue pod label; only
              # the redis_* series are retained — memory + connected-clients back
              # the Key Value metrics panel.
              - job_name: valkey-instances
                scrape_interval: 60s
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels:
                      [__meta_kubernetes_pod_label_app_bex_co_keyvalue]
                    action: keep
                    regex: .+
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9121
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: redis_.*
                    action: keep
          # ── Alerting rules ──────────────────────────────────────────────────
          # Small, high-signal pack: every alert carries a one-line description
          # with the kubectl command to start debugging. Two groups: `platform`
          # (generic health) and `bex` (bex's own promises). This block is the
          # single source of truth — scripts/gitops-validate.sh extracts it and
          # runs `promtool check rules` + `promtool test rules` against it (unit
          # tests in deploy/gitops/base/rules/alerts_test.yml).
          alerting_rules.yml:
            groups:
              - name: platform
                rules:
                  # NB: the platform-namespace allowlist is repeated verbatim in the
                  # next rule (PromQL has no variables) — keep both `namespace=~`
                  # lists in sync when a platform namespace is added.
                  - alert: PlatformPodCrashLooping
                    expr: |
                      max by (namespace, pod, container) (
                        kube_pod_container_status_waiting_reason{
                          reason="CrashLoopBackOff",
                          namespace=~"bex-system|argocd|traefik|auth|secrets|monitoring|cert-manager|cnpg-system|kube-system|bex-registry|opensandbox-system|dashboard"
                        }
                      ) > 0
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is CrashLoopBackOff"
                      description: "Platform container has been CrashLoopBackOff for >10m. Debug: kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}; kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c {{ $labels.container }} --previous"

                  - alert: PlatformDeploymentNotReady
                    expr: |
                      (
                        kube_deployment_spec_replicas{
                          namespace=~"bex-system|argocd|traefik|auth|secrets|monitoring|cert-manager|cnpg-system|kube-system|bex-registry|opensandbox-system|dashboard"
                        }
                        - on (namespace, deployment)
                        kube_deployment_status_replicas_available
                      ) > 0
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas"
                      description: "A platform Deployment has had fewer available than desired replicas for >10m (bad image / crash / unschedulable). Debug: kubectl -n {{ $labels.namespace }} rollout status deploy/{{ $labels.deployment }}; kubectl -n {{ $labels.namespace }} get pods"

                  # ADR075 D8 (w6/m42): email verification is a hard gate at the
                  # door, so the Kratos courier — the StatefulSet that delivers
                  # the verification codes — is a hard availability dependency
                  # for every new signup. A stalled courier blocks 100% of
                  # sign-ups silently (users stuck at a code prompt with nothing
                  # crashing), which is why it gets a dedicated alert instead of
                  # riding the Deployment rule above (it is a StatefulSet).
                  - alert: KratosCourierNotReady
                    expr: |
                      (
                        kube_statefulset_replicas{namespace="auth", statefulset="kratos-courier"}
                        - on (namespace, statefulset)
                        kube_statefulset_status_replicas_ready{namespace="auth", statefulset="kratos-courier"}
                      ) > 0
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Kratos courier is not ready — verification email delivery is stalled"
                      description: "kratos-courier has had fewer ready than desired replicas for >10m. Under the ADR075 D8 verification gate NO new user can complete sign-up until it recovers. Debug: kubectl -n auth get sts kratos-courier; kubectl -n auth logs sts/kratos-courier --tail=100; then check the SMTP relay (SendGrid prod / Mailpit local)."

                  # Control-plane node NotReady is a PAGE: the CP pool is a single
                  # node until the quota lift reverts the m19.1 TEMP knobs to 3 CP
                  # nodes, so it's the highest blast radius on the cluster. Worker
                  # nodes are warn (the autoscaler/other workers absorb one loss).
                  - alert: ControlPlaneNodeNotReady
                    expr: |
                      kube_node_status_condition{condition="Ready",status="true"} == 0
                      and on (node) kube_node_role{role="control-plane"}
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Control-plane node {{ $labels.node }} is NotReady"
                      description: "A control-plane node has been NotReady for >5m — highest blast radius while the CP pool is one node. Debug: kubectl describe node {{ $labels.node }}; kubectl get pods -A --field-selector spec.nodeName={{ $labels.node }}"

                  - alert: NodeNotReady
                    expr: |
                      kube_node_status_condition{condition="Ready",status="true"} == 0
                      unless on (node) kube_node_role{role="control-plane"}
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Node {{ $labels.node }} is NotReady"
                      description: "A worker node has been NotReady for >5m. Debug: kubectl describe node {{ $labels.node }}; kubectl get pods -A --field-selector spec.nodeName={{ $labels.node }}"

                  - alert: PersistentVolumeFillingUp
                    expr: |
                      kubelet_volume_stats_used_bytes
                      / kubelet_volume_stats_capacity_bytes
                      > 0.85
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"
                      description: "A platform PVC (etcd/Loki/OpenBao/Prometheus PVs — hcloud-csi on prod, local-path on the mock) is >85% full. Debug: kubectl -n {{ $labels.namespace }} get pvc {{ $labels.persistentvolumeclaim }}; grow the volume or prune data."

                  # Zot registry volume — fires before the generic PersistentVolumeFillingUp
                  # (>85%) so there's time to act before pushes start returning 500.
                  # Incident (2026-07-12): a runaway rebuild loop pushed 44+ image
                  # generations and filled the 10 Gi PVC with no prior warning.
                  # Retention policy (t003) caps at 5 generations per repo; this alert
                  # catches the volume still filling despite the cap (e.g. many active repos).
                  - alert: ZotRegistryFillingUp
                    expr: |
                      kubelet_volume_stats_used_bytes{namespace="bex-registry"}
                      / kubelet_volume_stats_capacity_bytes{namespace="bex-registry"}
                      > 0.70
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Zot registry PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"
                      description: "The Zot OCI registry PVC is >70% full — a runaway rebuild loop can fill it and silently 500 on pushes. Retention policy keeps 5 generations per repo; check kubelet_volume_stats_available_bytes, stale repos, and Zot logs, then resize if needed."

                  # Page before a large layer can exhaust the remaining bytes.
                  # The absolute 10 GiB floor complements the percentage guard:
                  # a registry with large images can fail a push well before 100%.
                  - alert: ZotRegistryAlmostFull
                    expr: |
                      (
                        kubelet_volume_stats_used_bytes{namespace="bex-registry"}
                        / kubelet_volume_stats_capacity_bytes{namespace="bex-registry"}
                        > 0.85
                      )
                      or
                      (
                        kubelet_volume_stats_available_bytes{namespace="bex-registry"}
                        < 10 * 1024 * 1024 * 1024
                      )
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Zot registry PVC {{ $labels.persistentvolumeclaim }} is almost full"
                      description: "The Zot OCI registry PVC is >85% full or has <10 GiB available; new image pushes can fail with HTTP 500. Grow the PVC immediately and verify retention/GC is reclaiming old layers."

                  # w7/036: a managed datastore that never provisions is the
                  # platform's quietest failure. CNPG's metrics come from instance
                  # pods, so a Cluster that never got one exports NOTHING — the
                  # absence is the symptom. Two production RBAC defects hid in
                  # exactly this gap and were found only by hand.
                  - alert: DatastoreStuckProvisioning
                    expr: bex_datastore_ready == 0 and on(kind, namespace, name) bex_datastore_age_seconds > 900
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "{{ $labels.kind }} {{ $labels.namespace }}/{{ $labels.name }} has not become ready (phase {{ $labels.phase }})"
                      description: "A managed datastore has been in phase {{ $labels.phase }} for over 15 minutes. The tenant sees a resource that never arrives and nothing else reports it. Check the CR's status conditions first; if it names an RBAC forbidden error, compare the operator and barman-plugin grants against .pm/w7/036.md."
                  # Observation must not fail silently: if the listing breaks, the
                  # readiness series simply vanish, and an alert on == 0 would go
                  # quiet exactly when it is blind.
                  - alert: DatastoreObservationFailing
                    expr: increase(bex_datastore_observe_errors_total[15m]) > 0
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Datastore readiness observation is failing"
                      description: "bex_datastore_ready is incomplete, so DatastoreStuckProvisioning cannot be trusted. Check the operator's RBAC for databases/keyvalues and its API connectivity."

                  - alert: CertificateNotReady
                    expr: certmanager_certificate_ready_status{condition="True"} == 0
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} is not Ready"
                      description: "cert-manager Certificate has been not-Ready for >15m (issuance/renewal failing). Debug: kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }}; kubectl -n {{ $labels.namespace }} get certificaterequest,order,challenge"

                  - alert: CertificateExpiringSoon
                    expr: |
                      (certmanager_certificate_expiration_timestamp_seconds - time()) < (14 * 24 * 3600)
                    for: 1h
                    labels:
                      severity: warning
                    annotations:
                      summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in <14d"
                      description: "A cert-manager Certificate expires in under 14 days and has not renewed. Debug: kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }}"

                  # Admin-cert expiry: the CAPI-minted kubernetes-admin client cert
                  # (CN=kubernetes-admin, O=system:masters) has ~1-year validity.
                  # Expiry is approximated from the bex-kubeconfig Secret's creation
                  # timestamp (CAPI refreshes the Secret when kubeadm renews the cert).
                  # Fires 30d before expected expiry. Runbook: docs/ADR036-ca-rotation-runbook.md
                  # The namespace matcher spans both `default` and the locked-down
                  # `bex-capi` so it keeps working across the codex #5 relocation of
                  # bex-kubeconfig out of the operator-readable default namespace
                  # (docs/runbooks/operator-kubeconfig-isolation.md).
                  - alert: AdminCertExpiringSoon
                    expr: |
                      (kube_secret_created{namespace="bex-capi", secret="bex-kubeconfig"} + 31536000 - time()) < (30 * 24 * 3600)
                    for: 1h
                    labels:
                      severity: warning
                    annotations:
                      summary: "App cluster admin cert (bex-kubeconfig) expires within 30d"
                      description: "The bex-kubeconfig Secret (holds CN=kubernetes-admin, O=system:masters cert, 1-year validity from CAPI mint) is estimated to expire within 30 days. Renew: sudo kubeadm certs renew all (on each CP node), then re-fetch: scripts/fetch-app-kubeconfig.sh. Scoped kubeconfig: scripts/operator-kubeconfig.sh. Break-glass check: sudo kubeadm certs check-expiration. Runbook: docs/ADR036-ca-rotation-runbook.md"

              - name: bex
                rules:
                  # Build-plane SLIs (docs/ADR060 D5).
                  #
                  # The SLO is on INFRASTRUCTURE success, not on build success. A
                  # tenant's broken Dockerfile is not a platform failure, so
                  # user_failed is excluded from the ratio entirely — including it
                  # would make the error budget a function of how many tenants
                  # pushed bad code that day, which no operator can act on.
                  #
                  # outcome="user_failed" is deterministic tenant input, failed
                  # once and not retried; outcome="infra_failed" is a transient or
                  # unclassified failure that exhausted its retry budget.
                  # `or vector(1)`: with no infra failures yet the numerator
                  # selects nothing and the whole expression would be absent
                  # rather than 1, so a healthy fleet would have no SLO series
                  # at all — indistinguishable on a dashboard from a broken rule.
                  - record: bex:build_infra_success_ratio:rate1h
                    expr: |
                      (
                      1 - (
                        sum(rate(bex_build_outcomes_total{outcome="infra_failed"}[1h]))
                        /
                        clamp_min(
                          sum(rate(bex_build_outcomes_total{outcome=~"succeeded|infra_failed|failed|timeout"}[1h])),
                          0.0000001
                        )
                      )
                      ) or vector(1)

                  - alert: BuildInfraSuccessBelowSLO
                    expr: bex:build_infra_success_ratio:rate1h < 0.995
                    for: 30m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Build infrastructure success is {{ $value | humanizePercentage }} (SLO 99.5%)"
                      description: "Builds are failing for reasons the platform owns, not tenant code (outcome=infra_failed excludes user_failed by construction). Check bex_build_outcomes_total by outcome, the Zot push path, and node capacity on the build pools. Runbook context: docs/ADR060-build-worker-reliability-and-performance.md D5."

                  # The flake-vs-user discriminator. Infrastructure causes are
                  # SYNCHRONIZED across independent tenants (a bad node, a sick
                  # registry); tenant errors are isolated and deterministic per
                  # commit. So the signal is not the failure count but its SPREAD:
                  # three or more distinct workspaces failing infra-side inside 15
                  # minutes is a platform incident, while thirty failures inside one
                  # workspace is one tenant having a bad afternoon and must not page.
                  #
                  # Threshold rationale: bex runs ~17 workspaces, so 3 distinct is
                  # ~18% of the estate — well above coincidence, low enough to fire
                  # before most tenants notice. Revisit the constant if the estate
                  # grows by an order of magnitude.
                  - alert: BuildInfraFailuresCorrelatedAcrossWorkspaces
                    expr: |
                      count(
                        sum by (workspace) (
                          increase(bex_build_infra_failures_total[15m])
                        ) > 0
                      ) >= 3
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Infra-classified build failures across {{ $value }} distinct workspaces"
                      description: "Independent workspaces are failing builds infra-side at the same time, which is the signature of a platform fault rather than tenant code. Suspect the shared dependencies first: Zot (push/pull), the build node pools, image pulls. Isolated per-tenant failures deliberately do NOT fire this."

                  # ── Build QUEUE time: the platform's own capacity SLI ──────
                  # Every incident in this class has presented as SILENCE and was
                  # diagnosed by hand-descending through Traefik -> bex-api ->
                  # controller logs (2026-08-08 a build wedged in Building with
                  # zero output; 2026-08-11 a build sat Pending 22 minutes and the
                  # deploy was failed by the control-plane gate while the build
                  # itself was perfectly healthy). Queue time is OURS; run time is
                  # mostly the tenant's, so only the former is alertable.
                  #
                  # THRESHOLD ARITHMETIC (the reason for 8m, not a round number):
                  # bex-api's DeployGateTimeout is 18m (internal/store/reconciler.go
                  # defaultDeployGateTimeout; m80 settled the three-timer
                  # relationship). An alert must fire while the deploy can still be
                  # saved, not report history. bex_build_queue_oldest_seconds is
                  # the age of the longest-CURRENTLY-queued build, so 480s + for:2m
                  # fires at ~10 minutes of queueing — 8 minutes of head room before
                  # the gate closes the deploy. Raising DeployGateTimeout without
                  # revisiting this number silently spends that head room.
                  - alert: BuildQueuedTooLong
                    expr: bex_build_queue_oldest_seconds > 480
                    for: 2m
                    labels:
                      severity: warning
                    annotations:
                      summary: "A build has been queued {{ $value | humanizeDuration }} waiting for capacity"
                      description: "A build Job's pod has not been placed on a node. It will be failed by bex-api's 18m deploy gate if this continues, so act now: check the build pools (bex-tenant-lg warm, bex-tenant-burst elastic) for scale-from-zero failures, cluster-autoscaler events, and whether a taint/toleration or capacity-hint change made the 7Gi build request unschedulable. Runbook context: docs/ADR060-build-worker-reliability-and-performance.md D5/D8."

                  # The distribution alert. Individually-tolerable waits that have
                  # become the NORM are a capacity decision the fleet should make
                  # deliberately, not a page — hence warning, a long window, and a
                  # threshold (5m p95) well under the per-build one above: this
                  # fires when queueing is chronic, that one when it is acute.
                  # `or vector(0)` keeps the series present on an idle fleet, so a
                  # missing rule is distinguishable from a healthy one.
                  - alert: BuildQueueTimeHigh
                    expr: |
                      (
                        histogram_quantile(0.95,
                          sum by (le) (rate(bex_build_queue_seconds_bucket[30m]))
                        ) or vector(0)
                      ) > 300
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Build queue p95 is {{ $value | humanizeDuration }} (capacity, not tenant code)"
                      description: "Builds are chronically waiting for a node before they start. This is the platform's SLI, not the tenant's: compare bex_build_run_seconds, which should be unaffected. Consider the build pools' max-size, BEX_MAX_ACTIVE_BUILDS, and whether cold scale-from-zero (bex_builds_queued > 0 with bex-tenant-burst at 0 replicas) dominates. Runbook context: docs/ADR060-build-worker-reliability-and-performance.md D5."

                  # Build-toolchain freshness (docs/ADR060 D7, w4/m86). Readiness
                  # and age are distinct: a Ready builder can still be a stale
                  # pin, and a recently reviewed pin can still be unready.
                  # The 30-day SLO is a review cadence, not an automatic upgrade.
                  - alert: ClusterBuilderNotReady
                    expr: |
                      bex_build_clusterbuilder_present != 1
                      or
                      bex_build_clusterbuilder_ready != 1
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "kpack ClusterBuilder bex is not Ready"
                      description: "The platform ClusterBuilder has been missing, unknown, or not Ready for >15m, so buildpack deploys may stall or ship an incomplete builder. Inspect: kubectl get clusterbuilder bex -o yaml. Refresh is a reviewed digest update via python3 scripts/lib/toolchain-freshness.py resolve and .github/workflows/build-toolchain-freshness.yml — never an automatic rollout. Runbook: docs/ADR060-build-worker-reliability-and-performance.md D7."

                  - alert: ClusterBuilderImageStale
                    expr: |
                      bex_build_clusterbuilder_image_resolved_timestamp_seconds <= 0
                      or
                      (time() - bex_build_clusterbuilder_image_resolved_timestamp_seconds) > (30 * 24 * 3600)
                    for: 1h
                    labels:
                      severity: warning
                    annotations:
                      summary: "ClusterBuilder image pin is older than the 30-day freshness SLO"
                      description: "Committed builder resolution metadata is missing, malformed, or older than 30 days. Resolve with python3 scripts/lib/toolchain-freshness.py resolve, review the observed digest, update the listed files and resolved_at together. The workflow never applies a pin. Runbook: docs/ADR060-build-worker-reliability-and-performance.md D7."

                  - alert: EgressMeterTargetMissing
                    expr: |
                      count(up{job="bex-egress-meter"} == 1)
                      !=
                      count(
                        kube_node_info
                        unless on (node) kube_node_spec_taint{key="bex.co/platform", value="true"}
                        unless on (node) kube_node_role{role="control-plane"}
                      )
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Not every tenant node has a scrapeable egress meter"
                      description: "Outbound accounting is incomplete: the Ready egress-meter target count differs from the untainted tenant-node count. Do not collect affected hourly egress windows. Debug: kubectl -n bex-system get pods -l app.bex.co/component=egress-meter -o wide; kubectl get nodes --show-labels"

                  - alert: EgressMeterUnhealthy
                    expr: min by (node) (bex_egress_meter_healthy) == 0
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Egress meter on {{ $labels.node }} is incomplete"
                      description: "At least one App Pod IP lacks stable attribution, or the meter reported a map/checkpoint error. The affected hourly source must fail rather than become zero. Debug: kubectl -n bex-system logs -l app.bex.co/component=egress-meter --prefix"

                  - alert: EgressMeterCounterLoss
                    expr: max by (node) (bex_egress_meter_last_counter_loss_time_seconds) > 0 and (time() - max by (node) (bex_egress_meter_last_counter_loss_time_seconds)) < 3600
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Egress meter on {{ $labels.node }} detected counter loss"
                      description: "The meter restored a node checkpoint or observed a counter decrease within the last hour. Its durable event timestamp rejects every overlapping direct-egress window automatically; inspect the node and pinned maps."

                  - alert: EgressMeterMapPressure
                    expr: max by (node) (bex_egress_meter_resource_map_pressure_ratio) > 0.80
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Egress meter resource map on {{ $labels.node }} is {{ $value | humanizePercentage }} full"
                      description: "The bounded App counter map is above 80%; reaching capacity makes new attribution fail closed. Debug: kubectl -n bex-system logs -l app.bex.co/component=egress-meter --prefix"

                  - alert: WebSocketEgressMeterUnavailable
                    expr: |
                      sum(absent(up{job="traefik-websocket-meter"}))
                      or min(up{job="traefik-websocket-meter"}) == 0
                      or sum(absent(bex_websocket_meter_healthy))
                      or min(bex_websocket_meter_healthy) == 0
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: "WebSocket outbound accounting is unavailable"
                      description: "The Traefik hijack-path byte meter is missing or unhealthy. Public WebSocket usage windows must fail rather than omit frames. Debug: kubectl -n traefik logs -l app.kubernetes.io/name=traefik; kubectl -n traefik get pods -o wide"

                  - alert: PostgresEgressProxyUnavailable
                    expr: |
                      sum(absent(up{job="bex-pg-proxy"}))
                      or min(up{job="bex-pg-proxy"}) == 0
                      or sum(absent(bex_pg_proxy_healthy{resource_kind="postgres"}))
                      or min(bex_pg_proxy_healthy{resource_kind="postgres"}) == 0
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Postgres outbound accounting is unavailable"
                      description: "The public Postgres proxy meter is missing or unhealthy. Public Database usage windows must fail rather than undercount. Debug: kubectl -n bex-system get pods -l app.bex.co/component=pg-sni-proxy -o wide"

                  - alert: KeyValueEgressProxyUnavailable
                    expr: |
                      sum(absent(up{job="bex-kv-proxy"}))
                      or min(up{job="bex-kv-proxy"}) == 0
                      or sum(absent(bex_kv_proxy_healthy{resource_kind="key_value"}))
                      or min(bex_kv_proxy_healthy{resource_kind="key_value"}) == 0
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Key Value outbound accounting is unavailable"
                      description: "The public Key Value proxy meter is missing or unhealthy. Public Key Value usage windows must fail rather than undercount. Debug: kubectl -n bex-system get pods -l app.bex.co/component=kv-sni-proxy -o wide"

                  - alert: BackupCronJobStale
                    expr: |
                      (
                        (time() - kube_cronjob_status_last_successful_time{cronjob=~"etcd-backup|openbao-backup|kvbak-.*"}) > (26 * 3600)
                        or
                        (
                          (time() - kube_cronjob_created{cronjob=~"etcd-backup|openbao-backup|kvbak-.*"}) > (26 * 3600)
                          unless on(namespace, cronjob)
                            kube_cronjob_status_last_successful_time{cronjob=~"etcd-backup|openbao-backup|kvbak-.*"}
                        )
                      )
                      and on(namespace, cronjob)
                        (kube_cronjob_spec_suspend{cronjob=~"etcd-backup|openbao-backup|kvbak-.*"} == 0)
                    for: 0m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Backup {{ $labels.namespace }}/{{ $labels.cronjob }} has not succeeded in >26h"
                      description: "The nightly {{ $labels.cronjob }} has no successful backup in over 26h — silent backup rot is unrecoverable data loss. Debug: kubectl -n {{ $labels.namespace }} get cronjob {{ $labels.cronjob }}; kubectl -n {{ $labels.namespace }} get jobs -l batch.kubernetes.io/cronjob-name={{ $labels.cronjob }}. Runbooks: docs/ADR011-etcd-backup-restore.md, docs/ADR015-openbao-backup-restore.md, docs/ADR021-keyvalue-management.md, docs/ADR031-platform-data-backup.md"

                  # Plugin-backed WAL archiver staleness for every platform DB —
                  # the path CronJobStale cannot see (continuous WAL uses
                  # pg_stat_archiver, not a CronJob). One alert instance is
                  # emitted per cluster after >26h without an archived segment.
                  - alert: PlatformDatabaseBackupStale
                    expr: |
                      (time() - cnpg_pg_stat_archiver_last_archived_time{job="cnpg-platform-db"}) > (26 * 3600)
                    for: 0m
                    labels:
                      severity: critical
                    annotations:
                      summary: "{{ $labels.namespace }}/{{ $labels.cnpg_io_cluster }} WAL archiving stalled (>26h)"
                      description: "{{ $labels.namespace }}/{{ $labels.cnpg_io_cluster }} has not archived a WAL segment in >26h — platform recovery data is at risk. Debug: inspect pg_stat_archiver, the cluster's Barman ObjectStore, the barman-cloud deployment and sidecar logs, then verify the referenced Secret exists without printing it. Runbook: docs/ADR031-platform-data-backup.md"

                  # Per-MEMBER seal detection off the openbao per-pod telemetry
                  # scrape (vault_core_unsealed=0 ⇒ sealed). Not the round-robin
                  # Service or readiness: the chart's readiness probe keeps a sealed
                  # member in rotation (sealedcode 2xx), so a Service/readiness check
                  # would miss a sealed follower — this fires on ANY member sealed.
                  - alert: OpenBaoSealed
                    expr: |
                      min by (namespace, pod) (
                        {__name__=~"(vault|bao)_core_unsealed", namespace="secrets"}
                      ) == 0
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "OpenBao member {{ $labels.pod }} is SEALED"
                      description: "An OpenBao raft member has been sealed for >5m, which 503s the tenant env-vars API. Unseal: scripts/bao-init.sh (unseal path); runbook docs/ADR013-secrets.md. Debug: kubectl -n secrets get pods; kubectl -n secrets exec {{ $labels.pod }} -- bao status"

                  - alert: BexApiDown
                    expr: kube_deployment_status_replicas_available{namespace="bex-system", deployment="bex-api"} == 0
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "bex-api has no available replicas"
                      description: "The bex-api control-plane surface (REST/GraphQL/MCP) has had zero available replicas for >5m. Debug: kubectl -n bex-system rollout status deploy/bex-api; kubectl -n bex-system logs deploy/bex-api"

                  - alert: WebhookDeliveryAdmissionPressure
                    expr: |
                      sum(
                        increase(bex_webhooks_delivery_admissions_total{result="capped"}[15m])
                      ) > 100
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Outbound webhook admission is chronically hitting its workspace bound"
                      description: "More than 100 webhook notifications were capped in each rolling 15m window for >10m. First investigate event amplification and unhealthy endpoints/retry pressure; raise BEX_MAX_WEBHOOK_DELIVERIES_PER_WORKSPACE only after confirming database and worker capacity. Runbook: docs/ADR010-observability.md#webhook-admission-pressure"

                  - alert: BillingExportBacklog
                    expr: |
                      bex_billing_enabled == 1
                      and bex_billing_outbox_oldest_pending_age_seconds > (72 * 3600)
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Stripe billing export backlog is older than 72h"
                      description: "A sealed usage row has remained pending for >24h beyond the 48h seal horizon. Inspect without replay: scripts/stripe-billing-reconcile.sh issues. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

                  - alert: BillingPermanentReject
                    expr: |
                      bex_billing_enabled == 1
                      and bex_billing_export_rejected_rows > 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Stripe permanently rejected billing meter events"
                      description: "One or more usage rows are held in the durable reject queue. Dry-run reconciliation before retry or acknowledgement: scripts/stripe-billing-reconcile.sh issues. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

                  - alert: BillingExportAmbiguity
                    expr: |
                      bex_billing_enabled == 1
                      and bex_billing_export_ambiguous_rows > 0
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Stripe billing export has an old ambiguous provider outcome"
                      description: "An attempted event exceeded Stripe's 24h identifier window without a local stamp and automatic replay stopped. Reconcile provider summaries, then explicitly mark repaired or acknowledge; never blind-retry. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

                  - alert: BillingLocalStampFailure
                    expr: |
                      sum by (job, instance) (
                        increase(bex_billing_operations_total{operation="local_stamp",result="error"}[15m])
                      ) > 0
                      and on (job, instance) bex_billing_enabled == 1
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Stripe accepted usage but the local export stamp failed"
                      description: "Provider acceptance may be ahead of local state. Restore Postgres and reconcile before the 24h identifier window expires. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

                  - alert: BillingProviderDuplicate
                    expr: |
                      sum by (job, instance) (
                        increase(bex_billing_operations_total{operation=~"duplicate_customer|duplicate_subscription",result="error"}[15m])
                      ) > 0
                      and on (job, instance) bex_billing_enabled == 1
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Stripe billing found duplicate Customer or Subscription ownership"
                      description: "The fail-closed ownership resolver found multiple provider objects for one workspace. Do not delete automatically; inspect metadata and subscription status under the test-mode guard. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

                  - alert: BillingInvoiceReadDegraded
                    expr: |
                      sum by (job, instance) (
                        increase(bex_billing_operations_total{operation="invoice_read",result="error"}[15m])
                      ) > 2
                      and on (job, instance) bex_billing_enabled == 1
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Stripe invoice read-back is degraded"
                      description: "Repeated invoice preview/history reads failed; the usage surface is falling back to estimates. Check restricted-key permissions and Stripe API health. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

                  - alert: BillingWebhookDrift
                    expr: |
                      sum by (job, instance) (
                        increase(bex_billing_operations_total{operation=~"webhook_signature|webhook_version|webhook_mode",result="error"}[15m])
                      ) > 0
                      and on (job, instance) bex_billing_enabled == 1
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Stripe billing webhook signature, API version, or mode drifted"
                      description: "Webhook intake rejected a signature, pinned API version, or test/live mode mismatch. Verify the test endpoint and rotate add→verify→revoke; never weaken verification. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

                  - alert: BillingProvisioningFailure
                    expr: |
                      sum by (job, instance) (
                        increase(bex_billing_operations_total{operation="provisioning",result="error"}[15m])
                      ) > 2
                      and on (job, instance) bex_billing_enabled == 1
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Stripe Customer or Subscription provisioning is repeatedly failing"
                      description: "Usage cannot export until the workspace's unique Customer and metered Subscription converge. Inspect catalog/key permissions and duplicate-object alerts. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

                  # Stranded node-local images: App images are node-local ctr imports
                  # (no registry — zot is empty), so a tenant-node replacement or an
                  # autoscaler scale-down strands them and App pods sit in
                  # ImagePullBackOff/ErrImageNeverPull. A PLATFORM defect of the
                  # node-local-image design, not tenant paging — hence severity warn.
                  - alert: StrandedNodeLocalImages
                    expr: |
                      max by (namespace, pod, container) (
                        kube_pod_container_status_waiting_reason{
                          reason=~"ImagePullBackOff|ErrImageNeverPull",
                          namespace="default"
                        }
                      ) > 0
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "App {{ $labels.namespace }}/{{ $labels.pod }} can't pull its node-local image"
                      description: "An App pod has been ImagePullBackOff/ErrImageNeverPull for >10m — a node-local image was stranded by node replacement or scale-down (no registry to re-pull from). Re-import: the /deploy-app-from-local runbook. Debug: kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}"

                  - alert: TraefikHigh5xxRate
                    expr: |
                      (
                        sum(rate(traefik_service_requests_total{code=~"5.."}[5m]))
                        / sum(rate(traefik_service_requests_total[5m]))
                      ) > 0.05
                      and
                      sum(rate(traefik_service_requests_total[5m])) > 0.1
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Traefik is serving >5% 5xx responses"
                      description: "Over 5% of edge requests have been 5xx for >10m (with meaningful traffic). Debug: kubectl -n traefik logs deploy/traefik; check upstream service health and recent deploys."
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
