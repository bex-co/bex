# Prometheus — the metrics-history backend AND bex's platform-alerting brain.
#
# Metrics history: bex-api's request metrics
# (GET /v1/metrics/{http-requests,http-latency,bandwidth}, via
# NewPrometheusRequestSource) query Traefik's per-service counters
# (traefik_service_requests_total / _request_duration_seconds_bucket /
# _responses_bytes_total, exposed by traefik.yaml's metrics.prometheus with
# addServicesLabels), and its resource metrics (cpu/memory/instance-count, via
# NewPrometheusResourceSource) query the kubelets' cAdvisor series
# (container_cpu_usage_seconds_total / container_memory_working_set_bytes).
# Without this, request metrics return 503 and resource metrics fall back to
# metrics-server's single-point snapshot.
#
# Platform alerting (w3/m6): Alertmanager is now enabled with one email receiver
# on bex's existing SendGrid relay, plus a small high-signal rule pack over
# platform and bex-specific invariants (serverFiles.alerting_rules.yml below).
# The chart auto-wires the server → bundled Alertmanager (cm.yaml injects the
# `alerting:` block whenever alertmanager.enabled), so we only declare rule_files
# here. The SendGrid API key is delivered OUT-OF-BAND — Secret `alertmanager-smtp`
# (key `smtp-password`) in the `monitoring` namespace, never in git
# (docs/ADR010-observability.md, same custody rule as the etcd/openbao-backup S3
# creds). Until it exists the Alertmanager pod stays in ContainerCreating — a
# deliberate one-time bootstrap step, like unsealing OpenBao. The LOCAL overlay
# disables Alertmanager (alertmanager.enabled=false) so the disposable CAPD
# cluster — which has no SMTP cred, exactly as it has no backup S3 creds — doesn't
# carry a permanently-pending pod; the server still evaluates the rules (visible
# in the Prometheus UI), and scripts/alerts-verify.sh stands up its own throwaway
# AM with a capture-webhook receiver (no real email sent).
#
# Exporter posture (was "server-only, no exporters"): still deliberately minimal.
# Enabled: Alertmanager, kube-state-metrics and the filesystem-only node exporter
# on tenant/build nodes. The exporter observes their shared node/image root disk;
# it does not collect a general host-metric suite. Pushgateway remains disabled.
# PVC usage comes from kubelet metrics; node readiness from kube-state-metrics.
# Days-scale retention on a small PV; bex-api points at
# the server with BEX_PROM_URL=http://prometheus-server.monitoring.
#
# NOTE: the Traefik scrape target below matches pods labelled
# app.kubernetes.io/name=traefik on port 9100 (the metrics entrypoint). If the
# ingress chart's pod labels/port differ on this cluster, tune the relabel keep +
# port here (the label matching is the one cluster-specific knob).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1" # after traefik/metrics-server exist
spec:
  project: bex-platform
  # Each revision stores another copy of the inline rule pack. Ten histories
  # exceeded etcd's request limit during m164; retain three local rollback
  # entries and use Git for older configurations.
  revisionHistoryLimit: 3
  source:
    repoURL: oci://ghcr.io/bex-co/bex-charts/prometheus
    path: .
    targetRevision: "sha256:79966b9d29997efc43b93b2df12b628479fcac2868d97a2d98b3e3d12d326ef7"
    helm:
      releaseName: prometheus
      values: |
        fullnameOverride: prometheus
        prometheus-pushgateway: { enabled: false }
        prometheus-node-exporter:
          enabled: true
          hostNetwork: false
          hostPID: false
          hostIPC: false
          service:
            type: ClusterIP
            listenOnAllInterfaces: true
          serviceAccount:
            automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/os: linux
            bex.co/pool: tenant
          tolerations:
            - { key: bex.co/build-only, operator: Equal, value: "true", effect: NoSchedule }
          containerSecurityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          hostRootFsMount:
            enabled: true
            mountPropagation: HostToContainer
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          extraArgs:
            - --collector.disable-defaults
            - --collector.filesystem
            - --web.disable-exporter-metrics
            # Exclude transient/pod mounts before statfs. The locked 1.8.2
            # exporter supports exclude filters; the scrape below keeps only
            # bounded paths that can back nodefs or a separate imagefs.
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/(docker|containers|kubelet/(pods|plugins)|containerd/[^/]*snapshot[^/]*))($|/)
            - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tmpfs|tracefs)$
        # Object-state series for the rule pack (pods/deployments/nodes/cronjobs/
        # statefulsets), on the platform pool like the server. The one exported
        # node label supplies expected coverage even when an exporter vanishes.
        kube-state-metrics:
          enabled: true
          metricLabelsAllowlist:
            - nodes=[bex.co/pool]
          nodeSelector:
            bex.co/pool: platform
          tolerations:
            - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
        # Single-replica Alertmanager: the paging fan-out. PERSISTENT (small PVC,
        # 2026-09-11): silences and the notification log survive a pod restart,
        # so "silence it and file the .pm note" is a reliable way to acknowledge a
        # known alert, and a restart never re-notifies. It was ephemeral before,
        # and a restart dropped every silence — with four alerts firing for weeks
        # that meant the only working mute was the inbox's delete key
        # (docs/ADR010-observability.md §Three tiers). One email receiver on the
        # SendGrid relay bex already runs (the w4/m12 invite / Kratos-courier
        # relay, smtp.sendgrid.net:587 STARTTLS, docs/ADR012-auth.md §Email) — no
        # new credential to mint. The SendGrid API key is read from a file mounted
        # off the out-of-band Secret `alertmanager-smtp` (key `smtp-password`), so
        # no credential ever lands in git; `to`/`from` are non-secret and committed.
        alertmanager:
          enabled: true
          replicaCount: 1
          # A StatefulSet's volumeClaimTemplates are immutable, so turning
          # persistence on (or resizing it) cannot be applied over the existing
          # object. Force+Replace lets Argo delete+recreate the StatefulSet; the
          # PVC outlives it (StatefulSet deletion never cascades to PVCs). Paired
          # with ApplyOutOfSyncOnly on the Application so this only happens when
          # the StatefulSet itself drifted, not on every rule edit.
          statefulSet:
            annotations:
              argocd.argoproj.io/sync-options: Force=true,Replace=true
          persistence:
            enabled: true
            # The data is kilobytes (silences + notification log); hcloud-csi
            # rounds any request up to its 10Gi minimum on prod, local-path
            # allocates lazily on the mock cluster (where AM is disabled anyway).
            size: 1Gi
          nodeSelector:
            bex.co/pool: platform
          tolerations:
            - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          extraSecretMounts:
            - name: smtp-password
              secretName: alertmanager-smtp
              mountPath: /etc/alertmanager/secrets
              readOnly: true
          config:
            global:
              resolve_timeout: 5m
              # SendGrid on 587/STARTTLS (465 is blocked from Hetzner — ADR012 §11).
              smtp_smarthost: smtp.sendgrid.net:587
              smtp_from: no-reply@bex.co
              smtp_auth_username: apikey # SendGrid's literal SMTP username; key is the password
              smtp_auth_password_file: /etc/alertmanager/secrets/smtp-password
              smtp_require_tls: true
            # Three tiers (docs/ADR010-observability.md §Three tiers):
            #   critical → PAGE.   Its own email per alert group, re-sent every 4h
            #              while firing, resolved mail sent.
            #   warning  → TICKET. ONE digest email listing every open warning,
            #              re-sent at most daily. A new warning joins the digest
            #              within group_interval; nothing is sent on resolve (the
            #              next digest simply omits it). A warning that fires for
            #              days is visible every day without being six emails a
            #              day — four such alerts were 24 emails/day before this.
            #   info     → DASHBOARD. Black-holed at the `null` receiver; visible
            #              in Alertmanager/Grafana only (customer-actionable, e.g.
            #              a tenant's own custom-domain DNS not pointing at bex).
            route:
              receiver: platform
              group_by: [alertname, namespace]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                - matchers:
                    - severity="info"
                  receiver: "null"
                - matchers:
                    - severity="warning"
                  receiver: platform-digest
                  group_by: [severity]
                  group_wait: 5m
                  group_interval: 30m
                  repeat_interval: 24h
            receivers:
              - name: platform
                email_configs:
                  # This must remain a deliverable mailbox the operator reads;
                  # Alertmanager cannot detect a recipient domain with no MX.
                  - to: puncsky@gmail.com # operator on-call inbox; non-secret
                    send_resolved: true
              # Same mailbox, digest semantics: one message for the whole warning
              # group, no resolved mail. The subject carries the open count so an
              # inbox filter can key on it.
              - name: platform-digest
                email_configs:
                  - to: puncsky@gmail.com
                    send_resolved: false
                    headers:
                      Subject: "[bex] {{ .Alerts.Firing | len }} warning(s) open (daily digest)"
              # Black hole for non-paging (info) alerts: a receiver with no notifier
              # config delivers nowhere while Alertmanager still tracks the alert.
              - name: "null"
            # One page per broken thing. A not-Ready cert is already paging, so its
            # "expiring" twin is redundant; and a tenant custom-domain cert owned
            # by the info rules must never reach the platform rules even if a
            # future edit loosens their carve-out. `equal` pins both to the same
            # Certificate — both rule families carry namespace + name.
            inhibit_rules:
              - source_matchers: [alertname="CertificateNotReady"]
                target_matchers: [alertname="CertificateExpiringSoon"]
                equal: [namespace, name]
              - source_matchers: [alertname=~"TenantCustomDomainCert.*"]
                target_matchers: [alertname=~"CertificateNotReady|CertificateExpiringSoon"]
                equal: [namespace, name]
        server:
          # Covers the dashboard's widest range preset (24h) with headroom;
          # cardinality is tiny (a handful of scrape jobs), so this is
          # disk-bounded, not memory-bounded. The PV rides the cluster default
          # StorageClass — hcloud-volumes on prod (a network volume, survives a
          # node loss), local-path on the CAPD mock (node-local) — so history
          # survives a pod restart (and a node loss on prod); with emptyDir a
          # reschedule silently wiped every chart.
          retention: 3d
          persistentVolume:
            enabled: true
            size: 8Gi
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          # w1/m19 t003: platform pool
          nodeSelector:
            bex.co/pool: platform
          tolerations:
            - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
          # The etcd job verifies the metrics proxy against this private CA
          # (w7/m160). Only the public ca.crt is projected; optional so a
          # missing Secret never blocks Prometheus itself.
          extraVolumes:
            - name: etcd-metrics-ca
              secret:
                secretName: etcd-metrics-ca
                optional: true
                items:
                  - { key: ca.crt, path: ca.crt }
          extraVolumeMounts:
            - { name: etcd-metrics-ca, mountPath: /etc/prometheus/etcd-metrics-ca, readOnly: true }
        serverFiles:
          # Server config: rule files + scrape jobs. The `alerting:` block
          # (server → Alertmanager discovery) is injected by the chart because
          # alertmanager.enabled — do NOT also set it here (it would duplicate).
          prometheus.yml:
            rule_files:
              - /etc/config/alerting_rules.yml # the alerting_rules.yml key below
              - /etc/config/platform_gitops_expected.yml
            scrape_configs:
              - job_name: tenant-node-filesystem
                scrape_interval: 60s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [monitoring]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_label_app_kubernetes_io_instance, __meta_kubernetes_pod_container_name, __meta_kubernetes_pod_container_port_name]
                    separator: ";"
                    regex: prometheus-node-exporter;prometheus;node-exporter;metrics
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_phase]
                    regex: Running
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    target_label: node
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: node_filesystem_((size|avail|free)_bytes|files(_free)?|readonly|device_error)|node_scrape_collector_(duration_seconds|success)
                    action: keep
                  - source_labels: [__name__, fstype, mountpoint]
                    separator: ";"
                    # CAPD uses overlay for its node root; only the local
                    # exporter override permits it through the collector filter.
                    regex: node_filesystem_.*;(ext4|xfs|overlay);(/|/var|/var/lib|/var/lib/containerd|/var/lib/kubelet)|node_scrape_collector_(duration_seconds|success);;
                    action: keep
                  - regex: __name__|job|instance|node|mountpoint|device|fstype|collector
                    action: labelkeep
              # Native controller metrics, reachable only inside the cluster.
              - job_name: argocd-applications
                scrape_interval: 60s
                static_configs:
                  - targets: [argocd-metrics.argocd.svc:8082]
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: argocd_app_info
                    action: keep
                  - regex: __name__|job|instance|namespace|name|sync_status|health_status
                    action: labelkeep
              # Private per-collector scrape, shared by registry GC detection
              # and durable-log delivery monitoring. Select only Alloy's HTTP
              # port so the config-reloader sidecar cannot duplicate targets.
              - job_name: alloy
                scrape_interval: 30s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [monitoring]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_label_app_kubernetes_io_instance, __meta_kubernetes_pod_container_name, __meta_kubernetes_pod_container_port_name]
                    separator: ";"
                    regex: alloy;log-shipper;alloy;http-metrics
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_phase]
                    regex: Running
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    target_label: node
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                metric_relabel_configs:
                  # Restrict component/endpoint/tenant identities BEFORE dropping
                  # them, so unrelated native series cannot collide after relabel.
                  # Root health/config markers also establish a baseline for
                  # detecting counters that appear at their first positive value.
                  - source_labels: [__name__, component_id, component_path, host, tenant, controller_id, controller_path]
                    regex: 'bex_zot_(gc_failure|log)_last_observed_timestamp_seconds;loki\.process\.zot_gc_metrics;/;;;;|alloy_config_last_load_successful;;;;;;|alloy_component_controller_running_components;;;;;;/|loki_write_(sent_entries_total|batch_retries_total|dropped_entries_total|request_duration_seconds_count);loki\.write\.default;/;loki\.monitoring\.svc:3100;;;'
                    action: keep
                  - regex: __name__|job|instance|node|pod|service|reason|status_code|health_type
                    action: labelkeep
              # Single-binary Loki has one private service target. Tenant and
              # policy are fixed by the deployed auth-disabled configuration;
              # preserve native rejection dimensions that can differ per sample.
              - job_name: loki
                scrape_interval: 30s
                static_configs:
                  - targets: [loki.monitoring.svc:3100]
                metric_relabel_configs:
                  - source_labels: [__name__, tenant, policy]
                    regex: '(loki_discarded_samples_total|loki_distributor_lines_received_total);fake;|(process_start_time_seconds|loki_ingester_wal_disk_full_failures_total|loki_request_duration_seconds_count);;'
                    action: keep
                  - source_labels: [__name__, route, method]
                    regex: '(loki_discarded_samples_total|loki_distributor_lines_received_total|process_start_time_seconds|loki_ingester_wal_disk_full_failures_total);;|loki_request_duration_seconds_count;loki_api_v1_push;POST'
                    action: keep
                  - regex: __name__|job|instance|reason|retention_hours|format|is_internal_stream|status_code
                    action: labelkeep
              - job_name: traefik
                scrape_interval: 15s # fine-grained so request-metric rates resolve quickly
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [traefik]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    action: keep
                    regex: traefik
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9100
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
              - job_name: traefik-websocket-meter
                scrape_interval: 15s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [traefik]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    action: keep
                    regex: traefik
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9101
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: bex_websocket_(egress_bytes_total|ingress_bytes_total|meter_healthy|meter_process_start_time_seconds)
                    action: keep
              # cAdvisor: the raw series behind bex-api's cpu/memory/instance-count
              # history. Node SD, scraped THROUGH the apiserver proxy
              # (/api/v1/nodes/<node>/proxy/metrics/cadvisor) rather than the
              # kubelet directly: the pod network can't always reach every node's
              # :10250 (true on the CAPD mock), the apiserver always can, and the
              # ServiceAccount CA verifies the apiserver properly (no
              # insecure_skip_verify). The chart's default ClusterRole already
              # grants nodes + nodes/proxy + nodes/metrics, so no extra RBAC.
              # cAdvisor series natively carry namespace/pod/container labels; App
              # pods are matched downstream by Deployment pod-name shape
              # (<app>-<rs-hash>-<suffix>, see promResourceQueryFor) since kubelet
              # metrics don't carry pod labels like app.bex.co/app.
              - job_name: kubernetes-cadvisor
                scrape_interval: 15s
                scheme: https
                kubernetes_sd_configs:
                  - role: node
                tls_config:
                  ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                authorization:
                  credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                relabel_configs:
                  - target_label: __address__
                    replacement: kubernetes.default.svc:443
                  - source_labels: [__meta_kubernetes_node_name]
                    regex: (.+)
                    target_label: __metrics_path__
                    replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
                  - source_labels: [__meta_kubernetes_node_name]
                    target_label: node
                metric_relabel_configs:
                  # keep only real-container series; drop the pod-sandbox/aggregate
                  # rows (container="") that would double-count sum-by-pod queries
                  - source_labels: [container]
                    regex: ""
                    action: drop
              # kube-state-metrics: object-state series (Deployment/Pod/Node/
              # CronJob/StatefulSet status) that back the rule pack. Its Service is
              # a stable ClusterIP — a static target is enough.
              - job_name: kube-state-metrics
                scrape_interval: 60s # every consuming alert is for: 5m+ — 60s is plenty
                static_configs:
                  - targets: [prometheus-kube-state-metrics.monitoring.svc:8080]
              # SSH gateway operational metrics carry bounded result/scope
              # labels only—never subjects, targets, commands, or stream data.
              - job_name: bex-ssh-gateway
                scrape_interval: 15s
                static_configs:
                  - targets: [bex-ssh-gateway.bex-system.svc:9090]
              # Stripe Billing operations expose only account-wide gauges and
              # bounded operation/result labels. No workspace, provider object,
              # invoice, transaction, payment, or secret value is a label.
              - job_name: bex-api
                scrape_interval: 15s
                metrics_path: /metrics
                static_configs:
                  - targets: [bex-api.bex-system.svc:8091]
                metric_relabel_configs:
                  - source_labels: [__name__]
                    # billing => the Billing* alerts; agent_session => the
                    # w5/m81 SLO baseline paneled on bex-api-gateways (ADR088
                    # §6) plus AgentSessionProvisionFailing; webhooks =>
                    # WebhookDeliveryAdmissionPressure + WebhookDeliveryFailing,
                    # which evaluated an absent series while the keep was
                    # billing-only (the same never-arrived failure class the
                    # bex-operator job's comment below records for w2/m72);
                    # push => PushDeliveryStale (w3/m83 t006, added WITH the
                    # rule so the rule never evaluates a never-scraped series);
                    # api => w3/m84's first-party request telemetry
                    # (bex_api_http_* / _graphql_operation_* / _mcp_tool_*), the
                    # origin half of every edge-vs-origin question and the
                    # backing series of BexApiOriginHighErrorRate +
                    # BexApiOriginLatencyHigh. Its labels are bounded by
                    # construction (route = registered mux pattern, never a path;
                    # tool/operation = closed registry) — see
                    # lego/backend/internal/api/httpmetrics.go.
                    regex: bex_(billing|agent_session|sandbox|webhooks|push|api)_.*
                    action: keep
              # Build-plane SLIs from the operator's own registry (docs/ADR060
              # D5). This job is why the series are readable at all: the manager
              # binds its metrics endpoint only because config/manager sets
              # --metrics-bind-address, and nothing scraped it before w7/m83 —
              # so the w2/m72 build-outcome alerts were evaluating series that
              # never arrived. Labels are bounded by construction: an outcome
              # class, a retry reason from a closed set, and a workspace id on
              # the correlated-failure counter alone.
              #
              # The keep-list drops controller-runtime's and Go's default
              # families rather than storing them for nothing; add a family here
              # when something actually consumes it.
              - job_name: bex-operator
                scrape_interval: 15s
                static_configs:
                  - targets: [bex-controller-manager-metrics-service.bex-system.svc:8080]
                metric_relabel_configs:
                  - source_labels: [__name__]
                    # build => ADR060 D5 build-plane SLIs; datastore => the
                    # DatastoreStuckProvisioning / DatabaseNotArchivingWAL /
                    # DatastoreObservationFailing alerts and the ADR088 §6
                    # data-plane dashboard — all were evaluating absent series
                    # while the keep was build-only, exactly the w2/m72
                    # failure this comment block warns about.
                    regex: bex_(build|datastore).*
                    action: keep
              # One post-policy netfilter meter per untainted tenant node. Pod discovery
              # (rather than the round-robin Service) preserves the node and
              # source_instance labels needed to detect a missing/reset source.
              - job_name: bex-egress-meter
                scrape_interval: 15s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [bex-system]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_bex_co_component]
                    action: keep
                    regex: egress-meter
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9091
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    target_label: node
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: bex_(app_direct_egress_bytes_total|egress_meter_.*)
                    action: keep
              # Public Postgres front doors: backend→client bytes are counted
              # inside the SNI splice, labeled by the parent Database id.
              - job_name: bex-pg-proxy
                scrape_interval: 15s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [bex-system]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_bex_co_component]
                    action: keep
                    regex: pg-sni-proxy
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9092
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: bex_pg_proxy_(egress_bytes_total|healthy|process_start_time_seconds)
                    action: keep
              - job_name: bex-kv-proxy
                scrape_interval: 15s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [bex-system]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_bex_co_component]
                    action: keep
                    regex: kv-sni-proxy
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9093
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: bex_kv_proxy_(egress_bytes_total|healthy|process_start_time_seconds)
                    action: keep
              # kubelet /metrics (NOT cadvisor): only kubelet_volume_stats_* — the
              # PVC used/capacity bytes behind the PersistentVolumeFillingUp alert.
              # Same apiserver-proxy pattern as cadvisor; metric_relabel keeps just
              # those two series so this stays near-zero cardinality. 60s: the whole
              # kubelet /metrics payload is fetched per scrape (keep runs after), and
              # the only consumer is a for:15m alert over slow-moving disk usage.
              # etcd members (w7/m160): one kube-rbac-proxy per control-plane
              # node (deploy/gitops/charts/etcd-metrics). TLS is verified against
              # the proxy's private CA by its fixed DNS identity, and the proxy
              # authorizes this SA token for GET /metrics. Finite allowlist of
              # latency, leader/quorum and backend-size series.
              - job_name: etcd
                scrape_interval: 30s
                scheme: https
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [monitoring]
                tls_config:
                  ca_file: /etc/prometheus/etcd-metrics-ca/ca.crt
                  server_name: etcd-metrics.monitoring.svc
                authorization:
                  credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    action: keep
                    regex: etcd-metrics
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9979
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    target_label: node
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: etcd_server_has_leader|etcd_server_is_leader|etcd_server_leader_changes_seen_total|etcd_server_proposals_failed_total|etcd_server_slow_apply_total|etcd_server_slow_read_indexes_total|etcd_server_heartbeat_send_failures_total|etcd_disk_wal_fsync_duration_seconds_bucket|etcd_disk_backend_commit_duration_seconds_bucket|etcd_network_peer_round_trip_time_seconds_bucket|etcd_mvcc_db_total_size_in_bytes|etcd_server_quota_backend_bytes
                    action: keep
              - job_name: kubernetes-kubelet
                scrape_interval: 60s
                scheme: https
                kubernetes_sd_configs:
                  - role: node
                tls_config:
                  ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                authorization:
                  credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                relabel_configs:
                  - target_label: __address__
                    replacement: kubernetes.default.svc:443
                  - source_labels: [__meta_kubernetes_node_name]
                    regex: (.+)
                    target_label: __metrics_path__
                    replacement: /api/v1/nodes/${1}/proxy/metrics
                  - source_labels: [__meta_kubernetes_node_name]
                    target_label: node
                metric_relabel_configs:
                  - source_labels: [__name__]
                    # available: ZotRegistryAlmostFull's `available < 10GiB`
                    # disjunct was blind without it (ADR088 §6 audit).
                    regex: kubelet_volume_stats_(used|capacity|available)_bytes
                    action: keep
              # cert-manager controller metrics (:9402) — certmanager_certificate_*
              # for the CertificateNotReady / CertificateExpiringSoon alerts. Pod SD
              # scoped to the controller pod (webhook/cainjector don't serve these).
              - job_name: cert-manager
                scrape_interval: 60s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [cert-manager]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    action: keep
                    regex: cert-manager
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
                    action: keep
                    regex: controller
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9402
              # OpenBao PER-POD telemetry (:8200 /v1/sys/metrics) — seal state for
              # the OpenBaoSealed alert. Per-pod (not the round-robin Service) so a
              # single sealed raft follower is visible; sealed members still serve
              # /v1/sys/metrics (unauthenticated_metrics_access, set in
              # openbao.values.yaml) reporting vault_core_unsealed=0. The pod label
              # lets the alert name the sealed member.
              - job_name: openbao
                scrape_interval: 30s
                metrics_path: /v1/sys/metrics
                params:
                  format: [prometheus]
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [secrets]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    action: keep
                    regex: openbao
                  - source_labels: [__meta_kubernetes_pod_label_component]
                    action: keep
                    regex: server
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:8200
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                  # Stamp namespace like the cnpg jobs below do: the exporter's
                  # gauge carries no Kubernetes labels, and both OpenBaoSealed
                  # and the obs seal panel select namespace="secrets" — without
                  # this mapping that critical alert evaluated an empty vector
                  # and could never fire (ADR088 §6 review round 2, item 2).
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                metric_relabel_configs:
                  # keep only the seal gauge (OpenBao keeps Vault's metric name; match
                  # a bao_ prefix too in case a future release rebrands it)
                  - source_labels: [__name__]
                    regex: (vault|bao)_core_unsealed
                    action: keep
              # Platform CNPG primary metrics (:9187) — pg_stat_archiver for the
              # PlatformDatabaseBackupStale alert. Scrape each primary directly
              # (not a round-robin Service), and stamp namespace + cluster labels
              # because the SQL metric itself carries neither.
              # Verify metric names on first deploy:
              #   kubectl -n auth exec kratos-db-1 -- curl -s :9187/metrics | grep archiver
              - job_name: cnpg-platform-db
                scrape_interval: 60s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [bex-system, auth]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
                    action: keep
                    regex: bex-db|kratos-db|hydra-db|openfga-db
                  - source_labels: [__meta_kubernetes_pod_label_role]
                    action: keep
                    regex: primary
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9187
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                  - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
                    target_label: cnpg_io_cluster
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: cnpg_pg_stat_archiver_.*
                    action: keep
              # CNPG TENANT database per-pod metrics (:9187) — w3/m10's
              # active-connections + replication-lag series, for every managed
              # Postgres (w1/m17) across every app namespace (bex's own bex-db
              # stays on the tightly-scoped cnpg-bex-db job above; dropped here
              # to avoid a double scrape). cnpg_backends_total's `total` column
              # has no cluster/namespace label of its own (CNPG's SQL query only
              # labels by datname/usename/application_name/state), so
              # cnpg_io_cluster/namespace/pod are stamped at scrape time —
              # exactly the label vocabulary lego/backend/internal/metrics's
              # DBConnections/ReplicationLag sources select on.
              - job_name: cnpg-tenant-db
                scrape_interval: 60s
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels: [__meta_kubernetes_namespace]
                    action: drop
                    regex: bex-system
                  - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
                    action: keep
                    regex: (.+)
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9187
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                  - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
                    target_label: cnpg_io_cluster
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: cnpg_backends_total|cnpg_pg_replication_.*
                    action: keep
              # Managed Key Value (Valkey) instances: the redis_exporter sidecar
              # the operator attaches to every KeyValue StatefulSet pod (w5/011),
              # scraped on :9121 across all namespaces (a KeyValue lives in its
              # App's namespace). Kept by the app.bex.co/keyvalue pod label; only
              # the redis_* series are retained — memory + connected-clients back
              # the Key Value metrics panel.
              - job_name: valkey-instances
                scrape_interval: 60s
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels:
                      [__meta_kubernetes_pod_label_app_bex_co_keyvalue]
                    action: keep
                    regex: .+
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9121
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: redis_.*
                    action: keep
          # Independent of Argo discovery: missing applications keep an identity.
          # The local overlay replaces only this expression; validation compares
          # both inventories with the rendered children and bootstrap root.
          platform_gitops_expected.yml:
            groups:
              - name: platform-gitops-inventory
                rules:
                  - record: bex:platform_gitops_expected
                    labels: {namespace: argocd}
                    expr: |
                      label_replace(vector(1), "name", "auth-dbs", "", "")
                      or label_replace(vector(1), "name", "barman-cloud-objectstores", "", "")
                      or label_replace(vector(1), "name", "barman-cloud-plugin", "", "")
                      or label_replace(vector(1), "name", "bex-dashboard", "", "")
                      or label_replace(vector(1), "name", "bex-operator", "", "")
                      or label_replace(vector(1), "name", "bex-platform-prod", "", "")
                      or label_replace(vector(1), "name", "bex-postgres", "", "")
                      or label_replace(vector(1), "name", "cert-manager", "", "")
                      or label_replace(vector(1), "name", "cert-manager-issuers", "", "")
                      or label_replace(vector(1), "name", "cluster-autoscaler", "", "")
                      or label_replace(vector(1), "name", "cnpg-operator", "", "")
                      or label_replace(vector(1), "name", "etcd-backup", "", "")
                      or label_replace(vector(1), "name", "etcd-metrics", "", "")
                      or label_replace(vector(1), "name", "grafana", "", "")
                      or label_replace(vector(1), "name", "hydra", "", "")
                      or label_replace(vector(1), "name", "kpack", "", "")
                      or label_replace(vector(1), "name", "kratos", "", "")
                      or label_replace(vector(1), "name", "kubelet-csr-approver", "", "")
                      or label_replace(vector(1), "name", "log-shipper", "", "")
                      or label_replace(vector(1), "name", "loki", "", "")
                      or label_replace(vector(1), "name", "metrics-server", "", "")
                      or label_replace(vector(1), "name", "onbex-default-tls", "", "")
                      or label_replace(vector(1), "name", "openbao", "", "")
                      or label_replace(vector(1), "name", "openbao-backup", "", "")
                      or label_replace(vector(1), "name", "openfga", "", "")
                      or label_replace(vector(1), "name", "opensandbox-controller", "", "")
                      or label_replace(vector(1), "name", "opensandbox-server", "", "")
                      or label_replace(vector(1), "name", "prometheus", "", "")
                      or label_replace(vector(1), "name", "sealed-secrets", "", "")
                      or label_replace(vector(1), "name", "traefik", "", "")
                      or label_replace(vector(1), "name", "traefik-plugins", "", "")
                      or label_replace(vector(1), "name", "zot", "", "")
          # ── Alerting rules ──────────────────────────────────────────────────
          # Small, high-signal pack: every alert carries a one-line description
          # with the kubectl command to start debugging. Two groups: `platform`
          # (generic health) and `bex` (bex's own promises). This block is the
          # single source of truth — scripts/gitops-validate.sh extracts it and
          # runs `promtool check rules` + `promtool test rules` against it (unit
          # tests in deploy/gitops/base/rules/alerts_test.yml).
          alerting_rules.yml:
            groups:
              - name: platform
                rules:
                  # Aggregate away changing state labels before the grace timer.
                  - alert: PlatformGitOpsOutOfSync
                    expr: |
                      (max by (namespace, name) (argocd_app_info{job="argocd-applications",sync_status!="Synced",sync_status!=""}) == 1)
                      and on (namespace, name) bex:platform_gitops_expected
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Platform Application {{ $labels.namespace }}/{{ $labels.name }} is out of sync"
                      description: "Argo has not reported Synced for this required Application for 15m. Inspect kubectl -n {{ $labels.namespace }} get applications.argoproj.io {{ $labels.name }} -o yaml, its failed resource and root sync wave; do not force sync or prune blindly. Runbook: docs/ADR010-observability.md#platform-gitops-delivery"

                  - alert: PlatformGitOpsUnhealthy
                    expr: |
                      (max by (namespace, name) (argocd_app_info{job="argocd-applications",health_status!="Healthy",health_status!=""}) == 1)
                      and on (namespace, name) bex:platform_gitops_expected
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Platform Application {{ $labels.namespace }}/{{ $labels.name }} is unhealthy"
                      description: "Argo has not reported Healthy for this required Application for 15m. Inspect kubectl -n {{ $labels.namespace }} get applications.argoproj.io {{ $labels.name }} -o yaml and the failing child resource. Runbook: docs/ADR010-observability.md#platform-gitops-delivery"

                  - alert: PlatformGitOpsApplicationMissing
                    expr: |
                      (bex:platform_gitops_expected unless on (namespace, name)
                        max by (namespace, name) (argocd_app_info{job="argocd-applications",sync_status!="",health_status!=""}))
                      and on () (max(up{job="argocd-applications"}) == 1)
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Required platform Application {{ $labels.namespace }}/{{ $labels.name }} has no state metrics"
                      description: "The Argo scrape succeeds but this required Application has lacked complete sync/health telemetry for 10m. Check kubectl -n {{ $labels.namespace }} get applications.argoproj.io {{ $labels.name }} and compare the root's desired children with its sync result. Runbook: docs/ADR010-observability.md#platform-gitops-delivery"

                  - alert: PlatformGitOpsMetricsMissing
                    expr: |
                      sum(absent(up{job="argocd-applications"}))
                      or (max(up{job="argocd-applications"}) == 0)
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Platform GitOps metrics are unavailable"
                      description: "The Argo application metrics scrape is absent or failing for 5m. Application health is unknown. Check the argocd-metrics Service/endpoints and Prometheus target argocd-applications. Runbook: docs/ADR010-observability.md#platform-gitops-delivery"

                  # NB: the platform-namespace allowlist is repeated verbatim in the
                  # next rule (PromQL has no variables) — keep both `namespace=~`
                  # lists in sync when a platform namespace is added.
                  - alert: PlatformPodCrashLooping
                    expr: |
                      max by (namespace, pod, container) (
                        kube_pod_container_status_waiting_reason{
                          reason="CrashLoopBackOff",
                          namespace=~"bex-system|argocd|traefik|auth|secrets|monitoring|cert-manager|cnpg-system|kube-system|bex-registry|opensandbox-system|dashboard"
                        }
                      ) > 0
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is CrashLoopBackOff"
                      description: "Platform container has been CrashLoopBackOff for >10m. Debug: kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}; kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c {{ $labels.container }} --previous"

                  - alert: PlatformDeploymentNotReady
                    expr: |
                      (
                        kube_deployment_spec_replicas{
                          namespace=~"bex-system|argocd|traefik|auth|secrets|monitoring|cert-manager|cnpg-system|kube-system|bex-registry|opensandbox-system|dashboard"
                        }
                        - on (namespace, deployment)
                        kube_deployment_status_replicas_available
                      ) > 0
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas"
                      description: "A platform Deployment has had fewer available than desired replicas for >10m (bad image / crash / unschedulable). Debug: kubectl -n {{ $labels.namespace }} rollout status deploy/{{ $labels.deployment }}; kubectl -n {{ $labels.namespace }} get pods"

                  # ADR075 D8 (w6/m42): email verification is a hard gate at the
                  # door, so the Kratos courier — the StatefulSet that delivers
                  # the verification codes — is a hard availability dependency
                  # for every new signup. A stalled courier blocks 100% of
                  # sign-ups silently (users stuck at a code prompt with nothing
                  # crashing), which is why it gets a dedicated alert instead of
                  # riding the Deployment rule above (it is a StatefulSet).
                  - alert: KratosCourierNotReady
                    expr: |
                      (
                        kube_statefulset_replicas{namespace="auth", statefulset="kratos-courier"}
                        - on (namespace, statefulset)
                        kube_statefulset_status_replicas_ready{namespace="auth", statefulset="kratos-courier"}
                      ) > 0
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Kratos courier is not ready — verification email delivery is stalled"
                      description: "kratos-courier has had fewer ready than desired replicas for >10m. Under the ADR075 D8 verification gate NO new user can complete sign-up until it recovers. Debug: kubectl -n auth get sts kratos-courier; kubectl -n auth logs sts/kratos-courier --tail=100; then check the SMTP relay (SendGrid prod / Mailpit local)."

                  # Control-plane node NotReady is a PAGE: the CP pool is a single
                  # node until the quota lift reverts the m19.1 TEMP knobs to 3 CP
                  # nodes, so it's the highest blast radius on the cluster. Worker
                  # nodes are warn (the autoscaler/other workers absorb one loss).
                  - alert: ControlPlaneNodeNotReady
                    expr: |
                      kube_node_status_condition{condition="Ready",status="true"} == 0
                      and on (node) kube_node_role{role="control-plane"}
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Control-plane node {{ $labels.node }} is NotReady"
                      description: "A control-plane node has been NotReady for >5m — highest blast radius while the CP pool is one node. Debug: kubectl describe node {{ $labels.node }}; kubectl get pods -A --field-selector spec.nodeName={{ $labels.node }}"

                  - alert: NodeNotReady
                    expr: |
                      kube_node_status_condition{condition="Ready",status="true"} == 0
                      unless on (node) kube_node_role{role="control-plane"}
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Node {{ $labels.node }} is NotReady"
                      description: "A worker node has been NotReady for >5m. Debug: kubectl describe node {{ $labels.node }}; kubectl get pods -A --field-selector spec.nodeName={{ $labels.node }}"

                  # etcd members (w7/m160), scraped per control-plane node through
                  # deploy/gitops/charts/etcd-metrics. Telemetry loss and etcd health
                  # are separate alerts: a member we cannot scrape is
                  # EtcdMetricsMissing, never evidence of a quorum problem.
                  - alert: EtcdMetricsMissing
                    expr: |
                      (kube_node_role{role="control-plane"} unless on (node) (up{job="etcd"} == 1))
                      or absent(up{job="etcd"})
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "etcd metrics are not being scraped{{ with $labels.node }} on {{ . }}{{ end }}"
                      description: "Prometheus has no successful etcd scrape {{ with $labels.node }}for control-plane node {{ . }}{{ else }}at all{{ end }} for >10m, so the etcd latency and leader alerts are blind there. This is monitoring loss, not an etcd outage. Debug: kubectl -n monitoring get pods -l app.kubernetes.io/name=etcd-metrics -o wide; kubectl -n monitoring logs ds/etcd-metrics; kubectl -n monitoring get certificate etcd-metrics-serving."

                  - alert: EtcdNoLeader
                    expr: etcd_server_has_leader{job="etcd"} == 0
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: "etcd member on {{ $labels.node }} has no leader"
                      description: "The etcd member on {{ $labels.node }} has reported no Raft leader for >1m: writes through it fail and the API server stalls. Debug: kubectl -n kube-system logs etcd-{{ $labels.node }} --tail=200; kubectl get nodes -l node-role.kubernetes.io/control-plane; check the other members' EtcdNoLeader/EtcdMetricsMissing."

                  - alert: EtcdFrequentLeaderChanges
                    expr: increase(etcd_server_leader_changes_seen_total{job="etcd"}[1h]) > 3
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "etcd on {{ $labels.node }} saw {{ $value | humanize }} leader changes in the last hour"
                      description: "Frequent Raft leader elections usually follow slow disks or network between control-plane nodes (see EtcdHighFsyncLatency). Debug: kubectl -n kube-system logs etcd-{{ $labels.node }} --tail=300 | grep -Ei 'leader|heartbeat|took too long'."

                  # Thresholds are the upstream etcd-mixin warnings: p99 WAL fsync
                  # 500ms, p99 backend commit 250ms, sustained for 10m.
                  - alert: EtcdHighFsyncLatency
                    expr: |
                      histogram_quantile(0.99, sum by (node, le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket{job="etcd"}[5m]))) > 0.5
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "etcd WAL fsync p99 on {{ $labels.node }} is {{ $value | humanizeDuration }}"
                      description: "Slow WAL fsync on {{ $labels.node }} delays every write and heartbeats (the 'slow fdatasync' / 'apply took too long' log lines). This is disk latency evidence, not a proven need to replace the disk. Debug: kubectl -n kube-system logs etcd-{{ $labels.node }} --tail=300 | grep -Ei 'fdatasync|took too long'."

                  - alert: EtcdHighCommitLatency
                    expr: |
                      histogram_quantile(0.99, sum by (node, le) (rate(etcd_disk_backend_commit_duration_seconds_bucket{job="etcd"}[5m]))) > 0.25
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "etcd backend commit p99 on {{ $labels.node }} is {{ $value | humanizeDuration }}"
                      description: "Slow bbolt commits on {{ $labels.node }} slow applies and reads (ReadIndex delays). Compare with EtcdHighFsyncLatency and the DB size on the Cluster capacity dashboard before acting."

                  - alert: EtcdDatabaseNearQuota
                    expr: |
                      etcd_mvcc_db_total_size_in_bytes{job="etcd"} / etcd_server_quota_backend_bytes{job="etcd"} > 0.8
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "etcd database on {{ $labels.node }} is {{ $value | humanizePercentage }} of its quota"
                      description: "At the quota etcd raises NOSPACE and rejects writes. Compaction runs automatically; a large gap between size and in-use needs a defrag (docs/ADR011-etcd-backup-restore.md). Debug: kubectl -n kube-system logs etcd-{{ $labels.node }} --tail=200 | grep -i -E 'compact|quota'."

                  # Manifest-backed shared-root expectation: current tenant
                  # nodefs/imagefs both live on /. Declare any additional required
                  # backing mount here BEFORE changing the node storage topology.
                  - record: bex:tenant_node_filesystem_expected
                    expr: max by (node) (kube_node_labels{label_bex_co_pool="tenant"})
                    labels:
                      mountpoint: "/"

                  # Validate all necessary families at one live exporter identity
                  # before aggregation. Read-only/error/partial scrapes are unknown.
                  - record: bex:tenant_node_filesystem_observed
                    expr: |
                      count by (job, instance, node, device, mountpoint) (
                        (node_filesystem_size_bytes{job="tenant-node-filesystem",fstype=~"ext4|xfs|overlay"} > 0)
                        and on (job, instance, node, device, mountpoint) (node_filesystem_avail_bytes{job="tenant-node-filesystem"} >= 0)
                        and on (job, instance, node, device, mountpoint) (node_filesystem_files{job="tenant-node-filesystem"} > 0)
                        and on (job, instance, node, device, mountpoint) (node_filesystem_files_free{job="tenant-node-filesystem"} >= 0)
                        and on (job, instance, node, device, mountpoint) (node_filesystem_readonly{job="tenant-node-filesystem"} == 0)
                        and on (job, instance, node, device, mountpoint) (node_filesystem_device_error{job="tenant-node-filesystem"} == 0)
                        and on (job, instance) (up{job="tenant-node-filesystem"} == 1)
                        and on (node, mountpoint) bex:tenant_node_filesystem_expected
                      )

                  # One device may back several declared paths. Deduplicate it
                  # before warning/forecasting; coverage above stays mount-aware.
                  - record: bex:tenant_node_filesystem_available_bytes
                    expr: |
                      min by (node, device) (
                        node_filesystem_avail_bytes{job="tenant-node-filesystem"}
                        and on (job, instance, node, device, mountpoint) bex:tenant_node_filesystem_observed
                      )
                  - record: bex:tenant_node_filesystem_size_bytes
                    expr: |
                      max by (node, device) (
                        node_filesystem_size_bytes{job="tenant-node-filesystem"}
                        and on (job, instance, node, device, mountpoint) bex:tenant_node_filesystem_observed
                      )
                  - record: bex:tenant_node_filesystem_free_inodes
                    expr: |
                      min by (node, device) (
                        node_filesystem_files_free{job="tenant-node-filesystem"}
                        and on (job, instance, node, device, mountpoint) bex:tenant_node_filesystem_observed
                      )
                  - record: bex:tenant_node_filesystem_inodes
                    expr: |
                      max by (node, device) (
                        node_filesystem_files{job="tenant-node-filesystem"}
                        and on (job, instance, node, device, mountpoint) bex:tenant_node_filesystem_observed
                      )
                  - record: bex:tenant_node_filesystem_available_ratio
                    expr: bex:tenant_node_filesystem_available_bytes / bex:tenant_node_filesystem_size_bytes
                  - record: bex:tenant_node_filesystem_free_inodes_ratio
                    expr: bex:tenant_node_filesystem_free_inodes / bex:tenant_node_filesystem_inodes

                  # Two hours of history, >=110 one-minute evaluations, and no
                  # capacity change. A new/replaced device is not forecast-ready.
                  - record: bex:tenant_node_filesystem_forecast_ready
                    expr: |
                      (
                        (count_over_time(bex:tenant_node_filesystem_available_bytes[2h]) >= 110)
                        and on (node, device) present_over_time(bex:tenant_node_filesystem_available_bytes[5m] offset 2h)
                        and on (node, device) (changes(bex:tenant_node_filesystem_size_bytes[2h]) == 0)
                      ) * 0 + 1
                      and on (node, device) bex:tenant_node_filesystem_size_bytes
                      or on (node, device) (bex:tenant_node_filesystem_size_bytes * 0)

                  - record: bex:tenant_node_filesystem_filling_soon
                    expr: |
                      (
                        (predict_linear(bex:tenant_node_filesystem_available_bytes[2h], 4 * 3600)
                          / bex:tenant_node_filesystem_size_bytes < 0.15)
                        and on (node, device) (bex:tenant_node_filesystem_forecast_ready == 1)
                        and on (node, device) (bex:tenant_node_filesystem_available_ratio < 0.35)
                        and on (node, device) (deriv(bex:tenant_node_filesystem_available_bytes[30m]) < 0)
                        and on (node, device) (deriv(bex:tenant_node_filesystem_available_bytes[2h]) < 0)
                      ) * 0 + 1

                  - alert: TenantNodeFilesystemSpaceLow
                    expr: bex:tenant_node_filesystem_available_ratio < 0.20
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Tenant node {{ $labels.node }} device {{ $labels.device }} has less than 20% available space"
                      description: "Headroom has stayed below 20% for 10m, above the observed 15% imagefs and 10% nodefs hard eviction thresholds. Inspect the declared backing mounts, image usage and pod ephemeral-storage limits before choosing a response. Sudden writes can exhaust storage before this warning. Runbook: docs/ADR010-observability.md#tenant-node-filesystem-headroom"

                  - alert: TenantNodeFilesystemInodesLow
                    expr: bex:tenant_node_filesystem_free_inodes_ratio < 0.10
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Tenant node {{ $labels.node }} device {{ $labels.device }} has less than 10% free inodes"
                      description: "Free inodes have stayed below 10% for 10m, above the observed 5% hard eviction threshold. Byte headroom alone cannot rule out inode exhaustion. Diagnose file counts and workload growth without automatic deletion. Runbook: docs/ADR010-observability.md#tenant-node-filesystem-headroom"

                  - alert: TenantNodeFilesystemTelemetryMissing
                    expr: |
                      bex:tenant_node_filesystem_expected
                        unless on (node, mountpoint) bex:tenant_node_filesystem_observed
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Tenant node {{ $labels.node }} mount {{ $labels.mountpoint }} has unknown filesystem headroom"
                      description: "An independently expected backing mount has no complete, successful writable-filesystem observation for 10m. Check the private tenant-node-filesystem target, exporter placement/host mounts, filesystem collector errors and required-mount inventory. New nodes have the same 10m collection grace; removed nodes leave the inventory. Runbook: docs/ADR010-observability.md#tenant-node-filesystem-headroom"

                  - alert: TenantNodeFilesystemInventoryMissing
                    expr: absent(kube_node_labels{label_bex_co_pool=~".+"})
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Node pool inventory is unavailable for tenant filesystem coverage"
                      description: "kube-state-metrics has no node pool labels for 10m, so expected tenant-node coverage cannot be established. Check its scrape and nodes=[bex.co/pool] label allowlist; absence of tenant warnings is not healthy evidence. A valid inventory with zero tenant nodes is allowed. Runbook: docs/ADR010-observability.md#tenant-node-filesystem-headroom"

                  - alert: TenantNodeFilesystemFillingSoon
                    expr: bex:tenant_node_filesystem_filling_soon == 1
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Advisory: tenant node {{ $labels.node }} device {{ $labels.device }} may cross 15% available within 4h"
                      description: "With at least 2h history and stable capacity, both recent and longer trends decline, current headroom is below 35%, and a linear forecast crosses the observed imagefs eviction margin within 4h. This is an advisory trend, not guaranteed notice before sudden writes; verify current usage before choosing a response. Runbook: docs/ADR010-observability.md#tenant-node-filesystem-headroom"

                  # Node ephemeral-storage pressure (w7/m159). DiskPressure is the
                  # kubelet's own eviction-threshold condition. Reclaim/eviction
                  # can be underway — a PAGE. The tenant filesystem warnings above
                  # provide earlier headroom evidence. PVCs are a separate budget
                  # (PersistentVolumeFillingUp below).
                  - alert: NodeDiskPressure
                    expr: |
                      kube_node_status_condition{condition="DiskPressure",status="true"} == 1
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Node {{ $labels.node }} is under DiskPressure — a storage eviction threshold is crossed"
                      description: "The kubelet on {{ $labels.node }} has reported DiskPressure for >2m. It may reclaim storage before evicting pods; inspect actual events. Diagnose before deleting anything (docs/ADR010-observability.md, node disk pressure): kubectl describe node {{ $labels.node }}; kubectl get events -A --field-selector involvedObject.name={{ $labels.node }}; kubectl get pods -A --field-selector spec.nodeName={{ $labels.node }},status.phase=Failed."

                  # A pressure episode shorter than NodeDiskPressure's `for:` (or one
                  # that recovered before anyone looked) stays visible for 6h, so a
                  # healthy snapshot does not erase the incident. Dashboard-only.
                  - alert: NodeDiskPressureRecovered
                    expr: |
                      max_over_time(kube_node_status_condition{condition="DiskPressure",status="true"}[6h]) == 1
                      unless on (node) (kube_node_status_condition{condition="DiskPressure",status="true"} == 1)
                    labels:
                      severity: info
                    annotations:
                      summary: "Node {{ $labels.node }} was under DiskPressure within the last 6h"
                      description: "{{ $labels.node }} reported DiskPressure in the last 6h and has since recovered. Evicted pods and EvictionThresholdMet events may still explain workload restarts: kubectl get events -A --field-selector involvedObject.name={{ $labels.node }}."

                  # Missing telemetry must never read as healthy: a node known to
                  # kube-state-metrics without a DiskPressure series, or no
                  # DiskPressure series at all, means NodeDiskPressure cannot fire.
                  - alert: NodeDiskPressureSignalMissing
                    expr: |
                      (kube_node_info unless on (node) kube_node_status_condition{condition="DiskPressure",status="true"})
                      or (absent(kube_node_status_condition{condition="DiskPressure",status="true"}))
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Node DiskPressure telemetry is missing"
                      description: "kube-state-metrics has no DiskPressure condition series for {{ with $labels.node }}node {{ . }}{{ else }}any node{{ end }} for >15m, so NodeDiskPressure cannot fire. Check the kube-state-metrics target and its node collector."

                  - alert: PersistentVolumeFillingUp
                    expr: |
                      kubelet_volume_stats_used_bytes
                      / kubelet_volume_stats_capacity_bytes
                      > 0.85
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"
                      description: "A platform PVC (etcd/Loki/OpenBao/Prometheus PVs — hcloud-csi on prod, local-path on the mock) is >85% full. Debug: kubectl -n {{ $labels.namespace }} get pvc {{ $labels.persistentvolumeclaim }}; grow the volume or prune data."

                  # Zot registry volume — fires before the generic PersistentVolumeFillingUp
                  # (>85%) so there's time to act before pushes start returning 500.
                  # Incident (2026-07-12): a runaway rebuild loop pushed 44+ image
                  # generations and filled the 10 Gi PVC with no prior warning.
                  # Retention policy (t003) caps at 5 generations per repo; this alert
                  # catches the volume still filling despite the cap (e.g. many active repos).
                  - alert: ZotRegistryFillingUp
                    expr: |
                      kubelet_volume_stats_used_bytes{namespace="bex-registry"}
                      / kubelet_volume_stats_capacity_bytes{namespace="bex-registry"}
                      > 0.70
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Zot registry PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"
                      description: "The Zot OCI registry PVC is >70% full — a runaway rebuild loop can fill it and silently 500 on pushes. Retention policy keeps 5 generations per repo; check kubelet_volume_stats_available_bytes, stale repos, and Zot logs, then resize if needed."

                  # Page before a large layer can exhaust the remaining bytes.
                  # The absolute 10 GiB floor complements the percentage guard:
                  # a registry with large images can fail a push well before 100%.
                  - alert: ZotRegistryAlmostFull
                    expr: |
                      (
                        kubelet_volume_stats_used_bytes{namespace="bex-registry"}
                        / kubelet_volume_stats_capacity_bytes{namespace="bex-registry"}
                        > 0.85
                      )
                      or
                      (
                        kubelet_volume_stats_available_bytes{namespace="bex-registry"}
                        < 10 * 1024 * 1024 * 1024
                      )
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Zot registry PVC {{ $labels.persistentvolumeclaim }} is almost full"
                      description: "The Zot OCI registry PVC is >85% full or has <10 GiB available; new image pushes can fail with HTTP 500. Grow the PVC immediately and verify retention/GC is reclaiming old layers."

                  # w7/036: a managed datastore that never provisions is the
                  # platform's quietest failure. CNPG's metrics come from instance
                  # pods, so a Cluster that never got one exports NOTHING — the
                  # absence is the symptom. Two production RBAC defects hid in
                  # exactly this gap and were found only by hand.
                  - alert: DatastoreStuckProvisioning
                    expr: bex_datastore_ready == 0 and on(kind, namespace, name) bex_datastore_age_seconds > 900
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "{{ $labels.kind }} {{ $labels.namespace }}/{{ $labels.name }} has not become ready (phase {{ $labels.phase }})"
                      description: "A managed datastore has been in phase {{ $labels.phase }} for over 15 minutes. The tenant sees a resource that never arrives and nothing else reports it. Check the CR's status conditions first; if it names an RBAC forbidden error, compare the operator and barman-plugin grants against .pm/w7/036.md."
                  # Readiness is provisioning state, not backup state. w7/040:
                  # three Ready, serving databases had archived no WAL at all
                  # because their archive prefix collided with a pre-migration
                  # twin's, and every other signal stayed green.
                  - alert: DatabaseNotArchivingWAL
                    expr: bex_datastore_wal_archiving == 0
                    for: 15m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Database {{ $labels.namespace }}/{{ $labels.name }} has not archived WAL for 15 minutes"
                      description: "Backups are enabled but the CNPG cluster reports ContinuousArchiving=False, so this database has no advancing restore point and its WAL is accumulating on the volume. Read the reason from the cluster: kubectl -n {{ $labels.namespace }} get cluster.postgresql.cnpg.io {{ $labels.name }} -o jsonpath='{.status.conditions}'. 'Expected empty archive' means the archive prefix collides with another cluster's — see .pm/w7/040.md and docs/runbooks/datastore-namespace-cutover.md Step 5."
                  # Observation must not fail silently: if the listing breaks, the
                  # readiness series simply vanish, and an alert on == 0 would go
                  # quiet exactly when it is blind.
                  - alert: DatastoreObservationFailing
                    expr: increase(bex_datastore_observe_errors_total[15m]) > 0
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Datastore readiness observation is failing"
                      description: "bex_datastore_ready is incomplete, so DatastoreStuckProvisioning cannot be trusted. Check the operator's RBAC for databases/keyvalues and its API connectivity."

                  # cert-manager Certificate readiness, split by RESPONSIBILITY.
                  # This rule pages the operator (warning) for PLATFORM certs —
                  # everything a not-Ready cert can be EXCEPT a tenant's own
                  # custom-domain cert, which is customer-side DNS and handled by
                  # the info-level (never paged) TenantCustomDomainCertNotReady
                  # below. The `unless` subtracts exactly that tenant custom-domain
                  # series set. A tenant's platform host cert is NOT subtracted, so
                  # bex still pages on its own "*.onbex.co" issuance: the operator
                  # names the first/platform host "<app>-tls" (no host suffix, so it
                  # fails the name=~".+-tls-.+" match) and a "<sub>.onbex.co" host
                  # that lands as a later cert ("<app>-tls-<sub>.onbex.co") is kept
                  # by the name!~onbex.co guard. (lego/operator .../app_controller.go
                  # tlsSecretName; "onbex.co" is BEX_BASE_DOMAIN — keep in sync.)
                  - alert: CertificateNotReady
                    expr: |
                      (certmanager_certificate_ready_status{condition="True"} == 0)
                      unless
                      certmanager_certificate_ready_status{condition="True", namespace=~"tea-.*", name=~".+-tls-.+", name!~".*-tls-.*onbex\\.co.*"}
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} is not Ready"
                      description: "cert-manager Certificate has been not-Ready for >15m (issuance/renewal failing). Debug: kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }}; kubectl -n {{ $labels.namespace }} get certificaterequest,order,challenge"

                  # A tenant's CUSTOM-domain cert (namespace tea-*, secret
                  # "<app>-tls-<host>" for a non-onbex.co host) stuck not-Ready is
                  # almost always customer-actionable: the domain's DNS isn't
                  # pointing at bex (e.g. the apex is proxied through Cloudflare), so
                  # the ACME HTTP-01 solver is never reached (404) and issuance
                  # stalls indefinitely. That is NOT a platform fault, so it must not
                  # page on-call — it is surfaced to the tenant on the domain's
                  # dashboard status (docs/ADR005-custom-domain.md). severity=info is
                  # routed to the "null" receiver in the Alertmanager config above,
                  # so it stays visible in Prometheus/Alertmanager (and to the
                  # dashboard/API) without emailing. Longer `for` so an in-flight
                  # issuance (DNS propagation + ACME) isn't flagged as stuck.
                  - alert: TenantCustomDomainCertNotReady
                    expr: |
                      certmanager_certificate_ready_status{condition="True", namespace=~"tea-.*", name=~".+-tls-.+", name!~".*-tls-.*onbex\\.co.*"} == 0
                    for: 1h
                    labels:
                      severity: info
                    annotations:
                      summary: "Tenant custom-domain certificate {{ $labels.namespace }}/{{ $labels.name }} is not Ready (customer DNS)"
                      description: "A tenant custom-domain TLS cert has been not-Ready for >1h — almost always customer-side DNS, not a platform fault (so this is surfaced to the tenant, not paged). The domain must resolve to bex: point the apex via ALIAS/ANAME/CNAME-flattening at the app's <name>.onbex.co and keep it DNS-only — a Cloudflare-proxied record makes the ACME HTTP-01 challenge return 404 and the cert never issues. Confirm: kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }}; kubectl -n {{ $labels.namespace }} get order,challenge. Runbook: docs/ADR005-custom-domain.md"

                  # Expiry is a statement about an ISSUED certificate. cert-manager
                  # exports expiration_timestamp_seconds = 0 for a Certificate that
                  # has never issued, and "0 - time() < 14d" is always true — which
                  # is how a tenant's never-issued custom-domain cert paged on-call
                  # every 4h for weeks (2026-08/09). So the rule joins on Ready == 1
                  # (a never-issued or already-expired cert is CertificateNotReady's
                  # job: one page per broken thing) and subtracts the tenant
                  # custom-domain population with the same selector as
                  # CertificateNotReady — a tenant cert that cannot RENEW is the
                  # same customer-DNS class as one that cannot issue, and goes to
                  # the info-tier twin below, never to on-call.
                  - alert: CertificateExpiringSoon
                    expr: |
                      (
                        (certmanager_certificate_expiration_timestamp_seconds - time()) < (14 * 24 * 3600)
                        and on (namespace, name) certmanager_certificate_ready_status{condition="True"} == 1
                      )
                      unless on (namespace, name)
                      certmanager_certificate_ready_status{condition="True", namespace=~"tea-.*", name=~".+-tls-.+", name!~".*-tls-.*onbex\\.co.*"}
                    for: 1h
                    labels:
                      severity: warning
                    annotations:
                      summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in <14d"
                      description: "An issued cert-manager Certificate expires in under 14 days and has not renewed (renewal normally completes at 30 days out). Debug: kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }}; kubectl -n {{ $labels.namespace }} get certificaterequest,order,challenge"

                  # The info-tier twin: a tenant custom-domain cert that WAS issued
                  # but is not renewing. Same customer-DNS cause (the domain moved
                  # behind a proxy or away from bex after issuance), same routing
                  # as TenantCustomDomainCertNotReady (null receiver, dashboard-
                  # visible, never paged).
                  - alert: TenantCustomDomainCertExpiringSoon
                    expr: |
                      (certmanager_certificate_expiration_timestamp_seconds{namespace=~"tea-.*", name=~".+-tls-.+", name!~".*-tls-.*onbex\\.co.*"} - time()) < (14 * 24 * 3600)
                      and on (namespace, name) certmanager_certificate_ready_status{condition="True"} == 1
                    for: 1h
                    labels:
                      severity: info
                    annotations:
                      summary: "Tenant custom-domain certificate {{ $labels.namespace }}/{{ $labels.name }} expires in <14d and is not renewing (customer DNS)"
                      description: "A tenant custom-domain TLS cert was issued but has not renewed with under 14 days left — almost always the domain's DNS moved after issuance (proxied through Cloudflare, or pointed away from bex), so the ACME HTTP-01 challenge no longer reaches bex. Not a platform fault; surfaced to the tenant, not paged. Confirm: kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }}; kubectl -n {{ $labels.namespace }} get order,challenge. Runbook: docs/ADR005-custom-domain.md"

                  # Admin-cert expiry: the CAPI-minted kubernetes-admin client cert
                  # (CN=kubernetes-admin, O=system:masters) has ~1-year validity.
                  # Expiry is approximated from the bex-kubeconfig Secret's creation
                  # timestamp (CAPI refreshes the Secret when kubeadm renews the cert).
                  # Fires 30d before expected expiry. Runbook: docs/ADR036-ca-rotation-runbook.md
                  # The namespace matcher spans both `default` and the locked-down
                  # `bex-capi` so it keeps working across the codex #5 relocation of
                  # bex-kubeconfig out of the operator-readable default namespace
                  # (docs/runbooks/operator-kubeconfig-isolation.md).
                  - alert: AdminCertExpiringSoon
                    expr: |
                      (kube_secret_created{namespace="bex-capi", secret="bex-kubeconfig"} + 31536000 - time()) < (30 * 24 * 3600)
                    for: 1h
                    labels:
                      severity: warning
                    annotations:
                      summary: "App cluster admin cert (bex-kubeconfig) expires within 30d"
                      description: "The bex-kubeconfig Secret (holds CN=kubernetes-admin, O=system:masters cert, 1-year validity from CAPI mint) is estimated to expire within 30 days. Renew: sudo kubeadm certs renew all (on each CP node), then re-fetch: scripts/fetch-app-kubeconfig.sh. Scoped kubeconfig: scripts/operator-kubeconfig.sh. Break-glass check: sudo kubeadm certs check-expiration. Runbook: docs/ADR036-ca-rotation-runbook.md"

              - name: bex
                rules:
                  # The first observed event needs no preceding zero sample.
                  # Retain observed event times through reload/expiry; comparing
                  # the value to wall time also rejects a stale gauge exposed
                  # once by Alloy on its first scrape after a long outage.
                  - alert: ZotGarbageCollectionFailure
                    expr: |
                      time() - max(max_over_time(bex_zot_gc_failure_last_observed_timestamp_seconds{job="alloy",service="zot"}[3h])) < 10800
                    labels:
                      severity: warning
                      namespace: bex-registry
                      service: zot
                    annotations:
                      summary: "Zot garbage collection hit the known missing-repository-metadata failure"
                      description: "Alloy observed the known GC failure signature within 3h. The first fresh occurrence alerts; repeated occurrences extend the window. Find the repository in retained Zot logs and follow the bounded ADR060 D4 repair; this alert neither repairs data nor prevents the upstream defect. Runbook: docs/ADR060-build-worker-reliability-and-performance.md#registry-gc-recurrence"

                  # Zot's regular probe logs provide collection evidence even
                  # when GC is quiet. A successful scrape alone cannot prove
                  # that the source/pipeline still receives registry logs.
                  - record: bex:zot_log_collection_healthy
                    expr: |
                      ((time() - max(
                        bex_zot_log_last_observed_timestamp_seconds{job="alloy",service="zot"}
                        and on (job, instance) (up{job="alloy"} == 1)
                      )) < bool 300) or vector(0)

                  - alert: ZotGarbageCollectionTelemetryMissing
                    expr: bex:zot_log_collection_healthy < 1
                    for: 10m
                    labels:
                      severity: warning
                      namespace: bex-registry
                      service: zot
                    annotations:
                      summary: "Zot garbage-collection log evidence is unavailable"
                      description: "No fresh Zot log observation from a successfully scraped Alloy collector for 10m (freshness limit 5m). Zero observed GC failures is not healthy evidence while collection is unknown. Check the Zot pod/node, node-scoped platform log discovery, Alloy configuration and the private alloy scrape before diagnosing GC. Runbook: docs/ADR060-build-worker-reliability-and-performance.md#registry-gc-recurrence"

                  # Build-plane SLIs (docs/ADR060 D5).
                  #
                  # The SLO is on INFRASTRUCTURE success, not on build success. A
                  # tenant's broken Dockerfile is not a platform failure, so
                  # user_failed is excluded from the ratio entirely — including it
                  # would make the error budget a function of how many tenants
                  # pushed bad code that day, which no operator can act on.
                  #
                  # outcome="user_failed" is deterministic tenant input, failed
                  # once and not retried; outcome="infra_failed" is a transient or
                  # unclassified failure that exhausted its retry budget.
                  # `or vector(1)`: with no infra failures yet the numerator
                  # selects nothing and the whole expression would be absent
                  # rather than 1, so a healthy fleet would have no SLO series
                  # at all — indistinguishable on a dashboard from a broken rule.
                  - record: bex:build_infra_success_ratio:rate1h
                    expr: |
                      (
                      1 - (
                        sum(rate(bex_build_outcomes_total{outcome="infra_failed"}[1h]))
                        /
                        clamp_min(
                          sum(rate(bex_build_outcomes_total{outcome=~"succeeded|infra_failed|failed|timeout"}[1h])),
                          0.0000001
                        )
                      )
                      ) or vector(1)

                  - alert: BuildInfraSuccessBelowSLO
                    expr: bex:build_infra_success_ratio:rate1h < 0.995
                    for: 30m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Build infrastructure success is {{ $value | humanizePercentage }} (SLO 99.5%)"
                      description: "Builds are failing for reasons the platform owns, not tenant code (outcome=infra_failed excludes user_failed by construction). Check bex_build_outcomes_total by outcome, the Zot push path, and node capacity on the build pools. Runbook context: docs/ADR060-build-worker-reliability-and-performance.md D5."

                  # The flake-vs-user discriminator. Infrastructure causes are
                  # SYNCHRONIZED across independent tenants (a bad node, a sick
                  # registry); tenant errors are isolated and deterministic per
                  # commit. So the signal is not the failure count but its SPREAD:
                  # three or more distinct workspaces failing infra-side inside 15
                  # minutes is a platform incident, while thirty failures inside one
                  # workspace is one tenant having a bad afternoon and must not page.
                  #
                  # Threshold rationale: bex runs ~17 workspaces, so 3 distinct is
                  # ~18% of the estate — well above coincidence, low enough to fire
                  # before most tenants notice. Revisit the constant if the estate
                  # grows by an order of magnitude.
                  - alert: BuildInfraFailuresCorrelatedAcrossWorkspaces
                    expr: |
                      count(
                        sum by (workspace) (
                          increase(bex_build_infra_failures_total[15m])
                        ) > 0
                      ) >= 3
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Infra-classified build failures across {{ $value }} distinct workspaces"
                      description: "Independent workspaces are failing builds infra-side at the same time, which is the signature of a platform fault rather than tenant code. Suspect the shared dependencies first: Zot (push/pull), the build node pools, image pulls. Isolated per-tenant failures deliberately do NOT fire this."

                  # ── Build QUEUE time: the platform's own capacity SLI ──────
                  # Every incident in this class has presented as SILENCE and was
                  # diagnosed by hand-descending through Traefik -> bex-api ->
                  # controller logs (2026-08-08 a build wedged in Building with
                  # zero output; 2026-08-11 a build sat Pending 22 minutes and the
                  # deploy was failed by the control-plane gate while the build
                  # itself was perfectly healthy). Queue time is OURS; run time is
                  # mostly the tenant's, so only the former is alertable.
                  #
                  # THRESHOLD ARITHMETIC (the reason for 8m, not a round number):
                  # bex-api's DeployGateTimeout is 18m (internal/store/reconciler.go
                  # defaultDeployGateTimeout; m80 settled the three-timer
                  # relationship). An alert must fire while the deploy can still be
                  # saved, not report history. bex_build_queue_oldest_seconds is
                  # the age of the longest-CURRENTLY-queued build, so 480s + for:2m
                  # fires at ~10 minutes of queueing — 8 minutes of head room before
                  # the gate closes the deploy. Raising DeployGateTimeout without
                  # revisiting this number silently spends that head room.
                  - alert: BuildQueuedTooLong
                    expr: bex_build_queue_oldest_seconds > 480
                    for: 2m
                    labels:
                      severity: warning
                    annotations:
                      summary: "A build has been queued {{ $value | humanizeDuration }} waiting for capacity"
                      description: "A build Job's pod has not been placed on a node. It will be failed by bex-api's 18m deploy gate if this continues, so act now: check the build pools (bex-tenant-lg warm, bex-tenant-burst elastic) for scale-from-zero failures, cluster-autoscaler events, and whether a taint/toleration or capacity-hint change made the 7Gi build request unschedulable. Runbook context: docs/ADR060-build-worker-reliability-and-performance.md D5/D8."

                  # The distribution alert. Individually-tolerable waits that have
                  # become the NORM are a capacity decision the fleet should make
                  # deliberately, not a page — hence warning, a long window, and a
                  # threshold (5m p95) well under the per-build one above: this
                  # fires when queueing is chronic, that one when it is acute.
                  # `or vector(0)` keeps the series present on an idle fleet, so a
                  # missing rule is distinguishable from a healthy one.
                  - alert: BuildQueueTimeHigh
                    expr: |
                      (
                        histogram_quantile(0.95,
                          sum by (le) (rate(bex_build_queue_seconds_bucket[30m]))
                        ) or vector(0)
                      ) > 300
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Build queue p95 is {{ $value | humanizeDuration }} (capacity, not tenant code)"
                      description: "Builds are chronically waiting for a node before they start. This is the platform's SLI, not the tenant's: compare bex_build_run_seconds, which should be unaffected. Consider the build pools' max-size, BEX_MAX_ACTIVE_BUILDS, and whether cold scale-from-zero (bex_builds_queued > 0 with bex-tenant-burst at 0 replicas) dominates. Runbook context: docs/ADR060-build-worker-reliability-and-performance.md D5."

                  # The build cache trial's push-latency stop rule
                  # (docs/ADR060 D3, .pm/w7/047). The registry cache adds a
                  # cache-save push to every build, so the push phase is where a
                  # cache regression shows up first — and push is platform-owned
                  # end to end (skopeo, our credential, our registry), so a
                  # regression here is never a tenant's bad Dockerfile.
                  #
                  # 60s is a floor deliberately far above the measured ~27s
                  # production p95 (2026-09-15), not a tight bound: it fires on a
                  # regression, not on normal variance. The operator enforces the
                  # same rule itself and withdraws the cache without waiting for
                  # anyone — see BuildCacheTrialWithdrawn below. This alert exists
                  # because the fleet should still learn that it happened.
                  # `or vector(0)` keeps the series present on an idle fleet.
                  - alert: BuildPushTimeHigh
                    expr: |
                      (
                        histogram_quantile(0.95,
                          sum by (le) (rate(bex_build_push_seconds_bucket[15m]))
                        ) or vector(0)
                      ) > 60
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Build push p95 is {{ $value | humanizeDuration }} (platform-owned, not tenant code)"
                      description: "The skopeo push phase is chronically slow. Every part of it is ours: check Zot's PVC headroom (kubelet_volume_stats_used_bytes in bex-registry) first, since a filling volume slows pushes before it fails them, then bex_build_push_errors_total and Zot's own logs. If a registry build-cache trial is running, bex_build_cache_enabled shows whether the operator has already withdrawn the cache in response. Runbook context: docs/ADR060-build-worker-reliability-and-performance.md D3/D4."

                  # The trial breaker reporting that it ended the experiment by
                  # itself (.pm/w7/047). This is not a page — withdrawing the
                  # cache is the SAFE direction, and by the time this fires the
                  # dangerous state is already over. It exists because the
                  # alternative is silence: BEX_BUILD_CACHE still reads
                  # "registry" in the production overlay after a trip, so
                  # without this the only evidence that the trial ended is
                  # builds quietly getting slower.
                  # A reason's counter first appears at 1, so increase() misses
                  # that first trip. The breaker stays tripped for the process's
                  # lifetime; keep the alert active for the same duration.
                  - alert: BuildCacheTrialWithdrawn
                    expr: bex_build_cache_withdrawals_total > 0
                    labels:
                      severity: warning
                    annotations:
                      summary: "The build-cache trial withdrew itself ({{ $labels.reason }})"
                      description: "The operator's trial breaker stopped dispatching registry cache phases. reason=deadline is the 72h hard stop firing as designed — record the retain-or-rollback decision and remove BEX_BUILD_CACHE_TRIAL_DEADLINE or the gate itself. reason=push_latency or push_errors means a stop rule tripped: the cache is already off, so investigate rather than scramble. The gate stays withdrawn until the manager is redeployed, which is deliberate — re-enabling is a decision a person makes. Runbook context: docs/ADR060-build-worker-reliability-and-performance.md D3."

                  # Build-toolchain freshness (docs/ADR060 D7, w4/m86). Readiness
                  # and age are distinct: a Ready builder can still be a stale
                  # pin, and a recently reviewed pin can still be unready.
                  # The 30-day SLO is a review cadence, not an automatic upgrade.
                  - alert: ClusterBuilderNotReady
                    expr: |
                      bex_build_clusterbuilder_present != 1
                      or
                      bex_build_clusterbuilder_ready != 1
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "kpack ClusterBuilder bex is not Ready"
                      description: "The platform ClusterBuilder has been missing, unknown, or not Ready for >15m, so buildpack deploys may stall or ship an incomplete builder. Inspect: kubectl get clusterbuilder bex -o yaml. Refresh is a reviewed digest update via python3 scripts/lib/toolchain-freshness.py resolve and .github/workflows/build-toolchain-freshness.yml — never an automatic rollout. Runbook: docs/ADR060-build-worker-reliability-and-performance.md D7."

                  - alert: ClusterBuilderImageStale
                    expr: |
                      bex_build_clusterbuilder_image_resolved_timestamp_seconds <= 0
                      or
                      (time() - bex_build_clusterbuilder_image_resolved_timestamp_seconds) > (30 * 24 * 3600)
                    for: 1h
                    labels:
                      severity: warning
                    annotations:
                      summary: "ClusterBuilder image pin is older than the 30-day freshness SLO"
                      description: "Committed builder resolution metadata is missing, malformed, or older than 30 days. Resolve with python3 scripts/lib/toolchain-freshness.py resolve, review the observed digest, update the listed files and resolved_at together. The workflow never applies a pin. Runbook: docs/ADR060-build-worker-reliability-and-performance.md D7."

                  # The meter DaemonSet tolerates nothing
                  # (lego/operator/config/egress-meter/daemonset.yaml), so its
                  # population is exactly "nodes with no scheduling taint": every
                  # pool taint (bex.co/platform, bex.co/sandbox, bex.co/build-only,
                  # the control-plane role taint) excludes a node by design, while
                  # the kubelet's own node.kubernetes.io/* condition taints are
                  # exempt because DaemonSet pods tolerate those automatically.
                  # Naming one pool taint here (the previous shape) fired
                  # continuously once the sandbox pool and the build-only node
                  # existed. The Grafana "Egress meter fleet" panel mirrors this
                  # expression verbatim — keep the two in sync.
                  - alert: EgressMeterTargetMissing
                    expr: |
                      count(up{job="bex-egress-meter"} == 1)
                      !=
                      count(
                        kube_node_info
                        unless on (node) kube_node_spec_taint{effect=~"NoSchedule|NoExecute", key!~"node\\.kubernetes\\.io/.*"}
                      )
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Not every tenant node has a scrapeable egress meter"
                      description: "Outbound accounting is incomplete: the Ready egress-meter target count differs from the number of nodes the meter DaemonSet can schedule on (nodes with no pool taint). Do not collect affected hourly egress windows. Debug: kubectl -n bex-system get pods -l app.bex.co/component=egress-meter -o wide; kubectl get nodes -o custom-columns=NAME:.metadata.name,TAINTS:.spec.taints[*].key"

                  - alert: EgressMeterUnhealthy
                    expr: min by (node) (bex_egress_meter_healthy) == 0
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Egress meter on {{ $labels.node }} is incomplete"
                      description: "At least one App Pod IP lacks stable attribution, or the meter reported a map/checkpoint error. The affected hourly source must fail rather than become zero. Debug: kubectl -n bex-system logs -l app.bex.co/component=egress-meter --prefix"

                  - alert: EgressMeterCounterLoss
                    expr: max by (node) (bex_egress_meter_last_counter_loss_time_seconds) > 0 and (time() - max by (node) (bex_egress_meter_last_counter_loss_time_seconds)) < 3600
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Egress meter on {{ $labels.node }} detected counter loss"
                      description: "The meter restored a node checkpoint or observed a counter decrease within the last hour. Its durable event timestamp rejects every overlapping direct-egress window automatically; inspect the node and pinned maps."

                  - alert: EgressMeterMapPressure
                    expr: max by (node) (bex_egress_meter_resource_map_pressure_ratio) > 0.80
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Egress meter resource map on {{ $labels.node }} is {{ $value | humanizePercentage }} full"
                      description: "The bounded App counter map is above 80%; reaching capacity makes new attribution fail closed. Debug: kubectl -n bex-system logs -l app.bex.co/component=egress-meter --prefix"

                  - alert: WebSocketEgressMeterUnavailable
                    expr: |
                      sum(absent(up{job="traefik-websocket-meter"}))
                      or min(up{job="traefik-websocket-meter"}) == 0
                      or sum(absent(bex_websocket_meter_healthy))
                      or min(bex_websocket_meter_healthy) == 0
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: "WebSocket outbound accounting is unavailable"
                      description: "The Traefik hijack-path byte meter is missing or unhealthy. Public WebSocket usage windows must fail rather than omit frames. Debug: kubectl -n traefik logs -l app.kubernetes.io/name=traefik; kubectl -n traefik get pods -o wide"

                  - alert: PostgresEgressProxyUnavailable
                    expr: |
                      sum(absent(up{job="bex-pg-proxy"}))
                      or min(up{job="bex-pg-proxy"}) == 0
                      or sum(absent(bex_pg_proxy_healthy{resource_kind="postgres"}))
                      or min(bex_pg_proxy_healthy{resource_kind="postgres"}) == 0
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Postgres outbound accounting is unavailable"
                      description: "The public Postgres proxy meter is missing or unhealthy. Public Database usage windows must fail rather than undercount. Debug: kubectl -n bex-system get pods -l app.bex.co/component=pg-sni-proxy -o wide"

                  - alert: KeyValueEgressProxyUnavailable
                    expr: |
                      sum(absent(up{job="bex-kv-proxy"}))
                      or min(up{job="bex-kv-proxy"}) == 0
                      or sum(absent(bex_kv_proxy_healthy{resource_kind="key_value"}))
                      or min(bex_kv_proxy_healthy{resource_kind="key_value"}) == 0
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Key Value outbound accounting is unavailable"
                      description: "The public Key Value proxy meter is missing or unhealthy. Public Key Value usage windows must fail rather than undercount. Debug: kubectl -n bex-system get pods -l app.bex.co/component=kv-sni-proxy -o wide"

                  - alert: BackupCronJobStale
                    expr: |
                      (
                        (time() - kube_cronjob_status_last_successful_time{cronjob=~"etcd-backup|openbao-backup|kvbak-.*"}) > (26 * 3600)
                        or
                        (
                          (time() - kube_cronjob_created{cronjob=~"etcd-backup|openbao-backup|kvbak-.*"}) > (26 * 3600)
                          unless on(namespace, cronjob)
                            kube_cronjob_status_last_successful_time{cronjob=~"etcd-backup|openbao-backup|kvbak-.*"}
                        )
                      )
                      and on(namespace, cronjob)
                        (kube_cronjob_spec_suspend{cronjob=~"etcd-backup|openbao-backup|kvbak-.*"} == 0)
                    for: 0m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Backup {{ $labels.namespace }}/{{ $labels.cronjob }} has not succeeded in >26h"
                      description: "The nightly {{ $labels.cronjob }} has no successful backup in over 26h — silent backup rot is unrecoverable data loss. Debug: kubectl -n {{ $labels.namespace }} get cronjob {{ $labels.cronjob }}; kubectl -n {{ $labels.namespace }} get jobs -l batch.kubernetes.io/cronjob-name={{ $labels.cronjob }}. Runbooks: docs/ADR011-etcd-backup-restore.md, docs/ADR015-openbao-backup-restore.md, docs/ADR021-keyvalue-management.md, docs/ADR031-platform-data-backup.md"

                  # Declared platform DBs remain expected through discovery loss.
                  # pg_stat_archiver also emits on primaries without backups;
                  # its -1 never-archived sentinel is present, not missing data.
                  - record: bex:platform_database_backup_expected
                    expr: vector(1)
                    labels: {namespace: bex-system, cnpg_io_cluster: bex-db}
                  - record: bex:platform_database_backup_expected
                    expr: vector(1)
                    labels: {namespace: auth, cnpg_io_cluster: kratos-db}
                  - record: bex:platform_database_backup_expected
                    expr: vector(1)
                    labels: {namespace: auth, cnpg_io_cluster: hydra-db}
                  - record: bex:platform_database_backup_expected
                    expr: vector(1)
                    labels: {namespace: auth, cnpg_io_cluster: openfga-db}

                  # Join at pod/instance identity before aggregation: an old
                  # primary's cached timestamp cannot cover a replacement's
                  # missing collector or a failed current scrape.
                  - record: bex:platform_database_last_archived_time
                    expr: |
                      max by (namespace, cnpg_io_cluster) (
                        cnpg_pg_stat_archiver_last_archived_time{job="cnpg-platform-db"}
                        and on (namespace, cnpg_io_cluster, pod, instance)
                          (up{job="cnpg-platform-db"} == 1)
                      )

                  - alert: PlatformDatabaseBackupTargetMissing
                    expr: |
                      bex:platform_database_backup_expected unless on (namespace, cnpg_io_cluster)
                        max by (namespace, cnpg_io_cluster) (up{job="cnpg-platform-db"} == 1)
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "{{ $labels.namespace }}/{{ $labels.cnpg_io_cluster }} backup metrics target is unavailable"
                      description: "No healthy primary metrics target has been observed for this platform database for 10m. Backup health is unknown, not proof of data loss. Inspect the cnpg-platform-db target, primary labels and kubectl -n {{ $labels.namespace }} get cluster.postgresql.cnpg.io {{ $labels.cnpg_io_cluster }}. Runbook: docs/ADR031-platform-data-backup.md#missing-backup-telemetry"

                  - alert: PlatformDatabaseBackupTelemetryMissing
                    expr: |
                      (bex:platform_database_backup_expected and on (namespace, cnpg_io_cluster)
                        max by (namespace, cnpg_io_cluster) (up{job="cnpg-platform-db"} == 1))
                      unless on (namespace, cnpg_io_cluster) bex:platform_database_last_archived_time
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "{{ $labels.namespace }}/{{ $labels.cnpg_io_cluster }} archiver telemetry is unavailable"
                      description: "The primary metrics scrape succeeds but has no pg_stat_archiver timestamp for 10m. Check the collector query, instance-manager logs and Prometheus metric filtering separately from WAL archiving; missing telemetry does not establish data loss. Runbook: docs/ADR031-platform-data-backup.md#missing-backup-telemetry"

                  # Plugin-backed WAL archiver staleness for every platform DB —
                  # the path CronJobStale cannot see (continuous WAL uses
                  # pg_stat_archiver, not a CronJob). One alert instance is
                  # emitted per cluster after >26h without an archived segment.
                  - alert: PlatformDatabaseBackupStale
                    expr: |
                      (time() - cnpg_pg_stat_archiver_last_archived_time{job="cnpg-platform-db"}) > (26 * 3600)
                    for: 0m
                    labels:
                      severity: critical
                    annotations:
                      summary: "{{ $labels.namespace }}/{{ $labels.cnpg_io_cluster }} WAL archiving stalled (>26h)"
                      description: "{{ $labels.namespace }}/{{ $labels.cnpg_io_cluster }} has not archived a WAL segment in >26h — platform recovery data is at risk. Debug: inspect pg_stat_archiver, the cluster's Barman ObjectStore, the barman-cloud deployment and sidecar logs, then verify the referenced Secret exists without printing it. Runbook: docs/ADR031-platform-data-backup.md"

                  # Per-MEMBER seal detection off the openbao per-pod telemetry
                  # scrape (vault_core_unsealed=0 ⇒ sealed). Not the round-robin
                  # Service or readiness: the chart's readiness probe keeps a sealed
                  # member in rotation (sealedcode 2xx), so a Service/readiness check
                  # would miss a sealed follower — this fires on ANY member sealed.
                  - alert: OpenBaoSealed
                    expr: |
                      min by (namespace, pod) (
                        {__name__=~"(vault|bao)_core_unsealed", namespace="secrets"}
                      ) == 0
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "OpenBao member {{ $labels.pod }} is SEALED"
                      description: "An OpenBao raft member has been sealed for >5m, which 503s the tenant env-vars API. Unseal: scripts/bao-init.sh (unseal path); runbook docs/ADR013-secrets.md. Debug: kubectl -n secrets get pods; kubectl -n secrets exec {{ $labels.pod }} -- bao status"

                  - alert: BexApiDown
                    expr: kube_deployment_status_replicas_available{namespace="bex-system", deployment="bex-api"} == 0
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "bex-api has no available replicas"
                      description: "The bex-api control-plane surface (REST/GraphQL/MCP) has had zero available replicas for >5m. Debug: kubectl -n bex-system rollout status deploy/bex-api; kubectl -n bex-system logs deploy/bex-api"

                  # w3/m84. TraefikHigh5xxRate's origin-side sibling, and
                  # deliberately the same shape (>5% over 5m, a 0.1 req/s floor,
                  # 10m persistence) so the pair is READ TOGETHER: both firing is
                  # bex-api serving errors, only the edge one firing puts the
                  # fault between Traefik and the pod (LB/idle-timeout/routing).
                  # Per SURFACE, because a broken MCP tool and a broken REST route
                  # page differently and averaging them hides both.
                  # surface="internal" is excluded: the :8091 projection/mint
                  # verbs are not the product API and its callers are our own
                  # components, not users. The traffic floor keeps a quiet
                  # surface's single 500 from paging; no vector(0) coercion, so an
                  # idle surface produces no series rather than a fake zero.
                  - alert: BexApiOriginHighErrorRate
                    expr: |
                      (
                        sum by (surface) (rate(bex_api_http_requests_total{surface!="internal", status=~"5.."}[5m]))
                        / sum by (surface) (rate(bex_api_http_requests_total{surface!="internal"}[5m]))
                      ) > 0.05
                      and
                      sum by (surface) (rate(bex_api_http_requests_total{surface!="internal"}[5m])) > 0.1
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "bex-api is serving {{ $value | humanizePercentage }} 5xx on its {{ $labels.surface }} surface"
                      description: "More than 5% of the requests bex-api itself completed on the {{ $labels.surface }} surface were 5xx for >10m, with meaningful traffic — this is the ORIGIN's own view, so the fault is in bex-api or a dependency it calls, not the edge. Compare with TraefikHigh5xxRate: if only the edge alert fires, the failure is between Traefik and the pod. Find the routes on the bex-api-gateways dashboard (origin 5xx ratio by route), then: kubectl -n bex-system logs deploy/bex-api; check OpenFGA/Hydra/Postgres reachability. Runbook: docs/ADR088-platform-observability-ui.md"

                  # w3/m84. Latency, not errors: a p95 this far out means callers
                  # are timing out even though every response is nominally a 200.
                  # 2.5s is the recorded baseline (ADR088 §6) — roughly an order
                  # of magnitude above bex-api's normal p95, so ordinary load
                  # never pages. Streaming responses are not in this histogram by
                  # construction (an hour-long SSE tail would otherwise own every
                  # bucket), so the quantile is about unary work only.
                  - alert: BexApiOriginLatencyHigh
                    expr: |
                      histogram_quantile(0.95,
                        sum by (le, surface) (
                          rate(bex_api_http_request_duration_seconds_bucket{surface=~"rest|graphql|mcp"}[10m])
                        )
                      ) > 2.5
                      and
                      sum by (surface) (
                        rate(bex_api_http_request_duration_seconds_count{surface=~"rest|graphql|mcp"}[10m])
                      ) > 0.1
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "bex-api {{ $labels.surface }} p95 is {{ $value | humanizeDuration }}"
                      description: "The 95th percentile of bex-api's own request duration on the {{ $labels.surface }} surface has been above 2.5s for >10m with meaningful traffic. Callers (dashboard, CLI, agents) are seeing timeouts even where the status is 200. Use the bex-api-gateways dashboard's slowest-routes panel to find which route pattern moved, then check the dependency it fans out to: Kubernetes API latency, control-plane Postgres, OpenFGA, Hydra introspection. Runbook: docs/ADR088-platform-observability-ui.md"

                  - alert: WebhookDeliveryAdmissionPressure
                    expr: |
                      sum(
                        increase(bex_webhooks_delivery_admissions_total{result="capped"}[15m])
                      ) > 100
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Outbound webhook admission is chronically hitting its workspace bound"
                      description: "More than 100 webhook notifications were capped in each rolling 15m window for >10m. First investigate event amplification and unhealthy endpoints/retry pressure; raise BEX_MAX_WEBHOOK_DELIVERIES_PER_WORKSPACE only after confirming database and worker capacity. Runbook: docs/ADR010-observability.md#webhook-admission-pressure"

                  # w3/m83 t006. Admission pressure (above) is about the queue's
                  # bound; this is about the wire. A tenant's own broken endpoint
                  # is THEIR fault and must not page — so the signal is not the
                  # failure count but the FLEET RATIO: when essentially every
                  # attempt bex makes fails, the common factor is bex's egress
                  # path (DNS, NetworkPolicy, TLS trust, proxy), not N tenants
                  # simultaneously breaking N unrelated endpoints.
                  #
                  # Known limit, stated rather than hidden: the counter carries
                  # no endpoint label by design (the ADR010 cardinality rule), so
                  # "all endpoints" cannot be counted directly and >90% of a
                  # meaningful volume stands in for it. On a fleet with very
                  # little webhook traffic, one busy broken endpoint can clear
                  # the floor alone — hence warning, not critical, and a
                  # description that tells the responder to check concentration
                  # first. The floor (0.02/s ≈ 36 attempts per 30m) and the
                  # 30-minute persistence window are what keep a single retry
                  # storm from paging.
                  - alert: WebhookDeliveryFailing
                    expr: |
                      (
                        sum(rate(bex_webhooks_delivery_attempts_total{result="failed"}[30m]))
                        / sum(rate(bex_webhooks_delivery_attempts_total[30m]))
                      ) > 0.9
                      and
                      sum(rate(bex_webhooks_delivery_attempts_total[30m])) > 0.02
                    for: 30m
                    labels:
                      severity: warning
                    annotations:
                      summary: "{{ $value | humanizePercentage }} of outbound webhook attempts are failing fleet-wide"
                      description: "Nearly every webhook delivery attempt bex made in the last 30m failed, across all endpoints and both automatic and manual origins. Suspect bex's own egress before any tenant's endpoint: cluster DNS resolution, the bex-api NetworkPolicy egress rules, outbound TLS trust, and the worker's own health. Confirm the failures are actually spread (bex_webhooks_delivery_attempts_total has no endpoint label, so check the deliveries surface for whether one busy endpoint dominates) before treating this as platform-wide. Runbook: docs/ADR010-observability.md#outbound-webhook-and-push-delivery"

                  # w3/m83 t006. Push is the ADR048 supervision channel: a
                  # phone that stops buzzing looks exactly like a quiet day.
                  # Both halves are required — staleness alone would fire on
                  # every genuinely idle night, and a queue alone says nothing
                  # about delivery. Pending work plus no success is the failure.
                  #
                  # bex_push_last_success_timestamp_seconds is PROCESS-local and
                  # starts at 0, so `time() - 0` is trivially over any threshold
                  # right after a bex-api restart. That is deliberate rather than
                  # guarded away: a fresh process with a non-empty queue that
                  # cannot deliver IS the failure, and a process that CAN deliver
                  # stamps the gauge within one worker poll — far inside the
                  # 30-minute persistence window, which is what makes the
                  # restart transient silent without hiding the real case.
                  - alert: PushDeliveryStale
                    expr: |
                      (time() - bex_push_last_success_timestamp_seconds) > (2 * 3600)
                      and bex_push_enabled == 1
                      and on (job, instance) (
                        sum by (job, instance) (
                          bex_push_queue_rows{state=~"send_pending|receipt_pending"}
                        ) > 0
                      )
                    for: 30m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Push delivery has not succeeded in {{ $value | humanizeDuration }} while work is queued"
                      description: "Push transport is configured and rows are waiting in send_pending/receipt_pending, but no provider operation has succeeded for over two hours — every mobile supervision notification (ADR048) is silently undelivered. Check the VAPID credentials and provider reachability first, then bex_push_transport_total{result} and bex_push_operations_total{result} for whether sends are being rejected or never attempted. Runbook: docs/ADR010-observability.md#outbound-webhook-and-push-delivery"

                  # w3/m83 t006. The w5/m81 SLO baseline exported this histogram
                  # but nothing alerted on it, so a sandbox substrate that had
                  # stopped standing sessions up was visible only on a dashboard
                  # nobody was watching. Failure RATIO, not latency: a slow
                  # provision is an ADR047 UX regression, a failing one means the
                  # user's session never starts. The traffic floor (0.0028/s ≈ 10
                  # provisions per hour) is what keeps a quiet hour with one
                  # failure from paging — no vector(0) coercion, so an idle hour
                  # produces no series at all rather than a fake healthy zero.
                  - alert: AgentSessionProvisionFailing
                    expr: |
                      (
                        sum(rate(bex_agent_session_provision_seconds_count{outcome="failed"}[1h]))
                        / sum(rate(bex_agent_session_provision_seconds_count[1h]))
                      ) > 0.25
                      and
                      sum(rate(bex_agent_session_provision_seconds_count[1h])) > 0.0028
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "{{ $value | humanizePercentage }} of agent-session sandbox provisions are failing"
                      description: "More than a quarter of agent-session sandbox creations failed to reach Running in the last hour, so users are accepting a session that never boots (ADR047 accept-fast/provision-async). Check the OpenSandbox substrate first: kubectl -n opensandbox-system get pods, node capacity on the sandbox pool, and image-pull health for BEX_AGENT_SESSION_IMAGE. bex_agent_session_provision_seconds{outcome} separates a slow provision from a failed one. Runbook: docs/ADR047-cloud-coding-agent-sessions.md"

                  # w5/m95. ADR088's tenant-facing coverage table carried one
                  # row reading "none (accepted for now) ... Owner: unfiled":
                  # sandbox creation OUTSIDE an agent session. The sibling alert
                  # above watches the same substrate through its busiest caller,
                  # so a substrate outage is caught — but a regression specific
                  # to /v1/sandboxes (its authorization, template resolution, or
                  # the create verb itself) was invisible to every signal bex
                  # had. Same shape as that sibling deliberately, so the pair
                  # reads together.
                  #
                  # Numerator and denominator both exclude rejected/unavailable:
                  # those are refused before any runtime call, so counting them
                  # would let a client spraying invalid requests either raise a
                  # false alarm or dilute a real one. capacity IS a failure here
                  # — it is returned when a pod never became ready in the
                  # platform's wait, which is a substrate symptom bex attributes
                  # to a plan limit, not a clean refusal.
                  - alert: SandboxProvisionFailing
                    expr: |
                      (
                        sum(rate(bex_sandbox_create_total{outcome=~"failed|capacity"}[1h]))
                        / sum(rate(bex_sandbox_create_total{outcome=~"failed|capacity|succeeded"}[1h]))
                      ) > 0.25
                      and
                      sum(rate(bex_sandbox_create_total{outcome=~"failed|capacity|succeeded"}[1h])) > 0.0028
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "{{ $value | humanizePercentage }} of /v1/sandboxes creations are failing"
                      description: "More than a quarter of sandbox creations through the public API failed or timed out waiting for the pod to become ready in the last hour, so agents calling /v1/sandboxes cannot get an execution environment. Check the OpenSandbox substrate first: kubectl -n opensandbox-system get pods, node capacity on the sandbox pool, and image-pull health for BEX_SANDBOX_IMAGE. bex_sandbox_create_total{outcome} separates a capacity timeout from an unexplained failure, and bex_sandbox_create_seconds shows whether creates are merely slow. Agent-session sandboxes report separately (AgentSessionProvisionFailing); both firing points at the shared substrate rather than either API. Runbook: docs/ADR014-sandboxes.md"

                  # w5/m99 — a live sandbox with no live owning session must not
                  # run for days. Inventory reconcile publishes the divergence;
                  # fire when any orphan class stays non-empty past one Completer
                  # interval (15s tick, 2m for: covers a couple of missed ticks).
                  - alert: SandboxOrphansPresent
                    expr: |
                      sum(bex_sandbox_live{class=~"terminal_orphan|no_row_orphan"}) > 0
                    for: 2m
                    labels:
                      severity: warning
                    annotations:
                      summary: "{{ $value }} orphaned live sandbox(es) still running"
                      description: "Inventory reconcile found sandboxes whose agent session is terminal or absent. Check bex_sandbox_live{class} and Completer logs for terminate failures (bex_sandbox_teardown_failures_total). Prefer the reconcile reclaiming them; a stuck substrate may need kubectl -n <ws>-sandbox. Runbook: docs/ADR014-sandboxes.md"

                  - alert: SandboxOldestOverBound
                    expr: |
                      max(bex_sandbox_oldest_age_seconds) > 86400
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Oldest live sandbox is {{ $value | humanizeDuration }} old (past the 24h lifetime bound)"
                      description: "A sandbox has outlived the enforced timeoutSeconds maximum (86400). Lifetime enforcement and inventory reconcile should have stopped it; check OpenSandbox terminate health and bex_sandbox_teardown_failures_total. Runbook: docs/ADR014-sandboxes.md"

                  - alert: BillingExportBacklog
                    expr: |
                      bex_billing_enabled == 1
                      and bex_billing_outbox_oldest_pending_age_seconds > (72 * 3600)
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Stripe billing export backlog is older than 72h"
                      description: "A sealed usage row has remained pending for >24h beyond the 48h seal horizon. Inspect without replay: scripts/stripe-billing-reconcile.sh issues. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

                  - alert: BillingPermanentReject
                    expr: |
                      bex_billing_enabled == 1
                      and bex_billing_export_rejected_rows > 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Stripe permanently rejected billing meter events"
                      description: "One or more usage rows are held in the durable reject queue. Dry-run reconciliation before retry or acknowledgement: scripts/stripe-billing-reconcile.sh issues. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

                  - alert: BillingExportAmbiguity
                    expr: |
                      bex_billing_enabled == 1
                      and bex_billing_export_ambiguous_rows > 0
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Stripe billing export has an old ambiguous provider outcome"
                      description: "An attempted event exceeded Stripe's 24h identifier window without a local stamp and automatic replay stopped. Reconcile provider summaries, then explicitly mark repaired or acknowledge; never blind-retry. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

                  - alert: BillingWebhookRejected
                    expr: |
                      sum by (job, instance) (
                        increase(bex_billing_operations_total{operation=~"webhook_signature|webhook_mode|webhook_handler",result="error"}[15m])
                      ) > 0
                      and on (job, instance) bex_billing_enabled == 1
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: "bex rejected or failed a Stripe webhook delivery"
                      description: "checkout.session.completed is the only writer of payment_method_bound_at, which alone decides whether a workspace may create anything — so a dropped delivery locks a real customer out with no trace. A signature or livemode rejection is a permanent loss (Stripe never retries a 4xx); a handler error returns 503 and Stripe retries for up to three days, and persistent failure gets the endpoint disabled. Check the bex-api log for the matching 'billing: ...' line, which names the event id. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

                  - alert: BillingWebhookSilent
                    expr: |
                      max(bex_billing_enabled) == 1
                      and on()
                      (time() - max(bex_billing_webhook_last_success_timestamp_seconds > 0)) > (72 * 3600)
                    for: 30m
                    labels:
                      severity: warning
                    annotations:
                      summary: "No Stripe webhook has succeeded in over 72h"
                      description: "Either Stripe stopped delivering (endpoint disabled or misconfigured) or nothing is happening. 72h comes from the observed delivery gaps on 2026-09-16: over a 6.7-day sample the largest real gap was 45.7h and p95 was 35.6h, so this clears the quiet periods with headroom. Volume is low, so treat this as a prompt to check the endpoint rather than as a page: bash scripts/stripe-webhook-drift.sh. The '> 0' filter inside max() drops replicas that have never received a webhook — a freshly restarted pod publishes 0, which is not silence — so the alert reads the freshest success across the fleet, not a restarted pod's zero. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

                  - alert: BillingLocalStampFailure
                    expr: |
                      sum by (job, instance) (
                        increase(bex_billing_operations_total{operation="local_stamp",result="error"}[15m])
                      ) > 0
                      and on (job, instance) bex_billing_enabled == 1
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Stripe accepted usage but the local export stamp failed"
                      description: "Provider acceptance may be ahead of local state. Restore Postgres and reconcile before the 24h identifier window expires. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

                  - alert: BillingProviderDuplicate
                    expr: |
                      sum by (job, instance) (
                        increase(bex_billing_operations_total{operation=~"duplicate_customer|duplicate_subscription",result="error"}[15m])
                      ) > 0
                      and on (job, instance) bex_billing_enabled == 1
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Stripe billing found duplicate Customer or Subscription ownership"
                      description: "The fail-closed ownership resolver found multiple provider objects for one workspace. Do not delete automatically; inspect metadata and subscription status under the test-mode guard. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

                  - alert: BillingInvoiceReadDegraded
                    expr: |
                      sum by (job, instance) (
                        increase(bex_billing_operations_total{operation="invoice_read",result="error"}[15m])
                      ) > 2
                      and on (job, instance) bex_billing_enabled == 1
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Stripe invoice read-back is degraded"
                      description: "Repeated invoice preview/history reads failed; the usage surface is falling back to estimates. Check restricted-key permissions and Stripe API health. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

                  # Version/mode mismatches only come from Stripe itself (a SIGNED
                  # event carrying the wrong pinned API version or test/live mode),
                  # so one is drift and pages. Signature rejects are different: the
                  # endpoint is public, and any unsigned POST from a scanner or a
                  # replay counts one — a handful a day is background (13 in the
                  # three days to 2026-09-11, each paging on-call as "drift" for
                  # 15 minutes). A real secret mismatch rejects EVERY Stripe
                  # delivery, so it shows as a burst; that is the warning below.
                  - alert: BillingWebhookDrift
                    expr: |
                      sum by (job, instance) (
                        increase(bex_billing_operations_total{operation=~"webhook_version|webhook_mode",result="error"}[15m])
                      ) > 0
                      and on (job, instance) bex_billing_enabled == 1
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Stripe billing webhook API version or mode drifted"
                      description: "Webhook intake rejected a signed Stripe event for its pinned API version or test/live mode. Verify the endpoint's API version and mode in the Stripe dashboard; never weaken verification. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

                  - alert: BillingWebhookSignatureRejects
                    expr: |
                      sum by (job, instance) (
                        increase(bex_billing_operations_total{operation="webhook_signature",result="error"}[15m])
                      ) > 5
                      and on (job, instance) bex_billing_enabled == 1
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Stripe billing webhook is rejecting signatures in a burst"
                      description: "More than 5 webhook deliveries failed signature verification within 15 minutes. A few a day are unsigned scanner or replay POSTs to the public endpoint and are ignored; a burst means the endpoint secret no longer matches Stripe's and every real delivery is being rejected. Check the endpoint's recent deliveries in the Stripe dashboard, then rotate add→verify→revoke; never weaken verification. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

                  - alert: BillingProvisioningFailure
                    expr: |
                      sum by (job, instance) (
                        increase(bex_billing_operations_total{operation="provisioning",result="error"}[15m])
                      ) > 2
                      and on (job, instance) bex_billing_enabled == 1
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Stripe Customer or Subscription provisioning is repeatedly failing"
                      description: "Usage cannot export until the workspace's unique Customer and metered Subscription converge. Inspect catalog/key permissions and duplicate-object alerts. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

                  # Stranded node-local images: App images are node-local ctr imports
                  # (no registry — zot is empty), so a tenant-node replacement or an
                  # autoscaler scale-down strands them and App pods sit in
                  # ImagePullBackOff/ErrImageNeverPull. A PLATFORM defect of the
                  # node-local-image design, not tenant paging — hence severity warn.
                  - alert: StrandedNodeLocalImages
                    expr: |
                      max by (namespace, pod, container) (
                        kube_pod_container_status_waiting_reason{
                          reason=~"ImagePullBackOff|ErrImageNeverPull",
                          namespace="default"
                        }
                      ) > 0
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "App {{ $labels.namespace }}/{{ $labels.pod }} can't pull its node-local image"
                      description: "An App pod has been ImagePullBackOff/ErrImageNeverPull for >10m — a node-local image was stranded by node replacement or scale-down (no registry to re-pull from). Re-import: the /deploy-app-from-local runbook. Debug: kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}"

                  - alert: TraefikHigh5xxRate
                    expr: |
                      (
                        sum(rate(traefik_service_requests_total{code=~"5.."}[5m]))
                        / sum(rate(traefik_service_requests_total[5m]))
                      ) > 0.05
                      and
                      sum(rate(traefik_service_requests_total[5m])) > 0.1
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Traefik is serving >5% 5xx responses"
                      description: "Over 5% of edge requests have been 5xx for >10m (with meaningful traffic). Debug: kubectl -n traefik logs deploy/traefik; check upstream service health and recent deploys."
              - name: log-delivery
                rules:
                  # Independent node inventory: a disappeared collector must remain expected.
                  - record: bex:log_delivery_collector_expected
                    expr: max by (node) (kube_node_info)
                  - record: bex:log_delivery_collector_up
                    expr: max by (node) (up{job="alloy"} == 1)
                  - record: bex:log_delivery_inventory_present
                    expr: (count(kube_node_info) > bool 0) or vector(0)
                  - record: bex:log_delivery_loki_up
                    expr: |
                      max(
                        (up{job="loki"} == 1)
                        and on (job, instance) (process_start_time_seconds{job="loki"} > 0)
                        and on (job, instance) (loki_ingester_wal_disk_full_failures_total{job="loki"} >= 0)
                      ) or vector(0)
                  - record: bex:log_delivery_collector_healthy
                    expr: |
                      min by (node) (
                        (
                          (alloy_config_last_load_successful{job="alloy"} == bool 1)
                          or
                          (alloy_component_controller_running_components{job="alloy",health_type!="healthy"} > 0) * 0
                        )
                        and on (job, instance, node, pod) (up{job="alloy"} == 1)
                        and on (job, instance, node, pod) alloy_config_last_load_successful{job="alloy"}
                        and on (job, instance, node, pod) (alloy_component_controller_running_components{job="alloy"} > 0)
                      )
                  # These counters are lazy. A first positive sample is evidence only after
                  # the newly retained marker has established a 15m baseline for this target.
                  # During initial rollout, ordinary increases still work; first samples have
                  # an explicit 15m blind spot. Existing up history cannot establish baseline.
                  # Ordinary increases survive scrape loss within the lookback. First-positive
                  # evidence requires current success and becomes unknown if that scrape fails.
                  - record: bex:log_delivery_writer_drop_activity
                    expr: |
                      sum by (node, reason) (
                        (increase(loki_write_dropped_entries_total{job="alloy"}[15m]) > 0)
                        or
                        (
                          (loki_write_dropped_entries_total{job="alloy"} > 0
                            unless loki_write_dropped_entries_total{job="alloy"} offset 15m)
                          and on (job, instance, node, pod)
                            (alloy_config_last_load_successful{job="alloy"} offset 15m == 1)
                          and on (job, instance, node, pod) (up{job="alloy"} == 1)
                        )
                      ) > bool 0
                  - record: bex:log_delivery_loki_rejection_activity
                    expr: |
                      sum by (reason, format, retention_hours) (
                        (increase(loki_discarded_samples_total{job="loki"}[15m]) > 0)
                        or
                        (
                          (loki_discarded_samples_total{job="loki"} > 0
                            unless loki_discarded_samples_total{job="loki"} offset 15m)
                          and on (job, instance) (process_start_time_seconds{job="loki"} offset 15m > 0)
                          and on (job, instance) (up{job="loki"} == 1)
                        )
                      ) > bool 0
                  - record: bex:log_delivery_retry_activity
                    expr: |
                      sum by (node) (
                        increase(loki_write_batch_retries_total{job="alloy"}[5m]) > 0
                      ) > bool 0
                  - record: bex:log_delivery_wal_disk_full_activity
                    expr: |
                      sum (
                        (increase(loki_ingester_wal_disk_full_failures_total{job="loki"}[15m]) > 0)
                        or
                        (
                          (loki_ingester_wal_disk_full_failures_total{job="loki"} > 0
                            unless loki_ingester_wal_disk_full_failures_total{job="loki"} offset 15m)
                          and on (job, instance) (process_start_time_seconds{job="loki"} offset 15m > 0)
                          and on (job, instance) (up{job="loki"} == 1)
                        )
                      ) > bool 0
                  - alert: LogDeliveryEntriesDropped
                    expr: bex:log_delivery_writer_drop_activity > 0
                    labels:
                      severity: warning
                      namespace: monitoring
                      service: log-shipper
                    annotations:
                      summary: 'Log writer dropped entries on {{ $labels.node }}'
                      description: 'Alloy reported final writer drops with reason {{ $labels.reason }} during the last 15 minutes. These entries were not delivered; intentional pipeline filtering is excluded.'
                      runbook_url: docs/ADR010-observability.md#durable-log-ingestion
                  - alert: LogDeliveryLokiRejected
                    expr: bex:log_delivery_loki_rejection_activity > 0
                    labels:
                      severity: warning
                      namespace: monitoring
                      service: loki
                    annotations:
                      summary: 'Loki rejected log entries with reason {{ $labels.reason }}'
                      description: 'Loki reported rejected ingestion attempts during the last 15 minutes. Retries may recover these attempts; do not add this count to final Alloy drops as independent loss.'
                      runbook_url: docs/ADR010-observability.md#durable-log-ingestion
                  - alert: LogDeliveryRetriesPersistent
                    expr: bex:log_delivery_retry_activity > 0
                    for: 10m
                    labels:
                      severity: warning
                      namespace: monitoring
                      service: log-shipper
                    annotations:
                      summary: 'Log writer retries persist on {{ $labels.node }}'
                      description: 'Alloy has reported retry activity in every five-minute window for ten minutes. Delivery is delayed or failing; retries alone do not prove final loss.'
                      runbook_url: docs/ADR010-observability.md#durable-log-ingestion
                  - alert: LogDeliveryCollectorMissing
                    expr: bex:log_delivery_collector_expected unless on (node) bex:log_delivery_collector_up
                    for: 10m
                    labels:
                      severity: warning
                      namespace: monitoring
                      service: log-shipper
                    annotations:
                      summary: 'Log collector telemetry is missing on {{ $labels.node }}'
                      description: 'An independently inventoried Kubernetes node has no successful Alloy scrape for ten minutes. Inspect the collector and scrape path; log delivery on this node is unknown.'
                      runbook_url: docs/ADR010-observability.md#durable-log-ingestion
                  - alert: LogDeliveryInventoryMissing
                    expr: bex:log_delivery_inventory_present < 1
                    for: 10m
                    labels:
                      severity: warning
                      namespace: monitoring
                      service: log-shipper
                    annotations:
                      summary: Log collector node inventory is missing
                      description: 'Kubernetes node inventory has been absent for ten minutes. The expected collector set cannot be established, so collector coverage is unknown.'
                      runbook_url: docs/ADR010-observability.md#durable-log-ingestion
                  - alert: LogDeliveryCollectorUnhealthy
                    expr: |
                      (bex:log_delivery_collector_healthy < 1)
                      or
                      (
                        (bex:log_delivery_collector_expected and on (node) bex:log_delivery_collector_up)
                        unless on (node) bex:log_delivery_collector_healthy
                      )
                    for: 5m
                    labels:
                      severity: warning
                      namespace: monitoring
                      service: log-shipper
                    annotations:
                      summary: 'Log collector configuration or component health is bad or unknown on {{ $labels.node }}'
                      description: 'A successfully scraped Alloy collector has had a failed configuration load, non-healthy root-controller components, or missing native health evidence for five minutes. Configuration health alone does not establish successful delivery.'
                      runbook_url: docs/ADR010-observability.md#durable-log-ingestion
                  - alert: LogDeliveryLokiMetricsMissing
                    expr: bex:log_delivery_loki_up < 1
                    for: 5m
                    labels:
                      severity: warning
                      namespace: monitoring
                      service: loki
                    annotations:
                      summary: Loki ingestion telemetry is missing
                      description: 'A successful private Loki scrape with process-start and WAL-counter evidence has been unavailable for five minutes. Ingestion and durability telemetry are unknown; this is not proof of process failure.'
                      runbook_url: docs/ADR010-observability.md#durable-log-ingestion
                  - alert: LogDeliveryLokiWALDiskFull
                    expr: bex:log_delivery_wal_disk_full_activity > 0
                    labels:
                      severity: warning
                      namespace: monitoring
                      service: loki
                    annotations:
                      summary: Loki WAL disk-full failures threaten log durability
                      description: 'Loki reported WAL disk-full failures during the last 15 minutes. Accepted logs may lack WAL durability even while readiness succeeds; later recovery does not retroactively establish durability.'
                      runbook_url: docs/ADR010-observability.md#durable-log-ingestion
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # ApplyOutOfSyncOnly: the Alertmanager StatefulSet carries Force+Replace
    # (its volumeClaimTemplates are immutable; see the alertmanager block), and
    # without this every rule edit would delete+recreate it. Only drifted
    # resources are applied, so a rule change touches the server ConfigMap alone.
    syncOptions: [CreateNamespace=true, ApplyOutOfSyncOnly=true]
