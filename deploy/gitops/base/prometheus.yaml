# Prometheus — the metrics-history backend AND bex's platform-alerting brain.
#
# Metrics history: bex-api's request metrics
# (GET /v1/metrics/{http-requests,http-latency,bandwidth}, via
# NewPrometheusRequestSource) query Traefik's per-service counters
# (traefik_service_requests_total / _request_duration_seconds_bucket /
# _responses_bytes_total, exposed by traefik.yaml's metrics.prometheus with
# addServicesLabels), and its resource metrics (cpu/memory/instance-count, via
# NewPrometheusResourceSource) query the kubelets' cAdvisor series
# (container_cpu_usage_seconds_total / container_memory_working_set_bytes).
# Without this, request metrics return 503 and resource metrics fall back to
# metrics-server's single-point snapshot.
#
# Platform alerting (w3/m6): Alertmanager is now enabled with one email receiver
# on bex's existing SendGrid relay, plus a small high-signal rule pack over
# platform and bex-specific invariants (serverFiles.alerting_rules.yml below).
# The chart auto-wires the server → bundled Alertmanager (cm.yaml injects the
# `alerting:` block whenever alertmanager.enabled), so we only declare rule_files
# here. The SendGrid API key is delivered OUT-OF-BAND — Secret `alertmanager-smtp`
# (key `smtp-password`) in the `monitoring` namespace, never in git
# (docs/ADR010-observability.md, same custody rule as the etcd/openbao-backup S3
# creds). Until it exists the Alertmanager pod stays in ContainerCreating — a
# deliberate one-time bootstrap step, like unsealing OpenBao. The LOCAL overlay
# disables Alertmanager (alertmanager.enabled=false) so the disposable CAPD
# cluster — which has no SMTP cred, exactly as it has no backup S3 creds — doesn't
# carry a permanently-pending pod; the server still evaluates the rules (visible
# in the Prometheus UI), and scripts/alerts-verify.sh stands up its own throwaway
# AM with a capture-webhook receiver (no real email sent).
#
# Exporter posture (was "server-only, no exporters"): still deliberately minimal.
# Enabled: Alertmanager, kube-state-metrics and the filesystem-only node exporter
# on tenant/build nodes. The exporter observes their shared node/image root disk;
# it does not collect a general host-metric suite. Pushgateway remains disabled.
# PVC usage comes from kubelet metrics; node readiness from kube-state-metrics.
# Days-scale retention on a small PV; bex-api points at
# the server with BEX_PROM_URL=http://prometheus-server.monitoring.
#
# NOTE: the Traefik scrape target below matches pods labelled
# app.kubernetes.io/name=traefik on port 9100 (the metrics entrypoint). If the
# ingress chart's pod labels/port differ on this cluster, tune the relabel keep +
# port here (the label matching is the one cluster-specific knob).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1" # after traefik/metrics-server exist
spec:
  project: bex-platform
  # Each revision stores another copy of the inline rule pack. Ten histories
  # exceeded etcd's request limit during m164; retain three local rollback
  # entries and use Git for older configurations.
  revisionHistoryLimit: 3
  source:
    repoURL: oci://ghcr.io/bex-co/bex-charts/prometheus
    path: .
    targetRevision: "sha256:79966b9d29997efc43b93b2df12b628479fcac2868d97a2d98b3e3d12d326ef7"
    helm:
      releaseName: prometheus
      values: |
        fullnameOverride: prometheus
        prometheus-pushgateway: { enabled: false }
        prometheus-node-exporter:
          enabled: true
          hostNetwork: false
          hostPID: false
          hostIPC: false
          service:
            type: ClusterIP
            listenOnAllInterfaces: true
          serviceAccount:
            automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/os: linux
            bex.co/pool: tenant
          tolerations:
            - { key: bex.co/build-only, operator: Equal, value: "true", effect: NoSchedule }
          containerSecurityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          hostRootFsMount:
            enabled: true
            mountPropagation: HostToContainer
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          extraArgs:
            - --collector.disable-defaults
            - --collector.filesystem
            - --web.disable-exporter-metrics
            # Exclude transient/pod mounts before statfs. The locked 1.8.2
            # exporter supports exclude filters; the scrape below keeps only
            # bounded paths that can back nodefs or a separate imagefs.
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/(docker|containers|kubelet/(pods|plugins)|containerd/[^/]*snapshot[^/]*))($|/)
            - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tmpfs|tracefs)$
        # Object-state series for the rule pack (pods/deployments/nodes/cronjobs/
        # statefulsets), on the platform pool like the server. The one exported
        # node label supplies expected coverage even when an exporter vanishes.
        kube-state-metrics:
          enabled: true
          metricLabelsAllowlist:
            - nodes=[bex.co/pool]
          # CNPG Backup/Cluster objects for base-backup age (w3/m174, ADR031).
          rbac:
            extraRules:
              - apiGroups: [postgresql.cnpg.io]
                resources: [backups, clusters]
                verbs: [list, watch]
          customResourceState:
            enabled: true
            config:
              spec:
                resources:
                  - groupVersionKind: { group: postgresql.cnpg.io, version: v1, kind: Backup }
                    metricNamePrefix: bex_cnpg_backup
                    labelsFromPath:
                      name: [metadata, name]
                      namespace: [metadata, namespace]
                      cnpg_io_cluster: [spec, cluster, name]
                    metrics:
                      - name: stopped_at_seconds
                        help: "CNPG Backup stoppedAt by phase."
                        each:
                          type: Gauge
                          gauge:
                            path: [status]
                            valueFrom: [stoppedAt]
                            labelsFromPath:
                              phase: [phase]
                  - groupVersionKind: { group: postgresql.cnpg.io, version: v1, kind: Cluster }
                    metricNamePrefix: bex_cnpg_cluster
                    labelsFromPath:
                      namespace: [metadata, namespace]
                      cnpg_io_cluster: [metadata, name]
                    metrics:
                      - name: info
                        help: "Existing CNPG Clusters."
                        each:
                          type: Info
                          info:
                            labelsFromPath: {}
          nodeSelector:
            bex.co/pool: platform
          tolerations:
            - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
        # Single-replica Alertmanager: the paging fan-out. PERSISTENT (small PVC,
        # 2026-09-11): silences and the notification log survive a pod restart,
        # so "silence it and file the .pm note" is a reliable way to acknowledge a
        # known alert, and a restart never re-notifies. It was ephemeral before,
        # and a restart dropped every silence — with four alerts firing for weeks
        # that meant the only working mute was the inbox's delete key
        # (docs/ADR010-observability.md §Three tiers). One email receiver on the
        # SendGrid relay bex already runs (the w4/m12 invite / Kratos-courier
        # relay, smtp.sendgrid.net:587 STARTTLS, docs/ADR012-auth.md §Email) — no
        # new credential to mint. The SendGrid API key is read from a file mounted
        # off the out-of-band Secret `alertmanager-smtp` (key `smtp-password`), so
        # no credential ever lands in git; `to`/`from` are non-secret and committed.
        alertmanager:
          enabled: true
          replicaCount: 1
          # A StatefulSet's volumeClaimTemplates are immutable, so turning
          # persistence on (or resizing it) cannot be applied over the existing
          # object. Force+Replace lets Argo delete+recreate the StatefulSet; the
          # PVC outlives it (StatefulSet deletion never cascades to PVCs). Paired
          # with ApplyOutOfSyncOnly on the Application so this only happens when
          # the StatefulSet itself drifted, not on every rule edit.
          statefulSet:
            annotations:
              argocd.argoproj.io/sync-options: Force=true,Replace=true
          persistence:
            enabled: true
            # The data is kilobytes (silences + notification log); hcloud-csi
            # rounds any request up to its 10Gi minimum on prod, local-path
            # allocates lazily on the mock cluster (where AM is disabled anyway).
            size: 1Gi
          nodeSelector:
            bex.co/pool: platform
          tolerations:
            - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          extraSecretMounts:
            - name: smtp-password
              secretName: alertmanager-smtp
              mountPath: /etc/alertmanager/secrets
              readOnly: true
          config:
            global:
              resolve_timeout: 5m
              # SendGrid on 587/STARTTLS (465 is blocked from Hetzner — ADR012 §11).
              smtp_smarthost: smtp.sendgrid.net:587
              smtp_from: no-reply@bex.co
              smtp_auth_username: apikey # SendGrid's literal SMTP username; key is the password
              smtp_auth_password_file: /etc/alertmanager/secrets/smtp-password
              smtp_require_tls: true
            # Three tiers (docs/ADR010-observability.md §Three tiers):
            #   critical → PAGE.   Its own email per alert group, re-sent every 4h
            #              while firing, resolved mail sent.
            #   warning  → TICKET. ONE digest email listing every open warning,
            #              re-sent at most daily. A new warning joins the digest
            #              within group_interval; nothing is sent on resolve (the
            #              next digest simply omits it). A warning that fires for
            #              days is visible every day without being six emails a
            #              day — four such alerts were 24 emails/day before this.
            #   info     → DASHBOARD. Black-holed at the `null` receiver; visible
            #              in Alertmanager/Grafana only (customer-actionable, e.g.
            #              a tenant's own custom-domain DNS not pointing at bex).
            route:
              receiver: platform
              group_by: [alertname, namespace]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                # Read off-cluster by alerting-heartbeat.sh; never emails.
                - matchers:
                    - alertname="Watchdog"
                  receiver: "null"
                - matchers:
                    - severity="info"
                  receiver: "null"
                - matchers:
                    - severity="warning"
                  receiver: platform-digest
                  group_by: [severity]
                  group_wait: 5m
                  group_interval: 30m
                  repeat_interval: 24h
            receivers:
              - name: platform
                email_configs:
                  # This must remain a deliverable mailbox the operator reads;
                  # Alertmanager cannot detect a recipient domain with no MX.
                  - to: puncsky@gmail.com # operator on-call inbox; non-secret
                    send_resolved: true
              # Same mailbox, digest semantics: one message for the whole warning
              # group, no resolved mail. The subject carries the open count so an
              # inbox filter can key on it.
              - name: platform-digest
                email_configs:
                  - to: puncsky@gmail.com
                    send_resolved: false
                    headers:
                      Subject: "[bex] {{ .Alerts.Firing | len }} warning(s) open (daily digest)"
              # Black hole for non-paging (info) alerts: a receiver with no notifier
              # config delivers nowhere while Alertmanager still tracks the alert.
              - name: "null"
            # One page per broken thing. A not-Ready cert is already paging, so its
            # "expiring" twin is redundant; and a tenant custom-domain cert owned
            # by the info rules must never reach the platform rules even if a
            # future edit loosens their carve-out. `equal` pins both to the same
            # Certificate — both rule families carry namespace + name.
            inhibit_rules:
              - source_matchers: [alertname="CertificateNotReady"]
                target_matchers: [alertname="CertificateExpiringSoon"]
                equal: [namespace, name]
              - source_matchers: [alertname=~"TenantCustomDomainCert.*"]
                target_matchers: [alertname=~"CertificateNotReady|CertificateExpiringSoon"]
                equal: [namespace, name]
        server:
          # Retention bounds stored history, not the memory required to replay
          # the WAL and evaluate queries. The production overlay owns its larger
          # memory budget; this baseline keeps the local stack small.
          # The PV rides the cluster default
          # StorageClass — hcloud-volumes on prod (a network volume, survives a
          # node loss), local-path on the CAPD mock (node-local) — so history
          # survives a pod restart (and a node loss on prod); with emptyDir a
          # reschedule silently wiped every chart.
          retention: 3d
          persistentVolume:
            enabled: true
            size: 8Gi
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          # w1/m19 t003: platform pool
          nodeSelector:
            bex.co/pool: platform
          tolerations:
            - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
          # The etcd job verifies the metrics proxy against this private CA
          # (w7/m160). Only the public ca.crt is projected; optional so a
          # missing Secret never blocks Prometheus itself.
          extraVolumes:
            # The rule pack (w3/m177): a ConfigMap, not inline values, so it
            # does not count against this Application's size budget.
            - name: alerting-rules
              configMap:
                name: prometheus-alerting-rules
            - name: etcd-metrics-ca
              secret:
                secretName: etcd-metrics-ca
                optional: true
                items:
                  - { key: ca.crt, path: ca.crt }
          extraVolumeMounts:
            - { name: alerting-rules, mountPath: /etc/rules, readOnly: true }
            - { name: etcd-metrics-ca, mountPath: /etc/prometheus/etcd-metrics-ca, readOnly: true }
        # The reloader also watches the mounted rule pack (w3/m177).
        configmapReload:
          prometheus:
            extraConfigmapMounts:
              - { name: rules-reload, mountPath: /etc/rules, subPath: "", configMap: prometheus-alerting-rules, readOnly: true }
            extraVolumeDirs: [/etc/rules]
        serverFiles:
          # Server config: rule files + scrape jobs. The `alerting:` block
          # (server → Alertmanager discovery) is injected by the chart because
          # alertmanager.enabled — do NOT also set it here (it would duplicate).
          prometheus.yml:
            rule_files:
              - /etc/rules/alerting_rules.yml # deploy/gitops/base/rules/alerting_rules.yml via ConfigMap prometheus-alerting-rules (w3/m177)
              - /etc/config/platform_gitops_expected.yml
            scrape_configs:
              - job_name: tenant-node-filesystem
                scrape_interval: 60s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [monitoring]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_label_app_kubernetes_io_instance, __meta_kubernetes_pod_container_name, __meta_kubernetes_pod_container_port_name]
                    separator: ";"
                    regex: prometheus-node-exporter;prometheus;node-exporter;metrics
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_phase]
                    regex: Running
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    target_label: node
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: node_filesystem_((size|avail|free)_bytes|files(_free)?|readonly|device_error)|node_scrape_collector_(duration_seconds|success)
                    action: keep
                  - source_labels: [__name__, fstype, mountpoint]
                    separator: ";"
                    # CAPD uses overlay for its node root; only the local
                    # exporter override permits it through the collector filter.
                    regex: node_filesystem_.*;(ext4|xfs|overlay);(/|/var|/var/lib|/var/lib/containerd|/var/lib/kubelet)|node_scrape_collector_(duration_seconds|success);;
                    action: keep
                  - regex: __name__|job|instance|node|mountpoint|device|fstype|collector
                    action: labelkeep
              # Native controller metrics, reachable only inside the cluster.
              - job_name: argocd-applications
                scrape_interval: 60s
                static_configs:
                  - targets: [argocd-metrics.argocd.svc:8082]
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: argocd_app_info
                    action: keep
                  - regex: __name__|job|instance|namespace|name|sync_status|health_status
                    action: labelkeep
              # Private per-collector scrape, shared by registry GC detection
              # and durable-log delivery monitoring. Select only Alloy's HTTP
              # port so the config-reloader sidecar cannot duplicate targets.
              - job_name: alloy
                scrape_interval: 30s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [monitoring]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_label_app_kubernetes_io_instance, __meta_kubernetes_pod_container_name, __meta_kubernetes_pod_container_port_name]
                    separator: ";"
                    regex: alloy;log-shipper;alloy;http-metrics
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_phase]
                    regex: Running
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    target_label: node
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                metric_relabel_configs:
                  # Restrict component/endpoint/tenant identities BEFORE dropping
                  # them, so unrelated native series cannot collide after relabel.
                  # Root health/config markers also establish a baseline for
                  # detecting counters that appear at their first positive value.
                  - source_labels: [__name__, component_id, component_path, host, tenant, controller_id, controller_path]
                    regex: 'bex_zot_(gc_failure|log)_last_observed_timestamp_seconds;loki\.process\.zot_gc_metrics;/;;;;|alloy_config_last_load_successful;;;;;;|alloy_component_controller_running_components;;;;;;/|loki_write_(sent_entries_total|batch_retries_total|dropped_entries_total|request_duration_seconds_count);loki\.write\.default;/;loki\.monitoring\.svc:3100;;;'
                    action: keep
                  - regex: __name__|job|instance|node|pod|service|reason|status_code|health_type
                    action: labelkeep
              # Single-binary Loki has one private service target. Tenant and
              # policy are fixed by the deployed auth-disabled configuration;
              # preserve native rejection dimensions that can differ per sample.
              - job_name: loki
                scrape_interval: 30s
                static_configs:
                  - targets: [loki.monitoring.svc:3100]
                metric_relabel_configs:
                  - source_labels: [__name__, tenant, policy]
                    regex: '(loki_discarded_samples_total|loki_distributor_lines_received_total);fake;|(process_start_time_seconds|loki_ingester_wal_disk_full_failures_total|loki_request_duration_seconds_count);;'
                    action: keep
                  - source_labels: [__name__, route, method]
                    regex: '(loki_discarded_samples_total|loki_distributor_lines_received_total|process_start_time_seconds|loki_ingester_wal_disk_full_failures_total);;|loki_request_duration_seconds_count;loki_api_v1_push;POST'
                    action: keep
                  - regex: __name__|job|instance|reason|retention_hours|format|is_internal_stream|status_code
                    action: labelkeep
              - job_name: traefik
                scrape_interval: 15s # fine-grained so request-metric rates resolve quickly
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [traefik]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    action: keep
                    regex: traefik
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9100
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
              - job_name: traefik-websocket-meter
                scrape_interval: 15s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [traefik]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    action: keep
                    regex: traefik
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9101
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                metric_relabel_configs:
                  # Keep only what the plugin's readers use; the operator's idle
                  # check reads the request-arrival counter (w4/m164).
                  - source_labels: [__name__]
                    regex: bex_websocket_(egress_bytes_total|ingress_bytes_total|meter_healthy|meter_process_start_time_seconds)|bex_http_request_starts_total
                    action: keep
              # cAdvisor: the raw series behind bex-api's cpu/memory/instance-count
              # history. Node SD, scraped THROUGH the apiserver proxy
              # (/api/v1/nodes/<node>/proxy/metrics/cadvisor) rather than the
              # kubelet directly: the pod network can't always reach every node's
              # :10250 (true on the CAPD mock), the apiserver always can, and the
              # ServiceAccount CA verifies the apiserver properly (no
              # insecure_skip_verify). The chart's default ClusterRole already
              # grants nodes + nodes/proxy + nodes/metrics, so no extra RBAC.
              # cAdvisor series natively carry namespace/pod/container labels; App
              # pods are matched downstream by Deployment pod-name shape
              # (<app>-<rs-hash>-<suffix>, see promResourceQueryFor) since kubelet
              # metrics don't carry pod labels like app.bex.co/app.
              - job_name: kubernetes-cadvisor
                scrape_interval: 15s
                scheme: https
                kubernetes_sd_configs:
                  - role: node
                tls_config:
                  ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                authorization:
                  credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                relabel_configs:
                  - target_label: __address__
                    replacement: kubernetes.default.svc:443
                  - source_labels: [__meta_kubernetes_node_name]
                    regex: (.+)
                    target_label: __metrics_path__
                    replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
                  - source_labels: [__meta_kubernetes_node_name]
                    target_label: node
                metric_relabel_configs:
                  # keep only real-container series; drop the pod-sandbox/aggregate
                  # rows (container="") that would double-count sum-by-pod queries
                  - source_labels: [container]
                    regex: ""
                    action: drop
              # The alert pipeline watches itself (w3/m174).
              - job_name: prometheus
                static_configs:
                  - targets: [localhost:9090]
              - job_name: alertmanager
                static_configs:
                  - targets: [prometheus-alertmanager.monitoring.svc:9093]
              # kube-state-metrics: object-state series (Deployment/Pod/Node/
              # CronJob/StatefulSet status) that back the rule pack. Its Service is
              # a stable ClusterIP — a static target is enough.
              - job_name: kube-state-metrics
                scrape_interval: 60s # every consuming alert is for: 5m+ — 60s is plenty
                static_configs:
                  - targets: [prometheus-kube-state-metrics.monitoring.svc:8080]
              # SSH gateway operational metrics carry bounded result/scope
              # labels only—never subjects, targets, commands, or stream data.
              - job_name: bex-ssh-gateway
                scrape_interval: 15s
                static_configs:
                  - targets: [bex-ssh-gateway.bex-system.svc:9090]
              # Stripe Billing operations expose only account-wide gauges and
              # bounded operation/result labels. No workspace, provider object,
              # invoice, transaction, payment, or secret value is a label.
              - job_name: bex-api
                scrape_interval: 15s
                metrics_path: /metrics
                static_configs:
                  - targets: [bex-api.bex-system.svc:8091]
                metric_relabel_configs:
                  - source_labels: [__name__]
                    # billing => the Billing* alerts; agent_session => the
                    # w5/m81 SLO baseline paneled on bex-api-gateways (ADR088
                    # §6) plus AgentSessionProvisionFailing; webhooks =>
                    # WebhookDeliveryAdmissionPressure + WebhookDeliveryFailing,
                    # which evaluated an absent series while the keep was
                    # billing-only (the same never-arrived failure class the
                    # bex-operator job's comment below records for w2/m72);
                    # push => PushDeliveryStale (w3/m83 t006, added WITH the
                    # rule so the rule never evaluates a never-scraped series);
                    # api => w3/m84's first-party request telemetry
                    # (bex_api_http_* / _graphql_operation_* / _mcp_tool_*), the
                    # origin half of every edge-vs-origin question and the
                    # backing series of BexApiOriginHighErrorRate +
                    # BexApiOriginLatencyHigh. Its labels are bounded by
                    # construction (route = registered mux pattern, never a path;
                    # tool/operation = closed registry) — see
                    # lego/backend/internal/api/httpmetrics.go.
                    regex: bex_(billing|agent_session|sandbox|webhooks|push|api)_.*
                    action: keep
              # Build-plane SLIs from the operator's own registry (docs/ADR060
              # D5). This job is why the series are readable at all: the manager
              # binds its metrics endpoint only because config/manager sets
              # --metrics-bind-address, and nothing scraped it before w7/m83 —
              # so the w2/m72 build-outcome alerts were evaluating series that
              # never arrived. Labels are bounded by construction: an outcome
              # class, a retry reason from a closed set, and a workspace id on
              # the correlated-failure counter alone.
              #
              # The keep-list drops controller-runtime's and Go's default
              # families rather than storing them for nothing; add a family here
              # when something actually consumes it.
              - job_name: bex-operator
                scrape_interval: 15s
                static_configs:
                  - targets: [bex-controller-manager-metrics-service.bex-system.svc:8080]
                metric_relabel_configs:
                  - source_labels: [__name__]
                    # build => ADR060 D5 build-plane SLIs; datastore => the
                    # DatastoreStuckProvisioning / DatabaseNotArchivingWAL /
                    # DatastoreObservationFailing alerts and the ADR088 §6
                    # data-plane dashboard — all were evaluating absent series
                    # while the keep was build-only, exactly the w2/m72
                    # failure this comment block warns about.
                    regex: bex_(build|datastore).*
                    action: keep
              # One post-policy netfilter meter per untainted tenant node. Pod discovery
              # (rather than the round-robin Service) preserves the node and
              # source_instance labels needed to detect a missing/reset source.
              - job_name: bex-egress-meter
                scrape_interval: 15s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [bex-system]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_bex_co_component]
                    action: keep
                    regex: egress-meter
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9091
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    target_label: node
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: bex_(app_direct_egress_bytes_total|egress_meter_.*)
                    action: keep
              # Public Postgres front doors: backend→client bytes are counted
              # inside the SNI splice, labeled by the parent Database id.
              - job_name: bex-pg-proxy
                scrape_interval: 15s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [bex-system]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_bex_co_component]
                    action: keep
                    regex: pg-sni-proxy
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9092
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: bex_pg_proxy_(egress_bytes_total|healthy|process_start_time_seconds)
                    action: keep
              - job_name: bex-kv-proxy
                scrape_interval: 15s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [bex-system]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_bex_co_component]
                    action: keep
                    regex: kv-sni-proxy
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9093
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: bex_kv_proxy_(egress_bytes_total|healthy|process_start_time_seconds)
                    action: keep
              # kubelet /metrics (NOT cadvisor): only kubelet_volume_stats_* — the
              # PVC used/capacity bytes behind the PersistentVolumeFillingUp alert.
              # Same apiserver-proxy pattern as cadvisor; metric_relabel keeps just
              # those two series so this stays near-zero cardinality. 60s: the whole
              # kubelet /metrics payload is fetched per scrape (keep runs after), and
              # the only consumer is a for:15m alert over slow-moving disk usage.
              # etcd members (w7/m160): one kube-rbac-proxy per control-plane
              # node (deploy/gitops/charts/etcd-metrics). TLS is verified against
              # the proxy's private CA by its fixed DNS identity, and the proxy
              # authorizes this SA token for GET /metrics. Finite allowlist of
              # latency, leader/quorum and backend-size series.
              - job_name: etcd
                scrape_interval: 30s
                scheme: https
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [monitoring]
                tls_config:
                  ca_file: /etc/prometheus/etcd-metrics-ca/ca.crt
                  server_name: etcd-metrics.monitoring.svc
                authorization:
                  credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    action: keep
                    regex: etcd-metrics
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9979
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    target_label: node
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: etcd_server_has_leader|etcd_server_is_leader|etcd_server_leader_changes_seen_total|etcd_server_proposals_failed_total|etcd_server_slow_apply_total|etcd_server_slow_read_indexes_total|etcd_server_heartbeat_send_failures_total|etcd_disk_wal_fsync_duration_seconds_bucket|etcd_disk_backend_commit_duration_seconds_bucket|etcd_network_peer_round_trip_time_seconds_bucket|etcd_mvcc_db_total_size_in_bytes|etcd_server_quota_backend_bytes
                    action: keep
              - job_name: kubernetes-kubelet
                scrape_interval: 60s
                scheme: https
                kubernetes_sd_configs:
                  - role: node
                tls_config:
                  ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                authorization:
                  credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                relabel_configs:
                  - target_label: __address__
                    replacement: kubernetes.default.svc:443
                  - source_labels: [__meta_kubernetes_node_name]
                    regex: (.+)
                    target_label: __metrics_path__
                    replacement: /api/v1/nodes/${1}/proxy/metrics
                  - source_labels: [__meta_kubernetes_node_name]
                    target_label: node
                metric_relabel_configs:
                  - source_labels: [__name__]
                    # available: ZotRegistryAlmostFull's `available < 10GiB`
                    # disjunct was blind without it (ADR088 §6 audit).
                    regex: kubelet_volume_stats_(used|capacity|available)_bytes
                    action: keep
              # cert-manager controller metrics (:9402) — certmanager_certificate_*
              # for the CertificateNotReady / CertificateExpiringSoon alerts. Pod SD
              # scoped to the controller pod (webhook/cainjector don't serve these).
              - job_name: cert-manager
                scrape_interval: 60s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [cert-manager]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    action: keep
                    regex: cert-manager
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
                    action: keep
                    regex: controller
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9402
              # OpenBao PER-POD telemetry (:8200 /v1/sys/metrics) — seal state for
              # the OpenBaoSealed alert. Per-pod (not the round-robin Service) so a
              # single sealed raft follower is visible; sealed members still serve
              # /v1/sys/metrics (unauthenticated_metrics_access, set in
              # openbao.values.yaml) reporting vault_core_unsealed=0. The pod label
              # lets the alert name the sealed member.
              - job_name: openbao
                scrape_interval: 30s
                metrics_path: /v1/sys/metrics
                params:
                  format: [prometheus]
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [secrets]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    action: keep
                    regex: openbao
                  - source_labels: [__meta_kubernetes_pod_label_component]
                    action: keep
                    regex: server
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:8200
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                  # Stamp namespace like the cnpg jobs below do: the exporter's
                  # gauge carries no Kubernetes labels, and both OpenBaoSealed
                  # and the obs seal panel select namespace="secrets" — without
                  # this mapping that critical alert evaluated an empty vector
                  # and could never fire (ADR088 §6 review round 2, item 2).
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                metric_relabel_configs:
                  # keep only the seal gauge (OpenBao keeps Vault's metric name; match
                  # a bao_ prefix too in case a future release rebrands it)
                  - source_labels: [__name__]
                    regex: (vault|bao)_core_unsealed
                    action: keep
              # Platform CNPG primary metrics (:9187) — pg_stat_archiver for the
              # PlatformDatabaseBackupStale alert. Scrape each primary directly
              # (not a round-robin Service), and stamp namespace + cluster labels
              # because the SQL metric itself carries neither.
              # Verify metric names on first deploy:
              #   kubectl -n auth exec kratos-db-1 -- curl -s :9187/metrics | grep archiver
              - job_name: cnpg-platform-db
                scrape_interval: 60s
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [bex-system, auth]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
                    action: keep
                    regex: bex-db|kratos-db|hydra-db|openfga-db
                  - source_labels: [__meta_kubernetes_pod_label_role]
                    action: keep
                    regex: primary
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9187
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                  - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
                    target_label: cnpg_io_cluster
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: cnpg_pg_stat_archiver_.*
                    action: keep
              # CNPG TENANT database per-pod metrics (:9187) — w3/m10's
              # active-connections + replication-lag series, for every managed
              # Postgres (w1/m17) across every app namespace (bex's own bex-db
              # stays on the tightly-scoped cnpg-bex-db job above; dropped here
              # to avoid a double scrape). cnpg_backends_total's `total` column
              # has no cluster/namespace label of its own (CNPG's SQL query only
              # labels by datname/usename/application_name/state), so
              # cnpg_io_cluster/namespace/pod are stamped at scrape time —
              # exactly the label vocabulary lego/backend/internal/metrics's
              # DBConnections/ReplicationLag sources select on.
              - job_name: cnpg-tenant-db
                scrape_interval: 60s
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels: [__meta_kubernetes_namespace]
                    action: drop
                    regex: bex-system
                  - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
                    action: keep
                    regex: (.+)
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9187
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                  - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
                    target_label: cnpg_io_cluster
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: cnpg_backends_total|cnpg_pg_replication_.*
                    action: keep
              # Managed Key Value (Valkey) instances: the redis_exporter sidecar
              # the operator attaches to every KeyValue StatefulSet pod (w5/011),
              # scraped on :9121 across all namespaces (a KeyValue lives in its
              # App's namespace). Kept by the app.bex.co/keyvalue pod label; only
              # the redis_* series are retained — memory + connected-clients back
              # the Key Value metrics panel.
              - job_name: valkey-instances
                scrape_interval: 60s
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels:
                      [__meta_kubernetes_pod_label_app_bex_co_keyvalue]
                    action: keep
                    regex: .+
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9121
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: redis_.*
                    action: keep
          # Independent of Argo discovery: missing applications keep an identity.
          # The local overlay replaces only this expression; validation compares
          # both inventories with the rendered children and bootstrap root.
          platform_gitops_expected.yml:
            groups:
              - name: platform-gitops-inventory
                rules:
                  - record: bex:platform_gitops_expected
                    labels: {namespace: argocd}
                    expr: |
                      label_replace(vector(1), "name", "auth-dbs", "", "")
                      or label_replace(vector(1), "name", "barman-cloud-objectstores", "", "")
                      or label_replace(vector(1), "name", "barman-cloud-plugin", "", "")
                      or label_replace(vector(1), "name", "bex-dashboard", "", "")
                      or label_replace(vector(1), "name", "bex-operator", "", "")
                      or label_replace(vector(1), "name", "bex-platform-prod", "", "")
                      or label_replace(vector(1), "name", "bex-postgres", "", "")
                      or label_replace(vector(1), "name", "cert-manager", "", "")
                      or label_replace(vector(1), "name", "cert-manager-issuers", "", "")
                      or label_replace(vector(1), "name", "cluster-autoscaler", "", "")
                      or label_replace(vector(1), "name", "cnpg-operator", "", "")
                      or label_replace(vector(1), "name", "etcd-backup", "", "")
                      or label_replace(vector(1), "name", "etcd-metrics", "", "")
                      or label_replace(vector(1), "name", "grafana", "", "")
                      or label_replace(vector(1), "name", "hydra", "", "")
                      or label_replace(vector(1), "name", "kpack", "", "")
                      or label_replace(vector(1), "name", "kratos", "", "")
                      or label_replace(vector(1), "name", "kubelet-csr-approver", "", "")
                      or label_replace(vector(1), "name", "log-shipper", "", "")
                      or label_replace(vector(1), "name", "loki", "", "")
                      or label_replace(vector(1), "name", "metrics-server", "", "")
                      or label_replace(vector(1), "name", "onbex-default-tls", "", "")
                      or label_replace(vector(1), "name", "openbao", "", "")
                      or label_replace(vector(1), "name", "openbao-backup", "", "")
                      or label_replace(vector(1), "name", "openfga", "", "")
                      or label_replace(vector(1), "name", "opensandbox-controller", "", "")
                      or label_replace(vector(1), "name", "opensandbox-server", "", "")
                      or label_replace(vector(1), "name", "prometheus", "", "")
                      or label_replace(vector(1), "name", "sealed-secrets", "", "")
                      or label_replace(vector(1), "name", "traefik", "", "")
                      or label_replace(vector(1), "name", "traefik-plugins", "", "")
                      or label_replace(vector(1), "name", "zot", "", "")
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # ApplyOutOfSyncOnly: the Alertmanager StatefulSet carries Force+Replace
    # (its volumeClaimTemplates are immutable; see the alertmanager block), and
    # without this every rule edit would delete+recreate it. Only drifted
    # resources are applied, so a rule change touches the server ConfigMap alone.
    syncOptions: [CreateNamespace=true, ApplyOutOfSyncOnly=true]
