# Prometheus — the metrics-history backend. bex-api's request metrics
# (GET /v1/metrics/{http-requests,http-latency,bandwidth}, via
# NewPrometheusRequestSource) query Traefik's per-service counters
# (traefik_service_requests_total / _request_duration_seconds_bucket /
# _responses_bytes_total, exposed by traefik.yaml's metrics.prometheus with
# addServicesLabels), and its resource metrics (cpu/memory/instance-count, via
# NewPrometheusResourceSource) query the kubelets' cAdvisor series
# (container_cpu_usage_seconds_total / container_memory_working_set_bytes).
# Without this, request metrics return 503 and resource metrics fall back to
# metrics-server's single-point snapshot.
#
# Server-only (no alertmanager/pushgateway/exporters), days-scale retention on a
# small PV — this exists solely to feed bex-api's metric range queries (the
# dashboard's presets reach back 24h, so retention must comfortably cover that
# and survive a pod restart). bex-api points at it with
# BEX_PROM_URL=http://prometheus-server.monitoring.
#
# NOTE: the Traefik scrape target below matches pods labelled
# app.kubernetes.io/name=traefik on port 9100 (the metrics entrypoint). If the
# ingress chart's pod labels/port differ on this cluster, tune the relabel keep +
# port here (the label matching is the one cluster-specific knob).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1" # after traefik/metrics-server exist
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: "25.*" # pin minor; server subchart serves /api/v1/query_range
    helm:
      releaseName: prometheus
      values: |
        fullnameOverride: prometheus
        alertmanager: { enabled: false }
        prometheus-pushgateway: { enabled: false }
        kube-state-metrics: { enabled: false }
        prometheus-node-exporter: { enabled: false }
        server:
          # Covers the dashboard's widest range preset (24h) with headroom;
          # cardinality is tiny (two scrape jobs), so this is disk-bounded, not
          # memory-bounded. The PV (cluster default StorageClass, local-path on
          # both the CAPD mock and prod) keeps history across pod restarts —
          # with emptyDir a reschedule silently wiped every chart.
          retention: 3d
          persistentVolume:
            enabled: true
            size: 8Gi
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
        # Two scrape jobs only: Traefik's metrics entrypoint (per-service request
        # counters) and the kubelets' cAdvisor endpoint (per-container cpu/memory).
        serverFiles:
          prometheus.yml:
            scrape_configs:
              - job_name: traefik
                scrape_interval: 15s # fine-grained so request-metric rates resolve quickly
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [traefik]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    action: keep
                    regex: traefik
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: ${1}:9100
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
              # cAdvisor: the raw series behind bex-api's cpu/memory/instance-count
              # history. Node SD, scraped THROUGH the apiserver proxy
              # (/api/v1/nodes/<node>/proxy/metrics/cadvisor) rather than the
              # kubelet directly: the pod network can't always reach every node's
              # :10250 (true on the CAPD mock), the apiserver always can, and the
              # ServiceAccount CA verifies the apiserver properly (no
              # insecure_skip_verify). The chart's default ClusterRole already
              # grants nodes + nodes/proxy + nodes/metrics, so no extra RBAC.
              # cAdvisor series natively carry namespace/pod/container labels; App
              # pods are matched downstream by Deployment pod-name shape
              # (<app>-<rs-hash>-<suffix>, see promResourceQueryFor) since kubelet
              # metrics don't carry pod labels like app.bex.co/app.
              - job_name: kubernetes-cadvisor
                scrape_interval: 15s
                scheme: https
                kubernetes_sd_configs:
                  - role: node
                tls_config:
                  ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                authorization:
                  credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                relabel_configs:
                  - target_label: __address__
                    replacement: kubernetes.default.svc:443
                  - source_labels: [__meta_kubernetes_node_name]
                    regex: (.+)
                    target_label: __metrics_path__
                    replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
                  - source_labels: [__meta_kubernetes_node_name]
                    target_label: node
                metric_relabel_configs:
                  # keep only real-container series; drop the pod-sandbox/aggregate
                  # rows (container="") that would double-count sum-by-pod queries
                  - source_labels: [container]
                    regex: ""
                    action: drop
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
