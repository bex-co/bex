# Ory Kratos — the platform identity service (registration, login, sessions;
# see docs/ADR012-auth.md). The reviewed chart is mirrored to controlled OCI;
# this is a multi-source Application: the immutable artifact provides the chart, the git
# source (ref: values) provides base/values/kratos.values.yaml.
# sync-wave 3: after the CNPG operator (1) and kratos-db (2). Runtime secrets
# (DSN + cookie/cipher) are NOT in git — scripts/auth-secrets.sh creates the
# `kratos` Secret out-of-band from .env + the CNPG-generated DB credentials.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kratos
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: bex-platform
  sources:
    - repoURL: oci://ghcr.io/bex-co/bex-charts/kratos
      path: .
      targetRevision: "sha256:6fc4825cba907d1972ffce1808ec32feb34e480b55a59a75b3f477381ed7a19d"
      helm:
        valueFiles:
          - $values/deploy/gitops/base/values/kratos.values.yaml
          # GENERATED branded courier email templates (w6/m42 t013) — see the
          # header of the file itself; regenerated from lego/backend/internal/email.
          - $values/deploy/gitops/base/values/kratos-email-templates.values.yaml
    - repoURL: git@github.com:bex-co/bex.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: auth
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    # first sync can race the out-of-band `kratos` Secret (deploy.yml wave 4b);
    # the migration hook fails until it exists — retry instead of staying red.
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
