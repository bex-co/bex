# The bex control plane: the kubebuilder operator (App CRD + reconcilers).
# Argo deploys it straight from lego/operator/config/default (kustomize) into bex-system,
# overriding the placeholder `controller` image with the one CI pushes to GHCR.
#
# IMAGE PINNING (w1/m7 t002): the checked-in override below is the mutable :latest
# BOOTSTRAP value (the only tag guaranteed to exist before the first deploy). On every
# deploy the workflow (.github/workflows/deploy.yml, "pin image digests in GitOps")
# rewrites it to the exact immutable `@sha256:<digest>` docker just pushed and commits
# it back to main [skip ci] — so the RUNNING Deployment is content-addressed, never a
# mutable tag. Argo then rolls pods automatically when the digest changes; the deploy
# workflow's rollout-restart is now just a fast-path belt-and-suspenders.
# NOTE: if the GHCR package is private, add an imagePullSecret in bex-system (or make
# the package public) so app-cluster nodes can pull it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bex-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:bex-co/bex.git
    targetRevision: main
    path: lego/operator/config/default
    kustomize:
      images:
        - controller=ghcr.io/bex-co/bex-operator@sha256:9a2c8dd6fb6c338874fed5d2a8296658a221105647cfb1a36201097967489f1f
  destination:
    server: https://kubernetes.default.svc
    namespace: bex-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # the App CRD is large — avoid last-applied annotation limits
