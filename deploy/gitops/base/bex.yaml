# The bex control plane: the kubebuilder operator (App CRD + reconcilers).
# Argo deploys it straight from lego/operator/config/default (kustomize) into bex-system,
# overriding the placeholder `controller` image with the one CI pushes to GHCR.
#
# IMAGE PINNING (w1/m7 t002): the checked-in override below is the mutable :latest
# BOOTSTRAP value (the only tag guaranteed to exist before the first deploy). On every
# deploy the workflow (.github/workflows/deploy.yml, "pin image digests in GitOps")
# rewrites it to the exact immutable `@sha256:<digest>` docker just pushed and commits
# it back to main [skip ci] — so the RUNNING Deployment is content-addressed, never a
# mutable tag. Argo then rolls pods automatically when the digest changes. The deploy
# workflow waits for that rollout instead of restarting the operator on top of it
# (scripts/operator-pins.sh operator, w5/196).
# NOTE: if the GHCR package is private, add an imagePullSecret in bex-system (or make
# the package public) so app-cluster nodes can pull it.
#
# SNI PROXY PINS (w6/m470, docs/ADR021-keyvalue-management.md § 10): the two public
# datastore front doors, bex-kv-sni-proxy and bex-pg-sni-proxy, run the same operator
# image under their own placeholders. The same write-back moves each of their pins to
# the new digest only when that image's /kv-sni-proxy (or /pg-sni-proxy) differs from
# the pinned one's, and keeps it otherwise, so a deploy that leaves the proxy's code
# alone rolls no proxy pod and closes no external Key Value or Postgres connection.
# A held digest runs byte-identical bytes, and any doubt moves the pin. Keep each pin
# on one line in this exact `name=image@sha256:` shape: deploy.yml and
# scripts/deploy-superseded.sh match all three generated fields here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bex-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: bex-platform
  source:
    repoURL: git@github.com:bex-co/bex.git
    targetRevision: main
    path: lego/operator/config/default
    kustomize:
      images:
        - controller=ghcr.io/bex-co/bex-operator@sha256:91cf7828761c03eafd5675d0a0c8614878da20c2b8d3cd6d03fdfd3d486ab8e5
        - kv-sni-proxy=ghcr.io/bex-co/bex-operator@sha256:0ba1d0dcbf94286265f95c3e180944b4f7bcc86145567ab0b93e2c1d2f3aa75f
        - pg-sni-proxy=ghcr.io/bex-co/bex-operator@sha256:0ba1d0dcbf94286265f95c3e180944b4f7bcc86145567ab0b93e2c1d2f3aa75f
  destination:
    server: https://kubernetes.default.svc
    namespace: bex-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # the App CRD is large — avoid last-applied annotation limits
