# Shared baseline: the set of platform Argo Applications installed into every
# environment. Per-env differences live in ../overlays/<env>/ (which reference this).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - sealed-secrets.yaml          # encrypt infra creds at rest -> committable SealedSecrets (docs/ADR016-sealed-secrets.md)
  - zot.yaml                     # OCI registry (build -> registry -> deploy)
  - opensandbox-controller.yaml  # OpenSandbox BatchSandbox/Pool/SandboxSnapshot CRDs + controller
  - bex.yaml                     # the bex control plane (operator + gateway)
  - dashboard.yaml                # the bex dashboard (Render-style human UI, docs/ADR012-auth.md §5)
  - cluster-api.yaml             # Cluster API + provider controllers (the node-provisioning engine)
  - autoscaler.yaml              # Cluster Autoscaler, in-cluster post-pivot (w1/m19; bootstrap phase uses scripts/install-autoscaler.sh)
  - traefik.yaml                 # edge / ingress controller (Hetzner LB front door)
  - metrics-server.yaml          # resource-metrics backend (metrics.k8s.io) for bex-api metrics
  - prometheus.yaml              # request-metrics backend (scrapes Traefik) for bex-api metrics
  - loki.yaml                    # durable log-history backend (single-binary, filesystem PVC) for bex-api logs
  - log-shipper.yaml             # Alloy DaemonSet: tails App pod logs -> Loki (after loki)
  - cert-manager.yaml            # automated Let's Encrypt TLS
  - cert-manager-issuers.yaml    # letsencrypt-staging + -prod ClusterIssuers (after cert-manager)
  - cnpg-operator.yaml           # CloudNativePG operator (Postgres)
  - bex-postgres.yaml            # the control-plane DB Cluster (db `bex`), after CNPG
  - etcd-backup.yaml             # nightly etcd snapshot -> object storage (local overlay excludes)
  - auth-dbs.yaml                # kratos-db + hydra-db CNPG Clusters, after CNPG
  - kratos.yaml                  # Ory Kratos — platform identity (docs/ADR012-auth.md)
  - hydra.yaml                   # Ory Hydra — platform OAuth2/OIDC (docs/ADR012-auth.md)
  - openfga.yaml                 # OpenFGA — platform authorization (ReBAC, docs/ADR012-auth.md)
  - openbao.yaml                 # OpenBao — platform tenant-credential secret store (docs/ADR013-secrets.md)
  - openbao-backup.yaml          # nightly OpenBao Raft snapshot -> object storage (local overlay excludes)
  - network-policies.yaml        # platform-side tenant isolation: deny tenant pods from bex-system/registry/secrets/monitoring (docs/ADR022-tenant-isolation.md)
  - tenant-node-egress.yaml      # Cilium egressDeny: tenant pods -> node (host/remote-node) + link-local metadata (docs/ADR022-tenant-isolation.md); local overlay drops it (Calico CNI)
  - platform-namespaces.yaml     # monitoring + secrets namespaces the raw resources above land in (from-scratch ordering, w1/m19 t006)
  - tenant-namespace.yaml        # PSS baseline + restricted warn/audit on the tenant apps namespace (w7/m2/t001)
  - tenant-quotas.yaml           # ResourceQuota + LimitRange for the tenant apps namespace (w7/m2/t003)
  - bex-api-apps-rbac.yaml       # bex-api's apps-namespace-scoped secrets/pods/logs/metrics grants (w6/002)
