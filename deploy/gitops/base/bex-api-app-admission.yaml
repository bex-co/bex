# Admission guard for bex-api's cluster-wide App (app.bex.co) mutation authority
# (codex #4). bex-api's ClusterRole (lego/operator/config/api/rbac.yaml) can
# create/update/patch/delete Apps in EVERY namespace, and Kubernetes RBAC cannot
# scope that to dynamically named tenant namespaces. Without this fail-closed CEL
# boundary a compromised bex-api Pod could plant an App in a platform namespace or
# another tenant's namespace and drive the operator to run its image + resolve
# that namespace's Secrets there (a confused deputy). This policy constrains the
# bex-api ServiceAccount itself — enforced by the API server, not by trusted
# application code — and is the admission-layer twin of the operator's own
# AppReconciler.canonicalNamespace guard: an App is legitimate only in its own
# `tea-<id>` workspace namespace (the control plane projects into
# WorkspaceNamespace(id)==id and stamps the same id as app.bex.co/workspace) or
# the bootstrap apps namespace (`default`, BEX_APPS_NAMESPACE — adjust below if
# that is overridden). Mirrors bex-api-namespace-admission.yaml (w3/m35).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bex-api-app-namespaces
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["app.bex.co"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["apps", "databases", "keyvalues"]
  matchConditions:
    - name: bex-api-service-account
      expression: request.userInfo.username == 'system:serviceaccount:bex-system:bex-api'
  variables:
    # DELETE admission requests carry no object — only oldObject — so evaluate
    # against whichever is present (same pattern as bex-api-namespace-admission.yaml).
    - name: target
      expression: >-
        object != null ? object : oldObject
    - name: workspace
      expression: variables.target.metadata.?labels['app.bex.co/workspace'].orValue('')
    # Apps (codex-security 2026-08 F11): the workspace label must be BOUND — an
    # App is canonical in the bootstrap namespace only when it carries NO
    # workspace label (unlabeled legacy) or in exactly its own tea-<id>
    # namespace. The App projector never writes a labeled App into the
    # bootstrap namespace, so a labeled App there is a forged artifact
    # identity: appIdentity() derives the Zot repository, htpasswd username,
    # static-site prefix, and snapshot prefix from that label verbatim, and a
    # forged one captures ANOTHER workspace's registry repository ACL.
    # Databases/KeyValues keep the looser historical rule: the ADR043 D8
    # cutover runbook deliberately leaves labeled twins in the bootstrap
    # namespace between its Steps 5 and 9 (retiring one is a DELETE of a
    # labeled CR there), and no shared-sink identity is derived from their
    # label.
    - name: canonical
      expression: >-
        request.resource.resource == 'apps'
          ? (variables.workspace == '' &&
             variables.target.metadata.namespace == 'default')
            || (variables.workspace.matches('^tea-[0-9a-v]{20}$') &&
                variables.target.metadata.namespace == variables.workspace)
          : variables.target.metadata.namespace == 'default' ||
            (variables.workspace.matches('^tea-[0-9a-v]{20}$') &&
             variables.target.metadata.namespace == variables.workspace)
  validations:
    - expression: variables.canonical
      reason: Forbidden
      message: bex-api may create, mutate, or delete an App only unlabeled in the bootstrap namespace or in its own tea-<id> workspace namespace; Databases and KeyValues additionally tolerate labeled cutover twins in the bootstrap namespace
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bex-api-app-namespaces
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  policyName: bex-api-app-namespaces
  validationActions: [Deny, Audit]
