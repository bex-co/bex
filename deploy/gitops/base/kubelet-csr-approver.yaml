# kubelet-serving CSR approver (w2/m81 t001, docs/ADR072-security-review-round7.md
# finding 5). kube-controller-manager never auto-approves `kubernetes.io/
# kubelet-serving` CSRs, so a kubeadm-provisioned kubelet falls back to a
# self-signed serving cert unless something approves them. This watches CSRs
# cluster-wide and approves ONLY ones that pass every check below — no bypass
# mode, matching the milestone's "tight matching rules" requirement:
#   - providerRegex:      the CSR requestor's node name must match bex's own
#                          naming convention (every CAPD/CAPH machine name is
#                          "bex-<segment>(-<segment>)*", e.g. bex-tenant-0-fhk8x
#                          or bex-control-plane-abcde).
#   - allowedDnsNames: 1   exactly one DNS SAN — the node's own hostname.
#   - the DNS check (bypassDnsResolution: false; local bypasses it, w1/127):
#     the node's hostname must resolve, and every SAN IP must be one of the
#     addresses it resolves to. providerIpPrefixes stays open: a CAPH kubelet's
#     SANs carry its public ExternalIP beside its 10.10.0.0/16 InternalIP (prod
#     CSRs read 2026-10-15), so no private-network prefix fits (w1/128).
#   - ignoreNonSystemNode and bypassHostnameCheck stay false (chart defaults).
#   - skipDenyStep: true, for prod (w1/129). There CAPH approves kubelet-serving
#     CSRs itself (cluster-api-provider-hetzner v1.1.7): it checks every SAN
#     against the HCloudMachine's addresses and Denies a CSR that fails. This
#     approver cannot approve in prod, since node names do not resolve in
#     cluster DNS, and with the deny step on it raced CAPH to deny every
#     6-hourly rotation (385 denials in the week to 2026-10-15, all lost so
#     far). Skipping the deny leaves those CSRs to CAPH, which still actively
#     Denies a non-conforming one. The local overlay has no CAPH, so it keeps
#     skipDenyStep false and Denies non-conforming CSRs itself.
# Verified (2026-08-19, isolated kind cluster): a CSR for a matching node name
# is Approved,Issued; an impersonated `system:node:evilname` kubelet-serving
# CSR is Denied with "SAN DNS name ... not allowed by the Cloud provider regex".
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubelet-csr-approver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: bex-platform
  source:
    repoURL: oci://ghcr.io/bex-co/bex-charts/kubelet-csr-approver
    path: .
    targetRevision: "sha256:d0ea7b27130119945df86d834c0074147d17055549699cef9be92f02de71187e"
    helm:
      values: |
        providerRegex: '^bex(-[a-z0-9]+)+$'
        allowedDnsNames: 1
        ignoreNonSystemNode: false
        skipDenyStep: true
        bypassDnsResolution: false
        bypassHostnameCheck: false
        # w1/m19 t003: platform pool, same as metrics-server.
        nodeSelector:
          bex.co/pool: platform
        tolerations:
          - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
