# log-shipper — the DaemonSet that tails the two log streams bex serves into Loki
# (loki.yaml). One replica per node discovers pods via the Kubernetes API and
# ships:
#
#   type=app     — tenant App pod logs (label app.bex.co/app), labelled
#                  namespace/app/pod/container + `level` (parsed from JSON lines).
#   type=request — Traefik's access log (traefik.values.yaml `logs.access`),
#                  attributed back to the App via the access line's ServiceName
#                  and labelled method/status.
#
# These are exactly the labels bex-api's LogQL selects on (see lokiSelectorFor /
# docs/ADR010-observability.md § Log labels), and both push to /loki/api/v1/push.
#
# CARDINALITY BUDGET (docs/ADR010-observability.md § Log labels) — a label is a
# Loki stream, so only BOUNDED fields become labels:
#   labels:    namespace, app, type, pod, container, level (≤5), method (≤8), status (≤~15)
#   line-only: path, host  — unbounded per request; filtered at query time with
#              LogQL's `| json` over the access line, never promoted to a label.
# Worst case ≈ replicas×levels + methods×statuses streams per App (low hundreds);
# typically under 20. Raising `path` to a label would be a cardinality incident.
#
# Shipper choice — Grafana Alloy, not Promtail: Promtail reached end-of-life
# (Grafana's supported successor is Alloy), so a new install ships on Alloy. And
# within Alloy the API-based `loki.source.kubernetes` is the simplest *static*
# config — it reads the pod-log API directly, with no host-path mounts or
# /var/log/pods file-glob templating a file-based tailer needs. The trade is a
# little more apiserver read load, acceptable at platform scale.
#
# NOTE (the cluster-specific knobs, like prometheus.yaml's): the App pod-label
# name (app.bex.co/app => Alloy meta key __meta_kubernetes_pod_label_app_bex_co_app),
# the tenant App namespace (`default` — BEX_API_NAMESPACE / BEX_CP_APPS_NAMESPACE,
# baked into the ServiceName regex below), and the Loki push URL. If any differs on
# a cluster, tune the relabel rules / stages / endpoint below. Confirm the pinned
# alloy chart line against the repo before a first real sync.
#
# NODE SCOPING (w3/m13): every Alloy replica runs as a DaemonSet pod, one per
# node. `loki.source.kubernetes` tails logs by opening an API log-follow stream
# per discovered pod — with NO node scope on `discovery.kubernetes "pods"`, each
# replica discovers and tails EVERY pod cluster-wide, so a line ships once per
# node (N×, N = node count), not once. Fed by `K8S_NODE_NAME` — a downward-API
# env var (fieldRef spec.nodeName) the alloy chart ALREADY injects into every
# replica unconditionally (containers/_agent.yaml, "Default used by some Alloy
# components"), so no extraEnv addition of our own is needed — the
# `selectors { field = "spec.nodeName=..." }` field selector on the shared pods
# discovery, below, reads it via sys.env() so each replica only ever sees pods
# scheduled on its own node — filtered server-side at the apiserver, not by a
# client-side relabel `keep` (cheaper: no wasted List/Watch bandwidth on other
# nodes' pods). This is the ONLY discovery.kubernetes block in this config —
# app_pods/build_pods/traefik discovery.relabel all read discovery.kubernetes.pods.targets,
# so scoping it once scopes every pipeline.
#
# HELM TPL ESCAPING (w3/m13, pre-existing since w3/m8): the whole
# alloy.configMap.content string below is run through Helm's `tpl` function at
# chart-render time (alloy/templates/configmap.yaml does `tpl $values.configMap.content .`),
# which eagerly evaluates every double-brace action it finds using Helm's own
# (Sprig) function map. The two `stage.template` blocks below use River's own
# templating syntax (double-brace actions, incl. a ToLower call) meant for
# Alloy's pipeline-stage template engine to evaluate later, at log-processing
# time — Helm's function map has no ToLower, so an unescaped double-brace
# action there makes `tpl` fail at chart-render time, which is a hard failure:
# Argo CD cannot generate a target manifest at all (ComparisonError), so
# selfHeal/prune can't act and the live ConfigMap silently freezes at whatever
# last rendered successfully. Confirmed this actually happened: prod's
# log-shipper Application was stuck in ComparisonError, its live ConfigMap
# frozen at a pre-w3/m8 version (no request-log pipeline, no level
# normalization) despite git holding the current config since w3/m8 landed.
# Fix: escape every double-brace-open as `{{ "{{" }}` and every double-brace-close
# as `{{ "}}" }}` — a self-evaluating Helm action that outputs the two literal
# characters, so Helm's parser never treats them as an action boundary; Alloy's
# own pipeline template engine (which does define ToLower) sees the real
# double-brace syntax once the ConfigMap is written. Verified via a standalone
# `helm template` round-trip: the escaped source renders back byte-for-byte to
# the original unescaped River template. IMPORTANT: this means NOTHING inside
# alloy.configMap.content may contain a raw double-brace pair (including in
# comments — an explanatory comment that shows the literal syntax hits the
# exact same `tpl` failure); describe the pattern in prose here at the file
# level instead, where `tpl` never reaches.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: log-shipper
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2" # after loki (loki.yaml, wave 1) accepts pushes
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: "1.*" # pin minor; the DaemonSet ships pod logs to Loki
    helm:
      releaseName: log-shipper
      values: |
        fullnameOverride: log-shipper
        controller:
          type: daemonset
          # w1/m19 t003: DaemonSet exception — must tail logs on EVERY node
          # (tenant pool, platform pool, control plane), so tolerate everything
          # and pin no pool.
          tolerations:
            - operator: Exists
        alloy:
          # Static River config: discover pods -> two pipelines (App logs, Traefik
          # access logs) -> label -> push.
          configMap:
            content: |-
              // Node-scoped: see the NODE SCOPING note at the top of this file.
              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
                }
              }

              // --- type=app: tenant App container logs ---

              discovery.relabel "app_pods" {
                targets = discovery.kubernetes.pods.targets

                // Ship only tenant App pods (they carry app.bex.co/app); drop the
                // rest so single-replica Loki holds just what bex-api can serve.
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_bex_co_app"]
                  regex         = ""
                  action        = "drop"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_bex_co_app"]
                  target_label  = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
              }

              loki.source.kubernetes "app_pods" {
                targets    = discovery.relabel.app_pods.output
                forward_to = [loki.process.app_logs.receiver]
              }

              // `level` on App logs, honestly: parsed from the line's own JSON
              // severity field, NEVER guessed from substring matching (a line
              // containing the word "error" is not an error). A non-JSON line —
              // or JSON without a severity key — is labelled `unknown`, which is
              // the truth: bex does not know. Tenants who want level=error to
              // isolate their errors log JSON (recommended, never required).
              loki.process "app_logs" {
                // Both spellings seen in the wild: `level` (slog/zap/logrus/bunyan
                // via "level", pino numeric aside) and `severity` (OTel/GCP).
                // A non-JSON line leaves both empty -> unknown, below.
                stage.json {
                  expressions = {
                    level    = "level",
                    severity = "severity",
                  }
                }

                // Normalize the vocabulary to Render's five buckets. Anything not
                // recognized collapses to `unknown` rather than minting an unbounded
                // label value per typo — the cardinality budget above holds because
                // this template can only ever emit those 5 values.
                stage.template {
                  source   = "level"
                  // Escaped for Helm's tpl pass — see the HELM TPL ESCAPING
                  // note at the top of this file for why.
                  template = "{{ "{{" }} $l := ToLower (or .Value .severity) {{ "}}" }}{{ "{{" }} if or (eq $l \"error\") (eq $l \"err\") (eq $l \"fatal\") (eq $l \"panic\") (eq $l \"critical\") (eq $l \"crit\") {{ "}}" }}error{{ "{{" }} else if or (eq $l \"warn\") (eq $l \"warning\") {{ "}}" }}warn{{ "{{" }} else if or (eq $l \"info\") (eq $l \"notice\") {{ "}}" }}info{{ "{{" }} else if or (eq $l \"debug\") (eq $l \"trace\") {{ "}}" }}debug{{ "{{" }} else {{ "}}" }}unknown{{ "{{" }} end {{ "}}" }}"
                }

                // The `unknown` bucket, and Render's type vocabulary (app | request
                // | build) so list_log_label_values(label="type") discovers real
                // values. These are DEFAULTS: they must precede stage.labels, which
                // overwrites `level` whenever the line actually carried one. A
                // plaintext line never reaches the template above (a stage whose
                // source key was never extracted is skipped), so `unknown` is what
                // it keeps — the honest answer, and the reason it is seeded here
                // rather than emitted there.
                stage.static_labels {
                  values = {
                    type  = "app",
                    level = "unknown",
                  }
                }

                stage.labels {
                  values = { level = "level" }
                }

                forward_to = [loki.write.default.receiver]
              }

              // --- type=build: build Job pod logs ---
              //
              // Build pods carry app.bex.co/component=build (set by the operator
              // on every build Job's pod template, w7/m28). The `app` label is
              // derived from app.bex.co/build (the service name), and `namespace`
              // from the pod's own namespace — overridden by app.bex.co/app-namespace
              // when the build Job runs in a separate BEX_BUILD_NAMESPACE so the
              // stream lands under the App's namespace, not the build namespace.

              discovery.relabel "build_pods" {
                targets = discovery.kubernetes.pods.targets

                // Keep only build Job pods.
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_bex_co_component"]
                  regex         = "build"
                  action        = "keep"
                }
                // Default: use the pod's actual namespace.
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                // Override with the App's namespace when the build namespace
                // differs (BEX_BUILD_NAMESPACE != App namespace); absent = same,
                // no override needed. The regex (.+) skips empty/absent labels.
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_bex_co_app_namespace"]
                  regex         = "(.+)"
                  target_label  = "namespace"
                  replacement   = "$1"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_bex_co_build"]
                  target_label  = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
              }

              loki.source.kubernetes "build_pods" {
                targets    = discovery.relabel.build_pods.output
                forward_to = [loki.process.build_logs.receiver]
              }

              loki.process "build_logs" {
                // Drop pods that somehow lack a build label (defensive guard).
                stage.drop {
                  source              = "app"
                  expression          = "^$"
                  drop_counter_reason = "not_a_build_pod"
                }
                stage.static_labels {
                  values = { type = "build" }
                }
                forward_to = [loki.write.default.receiver]
              }

              // --- type=request: Traefik access logs ---

              discovery.relabel "traefik" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  separator     = "/"
                  regex         = "traefik/traefik"
                  action        = "keep"
                }
                // The ONLY label promoted here, and it never reaches Loki
                // (stage.label_drop, below). It exists because `stage.match`'s
                // selector reads an entry's INCOMING labels — the ones set by the
                // source — and cannot see labels a pipeline stage added; without a
                // label to select on, the access-line filter below could not run.
                // The edge pod's own namespace/pod are deliberately NOT promoted:
                // they are Traefik's, not the App's, and every label on a request
                // stream is derived from the access line itself.
                rule {
                  target_label = "job"
                  replacement  = "traefik"
                }
              }

              loki.source.kubernetes "traefik" {
                targets    = discovery.relabel.traefik.output
                forward_to = [loki.process.request_logs.receiver]
              }

              loki.process "request_logs" {
                // Traefik's stdout mixes its own operational logs (plain text) with
                // the JSON access log; only access lines carry ServiceName. Drop the
                // rest — bex serves App logs, not the edge proxy's. This is a LINE
                // filter (LogQL `!=` — "does not contain"), deliberately NOT a drop
                // on an extracted field: a stage keyed on extracted data is skipped
                // entirely for a line the JSON stage could not parse, so Traefik's
                // plaintext operational lines would sail straight through it.
                stage.match {
                  selector            = "{job=\"traefik\"} != \"ServiceName\""
                  action              = "drop"
                  drop_counter_reason = "not_an_access_line"
                }

                stage.json {
                  expressions = {
                    service = "ServiceName",
                    method  = "RequestMethod",
                    status  = "DownstreamStatus",
                  }
                }

                // App attribution: Traefik names an Ingress-backed service
                // `<namespace>-<app>-<port>@kubernetes`, and the operator names the
                // k8s Service after the App (app_controller.go), so the middle
                // segment IS the App name. `default` is the tenant App namespace
                // (see NOTE above) — the one knob to change if that moves. The
                // greedy `.+` claims every hyphen but the port's, so `hello-go`
                // survives intact.
                stage.regex {
                  source     = "service"
                  expression = "^(?P<namespace>default)-(?P<app>.+)-\\d+@kubernetes$"
                }
                // A service that doesn't match (a non-App Ingress at the edge — the
                // dashboard, bex-api itself) has no App to attribute to: drop it
                // rather than invent one. The regex leaves `app` NIL on a miss, and
                // a nil renders as the literal "<no value>" — so normalize to the
                // empty string first, then drop on it. (`{{ .Value }}` alone would
                // emit "<no value>" and sail straight past the drop below.)
                stage.template {
                  source   = "app"
                  // Escaped for Helm's tpl pass — see the HELM TPL ESCAPING
                  // note at the top of this file for why.
                  template = "{{ "{{" }} if .Value {{ "}}" }}{{ "{{" }} .Value {{ "}}" }}{{ "{{" }} end {{ "}}" }}"
                }
                stage.drop {
                  source              = "app"
                  expression          = "^$"
                  drop_counter_reason = "not_a_tenant_app"
                }

                stage.labels {
                  values = {
                    namespace = "namespace",
                    app       = "app",
                    method    = "method",
                    status    = "status",
                  }
                }
                stage.static_labels {
                  values = { type = "request" }
                }
                // `job` was scaffolding for the match stage above — it is not part
                // of the label taxonomy and must not become a stream.
                stage.label_drop {
                  values = ["job"]
                }

                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
                }
              }
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { cpu: 200m, memory: 256Mi }
        # No bundled ServiceMonitor / self-metrics scrape — keep the shipper thin.
        serviceMonitor: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
