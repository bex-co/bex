# Cluster API + CAPH provider — the node-provisioning ENGINE. Post-pivot
# (w1/m19 t007) the controllers run IN THIS CLUSTER (self-managed: the cluster
# reconciles its own Cluster/MachineDeployment objects after `clusterctl move`).
#
# Deliberately still installed/upgraded by `clusterctl init` (t007 runbook /
# app-cluster.yml), NOT by an Argo Application: clusterctl owns the provider
# lifecycle (CRD upgrades, cert-manager dependency ordering, provider version
# contracts), and wrapping its generated manifests in Argo would make two
# owners fight over them. Revisit only via the cluster-api-operator chart if
# GitOps-managed provider upgrades ever become worth that migration.
#
# The DESIRED infrastructure (Cluster/MachineDeployments) stays declarative in
# infra/clusterapi/overlays/hetzner-caph/cluster.yaml, applied by
# app-cluster.yml — engine = clusterctl, desired state = git + CI, scaling =
# autoscaler.yaml (in-cluster, Argo-managed).
