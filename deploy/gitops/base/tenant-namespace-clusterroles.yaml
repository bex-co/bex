# Per-tenant namespace RBAC (ADR043, w3/m31 t003). These ClusterRoles carry the
# SAME verbs the shared-namespace Roles (bex-api-apps / operator-apps /
# bex-ssh-apps) grant in `default`, but as ClusterRoles they can be bound
# per-namespace: the NamespaceReconciler (internal/store/namespaces.go) stamps a
# RoleBinding into each `<ws>` (and `<ws>-sandbox`) namespace it provisions, so a
# service account's access — including Secret access — exists ONLY inside the
# tenant namespaces, never cluster-wide. This preserves the deliberate
# least-privilege decision in operator-apps-rbac.yaml (the manager ClusterRole
# omits Secrets so a compromised operator cannot read platform credentials).
#
# A ClusterRole grants nothing on its own — it is inert until a RoleBinding
# references it. The NamespaceReconciler stamps those RoleBindings
# unconditionally whenever the control-plane store is wired (BEX_CP_DB_URI) —
# the transitional BEX_TENANT_NAMESPACES gate was retired in w3/m34.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bex-tenant-operator
rules:
  - apiGroups: [""]
    resources: ["secrets", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bex-tenant-api
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bex-tenant-ssh-gateway
rules:
  - apiGroups: ["app.bex.co"]
    resources: ["apps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
# The OpenSandbox lifecycle server (m32 t002, opensandbox-system) drives
# BatchSandboxes and the pods/services/configmaps/PVCs they spawn INSIDE each
# workspace's `<ws>-sandbox` namespace. The NamespaceReconciler binds this to the
# server's ServiceAccount per-`<ws>-sandbox` (RegimeSandbox), so the server's
# write authority is confined to tenant sandbox namespaces — never cluster-wide
# (ADR042 D4 / m32 t006). No Secrets grant: sandbox pods carry no tenant creds.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bex-tenant-sandbox-server
rules:
  - apiGroups: ["sandbox.opensandbox.io"]
    resources: ["batchsandboxes", "pools", "sandboxsnapshots"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
# The OpenSandbox controller watches cluster-wide through the vendored chart's
# read-only informer ClusterRole. Its reconciliation writes are separately bound
# into each provisioned sandbox namespace, containing a controller exploit to
# the same namespace set the lifecycle server is allowed to drive. Snapshot
# registry credential flags are deliberately unset. This role is never bound in
# credential-bearing opensandbox-system: Pod creation there would implicitly
# permit mounting Secrets even without a direct Secrets RBAC verb.
# Sandbox hibernation resume-pull minting (w3/m42 t002, ADR042 D5): the
# operator's SandboxNamespaceRegistryReconciler creates the per-workspace
# `bex-snapshot-pull` dockerconfigjson Secret in each sandbox namespace (the
# OpenSandbox controller's --resume-pull-secret reference). get+create only —
# rotation or repair is a deliberate future extension, and the grant exists
# solely through per-sandbox-namespace RoleBindings (never cluster-wide).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bex-operator-snapshot-pull
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bex-tenant-sandbox-controller
rules:
  - apiGroups: [""]
    resources: ["events", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["sandbox.opensandbox.io"]
    resources: ["batchsandboxes", "pools", "sandboxsnapshots"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["sandbox.opensandbox.io"]
    resources: ["batchsandboxes/finalizers", "pools/finalizers", "sandboxsnapshots/finalizers"]
    verbs: ["update"]
  - apiGroups: ["sandbox.opensandbox.io"]
    resources: ["batchsandboxes/status", "pools/status", "sandboxsnapshots/status"]
    verbs: ["get", "update", "patch"]
