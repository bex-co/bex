# Encrypted StorageClass for persistent service disks
# (docs/ADR082-persistent-disks.md D3).
#
# Render encrypts both disks and their snapshots at rest, so bex's parity claim
# needs the volume encrypted too. Hetzner Cloud volumes are not encrypted by the
# provider, but the hcloud CSI driver can put LUKS underneath the filesystem
# when the class names a passphrase Secret.
#
# The App controller mints one passphrase per disk — Secret "<pvc-name>-luks",
# key "encryption-passphrase", in the App's own namespace, created once and
# never rewritten (rewriting it would lock the tenant out of their own volume).
# The ${pvc.*} variables below are external-provisioner's secret templating,
# which is what turns the class's single fixed reference into a per-disk one; a
# shared platform-wide passphrase would mean one compromised key unlocks every
# tenant's disk.
#
# NOT YET THE DEFAULT. The operator selects a class through
# BEX_DISK_STORAGE_CLASS, which ships unset — disks then use the cluster's
# default class (hcloud-volumes in production, local-path on the CAPD mock).
# Two prerequisites must be verified on a live cluster before pointing the
# operator at this class, because getting either wrong makes every disk fail to
# mount rather than fail to encrypt:
#
#   1. cryptsetup must be present on the CAPH node image — the CSI node plugin
#      shells out to it to open the LUKS device.
#   2. The hcloud-csi node ServiceAccount must be able to read Secrets in tenant
#      namespaces, since that is where the per-disk passphrase lives.
#
# Track that verification before flipping the env var; until then the class is
# an inert, unreferenced object.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hcloud-volumes-luks
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
provisioner: csi.hetzner.cloud
reclaimPolicy: Delete
# WaitForFirstConsumer binds the volume in the location of the node the pod is
# actually scheduled to. A Hetzner volume can only attach to a server in its own
# location, so binding earlier risks a volume the pod can never reach.
volumeBindingMode: WaitForFirstConsumer
# Grow-only expansion is the whole resize story for disks; without this the
# operator's grow path blocks with StorageClassNotExpandable.
allowVolumeExpansion: true
parameters:
  csi.storage.k8s.io/node-publish-secret-name: ${pvc.name}-luks
  csi.storage.k8s.io/node-publish-secret-namespace: ${pvc.namespace}
