# Encrypted StorageClass for persistent service disks
# (docs/ADR082-persistent-disks.md D3).
#
# Render encrypts both disks and their snapshots at rest, so bex's parity claim
# needs the volume encrypted too. Hetzner Cloud volumes are not encrypted by the
# provider, but the hcloud CSI driver can put LUKS underneath the filesystem
# when the class names a passphrase Secret.
#
# The App controller mints one passphrase per disk — Secret "<pvc-name>-luks",
# key "encryption-passphrase", in the App's own namespace, created once and
# never rewritten (rewriting it would lock the tenant out of their own volume).
# The ${pvc.*} variables below are external-provisioner's secret templating,
# which is what turns the class's single fixed reference into a per-disk one; a
# shared platform-wide passphrase would mean one compromised key unlocks every
# tenant's disk.
#
# LIVE IN PRODUCTION since w2/m86: the prod operator overlay
# (lego/operator/config/prod/kustomization.yaml) sets BEX_DISK_STORAGE_CLASS to
# this class, so every disk created after that flip is LUKS-encrypted. The CAPD
# mock leaves the env unset (this class cannot exist without the hcloud CSI
# driver) and keeps its default local-path class. Disks created before the flip
# stay on hcloud-volumes — a claim's class is immutable.
#
# The two prerequisites this file used to gate the flip on were both verified
# live on production, 2026-09-02 (evidence: .pm/w2/m86), and both resolve in
# the platform's favor:
#
#   1. cryptsetup ships INSIDE the hcloud-csi-driver v2.22.0 image (alpine
#      apk: cryptsetup 2.8.6, confirmed in the running node plugin) — the CAPH
#      node image needs nothing. The driver formats LUKS1 and resizes the open
#      mapping without re-authentication; the drill observed a 10→11Gi grow
#      apply online (mapping + ext4, pod running), though finish-on-restart
#      remains the documented contract (ADR082 D4 — the maintainers do not
#      claim online expansion).
#   2. The per-disk passphrase Secret is fetched by the KUBELET, not the CSI
#      ServiceAccount: external-provisioner templates ${pvc.name}-luks into
#      the PV's nodePublishSecretRef, and the kubelet reads it under the node
#      authorizer. No tenant-namespace RBAC grant exists or is needed.
#
# The ${pvc.name}-luks template below is a CONTRACT with the operator's Secret
# naming: appv1alpha1.DiskLUKSSecretName is defined as DiskPVCName + "-luks"
# precisely so the kubelet's lookup and the minted Secret can never diverge
# (they did, for App names ≥54 chars, until w2/m86 fixed the derivation).
# scripts/gitops-validate.sh pins both template parameters and the prod env
# agreement.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hcloud-volumes-luks
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
provisioner: csi.hetzner.cloud
reclaimPolicy: Delete
# WaitForFirstConsumer binds the volume in the location of the node the pod is
# actually scheduled to. A Hetzner volume can only attach to a server in its own
# location, so binding earlier risks a volume the pod can never reach.
volumeBindingMode: WaitForFirstConsumer
# Grow-only expansion is the whole resize story for disks; without this the
# operator's grow path blocks with StorageClassNotExpandable.
allowVolumeExpansion: true
parameters:
  csi.storage.k8s.io/node-publish-secret-name: ${pvc.name}-luks
  csi.storage.k8s.io/node-publish-secret-namespace: ${pvc.namespace}
