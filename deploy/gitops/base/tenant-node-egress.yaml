# Platform-side tenant→node/metadata egress deny (docs/ADR022-tenant-isolation.md
# §node-and-metadata-egress). Closes two paths the portable per-App k8s
# NetworkPolicy (app_controller.go reconcileNetworkPolicy) cannot express:
#
#   1. The node's own IPs — kubelet :10250 and any nodePort on the node's
#      public interface. A k8s NetworkPolicy ipBlock can't name "the nodes":
#      their public IPs aren't a contiguous owned CIDR and rotate with the
#      autoscaler. Cilium models them as the `host` (the local node) and
#      `remote-node` (every other node) identities.
#   2. Link-local 169.254.0.0/16 — the cloud instance-metadata service
#      (169.254.169.254 on Hetzner: instance identity + cloud-init user-data,
#      a classic SSRF → metadata-theft target). Denied here too so the block
#      holds even if the per-App policy's Except list regresses.
#
# Mechanism: a Cilium-native CiliumNetworkPolicy `egressDeny`. Deny rules take
# precedence over any allow (including the per-App policy's 0.0.0.0/0 egress)
# and select the endpoint into egress default-deny. The operator-managed per-App
# policy supplies each tenant's ordinary DNS, same-workspace, and genuine-
# internet allows. Those policies stay portable vanilla networking.k8s.io/v1
# (envtest can validate them); only this cluster-wide node/metadata guard is
# Cilium-native, which is acceptable because Cilium is the CNI on every bex
# cluster (docs/ADR022-tenant-isolation.md §policy-dialect).
#
# Scope: every workspace-labeled tenant pod (app.bex.co/workspace present), in
# whatever namespace tenant Apps project into. Platform pods carry no workspace
# label and are unaffected. A CiliumNetworkPolicy (namespaced) selects only
# pods in its own namespace, so this lives in the apps namespace (default /
# BEX_CP_APPS_NAMESPACE).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-tenant-node-and-metadata-egress
  namespace: default
spec:
  endpointSelector:
    matchExpressions:
      - key: app.bex.co/workspace
        operator: Exists
      # Exclude CNPG-managed pods (cnpg.io/cluster label) from this deny so
      # CNPG init/instance pods can reach the Kubernetes API (10.96.0.1:443).
      # The workspace label is still propagated to CNPG pods for same-workspace
      # NetworkPolicy selectors — removing the label would break that; instead
      # we carve CNPG pods out of the deny using their own identity label.
      # Deny-overrides-allow means a separate allow rule cannot fix this —
      # the selector itself must exclude the CNPG identity (w7/m33).
      - key: cnpg.io/cluster
        operator: DoesNotExist
  egressDeny:
    # The nodes themselves: local node (host) + every other node (remote-node).
    # Covers kubelet :10250 and nodePorts reached via any node IP.
    - toEntities:
        - host
        - remote-node
    # Cloud instance-metadata / link-local range.
    - toCIDR:
        - 169.254.0.0/16
---
# Label-independent metadata guard (w1/m53). The policy above selects only
# workspace-labeled pods, so a hand-applied App CR with no workspace label (which
# the operator's reconcileNetworkPolicy leaves un-isolated) could still reach the
# cloud-metadata endpoint. This denies the link-local/metadata range for EVERY
# pod in the apps namespace, so metadata isolation no longer depends on the label.
# It denies ONLY 169.254.0.0/16 (which no legitimate pod needs), but selecting
# every endpoint also enables Cilium egress policy enforcement. Tenant Apps get
# their ordinary allows from the per-App policy; platform identities in this
# namespace need a narrow explicit allow such as the autoscaler rule below. The
# node/remote-node deny stays scoped to labeled tenants above, since platform
# pods may legitimately talk to node IPs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-metadata-egress-all-pods
  namespace: default
spec:
  endpointSelector: {}
  egressDeny:
    - toCIDR:
        - 169.254.0.0/16
---
# The namespace-wide metadata deny above enables egress policy enforcement on
# every selected Cilium endpoint. Tenant Apps get their ordinary allow-list from
# the operator-managed Kubernetes NetworkPolicy, but the platform autoscaler in
# this namespace has no App policy. Give only that identity the one destination
# it needs: the Kubernetes API used to observe Pending Pods and resize CAPI
# MachineDeployments. `kube-apiserver` follows the API endpoints without opening
# node, metadata, DNS, or public-network egress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cluster-autoscaler-kube-apiserver
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: cluster-autoscaler
  egress:
    - toEntities:
        - kube-apiserver
