# Sealed Secrets — encrypt PLATFORM/infra credentials at rest so they can live in
# git instead of being applied imperatively from CI secrets (w1/m7 t003). The
# controller holds an asymmetric key pair; `kubeseal` (scripts/seal-secret.sh)
# encrypts a Secret with the public key into a SealedSecret manifest that is safe
# to commit — only THIS cluster's controller can decrypt it, and only into the
# exact namespace/name it was sealed for. Argo then reconciles the SealedSecret;
# the controller unseals it into the real Secret.
#
# Scope: this is for bex's own STATIC, bex-operated secrets — the Hetzner API
# token, the Argo repo deploy key, the GHCR pull secret, the etcd-backup /
# openbao-backup S3 creds. TENANT credentials are a different concern entirely,
# handled by OpenBao (docs/secrets.md), not this.
#
# sync-wave "0": foundational — the controller must be up before any SealedSecret
# it decrypts is synced. Runbook + which creds to seal: docs/sealed-secrets.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    # Repo moved bitnami-labs → bitnami org 2026 (the old bitnami-labs.github.io URL
    # now 404s, which left this Argo app SYNC=Unknown / controller not installed).
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: "2.19.1" # controller v0.38.4; pin exact for reproducibility
    helm:
      releaseName: sealed-secrets
      values: |
        # kubeseal's default controller lookup is name `sealed-secrets` in the
        # controller's namespace — install into kube-system and keep that name so
        # `kubeseal --controller-namespace kube-system --controller-name sealed-secrets`
        # (scripts/seal-secret.sh) resolves the public cert without extra config.
        fullnameOverride: sealed-secrets
        # The sealing key is the one piece of DR-critical state this controller owns;
        # back it up out-of-band the first time (docs/sealed-secrets.md), because a
        # lost key means every committed SealedSecret is unrecoverable.
        resources:
          requests: { cpu: 25m, memory: 32Mi }
          limits: { cpu: 100m, memory: 128Mi }
        # w1/m19 t003: platform pool
        nodeSelector:
          bex.co/pool: platform
        tolerations:
          - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
