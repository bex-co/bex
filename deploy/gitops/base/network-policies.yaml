# Platform-side tenant isolation: ingress NetworkPolicies for each platform
# namespace (docs/ADR022-tenant-isolation.md §platform-side-lockdown). Together with
# the per-App NetworkPolicies the operator creates (t003), these provide
# defense-in-depth: even if a tenant-side policy regresses, platform services
# refuse traffic from the tenant apps namespace.
#
# Each policy sets policyTypes: [Ingress] so the namespace gets default-deny
# ingress and ONLY the listed sources can reach it. Legitimate callers are
# enumerated per namespace; the tenant apps namespace (default / BEX_CP_APPS_NAMESPACE)
# is implicitly blocked because it is not in any allow list.
#
# Build pods (app.bex.co/component: build) run in the apps namespace too.
# They are explicitly allowed to reach bex-registry (push) — their label
# distinguishes them from tenant app pods.

---
# bex-system: operator + bex-api
# Allowed: bex-system itself (internal), traefik (HTTP to bex-api :8090),
#   and monitoring (Prometheus scrape of bex-api metrics). The narrower policy
#   below admits CNPG control traffic only to bex-db pods.
# Blocked: tenant pods in the apps namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-tenant-ingress
  namespace: bex-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bex-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring

---
# CNPG's operator talks to each instance manager on TCP 8000 to observe status
# and coordinate replica creation/switchovers. Keep this exception scoped to
# bex-db pods instead of opening every bex-system workload to cnpg-system.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-bex-db-management
  namespace: bex-system
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: bex-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000

---
# The dashboard's SSR fetches bex-api in-cluster (VITE_SSR_API_URL =
# bex-api.bex-system.svc:8090, docs/ADR012-auth.md + dashboard/CLAUDE.md) and
# the m52 readiness latch probes the same origin before a fresh pod takes
# traffic. deny-tenant-ingress above only admits bex-system/traefik/monitoring,
# which silently forced every prod SSR data fetch onto the error path until
# w1/m52's closeout surfaced it. Scoped to the bex-api pods on their HTTP
# container port — the dashboard gets no path to anything else in bex-system.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dashboard-ssr-to-bex-api
  namespace: bex-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bex-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dashboard
      ports:
        - protocol: TCP
          port: 8090

---
# bex-registry: zot OCI registry on :5000
# Allowed: bex-system (operator triggers builds, not push; nodes pull directly),
#   build pods in the apps namespace (push after in-cluster BuildKit build),
#   and the NODES themselves via the CiliumNetworkPolicy below.
# Blocked: tenant app pods in the apps namespace (they must not push/pull directly).
# Auth complements this (w7/m8): even a build pod — inside this allow-list, running
# tenant Dockerfile RUN steps — must now present the bex-builder credential to push
# and bex-puller to pull; anonymous catalog/pull/push are 401. docs/ADR022-tenant-isolation.md
# § Registry access control.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-tenant-ingress
  namespace: bex-registry
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bex-system
    # kpack's controller imports buildpacks and composes the ClusterBuilder in
    # Zot; per-App build pods themselves run in bex-system (or match the build
    # label rule below).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kpack
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.bex.co/component: build

---
# Kubelet image pulls reach zot FROM THE NODE (host/remote-node identity, not a
# pod IP), and under Cilium a k8s-NetworkPolicy ipBlock can never match node
# traffic (CIDR rules apply to world/external only). Without this additive
# Cilium policy, every deploy of a git-built image dies in ImagePullBackOff —
# found live on prod 2026-07-12 backfilling beancount-cms/eden-cms-v2. Tenant
# pod isolation is unaffected: pods keep matching the k8s policy above.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-node-image-pulls
  namespace: bex-registry
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - host
        - remote-node

---
# secrets: OpenBao on :8200
# Allowed: bex-system (bex-api uses k8s-auth to fetch tenant env-vars).
# Blocked: tenant pods in the apps namespace (auth-scoped, but defense-in-depth).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-tenant-ingress
  namespace: secrets
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bex-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: secrets

---
# monitoring: Prometheus
# Allowed: monitoring itself (internal Alertmanager / Grafana),
#   bex-system (bex-api queries Prometheus for request + resource metrics via BEX_PROM_URL).
# Blocked: tenant pods (they must not scrape cross-tenant metrics).
# Note: Prometheus scrapes targets in OTHER namespaces by design — that is
# egress from monitoring, not ingress to it; this policy does not restrict it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-tenant-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bex-system
