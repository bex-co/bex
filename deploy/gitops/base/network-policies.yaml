# Platform-side tenant isolation: ingress NetworkPolicies for each platform
# namespace (docs/ADR022-tenant-isolation.md §platform-side-lockdown). Together with
# the per-App NetworkPolicies the operator creates (t003), these provide
# defense-in-depth: even if a tenant-side policy regresses, platform services
# refuse traffic from the tenant apps namespace.
#
# Each policy sets policyTypes: [Ingress] so the namespace gets default-deny
# ingress and ONLY the listed sources can reach it. Legitimate callers are
# enumerated per namespace; the tenant apps namespace (default / BEX_CP_APPS_NAMESPACE)
# is implicitly blocked because it is not in any allow list.
#
# Tenant-controlled build/publish execution runs only in the dedicated
# bex-build namespace; pre-deploy Jobs run co-located with their App (ADR043 D8).

---
# auth: Hydra, Kratos, OpenFGA, and their CNPG databases. The admin APIs have no
# ingress, but lack application-layer authentication; make the network boundary
# explicit instead of trusting that every cluster-internal workload is benign.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-auth-ingress
  namespace: auth
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Identity components and their migration Jobs communicate internally.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth

---
# Only bex-api administers/introspects identities and authorization; the SSH
# gateway needs OpenFGA only. Ports are the pods' target ports (Kratos public /
# admin are 4433/4434 even though their Services expose 80).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-bex-auth-clients
  namespace: auth
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bex-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: bex-api
      ports:
        - { protocol: TCP, port: 4433 }
        - { protocol: TCP, port: 4434 }
        - { protocol: TCP, port: 4445 }
        - { protocol: TCP, port: 8080 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bex-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: bex-ssh-gateway
      ports:
        - { protocol: TCP, port: 8080 }
    # Dashboard SSR talks to Kratos public; its OAuth consent/device routes talk
    # to Hydra admin. It has no path to either product's admin sibling.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dashboard
          podSelector:
            matchLabels:
              app.kubernetes.io/name: bex-dashboard
      ports:
        - { protocol: TCP, port: 4433 }
        - { protocol: TCP, port: 4445 }

---
# Public Hydra/Kratos traffic reaches only their public container ports through
# Traefik. Neither admin port is admitted from the edge namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-auth-public-edge
  namespace: auth
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - { protocol: TCP, port: 4433 }
        - { protocol: TCP, port: 4444 }

---
# CNPG observes the three auth database instance managers on 8000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-auth-db-management
  namespace: auth
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: In
        values: [hydra-db, kratos-db, openfga-db]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000

---
# Prometheus scrapes only the CNPG SQL-exporter port used for platform backup
# freshness. This does not expose Postgres (5432) or any identity admin API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-auth-db-metrics
  namespace: auth
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: In
        values: [hydra-db, kratos-db, openfga-db]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187

---
# bex-system: operator + bex-api
# Allowed: bex-system itself (internal), traefik (HTTP to bex-api :8090),
#   and monitoring (Prometheus scrape of bex-api metrics). The narrower policy
#   below admits CNPG control traffic only to bex-db pods.
# Blocked: tenant pods in the apps namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-tenant-ingress
  namespace: bex-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bex-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring

---
# CNPG's operator talks to each instance manager on TCP 8000 to observe status
# and coordinate replica creation/switchovers. Keep this exception scoped to
# bex-db pods instead of opening every bex-system workload to cnpg-system.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-bex-db-management
  namespace: bex-system
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: bex-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000

---
# The dashboard's SSR fetches bex-api in-cluster (VITE_SSR_API_URL =
# bex-api.bex-system.svc:8090, docs/ADR012-auth.md + dashboard/CLAUDE.md) and
# the m52 readiness latch probes the same origin before a fresh pod takes
# traffic. deny-tenant-ingress above only admits bex-system/traefik/monitoring,
# which silently forced every prod SSR data fetch onto the error path until
# w1/m52's closeout surfaced it. Scoped to the bex-api pods on their HTTP
# container port — the dashboard gets no path to anything else in bex-system.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dashboard-ssr-to-bex-api
  namespace: bex-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bex-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dashboard
      ports:
        - protocol: TCP
          port: 8090

---
# allow-opensandbox-to-cp-api (m32 t006): the OpenSandbox lifecycle server's HTTP
# tenant provider calls bex-api's control-plane endpoint (:8091
# /v1/sandbox-tenants) to resolve each OPEN-SANDBOX-API-KEY to its `<ws>-sandbox`
# namespace. deny-tenant-ingress only admits bex-system/traefik/monitoring on
# bex-api, so without this the tenant lookup times out and every sandbox op fails
# TENANT_PROVIDER_UNAVAILABLE. Scoped tightly: only the opensandbox-server pod in
# opensandbox-system, only the CP port. It does NOT open :8090 (the public API)
# to the sandbox server — only the bearer-gated CP lookup.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-opensandbox-to-cp-api
  namespace: bex-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bex-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opensandbox-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opensandbox-server
      ports:
        - protocol: TCP
          port: 8091

---
# allow-ssh-gateway-to-cp-api (ADR047 D2, w3/m43): the isolated gateway's
# git-credential broker HMAC-proxies a scoped GitHub-token mint to bex-api's
# internal control-plane API (:8091, InternalMintPath). deny-tenant-ingress
# default-denies bex-api ingress, so without this the gateway's mint call is
# refused and every agent-session clone dies with a 502 broker error. Scoped
# tightly: only the bex-ssh-gateway pod, only the CP port — it does NOT open the
# public :8090.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ssh-gateway-to-cp-api
  namespace: bex-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bex-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bex-ssh-gateway
      ports:
        - protocol: TCP
          port: 8091

---
# allow-dashboard-consent-to-cp-api (w5/m86, docs/ADR087-platform-observability-ui.md §4):
# the dashboard's consent acceptor resolves an ops-gated OIDC client's subject
# role via bex-api's cluster-internal ops-role verb (:8091, GET
# /internal/ops-role) before any accept. allow-dashboard-ssr-to-bex-api above
# only opens :8090, so without this the gate's lookup times out and every obs
# login is rejected fail-closed — correct but useless. Scoped tightly: only the
# dashboard namespace, only the CP port; the public :8090 grant stays separate.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dashboard-consent-to-cp-api
  namespace: bex-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bex-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dashboard
      ports:
        - protocol: TCP
          port: 8091

---
# bex-registry: zot OCI registry on :5000
# Allowed: bex-system (operator registry administration), bex-build (scoped
#   build/publish registry access),
#   and the NODES themselves via the CiliumNetworkPolicy below.
# Blocked: tenant app pods in the apps namespace (they must not push/pull directly).
# Auth complements this: anonymous catalog/pull/push are denied; the bootstrap
# bex-builder credential manages registry state, while each App receives a
# repository-scoped credential for the post-BuildKit Skopeo push/Cosign and
# runtime pull. Dockerfile RUN steps receive neither credential. See
# docs/ADR022-tenant-isolation.md § Registry access control.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-tenant-ingress
  namespace: bex-registry
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bex-system
    # kpack's controller imports buildpacks and composes the ClusterBuilder in
    # Zot; per-App build pods run in bex-build.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kpack
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bex-build
    # Sandbox snapshot commit Jobs (w3/m42, ADR042 D5) push rootfs snapshot
    # images from the dedicated privileged namespace; tenant sandbox pods
    # themselves stay blocked (they live in `<ws>-sandbox`, not here).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opensandbox-snapshot

---
# Kubelet image pulls reach zot FROM THE NODE (host/remote-node identity, not a
# pod IP), and under Cilium a k8s-NetworkPolicy ipBlock can never match node
# traffic (CIDR rules apply to world/external only). Without this additive
# Cilium policy, every deploy of a git-built image dies in ImagePullBackOff —
# found live on prod 2026-07-12 backfilling beancount-cms/eden-cms-v2. Tenant
# pod isolation is unaffected: pods keep matching the k8s policy above.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-node-image-pulls
  namespace: bex-registry
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - host
        - remote-node

---
# secrets: OpenBao on :8200
# Allowed: bex-system (bex-api uses k8s-auth to fetch tenant env-vars).
# Blocked: tenant pods in the apps namespace (auth-scoped, but defense-in-depth).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-tenant-ingress
  namespace: secrets
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bex-system
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: secrets

---
# monitoring: Prometheus
# Allowed: monitoring itself (internal Alertmanager / Grafana),
#   bex-system (bex-api queries Prometheus for request + resource metrics via BEX_PROM_URL).
# Blocked: tenant pods (they must not scrape cross-tenant metrics).
# Note: Prometheus scrapes targets in OTHER namespaces by design — that is
# egress from monitoring, not ingress to it; this policy does not restrict it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-tenant-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bex-system

---
# The observability portal is the ONLY monitoring pod the edge may reach:
# obs.bex.co (prod overlay) terminates at Traefik, which forwards to the
# Grafana pod on :3000 (docs/ADR087-platform-observability-ui.md). Additive to
# deny-tenant-ingress above, and the same shape as auth's
# allow-auth-public-edge. Prometheus and Loki stay unreachable from the edge:
# no Ingress routes to them AND this allow matches only the Grafana pod, so a
# stray Traefik route could still not expose raw PromQL/LogQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-obs-public-edge
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - { protocol: TCP, port: 3000 }
