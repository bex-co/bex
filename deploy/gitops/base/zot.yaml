# Zot OCI registry (the build->registry->deploy hop). In-cluster Deployment + Service.
# Uses the upstream Zot Helm repo (a real Helm repo, so this one is apply-ready).
#
# Auth is ON (w7/m8, docs/ADR022-tenant-isolation.md § Registry access control):
# htpasswd + accessControl with anonymous DENIED (defaultPolicy []). Tenant build
# pods are inside the network allow-list (they must push), but now need a
# credential their own Dockerfile RUN steps cannot read — so the push/pull
# credentials live out-of-band (scripts/registry-secrets.sh, the auth-secrets.sh
# pattern — NO secret material in git). The htpasswd itself is mounted from the
# out-of-band zot-htpasswd Secret (externalSecrets), NOT the chart's secretFiles
# (which ships an admin:admin default we deliberately do not use).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://zotregistry.dev/helm-charts
    chart: zot
    targetRevision: "0.1.121" # pinned (was "0.1.*"); bump deliberately
    helm:
      values: |
        # NodePort 30500 lets kubelet on tenant nodes pull images via
        # 127.0.0.1:30500 (configured in the CAPH machine template's
        # containerd hosts.toml) without needing cluster-internal DNS.
        service:
          # NodePort 30500 on every node: kube-proxy forwards localhost:30500 →
          # Zot ClusterIP so containerd's hosts.toml can use a stable, IP-free
          # URL without /etc/hosts (t001). ClusterIP routing (bex-system, build
          # pods) is unchanged — they reach Zot over the Service ClusterIP as before.
          type: NodePort
          port: 5000
          nodePort: 30500
        # mountConfig: false — the operator (w7/m36) manages the Zot config via
        # the "zot-config" Secret (operator-registry-rbac.yaml grants access).
        # Per-App ACL entries are added/removed dynamically: each tenant's pull
        # credential covers only its own repository (ADR022-tenant-isolation.md:204).
        mountConfig: false
        persistence: true
        # The registry must absorb concurrent large image pushes between Zot's
        # daily retention/GC passes. Hetzner's 10 GiB minimum filled during two
        # overlapping Beancount builds and turned uploads into opaque 500s.
        pvc:
          storage: 40Gi
        # kpack publishes its generated builder as Docker schema 2; Zot's
        # docker2s2 compatibility mode accepts that manifest format.
        mountSecret: false
        externalSecrets:
          # config.json — full Zot config managed by the bex operator; the operator
          # writes the base config on first access and patches it with per-App ACL
          # entries as Apps are created/deleted. The zot-config Secret key is
          # "config.json", which Zot reads at /etc/zot/config.json.
          - secretName: zot-config
            mountPath: /etc/zot
          # htpasswd — bcrypt credentials for bex-builder (push) and per-App pull
          # users (app-<name>); managed by the operator (w7/m36) with bex-builder
          # seeded by scripts/registry-secrets.sh.
          - secretName: zot-htpasswd
            mountPath: /secret
        # w1/m19 t003: platform pool
        nodeSelector:
          bex.co/pool: platform
        tolerations:
          - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
  destination:
    server: https://kubernetes.default.svc
    namespace: bex-registry
  # StatefulSet volumeClaimTemplates are immutable. The existing PVC is grown
  # online out of band; ignore its storage request plus the apiVersion/kind
  # defaults Kubernetes adds to the embedded PVC template. Ignoring the whole
  # requests map also prevents an empty-map diff after storage is removed by
  # Argo's normalizer, while a recreated StatefulSet still starts at the desired
  # size above.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: zot
      namespace: bex-registry
      jsonPointers:
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
        - /spec/volumeClaimTemplates/0/spec/resources/requests
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, RespectIgnoreDifferences=true]
