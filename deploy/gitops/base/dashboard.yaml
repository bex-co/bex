# The bex dashboard: Render-style human-facing UI (docs/ADR002-architecture.md),
# deployed straight from dashboard/deploy (kustomize) into its own namespace.
# Image pinning: same digest write-back as bex.yaml (w1/m7 t002). The :latest below
# is the bootstrap value; the deploy workflow rewrites it to the immutable
# `@sha256:<digest>` it just pushed and commits it back, so Argo deploys a
# content-addressed reference and rolls on digest change.
# NOTE: if the GHCR package is private, add an imagePullSecret in the
# dashboard namespace (or make the package public) so app-cluster nodes can pull it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bex-dashboard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: bex-platform
  source:
    repoURL: git@github.com:bex-co/bex.git
    targetRevision: main
    path: dashboard/deploy
    kustomize:
      images:
        - dashboard=ghcr.io/bex-co/bex-dashboard@sha256:576a7beb53b6c094c5d91ad3c8a0152324de66943438c2d79c21f4304bd4a825
  destination:
    server: https://kubernetes.default.svc
    namespace: dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
