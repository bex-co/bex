# The operator also authors routing, certificate, kpack, CNPG, and bex CRs.
# Several of those controllers can materialize workloads on its behalf, so the
# namespace boundary must cover the declarative objects as well as direct Pod
# templates and Services.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bex-operator-object-namespaces
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["app.bex.co"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["apps", "databases", "keyvalues"]
      - apiGroups: ["app.bex.co"]
        apiVersions: ["v1alpha1"]
        operations: ["UPDATE"]
        resources: ["apps/*", "databases/*", "keyvalues/*"]
      # UPDATE alone covered the KeyValue expander, whose claims a StatefulSet
      # creates on its behalf. The App controller creates and deletes a
      # persistent service disk's claim itself (docs/ADR082-persistent-disks.md),
      # so those two operations need to be inside the namespace boundary too —
      # otherwise the one PVC the operator authors directly is the one the
      # policy never sees.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["persistentvolumeclaims"]
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["certificates"]
      - apiGroups: ["kpack.io"]
        apiVersions: ["v1alpha2"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["images", "builds"]
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["ingresses", "networkpolicies"]
      - apiGroups: ["postgresql.cnpg.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["backups", "clusters", "poolers", "scheduledbackups"]
      - apiGroups: ["postgresql.cnpg.io"]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["clusters/*"]
      - apiGroups: ["traefik.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["ingressroutetcps", "middlewares", "middlewaretcps"]
  matchConditions:
    - name: bex-operator-service-account
      expression: request.userInfo.username == 'system:serviceaccount:bex-system:bex-controller-manager'
  variables:
    - name: target
      expression: >-
        request.operation == 'DELETE' ? oldObject : object
    - name: workspace
      expression: namespaceObject.metadata.?labels['app.bex.co/workspace'].orValue('')
  validations:
    - expression: >-
        variables.target.metadata.namespace == 'default' ||
        (namespaceObject != null &&
         ((namespaceObject.metadata.?labels['app.bex.co/execution-boundary'].orValue('') == 'untrusted') ||
          (namespaceObject.metadata.?labels['app.kubernetes.io/managed-by'].orValue('') == 'bex-controlplane' &&
           namespaceObject.metadata.?labels['app.kubernetes.io/part-of'].orValue('') == 'bex' &&
           namespaceObject.metadata.?labels['app.bex.co/regime'].orValue('') == 'hosting' &&
           variables.workspace.matches('^tea-[0-9a-v]{20}$') &&
           namespaceObject.metadata.name == variables.workspace)))
      reason: Forbidden
      message: the bex operator may mutate managed objects only in canonical tenant hosting, isolated execution, or legacy bootstrap namespaces
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bex-operator-object-namespaces
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  policyName: bex-operator-object-namespaces
