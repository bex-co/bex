spec:
  policyName: bex-operator-daytoday-workloads
  validationActions: [Deny, Audit]
---
# ADR057 #4 residual 2 / ADR063 #13 residual (w2/022): bex-build is a shared
# privileged-Pod-Security namespace, and the policies above only constrain the
# controller-manager identity. This policy pins the EXACT hardened BuildKit Job
# template shape (ADR061 #6) for EVERY author of Jobs in bex-build: a pod user
# namespace, no token/host/node pinning, emptyDir-or-secret volumes only, and a
# container split where only the `buildkit` container may be powerful — and only
# with the exact capability set lego/operator/internal/build/build.go mints —
# while every other container (clone, cache-restore, native-preparer, push,
# sign) is restricted. Fail-closed on purpose: a legitimate template change
# (new volume type, new capability) must update this policy in the same commit.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bex-build-job-shape
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: bex-build
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  variables:
    - name: pod
      expression: object.spec.template.spec
    - name: crownSecrets
      expression: "['bex-kubeconfig', 'bex-ca', 'bex-etcd', 'bex-proxy', 'bex-sa']"
    # The exact capability set build.go grants the buildkit container, confined
    # to the pod user namespace (hostUsers=false).
    - name: buildkitCaps
      expression: "['AUDIT_WRITE', 'CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'FSETID', 'KILL', 'MKNOD', 'NET_ADMIN', 'NET_BIND_SERVICE', 'NET_RAW', 'SETFCAP', 'SETGID', 'SETPCAP', 'SETUID', 'SYS_ADMIN', 'SYS_CHROOT']"
  validations:
    - expression: >-
        has(variables.pod.hostUsers) && variables.pod.hostUsers == false
      reason: Forbidden
      message: bex-build Jobs must run in a pod user namespace (hostUsers=false) — it is what confines BuildKit's mount capabilities off the host kernel
    - expression: >-
        variables.pod.restartPolicy == 'Never' &&
        (!has(variables.pod.serviceAccountName) || variables.pod.serviceAccountName in ['', 'default']) &&
        has(variables.pod.automountServiceAccountToken) && variables.pod.automountServiceAccountToken == false
      reason: Forbidden
      message: bex-build Jobs must be restartPolicy Never with no ServiceAccount and token automount disabled
    - expression: >-
        !variables.pod.?hostNetwork.orValue(false) &&
        !variables.pod.?hostPID.orValue(false) &&
        !variables.pod.?hostIPC.orValue(false) &&
        !has(variables.pod.nodeName) &&
        (!has(variables.pod.tolerations) || variables.pod.tolerations.all(t,
          (has(t.key) && t.key != '' && !t.key.startsWith('node-role.kubernetes.io/control-plane') && t.key != 'node-role.kubernetes.io/master'))) &&
        has(variables.pod.volumes) && variables.pod.volumes.all(v,
          (has(v.emptyDir) || has(v.secret)) &&
          (!has(v.secret) || !(v.secret.secretName in variables.crownSecrets)))
      reason: Forbidden
      message: bex-build Jobs may not join host namespaces, pin a node, carry wildcard/control-plane tolerations, or use volumes other than emptyDir/non-crown Secrets
    - expression: >-
        (!has(variables.pod.securityContext) ||
         variables.pod.securityContext.?seccompProfile.?type.orValue('') == 'RuntimeDefault')
      reason: Forbidden
      message: bex-build Jobs must keep the pod-level RuntimeDefault seccomp baseline
    - expression: >-
