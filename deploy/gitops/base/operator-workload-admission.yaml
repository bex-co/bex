# ADR057 #4 residual 1 (w2/022): the day-to-day ops credential
# (system:serviceaccount:kube-system:bex-operator, operator-daytoday-rbac.yaml)
# is matched by none of the three policies above. Its current grant is read +
# pods/exec + pods/jobs delete only, but if that ClusterRole is ever broadened
# to author workloads, RBAC still cannot express the Pod grammar — the exact
# gap ADR061 #2 flagged. This parallel policy binds the SAME canonical-namespace
# and Pod-grammar rules to that identity for CREATE/UPDATE. DELETE is
# deliberately out of scope: the role's existing jobs:delete covers stuck-run
# cleanup in platform namespaces (backups in bex-system) that the canonical
# tenant/hosting boundary would reject, and deletion authors nothing.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bex-operator-daytoday-workloads
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  matchConditions:
    - name: bex-operator-daytoday-service-account
      expression: request.userInfo.username == 'system:serviceaccount:kube-system:bex-operator'
  variables:
    - name: pod
      expression: >-
        request.resource.resource == 'cronjobs' ?
          object.spec.jobTemplate.spec.template.spec :
          object.spec.template.spec
    - name: workspace
      expression: namespaceObject.metadata.?labels['app.bex.co/workspace'].orValue('')
    - name: untrustedExecutionNamespace
      expression: >-
        namespaceObject != null &&
        namespaceObject.metadata.?labels['app.bex.co/execution-boundary'].orValue('') == 'untrusted'
    - name: canonicalNamespace
      expression: >-
        object.metadata.namespace == 'default' ||
        (namespaceObject != null &&
         ((namespaceObject.metadata.?labels['app.bex.co/execution-boundary'].orValue('') == 'untrusted') ||
          (namespaceObject.metadata.?labels['app.kubernetes.io/managed-by'].orValue('') == 'bex-controlplane' &&
           namespaceObject.metadata.?labels['app.kubernetes.io/part-of'].orValue('') == 'bex' &&
           namespaceObject.metadata.?labels['app.bex.co/regime'].orValue('') == 'hosting' &&
           variables.workspace.matches('^tea-[0-9a-v]{20}$') &&
           namespaceObject.metadata.name == variables.workspace)))
    - name: crownSecrets
      expression: "['bex-kubeconfig', 'bex-ca', 'bex-etcd', 'bex-proxy', 'bex-sa']"
  validations:
    - expression: variables.canonicalNamespace
      reason: Forbidden
      message: the day-to-day operator credential may author workloads only in canonical tenant hosting, isolated execution, or legacy bootstrap namespaces
    - expression: >-
        ((!has(variables.pod.serviceAccountName) || variables.pod.serviceAccountName in ['', 'default']) &&
         has(variables.pod.automountServiceAccountToken) && variables.pod.automountServiceAccountToken == false)
      reason: Forbidden
      message: day-to-day-authored workloads must use no privileged ServiceAccount and must disable token automount
    - expression: >-
        (!variables.pod.?hostNetwork.orValue(false) &&
         !variables.pod.?hostPID.orValue(false) &&
         !variables.pod.?hostIPC.orValue(false) &&
         !has(variables.pod.nodeName) &&
         (!has(variables.pod.volumes) || variables.pod.volumes.all(v,
           !has(v.hostPath) && (!has(v.secret) || !(v.secret.secretName in variables.crownSecrets)))))
      reason: Forbidden
      message: day-to-day-authored workloads may not join host namespaces, pin a node directly, mount host paths, or mount CAPI administrator Secrets
    - expression: >-
        (!has(variables.pod.tolerations) || variables.pod.tolerations.all(t,
          (has(t.key) && t.key != '' && !t.key.startsWith('node-role.kubernetes.io/control-plane') && t.key != 'node-role.kubernetes.io/master')))
      reason: Forbidden
      message: day-to-day-authored workloads may not carry wildcard or control-plane tolerations
    - expression: >-
        (variables.pod.containers.all(c,
           !c.?securityContext.?privileged.orValue(false) &&
           c.?securityContext.?procMount.orValue('Default') != 'Unmasked' &&
           (!has(c.envFrom) || c.envFrom.all(e, !has(e.secretRef) || !(e.secretRef.name in variables.crownSecrets))) &&
           (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) || !(e.valueFrom.secretKeyRef.name in variables.crownSecrets)))) &&
         (!has(variables.pod.initContainers) || variables.pod.initContainers.all(c,
           !c.?securityContext.?privileged.orValue(false) &&
           c.?securityContext.?procMount.orValue('Default') != 'Unmasked' &&
           (!has(c.envFrom) || c.envFrom.all(e, !has(e.secretRef) || !(e.secretRef.name in variables.crownSecrets))) &&
           (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) || !(e.valueFrom.secretKeyRef.name in variables.crownSecrets))))))
      reason: Forbidden
      message: day-to-day-authored containers may not be privileged, use an unmasked procMount, or consume CAPI administrator Secrets
    - expression: >-
        !variables.untrustedExecutionNamespace ||
        (has(variables.pod.hostUsers) && variables.pod.hostUsers == false)
      reason: Forbidden
      message: day-to-day-authored workloads in isolated execution namespaces must run in a pod user namespace (hostUsers=false)
    - expression: >-
        variables.untrustedExecutionNamespace ||
        (variables.pod.containers.all(c,
           !c.?securityContext.?allowPrivilegeEscalation.orValue(false) &&
           c.?securityContext.?capabilities.?add.orValue([]).size() == 0 &&
           (c.?securityContext.?seccompProfile.?type.orValue('') == 'RuntimeDefault' ||
