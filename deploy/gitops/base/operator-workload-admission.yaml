# The operator necessarily has cluster-wide workload verbs because tenant
# namespaces are dynamic. RBAC cannot express the intended namespace and Pod
# grammar, so enforce it at the API server for the exact operator identity.
# This is a compromise-containment boundary: even arbitrary controller code may
# author workloads only in tenant hosting / isolated execution namespaces, with
# no Kubernetes credential, host namespace, hostPath, privileged container, or
# direct mount of known CAPI crown-jewel Secrets.
#
# codex round-9 #13 extends the grammar to the fields the generators already
# set, so a compromised controller cannot regress them: no direct nodeName
# placement, no Unmasked procMount, no wildcard/control-plane tolerations; in
# the isolated execution namespaces every pod MUST run in a user namespace
# (hostUsers=false — that is what confines BuildKit's mount capabilities and
# unconfined seccomp to a pod user namespace); outside them (tenant hosting +
# legacy bootstrap) every container is restricted — no added capabilities, no
# privilege escalation, RuntimeDefault seccomp. Security round 10 also applies
# the canonical namespace boundary to DELETE and PVC mutation: admission must
# contain every destructive cluster-wide verb, not only authored object bodies.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bex-operator-workloads
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["deployments", "statefulsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["jobs", "cronjobs"]
  matchConditions:
    - name: bex-operator-service-account
      expression: request.userInfo.username == 'system:serviceaccount:bex-system:bex-controller-manager'
  variables:
    - name: target
      expression: >-
        request.operation == 'DELETE' ? oldObject : object
    - name: pod
      expression: >-
        request.resource.resource == 'cronjobs' ?
          variables.target.spec.jobTemplate.spec.template.spec :
          variables.target.spec.template.spec
    - name: workspace
      expression: namespaceObject.metadata.?labels['app.bex.co/workspace'].orValue('')
    - name: untrustedExecutionNamespace
      expression: >-
        namespaceObject != null &&
        namespaceObject.metadata.?labels['app.bex.co/execution-boundary'].orValue('') == 'untrusted'
    - name: canonicalNamespace
      expression: >-
        variables.target.metadata.namespace == 'default' ||
        (namespaceObject != null &&
         ((namespaceObject.metadata.?labels['app.bex.co/execution-boundary'].orValue('') == 'untrusted') ||
          (namespaceObject.metadata.?labels['app.kubernetes.io/managed-by'].orValue('') == 'bex-controlplane' &&
           namespaceObject.metadata.?labels['app.kubernetes.io/part-of'].orValue('') == 'bex' &&
           namespaceObject.metadata.?labels['app.bex.co/regime'].orValue('') == 'hosting' &&
           variables.workspace.matches('^tea-[0-9a-v]{20}$') &&
           namespaceObject.metadata.name == variables.workspace)))
    - name: crownSecrets
      expression: "['bex-kubeconfig', 'bex-ca', 'bex-etcd', 'bex-proxy', 'bex-sa']"
    # The disk snapshot/restore Jobs (ADR082 D5, w2/m86) are the one
    # operator-authored workload class whose FUNCTION is a DAC bypass: a backup
    # must read every file on a tenant volume regardless of owning uid
    # (root-owned lost+found included), and a restore must re-create archived
    # ownership. They are name-scoped here — only this service account is
    # constrained by this policy, and the operator already mounts these same
    # PVCs legitimately, so permitting exactly DAC_OVERRIDE/CHOWN/FOWNER on
    # exactly these Jobs widens a compromised operator's reach by nothing that
    # matters while making backups possible at all. Purge (dskprg-) mounts no
    # volume and stays fully restricted.
    - name: diskSnapshotVolumeWorkload
      expression: >-
        (request.resource.resource == 'cronjobs' || request.resource.resource == 'jobs') &&
        (variables.target.metadata.name.startsWith('dskbak-') ||
         variables.target.metadata.name.startsWith('dskrst-'))
    - name: diskSnapshotCaps
      expression: "['DAC_OVERRIDE', 'CHOWN', 'FOWNER']"
  validations:
    - expression: variables.canonicalNamespace
      reason: Forbidden
      message: the bex operator may mutate workloads only in canonical tenant hosting, isolated execution, or legacy bootstrap namespaces
    - expression: >-
        request.operation == 'DELETE' ||
        ((!has(variables.pod.serviceAccountName) || variables.pod.serviceAccountName in ['', 'default']) &&
         has(variables.pod.automountServiceAccountToken) && variables.pod.automountServiceAccountToken == false)
      reason: Forbidden
      message: operator-authored workloads must use no privileged ServiceAccount and must disable token automount
    - expression: >-
        request.operation == 'DELETE' ||
        (!variables.pod.?hostNetwork.orValue(false) &&
         !variables.pod.?hostPID.orValue(false) &&
         !variables.pod.?hostIPC.orValue(false) &&
         !has(variables.pod.nodeName) &&
         (!has(variables.pod.volumes) || variables.pod.volumes.all(v,
           !has(v.hostPath) && (!has(v.secret) || !(v.secret.secretName in variables.crownSecrets)))))
      reason: Forbidden
      message: operator-authored workloads may not join host namespaces, pin a node directly, mount host paths, or mount CAPI administrator Secrets
    # Placement grammar: tolerations must name a key — an empty-key Exists
    # toleration tolerates every taint (control-plane included), and the
    # control-plane/master keys reach the etcd nodes directly.
    - expression: >-
        request.operation == 'DELETE' ||
        (!has(variables.pod.tolerations) || variables.pod.tolerations.all(t,
          (has(t.key) && t.key != '' && !t.key.startsWith('node-role.kubernetes.io/control-plane') && t.key != 'node-role.kubernetes.io/master')))
      reason: Forbidden
      message: operator-authored workloads may not carry wildcard or control-plane tolerations
    - expression: >-
        request.operation == 'DELETE' ||
        (variables.pod.containers.all(c,
           !c.?securityContext.?privileged.orValue(false) &&
           c.?securityContext.?procMount.orValue('Default') != 'Unmasked' &&
           (!has(c.envFrom) || c.envFrom.all(e, !has(e.secretRef) || !(e.secretRef.name in variables.crownSecrets))) &&
           (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) || !(e.valueFrom.secretKeyRef.name in variables.crownSecrets)))) &&
         (!has(variables.pod.initContainers) || variables.pod.initContainers.all(c,
           !c.?securityContext.?privileged.orValue(false) &&
           c.?securityContext.?procMount.orValue('Default') != 'Unmasked' &&
           (!has(c.envFrom) || c.envFrom.all(e, !has(e.secretRef) || !(e.secretRef.name in variables.crownSecrets))) &&
           (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) || !(e.valueFrom.secretKeyRef.name in variables.crownSecrets))))))
      reason: Forbidden
      message: operator-authored containers may not be privileged, use an unmasked procMount, or consume CAPI administrator Secrets
    # In the isolated execution namespaces (BuildKit's mount capabilities and
    # unconfined seccomp live there), a pod user namespace is REQUIRED: it is
    # what confines those powers off the host kernel.
    - expression: >-
        request.operation == 'DELETE' ||
        !variables.untrustedExecutionNamespace ||
        (has(variables.pod.hostUsers) && variables.pod.hostUsers == false)
      reason: Forbidden
      message: operator-authored workloads in isolated execution namespaces must run in a pod user namespace (hostUsers=false)
    # Outside the execution boundary (tenant hosting + legacy bootstrap), every
    # container is restricted: no added capabilities, no privilege escalation,
    # RuntimeDefault seccomp at the container or pod level. Sole exception:
    # the name-scoped disk snapshot/restore Jobs may add exactly the three
    # DAC-bypass capabilities their function requires (see
    # diskSnapshotVolumeWorkload above); everything else about them — no
    # escalation, seccomp, non-privileged, no host access — stays enforced.
    - expression: >-
        request.operation == 'DELETE' ||
        variables.untrustedExecutionNamespace ||
        (variables.pod.containers.all(c,
           !c.?securityContext.?allowPrivilegeEscalation.orValue(false) &&
           (variables.diskSnapshotVolumeWorkload ?
             c.?securityContext.?capabilities.?add.orValue([]).all(cap, cap in variables.diskSnapshotCaps) :
             c.?securityContext.?capabilities.?add.orValue([]).size() == 0) &&
           (c.?securityContext.?seccompProfile.?type.orValue('') == 'RuntimeDefault' ||
            variables.pod.?securityContext.?seccompProfile.?type.orValue('') == 'RuntimeDefault')) &&
         (!has(variables.pod.initContainers) || variables.pod.initContainers.all(c,
           !c.?securityContext.?allowPrivilegeEscalation.orValue(false) &&
           c.?securityContext.?capabilities.?add.orValue([]).size() == 0 &&
           (c.?securityContext.?seccompProfile.?type.orValue('') == 'RuntimeDefault' ||
            variables.pod.?securityContext.?seccompProfile.?type.orValue('') == 'RuntimeDefault'))))
      reason: Forbidden
      message: operator-authored containers outside the execution boundary must be restricted (no added capabilities, no privilege escalation, RuntimeDefault seccomp; disk snapshot/restore Jobs may add only their DAC-bypass set)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bex-operator-workloads
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  policyName: bex-operator-workloads
  validationActions: [Deny, Audit]
---
