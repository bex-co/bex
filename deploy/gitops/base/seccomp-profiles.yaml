# seccomp-profiles (w6/m150) — installs bex's Localhost seccomp profiles on
# every node, where the kubelet resolves `localhostProfile` paths
# (/var/lib/kubelet/seccomp/<path>).
#
# bex-render-v1.json is the render-v1 container policy's profile: containerd's
# RuntimeDefault for that capability set plus the user-namespace and io_uring
# syscalls Render's unfiltered runtime permits (ADR089 § Seccomp, generated by
# scripts/seccomp-render-v1/generate.sh — never hand-edit it).
#
# Race on a new node: a render-v1 container that starts before this DaemonSet
# has written the file fails to create and the kubelet retries it with
# backoff, so the window costs seconds, never a lost pod. Tolerates every
# taint so no pool is skipped; the file is inert on nodes that never run
# render-v1.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: seccomp-profiles
  namespace: kube-system
  labels:
    app.kubernetes.io/name: seccomp-profiles
    app.kubernetes.io/part-of: bex
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: seccomp-profiles
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seccomp-profiles
    spec:
      priorityClassName: system-node-critical
      automountServiceAccountToken: false
      enableServiceLinks: false
      tolerations:
        - operator: Exists
      initContainers:
        - name: install
          image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          # Write to a temp name then rename: the kubelet never reads a
          # half-written profile.
          command:
            - /bin/sh
            - -c
            - mkdir -p /host/profiles && cp /profiles/bex-render-v1.json /host/profiles/.bex-render-v1.json.tmp && mv /host/profiles/.bex-render-v1.json.tmp /host/profiles/bex-render-v1.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 1m, memory: 8Mi }
            limits: { memory: 16Mi }
          volumeMounts:
            - { name: profiles, mountPath: /profiles, readOnly: true }
            - { name: kubelet-seccomp, mountPath: /host }
      containers:
        # Idles so the DaemonSet reports Ready per node and re-runs the
        # install on every rollout of a changed profile.
        - name: pause
          image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 1m, memory: 4Mi }
            limits: { memory: 16Mi }
      volumes:
        - name: profiles
          configMap:
            name: seccomp-profiles
        - name: kubelet-seccomp
          hostPath:
            path: /var/lib/kubelet/seccomp
            type: DirectoryOrCreate
