# OpenBao — the platform tenant-credential secret store (versioned KV v2 at
# tenants/, docs/ADR013-secrets.md). Pinned upstream chart; values vendored in this
# repo (multi-source, like kratos.yaml/openfga.yaml). Cluster-internal ONLY:
# bex-api is the sole intended caller via the Kubernetes auth method
# (docs/ADR013-secrets.md#5) — no ingress.
#
# Unlike Kratos/Hydra/OpenFGA, OpenBao owns its storage directly (integrated
# Raft, docs/ADR013-secrets.md#2) instead of a CNPG cluster — no DSN Secret to
# compose. Init/unseal is out-of-band (scripts/bao-init.sh): unseal keys +
# root token live only in .env, never in git (same rule as the Ory secrets).

injector:
  enabled: false # no Vault Agent sidecar injection — bex-api reads via its own client

ui:
  enabled: false # cluster-internal only, no ingress — the UI Service buys nothing here

server:
  ha:
    enabled: true
    replicas: 1 # single-node raft locally; prod bumps to 3 for quorum (docs/ADR013-secrets.md consequences)
    raft:
      enabled: true
      config: |
        ui = true
        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          # Prometheus scrapes /v1/sys/metrics per-pod for the OpenBaoSealed alert
          # (w3/m6). unauthenticated_metrics_access lets it read the seal gauge
          # without a token — and a SEALED member still serves this endpoint, which
          # is the whole point (a sealed member reports vault_core_unsealed=0).
          # Cluster-internal only (no ingress), and metrics carry no secret material.
          telemetry {
            unauthenticated_metrics_access = true
          }
        }
        storage "raft" {
          path = "/openbao/data"
        }
        service_registration "kubernetes" {}
        # Emit Prometheus-format telemetry with stable series names (no per-host
        # label churn); 24h retention comfortably covers the alert eval window.
        telemetry {
          prometheus_retention_time = "24h"
          disable_hostname = true
        }
  dataStorage:
    enabled: true
    size: 10Gi
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
  # w1/m19 t003: platform pool
  nodeSelector:
    bex.co/pool: platform
  tolerations:
    - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
  # server.authDelegator.enabled defaults to true in the chart — grants
  # OpenBao's own ServiceAccount the TokenReview permission the Kubernetes
  # auth method needs to validate a caller's projected SA token
  # (docs/ADR013-secrets.md#5); nothing to override here.
