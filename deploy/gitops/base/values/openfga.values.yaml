# OpenFGA values (chart 0.3.10). No secret material here: the DSN and the
# preshared API key both come from the out-of-band `openfga` Secret created by
# scripts/auth-secrets.sh (keys `uri` and `keys` — the names this chart's
# templates hardcode). Cluster-internal only: no ingress, playground off,
# every API call must present the preshared key.

# Single app node today (chart defaults to 3); bump alongside the HA work.
replicaCount: 1

# w1/m19 t003: platform pool (top-level — the chart wires these into both the
# server Deployment and the migrate Job).
nodeSelector:
  bex.co/pool: platform
tolerations:
  - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }

datastore:
  engine: postgres
  uriSecret: openfga # -> env OPENFGA_DATASTORE_URI from key `uri`
  # applyMigrations/migrationType default to true/job — schema migrations run
  # against openfga-db on install/upgrade (Argo hook annotations below).

# The chart's default `helm.sh/hook: post-install` deadlocks under Argo: it
# becomes a PostSync hook that only runs once the app is Healthy, while the
# Deployment's wait-for-migration init container blocks Health until the Job
# has run. Run it as an Argo Sync hook instead (recreated each sync); plain
# helm installs treat these annotations as inert and create the Job normally.
migrate:
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # null out the chart's default helm hooks (deep-merged otherwise)
    helm.sh/hook: null
    helm.sh/hook-delete-policy: null
    helm.sh/hook-weight: null

authn:
  method: preshared
  preshared:
    keysSecret: openfga # -> env OPENFGA_AUTHN_PRESHARED_KEYS from key `keys`

# The playground is a browser UI with no auth story — never run it in-cluster.
playground:
  enabled: false
