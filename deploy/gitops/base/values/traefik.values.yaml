# Traefik base values (vendored; multi-source Application, like openbao.values.yaml).
# The DEFAULT edge for the local mock: Traefik on hostNetwork binding one node's
# public IP :80/:443 directly — the simplest, cheapest edge, no Hetzner LB (the
# pod lands on a bex.co/pool=platform node, pinned below). The prod overlay
# layers overlays/prod/values/traefik.values.yaml on top to swap this for a real
# Hetzner LoadBalancer with a stable IP (w1/m7 t005). Argo merges valueFiles in
# order, later wins.
deployment:
  replicas: 1 # one edge pod — it owns the hostNetwork node's public IP
  dnsPolicy: ClusterFirstWithHostNet # reach in-cluster API/DNS under hostNetwork
# w1/m19 t003: platform pool
nodeSelector:
  bex.co/pool: platform
tolerations:
  - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
hostNetwork: true # bind the node's public IP directly (no Hetzner LB)
# Bind :80/:443 directly. The traefik binary has no file caps, so a non-root
# uid drops NET_BIND_SERVICE on exec -> "permission denied"; run as root with
# only NET_BIND_SERVICE (standard for an edge proxy on privileged ports).
podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
securityContext:
  capabilities:
    add: [NET_BIND_SERVICE]
    drop: [ALL]
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
ports:
  web:
    port: 80 # host :80 (HTTP + ACME HTTP-01 challenge)
  websecure:
    port: 443 # host :443 (HTTPS)
  # postgres entrypoint removed (w1/m29): the bex-pg-sni-proxy DaemonSet now
  # owns host :5432 and routes directly to CNPG backends after handling the
  # PostgreSQL SSLRequest preamble. Traefik's IngressRouteTCP resources for
  # postgres are retained (owned by Database CRs) but no longer carry traffic.
  metrics:
    port: 9100 # Prometheus scrape target (in-cluster only)
    expose:
      default: false # not on the public hostNetwork edge
service:
  spec:
    type: ClusterIP # no Hetzner LB (single-node uses hostNetwork node IP); LoadBalancer for multi-node
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik
providers:
  kubernetesIngress:
    enabled: true # watch standard networking.k8s.io/Ingress
# Access logs — the backend for bex-api's REQUEST logs (GET /v1/logs?type=request,
# docs/ADR010-observability.md). JSON format so the log-shipper (log-shipper.yaml)
# can parse each line into labels: ServiceName gives App attribution
# (`<namespace>-<app>-<port>@kubernetes` — the operator names the k8s Service after
# the App), RequestMethod/DownstreamStatus become bounded labels, RequestPath/
# RequestHost stay in the line (unbounded — never labels; see the ADR's cardinality
# budget). Headers are dropped: they carry Authorization/Cookie, and a request log
# is not a place to leak a credential.
accessLog:
  enabled: true
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
# Prometheus request metrics — the backend for bex-api's request metrics
# (GET /v1/metrics/{http-requests,http-latency,bandwidth}). addServicesLabels
# exposes the per-service counters (traefik_service_requests_total,
# _request_duration_seconds_bucket, _responses_bytes_total) that
# NewPrometheusRequestSource queries via `service=~".*<app>.*"`. A Prometheus
# deployment must scrape the metrics entrypoint and bex-api must point at it
# with BEX_PROM_URL; until then request metrics return 503.
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addServicesLabels: true # per-service labels (service=…) for App attribution
    addRoutersLabels: true # per-router labels (host/path attribution, future use)
# entrypoints web(:80) + websecure(:443) with NO forced web->websecure redirect,
# so cert-manager HTTP-01 challenges on :80 succeed.
