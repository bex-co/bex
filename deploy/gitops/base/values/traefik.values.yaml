# Traefik base values (vendored; multi-source Application, like openbao.values.yaml).
# The DEFAULT edge for the local mock: Traefik on hostNetwork binding one node's
# public IP :80/:443 directly — the simplest, cheapest edge, no Hetzner LB (the
# pod lands on a bex.co/pool=platform node, pinned below). The prod overlay
# layers overlays/prod/values/traefik.values.yaml on top to swap this for a real
# Hetzner LoadBalancer with a stable IP (w1/m7 t005). Argo merges valueFiles in
# order, later wins.
deployment:
  replicas: 1 # one edge pod — it owns the hostNetwork node's public IP
  dnsPolicy: ClusterFirstWithHostNet # reach in-cluster API/DNS under hostNetwork
  additionalVolumes:
    - name: bex-websocket-egress-plugin
      configMap:
        # The plugin's content-hashed ConfigMap (charts/traefik-plugins): Traefik
        # loads the plugin only at startup, so a code change must roll the pods,
        # and this name changing is what rolls them (w4/m164). gitops-validate
        # prints the current name when this one is stale.
        name: bex-websocket-egress-plugin-9745f4t2d6
    - name: bex-client-ip-headers-plugin
      configMap:
        # Content-hashed like the egress plugin above (w8/m123).
        name: bex-client-ip-headers-plugin-5m7mcc6td8
# A second pod cannot bind the same host ports on the pinned edge node, so a
# rolling update deadlocks with the new pod Pending. Recreate gives restarts
# a deterministic metering-counter reset and a brief, explicit edge
# interruption. The chart reads only this top-level key; `deployment.strategy`
# is silently ignored (w4/338).
updateStrategy:
  type: Recreate
experimental:
  abortOnPluginFailure: true
  localPlugins:
    bexWebsocketEgress:
      type: localPath
      moduleName: github.com/bex-co/bex-websocket-egress
      mountPath: /plugins-local/src/github.com/bex-co/bex-websocket-egress
      volumeName: bex-websocket-egress-plugin
    bexClientIPHeaders:
      type: localPath
      moduleName: github.com/bex-co/bex-client-ip-headers
      mountPath: /plugins-local/src/github.com/bex-co/bex-client-ip-headers
      volumeName: bex-client-ip-headers-plugin
# w1/m19 t003: platform pool
nodeSelector:
  bex.co/pool: platform
tolerations:
  - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
hostNetwork: true # bind the node's public IP directly (no Hetzner LB)
# Bind :80/:443 directly. The traefik binary has no file caps, so a non-root
# uid drops NET_BIND_SERVICE on exec -> "permission denied"; run as root with
# only NET_BIND_SERVICE (standard for an edge proxy on privileged ports).
podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
securityContext:
  capabilities:
    add: [NET_BIND_SERVICE]
    drop: [ALL]
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
# Every request on the tenant HTTP entrypoints passes the client-identity
# sanitizer first (w8/m123): an app never sees a caller-forged True-Client-IP,
# CF-Connecting-IP, CF-IPCountry or X-Client-IP, and True-Client-IP always names
# the real client, as on Render behind Cloudflare. The Middleware ships in this
# release (extraObjects below), so it exists before any router references it.
ports:
  web:
    # Bounded long uploads (w8/207): the upstream 60s default truncates slow bodies.
    transport:
      respondingTimeouts:
        readTimeout: 6000s
    port: 80 # host :80 (HTTP + ACME HTTP-01 challenge)
    http:
      middlewares: [traefik-bex-client-ip-headers@kubernetescrd]
  websecure:
    transport:
      respondingTimeouts:
        readTimeout: 6000s
    port: 443 # host :443 (HTTPS)
    http:
      middlewares: [traefik-bex-client-ip-headers@kubernetescrd]
  ssh:
    # The hostNetwork/dev edge uses :2222 so it never collides with node-admin
    # sshd on :22. The prod LB overlay exposes this entrypoint publicly as :22.
    port: 2222
    protocol: TCP
  # postgres entrypoint removed (w1/m29): the bex-pg-sni-proxy DaemonSet now
  # owns host :5432 and routes directly to CNPG backends after handling the
  # PostgreSQL SSLRequest preamble. The operator removes pre-m15
  # IngressRouteTCP resources as the metered proxy becomes the sole public path.
  metrics:
    port: 9100 # Prometheus scrape target (in-cluster only)
    expose:
      default: false # not on the public hostNetwork edge
service:
  spec:
    type: ClusterIP # no Hetzner LB (single-node uses hostNetwork node IP); LoadBalancer for multi-node
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik
providers:
  kubernetesIngress:
    enabled: true # watch standard networking.k8s.io/Ingress
    # Maintenance routing uses operator-owned ExternalName aliases in tenant
    # namespaces to reach the fixed responder Service in bex-system. Tenant
    # workloads cannot choose the alias target.
    allowExternalNameServices: true
# Chart 41.0.0 ships Traefik v3.7.5; `image` below pins v3.7.17 instead
# (w8/m145): from v3.7.9 the gzip compress handler no longer negotiates zstd on
# its own, so the gzip-only web edge (w8/m83) answers browsers with gzip. Do not
# pass defaultTLSResourcesNamespace without a review: the cluster-wide
# `default` TLSStore stays in the trusted traefik namespace, and tenant RBAC
# does not grant Traefik CRD writes.
image:
  # Official multi-arch index for traefik:v3.7.17. The chart uses the version
  # before `@` for its version checks and the digest for the pull.
  tag: v3.7.17@sha256:30ff62491aacdb862ceb8c9edcf2627da638d7deafdd4b6dab32fe34f8aa3e90
# Access logs — the backend for bex-api's REQUEST logs (GET /v1/logs?type=request,
# docs/ADR010-observability.md). JSON format so the log-shipper (log-shipper.yaml)
# can parse each line into labels: ServiceName gives App attribution
# (`<namespace>-<app>-<port>@kubernetes` — the operator names the k8s Service after
# the App), RequestMethod/DownstreamStatus become bounded labels, RequestPath/
# RequestHost stay in the line (unbounded — never labels; see the ADR's cardinality
# budget). Headers are dropped: they carry Authorization/Cookie, and a request log
# is not a place to leak a credential.
accessLog:
  enabled: true
  format: json
  fields:
    # An allowlist (w5/076): the message a tenant reads is the raw JSON line
    # (ADR010), so a field reaches it only when named here, and a field a
    # Traefik upgrade adds stays dropped until it is reviewed and listed.
    # Trimmed to Render's request log (w5/099, w4/m325): Render labels the
    # method, status code, host and path, and its message carries the client IP,
    # request id, response time, response bytes and user agent
    # (docs/render-artifacts/request-logs.md). Nothing here is kept that neither
    # Render shows nor the shipper or bex-api reads (access_log_fields_test.go
    # checks both).
    defaultMode: drop
    names:
      # Platform internals stay dropped (w8/047): RequestCount is the
      # process-wide edge counter (any tenant could sample total platform
      # traffic), ServiceAddr/ServiceURL are pod IPs, and RouterName is the
      # edge's internal routing name.
      RequestCount: drop
      ServiceAddr: drop
      ServiceURL: drop
      RouterName: drop
      # Attribution: the shipper names the App by these.
      ServiceName: keep
      KubernetesIngressName: keep
      KubernetesIngressNamespace: keep
      # Render's request-log fields (the response time is Duration, the
      # response bytes DownstreamContentSize).
      RequestMethod: keep
      DownstreamStatus: keep
      RequestHost: keep
      RequestPath: keep
      Duration: keep
      DownstreamContentSize: keep
    headers:
      defaultMode: drop
      # The edge-minted request id (w8/m125) and the real client the
      # client-identity plugin names in True-Client-IP (w8/m123): bex-api reads
      # them as the request line's requestID and clientIP. The plugin replaces
      # any caller value before this log sees the request. User-Agent is the
      # line's userAgent, as on Render (w4/m325). Every other header, cookies
      # and credentials included, stays dropped. Names are Go's canonical
      # header spelling (True-Client-Ip), the form Traefik logs them under.
      names:
        Rndr-Id: keep
        True-Client-Ip: keep
        User-Agent: keep
    # Deploy-hook credentials use the `key` query parameter so they remain
    # copy/paste URLs without entering RequestPath. Drop every query parameter
    # before the raw access-log sink; request-log filtering never depends on it.
    queryParameters:
      defaultMode: drop
# Prometheus request metrics — the backend for bex-api's request metrics
# (GET /v1/metrics/{http-requests,http-latency,bandwidth}). addServicesLabels
# exposes the per-service counters (traefik_service_requests_total,
# _request_duration_seconds_bucket, _responses_bytes_total) that
# NewPrometheusRequestSource queries via `service=~".*<app>.*"`. A Prometheus
# deployment must scrape the metrics entrypoint and bex-api must point at it
# with BEX_PROM_URL; until then request metrics return 503.
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addServicesLabels: true # per-service labels (service=…) for App attribution
    addRoutersLabels: true # per-router labels (host/path attribution, future use)
    # Latency histogram upper bounds in seconds (w4/502). Traefik's default is
    # "0.1,0.3,1.2,5.0": every request faster than 100 ms lands in the first
    # bucket, so histogram_quantile() interpolates inside (0, 0.1] and reads
    # exactly 0.1 x q (p50 50 ms, p95 95 ms) for any fast service. These bounds
    # keep the resolution below 100 ms. The bounds above 10 s are for a Free
    # service's cold start: the wake activator holds its first request up to
    # 90 s, and a quantile past the last bound reads as that bound, so an
    # 11.8 s wake read 10 s (w4/559).
    buckets: "0.005,0.01,0.025,0.05,0.1,0.25,0.5,1,2.5,5,10,15,30,60,90"
# entrypoints web(:80) + websecure(:443) with NO forced web->websecure redirect,
# so cert-manager HTTP-01 challenges on :80 succeed.
extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: bex-client-ip-headers
      namespace: traefik
    spec:
      plugin:
        bexClientIPHeaders: {}
