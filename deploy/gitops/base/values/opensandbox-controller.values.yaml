# Exact controller config the MVP verified. Image references are immutable;
# tags remain only as human-readable version context. CI builds, signs, scans,
# and digest-pins the carried m42 controller patch on every production deploy.
controller:
  image:
    repository: ghcr.io/bex-co/opensandbox-controller
    tag: v0.2.0-bex-snapjobns-terminalpod@sha256:d1f81d92548c42b06d0b3fe35f927644435167c07aa08247ad98a82754d4e141
  # w1/m19 t003: platform pool
  nodeSelector:
    bex.co/pool: platform
  tolerations:
    - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
  # w3/m405 t004: two replicas on different platform nodes, one leader at a
  # time (the chart's leaderElection stays on), and a drain evicts one at a
  # time, so a platform roll never leaves BatchSandboxes unreconciled. The
  # lifecycle server beside it cannot do the same: its only store is SQLite on
  # a ReadWriteOnce volume (deploy/opensandbox/server-in-cluster.yaml), so it
  # stays one Recreate replica, and bex-api repeats the creates its restart
  # does not serve (agentsessions createRepeatBackoff).
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: opensandbox
                control-plane: controller-manager
  snapshot:
    # Privileged commit/unpause Jobs run outside tenant baseline-PSS namespaces.
    jobNamespace: opensandbox-snapshot
    # OCI registry prefix for rootfs snapshots. Use a cluster-reachable, pinned address.
    registry: "127.0.0.1:5050/snapshots"   # OrbStack-local; on Hetzner use the in-cluster Zot service + TLS
    registryInsecure: true                  # true only for the local insecure Zot; false in prod
    imageCommitterImage: "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/image-committer:v0.1.0@sha256:d72cce22ff1ea248e86620e945b7cf12615db74c8a8402fcc01dbfa4a09e7442"
    # snapshotPushSecret / resumePullSecret stay empty in production while the
    # snapshot transport and patched controller activation remain disabled.
