# Exact controller config the MVP verified. The image references include the
# reviewed multi-architecture index digests; tags remain only as human-readable
# version context. deploy.yml now builds/signs/scans the carried m42 controller
# patch, but this bootstrap commit deliberately keeps the live controller on the
# known-good upstream digest until that first build yields an immutable digest;
# activation is a separate digest-pinning ship after that build succeeds.
controller:
  image:
    tag: v0.2.0@sha256:a9a5f73c1785ebd955336ffa313973a35c1a1b662cb7afc4ea82d92021b3532a
  # w1/m19 t003: platform pool
  nodeSelector:
    bex.co/pool: platform
  tolerations:
    - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
  snapshot:
    # OCI registry prefix for rootfs snapshots. Use a cluster-reachable, pinned address.
    registry: "127.0.0.1:5050/snapshots"   # OrbStack-local; on Hetzner use the in-cluster Zot service + TLS
    registryInsecure: true                  # true only for the local insecure Zot; false in prod
    imageCommitterImage: "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/image-committer:v0.1.0@sha256:d72cce22ff1ea248e86620e945b7cf12615db74c8a8402fcc01dbfa4a09e7442"
    # snapshotPushSecret / resumePullSecret stay empty in production while the
    # snapshot transport and patched controller activation remain disabled.
