# Ory Kratos values (chart 0.62.1). No secret material here: the chart's built-in
# Secret is disabled and everything sensitive (dsn, secretsDefault, secretsCookie,
# secretsCipher) comes from the out-of-band `kratos` Secret created by
# scripts/auth-secrets.sh. Public endpoint is exposed at auth.<base-domain> via
# Traefik + cert-manager; the admin API stays cluster-internal (no ingress).

secret:
  enabled: false # do NOT let the chart render a Secret into git/Argo state
  nameOverride: kratos # created out-of-band by scripts/auth-secrets.sh

kratos:
  automigration:
    enabled: true # `kratos migrate sql` job against kratos-db on install/upgrade

  identitySchemas:
    "identity.schema.json": |
      {
        "$id": "https://schemas.bex.co/identity.schema.json",
        "$schema": "http://json-schema.org/draft-07/schema#",
        "title": "Person",
        "type": "object",
        "properties": {
          "traits": {
            "type": "object",
            "properties": {
              "email": {
                "type": "string",
                "format": "email",
                "title": "E-Mail",
                "ory.sh/kratos": {
                  "credentials": {
                    "password": { "identifier": true },
                    "webauthn": { "identifier": true }
                  },
                  "verification": { "via": "email" },
                  "recovery": { "via": "email" }
                }
              }
            },
            "required": ["email"],
            "additionalProperties": false
          }
        }
      }

  config:
    # Native Hydra bridge (w4/m9, docs/ADR012-auth.md): with the admin URL set, Kratos
    # itself resolves + accepts Hydra login challenges — a login/registration
    # flow carrying ?login_challenge= links to the OAuth2 request, and an
    # existing session (skip=true) is accepted with no UI. No custom login
    # provider exists anywhere (DO_NOT_DO.md). override_return_to keeps the
    # browser returning to Hydra's authorize URL across flows.
    oauth2_provider:
      url: http://hydra-admin.auth.svc:4445
      override_return_to: true
    serve:
      public:
        base_url: https://auth.bex.co/
        cors:
          enabled: true # dashboard.bex.co is a different origin — needs explicit CORS + credentials
          allowed_origins:
            - https://dashboard.bex.co
          allow_credentials: true
    identity:
      default_schema_id: default
      schemas:
        - id: default
          url: file:///etc/config/identity.schema.json
    courier:
      smtp:
        # NON-SECRET placeholder — a non-empty value here is only the gate that
        # makes the chart inject COURIER_SMTP_CONNECTION_URI (docs/ADR012-auth.md §11). The
        # real relay URI rides the out-of-band `kratos` Secret key `smtpConnectionURI`
        # (scripts/auth-secrets.sh, .env `KRATOS_COURIER_SMTP_URI`); the chart strips
        # this placeholder from the rendered ConfigMap, so nothing leaks into git.
        connection_uri: set-via-secret
        from_address: no-reply@bex.co
        from_name: bex
    selfservice:
      default_browser_return_url: https://auth.bex.co/
      # dashboard.bex.co is the "custom UI" for every self-service flow (docs/ADR012-auth.md);
      # without these, Kratos redirects flows back to its own domain instead.
      allowed_return_urls:
        - https://dashboard.bex.co
        # Hydra's device flow returns the browser to its public verifier after
        # Kratos accepts the login challenge. Without this issuer origin,
        # `render login` fails with self_service_flow_return_to_forbidden.
        - https://oauth.bex.co
        # Local dashboard dev against this prod Kratos (dashboard/README.md
        # "Local dev against prod" — the Vite /kratos proxy). Only a return-URL
        # allowlist entry: redirecting a user to their own localhost is
        # harmless, and CORS/cookies stay locked down (the proxy is same-origin).
        - http://localhost:5173
      # Second-factor MFA (w4/m11, docs/ADR012-auth.md § MFA). password stays the sole
      # first factor; totp/webauthn/lookup_secret are second factors that only
      # come into play once the AAL policy below demands aal2 (i.e. after a user
      # enrolls one) — a password-only user's login is untouched.
      methods:
        password:
          enabled: true # explicit: the only first factor
        code:
          # One-time email codes — the delivery method for recovery + verification
          # (docs/ADR012-auth.md §11). passwordless_enabled stays false (chart default), so
          # this never adds a "sign in with a code" option to login; it only backs
          # the recovery/verification flows' `use: code` below.
          enabled: true
        totp:
          enabled: true
          config:
            # Names the entry in the user's authenticator app (issuer field of
            # the otpauth:// URI). Human-facing only; safe to read, never secret.
            issuer: bex
        webauthn:
          enabled: true
          config:
            # SECOND factor, not passwordless: passkey/first-factor mode
            # (`passwordless: true`) and Kratos's separate `passkey` method
            # cannot satisfy an aal2 challenge — the whole point of this
            # milestone. Do not flip this to true (docs/ADR012-auth.md § MFA).
            passwordless: false
            rp:
              # RP ID must be a registrable parent of every origin that runs
              # the WebAuthn ceremony (dashboard.bex.co, auth.bex.co) — bex.co
              # is that parent. RP-ID-is-forever: changing it later invalidates
              # every already-registered security key (docs/ADR012-auth.md § MFA). The
              # local overlay overrides id→localhost, origins→localhost:5173.
              id: bex.co
              display_name: bex
              origins:
                - https://dashboard.bex.co
        lookup_secret:
          enabled: true # recovery codes: MFA + lost device ≠ lockout
      flows:
        login:
          ui_url: https://dashboard.bex.co/auth/login
        registration:
          enabled: true
          ui_url: https://dashboard.bex.co/auth/sign-up
          # Kratos doesn't auto-issue a session after registration unless told
          # to — without this hook the user registers successfully but lands
          # back at the login screen with no session.
          after:
            password:
              hooks:
                - hook: session
        recovery:
          # Live end-to-end (w4/m7): the courier below delivers the one-time code,
          # the dashboard's forgot-password → reset-password pages complete it
          # (docs/ADR012-auth.md §11).
          enabled: true
          use: code
          ui_url: https://dashboard.bex.co/auth/forgot-password
        settings:
          ui_url: https://dashboard.bex.co/settings
          # A user who has a second factor must present it (aal2) before
          # changing security-sensitive settings; password-only users keep
          # aal1. Matches session.whoami.required_aal below (w4/m11).
          required_aal: highest_available
        verification:
          # Enabled (w4/m7): registration now triggers a verification email
          # (docs/ADR012-auth.md §11). NOTE: the dashboard has no auth.verification route
          # yet, so the emailed link dead-ends on the catch-all — verification is
          # proven via the API flow (scripts/auth-mail-e2e.sh); the Ory Elements
          # page is a tracked follow-up. Keep the ui_url so it's ready when it lands.
          enabled: true
          use: code
          ui_url: https://dashboard.bex.co/auth/verification
        error:
          ui_url: https://dashboard.bex.co/auth/error
    session:
      # `highest_available` (w4/m11): a session is only "fully authenticated"
      # (whoami 200) at the highest AAL the identity CAN reach — so a user who
      # enrolled a second factor must complete it (aal2), while a password-only
      # identity stays satisfied at aal1. This is what makes enrollment turn
      # login into a two-step challenge; it never affects users without a
      # second factor.
      whoami:
        required_aal: highest_available
      cookie:
        # Scopes the session cookie to every *.bex.co subdomain so it's sent
        # as same-site (not cross-site) from dashboard.bex.co to auth.bex.co —
        # avoids needing the weaker SameSite=None.
        domain: bex.co
        same_site: Lax

# Run the courier — the separate `kratos courier watch` StatefulSet that actually
# sends the verification/recovery mail (w4/m7, docs/ADR012-auth.md §11). The SMTP relay
# URI is delivered via the `kratos` Secret (key smtpConnectionURI); the gate is the
# non-secret courier.smtp.connection_uri placeholder under kratos.config above.
courier:
  enabled: true

# The courier StatefulSet schedules independently of the server Deployment and the
# migration Job, so — like the `deployment:`/`job:` pins below (w1/m19) — it needs
# its own platform-pool pin, or `courier.enabled` lands it on the untainted tenant
# pool where it would die with a tenant scale-down.
statefulSet:
  nodeSelector:
    bex.co/pool: platform
  tolerations:
    - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }

# w1/m19 t003: platform pool — the server Deployment and the automigration Job
# schedule independently, so each needs the pin.
deployment:
  nodeSelector:
    bex.co/pool: platform
  tolerations:
    - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
  # Social login (w4/003, docs/ADR012-auth.md § Social login): load a SECOND Kratos
  # config file carrying the `oidc` method's GitHub provider. Its client_secret
  # is secret material, so it can't live in these git-committed values — instead
  # scripts/auth-secrets.sh writes an `oidc.yaml` fragment into the out-of-band
  # `kratos` Secret (always present: the GitHub provider when BEX_GITHUB_OIDC_* are
  # set in .env, else `enabled: false`), which Kratos merges over the main
  # config. Kratos accepts repeated --config flags and deep-merges them.
  extraArgs:
    - --config
    - /etc/config-oidc/oidc.yaml
  extraVolumes:
    - name: kratos-oidc
      secret:
        secretName: kratos
        items:
          - key: oidc.yaml
            path: oidc.yaml
  extraVolumeMounts:
    - name: kratos-oidc
      mountPath: /etc/config-oidc
      readOnly: true
job:
  nodeSelector:
    bex.co/pool: platform
  tolerations:
    - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }

ingress:
  public:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: auth.bex.co
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: kratos-public-tls
        hosts:
          - auth.bex.co
  admin:
    enabled: false # chart default, pinned: the admin API must never get an ingress
