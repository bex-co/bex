# Ory Kratos values (chart 0.62.1). No secret material here: the chart's built-in
# Secret is disabled and everything sensitive (dsn, secretsDefault, secretsCookie,
# secretsCipher) comes from the out-of-band `kratos` Secret created by
# scripts/auth-secrets.sh. Public endpoint is exposed at auth.<base-domain> via
# Traefik + cert-manager; the admin API stays cluster-internal (no ingress).

secret:
  enabled: false # do NOT let the chart render a Secret into git/Argo state
  nameOverride: kratos # created out-of-band by scripts/auth-secrets.sh

kratos:
  automigration:
    enabled: true # `kratos migrate sql` job against kratos-db on install/upgrade

  identitySchemas:
    "identity.schema.json": |
      {
        "$id": "https://schemas.bex.co/identity.schema.json",
        "$schema": "http://json-schema.org/draft-07/schema#",
        "title": "Person",
        "type": "object",
        "properties": {
          "traits": {
            "type": "object",
            "properties": {
              "email": {
                "type": "string",
                "format": "email",
                "title": "E-Mail",
                "ory.sh/kratos": {
                  "credentials": { "password": { "identifier": true } },
                  "verification": { "via": "email" },
                  "recovery": { "via": "email" }
                }
              }
            },
            "required": ["email"],
            "additionalProperties": false
          }
        }
      }

  config:
    # Native Hydra bridge (w4/m9, docs/auth.md): with the admin URL set, Kratos
    # itself resolves + accepts Hydra login challenges — a login/registration
    # flow carrying ?login_challenge= links to the OAuth2 request, and an
    # existing session (skip=true) is accepted with no UI. No custom login
    # provider exists anywhere (DO_NOT_DO.md). override_return_to keeps the
    # browser returning to Hydra's authorize URL across flows.
    oauth2_provider:
      url: http://hydra-admin.auth.svc:4445
      override_return_to: true
    serve:
      public:
        base_url: https://auth.bex.co/
        cors:
          enabled: true # dashboard.bex.co is a different origin — needs explicit CORS + credentials
          allowed_origins:
            - https://dashboard.bex.co
          allow_credentials: true
    identity:
      default_schema_id: default
      schemas:
        - id: default
          url: file:///etc/config/identity.schema.json
    selfservice:
      default_browser_return_url: https://auth.bex.co/
      # dashboard.bex.co is the "custom UI" for every self-service flow (docs/auth.md);
      # without these, Kratos redirects flows back to its own domain instead.
      allowed_return_urls:
        - https://dashboard.bex.co
        # Local dashboard dev against this prod Kratos (dashboard/README.md
        # "Local dev against prod" — the Vite /kratos proxy). Only a return-URL
        # allowlist entry: redirecting a user to their own localhost is
        # harmless, and CORS/cookies stay locked down (the proxy is same-origin).
        - http://localhost:5173
      flows:
        login:
          ui_url: https://dashboard.bex.co/auth/login
        registration:
          enabled: true
          ui_url: https://dashboard.bex.co/auth/sign-up
          # Kratos doesn't auto-issue a session after registration unless told
          # to — without this hook the user registers successfully but lands
          # back at the login screen with no session.
          after:
            password:
              hooks:
                - hook: session
        recovery:
          # Flow initializes but can't deliver mail until courier.smtp lands
          # (courier is disabled below) — see docs/auth.md consequences.
          enabled: true
          ui_url: https://dashboard.bex.co/auth/forgot-password
        settings:
          ui_url: https://dashboard.bex.co/settings
        verification:
          enabled: false
          ui_url: https://dashboard.bex.co/auth/verification
        error:
          ui_url: https://dashboard.bex.co/auth/error
    session:
      cookie:
        # Scopes the session cookie to every *.bex.co subdomain so it's sent
        # as same-site (not cross-site) from dashboard.bex.co to auth.bex.co —
        # avoids needing the weaker SameSite=None.
        domain: bex.co
        same_site: Lax

# No SMTP is configured yet, so don't run the courier (it sends the
# verification/recovery mail); enable it together with courier.smtp when
# email flows land.
courier:
  enabled: false

ingress:
  public:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: auth.bex.co
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: kratos-public-tls
        hosts:
          - auth.bex.co
  admin:
    enabled: false # chart default, pinned: the admin API must never get an ingress
