          },
          "panels": [
            {
              "id": 101,
              "type": "text",
              "title": "Customer inventory, growth, and provisioning health",
              "gridPos": {
                "x": 0,
                "y": 0,
                "w": 24,
                "h": 4
              },
              "options": {
                "mode": "markdown",
                "content": "Inventory ≠ uptime. Gaps mean unknown. Unclassified included by default. [Definitions](https://github.com/bex-co/bex/blob/main/docs/runbooks/product-analytics.md)."
              }
            },
            {
              "id": 102,
              "title": "Collection coverage — as of selected end (global)",
              "type": "table",
              "description": "All audiences and types; intentionally ignores product filters. Each source has its own freshness. Unknown state never removes a resource from inventory.",
              "gridPos": {
                "x": 0,
                "y": 4,
                "w": 24,
                "h": 6
              },
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "product-analytics"
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "product-analytics"
                  },
                  "rawSql": "WITH sources(source) AS (VALUES ('services'),('postgres'),('keyvalue'),('domains'))\nSELECT s.source AS \"Source\",b.observed_at AS \"Latest observation\",\n EXTRACT(epoch FROM ($__timeTo()::timestamptz-b.observed_at)) AS \"Age\",\n CASE WHEN b.bucket IS NULL THEN 'No data' WHEN b.observed_at<$__timeTo()::timestamptz-interval '15 minutes' THEN 'Stale'\n      WHEN NOT b.complete THEN 'Collection failed' ELSE 'Complete' END AS \"Inventory coverage\",\n CASE WHEN b.complete THEN COALESCE(sum(i.resources),0) END AS \"Resources\",\n CASE WHEN b.complete THEN COALESCE(sum(i.resources) FILTER(WHERE i.state IN ('unknown','verified_tls_unknown')),0) END AS \"Unknown state\",\n count(DISTINCT i.workspace_id) FILTER(WHERE i.audience='unclassified') AS \"Unclassified workspaces\"\nFROM sources s LEFT JOIN LATERAL\n (SELECT * FROM product_analytics.inventory_batches b WHERE b.source=s.source AND b.observed_at<=$__timeTo()::timestamptz\n  ORDER BY b.bucket DESC LIMIT 1) b ON true\nLEFT JOIN product_analytics.inventory i ON i.source=b.source AND i.bucket=b.bucket\nGROUP BY s.source,b.observed_at,b.bucket,b.complete ORDER BY s.source",
                  "format": "table",
                  "rawQuery": true,
                  "editorMode": "code"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "decimals": 0,
                  "noValue": "—",
                  "custom": {
                    "align": "auto",
                    "cellOptions": {
                      "type": "auto"
                    },
                    "inspect": false
                  }
                },
                "overrides": [
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "Age"
                    },
                    "properties": [
                      {
                        "id": "unit",
                        "value": "s"
                      },
                      {
                        "id": "decimals",
                        "value": 1
                      }
                    ]
                  },
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "Latest observation"
                    },
                    "properties": [
                      {
                        "id": "unit",
                        "value": "dateTimeAsIso"
                      }
                    ]
                  },
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "Source"
                    },
                    "properties": [
                      {
                        "id": "custom.width",
                        "value": 100
                      }
                    ]
                  },
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "Latest observation"
                    },
                    "properties": [
                      {
                        "id": "custom.width",
                        "value": 185
                      }
                    ]
