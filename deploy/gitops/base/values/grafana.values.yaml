                  "format": "table",
                  "rawQuery": true,
                  "rawSql": "SELECT command AS \"Command\", duration_mode AS \"Mode\", count(duration_ms) AS \"Samples\", percentile_cont(0.5) WITHIN GROUP (ORDER BY duration_ms) AS \"p50\", percentile_cont(0.95) WITHIN GROUP (ORDER BY duration_ms) AS \"p95\" FROM cli_analytics.events WHERE $__timeFilter(received_at) AND ('__all' IN (${command:sqlstring}) OR command IN (${command:sqlstring})) AND ('__all' IN (${version:sqlstring}) OR upstream_version IN (${version:sqlstring})) AND ('__all' IN (${bexrelease:sqlstring}) OR bex_version IN (${bexrelease:sqlstring})) AND ('__all' IN (${output:sqlstring}) OR output_format IN (${output:sqlstring})) AND duration_ms IS NOT NULL GROUP BY command, duration_mode ORDER BY count(duration_ms) DESC, command, duration_mode LIMIT 50"
                }
