                  "format": "table",
                  "rawQuery": true,
                  "rawSql": "SELECT bex_version AS \"Bex release\", count(DISTINCT installation_id) AS \"Installations\", count(DISTINCT workspace_id) AS \"Workspaces\", count(*) AS \"Commands\", min(received_at) AS \"First seen\", max(received_at) AS \"Last seen\" FROM cli_analytics.events WHERE $__timeFilter(received_at) AND ('__all' IN (${command:sqlstring}) OR command IN (${command:sqlstring})) AND ('__all' IN (${version:sqlstring}) OR upstream_version IN (${version:sqlstring})) AND ('__all' IN (${bexrelease:sqlstring}) OR bex_version IN (${bexrelease:sqlstring})) AND ('__all' IN (${output:sqlstring}) OR output_format IN (${output:sqlstring})) GROUP BY bex_version ORDER BY count(*) DESC, bex_version"
                }
              ],
              "options": {
                "showHeader": true,
                "cellHeight": "sm",
                "footer": {
                  "show": false
                }
              }
            }
          ]
        }
# No bats test pod — the same minimal posture as loki.yaml (no canary, no
# self-monitoring): datasource/SQL tests run in the GitOps CI workflow.
testFramework:
  enabled: false

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }

# w1/m19 t003: platform pool, like every monitoring sibling.
nodeSelector:
  bex.co/pool: platform
tolerations:
  - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
