              },
              "transformations": [
                {
                  "id": "organize",
                  "options": {
                    "indexByName": {
                      "Source": 0,
                      "Inventory coverage": 1,
                      "Age": 2,
                      "Latest observation": 3,
                      "Resources": 4,
                      "Unknown state": 5,
                      "Unclassified workspaces": 6
                    }
                  }
                }
              ]
            },
            {
              "id": 103,
              "title": "Services over time",
              "type": "timeseries",
              "description": "Last complete sample within 15 minutes of each bucket end (selected end for the partial final bucket). Missing/failed collections are gaps, not zeros. Inventory includes unavailable and suspended resources. No pre-collection backfill. Min interval is automatically coarsened for long ranges (at most 1,001 points per series).",
              "gridPos": {
                "x": 0,
                "y": 10,
                "w": 12,
                "h": 9
              },
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "product-analytics"
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "product-analytics"
                  },
                  "rawSql": "WITH kinds(resource_type,source) AS (VALUES\n ('static_site','services'),('web_service','services'),('private_service','services'),\n ('background_worker','services'),('cron_job','services'),('postgres','postgres'),('keyvalue','keyvalue')),\nselected_kinds AS (SELECT * FROM kinds WHERE ('__all' IN (${kind:sqlstring}) OR resource_type IN (${kind:sqlstring}))),requested_bounds AS (SELECT $__timeFrom()::timestamptz lo,$__timeTo()::timestamptz hi),\nbounds AS (SELECT lo,hi,GREATEST(\n CASE ${resolution:sqlstring} WHEN '5 minutes' THEN interval '5 minutes' WHEN '1 hour' THEN interval '1 hour' ELSE interval '1 day' END,\n CASE WHEN hi-lo<=interval '3 days' THEN interval '5 minutes'\n      WHEN hi-lo<=interval '40 days' THEN interval '1 hour'\n      ELSE GREATEST(1,ceil(extract(epoch FROM hi-lo)/86400/1000)) * interval '1 day' END) step\n FROM requested_bounds),\npoints AS (SELECT LEAST(t+step,hi) AS time,GREATEST(t,lo) AS from_time FROM bounds,\n LATERAL generate_series(date_bin(step,lo,'2000-01-01'::timestamptz),hi,step) t WHERE t<hi),\nsources AS (SELECT DISTINCT source AS source FROM selected_kinds),\nsamples AS (SELECT p.time,s.source,b.bucket,b.complete AND b.observed_at>=p.time-interval '15 minutes' AS valid\n FROM points p CROSS JOIN sources s LEFT JOIN LATERAL\n (SELECT * FROM product_analytics.inventory_batches b WHERE b.source=s.source AND b.bucket<=p.time\n   AND b.observed_at<=p.time ORDER BY b.bucket DESC LIMIT 1) b ON true),\nscoped AS (SELECT * FROM product_analytics.inventory WHERE ('__all' IN (${audience:sqlstring}) OR audience IN (${audience:sqlstring})) AND ('__all' IN (${kind:sqlstring}) OR resource_type IN (${kind:sqlstring})))\nSELECT s.time,k.resource_type AS metric,\n CASE WHEN s.valid THEN COALESCE(sum(i.resources),0) END AS value\nFROM samples s JOIN selected_kinds k ON k.source=s.source\nLEFT JOIN scoped i ON i.source=s.source AND i.bucket=s.bucket AND i.resource_type=k.resource_type\nWHERE k.source='services' GROUP BY s.time,k.resource_type,s.valid ORDER BY s.time,metric",
