            {
              "id": 109,
              "title": "Provisioning progress — created in range",
              "type": "table",
              "description": "Resources created after inventory collection began and first seen by the selected end. Reached ready means first OBSERVED ready, not proof of continuous health. Removed before ready is not a canceled deployment. Unresolved includes provisioning, failed, suspended and missing observations. Resources created and removed between snapshots may not appear.",
              "gridPos": {
