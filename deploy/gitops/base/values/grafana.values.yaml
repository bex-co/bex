            {
              "id": 111,
              "title": "Inventory at range end — with seven-day net change",
              "type": "table",
              "description": "Both endpoints require a complete fresh snapshot. Net change is NULL when either endpoint is unknown; it is not gross creation count. Audience labels are applied consistently using current classification. Workspace counts overlap by feature.",
              "gridPos": {
                "x": 0,
                "y": 55,
                "w": 24,
                "h": 9
              },
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "product-analytics"
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "product-analytics"
                  },
                  "rawSql": "WITH kinds(resource_type,source) AS (VALUES\n ('static_site','services'),('web_service','services'),('private_service','services'),\n ('background_worker','services'),('cron_job','services'),('postgres','postgres'),('keyvalue','keyvalue')),\nselected_kinds AS (SELECT * FROM kinds WHERE ('__all' IN (${kind:sqlstring}) OR resource_type IN (${kind:sqlstring}))),\npoints AS (SELECT $__timeTo()::timestamptz AS time UNION ALL SELECT $__timeTo()::timestamptz-interval '7 days'),\ncounts AS (\n SELECT k.resource_type,p.time,b.complete AND b.observed_at>=p.time-interval '15 minutes' AS valid,\n COALESCE(sum(i.resources),0) AS resources,count(DISTINCT i.workspace_id) AS workspaces\n FROM selected_kinds k CROSS JOIN points p LEFT JOIN LATERAL\n (SELECT * FROM product_analytics.inventory_batches b WHERE b.source=k.source AND b.observed_at<=p.time ORDER BY bucket DESC LIMIT 1) b ON true\n LEFT JOIN product_analytics.inventory i ON i.source=k.source AND i.bucket=b.bucket AND i.resource_type=k.resource_type AND ('__all' IN (${audience:sqlstring}) OR i.audience IN (${audience:sqlstring}))\n GROUP BY k.resource_type,p.time,b.complete,b.observed_at)\nSELECT n.resource_type AS \"Type\",CASE WHEN n.valid THEN n.resources END AS \"At range end\",\n CASE WHEN n.valid THEN n.workspaces END AS \"Owning workspaces\",\n CASE WHEN n.valid AND o.valid THEN n.resources-o.resources END AS \"7-day net change\"\nFROM counts n JOIN counts o USING(resource_type)\nWHERE n.time=$__timeTo()::timestamptz AND o.time=n.time-interval '7 days' ORDER BY n.resource_type",
                  "format": "table",
                  "rawQuery": true,
                  "editorMode": "code"
                }
