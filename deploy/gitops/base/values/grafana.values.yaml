                  "custom": {
                    "drawStyle": "line",
                    "lineWidth": 2,
                    "fillOpacity": 10,
                    "spanNulls": false
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "cli-analytics"
                  },
                  "format": "time_series",
                  "rawQuery": true,
                  "rawSql": "WITH days AS (SELECT generate_series(date_trunc('day', $__timeFrom()::timestamptz), date_trunc('day', $__timeTo()::timestamptz), interval '1 day') AS day), events AS (SELECT * FROM cli_analytics.events WHERE $__timeFilter(received_at) AND ('__all' IN (${command:sqlstring}) OR command IN (${command:sqlstring})) AND ('__all' IN (${version:sqlstring}) OR upstream_version IN (${version:sqlstring})) AND ('__all' IN (${bexrelease:sqlstring}) OR bex_version IN (${bexrelease:sqlstring})) AND ('__all' IN (${output:sqlstring}) OR output_format IN (${output:sqlstring}))), first_seen AS (SELECT installation_id, min(received_at) AS first_at FROM cli_analytics.events WHERE installation_id IS NOT NULL AND received_at <= $__timeTo()::timestamptz AND ('__all' IN (${command:sqlstring}) OR command IN (${command:sqlstring})) AND ('__all' IN (${version:sqlstring}) OR upstream_version IN (${version:sqlstring})) AND ('__all' IN (${bexrelease:sqlstring}) OR bex_version IN (${bexrelease:sqlstring})) AND ('__all' IN (${output:sqlstring}) OR output_format IN (${output:sqlstring})) GROUP BY installation_id) SELECT d.day AS time, count(DISTINCT e.installation_id) FILTER (WHERE f.first_at >= d.day) AS \"First seen\", count(DISTINCT e.installation_id) FILTER (WHERE f.first_at < d.day) AS \"Returning\" FROM days d LEFT JOIN events e ON e.received_at >= d.day AND e.received_at < d.day + interval '1 day' LEFT JOIN first_seen f USING (installation_id) GROUP BY d.day ORDER BY d.day"
                }
              ],
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            },
            {
              "id": 13,
              "title": "Next-week return — mature cohorts",
              "type": "table",
              "description": "UTC calendar-week cohorts based on first observation under the selected filters in retained history. Week 1 = any activity in the next calendar week. Only cohorts whose entire next week has elapsed at the selected end are shown. Recent installs are not failures; no mature cohort means no data.",
              "gridPos": {
                "x": 12,
                "y": 34,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "cli-analytics"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "noValue": "No observations",
                  "color": {
                    "mode": "palette-classic"
                  }
                },
                "overrides": [
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "Week 1 return"
                    },
                    "properties": [
                      {
                        "id": "unit",
                        "value": "percentunit"
                      }
                    ]
                  }
                ]
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "cli-analytics"
                  },
                  "format": "table",
                  "rawQuery": true,
                  "rawSql": "WITH first_seen AS (SELECT installation_id, min(received_at) AS first_at FROM cli_analytics.events WHERE installation_id IS NOT NULL AND received_at <= $__timeTo()::timestamptz AND ('__all' IN (${command:sqlstring}) OR command IN (${command:sqlstring})) AND ('__all' IN (${version:sqlstring}) OR upstream_version IN (${version:sqlstring})) AND ('__all' IN (${bexrelease:sqlstring}) OR bex_version IN (${bexrelease:sqlstring})) AND ('__all' IN (${output:sqlstring}) OR output_format IN (${output:sqlstring})) GROUP BY installation_id), cohorts AS (SELECT installation_id, date_trunc('week', first_at) AS cohort FROM first_seen), activity AS (SELECT DISTINCT installation_id, date_trunc('week', received_at) AS week FROM cli_analytics.events WHERE installation_id IS NOT NULL AND received_at >= date_trunc('week', $__timeFrom()::timestamptz) + interval '7 days' AND received_at <= $__timeTo()::timestamptz AND ('__all' IN (${command:sqlstring}) OR command IN (${command:sqlstring})) AND ('__all' IN (${version:sqlstring}) OR upstream_version IN (${version:sqlstring})) AND ('__all' IN (${bexrelease:sqlstring}) OR bex_version IN (${bexrelease:sqlstring})) AND ('__all' IN (${output:sqlstring}) OR output_format IN (${output:sqlstring}))) SELECT c.cohort AS \"Cohort (UTC)\", count(*) AS \"Installations\", count(a.installation_id) AS \"Returned next week\", count(a.installation_id)::float / count(*) AS \"Week 1 return\" FROM cohorts c LEFT JOIN activity a ON a.installation_id = c.installation_id AND a.week = c.cohort + interval '7 days' WHERE c.cohort >= date_trunc('week', $__timeFrom()::timestamptz) AND c.cohort + interval '14 days' <= $__timeTo()::timestamptz GROUP BY c.cohort ORDER BY c.cohort"
                }
              ],
              "options": {
                "showHeader": true,
                "cellHeight": "sm",
                "footer": {
                  "show": false
                }
              }
            },
            {
              "id": 14,
              "title": "Daily / 7-day / 30-day active installations",
              "type": "timeseries",
              "description": "Distinct installations in trailing 1/7/30 days, evaluated at each UTC day end (or selected end for the partial day). Reads up to 30 days before the visible range; retained history limits coverage. Values are not additive.",
              "gridPos": {
