              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "cli-analytics"
                  },
                  "format": "time_series",
                  "rawQuery": true,
                  "rawSql": "WITH days AS (SELECT generate_series(date_trunc('day', $__timeFrom()::timestamptz), date_trunc('day', $__timeTo()::timestamptz), interval '1 day') AS day), events AS (SELECT installation_id, received_at FROM cli_analytics.events WHERE installation_id IS NOT NULL AND received_at >= $__timeFrom()::timestamptz - interval '30 days' AND received_at <= $__timeTo()::timestamptz AND ('__all' IN (${command:sqlstring}) OR command IN (${command:sqlstring})) AND ('__all' IN (${version:sqlstring}) OR upstream_version IN (${version:sqlstring})) AND ('__all' IN (${bexrelease:sqlstring}) OR bex_version IN (${bexrelease:sqlstring})) AND ('__all' IN (${output:sqlstring}) OR output_format IN (${output:sqlstring}))) SELECT d.day AS time, count(DISTINCT e.installation_id) FILTER (WHERE e.received_at > LEAST(d.day + interval '1 day', $__timeTo()::timestamptz) - interval '1 day') AS \"1 day\", count(DISTINCT e.installation_id) FILTER (WHERE e.received_at > LEAST(d.day + interval '1 day', $__timeTo()::timestamptz) - interval '7 days') AS \"7 days\", count(DISTINCT e.installation_id) AS \"30 days\" FROM days d LEFT JOIN events e ON e.received_at > LEAST(d.day + interval '1 day', $__timeTo()::timestamptz) - interval '30 days' AND e.received_at <= LEAST(d.day + interval '1 day', $__timeTo()::timestamptz) GROUP BY d.day ORDER BY d.day"
                }
