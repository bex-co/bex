                "type": "custom",
                "query": "1 day,1 hour,5 minutes",
                "current": {
                  "text": "1 day",
                  "value": "1 day"
                },
                "options": [
                  {
                    "text": "1 day",
                    "value": "1 day",
                    "selected": true
                  },
                  {
                    "text": "1 hour",
                    "value": "1 hour",
                    "selected": false
                  },
                  {
                    "text": "5 minutes",
                    "value": "5 minutes",
                    "selected": false
                  }
                ],
                "multi": false,
                "includeAll": false
              }
