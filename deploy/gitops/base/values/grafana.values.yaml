                      "rawSql": "WITH cohort AS (SELECT workspace_id,created_at FROM product_analytics.workspaces WHERE ('__all' IN (${audience:sqlstring}) OR audience IN (${audience:sqlstring})) AND $__timeFilter(created_at) AND created_at >= (SELECT started_at FROM product_analytics.collection) AND created_at+interval '7 days'<=$__timeTo()::timestamptz),\nsteps AS (SELECT c.*,min(e.at) FILTER(WHERE e.event_type='created') AS first_create,min(e.at) FILTER(WHERE e.event_type='deploy_finished' AND e.outcome='succeeded') AS first_live FROM cohort c LEFT JOIN product_analytics.events e ON e.workspace_id=c.workspace_id AND e.resource_type IN ('static_site','web_service','private_service','background_worker','cron_job') AND ('__all' IN (${kind:sqlstring}) OR e.resource_type IN (${kind:sqlstring})) AND e.at>=c.created_at AND e.at<=c.created_at+interval '7 days' GROUP BY c.workspace_id,c.created_at)\nSELECT count(*) AS \"Mature workspaces\",count(first_create) AS \"Created a service\",count(first_live) AS \"Reached live\",count(first_live)::float/NULLIF(count(*),0) AS \"Activation rate\",percentile_cont(0.5) WITHIN GROUP(ORDER BY EXTRACT(epoch FROM first_live-created_at)) FILTER(WHERE first_live IS NOT NULL) AS \"p50 time to live\" FROM steps"
