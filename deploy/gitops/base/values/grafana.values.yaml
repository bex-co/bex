            {
              "id": 104,
              "title": "Datastores over time",
              "type": "timeseries",
              "description": "Last complete sample within 15 minutes of each bucket end (selected end for the partial final bucket). Missing/failed collections are gaps, not zeros. Inventory includes unavailable and suspended resources. No pre-collection backfill. Counts come from complete authoritative CR lists; a stale health sample cannot delete a datastore. Min interval is automatically coarsened for long ranges (at most 1,001 points per series).",
              "gridPos": {
