            {
              "id": 110,
              "title": "First observed readiness — timing and unfinished age",
              "type": "table",
              "description": "Creation to first sampled ready is an upper-bound observation, normally up to five minutes late and longer across gaps. p95 is withheld below 20 completed samples. Oldest unresolved prevents completed-only latency from hiding unfinished work. Legacy resources are excluded.",
              "gridPos": {
                "x": 0,
                "y": 46,
                "w": 24,
                "h": 9
              },
              "datasource": {
                "type": "grafana-postgresql-datasource",
