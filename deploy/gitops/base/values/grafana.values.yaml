# Grafana values — the platform observability UI (docs/ADR088-platform-observability-ui.md).
# This file is the LOCAL/base shape (ADR088 §5): break-glass admin login only,
# no OIDC, no public host. The prod overlay
# (overlays/prod/values/grafana.values.yaml) layers the obs.bex.co ingress and
# Hydra generic-OAuth on top — Argo merges valueFiles in order, later wins.
#
# Zero click-ops state (ADR088 §1): datasources and dashboards are provisioned
# from this file, so a rebuilt pod converges to git with nothing to restore.

fullnameOverride: grafana # => Service `grafana` on :80 (pod :3000)

# STATELESS by choice — contrast loki.yaml/prometheus.yaml, whose PVCs hold
# telemetry history that exists nowhere else. Everything Grafana needs to serve
# is file-provisioned above/below, and the telemetry it renders lives in
# Prometheus/Loki; its embedded sqlite would accumulate only click-ops residue
# (hand-edited dashboards, annotations, preferences) that ADR088 §1 rules out
# as state we refuse to depend on. Losing that on a reschedule is the point,
# not a defect: OIDC org users are simply re-created at next login, and every
# dashboard change must land here in git to survive — exactly the pressure we
# want.
persistence:
  enabled: false

# Break-glass local admin (ADR088 §3): credentials come from the out-of-band
# Secret `grafana-admin` in `monitoring` (keys `admin-user`/`admin-password`) —
# SealedSecret custody in prod (docs/ADR016-sealed-secrets.md), a plain
# `kubectl -n monitoring create secret generic grafana-admin ...` on the
# disposable local mock. Never a value in git — the same custody rule as
# prometheus.yaml's `alertmanager-smtp`. Until the Secret exists the pod waits
# in CreateContainerConfigError: a deliberate one-time bootstrap step (and,
# unlike the SMTP key, one local can mint without any external credential).
admin:
  existingSecret: grafana-admin

grafana.ini:
  analytics:
    check_for_updates: false
    reporting_enabled: false
  news:
    news_feed_enabled: false
  users:
    # No self-serve accounts: admission is the ops-workspace consent gate in
    # prod (ADR088 §4) or the break-glass admin above — never a signup form.
    allow_sign_up: false

# Datasources as code — the two backends this UI exists to read (ADR088 §1),
# addressed by stable in-cluster DNS:
#   Prometheus — Service `prometheus-server` on :80 (prometheus.yaml
#     fullnameOverride; the same address bex-api uses as BEX_PROM_URL).
#   Loki — Service `loki` on :3100 (loki.yaml fullnameOverride; the same
#     address bex-api uses as BEX_LOKI_URL).
# Fixed uids so the committed dashboard JSON below can reference them
# deterministically; editable:false keeps the UI from minting runtime state the
# next sync would silently diverge from.
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc:80
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 15s # the edge/platform scrape cadence in prometheus.yaml
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc:3100
        editable: false

# Dashboards as code: a file provider reading the ConfigMap the `dashboards:`
# block renders. The set is the ADR088 §6 SLI baseline — one dashboard per §6
# row, built on the exact series the alert rules (prometheus.yaml) evaluate,
# with each alert's numeric threshold drawn as a threshold line on the panel
# that shows its backing series ("every alert gets a panel": an alert says
# broken, the panel answers how bad / since when / trending which way). Only
# bounded label sets appear, the same ones the rules query — never per-path/
# per-host/per-tenant-unbounded dimensions (the ADR010 cardinality rule).
#
# Absence is never health: count-of-bad-things panels coerce to 0 only behind
# a guard proving the backing telemetry is actually flowing (`or (count(<base
# or up series>) * 0)`), and every current-health stat tile queries INSTANT —
# Prometheus staleness (~5m) drops a vanished target from an instant query, so
# absence is representable at all instead of lastNotNull holding the last 1
# for the whole 6h window. On MULTI-target tiles Grafana's noValue fires only
# when NO display values remain, so one vanished source would silently drop
# while its siblings stay green — hence the per-target sentinel convention:
# each source queries `<expr> or on() vector(-1)` and the tile maps
# -1 → MISSING (red), 0 → down/unhealthy (red), 1 → healthy (green); legends
# on sentinel-capable targets are constant strings (never label-derived,
# vector(-1) carries no labels), and noValue stays as a second net.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: platform
        folder: Platform
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards/platform

dashboards:
  platform:
    # Platform availability (ADR088 §6 row 1, the landing page): is the
    # platform itself up — edge traffic/5xx/latency against TraefikHigh5xxRate's
    # 5% line, platform Deployment/pod health on the same namespace allowlist
    # the rules use, cert issuance+expiry, and the OpenBao seal gauge.
    platform-availability:
      json: |
        {
          "uid": "bex-platform-availability",
          "title": "Platform availability",
          "tags": ["bex", "platform"],
          "editable": false,
          "graphTooltip": 1,
          "timezone": "browser",
          "schemaVersion": 39,
          "refresh": "30s",
          "time": { "from": "now-6h", "to": "now" },
          "panels": [
            {
              "id": 1,
              "type": "timeseries",
              "title": "Edge request rate",
              "description": "All requests through the Traefik edge (traefik_service_requests_total — the same series behind bex-api's request metrics).",
              "gridPos": { "h": 9, "w": 12, "x": 0, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": { "unit": "reqps", "min": 0 },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(rate(traefik_service_requests_total[5m]))",
                  "legendFormat": "all"
                },
                {
                  "refId": "B",
                  "expr": "sum(rate(traefik_service_requests_total{code=~\"5..\"}[5m]))",
                  "legendFormat": "5xx"
                }
              ]
            },
            {
              "id": 2,
              "type": "timeseries",
              "title": "Edge 5xx ratio",
              "description": "Share of ALL edge responses that are 5xx. The red line marks TraefikHigh5xxRate's 5% threshold; the alert additionally requires >0.1 req/s aggregate traffic for 10m, so a red excursion under lighter traffic does not page. Healthy tenant traffic can dilute a platform-service outage below this line — see the per-service panel below.",
              "gridPos": { "h": 9, "w": 12, "x": 12, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 0.05 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(rate(traefik_service_requests_total{code=~\"5..\"}[5m])) / sum(rate(traefik_service_requests_total[5m]))",
                  "legendFormat": "5xx ratio"
                }
              ]
            },
            {
              "id": 3,
              "type": "logs",
              "title": "Edge 5xx request log (tenant + platform hosts)",
              "description": "Traefik access lines for 5xx responses across everything the log-shipper's type=request stream retains: tenant App hosts (labelled app=...) plus the bounded host allowlist — dashboard.bex.co (w4/m88) and the platform edge hosts api/oauth/auth/obs.bex.co (w5/053, ADR088 §6), each under a fixed namespace/service pair (service=bex-api|hydra|kratos|grafana|dashboard) — so a platform-API outage shows its failing requests here while the ratio panel climbs. The selector matches both label shapes. Lines exist only from the allowlist's deploy time forward (Loki retains nothing retroactively). host/path are line-only fields by cardinality design — filter with LogQL | json, never a label.",
              "gridPos": { "h": 10, "w": 24, "x": 0, "y": 9 },
              "datasource": { "type": "loki", "uid": "loki" },
              "options": {
                "showTime": true,
                "sortOrder": "Descending",
                "wrapLogMessage": false,
                "enableLogDetails": true,
                "dedupStrategy": "none"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "{type=\"request\", status=~\"5..\"}"
                }
              ]
            },
            {
              "id": 4,
              "type": "timeseries",
              "title": "Edge latency p50/p95/p99",
              "description": "Traefik service request duration quantiles across the whole edge (traefik_service_request_duration_seconds_bucket — the same histogram behind bex-api's latency metrics).",
              "gridPos": { "h": 9, "w": 12, "x": 0, "y": 19 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": { "unit": "s", "min": 0 },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "histogram_quantile(0.50, sum by (le) (rate(traefik_service_request_duration_seconds_bucket[5m])))",
                  "legendFormat": "p50"
                },
                {
                  "refId": "B",
                  "expr": "histogram_quantile(0.95, sum by (le) (rate(traefik_service_request_duration_seconds_bucket[5m])))",
                  "legendFormat": "p95"
                },
                {
                  "refId": "C",
                  "expr": "histogram_quantile(0.99, sum by (le) (rate(traefik_service_request_duration_seconds_bucket[5m])))",
                  "legendFormat": "p99"
                }
              ]
            },
            {
              "id": 5,
              "type": "timeseries",
              "title": "Platform deployments: missing replicas",
              "description": "Desired minus available replicas per platform Deployment — the PlatformDeploymentNotReady expression (fires at >0 for 10m; red line).",
              "gridPos": { "h": 9, "w": 12, "x": 12, "y": 19 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "kube_deployment_spec_replicas{namespace=~\"bex-system|argocd|traefik|auth|secrets|monitoring|cert-manager|cnpg-system|kube-system|bex-registry|opensandbox-system|dashboard\"} - on (namespace, deployment) kube_deployment_status_replicas_available",
                  "legendFormat": "{{namespace}}/{{deployment}}"
                }
              ]
            },
            {
              "id": 6,
              "type": "timeseries",
              "title": "Platform crashlooping containers",
              "description": "CrashLoopBackOff containers in the platform namespaces — the PlatformPodCrashLooping expression (fires at >0 for 10m; red line). Reads 0 only while kube-state-metrics is up; No data when it is not.",
              "gridPos": { "h": 9, "w": 6, "x": 0, "y": 28 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason=\"CrashLoopBackOff\", namespace=~\"bex-system|argocd|traefik|auth|secrets|monitoring|cert-manager|cnpg-system|kube-system|bex-registry|opensandbox-system|dashboard\"})) or (count(up{job=\"kube-state-metrics\"} == 1) * 0)",
                  "legendFormat": "crashlooping containers"
                }
              ]
            },
            {
              "id": 13,
              "type": "timeseries",
              "title": "Stranded node-local images",
              "description": "App pods in the shared default namespace waiting on ImagePullBackOff/ErrImageNeverPull — the StrandedNodeLocalImages expression (fires at >0 for 10m; red line). A tenant-node replacement or scale-down strands node-local ctr imports (no registry to re-pull from); re-import via the /deploy-app-from-local runbook. Reads 0 only while kube-state-metrics is up.",
              "gridPos": { "h": 9, "w": 6, "x": 6, "y": 28 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason=~\"ImagePullBackOff|ErrImageNeverPull\", namespace=\"default\"})) or (count(up{job=\"kube-state-metrics\"} == 1) * 0)",
                  "legendFormat": "stranded pods"
                }
              ]
            },
            {
              "id": 7,
              "type": "timeseries",
              "title": "Certificates not Ready (platform-paged)",
              "description": "Not-Ready cert-manager Certificates minus tenant custom-domain certs — the CertificateNotReady expression (customer-DNS certs are the info-level TenantCustomDomainCertNotReady, deliberately excluded here as they are there). Reads 0 only while the cert-manager exporter is up.",
              "gridPos": { "h": 9, "w": 6, "x": 12, "y": 28 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "count((certmanager_certificate_ready_status{condition=\"True\"} == 0) unless certmanager_certificate_ready_status{condition=\"True\", namespace=~\"tea-.*\", name=~\".+-tls-.+\", name!~\".*-tls-.*onbex\\\\.co.*\"}) or (count(up{job=\"cert-manager\"} == 1) * 0)",
                  "legendFormat": "not Ready"
                }
              ]
            },
            {
              "id": 15,
              "type": "timeseries",
              "title": "Tenant custom-domain certs not Ready (info)",
              "description": "The exact tenant-cert population the platform panel excludes — the TenantCustomDomainCertNotReady selector (severity info, routed to the null receiver: almost always the tenant's own DNS, e.g. a Cloudflare-proxied apex 404ing the ACME HTTP-01 solver, so it never pages on-call). The blast radius is the tenant's: their custom domain serves an invalid cert until their DNS points at bex per the ADR005 custom-domain flow, and the state is surfaced on their domain dashboard. Amber line at 1 (the alert fires at >0 for 1h); reads 0 only while the cert-manager exporter is up.",
              "gridPos": { "h": 9, "w": 6, "x": 18, "y": 28 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "orange", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "count(certmanager_certificate_ready_status{condition=\"True\", namespace=~\"tea-.*\", name=~\".+-tls-.+\", name!~\".*-tls-.*onbex\\\\.co.*\"} == 0) or (count(up{job=\"cert-manager\"} == 1) * 0)",
                  "legendFormat": "tenant certs not Ready"
                }
              ]
            },
            {
              "id": 8,
              "type": "stat",
              "title": "OpenBao seal state",
              "description": "Min of vault_core_unsealed over the raft members — the OpenBaoSealed expression (any member at 0 for 5m pages; sealed members 503 the tenant env-vars API). Instant query: a vanished member goes MISSING/red, never stale green.",
              "gridPos": { "h": 9, "w": 6, "x": 18, "y": 37 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
              "fieldConfig": {
                "defaults": {
                  "noValue": "MISSING",
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "red", "value": null },
                      { "color": "green", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "min({__name__=~\"(vault|bao)_core_unsealed\", namespace=\"secrets\"})",
                  "legendFormat": "unsealed (min over members)",
                  "instant": true,
                  "range": false
                }
              ]
            },
            {
              "id": 9,
              "type": "timeseries",
              "title": "Certificate time to expiry",
              "description": "certmanager_certificate_expiration_timestamp_seconds minus now, per Certificate. CertificateExpiringSoon warns under 14 days — below the green line is alert territory.",
              "gridPos": { "h": 9, "w": 9, "x": 0, "y": 37 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "red", "value": null },
                      { "color": "green", "value": 1209600 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "certmanager_certificate_expiration_timestamp_seconds - time()",
                  "legendFormat": "{{namespace}}/{{name}}"
                }
              ]
            },
            {
              "id": 11,
              "type": "timeseries",
              "title": "App cluster admin cert: days to estimated expiry",
              "description": "The CAPI-minted kubernetes-admin cert's ~1y validity, estimated from the bex-kubeconfig Secret's creation time — the AdminCertExpiringSoon expression in days. Warns under 30 days (green line); renewal runbook: ADR036.",
              "gridPos": { "h": 9, "w": 9, "x": 9, "y": 37 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "d",
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "red", "value": null },
                      { "color": "green", "value": 30 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "(kube_secret_created{namespace=\"bex-capi\", secret=\"bex-kubeconfig\"} + 31536000 - time()) / 86400",
                  "legendFormat": "days to estimated expiry"
                }
              ]
            },
            {
              "id": 10,
              "type": "timeseries",
              "title": "Platform service 5xx ratio",
              "description": "Per-service 5xx ratio for the platform front doors (Traefik Ingress service labels <ns>-<svc>-<port>@kubernetes) — a full bex-api outage that healthy tenant traffic dilutes below the aggregate line is unmissable here. A 0 line means traffic is flowing with no errors; No data means genuinely no traffic/telemetry for that service (the 5xx counter alone never existing must not read as absence). Red line mirrors TraefikHigh5xxRate's 5% for reference; the alert itself evaluates only the aggregate, and low per-service traffic makes these ratios jumpy. obs is prod-only (Grafana's Ingress lives in the prod overlay).",
              "gridPos": { "h": 9, "w": 24, "x": 0, "y": 46 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 0.05 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "(sum(rate(traefik_service_requests_total{service=~\"bex-system-bex-api-.*\", code=~\"5..\"}[5m])) or (sum(rate(traefik_service_requests_total{service=~\"bex-system-bex-api-.*\"}[5m])) * 0)) / sum(rate(traefik_service_requests_total{service=~\"bex-system-bex-api-.*\"}[5m]))",
                  "legendFormat": "api"
                },
                {
                  "refId": "B",
                  "expr": "(sum(rate(traefik_service_requests_total{service=~\"dashboard-dashboard-.*\", code=~\"5..\"}[5m])) or (sum(rate(traefik_service_requests_total{service=~\"dashboard-dashboard-.*\"}[5m])) * 0)) / sum(rate(traefik_service_requests_total{service=~\"dashboard-dashboard-.*\"}[5m]))",
                  "legendFormat": "dashboard"
                },
                {
                  "refId": "C",
                  "expr": "(sum(rate(traefik_service_requests_total{service=~\"auth-hydra-public-.*\", code=~\"5..\"}[5m])) or (sum(rate(traefik_service_requests_total{service=~\"auth-hydra-public-.*\"}[5m])) * 0)) / sum(rate(traefik_service_requests_total{service=~\"auth-hydra-public-.*\"}[5m]))",
                  "legendFormat": "oauth"
                },
                {
                  "refId": "D",
                  "expr": "(sum(rate(traefik_service_requests_total{service=~\"auth-kratos-public-.*\", code=~\"5..\"}[5m])) or (sum(rate(traefik_service_requests_total{service=~\"auth-kratos-public-.*\"}[5m])) * 0)) / sum(rate(traefik_service_requests_total{service=~\"auth-kratos-public-.*\"}[5m]))",
                  "legendFormat": "auth"
                },
                {
                  "refId": "E",
                  "expr": "(sum(rate(traefik_service_requests_total{service=~\"monitoring-grafana-.*\", code=~\"5..\"}[5m])) or (sum(rate(traefik_service_requests_total{service=~\"monitoring-grafana-.*\"}[5m])) * 0)) / sum(rate(traefik_service_requests_total{service=~\"monitoring-grafana-.*\"}[5m]))",
                  "legendFormat": "obs"
                }
              ]
            },
            {
              "id": 12,
              "type": "timeseries",
              "title": "Kratos courier: missing replicas",
              "description": "Desired minus ready replicas of the kratos-courier StatefulSet — the KratosCourierNotReady expression (red line; fires at >0 for 10m). Under the ADR075 D8 verification gate a stalled courier silently blocks 100% of new sign-ups, which is why it gets its own panel beside the Deployment view.",
              "gridPos": { "h": 8, "w": 24, "x": 0, "y": 55 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "kube_statefulset_replicas{namespace=\"auth\", statefulset=\"kratos-courier\"} - on (namespace, statefulset) kube_statefulset_status_replicas_ready{namespace=\"auth\", statefulset=\"kratos-courier\"}",
                  "legendFormat": "missing replicas"
                }
              ]
            },
            {
              "id": 14,
              "type": "stat",
              "title": "Scrape health (sources)",
              "description": "up for this dashboard's exporters. kube-state-metrics down blinds the deployment-readiness, crashloop, stranded-images, and courier panels (and the node/PVC panels on Cluster capacity); cert-manager down blinds all three certificate panels; openbao down blinds the seal tile. Per-target sentinel: a vanished target reads -1 → MISSING/red on its own tile, never silently dropping while siblings stay green.",
              "gridPos": { "h": 5, "w": 24, "x": 0, "y": 63 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
              "fieldConfig": {
                "defaults": {
                  "noValue": "MISSING",
                  "mappings": [
                    {
                      "type": "value",
                      "options": {
                        "-1": { "text": "MISSING", "color": "red", "index": 0 },
                        "0": { "text": "DOWN", "color": "red", "index": 1 },
                        "1": { "text": "UP", "color": "green", "index": 2 }
                      }
                    }
                  ],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "red", "value": null },
                      { "color": "green", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "min(up{job=\"kube-state-metrics\"}) or on() vector(-1)",
                  "legendFormat": "kube-state-metrics",
                  "instant": true,
                  "range": false
                },
                {
                  "refId": "B",
                  "expr": "min(up{job=\"cert-manager\"}) or on() vector(-1)",
                  "legendFormat": "cert-manager",
                  "instant": true,
                  "range": false
                },
                {
                  "refId": "C",
                  "expr": "min(up{job=\"openbao\"}) or on() vector(-1)",
                  "legendFormat": "openbao",
                  "instant": true,
                  "range": false
                }
              ]
            }
          ]
        }

    # bex-api + gateways (ADR088 §6 row 2): BOTH halves of the API's
    # error/latency view — Traefik's edge perspective (filtered to the one
    # bounded service label bex-api's Ingress produces) and, since w3/m84,
    # bex-api's own origin-side per-route histogram, which is what makes
    # edge-vs-origin attribution possible at all (it closes the §6 gap). Read the
    # two together: a healthy origin under a bad edge puts the fault between
    # Traefik and the pod. Agent-session SLOs (w5/m81) and SSH-gateway saturation
    # ride their own registries. w3/m83 t006 adds the bex-api eventing surfaces that
    # exported health series with no rule: outbound webhook attempt outcomes,
    # push delivery freshness + queue depth, and agent-session provision
    # outcomes. NB every one of those panels depends on the bex-api scrape job's
    # keep-list (prometheus.yaml) admitting bex_(agent_session|webhooks|push|api)_* —
    # sustained No data there means the keep-list dropped them, which is
    # exactly the visible pressure ADR088 §6 wants a panel to apply.
    bex-api-gateways:
      json: |
        {
          "uid": "bex-api-gateways",
          "title": "bex-api + gateways",
          "tags": ["bex", "platform"],
          "editable": false,
          "graphTooltip": 1,
          "timezone": "browser",
          "schemaVersion": 39,
          "refresh": "30s",
          "time": { "from": "now-6h", "to": "now" },
          "panels": [
            {
              "id": 1,
              "type": "timeseries",
              "title": "bex-api edge request rate",
              "description": "Requests through the edge to the bex-api Service (Traefik service label bex-system-bex-api-<port>@kubernetes).",
              "gridPos": { "h": 9, "w": 12, "x": 0, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": { "unit": "reqps", "min": 0 },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(rate(traefik_service_requests_total{service=~\"bex-system-bex-api-.*\"}[5m]))",
                  "legendFormat": "all"
                },
                {
                  "refId": "B",
                  "expr": "sum(rate(traefik_service_requests_total{service=~\"bex-system-bex-api-.*\", code=~\"5..\"}[5m]))",
                  "legendFormat": "5xx"
                }
              ]
            },
            {
              "id": 2,
              "type": "timeseries",
              "title": "bex-api edge latency p50/p95/p99",
              "description": "Edge-observed duration quantiles for the bex-api service.",
              "gridPos": { "h": 9, "w": 12, "x": 12, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": { "unit": "s", "min": 0 },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "histogram_quantile(0.50, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{service=~\"bex-system-bex-api-.*\"}[5m])))",
                  "legendFormat": "p50"
                },
                {
                  "refId": "B",
                  "expr": "histogram_quantile(0.95, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{service=~\"bex-system-bex-api-.*\"}[5m])))",
                  "legendFormat": "p95"
                },
                {
                  "refId": "C",
                  "expr": "histogram_quantile(0.99, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{service=~\"bex-system-bex-api-.*\"}[5m])))",
                  "legendFormat": "p99"
                }
              ]
            },
            {
              "id": 3,
              "type": "timeseries",
              "title": "Agent turn running duration p95",
              "description": "Running wall-clock (agent_session_turns.started_at → terminal CAS) by outcome. Pin/archive do not move the start. Never-running failures (auth reject before bind, dispatch fail) appear only on the outcomes panel — they do not fabricate a duration sample.",
              "gridPos": { "h": 9, "w": 8, "x": 0, "y": 9 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": { "unit": "s", "min": 0 },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "histogram_quantile(0.95, sum by (le, outcome) (rate(bex_agent_session_turn_duration_seconds_bucket[15m])))",
                  "legendFormat": "{{outcome}}"
