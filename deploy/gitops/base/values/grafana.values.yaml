    # Builds (ADR088 §6 row 3): queue time is the platform's own capacity SLI
    # (run time is mostly the tenant's), so every build alert's series and
    # threshold appears here — BuildQueuedTooLong 480s, BuildQueueTimeHigh 300s
    # p95, BuildInfraSuccessBelowSLO 99.5%, the ≥3-workspace correlation
    # detector, and the ClusterBuilder readiness/30d-pin-freshness pair.
    bex-builds:
      json: |
        {
          "uid": "bex-builds",
          "title": "Builds",
          "tags": ["bex", "platform"],
          "editable": false,
          "graphTooltip": 1,
          "timezone": "browser",
          "schemaVersion": 39,
          "refresh": "30s",
          "time": { "from": "now-6h", "to": "now" },
          "panels": [
            {
              "id": 1,
              "type": "timeseries",
              "title": "Builds active / queued",
              "description": "Live admission picture from a full recount (never edge-driven): active is the quantity BEX_MAX_ACTIVE_BUILDS caps; queued builds are waiting for a node, doing no work.",
              "gridPos": { "h": 9, "w": 12, "x": 0, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": { "unit": "short", "min": 0 },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "max(bex_builds_active)",
                  "legendFormat": "active"
                },
                {
                  "refId": "B",
                  "expr": "max(bex_builds_queued)",
                  "legendFormat": "queued"
                }
              ]
            },
            {
              "id": 2,
              "type": "timeseries",
              "title": "Oldest queued build age",
              "description": "Age of the longest-currently-queued build. BuildQueuedTooLong fires at >480s (red line) — sized so it pages ~8m before bex-api's 18m deploy gate fails the deploy.",
              "gridPos": { "h": 9, "w": 12, "x": 12, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 480 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "max(bex_build_queue_oldest_seconds)",
                  "legendFormat": "oldest queued"
                }
              ]
            },
            {
              "id": 3,
              "type": "timeseries",
              "title": "Build queue vs run p95 (30m)",
              "description": "The split that attributes an incident: queue time is the platform failing to supply capacity, run time is mostly tenant code. The red line is BuildQueueTimeHigh's 300s p95 threshold — it applies to the queue series only.",
              "gridPos": { "h": 9, "w": 12, "x": 0, "y": 9 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 300 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "histogram_quantile(0.95, sum by (le) (rate(bex_build_queue_seconds_bucket[30m]))) or (count(bex_build_queue_seconds_bucket) * 0)",
                  "legendFormat": "queue p95"
                },
                {
                  "refId": "B",
                  "expr": "histogram_quantile(0.95, sum by (le) (rate(bex_build_run_seconds_bucket[30m])))",
                  "legendFormat": "run p95"
                }
              ]
            },
            {
              "id": 4,
              "type": "timeseries",
              "title": "Build infra success ratio (1h)",
              "description": "The recorded SLO series (user_failed excluded by construction — tenant Dockerfiles are not platform failures). BuildInfraSuccessBelowSLO fires under 99.5%.",
              "gridPos": { "h": 9, "w": 12, "x": 12, "y": 9 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit",
                  "max": 1,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "red", "value": null },
                      { "color": "green", "value": 0.995 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "bex:build_infra_success_ratio:rate1h",
                  "legendFormat": "infra success"
                }
              ]
            },
            {
              "id": 5,
              "type": "timeseries",
              "title": "Build outcomes (1h)",
              "description": "Terminal build outcomes by class — user_failed is deterministic tenant input, infra_failed exhausted its retry budget on a platform-owned cause.",
              "gridPos": { "h": 9, "w": 8, "x": 0, "y": 18 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": { "unit": "short", "min": 0 },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (outcome) (increase(bex_build_outcomes_total[1h]))",
                  "legendFormat": "{{outcome}}"
                }
              ]
            },
            {
              "id": 6,
              "type": "timeseries",
              "title": "Workspaces with infra failures (15m)",
              "description": "Distinct workspaces failing infra-side inside 15m — the flake-vs-user discriminator. BuildInfraFailuresCorrelatedAcrossWorkspaces fires at ≥3 (red line); one workspace's bad afternoon must not.",
              "gridPos": { "h": 9, "w": 8, "x": 8, "y": 18 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 3 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "count(sum by (workspace) (increase(bex_build_infra_failures_total[15m])) > 0) or (count(bex_builds_active) * 0)",
                  "legendFormat": "distinct workspaces"
                }
              ]
            },
            {
              "id": 7,
              "type": "stat",
              "title": "ClusterBuilder present / ready",
              "description": "Both must be 1 — ClusterBuilderNotReady fires when either is not (a Ready builder can still be a stale pin; see the pin-age panel). Per-target sentinel: an absent series reads -1 → MISSING/red per source, so one vanished gauge cannot hide behind the other's green.",
              "gridPos": { "h": 9, "w": 8, "x": 16, "y": 18 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
              "fieldConfig": {
                "defaults": {
                  "noValue": "MISSING",
                  "mappings": [
                    {
                      "type": "value",
                      "options": {
                        "-1": { "text": "MISSING", "color": "red", "index": 0 },
                        "0": { "text": "NO", "color": "red", "index": 1 },
                        "1": { "text": "YES", "color": "green", "index": 2 }
                      }
                    }
                  ],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "red", "value": null },
                      { "color": "green", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "max(bex_build_clusterbuilder_present) or on() vector(-1)",
                  "legendFormat": "present",
                  "instant": true,
                  "range": false
                },
                {
                  "refId": "B",
                  "expr": "max(bex_build_clusterbuilder_ready) or on() vector(-1)",
                  "legendFormat": "ready",
                  "instant": true,
                  "range": false
                }
              ]
            },
            {
              "id": 8,
              "type": "timeseries",
              "title": "ClusterBuilder image pin age",
              "description": "Age of the committed builder resolution. ClusterBuilderImageStale fires past the 30-day review SLO (red line) — refresh is a reviewed digest update, never an automatic rollout.",
              "gridPos": { "h": 8, "w": 24, "x": 0, "y": 27 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 2592000 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "time() - max(bex_build_clusterbuilder_image_resolved_timestamp_seconds)",
                  "legendFormat": "pin age"
                }
              ]
            }
          ]
        }

    # Data plane (ADR088 §6 row 4): datastore readiness comes from CR status
    # (bex_datastore_*, w7/036) precisely because a Cluster that never got an
    # instance pod exports NOTHING — absence is the symptom. PITR safety is the
    # 26h WAL/CronJob freshness pair. NB the bex_datastore_* panels depend on
    # the bex-operator scrape job's keep-list (prometheus.yaml) admitting them
    # — sustained No data there is a keep-list regression, not health.
    bex-data-plane:
      json: |
        {
          "uid": "bex-data-plane",
          "title": "Data plane",
          "tags": ["bex", "platform"],
          "editable": false,
          "graphTooltip": 1,
          "timezone": "browser",
          "schemaVersion": 39,
          "refresh": "30s",
          "time": { "from": "now-6h", "to": "now" },
          "panels": [
            {
              "id": 1,
              "type": "timeseries",
              "title": "Datastores stuck provisioning",
              "description": "Not-ready datastores older than 15m against the estate total — the DatastoreStuckProvisioning expression (any at the red line pages; the tenant sees a resource that never arrives and nothing else reports it). Reads 0 only while bex_datastore_ready series actually exist; with no datastore telemetry at all both series show No data instead of a fake healthy 0 (see the scrape-health row).",
              "gridPos": { "h": 9, "w": 12, "x": 0, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "count(bex_datastore_ready == 0 and on (kind, namespace, name) bex_datastore_age_seconds > 900) or (count(bex_datastore_ready) * 0)",
                  "legendFormat": "stuck >15m"
                },
                {
                  "refId": "B",
                  "expr": "count(bex_datastore_ready)",
                  "legendFormat": "total datastores"
                }
              ]
            },
            {
              "id": 2,
              "type": "timeseries",
              "title": "Tenant WAL archiving (must be 1)",
              "description": "ContinuousArchiving per backup-enabled database. DatabaseNotArchivingWAL fires at 0 for 15m — a Ready, serving database with no advancing restore point (w7/040) shows only here.",
              "gridPos": { "h": 9, "w": 12, "x": 12, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "min": 0,
                  "max": 1,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "red", "value": null },
                      { "color": "green", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "min by (namespace, name) (bex_datastore_wal_archiving)",
                  "legendFormat": "{{namespace}}/{{name}}"
                }
              ]
            },
            {
              "id": 3,
              "type": "timeseries",
              "title": "Datastore observation errors (15m)",
              "description": "Failed datastore listings — DatastoreObservationFailing fires at >0 because a broken observer silently blinds the stuck-provisioning alert. No data here means the counter itself is not being scraped (see the scrape-health row), which is worse than any value.",
              "gridPos": { "h": 9, "w": 8, "x": 0, "y": 9 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(increase(bex_datastore_observe_errors_total[15m]))",
                  "legendFormat": "observe errors"
                }
              ]
            },
            {
              "id": 4,
              "type": "timeseries",
              "title": "Platform DB WAL archiver age",
              "description": "Time since each platform CNPG primary archived a WAL segment. PlatformDatabaseBackupStale fires past 26h (red line).",
              "gridPos": { "h": 9, "w": 8, "x": 8, "y": 9 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 93600 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "time() - cnpg_pg_stat_archiver_last_archived_time{job=\"cnpg-platform-db\"}",
                  "legendFormat": "{{namespace}}/{{cnpg_io_cluster}}"
                }
              ]
            },
            {
              "id": 5,
              "type": "timeseries",
              "title": "Backup CronJob age since success",
              "description": "Time since the last successful etcd/openbao/kvbak-* backup run, mirroring BackupCronJobStale's full expression: a CronJob that has NEVER succeeded falls back to age since creation (so a 27h-old never-successful backup shows exactly when the alert fires), and suspended CronJobs are excluded exactly as the alert excludes them. Red line 26h — silent backup rot is unrecoverable data loss.",
              "gridPos": { "h": 9, "w": 8, "x": 16, "y": 9 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 93600 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "((time() - kube_cronjob_status_last_successful_time{cronjob=~\"etcd-backup|openbao-backup|kvbak-.*\"}) or ((time() - kube_cronjob_created{cronjob=~\"etcd-backup|openbao-backup|kvbak-.*\"}) unless on (namespace, cronjob) kube_cronjob_status_last_successful_time{cronjob=~\"etcd-backup|openbao-backup|kvbak-.*\"})) and on (namespace, cronjob) (kube_cronjob_spec_suspend{cronjob=~\"etcd-backup|openbao-backup|kvbak-.*\"} == 0)",
                  "legendFormat": "{{namespace}}/{{cronjob}}"
                }
              ]
            },
            {
              "id": 6,
              "type": "timeseries",
              "title": "Tenant DB backends",
              "description": "Connected backends per tenant CNPG cluster (cnpg_backends_total, cluster/namespace stamped at scrape time — the labels the metric itself lacks).",
              "gridPos": { "h": 9, "w": 8, "x": 0, "y": 18 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": { "unit": "short", "min": 0 },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (namespace, cnpg_io_cluster) (cnpg_backends_total)",
                  "legendFormat": "{{namespace}}/{{cnpg_io_cluster}}"
                }
              ]
            },
            {
              "id": 7,
              "type": "timeseries",
              "title": "Tenant DB replication lag",
              "description": "Seconds each replica trails its primary (cnpg_pg_replication_lag — the same series behind the product's replication-lag metric).",
              "gridPos": { "h": 9, "w": 8, "x": 8, "y": 18 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": { "unit": "s", "min": 0 },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "max by (namespace, cnpg_io_cluster) (cnpg_pg_replication_lag)",
                  "legendFormat": "{{namespace}}/{{cnpg_io_cluster}}"
                }
              ]
            },
            {
              "id": 8,
              "type": "stat",
              "title": "Public SNI front doors",
              "description": "Min health of the public Postgres/Key Value proxy meters — PostgresEgressProxyUnavailable / KeyValueEgressProxyUnavailable page at 0 AND on the series being absent. Per-target sentinel: either proxy's telemetry vanishing reads -1 → MISSING/red for that proxy alone, never a tile quietly showing only the survivor.",
              "gridPos": { "h": 9, "w": 8, "x": 16, "y": 18 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
              "fieldConfig": {
                "defaults": {
                  "noValue": "MISSING",
                  "mappings": [
                    {
                      "type": "value",
                      "options": {
                        "-1": { "text": "MISSING", "color": "red", "index": 0 },
                        "0": { "text": "UNHEALTHY", "color": "red", "index": 1 },
                        "1": { "text": "HEALTHY", "color": "green", "index": 2 }
                      }
                    }
                  ],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "red", "value": null },
                      { "color": "green", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "min(bex_pg_proxy_healthy{resource_kind=\"postgres\"}) or on() vector(-1)",
                  "legendFormat": "postgres",
                  "instant": true,
                  "range": false
                },
                {
                  "refId": "B",
                  "expr": "min(bex_kv_proxy_healthy{resource_kind=\"key_value\"}) or on() vector(-1)",
                  "legendFormat": "key value",
                  "instant": true,
                  "range": false
                }
              ]
            },
            {
              "id": 9,
              "type": "stat",
              "title": "Scrape health (sources)",
              "description": "up for the jobs every bex_* panel above depends on. operator down blinds the stuck-provisioning/WAL/observe-errors panels; pg/kv proxy down blinds the front-door tile. Per-target sentinel: a source whose up series vanishes entirely (SD lost the target) reads -1 → MISSING/red on its own tile, the same absent-series trap the Unavailable alerts guard against with absent(up).",
              "gridPos": { "h": 5, "w": 24, "x": 0, "y": 27 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
              "fieldConfig": {
                "defaults": {
                  "noValue": "MISSING",
                  "mappings": [
                    {
                      "type": "value",
                      "options": {
                        "-1": { "text": "MISSING", "color": "red", "index": 0 },
                        "0": { "text": "DOWN", "color": "red", "index": 1 },
                        "1": { "text": "UP", "color": "green", "index": 2 }
                      }
                    }
                  ],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "red", "value": null },
                      { "color": "green", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "min(up{job=\"bex-operator\"}) or on() vector(-1)",
                  "legendFormat": "operator",
                  "instant": true,
                  "range": false
                },
                {
                  "refId": "B",
                  "expr": "min(up{job=\"bex-pg-proxy\"}) or on() vector(-1)",
                  "legendFormat": "pg proxy",
                  "instant": true,
                  "range": false
                },
                {
                  "refId": "C",
                  "expr": "min(up{job=\"bex-kv-proxy\"}) or on() vector(-1)",
                  "legendFormat": "kv proxy",
                  "instant": true,
                  "range": false
                }
              ]
            }
          ]
        }

    # Billing + metering (ADR088 §6 row 5): money-path freshness and meter
    # integrity — a broken meter is silent revenue loss, so every billing/meter
    # alert's series and threshold is drawn (outbox 72h, reject/ambiguous >0,
    # operation errors, meter health 0/1, map pressure 80%).
    bex-billing-metering:
      json: |
        {
          "uid": "bex-billing-metering",
          "title": "Billing + metering",
          "tags": ["bex", "platform"],
          "editable": false,
          "graphTooltip": 1,
          "timezone": "browser",
          "schemaVersion": 39,
          "refresh": "30s",
          "time": { "from": "now-6h", "to": "now" },
          "panels": [
            {
              "id": 1,
              "type": "timeseries",
              "title": "Money-path freshness",
              "description": "Oldest pending outbox row age and time since the last verified Stripe webhook. The red line is BillingExportBacklog's 72h threshold on the outbox series; webhook age has no alert threshold.",
              "gridPos": { "h": 9, "w": 12, "x": 0, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 259200 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "max(bex_billing_outbox_oldest_pending_age_seconds)",
                  "legendFormat": "oldest pending outbox row"
                },
                {
                  "refId": "B",
                  "expr": "time() - max(bex_billing_webhook_last_success_timestamp_seconds)",
                  "legendFormat": "since last verified webhook"
                }
              ]
            },
            {
              "id": 2,
              "type": "timeseries",
              "title": "Export rejected / ambiguous rows",
              "description": "Durable reject queue and stale ambiguous provider outcomes. BillingPermanentReject (warning) and BillingExportAmbiguity (critical) both fire at >0 — never blind-retry, reconcile first.",
              "gridPos": { "h": 9, "w": 12, "x": 12, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "max(bex_billing_export_rejected_rows)",
                  "legendFormat": "rejected"
                },
                {
                  "refId": "B",
                  "expr": "max(bex_billing_export_ambiguous_rows)",
                  "legendFormat": "ambiguous"
                }
              ]
            },
            {
              "id": 3,
              "type": "timeseries",
              "title": "Billing operation errors (15m)",
              "description": "result=error by operation — the shared series behind BillingLocalStampFailure, BillingProviderDuplicate, BillingWebhookDrift, BillingInvoiceReadDegraded, and BillingProvisioningFailure (all fire on small counts; red line at 1).",
              "gridPos": { "h": 9, "w": 12, "x": 0, "y": 9 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (operation) (increase(bex_billing_operations_total{result=\"error\"}[15m]))",
                  "legendFormat": "{{operation}}"
                }
              ]
            },
            {
              "id": 4,
              "type": "stat",
              "title": "Billing enabled",
              "description": "Every billing alert gates on this — at 0 (local, or Stripe unconfigured) they are all deliberately silent, so 0 is a legitimate state, not red. MISSING (instant query, no series) means bex-api's metrics are gone — that IS red: the alerts are blind, not disabled.",
              "gridPos": { "h": 9, "w": 4, "x": 12, "y": 9 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
              "fieldConfig": {
                "defaults": {
                  "noValue": "MISSING",
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "red", "value": null },
                      { "color": "green", "value": 0 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "max(bex_billing_enabled)",
                  "legendFormat": "enabled",
                  "instant": true,
                  "range": false
                }
              ]
            },
            {
              "id": 5,
              "type": "stat",
              "title": "Meter scrape health",
              "description": "up for the money-path telemetry sources plus the websocket meter's own health gauge. min(healthy) alone stays green when a meter vanishes entirely, so each source carries its own sentinel: a vanished target reads -1 → MISSING/red on its own tile (the same absent(up) guard the Unavailable alerts carry) instead of silently dropping while its siblings stay green.",
              "gridPos": { "h": 9, "w": 8, "x": 16, "y": 9 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
              "fieldConfig": {
                "defaults": {
                  "noValue": "MISSING",
                  "mappings": [
                    {
                      "type": "value",
                      "options": {
                        "-1": { "text": "MISSING", "color": "red", "index": 0 },
                        "0": { "text": "DOWN", "color": "red", "index": 1 },
                        "1": { "text": "UP", "color": "green", "index": 2 }
                      }
                    }
                  ],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "red", "value": null },
                      { "color": "green", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "min(up{job=\"bex-api\"}) or on() vector(-1)",
                  "legendFormat": "bex-api",
                  "instant": true,
                  "range": false
                },
                {
                  "refId": "B",
                  "expr": "min(up{job=\"bex-egress-meter\"}) or on() vector(-1)",
                  "legendFormat": "egress meters",
                  "instant": true,
                  "range": false
                },
                {
                  "refId": "C",
                  "expr": "min(up{job=\"traefik-websocket-meter\"}) or on() vector(-1)",
                  "legendFormat": "websocket meter",
                  "instant": true,
                  "range": false
                },
                {
                  "refId": "D",
                  "expr": "min(bex_websocket_meter_healthy) or on() vector(-1)",
                  "legendFormat": "websocket healthy",
                  "instant": true,
                  "range": false
                }
              ]
            },
            {
              "id": 9,
              "type": "timeseries",
              "title": "Egress meter fleet: expected vs up vs unhealthy",
              "description": "EgressMeterTargetMissing's own comparison: scrapeable meters vs untainted tenant nodes (the alert fires when they differ — do not collect affected hourly windows). Unhealthy reads 0 only while meters are scrapeable and No data when none are, so a vanished fleet cannot render as healthy.",
              "gridPos": { "h": 9, "w": 12, "x": 0, "y": 18 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": { "unit": "short", "min": 0 },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "count(kube_node_info unless on (node) kube_node_spec_taint{key=\"bex.co/platform\", value=\"true\"} unless on (node) kube_node_role{role=\"control-plane\"})",
                  "legendFormat": "expected (untainted tenant nodes)"
                },
                {
                  "refId": "B",
                  "expr": "count(up{job=\"bex-egress-meter\"} == 1)",
                  "legendFormat": "meters up"
                },
                {
                  "refId": "C",
                  "expr": "count(bex_egress_meter_healthy == 0) or (count(up{job=\"bex-egress-meter\"} == 1) * 0)",
                  "legendFormat": "unhealthy (EgressMeterUnhealthy at ≥1)"
                }
              ]
            },
            {
              "id": 6,
              "type": "timeseries",
              "title": "Egress counter-loss events (1h)",
              "description": "Detected counter-map restores/decreases per node — the durable trend twin of the recency panel beside it. No data means either no meter telemetry (see the fleet panel) or a node's counter not yet scraped; a healthy scraped meter reports 0.",
              "gridPos": { "h": 9, "w": 12, "x": 0, "y": 27 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (node) (increase(bex_egress_meter_counter_loss_events_total[1h]))",
                  "legendFormat": "{{node}}"
                }
              ]
            },
            {
              "id": 10,
              "type": "timeseries",
              "title": "Egress counter-loss recency",
              "description": "Time since each node's most recent detected counter loss — the exact quantity EgressMeterCounterLoss evaluates (pages while under 1h, the red zone below the line; a first-sample durable count is invisible to increase() but not to this). No data means no loss ever recorded on that node.",
              "gridPos": { "h": 9, "w": 12, "x": 12, "y": 27 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "red", "value": null },
                      { "color": "green", "value": 3600 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "(time() - max by (node) (bex_egress_meter_last_counter_loss_time_seconds)) and max by (node) (bex_egress_meter_last_counter_loss_time_seconds) > 0",
                  "legendFormat": "{{node}}"
                }
              ]
            },
            {
              "id": 7,
              "type": "timeseries",
              "title": "Egress meter map pressure",
              "description": "Fraction of the bounded per-App counter map occupied, per node. EgressMeterMapPressure warns at 80% (red line) — at capacity, new attribution fails closed.",
              "gridPos": { "h": 9, "w": 12, "x": 12, "y": 18 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit",
                  "min": 0,
                  "max": 1,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 0.8 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "max by (node) (bex_egress_meter_resource_map_pressure_ratio)",
                  "legendFormat": "{{node}}"
                }
              ]
            },
            {
              "id": 8,
              "type": "timeseries",
              "title": "Metered egress bytes",
              "description": "The four billable outbound paths: direct App egress (netfilter meters), public Postgres/Key Value SNI splices, and WebSocket hijack frames.",
              "gridPos": { "h": 9, "w": 24, "x": 0, "y": 36 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": { "unit": "Bps", "min": 0 },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(rate(bex_app_direct_egress_bytes_total[5m]))",
                  "legendFormat": "direct"
                },
                {
                  "refId": "B",
                  "expr": "sum(rate(bex_pg_proxy_egress_bytes_total[5m]))",
                  "legendFormat": "postgres"
                },
                {
                  "refId": "C",
                  "expr": "sum(rate(bex_kv_proxy_egress_bytes_total[5m]))",
                  "legendFormat": "key value"
                },
                {
                  "refId": "D",
                  "expr": "sum(rate(bex_websocket_egress_bytes_total[5m]))",
                  "legendFormat": "websocket"
                }
              ]
            }
          ]
        }

    # Cluster capacity (ADR088 §6 row 6): node headroom from cadvisor, node
    # readiness split CP-vs-worker exactly as the alerts split severity, and PV
    # fill with the Zot registry's earlier 70%/85%/10GiB ladder. Headroom is
    # computed as capacity−used, so it holds regardless of whether the kubelet
    # keep-list also admits kubelet_volume_stats_available_bytes.
    bex-cluster-capacity:
      json: |
        {
          "uid": "bex-cluster-capacity",
          "title": "Cluster capacity",
          "tags": ["bex", "platform"],
          "editable": false,
          "graphTooltip": 1,
          "timezone": "browser",
          "schemaVersion": 39,
          "refresh": "30s",
          "time": { "from": "now-6h", "to": "now" },
          "panels": [
            {
              "id": 1,
              "type": "timeseries",
              "title": "CPU usage by node",
              "description": "Container CPU cores in use per node (cadvisor; pod-sandbox rows dropped at scrape).",
              "gridPos": { "h": 9, "w": 12, "x": 0, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": { "unit": "short", "min": 0 },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (node) (rate(container_cpu_usage_seconds_total[5m]))",
                  "legendFormat": "{{node}}"
                }
              ]
            },
            {
              "id": 2,
              "type": "timeseries",
              "title": "Memory working set by node",
              "description": "Container working-set bytes per node (cadvisor) — the reclaim-safe memory figure.",
              "gridPos": { "h": 9, "w": 12, "x": 12, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": { "unit": "bytes", "min": 0 },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (node) (container_memory_working_set_bytes)",
                  "legendFormat": "{{node}}"
                }
              ]
            },
            {
              "id": 3,
              "type": "timeseries",
              "title": "Nodes not Ready",
              "description": "Split exactly as the alerts split severity: ControlPlaneNodeNotReady is critical (single-node CP pool until the m19.1 TEMP knobs revert), NodeNotReady is warning. Red line at 1. Reads 0 only while node-condition series exist; No data when kube-state-metrics is gone.",
              "gridPos": { "h": 9, "w": 12, "x": 0, "y": 9 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "count(kube_node_status_condition{condition=\"Ready\", status=\"true\"} == 0 and on (node) kube_node_role{role=\"control-plane\"}) or (count(kube_node_status_condition{condition=\"Ready\", status=\"true\"}) * 0)",
                  "legendFormat": "control-plane"
                },
                {
                  "refId": "B",
                  "expr": "count(kube_node_status_condition{condition=\"Ready\", status=\"true\"} == 0 unless on (node) kube_node_role{role=\"control-plane\"}) or (count(kube_node_status_condition{condition=\"Ready\", status=\"true\"}) * 0)",
                  "legendFormat": "worker"
                }
              ]
            },
            {
              "id": 4,
              "type": "timeseries",
              "title": "Nodes by role",
              "description": "Fleet size and composition — the denominator the EgressMeterTargetMissing count compares its scrapeable-meter count against.",
              "gridPos": { "h": 9, "w": 12, "x": 12, "y": 9 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": { "unit": "short", "min": 0 },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "count(kube_node_info)",
                  "legendFormat": "total"
                },
                {
                  "refId": "B",
                  "expr": "count by (role) (kube_node_role)",
                  "legendFormat": "{{role}}"
                }
              ]
            },
            {
              "id": 5,
              "type": "timeseries",
              "title": "PVC fill ratio",
              "description": "used/capacity per PVC (kubelet volume stats — etcd/Loki/OpenBao/Prometheus and tenant disks). PersistentVolumeFillingUp warns at 85% (red line); this series also feeds the disk autoscaler.",
              "gridPos": { "h": 9, "w": 12, "x": 0, "y": 18 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit",
                  "min": 0,
                  "max": 1,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 0.85 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes",
                  "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}"
                }
              ]
            },
            {
              "id": 6,
              "type": "timeseries",
              "title": "Zot registry PVC fill ratio",
              "description": "The registry volume gets an earlier ladder than the generic 85%: ZotRegistryFillingUp warns at 70% (amber), ZotRegistryAlmostFull pages at 85% (red) — a runaway rebuild loop once filled it with no prior warning (2026-07-12).",
              "gridPos": { "h": 9, "w": 12, "x": 12, "y": 18 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit",
                  "min": 0,
                  "max": 1,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "orange", "value": 0.7 },
                      { "color": "red", "value": 0.85 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "kubelet_volume_stats_used_bytes{namespace=\"bex-registry\"} / kubelet_volume_stats_capacity_bytes{namespace=\"bex-registry\"}",
                  "legendFormat": "{{persistentvolumeclaim}}"
                }
              ]
            },
            {
              "id": 7,
              "type": "timeseries",
              "title": "Zot registry headroom",
              "description": "capacity−used (equivalent to available bytes, and independent of the kubelet scrape keep-list). ZotRegistryAlmostFull's absolute floor is 10 GiB — below the green line a large layer can fail a push well before 100%.",
              "gridPos": { "h": 8, "w": 24, "x": 0, "y": 27 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "bytes",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "red", "value": null },
                      { "color": "green", "value": 10737418240 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "kubelet_volume_stats_capacity_bytes{namespace=\"bex-registry\"} - kubelet_volume_stats_used_bytes{namespace=\"bex-registry\"}",
                  "legendFormat": "{{persistentvolumeclaim}}"
                }
              ]
            },
            {
              "id": 8,
              "type": "stat",
              "title": "Scrape health (sources)",
              "description": "up for this dashboard's exporters. kubelet down blinds every PVC fill/headroom panel (and the PersistentVolumeFillingUp/Zot alerts); cadvisor down blinds the CPU/memory panels; kube-state-metrics down blinds the node panels. Per-target sentinel: a vanished target reads -1 → MISSING/red on its own tile, never silently dropping while siblings stay green.",
              "gridPos": { "h": 5, "w": 24, "x": 0, "y": 35 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
              "fieldConfig": {
                "defaults": {
                  "noValue": "MISSING",
                  "mappings": [
                    {
                      "type": "value",
                      "options": {
                        "-1": { "text": "MISSING", "color": "red", "index": 0 },
                        "0": { "text": "DOWN", "color": "red", "index": 1 },
                        "1": { "text": "UP", "color": "green", "index": 2 }
                      }
                    }
                  ],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "red", "value": null },
                      { "color": "green", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "min(up{job=\"kubernetes-kubelet\"}) or on() vector(-1)",
                  "legendFormat": "kubelet",
                  "instant": true,
                  "range": false
                },
                {
                  "refId": "B",
                  "expr": "min(up{job=\"kubernetes-cadvisor\"}) or on() vector(-1)",
                  "legendFormat": "cadvisor",
                  "instant": true,
                  "range": false
                },
                {
                  "refId": "C",
                  "expr": "min(up{job=\"kube-state-metrics\"}) or on() vector(-1)",
                  "legendFormat": "kube-state-metrics",
                  "instant": true,
                  "range": false
                }
              ]
            },
            {
              "id": 9,
              "type": "timeseries",
              "title": "CPU commitment by node (requests / allocatable)",
              "description": "The scheduler's truth: summed CPU requests of scheduled pods over allocatable, per node. Sustained >80% (red line) on the PLATFORM pool means add machines; on the tenant pool the Cluster Autoscaler acts on overflow automatically — a cost event, not an outage. kube_pod_container_resource_requests carries a node label only once a pod is scheduled, which is exactly the commitment semantics wanted here (pending pods show on the pending panel instead).",
              "gridPos": { "h": 9, "w": 8, "x": 0, "y": 40 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 0.8 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (node) (kube_pod_container_resource_requests{resource=\"cpu\"}) / on (node) kube_node_status_allocatable{resource=\"cpu\"}",
                  "legendFormat": "{{node}}"
                }
              ]
            },
            {
              "id": 10,
              "type": "timeseries",
              "title": "Saturation vs allocatable by node",
              "description": "Actual cadvisor usage over allocatable — the reality check beside the commitment panel: high saturation with LOW commitment means fix the pods' requests, not buy machines. Amber line at 80%. Same by-node grouping as the CPU/memory panels above (cadvisor node label, stamped at scrape).",
              "gridPos": { "h": 9, "w": 8, "x": 8, "y": 40 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "orange", "value": 0.8 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (node) (rate(container_cpu_usage_seconds_total[5m])) / on (node) kube_node_status_allocatable{resource=\"cpu\"}",
                  "legendFormat": "cpu {{node}}"
                },
                {
                  "refId": "B",
                  "expr": "sum by (node) (container_memory_working_set_bytes) / on (node) kube_node_status_allocatable{resource=\"memory\"}",
                  "legendFormat": "mem {{node}}"
                }
              ]
            },
            {
              "id": 11,
              "type": "timeseries",
              "title": "Pending pods (unschedulable pressure)",
              "description": "Pods in phase Pending — the Cluster Autoscaler's own trigger. Sustained >0 (red line) is a capacity action NOW: the autoscaler is adding tenant nodes, or the platform pool needs a human. Reads 0 only while kube-state-metrics telemetry is present.",
              "gridPos": { "h": 9, "w": 8, "x": 16, "y": 40 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(kube_pod_status_phase{phase=\"Pending\"}) or (count(kube_node_status_allocatable) * 0)",
                  "legendFormat": "pending pods"
                }
              ]
            }
          ]
        }

    # Product analytics use retained rows via the restricted Postgres reader;
    # global ingest health stays on Prometheus. No identity becomes a label.
    cli-usage:
      json: |
        {
          "uid": "bex-cli-usage",
          "title": "CLI usage",
          "description": "Observed CLI adoption, repeat usage, command reliability and agent/CI usage. Retained Postgres events plus Prometheus ingest health.",
          "tags": [
            "bex",
            "platform",
            "cli",
            "analytics"
          ],
          "editable": false,
          "graphTooltip": 1,
          "timezone": "utc",
          "schemaVersion": 39,
          "refresh": "5m",
          "time": {
            "from": "now-7d",
            "to": "now"
          },
          "templating": {
            "list": [
              {
                "name": "command",
                "label": "Command",
                "type": "query",
                "datasource": {
                  "type": "grafana-postgresql-datasource",
                  "uid": "cli-analytics"
                },
                "query": "SELECT DISTINCT command FROM cli_analytics.events ORDER BY 1",
                "refresh": 1,
                "sort": 1,
                "multi": true,
                "includeAll": true,
                "allValue": "'__all'",
                "current": {
                  "selected": true,
                  "text": [
                    "All"
                  ],
                  "value": [
                    "$__all"
                  ]
                },
                "options": []
              },
              {
                "name": "version",
                "label": "Upstream version",
                "type": "query",
                "datasource": {
                  "type": "grafana-postgresql-datasource",
                  "uid": "cli-analytics"
                },
                "query": "SELECT DISTINCT upstream_version FROM cli_analytics.events ORDER BY 1",
                "refresh": 1,
