                  "format": "table",
                  "rawQuery": true,
                  "rawSql": "WITH events AS (SELECT * FROM cli_analytics.events WHERE $__timeFilter(received_at) AND ('__all' IN (${command:sqlstring}) OR command IN (${command:sqlstring})) AND ('__all' IN (${version:sqlstring}) OR upstream_version IN (${version:sqlstring})) AND ('__all' IN (${bexrelease:sqlstring}) OR bex_version IN (${bexrelease:sqlstring})) AND ('__all' IN (${output:sqlstring}) OR output_format IN (${output:sqlstring}))) SELECT a.family AS \"Agent\", count(*) AS \"Commands\", count(DISTINCT installation_id) AS \"Installations\" FROM events CROSS JOIN LATERAL (SELECT DISTINCT CASE marker WHEN 'CLAUDECODE' THEN 'Claude Code' WHEN 'CODEX_THREAD_ID' THEN 'Codex' WHEN 'CURSOR_AGENT' THEN 'Cursor' WHEN 'CURSOR_TRACE_ID' THEN 'Cursor' WHEN 'AMP_CURRENT_THREAD_ID' THEN 'Amp' WHEN 'CLINE' THEN 'Cline / compatible' WHEN 'CLINE_ACTIVE' THEN 'Cline / compatible' WHEN 'COPILOT_AGENT_SESSION_ID' THEN 'GitHub Copilot' WHEN 'GEMINI_CLI' THEN 'Gemini CLI' WHEN 'GOOSE_TERMINAL' THEN 'Goose' WHEN 'OPENCODE_CLIENT' THEN 'OpenCode' WHEN 'PI_CODING_AGENT' THEN 'Pi' WHEN 'VSCODE_AGENT' THEN 'VS Code agent' ELSE 'Other' END AS family FROM unnest(agent_signals) marker) a GROUP BY a.family ORDER BY count(*) DESC, a.family"
