                      "rawSql": "WITH days AS (SELECT generate_series(date_trunc('day',$__timeFrom()::timestamptz),date_trunc('day',$__timeTo()::timestamptz),interval '1 day') AS time), creators AS (SELECT date_trunc('day',at) AS time,count(DISTINCT workspace_id) AS n FROM product_analytics.events WHERE event_type IN ('created','domain_added') AND resource_type<>'workspace' AND $__timeFilter(at) AND ('__all' IN (${audience:sqlstring}) OR audience IN (${audience:sqlstring})) AND ('__all' IN (${kind:sqlstring}) OR resource_type IN (${kind:sqlstring})) GROUP BY 1), hosts AS (SELECT day::timestamptz AS time,count(DISTINCT workspace_id) FILTER(WHERE was_live) AS n FROM product_analytics.hosting WHERE day >= ($__timeFrom()::timestamptz AT TIME ZONE 'UTC')::date AND day <= ($__timeTo()::timestamptz AT TIME ZONE 'UTC')::date AND ('__all' IN (${audience:sqlstring}) OR audience IN (${audience:sqlstring})) AND ('__all' IN (${kind:sqlstring}) OR resource_type IN (${kind:sqlstring})) GROUP BY 1) SELECT d.time,COALESCE(c.n,0) AS \"Creating\",CASE WHEN d.time::date >= (SELECT started_at::date FROM product_analytics.collection) THEN h.n END AS \"Hosting\" FROM days d LEFT JOIN creators c USING(time) LEFT JOIN hosts h USING(time) ORDER BY 1"
                    }
                  ],
                  "options": {
                    "legend": {
                      "displayMode": "list",
                      "placement": "bottom"
                    },
                    "tooltip": {
                      "mode": "multi"
                    }
                  }
