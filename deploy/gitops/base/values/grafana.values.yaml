            {
              "id": 31,
              "type": "timeseries",
              "title": "Agent turn outcomes (15m)",
              "description": "Successful terminal CASes by bounded outcome (completed, failed, lost, canceled, vendor_auth_rejected, dispatch_failed). Counts every terminal path once; missing series means no activity, not a probe failure.",
              "gridPos": { "h": 9, "w": 8, "x": 8, "y": 9 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
