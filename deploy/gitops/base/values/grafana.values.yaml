                  "format": "time_series",
                  "rawQuery": true,
                  "rawSql": "WITH days AS (SELECT generate_series(date_trunc('day', $__timeFrom()::timestamptz), date_trunc('day', $__timeTo()::timestamptz), interval '1 day') AS day), events AS (SELECT * FROM cli_analytics.events WHERE $__timeFilter(received_at) AND ('__all' IN (${command:sqlstring}) OR command IN (${command:sqlstring})) AND ('__all' IN (${version:sqlstring}) OR upstream_version IN (${version:sqlstring})) AND ('__all' IN (${bexrelease:sqlstring}) OR bex_version IN (${bexrelease:sqlstring})) AND ('__all' IN (${output:sqlstring}) OR output_format IN (${output:sqlstring}))) SELECT d.day AS time, count(DISTINCT e.installation_id) AS installations, count(DISTINCT e.subject) AS identities, count(DISTINCT e.workspace_id) AS workspaces FROM days d LEFT JOIN events e ON e.received_at >= d.day AND e.received_at < d.day + interval '1 day' GROUP BY d.day ORDER BY d.day"
