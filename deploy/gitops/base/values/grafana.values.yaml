                      "format": "table",
                      "rawQuery": true,
                      "rawSql": "WITH kinds(resource_type) AS (VALUES ('static_site'),('web_service'),('private_service'),('background_worker'),('cron_job'),('postgres'),('keyvalue')),\ncreated AS (SELECT resource_type,count(*) AS creations,count(DISTINCT actor_id) FILTER(WHERE actor_type='human' AND actor_id<>'') AS creators,count(DISTINCT workspace_id) AS workspaces,count(*) FILTER(WHERE actor_type='unknown') AS unknown FROM product_analytics.events WHERE event_type='created' AND $__timeFilter(at) AND ('__all' IN (${audience:sqlstring}) OR audience IN (${audience:sqlstring})) AND ('__all' IN (${kind:sqlstring}) OR resource_type IN (${kind:sqlstring})) GROUP BY resource_type),\nactivated AS (SELECT resource_type,count(DISTINCT parent_id) AS activated FROM product_analytics.events WHERE event_type='deploy_finished' AND outcome='succeeded' AND $__timeFilter(at) AND ('__all' IN (${audience:sqlstring}) OR audience IN (${audience:sqlstring})) AND ('__all' IN (${kind:sqlstring}) OR resource_type IN (${kind:sqlstring})) GROUP BY resource_type)\nSELECT k.resource_type AS \"Feature\",COALESCE(c.creators,0) AS \"Creators\",COALESCE(c.workspaces,0) AS \"Workspaces\",COALESCE(c.creations,0) AS \"Created\",COALESCE(c.unknown,0) AS \"Unknown creator\",CASE WHEN k.resource_type NOT IN ('postgres','keyvalue') THEN COALESCE(a.activated,0) END AS \"Deployed\"\nFROM kinds k LEFT JOIN created c USING(resource_type) LEFT JOIN activated a USING(resource_type) WHERE ('__all' IN (${kind:sqlstring}) OR k.resource_type IN (${kind:sqlstring})) ORDER BY COALESCE(c.creations,0) DESC,k.resource_type"
