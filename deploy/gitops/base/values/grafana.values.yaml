              "targets": [
                {
                  "refId": "A",
                  "datasource": {
                    "type": "grafana-postgresql-datasource",
                    "uid": "product-analytics"
                  },
                  "rawSql": "WITH kinds(resource_type,source) AS (VALUES\n ('static_site','services'),('web_service','services'),('private_service','services'),\n ('background_worker','services'),('cron_job','services'),('postgres','postgres'),('keyvalue','keyvalue')),\nselected_kinds AS (SELECT * FROM kinds WHERE ('__all' IN (${kind:sqlstring}) OR resource_type IN (${kind:sqlstring}))),\ncohort AS (SELECT * FROM product_analytics.provisioning WHERE ('__all' IN (${audience:sqlstring}) OR audience IN (${audience:sqlstring})) AND ('__all' IN (${kind:sqlstring}) OR resource_type IN (${kind:sqlstring}))\n AND created_at >= (SELECT inventory_started_at FROM product_analytics.collection)\n AND $__timeFilter(created_at) AND first_seen_at<=$__timeTo()::timestamptz),\nclassified AS (SELECT *,\n first_ready_at<=$__timeTo()::timestamptz AS ready_by_end,\n removed_at<=$__timeTo()::timestamptz AS removed_by_end FROM cohort)\nSELECT k.resource_type AS \"Type\",\n count(c.resource_id) FILTER(WHERE ready_by_end AND first_ready_at>=created_at) AS \"Timed samples\",\n percentile_cont(0.5) WITHIN GROUP(ORDER BY EXTRACT(epoch FROM first_ready_at-created_at))\n FILTER(WHERE ready_by_end AND first_ready_at>=created_at) AS \"p50\",\n CASE WHEN count(c.resource_id) FILTER(WHERE ready_by_end AND first_ready_at>=created_at)>=20\n THEN percentile_cont(0.95) WITHIN GROUP(ORDER BY EXTRACT(epoch FROM first_ready_at-created_at))\n FILTER(WHERE ready_by_end AND first_ready_at>=created_at) END AS \"p95 (20+ samples)\",\n max(EXTRACT(epoch FROM $__timeTo()::timestamptz-created_at))\n FILTER(WHERE NOT COALESCE(ready_by_end,false) AND NOT COALESCE(removed_by_end,false)) AS \"Oldest unresolved\"\nFROM selected_kinds k LEFT JOIN classified c USING(resource_type) GROUP BY k.resource_type ORDER BY k.resource_type",
                  "format": "table",
                  "rawQuery": true,
                  "editorMode": "code"
                }
