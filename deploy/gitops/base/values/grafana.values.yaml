                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "(kube_secret_created{namespace=\"bex-capi\", secret=\"bex-kubeconfig\"} + 31536000 - time()) / 86400",
                  "legendFormat": "days to estimated expiry"
                }
              ]
            },
            {
              "id": 10,
              "type": "timeseries",
              "title": "Platform service 5xx ratio",
              "description": "Per-service 5xx ratio for the platform front doors (Traefik Ingress service labels <ns>-<svc>-<port>@kubernetes) — a full bex-api outage that healthy tenant traffic dilutes below the aggregate line is unmissable here. A 0 line means traffic is flowing with no errors; No data means genuinely no traffic/telemetry for that service (the 5xx counter alone never existing must not read as absence). Red line mirrors TraefikHigh5xxRate's 5% for reference; the alert itself evaluates only the aggregate, and low per-service traffic makes these ratios jumpy. obs is prod-only (Grafana's Ingress lives in the prod overlay).",
              "gridPos": { "h": 9, "w": 24, "x": 0, "y": 46 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 0.05 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "(sum(rate(traefik_service_requests_total{service=~\"bex-system-bex-api-.*\", code=~\"5..\"}[5m])) or (sum(rate(traefik_service_requests_total{service=~\"bex-system-bex-api-.*\"}[5m])) * 0)) / sum(rate(traefik_service_requests_total{service=~\"bex-system-bex-api-.*\"}[5m]))",
                  "legendFormat": "api"
                },
                {
                  "refId": "B",
                  "expr": "(sum(rate(traefik_service_requests_total{service=~\"dashboard-dashboard-.*\", code=~\"5..\"}[5m])) or (sum(rate(traefik_service_requests_total{service=~\"dashboard-dashboard-.*\"}[5m])) * 0)) / sum(rate(traefik_service_requests_total{service=~\"dashboard-dashboard-.*\"}[5m]))",
                  "legendFormat": "dashboard"
                },
                {
                  "refId": "C",
                  "expr": "(sum(rate(traefik_service_requests_total{service=~\"auth-hydra-public-.*\", code=~\"5..\"}[5m])) or (sum(rate(traefik_service_requests_total{service=~\"auth-hydra-public-.*\"}[5m])) * 0)) / sum(rate(traefik_service_requests_total{service=~\"auth-hydra-public-.*\"}[5m]))",
                  "legendFormat": "oauth"
                },
                {
                  "refId": "D",
                  "expr": "(sum(rate(traefik_service_requests_total{service=~\"auth-kratos-public-.*\", code=~\"5..\"}[5m])) or (sum(rate(traefik_service_requests_total{service=~\"auth-kratos-public-.*\"}[5m])) * 0)) / sum(rate(traefik_service_requests_total{service=~\"auth-kratos-public-.*\"}[5m]))",
                  "legendFormat": "auth"
                },
                {
                  "refId": "E",
                  "expr": "(sum(rate(traefik_service_requests_total{service=~\"monitoring-grafana-.*\", code=~\"5..\"}[5m])) or (sum(rate(traefik_service_requests_total{service=~\"monitoring-grafana-.*\"}[5m])) * 0)) / sum(rate(traefik_service_requests_total{service=~\"monitoring-grafana-.*\"}[5m]))",
                  "legendFormat": "obs"
                }
              ]
            },
            {
              "id": 12,
              "type": "timeseries",
              "title": "Kratos courier: missing replicas",
              "description": "Desired minus ready replicas of the kratos-courier StatefulSet — the KratosCourierNotReady expression (red line; fires at >0 for 10m). Under the ADR075 D8 verification gate a stalled courier silently blocks 100% of new sign-ups, which is why it gets its own panel beside the Deployment view.",
              "gridPos": { "h": 8, "w": 24, "x": 0, "y": 55 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "min": 0,
                  "custom": { "thresholdsStyle": { "mode": "line" } },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "kube_statefulset_replicas{namespace=\"auth\", statefulset=\"kratos-courier\"} - on (namespace, statefulset) kube_statefulset_status_replicas_ready{namespace=\"auth\", statefulset=\"kratos-courier\"}",
                  "legendFormat": "missing replicas"
                }
              ]
            },
            {
              "id": 14,
              "type": "stat",
              "title": "Scrape health (sources)",
              "description": "up for this dashboard's exporters. kube-state-metrics down blinds the deployment-readiness, crashloop, stranded-images, and courier panels (and the node/PVC panels on Cluster capacity); cert-manager down blinds all three certificate panels; openbao down blinds the seal tile. Per-target sentinel: a vanished target reads -1 → MISSING/red on its own tile, never silently dropping while siblings stay green.",
              "gridPos": { "h": 5, "w": 24, "x": 0, "y": 63 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
              "fieldConfig": {
                "defaults": {
                  "noValue": "MISSING",
                  "mappings": [
                    {
                      "type": "value",
                      "options": {
                        "-1": { "text": "MISSING", "color": "red", "index": 0 },
                        "0": { "text": "DOWN", "color": "red", "index": 1 },
                        "1": { "text": "UP", "color": "green", "index": 2 }
                      }
                    }
                  ],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "red", "value": null },
                      { "color": "green", "value": 1 }
                    ]
                  }
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "min(up{job=\"kube-state-metrics\"}) or on() vector(-1)",
                  "legendFormat": "kube-state-metrics",
                  "instant": true,
                  "range": false
                },
                {
                  "refId": "B",
                  "expr": "min(up{job=\"cert-manager\"}) or on() vector(-1)",
                  "legendFormat": "cert-manager",
                  "instant": true,
                  "range": false
                },
                {
                  "refId": "C",
                  "expr": "min(up{job=\"openbao\"}) or on() vector(-1)",
                  "legendFormat": "openbao",
                  "instant": true,
                  "range": false
                }
              ]
            }
          ]
        }

    # bex-api + gateways (ADR088 §6 row 2): BOTH halves of the API's
    # error/latency view — Traefik's edge perspective (filtered to the one
    # bounded service label bex-api's Ingress produces) and, since w3/m84,
    # bex-api's own origin-side per-route histogram, which is what makes
    # edge-vs-origin attribution possible at all (it closes the §6 gap). Read the
    # two together: a healthy origin under a bad edge puts the fault between
    # Traefik and the pod. Agent-session SLOs (w5/m81) and SSH-gateway saturation
    # ride their own registries. w3/m83 t006 adds the bex-api eventing surfaces that
    # exported health series with no rule: outbound webhook attempt outcomes,
    # push delivery freshness + queue depth, and agent-session provision
    # outcomes. NB every one of those panels depends on the bex-api scrape job's
    # keep-list (prometheus.yaml) admitting bex_(agent_session|webhooks|push|api)_* —
    # sustained No data there means the keep-list dropped them, which is
    # exactly the visible pressure ADR088 §6 wants a panel to apply.
    bex-api-gateways:
      json: |
        {
          "uid": "bex-api-gateways",
          "title": "bex-api + gateways",
          "tags": [
            "bex",
            "platform"
          ],
          "editable": false,
          "graphTooltip": 1,
          "timezone": "browser",
          "schemaVersion": 39,
          "refresh": "30s",
          "time": {
            "from": "now-6h",
            "to": "now"
          },
          "panels": [
            {
              "id": 1,
              "type": "timeseries",
              "title": "bex-api edge request rate",
              "description": "Requests through the edge to the bex-api Service (Traefik service label bex-system-bex-api-<port>@kubernetes).",
              "gridPos": {
                "h": 9,
                "w": 12,
                "x": 0,
                "y": 0
              },
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "reqps",
                  "min": 0
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(rate(traefik_service_requests_total{service=~\"bex-system-bex-api-.*\"}[5m]))",
                  "legendFormat": "all"
                },
                {
                  "refId": "B",
                  "expr": "sum(rate(traefik_service_requests_total{service=~\"bex-system-bex-api-.*\", code=~\"5..\"}[5m]))",
                  "legendFormat": "5xx"
                }
              ]
            },
            {
              "id": 2,
              "type": "timeseries",
              "title": "bex-api edge latency p50/p95/p99",
              "description": "Edge-observed duration quantiles for the bex-api service.",
              "gridPos": {
                "h": 9,
                "w": 12,
                "x": 12,
                "y": 0
              },
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "min": 0
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "histogram_quantile(0.50, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{service=~\"bex-system-bex-api-.*\"}[5m])))",
                  "legendFormat": "p50"
                },
                {
                  "refId": "B",
                  "expr": "histogram_quantile(0.95, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{service=~\"bex-system-bex-api-.*\"}[5m])))",
                  "legendFormat": "p95"
                },
                {
                  "refId": "C",
                  "expr": "histogram_quantile(0.99, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{service=~\"bex-system-bex-api-.*\"}[5m])))",
                  "legendFormat": "p99"
                }
              ]
            },
            {
              "id": 3,
              "type": "timeseries",
              "title": "Agent turn running duration p95",
              "description": "Running wall-clock (agent_session_turns.started_at \u2192 terminal CAS) by outcome. Pin/archive do not move the start. Never-running failures (auth reject before bind, dispatch fail) appear only on the outcomes panel — they do not fabricate a duration sample.",
              "gridPos": {
                "h": 9,
                "w": 8,
                "x": 0,
                "y": 9
              },
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "min": 0
                },
                "overrides": []
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "histogram_quantile(0.95, sum by (le, outcome) (rate(bex_agent_session_turn_duration_seconds_bucket[15m])))",
                  "legendFormat": "{{outcome}}"
                }
              ]
            },
            {
              "id": 31,
              "type": "timeseries",
