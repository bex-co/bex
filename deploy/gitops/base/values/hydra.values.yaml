# Ory Hydra values (chart 0.62.1). No secret material here: the chart's built-in
# Secret is disabled and everything sensitive (dsn, secretsSystem, secretsCookie,
# oidcPairwiseSalt) comes from the out-of-band `hydra` Secret created by
# scripts/auth-secrets.sh. Public OAuth2/OIDC endpoints are exposed at
# oauth.<base-domain> via Traefik + cert-manager; the admin API (client
# management, token introspection — consumed by bex-api in w4/m2) stays
# cluster-internal (no ingress).

secret:
  enabled: false # do NOT let the chart render a Secret into git/Argo state
  nameOverride: hydra # created out-of-band by scripts/auth-secrets.sh

hydra:
  automigration:
    enabled: true # `hydra migrate sql` job against hydra-db on install/upgrade

  config:
    ttl:
      # Access-token lifetime, tuned down from Hydra's 1h default (w4/m13). API
      # keys use the client_credentials grant, which has no refresh token, and
      # bex lets any caller re-mint a token freely (docs/ADR012-auth.md) — so a short
      # window bounds a leaked/stale access token's blast radius without costing
      # callers anything but a cheap re-mint. 15m balances that against
      # introspection load (bex-api caches positive introspections ≤30s, so the
      # extra Hydra traffic from re-issuance is negligible). This is global, so
      # OAuth 2.1 user access tokens shorten too — they carry refresh tokens, so
      # the shorter access token is transparent to those callers.
      access_token: 15m
    urls:
      self:
        issuer: https://oauth.bex.co # must match the public host (t005/ingress)
      # OAuth2 login + consent (w4/m9): login is the dashboard's EXISTING Kratos
      # login page (Kratos's native oauth2_provider integration accepts the
      # challenge itself — kratos.values.yaml); consent is the dashboard's
      # headless acceptor route (auto-accepts trusted/skip clients, no UI).
      login: https://dashboard.bex.co/auth/login
      consent: https://dashboard.bex.co/auth/consent
    oidc:
      subject_identifiers:
        supported_types: [public, pairwise]
        # pairwise.salt is secret — injected as OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT
        # from the `hydra` Secret (deployment.extraEnv below), never committed.
      # OpenID Dynamic Client Registration (RFC 7591, w4/m9): lets MCP/agent
      # clients self-register public PKCE clients at the public registration
      # endpoint per the MCP authorization spec. Registered clients are NOT
      # auto-trusted — consent (above) denies unknown client_ids.
      dynamic_client_registration:
        enabled: true

deployment:
  extraEnv:
    - name: OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT
      valueFrom:
        secretKeyRef:
          name: hydra
          key: oidcPairwiseSalt
  # w1/m19 t003: platform pool
  nodeSelector:
    bex.co/pool: platform
  tolerations:
    - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }

# w1/m19 t003: platform pool — the automigration Job schedules independently of
# the server Deployment above.
job:
  nodeSelector:
    bex.co/pool: platform
  tolerations:
    - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }

# OAuth2 clients are managed through the admin API (bex-api, w4/m2), not the
# hydra-maester CRD controller — keep the extra controller off.
maester:
  enabled: false

ingress:
  public:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: oauth.bex.co
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: hydra-public-tls
        hosts:
          - oauth.bex.co
  admin:
    enabled: false # chart default, pinned: the admin API must never get an ingress
