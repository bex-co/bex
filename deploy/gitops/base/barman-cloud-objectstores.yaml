# ObjectStore transport definitions are applied only after the plugin CRD and
# controller are Healthy. Local deletes this Application because it has no S3
# credentials; production keeps all credential bytes out of Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barman-cloud-objectstores
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: git@github.com:bex-co/bex.git
    targetRevision: main
    path: deploy/gitops/charts/barman-cloud-objectstores
  destination:
    server: https://kubernetes.default.svc
    namespace: bex-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
