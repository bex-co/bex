# Nightly etcd snapshot → S3-compatible object storage. Baseline for every
# non-disposable cluster — App CRs live only in the single control-plane node's
# etcd, so a node rebuild without this loses every user deployment (the local
# overlay excludes it: disposable cluster, no object-storage creds). The
# CronJob's S3 Secret is created out-of-band from .env — see
# docs/ADR011-etcd-backup-restore.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: etcd-backup
  namespace: argocd
spec:
  project: bex-platform
  source:
    repoURL: git@github.com:bex-co/bex.git
    targetRevision: main
    path: deploy/gitops/charts/etcd-backup
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
