# cert-manager — automated TLS for the edge. Issues + renews Let's Encrypt certs
# (stored durably as Secrets) for the Ingresses the bex operator creates. The two
# ClusterIssuers (staging + prod) live in cert-manager-issuers.yaml (sync-wave 2,
# after these CRDs exist).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: "v1.20.3"          # pin exact for reproducibility
    helm:
      values: |
        crds:
          enabled: true                # install the cert-manager CRDs
          keep: true                   # don't GC CRDs (+ issued certs) on uninstall
        # w1/m19 t003: platform pool — controller (top-level) + webhook + cainjector
        # + startupapicheck each schedule independently, so each needs the pin.
        # nodeSelector REPLACES the chart default, so keep kubernetes.io/os: linux.
        nodeSelector:
          kubernetes.io/os: linux
          bex.co/pool: platform
        tolerations:
          - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
        webhook:
          nodeSelector:
            kubernetes.io/os: linux
            bex.co/pool: platform
          tolerations:
            - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
        cainjector:
          nodeSelector:
            kubernetes.io/os: linux
            bex.co/pool: platform
          tolerations:
            - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
        startupapicheck:
          nodeSelector:
            kubernetes.io/os: linux
            bex.co/pool: platform
          tolerations:
            - { key: bex.co/platform, operator: Equal, value: "true", effect: NoSchedule }
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
