# OpenBao — the platform secret store for tenant credentials (see
# docs/ADR013-secrets.md). The reviewed chart is mirrored to controlled OCI by
# deploy.yml and selected by immutable digest; values are vendored in this repo, so
# this is a multi-source Application: the OCI artifact provides the chart, the git
# source (ref: values) provides base/values/openbao.values.yaml.
# sync-wave 1: no dependency on the CNPG operator or any Cluster — OpenBao owns
# its storage directly (integrated Raft). Init/unseal (keys + root token) and
# the tenants/ KV v2 mount are out-of-band: scripts/bao-init.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: bex-platform
  sources:
    - repoURL: oci://ghcr.io/bex-co/bex-charts/openbao
      path: .
      targetRevision: "sha256:d2d895327319447dcacbd00f3c43a615ad40c110257fb1c830bcfc852dbb4be2"
      helm:
        valueFiles:
          - $values/deploy/gitops/base/values/openbao.values.yaml
    - repoURL: git@github.com:bex-co/bex.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
