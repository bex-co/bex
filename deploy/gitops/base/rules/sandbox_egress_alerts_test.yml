# SandboxWorkspaceEgressHigh: a workspace whose /v1/sandboxes sandboxes send far
# more to the public internet than its plan makes plausible raises one alert for
# that workspace (ADR104 D11).
#
# The egress meter counts every sandbox of a workspace under one series,
# bex_app_direct_egress_bytes_total{namespace="<ws>-sandbox", app_id="sandboxes"},
# one per node it ran on. The threshold is 50 GiB in an hour, so the fixtures
# step a counter by 1 GiB a minute (60 GiB an hour, over) or by a few MiB.
# Run: promtool test rules sandbox_egress_alerts_test.yml (alerting_rules.yml alongside).
rule_files:
  - alerting_rules.yml

evaluation_interval: 1m

tests:
  # The healthy twin: a busy but plausible workspace stays quiet.
  - name: sandbox egress below the threshold stays silent
    interval: 1m
    input_series:
      # About 0.6 GiB an hour.
      - series: 'bex_app_direct_egress_bytes_total{namespace="tea-aaa-sandbox", app_id="sandboxes", node="sandbox-a", source_instance="boot-a"}'
        values: "0+10737418x180"
    alert_rule_test:
      - eval_time: 90m
        alertname: SandboxWorkspaceEgressHigh
        exp_alerts: []
      - eval_time: 170m
        alertname: SandboxWorkspaceEgressHigh
        exp_alerts: []

  # One workspace above the threshold fires for that workspace, and a second
  # workspace on the same node stays quiet.
  - name: one workspace above the threshold fires and another stays quiet
    interval: 1m
    input_series:
      # 1 GiB a minute: 60 GiB an hour.
      - series: 'bex_app_direct_egress_bytes_total{namespace="tea-aaa-sandbox", app_id="sandboxes", node="sandbox-a", source_instance="boot-a"}'
        values: "0+1073741824x180"
      - series: 'bex_app_direct_egress_bytes_total{namespace="tea-bbb-sandbox", app_id="sandboxes", node="sandbox-a", source_instance="boot-a"}'
        values: "0+10737418x180"
    alert_rule_test:
      - eval_time: 90m
        alertname: SandboxWorkspaceEgressHigh
        exp_alerts:
          - &aaa_fires
            exp_labels:
              severity: warning
              namespace: tea-aaa-sandbox
            exp_annotations:
              summary: "Sandboxes in tea-aaa-sandbox sent 60GiB to the public internet in the last hour"
              description: "One workspace's /v1/sandboxes sandboxes sent far more to public destinations in the last hour than any plan's outbound allowance makes ordinary (the meter counts what they send, not what they download). Find them with kubectl -n tea-aaa-sandbox get batchsandboxes,pods -o wide; stop one through the owner's /v1/sandboxes API or, for abuse, kubectl -n tea-aaa-sandbox delete batchsandbox <name>. Runbook: docs/ADR104-sandbox-render-parity.md D11"

  # The workspace total is the signal, not any one node: a workspace whose
  # sandboxes spread across two nodes, each below the threshold, is above it.
  - name: a workspace is summed across the nodes its sandboxes run on
    interval: 1m
    input_series:
      # 30 GiB an hour on each of two nodes: 60 GiB for the workspace.
      - series: 'bex_app_direct_egress_bytes_total{namespace="tea-aaa-sandbox", app_id="sandboxes", node="sandbox-a", source_instance="boot-a"}'
        values: "0+536870912x180"
      - series: 'bex_app_direct_egress_bytes_total{namespace="tea-aaa-sandbox", app_id="sandboxes", node="sandbox-b", source_instance="boot-b"}'
        values: "0+536870912x180"
    alert_rule_test:
      - eval_time: 90m
        alertname: SandboxWorkspaceEgressHigh
        exp_alerts:
          - *aaa_fires

  # `for: 15m` holds the alert in pending while the hour first crosses the
  # threshold (51 GiB of a 1 GiB-a-minute stream at minute 51), so a counter
  # blip or one evaluation above it never pages.
  - name: the alert waits out its for duration
    interval: 1m
    input_series:
      - series: 'bex_app_direct_egress_bytes_total{namespace="tea-aaa-sandbox", app_id="sandboxes", node="sandbox-a", source_instance="boot-a"}'
        values: "0+1073741824x180"
    alert_rule_test:
      - eval_time: 55m
        alertname: SandboxWorkspaceEgressHigh
        exp_alerts: []
      - eval_time: 62m
        alertname: SandboxWorkspaceEgressHigh
        exp_alerts: []
      - eval_time: 70m
        alertname: SandboxWorkspaceEgressHigh
        exp_alerts:
          - *aaa_fires

  # An unhealthy meter under-counts, so silence on it would hide abuse: the
  # alert is not gated on meter health (EgressMeterUnhealthy pages for the
  # meter itself).
  - name: an unhealthy meter still fires
    interval: 1m
    input_series:
      - series: 'bex_app_direct_egress_bytes_total{namespace="tea-aaa-sandbox", app_id="sandboxes", node="sandbox-a", source_instance="boot-a"}'
        values: "0+1073741824x180"
      - series: 'bex_egress_meter_healthy{node="sandbox-a", source_instance="boot-a"}'
        values: "0x180"
    alert_rule_test:
      - eval_time: 90m
        alertname: SandboxWorkspaceEgressHigh
        exp_alerts:
          - *aaa_fires

  # A meter that reports nothing has counted nothing: no series, no alert.
  - name: a meter that reports nothing stays silent
    interval: 1m
    input_series:
      - series: 'bex_egress_meter_healthy{node="sandbox-a", source_instance="boot-a"}'
        values: "0x180"
    alert_rule_test:
      - eval_time: 90m
        alertname: SandboxWorkspaceEgressHigh
        exp_alerts: []

  # A restored counter checkpoint reads to Prometheus as a reset, and increase()
  # then counts the whole restored value as one hour's bytes. The counter below
  # holds 100 GiB, is restored 10 kB lower at minute 30 and then grows by about
  # 1 kB a minute: that is 100 GiB of "increase" for no bytes at all.
  - name: a counter reset in the window does not alert
    interval: 1m
    input_series:
      - series: 'bex_app_direct_egress_bytes_total{namespace="tea-aaa-sandbox", app_id="sandboxes", node="sandbox-a", source_instance="boot-a"}'
        values: "107374182400+1000x30 107374172400+1000x150"
    alert_rule_test:
      - eval_time: 45m
        alertname: SandboxWorkspaceEgressHigh
        exp_alerts: []
      - eval_time: 80m
        alertname: SandboxWorkspaceEgressHigh
        exp_alerts: []

  # Only sandbox egress is this alert's: an App's egress, however large, is
  # the billed direct source and stays out.
  - name: app egress does not raise the sandbox alert
    interval: 1m
    input_series:
      - series: 'bex_app_direct_egress_bytes_total{namespace="tea-aaa", app_id="srv-abc", node="tenant-a", source_instance="boot-t"}'
        values: "0+1073741824x180"
    alert_rule_test:
      - eval_time: 90m
        alertname: SandboxWorkspaceEgressHigh
        exp_alerts: []

  # The recorded series the alert, the panel and these cases share: the guarded
  # hourly sum per workspace, and the one threshold constant.
  - name: the recorded series are the guarded sum and the threshold
    interval: 1m
    input_series:
      - series: 'bex_app_direct_egress_bytes_total{namespace="tea-aaa-sandbox", app_id="sandboxes", node="sandbox-a", source_instance="boot-a"}'
        values: "0+1073741824x180"
      - series: 'bex_app_direct_egress_bytes_total{namespace="tea-aaa-sandbox", app_id="sandboxes", node="sandbox-b", source_instance="boot-b"}'
        values: "0+1073741824x180"
      - series: 'bex_app_direct_egress_bytes_total{namespace="tea-bbb-sandbox", app_id="sandboxes", node="sandbox-a", source_instance="boot-a"}'
        values: "0+10737418x180"
      # Reset in the hour: this workspace is left out of the recorded sum.
      - series: 'bex_app_direct_egress_bytes_total{namespace="tea-ccc-sandbox", app_id="sandboxes", node="sandbox-a", source_instance="boot-a"}'
        values: "100+10x70 50+10x110"
      - series: 'bex_app_direct_egress_bytes_total{namespace="tea-aaa", app_id="srv-abc", node="tenant-a", source_instance="boot-t"}'
        values: "0+1073741824x180"
    promql_expr_test:
      - expr: bex:sandbox_workspace_egress_bytes:increase1h
        eval_time: 90m
        exp_samples:
          - labels: 'bex:sandbox_workspace_egress_bytes:increase1h{namespace="tea-aaa-sandbox"}'
            value: 128849018880
          - labels: 'bex:sandbox_workspace_egress_bytes:increase1h{namespace="tea-bbb-sandbox"}'
            value: 644245080
      - expr: bex:sandbox_workspace_egress_bytes:threshold
        eval_time: 90m
        exp_samples:
          - labels: 'bex:sandbox_workspace_egress_bytes:threshold'
            value: 53687091200
