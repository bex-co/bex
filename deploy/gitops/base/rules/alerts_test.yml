# promtool unit tests for the non-obvious alert expressions (w3/m6/t007).
# Trivial existence/threshold rules (NodeNotReady, BexApiDown) are not tested
# here — a test would just restate `== 0`; see the milestone notes. Certificate
# readiness is now split by responsibility (platform pages vs. tenant custom-domain
# DNS is info-only), which is a real discriminator — see the test at the bottom.
# Run: promtool test rules alerts_test.yml  (with alerting_rules.yml alongside).
rule_files:
  - alerting_rules.yml

evaluation_interval: 1m

tests:
  - name: sustained webhook admission pressure fires and then clears
    interval: 1m
    input_series:
      - series: 'bex_webhooks_delivery_admissions_total{result="capped",job="bex-api",instance="prod-a"}'
        values: "0+20x30 600x20"
    alert_rule_test:
      - eval_time: 14m
        alertname: WebhookDeliveryAdmissionPressure
        exp_alerts: []
      - eval_time: 20m
        alertname: WebhookDeliveryAdmissionPressure
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Outbound webhook admission is chronically hitting its workspace bound"
              description: "More than 100 webhook notifications were capped in each rolling 15m window for >10m. First investigate event amplification and unhealthy endpoints/retry pressure; raise BEX_MAX_WEBHOOK_DELIVERIES_PER_WORKSPACE only after confirming database and worker capacity. Runbook: docs/ADR010-observability.md#webhook-admission-pressure"
      - eval_time: 45m
        alertname: WebhookDeliveryAdmissionPressure
        exp_alerts: []

  - name: enabled billing exposes durable backlog reject and ambiguity
    interval: 1m
    input_series:
      - series: "bex_billing_enabled"
        values: "1x30"
      - series: "bex_billing_outbox_oldest_pending_age_seconds"
        values: "300000x30"
      - series: "bex_billing_export_rejected_rows"
        values: "1x30"
      - series: "bex_billing_export_ambiguous_rows"
        values: "1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: BillingExportBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Stripe billing export backlog is older than 72h"
              description: "A sealed usage row has remained pending for >24h beyond the 48h seal horizon. Inspect without replay: scripts/stripe-billing-reconcile.sh issues. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"
      - eval_time: 20m
        alertname: BillingPermanentReject
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Stripe permanently rejected billing meter events"
              description: "One or more usage rows are held in the durable reject queue. Dry-run reconciliation before retry or acknowledgement: scripts/stripe-billing-reconcile.sh issues. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"
      - eval_time: 20m
        alertname: BillingExportAmbiguity
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Stripe billing export has an old ambiguous provider outcome"
              description: "An attempted event exceeded Stripe's 24h identifier window without a local stamp and automatic replay stopped. Reconcile provider summaries, then explicitly mark repaired or acknowledge; never blind-retry. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

  - name: billing operation failures are bounded and actionable
    interval: 1m
    input_series:
      - series: 'bex_billing_enabled{job="bex-api",instance="prod"}'
        values: "1x30"
      - series: 'bex_billing_operations_total{job="bex-api",instance="prod",operation="local_stamp",result="error"}'
        values: "0+1x30"
      - series: 'bex_billing_operations_total{job="bex-api",instance="prod",operation="duplicate_customer",result="error"}'
        values: "0+1x30"
      - series: 'bex_billing_operations_total{job="bex-api",instance="prod",operation="invoice_read",result="error"}'
        values: "0+1x30"
      - series: 'bex_billing_operations_total{job="bex-api",instance="prod",operation="webhook_version",result="error"}'
        values: "0+1x30"
      - series: 'bex_billing_operations_total{job="bex-api",instance="prod",operation="provisioning",result="error"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: BillingLocalStampFailure
        exp_alerts:
          - exp_labels: { severity: critical, job: bex-api, instance: prod }
            exp_annotations:
              summary: "Stripe accepted usage but the local export stamp failed"
              description: "Provider acceptance may be ahead of local state. Restore Postgres and reconcile before the 24h identifier window expires. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"
      - eval_time: 20m
        alertname: BillingProviderDuplicate
        exp_alerts:
          - exp_labels: { severity: critical, job: bex-api, instance: prod }
            exp_annotations:
              summary: "Stripe billing found duplicate Customer or Subscription ownership"
              description: "The fail-closed ownership resolver found multiple provider objects for one workspace. Do not delete automatically; inspect metadata and subscription status under the test-mode guard. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"
      - eval_time: 20m
        alertname: BillingInvoiceReadDegraded
        exp_alerts:
          - exp_labels: { severity: warning, job: bex-api, instance: prod }
            exp_annotations:
              summary: "Stripe invoice read-back is degraded"
              description: "Repeated invoice preview/history reads failed; the usage surface is falling back to estimates. Check restricted-key permissions and Stripe API health. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"
      - eval_time: 20m
        alertname: BillingWebhookDrift
        exp_alerts:
          - exp_labels: { severity: critical, job: bex-api, instance: prod }
            exp_annotations:
              summary: "Stripe billing webhook signature, API version, or mode drifted"
              description: "Webhook intake rejected a signature, pinned API version, or test/live mode mismatch. Verify the test endpoint and rotate add→verify→revoke; never weaken verification. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"
      - eval_time: 20m
        alertname: BillingProvisioningFailure
        exp_alerts:
          - exp_labels: { severity: warning, job: bex-api, instance: prod }
            exp_annotations:
              summary: "Stripe Customer or Subscription provisioning is repeatedly failing"
              description: "Usage cannot export until the workspace's unique Customer and metered Subscription converge. Inspect catalog/key permissions and duplicate-object alerts. Runbook: docs/runbooks/stripe-billing-setup.md#operations-reconciliation-and-repair"

  - name: disabled billing never alerts on stale retained series
    interval: 1m
    input_series:
      - series: 'bex_billing_enabled{job="bex-api",instance="prod"}'
        values: "0x30"
      - series: 'bex_billing_outbox_oldest_pending_age_seconds{job="bex-api",instance="prod"}'
        values: "300000x30"
      - series: 'bex_billing_export_rejected_rows{job="bex-api",instance="prod"}'
        values: "1x30"
      - series: 'bex_billing_export_ambiguous_rows{job="bex-api",instance="prod"}'
        values: "1x30"
      - series: 'bex_billing_operations_total{job="bex-api",instance="prod",operation="local_stamp",result="error"}'
        values: "0+10x30"
      - series: 'bex_billing_operations_total{job="bex-api",instance="prod",operation="duplicate_subscription",result="error"}'
        values: "0+10x30"
      - series: 'bex_billing_operations_total{job="bex-api",instance="prod",operation="invoice_read",result="error"}'
        values: "0+10x30"
      - series: 'bex_billing_operations_total{job="bex-api",instance="prod",operation="webhook_signature",result="error"}'
        values: "0+10x30"
      - series: 'bex_billing_operations_total{job="bex-api",instance="prod",operation="provisioning",result="error"}'
        values: "0+10x30"
    alert_rule_test:
      - { eval_time: 20m, alertname: BillingExportBacklog, exp_alerts: [] }
      - { eval_time: 20m, alertname: BillingPermanentReject, exp_alerts: [] }
      - { eval_time: 20m, alertname: BillingExportAmbiguity, exp_alerts: [] }
      - { eval_time: 20m, alertname: BillingLocalStampFailure, exp_alerts: [] }
      - { eval_time: 20m, alertname: BillingProviderDuplicate, exp_alerts: [] }
      - {
          eval_time: 20m,
          alertname: BillingInvoiceReadDegraded,
          exp_alerts: [],
        }
      - { eval_time: 20m, alertname: BillingWebhookDrift, exp_alerts: [] }
      - {
          eval_time: 20m,
          alertname: BillingProvisioningFailure,
          exp_alerts: [],
        }

  - name: missing tenant-node egress meter target
    interval: 1m
    input_series:
      - series: 'kube_node_info{node="tenant-a"}'
        values: "1x10"
      - series: 'kube_node_info{node="tenant-b"}'
        values: "1x10"
      - series: 'up{job="bex-egress-meter", node="tenant-a"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: EgressMeterTargetMissing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Not every tenant node has a scrapeable egress meter"
              description: "Outbound accounting is incomplete: the Ready egress-meter target count differs from the untainted tenant-node count. Do not collect affected hourly egress windows. Debug: kubectl -n bex-system get pods -l app.bex.co/component=egress-meter -o wide; kubectl get nodes --show-labels"

  - name: platform and control-plane nodes do not require egress meters
    interval: 1m
    input_series:
      - series: 'kube_node_info{node="tenant-a"}'
        values: "1x10"
      - series: 'kube_node_info{node="platform-a"}'
        values: "1x10"
      - series: 'kube_node_info{node="control-plane-a"}'
        values: "1x10"
      - series: 'kube_node_spec_taint{node="platform-a", key="bex.co/platform", value="true", effect="NoSchedule"}'
        values: "1x10"
      - series: 'kube_node_role{node="control-plane-a", role="control-plane"}'
        values: "1x10"
      - series: 'up{job="bex-egress-meter", node="tenant-a"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: EgressMeterTargetMissing
        exp_alerts: []

  - name: egress meter unhealthy is per tenant node
    interval: 1m
    input_series:
      - series: 'bex_egress_meter_healthy{node="tenant-a", source_instance="boot-a"}'
        values: "0x10"
      - series: 'bex_egress_meter_healthy{node="tenant-b", source_instance="boot-b"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: EgressMeterUnhealthy
        exp_alerts:
          - exp_labels:
              severity: critical
              node: tenant-a
            exp_annotations:
              summary: "Egress meter on tenant-a is incomplete"
              description: "At least one App Pod IP lacks stable attribution, or the meter reported a map/checkpoint error. The affected hourly source must fail rather than become zero. Debug: kubectl -n bex-system logs -l app.bex.co/component=egress-meter --prefix"

  - name: egress meter map pressure threshold
    interval: 1m
    input_series:
      - series: 'bex_egress_meter_resource_map_pressure_ratio{node="tenant-a", source_instance="boot-a"}'
        values: "0.90x20"
      - series: 'bex_egress_meter_resource_map_pressure_ratio{node="tenant-b", source_instance="boot-b"}'
        values: "0.50x20"
    alert_rule_test:
      - eval_time: 11m
        alertname: EgressMeterMapPressure
        exp_alerts:
          - exp_labels:
              severity: warning
              node: tenant-a
            exp_annotations:
              summary: "Egress meter resource map on tenant-a is 90% full"
              description: "The bounded App counter map is above 80%; reaching capacity makes new attribution fail closed. Debug: kubectl -n bex-system logs -l app.bex.co/component=egress-meter --prefix"

  - name: egress meter counter loss is visible
    interval: 1m
    input_series:
      - series: 'bex_egress_meter_last_counter_loss_time_seconds{node="tenant-a", source_instance="boot-a"}'
        values: "60x10"
      - series: 'bex_egress_meter_last_counter_loss_time_seconds{node="tenant-b", source_instance="boot-b"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 2m
        alertname: EgressMeterCounterLoss
        exp_alerts:
          - exp_labels:
              severity: critical
              node: tenant-a
            exp_annotations:
              summary: "Egress meter on tenant-a detected counter loss"
              description: "The meter restored a node checkpoint or observed a counter decrease within the last hour. Its durable event timestamp rejects every overlapping direct-egress window automatically; inspect the node and pinned maps."

  - name: websocket egress meter missing
    interval: 1m
    input_series:
      - series: 'up{job="traefik"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: WebSocketEgressMeterUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "WebSocket outbound accounting is unavailable"
              description: "The Traefik hijack-path byte meter is missing or unhealthy. Public WebSocket usage windows must fail rather than omit frames. Debug: kubectl -n traefik logs -l app.kubernetes.io/name=traefik; kubectl -n traefik get pods -o wide"

  - name: datastore proxy accounting health
    interval: 1m
    input_series:
      - series: 'up{job="bex-pg-proxy"}'
        values: "1x10"
      - series: 'bex_pg_proxy_healthy{resource_kind="postgres"}'
        values: "1x10"
      - series: 'up{job="bex-kv-proxy"}'
        values: "1x10"
      - series: 'bex_kv_proxy_healthy{resource_kind="key_value"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: PostgresEgressProxyUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: KeyValueEgressProxyUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Key Value outbound accounting is unavailable"
              description: "The public Key Value proxy meter is missing or unhealthy. Public Key Value usage windows must fail rather than undercount. Debug: kubectl -n bex-system get pods -l app.bex.co/component=kv-sni-proxy -o wide"

  # PlatformDatabaseBackupStale: WAL archiver age math — one alert instance per
  # platform database, firing at >26h but not for recent archive activity.
  # cnpg_pg_stat_archiver_last_archived_time is a Unix timestamp (seconds);
  # at eval_time=30m time()=1800, so series value encodes the last-archived epoch.
  - name: platform database WAL archiver staleness fans out by cluster
    interval: 1m
    input_series:
      # stale: age = 1800 - (-95400) = 97200s = exactly 27h → fire
      - series: 'cnpg_pg_stat_archiver_last_archived_time{job="cnpg-platform-db", namespace="bex-system", cnpg_io_cluster="bex-db", pod="bex-db-1"}'
        values: "-95400x60"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{job="cnpg-platform-db", namespace="auth", cnpg_io_cluster="kratos-db", pod="kratos-db-1"}'
        values: "-95400x60"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{job="cnpg-platform-db", namespace="auth", cnpg_io_cluster="hydra-db", pod="hydra-db-1"}'
        values: "-95400x60"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{job="cnpg-platform-db", namespace="auth", cnpg_io_cluster="openfga-db", pod="openfga-db-1"}'
        values: "-95400x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: PlatformDatabaseBackupStale
        exp_alerts:
          - exp_labels:
              cnpg_io_cluster: bex-db
              job: cnpg-platform-db
              severity: critical
              namespace: bex-system
              pod: bex-db-1
            exp_annotations:
              summary: "bex-system/bex-db WAL archiving stalled (>26h)"
              description: "bex-system/bex-db has not archived a WAL segment in >26h — platform recovery data is at risk. Debug: inspect pg_stat_archiver, the cluster's Barman ObjectStore, the barman-cloud deployment and sidecar logs, then verify the referenced Secret exists without printing it. Runbook: docs/ADR031-platform-data-backup.md"
          - exp_labels:
              cnpg_io_cluster: kratos-db
              job: cnpg-platform-db
              severity: critical
              namespace: auth
              pod: kratos-db-1
            exp_annotations:
              summary: "auth/kratos-db WAL archiving stalled (>26h)"
              description: "auth/kratos-db has not archived a WAL segment in >26h — platform recovery data is at risk. Debug: inspect pg_stat_archiver, the cluster's Barman ObjectStore, the barman-cloud deployment and sidecar logs, then verify the referenced Secret exists without printing it. Runbook: docs/ADR031-platform-data-backup.md"
          - exp_labels:
              cnpg_io_cluster: hydra-db
              job: cnpg-platform-db
              severity: critical
              namespace: auth
              pod: hydra-db-1
            exp_annotations:
              summary: "auth/hydra-db WAL archiving stalled (>26h)"
              description: "auth/hydra-db has not archived a WAL segment in >26h — platform recovery data is at risk. Debug: inspect pg_stat_archiver, the cluster's Barman ObjectStore, the barman-cloud deployment and sidecar logs, then verify the referenced Secret exists without printing it. Runbook: docs/ADR031-platform-data-backup.md"
          - exp_labels:
              cnpg_io_cluster: openfga-db
              job: cnpg-platform-db
              severity: critical
              namespace: auth
              pod: openfga-db-1
            exp_annotations:
              summary: "auth/openfga-db WAL archiving stalled (>26h)"
              description: "auth/openfga-db has not archived a WAL segment in >26h — platform recovery data is at risk. Debug: inspect pg_stat_archiver, the cluster's Barman ObjectStore, the barman-cloud deployment and sidecar logs, then verify the referenced Secret exists without printing it. Runbook: docs/ADR031-platform-data-backup.md"

  - name: platform database WAL archiver activity is healthy
    interval: 1m
    input_series:
      # recent: age = 1800 - (-1800) = 3600s = 1h — well under 26h → NOT fire
      - series: 'cnpg_pg_stat_archiver_last_archived_time{job="cnpg-platform-db", namespace="bex-system", cnpg_io_cluster="bex-db", pod="bex-db-1"}'
        values: "-1800x60"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{job="cnpg-platform-db", namespace="auth", cnpg_io_cluster="kratos-db", pod="kratos-db-1"}'
        values: "-1800x60"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{job="cnpg-platform-db", namespace="auth", cnpg_io_cluster="hydra-db", pod="hydra-db-1"}'
        values: "-1800x60"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{job="cnpg-platform-db", namespace="auth", cnpg_io_cluster="openfga-db", pod="openfga-db-1"}'
        values: "-1800x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: PlatformDatabaseBackupStale
        exp_alerts: []

  # BackupCronJobStale: age math must fire at >26h, NOT at 25h.
  - name: backup staleness age math
    interval: 1m
    input_series:
      # promtool's clock starts at t=0, so at eval_time 30m time()=1800s and the
      # age is 1800 - <series value>. Pin each series so the age lands exactly on
      # one side of the 26h (93600s) threshold.
      # etcd-backup: age = 1800 - (-88200) = 90000s = exactly 25h -> NOT fire.
      - series: 'kube_cronjob_status_last_successful_time{cronjob="etcd-backup", namespace="kube-system"}'
        values: "-88200x60"
      - series: 'kube_cronjob_spec_suspend{cronjob="etcd-backup", namespace="kube-system"}'
        values: "0x60"
      # openbao-backup: age = 1800 - (-95400) = 97200s = exactly 27h -> fire.
      - series: 'kube_cronjob_status_last_successful_time{cronjob="openbao-backup", namespace="secrets"}'
        values: "-95400x60"
      - series: 'kube_cronjob_spec_suspend{cronjob="openbao-backup", namespace="secrets"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: BackupCronJobStale
        exp_alerts:
          - exp_labels:
              severity: critical
              cronjob: openbao-backup
              namespace: secrets
            exp_annotations:
              summary: "Backup secrets/openbao-backup has not succeeded in >26h"
              description: "The nightly openbao-backup has no successful backup in over 26h — silent backup rot is unrecoverable data loss. Debug: kubectl -n secrets get cronjob openbao-backup; kubectl -n secrets get jobs -l batch.kubernetes.io/cronjob-name=openbao-backup. Runbooks: docs/ADR011-etcd-backup-restore.md, docs/ADR015-openbao-backup-restore.md, docs/ADR021-keyvalue-management.md, docs/ADR031-platform-data-backup.md"

  - name: KeyValue backup staleness includes never-successful and excludes suspended
    interval: 1m
    input_series:
      # 27h old and never successful: the created-time branch must fire.
      - series: 'kube_cronjob_created{cronjob="kvbak-red-never", namespace="default"}'
        values: "-95400x60"
      - series: 'kube_cronjob_spec_suspend{cronjob="kvbak-red-never", namespace="default"}'
        values: "0x60"
      # Equally stale but deliberately suspended: must remain quiet.
      - series: 'kube_cronjob_status_last_successful_time{cronjob="kvbak-red-suspended", namespace="default"}'
        values: "-95400x60"
      - series: 'kube_cronjob_spec_suspend{cronjob="kvbak-red-suspended", namespace="default"}'
        values: "1x60"
      # Active and recent: must remain quiet.
      - series: 'kube_cronjob_status_last_successful_time{cronjob="kvbak-red-healthy", namespace="default"}'
        values: "-1800x60"
      - series: 'kube_cronjob_spec_suspend{cronjob="kvbak-red-healthy", namespace="default"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: BackupCronJobStale
        exp_alerts:
          - exp_labels:
              severity: critical
              cronjob: kvbak-red-never
              namespace: default
            exp_annotations:
              summary: "Backup default/kvbak-red-never has not succeeded in >26h"
              description: "The nightly kvbak-red-never has no successful backup in over 26h — silent backup rot is unrecoverable data loss. Debug: kubectl -n default get cronjob kvbak-red-never; kubectl -n default get jobs -l batch.kubernetes.io/cronjob-name=kvbak-red-never. Runbooks: docs/ADR011-etcd-backup-restore.md, docs/ADR015-openbao-backup-restore.md, docs/ADR021-keyvalue-management.md, docs/ADR031-platform-data-backup.md"

  # TraefikHigh5xxRate: a tiny denominator (1 request total) must NOT fire even at
  # 100% 5xx — the traffic floor guards against alerting on noise.
  - name: 5xx ratio ignores tiny denominators
    interval: 1m
    input_series:
      # 1 fresh 5xx per ~2h => rate well under the 0.1 req/s floor.
      - series: 'traefik_service_requests_total{code="500", service="web@kubernetes"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 30m
        alertname: TraefikHigh5xxRate
        exp_alerts: []

  # TraefikHigh5xxRate: real 5xx spike over the floor SHOULD fire after 10m.
  - name: 5xx ratio fires on a real spike
    interval: 1m
    input_series:
      - series: 'traefik_service_requests_total{code="500", service="web@kubernetes"}'
        values: "0+60x30" # 60 req/min == 1 req/s of 5xx
      - series: 'traefik_service_requests_total{code="200", service="web@kubernetes"}'
        values: "0+60x30" # 60 req/min == 1 req/s of 2xx => 50% 5xx, 2 req/s total
    alert_rule_test:
      - eval_time: 15m
        alertname: TraefikHigh5xxRate
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Traefik is serving >5% 5xx responses"
              description: "Over 5% of edge requests have been 5xx for >10m (with meaningful traffic). Debug: kubectl -n traefik logs deploy/traefik; check upstream service health and recent deploys."

  # PlatformPodCrashLooping: must respect for: 10m — a reason that clears at 8m
  # never fires; one that persists past 10m does.
  - name: crashloop respects the 10m for-duration
    interval: 1m
    input_series:
      # persists the whole window => fires at/after 10m
      - series: 'kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff", namespace="bex-system", pod="bex-api-abc", container="api"}'
        values: "1x30"
      # clears at minute 8 => never satisfies for: 10m
      - series: 'kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff", namespace="argocd", pod="argocd-repo-xyz", container="repo-server"}'
        values: "1x8 0x22"
    alert_rule_test:
      - eval_time: 9m
        alertname: PlatformPodCrashLooping
        exp_alerts: [] # not yet 10m for either
      - eval_time: 12m
        alertname: PlatformPodCrashLooping
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: bex-system
              pod: bex-api-abc
              container: api
            exp_annotations:
              summary: "bex-system/bex-api-abc (api) is CrashLoopBackOff"
              description: "Platform container has been CrashLoopBackOff for >10m. Debug: kubectl -n bex-system describe pod bex-api-abc; kubectl -n bex-system logs bex-api-abc -c api --previous"

  # PersistentVolumeFillingUp: the OPS alert stays on the PHYSICAL PVC
  # (kubelet_volume_stats_capacity_bytes), fires above 85%, respects the 15m
  # for-duration. w4/m91 repointed the USER-FACING disk_capacity metric at a
  # datastore's logical/billed size — this ops alert deliberately keeps the
  # physical series, because operations care about the real volume filling. This
  # test pins that split: a genuinely-full platform PVC fires, while a managed
  # 1 GB Postgres sitting on the fixed 10 GiB Hetzner floor (8% physical, though
  # ~81% of its logical size) must NOT fire here.
  - name: PersistentVolumeFillingUp evaluates the physical PVC above 85% for 15m
    interval: 1m
    input_series:
      # 90% full platform PVC (above 85%) — fires after 15m.
      - series: 'kubelet_volume_stats_used_bytes{namespace="bex-system", persistentvolumeclaim="loki-0"}'
        values: "9000000000x30"
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="bex-system", persistentvolumeclaim="loki-0"}'
        values: "10000000000x30"
      # A managed 1 GB Postgres on the 10 GiB physical floor: ~8% physical — must
      # NOT fire, even though its logical disk_capacity would read ~81% full.
      - series: 'kubelet_volume_stats_used_bytes{namespace="tenant-a", persistentvolumeclaim="pg-1"}'
        values: "850000000x30"
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="tenant-a", persistentvolumeclaim="pg-1"}'
        values: "10000000000x30"
    alert_rule_test:
      - eval_time: 14m
        alertname: PersistentVolumeFillingUp
        exp_alerts: [] # not yet 15m for the 90% PVC
      - eval_time: 16m
        alertname: PersistentVolumeFillingUp
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: bex-system
              persistentvolumeclaim: loki-0
            exp_annotations:
              summary: "PVC bex-system/loki-0 is 90% full"
              description: "A platform PVC (etcd/Loki/OpenBao/Prometheus PVs — hcloud-csi on prod, local-path on the mock) is >85% full. Debug: kubectl -n bex-system get pvc loki-0; grow the volume or prune data."

  # ZotRegistryFillingUp: fires above 70% (not at 65%), respects the 10m for-duration.
  - name: ZotRegistryFillingUp threshold and for-duration
    interval: 1m
    input_series:
      # 72% full (above 70%) — fires after 10m
      - series: 'kubelet_volume_stats_used_bytes{namespace="bex-registry", persistentvolumeclaim="zot-data"}'
        values: "7200000000x30"
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="bex-registry", persistentvolumeclaim="zot-data"}'
        values: "10000000000x30"
      # 65% full (below 70%) — must NOT fire
      - series: 'kubelet_volume_stats_used_bytes{namespace="bex-registry", persistentvolumeclaim="zot-other"}'
        values: "6500000000x30"
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="bex-registry", persistentvolumeclaim="zot-other"}'
        values: "10000000000x30"
    alert_rule_test:
      - eval_time: 9m
        alertname: ZotRegistryFillingUp
        exp_alerts: [] # not yet 10m for the 72% PVC
      - eval_time: 16m
        alertname: ZotRegistryFillingUp
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: bex-registry
              persistentvolumeclaim: zot-data
            exp_annotations:
              summary: "Zot registry PVC zot-data is 72% full"
              description: "The Zot OCI registry PVC is >70% full — a runaway rebuild loop can fill it and silently 500 on pushes. Retention policy keeps 5 generations per repo; check kubelet_volume_stats_available_bytes, stale repos, and Zot logs, then resize if needed."

  # ZotRegistryAlmostFull: pages on either >85% occupancy or <10 GiB free,
  # and respects the shorter 5m critical for-duration.
  - name: ZotRegistryAlmostFull percentage and absolute headroom
    interval: 1m
    input_series:
      - series: 'kubelet_volume_stats_used_bytes{namespace="bex-registry", persistentvolumeclaim="zot-critical"}'
        values: "92000000000x15"
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="bex-registry", persistentvolumeclaim="zot-critical"}'
        values: "100000000000x15"
      - series: 'kubelet_volume_stats_available_bytes{namespace="bex-registry", persistentvolumeclaim="zot-critical"}'
        values: "8000000000x15"
    alert_rule_test:
      - eval_time: 4m
        alertname: ZotRegistryAlmostFull
        exp_alerts: []
      - eval_time: 7m
        alertname: ZotRegistryAlmostFull
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: bex-registry
              persistentvolumeclaim: zot-critical
            exp_annotations:
              summary: "Zot registry PVC zot-critical is almost full"
              description: "The Zot OCI registry PVC is >85% full or has <10 GiB available; new image pushes can fail with HTTP 500. Grow the PVC immediately and verify retention/GC is reclaiming old layers."

  # AdminCertExpiringSoon: fires when (creation + 1yr - now) < 30d.
  # Uses the bex-kubeconfig Secret creation timestamp as a proxy for cert issue time.
  # At eval_time 62m, time() = 3720s.
  # For the expression (created + 31536000 - time()) < 2592000 to be true from t=0:
  #   created + 31536000 - 0 < 2592000  →  created < -28944000
  # Use created = -29000000 (always-firing for the full for: 1h window).
  - name: AdminCertExpiringSoon fires within 30d window
    interval: 1m
    input_series:
      - series: 'kube_secret_created{namespace="bex-capi", secret="bex-kubeconfig"}'
        values: "-29000000x70"
    alert_rule_test:
      - eval_time: 62m
        alertname: AdminCertExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: bex-capi
              secret: bex-kubeconfig
            exp_annotations:
              summary: "App cluster admin cert (bex-kubeconfig) expires within 30d"
              description: "The bex-kubeconfig Secret (holds CN=kubernetes-admin, O=system:masters cert, 1-year validity from CAPI mint) is estimated to expire within 30 days. Renew: sudo kubeadm certs renew all (on each CP node), then re-fetch: scripts/fetch-app-kubeconfig.sh. Scoped kubeconfig: scripts/operator-kubeconfig.sh. Break-glass check: sudo kubeadm certs check-expiration. Runbook: docs/ADR036-ca-rotation-runbook.md"

  - name: AdminCertExpiringSoon does not fire with >30d remaining
    interval: 1m
    input_series:
      # created = 0 → remaining = 0 + 31536000 - 3720 = 31532280s ≈ 365d >> 30d → no fire
      - series: 'kube_secret_created{namespace="bex-capi", secret="bex-kubeconfig"}'
        values: "0x70"
    alert_rule_test:
      - eval_time: 62m
        alertname: AdminCertExpiringSoon
        exp_alerts: []

  # OpenBaoSealed: per-member — a sealed follower (gauge 0) fires even while the
  # leader is unsealed (gauge 1). Proves the alert is NOT masked by a healthy
  # member (the reason it reads per-pod telemetry, not the round-robin Service).
  - name: openbao sealed is per-member
    interval: 1m
    input_series:
      - series: 'vault_core_unsealed{namespace="secrets", pod="openbao-0"}'
        values: "1x10" # leader unsealed
      - series: 'vault_core_unsealed{namespace="secrets", pod="openbao-1"}'
        values: "0x10" # follower sealed
    alert_rule_test:
      - eval_time: 6m
        alertname: OpenBaoSealed
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: secrets
              pod: openbao-1
            exp_annotations:
              summary: "OpenBao member openbao-1 is SEALED"
              description: "An OpenBao raft member has been sealed for >5m, which 503s the tenant env-vars API. Unseal: scripts/bao-init.sh (unseal path); runbook docs/ADR013-secrets.md. Debug: kubectl -n secrets get pods; kubectl -n secrets exec openbao-1 -- bao status"

  # w7/m82 t005 — the build-plane SLO and the flake-vs-user discriminator.
  # Both are exactly the "non-obvious expression" this pack exists for: the SLO
  # ratio must EXCLUDE tenant errors, and the correlated-failure alert must key
  # on the SPREAD of failures across workspaces rather than their count.
  - name: tenant build failures never consume the platform error budget
    interval: 1m
    input_series:
      # A steady stream of tenant-caused failures and nothing else. This is a
      # bad afternoon for tenants, not an outage: the SLO must stay at 1.
      - series: 'bex_build_outcomes_total{outcome="user_failed"}'
        values: "0+1x60"
      - series: 'bex_build_outcomes_total{outcome="succeeded"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: BuildInfraSuccessBelowSLO
        exp_alerts: []

  - name: platform-caused build failures breach the SLO
    interval: 1m
    input_series:
      - series: 'bex_build_outcomes_total{outcome="infra_failed"}'
        values: "0+1x60"
      - series: 'bex_build_outcomes_total{outcome="succeeded"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: BuildInfraSuccessBelowSLO
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Build infrastructure success is 50% (SLO 99.5%)"
              description: "Builds are failing for reasons the platform owns, not tenant code (outcome=infra_failed excludes user_failed by construction). Check bex_build_outcomes_total by outcome, the Zot push path, and node capacity on the build pools. Runbook context: docs/ADR060-build-worker-reliability-and-performance.md D5."

  - name: many failures in ONE workspace do not page
    interval: 1m
    input_series:
      # 30 infra failures, all in one workspace. Loud, but not correlated —
      # this is the false page the discriminator exists to suppress.
      - series: 'bex_build_infra_failures_total{workspace="tea-aaa"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: BuildInfraFailuresCorrelatedAcrossWorkspaces
        exp_alerts: []

  - name: failures spread across workspaces are a platform incident
    interval: 1m
    input_series:
      # One failure each in three independent workspaces: far fewer failures
      # than the case above, but the shape of a shared-dependency fault.
      - series: 'bex_build_infra_failures_total{workspace="tea-aaa"}'
        values: "0+1x60"
      - series: 'bex_build_infra_failures_total{workspace="tea-bbb"}'
        values: "0+1x60"
      - series: 'bex_build_infra_failures_total{workspace="tea-ccc"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: BuildInfraFailuresCorrelatedAcrossWorkspaces
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Infra-classified build failures across 3 distinct workspaces"
              description: "Independent workspaces are failing builds infra-side at the same time, which is the signature of a platform fault rather than tenant code. Suspect the shared dependencies first: Zot (push/pull), the build node pools, image pulls. Isolated per-tenant failures deliberately do NOT fire this."

  # ── Build queue time (w7/m83) ──────────────────────────────────────────────
  # The threshold's whole justification is its relationship to bex-api's 18m
  # DeployGateTimeout, so the tests assert both edges of that head room: silent
  # while the deploy is comfortably safe, firing with minutes still to spare.
  - name: a queued build stays silent while the deploy is still comfortably safe
    interval: 1m
    input_series:
      # One build queues at t=0 and its age grows a minute per minute.
      - series: "bex_build_queue_oldest_seconds"
        values: "0+60x20"
    alert_rule_test:
      - eval_time: 7m # 420s queued — under the 480s threshold
        alertname: BuildQueuedTooLong
        exp_alerts: []

  - name: a queued build pages with head room before the 18m deploy gate
    interval: 1m
    input_series:
      - series: "bex_build_queue_oldest_seconds"
        values: "0+60x20"
    alert_rule_test:
      # Crosses 480s at 9m, fires at 11m after for:2m — six minutes before the
      # deploy gate would fail the deploy for a build that is perfectly healthy.
      - eval_time: 12m
        alertname: BuildQueuedTooLong
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "A build has been queued 12m 0s waiting for capacity"
              description: "A build Job's pod has not been placed on a node. It will be failed by bex-api's 18m deploy gate if this continues, so act now: check the build pools (bex-tenant-lg warm, bex-tenant-burst elastic) for scale-from-zero failures, cluster-autoscaler events, and whether a taint/toleration or capacity-hint change made the 7Gi build request unschedulable. Runbook context: docs/ADR060-build-worker-reliability-and-performance.md D5/D8."

  - name: warm-node queue times never trip the chronic-queueing alert
    interval: 1m
    input_series:
      # Every observation lands in the (5,15] bucket: the warm-node regime the
      # histogram's low buckets exist to resolve.
      - series: 'bex_build_queue_seconds_bucket{le="5"}'
        values: "0x60"
      - series: 'bex_build_queue_seconds_bucket{le="15"}'
        values: "0+1x60"
      - series: 'bex_build_queue_seconds_bucket{le="30"}'
        values: "0+1x60"
      - series: 'bex_build_queue_seconds_bucket{le="60"}'
        values: "0+1x60"
      - series: 'bex_build_queue_seconds_bucket{le="120"}'
        values: "0+1x60"
      - series: 'bex_build_queue_seconds_bucket{le="300"}'
        values: "0+1x60"
      - series: 'bex_build_queue_seconds_bucket{le="600"}'
        values: "0+1x60"
      - series: 'bex_build_queue_seconds_bucket{le="1200"}'
        values: "0+1x60"
      - series: 'bex_build_queue_seconds_bucket{le="+Inf"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 50m
        alertname: BuildQueueTimeHigh
        exp_alerts: []

  - name: chronic queueing above five minutes is a capacity decision
    interval: 1m
    input_series:
      # Every observation lands in the (300,600] bucket — the cold
      # scale-from-zero regime become the norm rather than the exception.
      - series: 'bex_build_queue_seconds_bucket{le="5"}'
        values: "0x60"
      - series: 'bex_build_queue_seconds_bucket{le="15"}'
        values: "0x60"
      - series: 'bex_build_queue_seconds_bucket{le="30"}'
        values: "0x60"
      - series: 'bex_build_queue_seconds_bucket{le="60"}'
        values: "0x60"
      - series: 'bex_build_queue_seconds_bucket{le="120"}'
        values: "0x60"
      - series: 'bex_build_queue_seconds_bucket{le="300"}'
        values: "0x60"
      - series: 'bex_build_queue_seconds_bucket{le="600"}'
        values: "0+1x60"
      - series: 'bex_build_queue_seconds_bucket{le="1200"}'
        values: "0+1x60"
      - series: 'bex_build_queue_seconds_bucket{le="+Inf"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 50m
        alertname: BuildQueueTimeHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Build queue p95 is 9m 45s (capacity, not tenant code)"
              description: "Builds are chronically waiting for a node before they start. This is the platform's SLI, not the tenant's: compare bex_build_run_seconds, which should be unaffected. Consider the build pools' max-size, BEX_MAX_ACTIVE_BUILDS, and whether cold scale-from-zero (bex_builds_queued > 0 with bex-tenant-burst at 0 replicas) dominates. Runbook context: docs/ADR060-build-worker-reliability-and-performance.md D5."

  # w4/m86 — ClusterBuilder readiness vs image-age are distinct signals.
  - name: ready clusterbuilder stays quiet
    interval: 1m
    input_series:
      - series: "bex_build_clusterbuilder_present"
        values: "1x30"
      - series: "bex_build_clusterbuilder_ready"
        values: "1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ClusterBuilderNotReady
        exp_alerts: []

  - name: unready clusterbuilder fires after the persistence window
    interval: 1m
    input_series:
      - series: "bex_build_clusterbuilder_present"
        values: "1x30"
      - series: "bex_build_clusterbuilder_ready"
        values: "0x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: ClusterBuilderNotReady
        exp_alerts: []
      - eval_time: 20m
        alertname: ClusterBuilderNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "kpack ClusterBuilder bex is not Ready"
              description: "The platform ClusterBuilder has been missing, unknown, or not Ready for >15m, so buildpack deploys may stall or ship an incomplete builder. Inspect: kubectl get clusterbuilder bex -o yaml. Refresh is a reviewed digest update via python3 scripts/lib/toolchain-freshness.py resolve and .github/workflows/build-toolchain-freshness.yml — never an automatic rollout. Runbook: docs/ADR060-build-worker-reliability-and-performance.md D7."

  - name: absent clusterbuilder fires
    interval: 1m
    input_series:
      - series: "bex_build_clusterbuilder_present"
        values: "0x30"
      - series: "bex_build_clusterbuilder_ready"
        values: "-1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ClusterBuilderNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "kpack ClusterBuilder bex is not Ready"
              description: "The platform ClusterBuilder has been missing, unknown, or not Ready for >15m, so buildpack deploys may stall or ship an incomplete builder. Inspect: kubectl get clusterbuilder bex -o yaml. Refresh is a reviewed digest update via python3 scripts/lib/toolchain-freshness.py resolve and .github/workflows/build-toolchain-freshness.yml — never an automatic rollout. Runbook: docs/ADR060-build-worker-reliability-and-performance.md D7."

  - name: fresh clusterbuilder image pin stays quiet
    interval: 1m
    input_series:
      # time() at 62m is 3720; a far-future unix timestamp is well inside 30d.
      - series: "bex_build_clusterbuilder_image_resolved_timestamp_seconds"
        values: "2000000000x70"
    alert_rule_test:
      - eval_time: 62m
        alertname: ClusterBuilderImageStale
        exp_alerts: []

  - name: over-age clusterbuilder image pin fires
    interval: 1m
    input_series:
      # At eval_time 62m, time()=3720. Age = 3720 - (-2600000) = 2603720s ≈ 30.1d.
      - series: "bex_build_clusterbuilder_image_resolved_timestamp_seconds"
        values: "-2600000x70"
    alert_rule_test:
      - eval_time: 50m
        alertname: ClusterBuilderImageStale
        exp_alerts: []
      - eval_time: 62m
        alertname: ClusterBuilderImageStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "ClusterBuilder image pin is older than the 30-day freshness SLO"
              description: "Committed builder resolution metadata is missing, malformed, or older than 30 days. Resolve with python3 scripts/lib/toolchain-freshness.py resolve, review the observed digest, update the listed files and resolved_at together. The workflow never applies a pin. Runbook: docs/ADR060-build-worker-reliability-and-performance.md D7."

  - name: missing freshness metadata fires as stale
    interval: 1m
    input_series:
      - series: "bex_build_clusterbuilder_image_resolved_timestamp_seconds"
        values: "0x70"
    alert_rule_test:
      - eval_time: 50m
        alertname: ClusterBuilderImageStale
        exp_alerts: []
      - eval_time: 62m
        alertname: ClusterBuilderImageStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "ClusterBuilder image pin is older than the 30-day freshness SLO"
              description: "Committed builder resolution metadata is missing, malformed, or older than 30 days. Resolve with python3 scripts/lib/toolchain-freshness.py resolve, review the observed digest, update the listed files and resolved_at together. The workflow never applies a pin. Runbook: docs/ADR060-build-worker-reliability-and-performance.md D7."

  - name: courier replica shortfall fires only while ready lags desired (w6/m42)
    interval: 1m
    input_series:
      - series: 'kube_statefulset_replicas{namespace="auth", statefulset="kratos-courier"}'
        values: "1x40"
      # ready for 10m, then a 15m outage, then recovered
      - series: 'kube_statefulset_status_replicas_ready{namespace="auth", statefulset="kratos-courier"}'
        values: "1x10 0x15 1x15"
    alert_rule_test:
      - eval_time: 15m
        alertname: KratosCourierNotReady
        exp_alerts: [] # only 5m into the outage — inside the for: window
      - eval_time: 21m
        alertname: KratosCourierNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: auth
              statefulset: kratos-courier
            exp_annotations:
              summary: "Kratos courier is not ready — verification email delivery is stalled"
              description: "kratos-courier has had fewer ready than desired replicas for >10m. Under the ADR075 D8 verification gate NO new user can complete sign-up until it recovers. Debug: kubectl -n auth get sts kratos-courier; kubectl -n auth logs sts/kratos-courier --tail=100; then check the SMTP relay (SendGrid prod / Mailpit local)."
      - eval_time: 38m
        alertname: KratosCourierNotReady
        exp_alerts: []

  # Certificate readiness is split by responsibility: PLATFORM certs page the
  # operator (CertificateNotReady, warning); a tenant's own custom-domain cert
  # (namespace tea-*, secret "<app>-tls-<host>" for a non-onbex.co host) is
  # customer-side DNS and only raises TenantCustomDomainCertNotReady (info, routed
  # to the null receiver — never paged). This pins the discriminator: the same
  # not-Ready value (== 0) routes oppositely by namespace + cert name, and the
  # `unless` must subtract ONLY the custom-domain series from the paging rule.
  - name: certificate readiness splits platform paging from tenant custom-domain DNS
    interval: 1m
    input_series:
      # Platform cert in a platform namespace — pages.
      - series: 'certmanager_certificate_ready_status{condition="True", namespace="bex-system", name="bex-api-tls"}'
        values: "0x90"
      # A tenant's platform host cert ("<app>-tls", no host suffix): bex owns
      # *.onbex.co DNS, so a stuck one is a platform fault and still pages.
      - series: 'certmanager_certificate_ready_status{condition="True", namespace="tea-abc", name="tea-abc-web-tls"}'
        values: "0x90"
      # An onbex.co host that landed as a SECONDARY cert ("<app>-tls-<sub>.onbex.co"):
      # still platform (kept by the name!~onbex.co guard), still pages.
      - series: 'certmanager_certificate_ready_status{condition="True", namespace="tea-abc", name="tea-abc-web-tls-web.onbex.co"}'
        values: "0x90"
      # The tenant's CUSTOM domain ("<app>-tls-<host>"): customer DNS — info only,
      # and must be subtracted from CertificateNotReady by the `unless`.
      - series: 'certmanager_certificate_ready_status{condition="True", namespace="tea-abc", name="tea-abc-web-tls-blockeden.xyz"}'
        values: "0x90"
      # A healthy custom-domain cert (== 1) fires neither alert.
      - series: 'certmanager_certificate_ready_status{condition="True", namespace="tea-abc", name="tea-abc-web-tls-ok.example.com"}'
        values: "1x90"
    alert_rule_test:
      # At 20m: the three platform certs page; the custom domain has not yet been
      # not-Ready for its 1h window, so the info alert is silent.
      - eval_time: 20m
        alertname: TenantCustomDomainCertNotReady
        exp_alerts: []
      - eval_time: 20m
        alertname: CertificateNotReady
        exp_alerts:
          - exp_labels: { severity: warning, condition: "True", namespace: bex-system, name: bex-api-tls }
            exp_annotations:
              summary: "Certificate bex-system/bex-api-tls is not Ready"
