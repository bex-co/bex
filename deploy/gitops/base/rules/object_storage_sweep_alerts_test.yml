  - eval_time: 5h50m
    alertname: ObjectStorageSweepStale
    exp_alerts: []
# The absent branch: object storage is on (the egress gauge, which the same
# registration exports) but the sweep's series are not scraped or not stored.
- name: a bex-api that exports the egress gauge and none of the sweep's series fires after thirty minutes
