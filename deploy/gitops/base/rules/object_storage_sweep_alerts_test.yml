        description: "No bex-api replica has finished an hourly object storage sweep pass that reached every workspace without a failure in the last three hours, or none exports the sweep's series at all. Usage, the quota gate, bucket info, lifecycle rules, the purge of deleted workspaces and the shadow storage meter are stale for the workspaces it did not reach. Read the 'object storage sweep: pass over N workspaces took T' line in bex-api's logs first (failed and not reached say which half), or no such line on either replica when neither gets the advisory lock; the Billing and metering dashboard has the pass duration, workspaces by result and the age of the last complete pass. Runbook: docs/runbooks/object-storage-sweep.md"
- name: a fresh fleet whose first pass completes within minutes stays quiet
  interval: 1m
  input_series:
  - series: bex_usage_object_storage_sweep_last_complete_timestamp_seconds{job="bex-api",instance="api-1"}
    values: -1.7e9x2 180x59 3780x59 7380x59 10980x59 14580x59 18180x56
  - series: bex_usage_object_storage_sweep_last_complete_timestamp_seconds{job="bex-api",instance="api-2"}
    values: -1.7e9x359
  alert_rule_test:
  - eval_time: 2m
    alertname: ObjectStorageSweepStale
    exp_alerts: []
  - eval_time: 40m
    alertname: ObjectStorageSweepStale
