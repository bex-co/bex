    exp_alerts: []
# Passes are cut off at 1:00 and 2:00 on a replica that exports the series at 0 from
# its start. One cut-off is increase() of about 1, two are about 2: the threshold is
# 1.5, and the alert waits 10 minutes.
- name: two cut-off passes in three hours warn, and the alert clears once they are three hours old
  interval: 1m
  input_series:
  - series: bex_usage_object_storage_sweep_pass_duration_seconds_count{job="bex-api",instance="api-1",result="cut_off"}
    values: 0x59 1x59 2x359
  - series: bex_usage_object_storage_sweep_pass_duration_seconds_count{job="bex-api",instance="api-1",result="complete"}
    values: 0x29 1x59 2x59 3x59 4x59 5x59 6x59 7x59 8x29
  alert_rule_test:
  - eval_time: 1h20m
    alertname: ObjectStorageSweepCutOff
    exp_alerts: []
  - eval_time: 2h5m
    alertname: ObjectStorageSweepCutOff
    exp_alerts: []
  - eval_time: 2h20m
    alertname: ObjectStorageSweepCutOff
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: "The object storage sweep was cut off at its deadline more than once in three hours"
        description: "The hourly sweep pass ran out of its 50 minutes at least twice in the last three hours, so the workspaces it did not reach keep their old usage until a later pass (which starts with them). Read the 'pass over N workspaces took T with 4 workers: ... d not reached' line in bex-api's logs for the count and the Billing and metering dashboard (Object storage sweep: pass duration by result) for how long passes take. A few large workspaces or slow listings are the usual cause; raising sweepWorkers (ADR112 D8) is the lever once the listings of Wasabi are confirmed healthy. Runbook: docs/runbooks/object-storage-sweep.md"
  - eval_time: 3h50m
    alertname: ObjectStorageSweepCutOff
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: "The object storage sweep was cut off at its deadline more than once in three hours"
        description: "The hourly sweep pass ran out of its 50 minutes at least twice in the last three hours, so the workspaces it did not reach keep their old usage until a later pass (which starts with them). Read the 'pass over N workspaces took T with 4 workers: ... d not reached' line in bex-api's logs for the count and the Billing and metering dashboard (Object storage sweep: pass duration by result) for how long passes take. A few large workspaces or slow listings are the usual cause; raising sweepWorkers (ADR112 D8) is the lever once the listings of Wasabi are confirmed healthy. Runbook: docs/runbooks/object-storage-sweep.md"
  - eval_time: 4h30m
    alertname: ObjectStorageSweepCutOff
    exp_alerts: []
  - eval_time: 6h
    alertname: ObjectStorageSweepCutOff
    exp_alerts: []
- name: one cut-off pass, or two more than three hours apart, stays quiet
  interval: 1m
  input_series:
  - series: bex_usage_object_storage_sweep_pass_duration_seconds_count{job="bex-api",instance="api-1",result="cut_off"}
    values: 0x59 1x239 2x59
  - series: bex_usage_object_storage_sweep_pass_duration_seconds_count{job="bex-api",instance="api-2",result="cut_off"}
    values: 0x359
  alert_rule_test:
  - eval_time: 1h30m
    alertname: ObjectStorageSweepCutOff
    exp_alerts: []
  - eval_time: 3h
    alertname: ObjectStorageSweepCutOff
    exp_alerts: []
  - eval_time: 5h30m
    alertname: ObjectStorageSweepCutOff
    exp_alerts: []
- name: cut-offs on two replicas, as the lock moves between them, are summed
  interval: 1m
  input_series:
  - series: bex_usage_object_storage_sweep_pass_duration_seconds_count{job="bex-api",instance="api-1",result="cut_off"}
    values: 0x59 1x299
  - series: bex_usage_object_storage_sweep_pass_duration_seconds_count{job="bex-api",instance="api-2",result="cut_off"}
    values: 0x119 1x239
  alert_rule_test:
  - eval_time: 1h30m
    alertname: ObjectStorageSweepCutOff
    exp_alerts: []
  - eval_time: 2h30m
    alertname: ObjectStorageSweepCutOff
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: "The object storage sweep was cut off at its deadline more than once in three hours"
        description: "The hourly sweep pass ran out of its 50 minutes at least twice in the last three hours, so the workspaces it did not reach keep their old usage until a later pass (which starts with them). Read the 'pass over N workspaces took T with 4 workers: ... d not reached' line in bex-api's logs for the count and the Billing and metering dashboard (Object storage sweep: pass duration by result) for how long passes take. A few large workspaces or slow listings are the usual cause; raising sweepWorkers (ADR112 D8) is the lever once the listings of Wasabi are confirmed healthy. Runbook: docs/runbooks/object-storage-sweep.md"
- name: failures and complete passes never count as cut off
  interval: 1m
  input_series:
  - series: bex_usage_object_storage_sweep_pass_duration_seconds_count{job="bex-api",instance="api-1",result="cut_off"}
    values: 0x359
  - series: bex_usage_object_storage_sweep_pass_duration_seconds_count{job="bex-api",instance="api-1",result="failures"}
    values: 0x59 1x59 2x59 3x59 4x59 5x59
  - series: bex_usage_object_storage_sweep_pass_duration_seconds_count{job="bex-api",instance="api-1",result="complete"}
    values: 0x29 1x59 2x59 3x59 4x59 5x89
  alert_rule_test:
  - eval_time: 3h
    alertname: ObjectStorageSweepCutOff
    exp_alerts: []
  - eval_time: 5h30m
    alertname: ObjectStorageSweepCutOff
    exp_alerts: []
