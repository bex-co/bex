# Host filesystem behavior: independent inventory, complete current observations and guarded forecasts.
rule_files:
  - alerting_rules.yml
evaluation_interval: 1m
group_eval_order:
  - platform
  - bex
tests:
  - name: healthy expected roots exclude platform nodes PVC paths and pseudo filesystems
    interval: 1m
    input_series:
      - series: kube_node_labels{node="tenant-a",label_bex_co_pool="tenant"}
        values: 1x300
      - series: kube_node_labels{node="tenant-b",label_bex_co_pool="tenant"}
        values: 1x300
      - series: kube_node_labels{node="platform",label_bex_co_pool="platform"}
        values: 1x300
      - series: up{job="tenant-node-filesystem",instance="tenant-a:9100",node="tenant-a"}
        values: 1x300
      - series: up{job="tenant-node-filesystem",instance="tenant-b:9100",node="tenant-b"}
        values: 1x300
      - series: up{job="tenant-node-filesystem",instance="platform:9100",node="platform"}
        values: 1x300
      - series: node_filesystem_size_bytes{job="tenant-node-filesystem",instance="tenant-a:9100",node="tenant-a",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 1000x300
      - series: node_filesystem_avail_bytes{job="tenant-node-filesystem",instance="tenant-a:9100",node="tenant-a",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 500x300
      - series: node_filesystem_files{job="tenant-node-filesystem",instance="tenant-a:9100",node="tenant-a",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 1000x300
      - series: node_filesystem_files_free{job="tenant-node-filesystem",instance="tenant-a:9100",node="tenant-a",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 500x300
      - series: node_filesystem_readonly{job="tenant-node-filesystem",instance="tenant-a:9100",node="tenant-a",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: "0x300"
      - series: node_filesystem_device_error{job="tenant-node-filesystem",instance="tenant-a:9100",node="tenant-a",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: "0x300"
      - series: node_filesystem_size_bytes{job="tenant-node-filesystem",instance="tenant-b:9100",node="tenant-b",device="/dev/sda1",mountpoint="/",fstype="overlay"}
        values: 1000x300
      - series: node_filesystem_avail_bytes{job="tenant-node-filesystem",instance="tenant-b:9100",node="tenant-b",device="/dev/sda1",mountpoint="/",fstype="overlay"}
        values: 600x300
      - series: node_filesystem_files{job="tenant-node-filesystem",instance="tenant-b:9100",node="tenant-b",device="/dev/sda1",mountpoint="/",fstype="overlay"}
        values: 1000x300
      - series: node_filesystem_files_free{job="tenant-node-filesystem",instance="tenant-b:9100",node="tenant-b",device="/dev/sda1",mountpoint="/",fstype="overlay"}
        values: 500x300
      - series: node_filesystem_readonly{job="tenant-node-filesystem",instance="tenant-b:9100",node="tenant-b",device="/dev/sda1",mountpoint="/",fstype="overlay"}
        values: "0x300"
      - series: node_filesystem_device_error{job="tenant-node-filesystem",instance="tenant-b:9100",node="tenant-b",device="/dev/sda1",mountpoint="/",fstype="overlay"}
        values: "0x300"
      - series: node_filesystem_size_bytes{job="tenant-node-filesystem",instance="platform:9100",node="platform",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 1000x300
      - series: node_filesystem_avail_bytes{job="tenant-node-filesystem",instance="platform:9100",node="platform",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 1x300
      - series: node_filesystem_files{job="tenant-node-filesystem",instance="platform:9100",node="platform",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 1000x300
      - series: node_filesystem_files_free{job="tenant-node-filesystem",instance="platform:9100",node="platform",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 1x300
      - series: node_filesystem_readonly{job="tenant-node-filesystem",instance="platform:9100",node="platform",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: "0x300"
      - series: node_filesystem_device_error{job="tenant-node-filesystem",instance="platform:9100",node="platform",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: "0x300"
      - series: node_filesystem_size_bytes{job="tenant-node-filesystem",instance="tenant-a:9100",node="tenant-a",device="/dev/pvc",mountpoint="/var/lib/kubelet/pods/pvc",fstype="ext4"}
        values: 1000x300
      - series: node_filesystem_avail_bytes{job="tenant-node-filesystem",instance="tenant-a:9100",node="tenant-a",device="/dev/pvc",mountpoint="/var/lib/kubelet/pods/pvc",fstype="ext4"}
        values: 1x300
      - series: node_filesystem_files{job="tenant-node-filesystem",instance="tenant-a:9100",node="tenant-a",device="/dev/pvc",mountpoint="/var/lib/kubelet/pods/pvc",fstype="ext4"}
        values: 1000x300
      - series: node_filesystem_files_free{job="tenant-node-filesystem",instance="tenant-a:9100",node="tenant-a",device="/dev/pvc",mountpoint="/var/lib/kubelet/pods/pvc",fstype="ext4"}
        values: 1x300
      - series: node_filesystem_readonly{job="tenant-node-filesystem",instance="tenant-a:9100",node="tenant-a",device="/dev/pvc",mountpoint="/var/lib/kubelet/pods/pvc",fstype="ext4"}
        values: "0x300"
      - series: node_filesystem_device_error{job="tenant-node-filesystem",instance="tenant-a:9100",node="tenant-a",device="/dev/pvc",mountpoint="/var/lib/kubelet/pods/pvc",fstype="ext4"}
        values: "0x300"
      - series: node_filesystem_size_bytes{job="tenant-node-filesystem",instance="tenant-a:9100",node="tenant-a",device="tmpfs",mountpoint="/",fstype="tmpfs"}
        values: 1000x300
      - series: node_filesystem_avail_bytes{job="tenant-node-filesystem",instance="tenant-a:9100",node="tenant-a",device="tmpfs",mountpoint="/",fstype="tmpfs"}
        values: 1x300
      - series: node_filesystem_files{job="tenant-node-filesystem",instance="tenant-a:9100",node="tenant-a",device="tmpfs",mountpoint="/",fstype="tmpfs"}
        values: 1000x300
      - series: node_filesystem_files_free{job="tenant-node-filesystem",instance="tenant-a:9100",node="tenant-a",device="tmpfs",mountpoint="/",fstype="tmpfs"}
        values: 1x300
      - series: node_filesystem_readonly{job="tenant-node-filesystem",instance="tenant-a:9100",node="tenant-a",device="tmpfs",mountpoint="/",fstype="tmpfs"}
        values: "0x300"
      - series: node_filesystem_device_error{job="tenant-node-filesystem",instance="tenant-a:9100",node="tenant-a",device="tmpfs",mountpoint="/",fstype="tmpfs"}
        values: "0x300"
    alert_rule_test:
      - eval_time: 20m
        alertname: TenantNodeFilesystemSpaceLow
        exp_alerts: []
      - eval_time: 20m
        alertname: TenantNodeFilesystemInodesLow
        exp_alerts: []
      - eval_time: 20m
        alertname: TenantNodeFilesystemTelemetryMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: TenantNodeFilesystemInventoryMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: TenantNodeFilesystemFillingSoon
        exp_alerts: []
    promql_expr_test:
      - expr: bex:tenant_node_filesystem_available_ratio
        eval_time: 20m
        exp_samples:
          - labels: bex:tenant_node_filesystem_available_ratio{node="tenant-a",device="/dev/sda1"}
            value: 0.5
          - labels: bex:tenant_node_filesystem_available_ratio{node="tenant-b",device="/dev/sda1"}
            value: 0.6
      - expr: bex:tenant_node_filesystem_expected
        eval_time: 20m
        exp_samples:
          - labels: bex:tenant_node_filesystem_expected{node="tenant-a",mountpoint="/"}
            value: 1
          - labels: bex:tenant_node_filesystem_expected{node="tenant-b",mountpoint="/"}
            value: 1
  - name: space and inode margins warn before hard eviction persist for ten minutes then recover
    interval: 1m
    input_series:
      - series: kube_node_labels{node="space",label_bex_co_pool="tenant"}
        values: 1x300
      - series: kube_node_labels{node="inodes",label_bex_co_pool="tenant"}
        values: 1x300
      - series: up{job="tenant-node-filesystem",instance="space:9100",node="space"}
        values: 1x300
      - series: up{job="tenant-node-filesystem",instance="inodes:9100",node="inodes"}
        values: 1x300
      - series: node_filesystem_size_bytes{job="tenant-node-filesystem",instance="space:9100",node="space",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 1000x300
      - series: node_filesystem_avail_bytes{job="tenant-node-filesystem",instance="space:9100",node="space",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 200x4 190x10 300x14
      - series: node_filesystem_files{job="tenant-node-filesystem",instance="space:9100",node="space",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 1000x300
      - series: node_filesystem_files_free{job="tenant-node-filesystem",instance="space:9100",node="space",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 500x300
      - series: node_filesystem_readonly{job="tenant-node-filesystem",instance="space:9100",node="space",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: "0x300"
      - series: node_filesystem_device_error{job="tenant-node-filesystem",instance="space:9100",node="space",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: "0x300"
      - series: node_filesystem_size_bytes{job="tenant-node-filesystem",instance="inodes:9100",node="inodes",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 1000x300
      - series: node_filesystem_avail_bytes{job="tenant-node-filesystem",instance="inodes:9100",node="inodes",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 500x300
      - series: node_filesystem_files{job="tenant-node-filesystem",instance="inodes:9100",node="inodes",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 1000x300
      - series: node_filesystem_files_free{job="tenant-node-filesystem",instance="inodes:9100",node="inodes",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 100x4 90x10 500x14
      - series: node_filesystem_readonly{job="tenant-node-filesystem",instance="inodes:9100",node="inodes",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: "0x300"
      - series: node_filesystem_device_error{job="tenant-node-filesystem",instance="inodes:9100",node="inodes",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: "0x300"
    alert_rule_test:
      - eval_time: 4m
        alertname: TenantNodeFilesystemSpaceLow
        exp_alerts: []
      - eval_time: 14m
        alertname: TenantNodeFilesystemSpaceLow
        exp_alerts: []
      - eval_time: 16m
        alertname: TenantNodeFilesystemSpaceLow
        exp_alerts: []
      - eval_time: 4m
        alertname: TenantNodeFilesystemInodesLow
        exp_alerts: []
      - eval_time: 14m
        alertname: TenantNodeFilesystemInodesLow
        exp_alerts: []
      - eval_time: 16m
        alertname: TenantNodeFilesystemInodesLow
        exp_alerts: []
      - eval_time: 15m
        alertname: TenantNodeFilesystemSpaceLow
        exp_alerts:
          - exp_labels:
              severity: warning
              node: space
              device: /dev/sda1
            exp_annotations:
              summary: Tenant node space device /dev/sda1 has less than 20% available space
              description: 'Headroom has stayed below 20% for 10m, above the observed 15% imagefs and 10% nodefs hard eviction thresholds. Inspect the declared backing mounts, image usage and pod ephemeral-storage limits before choosing a response. Sudden writes can exhaust storage before this warning. Runbook: docs/ADR010-observability.md#tenant-node-filesystem-headroom'
      - eval_time: 15m
        alertname: TenantNodeFilesystemInodesLow
        exp_alerts:
          - exp_labels:
              severity: warning
              node: inodes
              device: /dev/sda1
            exp_annotations:
              summary: Tenant node inodes device /dev/sda1 has less than 10% free inodes
              description: 'Free inodes have stayed below 10% for 10m, above the observed 5% hard eviction threshold. Byte headroom alone cannot rule out inode exhaustion. Diagnose file counts and workload growth without automatic deletion. Runbook: docs/ADR010-observability.md#tenant-node-filesystem-headroom'
      - eval_time: 15m
        alertname: TenantNodeFilesystemTelemetryMissing
        exp_alerts: []
    promql_expr_test: []
  - name: brief low headroom never survives the persistence interval
    interval: 1m
    input_series:
      - series: kube_node_labels{node="burst",label_bex_co_pool="tenant"}
        values: 1x300
      - series: up{job="tenant-node-filesystem",instance="burst:9100",node="burst"}
        values: 1x300
      - series: node_filesystem_size_bytes{job="tenant-node-filesystem",instance="burst:9100",node="burst",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 1000x300
      - series: node_filesystem_avail_bytes{job="tenant-node-filesystem",instance="burst:9100",node="burst",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 190x8 500x21
      - series: node_filesystem_files{job="tenant-node-filesystem",instance="burst:9100",node="burst",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 1000x300
      - series: node_filesystem_files_free{job="tenant-node-filesystem",instance="burst:9100",node="burst",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 90x8 500x21
      - series: node_filesystem_readonly{job="tenant-node-filesystem",instance="burst:9100",node="burst",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: "0x300"
      - series: node_filesystem_device_error{job="tenant-node-filesystem",instance="burst:9100",node="burst",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: "0x300"
    alert_rule_test:
      - eval_time: 8m
        alertname: TenantNodeFilesystemSpaceLow
        exp_alerts: []
      - eval_time: 10m
        alertname: TenantNodeFilesystemSpaceLow
        exp_alerts: []
      - eval_time: 25m
        alertname: TenantNodeFilesystemSpaceLow
        exp_alerts: []
      - eval_time: 8m
        alertname: TenantNodeFilesystemInodesLow
        exp_alerts: []
      - eval_time: 10m
        alertname: TenantNodeFilesystemInodesLow
        exp_alerts: []
      - eval_time: 25m
        alertname: TenantNodeFilesystemInodesLow
        exp_alerts: []
    promql_expr_test: []
  - name: missing target failed target and replacement identity cannot borrow a healthy sibling
    interval: 1m
    input_series:
      - series: kube_node_labels{node="absent",label_bex_co_pool="tenant"}
        values: 1x300
      - series: kube_node_labels{node="failed",label_bex_co_pool="tenant"}
        values: 1x300
      - series: kube_node_labels{node="replacement",label_bex_co_pool="tenant"}
        values: 1x300
      - series: kube_node_labels{node="healthy",label_bex_co_pool="tenant"}
        values: 1x300
      - series: up{job="tenant-node-filesystem",instance="failed:9100",node="failed"}
        values: "0x30"
      - series: up{job="tenant-node-filesystem",instance="new:9100",node="replacement"}
        values: 1x300
      - series: up{job="tenant-node-filesystem",instance="healthy:9100",node="healthy"}
        values: 1x300
      - series: node_filesystem_size_bytes{job="tenant-node-filesystem",instance="failed:9100",node="failed",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 1000x300
      - series: node_filesystem_avail_bytes{job="tenant-node-filesystem",instance="failed:9100",node="failed",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 500x300
      - series: node_filesystem_files{job="tenant-node-filesystem",instance="failed:9100",node="failed",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 1000x300
      - series: node_filesystem_files_free{job="tenant-node-filesystem",instance="failed:9100",node="failed",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 500x300
      - series: node_filesystem_readonly{job="tenant-node-filesystem",instance="failed:9100",node="failed",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: "0x300"
      - series: node_filesystem_device_error{job="tenant-node-filesystem",instance="failed:9100",node="failed",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: "0x300"
      - series: node_filesystem_size_bytes{job="tenant-node-filesystem",instance="old:9100",node="replacement",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 1000x300
      - series: node_filesystem_avail_bytes{job="tenant-node-filesystem",instance="old:9100",node="replacement",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 500x300
      - series: node_filesystem_files{job="tenant-node-filesystem",instance="old:9100",node="replacement",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 1000x300
      - series: node_filesystem_files_free{job="tenant-node-filesystem",instance="old:9100",node="replacement",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 500x300
      - series: node_filesystem_readonly{job="tenant-node-filesystem",instance="old:9100",node="replacement",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: "0x300"
      - series: node_filesystem_device_error{job="tenant-node-filesystem",instance="old:9100",node="replacement",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: "0x300"
      - series: node_filesystem_size_bytes{job="tenant-node-filesystem",instance="healthy:9100",node="healthy",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 1000x300
      - series: node_filesystem_avail_bytes{job="tenant-node-filesystem",instance="healthy:9100",node="healthy",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 500x300
      - series: node_filesystem_files{job="tenant-node-filesystem",instance="healthy:9100",node="healthy",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 1000x300
      - series: node_filesystem_files_free{job="tenant-node-filesystem",instance="healthy:9100",node="healthy",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 500x300
      - series: node_filesystem_readonly{job="tenant-node-filesystem",instance="healthy:9100",node="healthy",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: "0x300"
      - series: node_filesystem_device_error{job="tenant-node-filesystem",instance="healthy:9100",node="healthy",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: "0x300"
    alert_rule_test:
      - eval_time: 9m
        alertname: TenantNodeFilesystemTelemetryMissing
        exp_alerts: []
      - eval_time: 10m
        alertname: TenantNodeFilesystemTelemetryMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              node: absent
              mountpoint: /
            exp_annotations:
              summary: Tenant node absent mount / has unknown filesystem headroom
              description: 'An independently expected backing mount has no complete, successful writable-filesystem observation for 10m. Check the private tenant-node-filesystem target, exporter placement/host mounts, filesystem collector errors and required-mount inventory. New nodes have the same 10m collection grace; removed nodes leave the inventory. Runbook: docs/ADR010-observability.md#tenant-node-filesystem-headroom'
          - exp_labels:
              severity: warning
              node: failed
              mountpoint: /
            exp_annotations:
              summary: Tenant node failed mount / has unknown filesystem headroom
              description: 'An independently expected backing mount has no complete, successful writable-filesystem observation for 10m. Check the private tenant-node-filesystem target, exporter placement/host mounts, filesystem collector errors and required-mount inventory. New nodes have the same 10m collection grace; removed nodes leave the inventory. Runbook: docs/ADR010-observability.md#tenant-node-filesystem-headroom'
          - exp_labels:
              severity: warning
              node: replacement
              mountpoint: /
            exp_annotations:
              summary: Tenant node replacement mount / has unknown filesystem headroom
              description: 'An independently expected backing mount has no complete, successful writable-filesystem observation for 10m. Check the private tenant-node-filesystem target, exporter placement/host mounts, filesystem collector errors and required-mount inventory. New nodes have the same 10m collection grace; removed nodes leave the inventory. Runbook: docs/ADR010-observability.md#tenant-node-filesystem-headroom'
    promql_expr_test:
      - expr: bex:tenant_node_filesystem_available_ratio
        eval_time: 10m
        exp_samples:
          - labels: bex:tenant_node_filesystem_available_ratio{node="healthy",device="/dev/sda1"}
            value: 0.5
  - name: total exporter absence preserves every independently expected tenant node
    interval: 1m
    input_series:
      - series: kube_node_labels{node="tenant-a",label_bex_co_pool="tenant"}
        values: 1x300
      - series: kube_node_labels{node="tenant-b",label_bex_co_pool="tenant"}
        values: 1x300
    alert_rule_test:
      - eval_time: 9m
        alertname: TenantNodeFilesystemTelemetryMissing
        exp_alerts: []
      - eval_time: 10m
        alertname: TenantNodeFilesystemTelemetryMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              node: tenant-a
              mountpoint: /
            exp_annotations:
              summary: Tenant node tenant-a mount / has unknown filesystem headroom
              description: 'An independently expected backing mount has no complete, successful writable-filesystem observation for 10m. Check the private tenant-node-filesystem target, exporter placement/host mounts, filesystem collector errors and required-mount inventory. New nodes have the same 10m collection grace; removed nodes leave the inventory. Runbook: docs/ADR010-observability.md#tenant-node-filesystem-headroom'
          - exp_labels:
              severity: warning
              node: tenant-b
              mountpoint: /
            exp_annotations:
              summary: Tenant node tenant-b mount / has unknown filesystem headroom
              description: 'An independently expected backing mount has no complete, successful writable-filesystem observation for 10m. Check the private tenant-node-filesystem target, exporter placement/host mounts, filesystem collector errors and required-mount inventory. New nodes have the same 10m collection grace; removed nodes leave the inventory. Runbook: docs/ADR010-observability.md#tenant-node-filesystem-headroom'
      - eval_time: 10m
        alertname: TenantNodeFilesystemInventoryMissing
        exp_alerts: []
    promql_expr_test:
      - expr: bex:tenant_node_filesystem_expected
        eval_time: 10m
        exp_samples:
          - labels: bex:tenant_node_filesystem_expected{node="tenant-a",mountpoint="/"}
            value: 1
          - labels: bex:tenant_node_filesystem_expected{node="tenant-b",mountpoint="/"}
            value: 1
  - name: each missing family and invalid filesystem observation stays unknown despite successful up
    interval: 1m
    input_series:
      - series: kube_node_labels{node="missing-size",label_bex_co_pool="tenant"}
        values: 1x300
      - series: up{job="tenant-node-filesystem",instance="missing-size:9100",node="missing-size"}
        values: 1x300
      - series: node_filesystem_avail_bytes{job="tenant-node-filesystem",instance="missing-size:9100",node="missing-size",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 500x300
      - series: node_filesystem_files{job="tenant-node-filesystem",instance="missing-size:9100",node="missing-size",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 1000x300
      - series: node_filesystem_files_free{job="tenant-node-filesystem",instance="missing-size:9100",node="missing-size",device="/dev/sda1",mountpoint="/",fstype="ext4"}
        values: 500x300
