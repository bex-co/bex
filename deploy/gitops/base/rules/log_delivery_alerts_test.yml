# Native log delivery behavior: guarded lazy counters, independent coverage and recovery.
rule_files:
  - alerting_rules.yml
evaluation_interval: 1m
group_eval_order:
  - platform
  - bex
  - log-delivery
tests:
  - name: idle lazy writers intentional CNPG filtering and WAL replay duplicates stay quiet
    interval: 1m
    input_series:
      - series: kube_node_info{node="a",kernel_version="fixture"}
        values: 1x100
      - series: up{job="alloy",instance="a:12345",node="a",pod="alloy-a"}
        values: 1x100
      - series: alloy_config_last_load_successful{job="alloy",instance="a:12345",node="a",pod="alloy-a"}
        values: 1x100
      - series: alloy_component_controller_running_components{job="alloy",instance="a:12345",node="a",pod="alloy-a",health_type="healthy"}
        values: 22x100
      - series: kube_node_info{node="b",kernel_version="fixture"}
        values: 1x100
      - series: up{job="alloy",instance="b:12345",node="b",pod="alloy-b"}
        values: 1x100
      - series: alloy_config_last_load_successful{job="alloy",instance="b:12345",node="b",pod="alloy-b"}
        values: 1x100
      - series: alloy_component_controller_running_components{job="alloy",instance="b:12345",node="b",pod="alloy-b",health_type="healthy"}
        values: 22x100
      - series: up{job="loki",instance="loki:3100"}
        values: 1x100
      - series: process_start_time_seconds{job="loki",instance="loki:3100"}
        values: 100x100
      - series: loki_ingester_wal_disk_full_failures_total{job="loki",instance="loki:3100"}
        values: "0x100"
      - series: loki_process_dropped_lines_total{job="alloy",instance="a:12345",node="a",pod="alloy-a",reason="cnpg_instance_manager"}
        values: 0+100x100
      - series: loki_ingester_wal_replay_duplicate_entries_total{job="loki",instance="loki:3100"}
        values: 0+100x100
    alert_rule_test:
      - eval_time: 30m
        alertname: LogDeliveryEntriesDropped
        exp_alerts: []
      - eval_time: 30m
        alertname: LogDeliveryLokiRejected
        exp_alerts: []
      - eval_time: 30m
        alertname: LogDeliveryRetriesPersistent
        exp_alerts: []
      - eval_time: 30m
        alertname: LogDeliveryCollectorMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: LogDeliveryInventoryMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: LogDeliveryCollectorUnhealthy
        exp_alerts: []
      - eval_time: 30m
        alertname: LogDeliveryLokiMetricsMissing
        exp_alerts: []
      - eval_time: 30m
        alertname: LogDeliveryLokiWALDiskFull
        exp_alerts: []
    promql_expr_test:
      - expr: bex:log_delivery_collector_expected
        eval_time: 30m
        exp_samples:
          - labels: bex:log_delivery_collector_expected{node="a"}
            value: 1
          - labels: bex:log_delivery_collector_expected{node="b"}
            value: 1
      - expr: bex:log_delivery_collector_up
        eval_time: 30m
        exp_samples:
          - labels: bex:log_delivery_collector_up{node="a"}
            value: 1
          - labels: bex:log_delivery_collector_up{node="b"}
            value: 1
      - expr: bex:log_delivery_collector_healthy
        eval_time: 30m
        exp_samples:
          - labels: bex:log_delivery_collector_healthy{node="a"}
            value: 1
          - labels: bex:log_delivery_collector_healthy{node="b"}
            value: 1
      - expr: bex:log_delivery_inventory_present
        eval_time: 30m
        exp_samples:
          - labels: bex:log_delivery_inventory_present
            value: 1
      - expr: bex:log_delivery_loki_up
        eval_time: 30m
        exp_samples:
          - labels: bex:log_delivery_loki_up
            value: 1
      - expr: bex:log_delivery_writer_drop_activity
        eval_time: 30m
        exp_samples: []
      - expr: bex:log_delivery_loki_rejection_activity
        eval_time: 30m
        exp_samples: []
      - expr: bex:log_delivery_retry_activity
        eval_time: 30m
        exp_samples: []
      - expr: bex:log_delivery_wal_disk_full_activity
        eval_time: 30m
        exp_samples: []
  - name: old positive counters first collected after rollout do not become new failures despite old up history
    interval: 1m
    input_series:
      - series: kube_node_info{node="a",kernel_version="fixture"}
        values: 1x100
      - series: up{job="alloy",instance="a:12345",node="a",pod="alloy-a"}
        values: 1x100
      - series: alloy_config_last_load_successful{job="alloy",instance="a:12345",node="a",pod="alloy-a"}
        values: _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 1x100
      - series: alloy_component_controller_running_components{job="alloy",instance="a:12345",node="a",pod="alloy-a",health_type="healthy"}
        values: 22x100
      - series: kube_node_info{node="b",kernel_version="fixture"}
        values: 1x100
      - series: up{job="alloy",instance="b:12345",node="b",pod="alloy-b"}
        values: 1x100
      - series: alloy_config_last_load_successful{job="alloy",instance="b:12345",node="b",pod="alloy-b"}
        values: _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 1x100
      - series: alloy_component_controller_running_components{job="alloy",instance="b:12345",node="b",pod="alloy-b",health_type="healthy"}
        values: 22x100
      - series: up{job="loki",instance="loki:3100"}
        values: 1x100
      - series: process_start_time_seconds{job="loki",instance="loki:3100"}
        values: _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 100x100
      - series: loki_ingester_wal_disk_full_failures_total{job="loki",instance="loki:3100"}
        values: _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 7x100
      - series: loki_write_dropped_entries_total{job="alloy",instance="a:12345",node="a",pod="alloy-a",reason="ingester_error"}
        values: _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 7x100
      - series: loki_discarded_samples_total{job="loki",instance="loki:3100",reason="rate_limited",format="loki",retention_hours="168"}
        values: _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 7x100
    alert_rule_test:
      - eval_time: 20m
        alertname: LogDeliveryEntriesDropped
        exp_alerts: []
      - eval_time: 20m
        alertname: LogDeliveryLokiRejected
        exp_alerts: []
      - eval_time: 20m
        alertname: LogDeliveryLokiWALDiskFull
        exp_alerts: []
      - eval_time: 25m
        alertname: LogDeliveryEntriesDropped
        exp_alerts: []
      - eval_time: 25m
        alertname: LogDeliveryLokiRejected
        exp_alerts: []
      - eval_time: 25m
        alertname: LogDeliveryLokiWALDiskFull
        exp_alerts: []
      - eval_time: 34m
        alertname: LogDeliveryEntriesDropped
        exp_alerts: []
      - eval_time: 34m
        alertname: LogDeliveryLokiRejected
        exp_alerts: []
      - eval_time: 34m
        alertname: LogDeliveryLokiWALDiskFull
        exp_alerts: []
      - eval_time: 35m
        alertname: LogDeliveryEntriesDropped
        exp_alerts: []
      - eval_time: 35m
        alertname: LogDeliveryLokiRejected
        exp_alerts: []
      - eval_time: 35m
        alertname: LogDeliveryLokiWALDiskFull
        exp_alerts: []
      - eval_time: 50m
        alertname: LogDeliveryEntriesDropped
        exp_alerts: []
      - eval_time: 50m
        alertname: LogDeliveryLokiRejected
        exp_alerts: []
      - eval_time: 50m
        alertname: LogDeliveryLokiWALDiskFull
        exp_alerts: []
    promql_expr_test: []
  - name: first lazy positive after established marker baseline alerts immediately and expires
    interval: 1m
    input_series:
      - series: kube_node_info{node="a",kernel_version="fixture"}
        values: 1x100
      - series: up{job="alloy",instance="a:12345",node="a",pod="alloy-a"}
