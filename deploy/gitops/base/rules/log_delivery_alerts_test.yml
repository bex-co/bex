      - series: loki_discarded_samples_total{job="loki",instance="loki:3100",reason="rate_limited",format="loki",retention_hours="168"}
        values: _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 3x100
    alert_rule_test:
      - eval_time: 20m
        alertname: LogDeliveryEntriesDropped
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: monitoring
              service: log-shipper
              node: a
              reason: ingester_error
            exp_annotations:
              summary: Log writer dropped entries on a
              description: Alloy reported final writer drops with reason ingester_error during the last 15 minutes. These entries were not delivered; intentional pipeline filtering is excluded.
              runbook_url: docs/ADR010-observability.md#durable-log-ingestion
      - eval_time: 20m
        alertname: LogDeliveryLokiRejected
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: monitoring
              service: loki
              reason: rate_limited
              format: loki
              retention_hours: "168"
            exp_annotations:
              summary: Loki rejected log entries with reason rate_limited
              description: Loki reported rejected ingestion attempts during the last 15 minutes. Retries may recover these attempts; do not add this count to final Alloy drops as independent loss.
              runbook_url: docs/ADR010-observability.md#durable-log-ingestion
      - eval_time: 20m
        alertname: LogDeliveryLokiWALDiskFull
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: monitoring
              service: loki
            exp_annotations:
              summary: Loki WAL disk-full failures threaten log durability
              description: Loki reported WAL disk-full failures during the last 15 minutes. Accepted logs may lack WAL durability even while readiness succeeds; later recovery does not retroactively establish durability.
              runbook_url: docs/ADR010-observability.md#durable-log-ingestion
      - eval_time: 34m
        alertname: LogDeliveryEntriesDropped
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: monitoring
              service: log-shipper
              node: a
              reason: ingester_error
            exp_annotations:
              summary: Log writer dropped entries on a
