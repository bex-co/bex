        exp_alerts: []
      - eval_time: 35m
        alertname: LogDeliveryLokiRejected
        exp_alerts: []
      - eval_time: 35m
        alertname: LogDeliveryLokiWALDiskFull
        exp_alerts: []
    promql_expr_test:
      - expr: bex:log_delivery_writer_drop_activity
        eval_time: 20m
        exp_samples:
          - labels: bex:log_delivery_writer_drop_activity{node="a",reason="ingester_error"}
            value: 1
      - expr: bex:log_delivery_loki_rejection_activity
        eval_time: 20m
        exp_samples:
          - labels: bex:log_delivery_loki_rejection_activity{reason="rate_limited",format="loki",retention_hours="168"}
            value: 1
      - expr: bex:log_delivery_wal_disk_full_activity
