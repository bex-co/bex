              reason: rate_limited
              format: loki
              retention_hours: "168"
            exp_annotations:
              summary: Loki rejected log entries with reason rate_limited
              description: Loki reported rejected ingestion attempts during the last 15 minutes. Retries may recover these attempts; do not add this count to final Alloy drops as independent loss.
              runbook_url: docs/ADR010-observability.md#durable-log-ingestion
      - eval_time: 20m
        alertname: LogDeliveryLokiWALDiskFull
