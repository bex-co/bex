        alertname: LogDeliveryEntriesDropped
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: monitoring
              service: log-shipper
              node: a
              reason: ingester_error
            exp_annotations:
              summary: Log writer dropped entries on a
              description: Alloy reported final writer drops with reason ingester_error during the last 15 minutes. These entries were not delivered; intentional pipeline filtering is excluded.
              runbook_url: docs/ADR010-observability.md#durable-log-ingestion
      - eval_time: 20m
