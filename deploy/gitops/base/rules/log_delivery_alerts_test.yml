              description: Loki reported WAL disk-full failures during the last 15 minutes. Accepted logs may lack WAL durability even while readiness succeeds; later recovery does not retroactively establish durability.
              runbook_url: docs/ADR010-observability.md#durable-log-ingestion
      - eval_time: 21m
        alertname: LogDeliveryEntriesDropped
        exp_alerts: []
      - eval_time: 21m
        alertname: LogDeliveryLokiRejected
        exp_alerts: []
      - eval_time: 21m
        alertname: LogDeliveryLokiWALDiskFull
        exp_alerts: []
