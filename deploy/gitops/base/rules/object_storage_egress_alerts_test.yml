# w21/m417 t004, thresholds reset by t008: the month-to-date object-store egress
# alerts (docs/ADR112-object-storage.md D4). The gauge is the month-to-date
# total, so the series are flat levels; a reset on the first of the month is a
# drop to a small value. The thresholds are 30 GB and 50 GB, about 45% and 75%
# of the 67 GB the shared Wasabi account stored when measured on 2026-11-16, and
# both wait five minutes.
rule_files:
- alerting_rules.yml
evaluation_interval: 1m
tests:
- name: above 30 GB warns after five minutes and stays below critical
  interval: 1m
  input_series:
  - series: bex_usage_object_storage_egress_month_bytes{job="bex-api",instance="api-1"}
    values: 35e9x120
  alert_rule_test:
  - eval_time: 3m
    alertname: ObjectStoragePublicEgressHigh
    exp_alerts: []
  - eval_time: 30m
    alertname: ObjectStoragePublicEgressHigh
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: Object storage egress is 35GB this month
        description: "bex has served over 30 GB from the object store this month. Wasabi's egress is free only while monthly downloads stay at or below the active storage volume, and this account is shared with the platform's backups, so a limit on it would reach the restore paths. The shared account stored 67 GB when measured on 2026-11-16 (w21/m417 t008), so this is about 45% of that allowance; re-measure and reset the threshold if its storage has changed. Find the source on the Billing and metering dashboard (Object storage egress: month to date, bytes by origin, requests by result), then scale objectgw to zero if public reads are the cause. Runbook: docs/runbooks/objectgw-kill-switch.md"
  - eval_time: 30m
    alertname: ObjectStoragePublicEgressCritical
    exp_alerts: []
- name: a total at the threshold or below stays quiet
  interval: 1m
  input_series:
  - series: bex_usage_object_storage_egress_month_bytes{job="bex-api",instance="api-1"}
    values: 30e9x180
  alert_rule_test:
  - eval_time: 150m
    alertname: ObjectStoragePublicEgressHigh
    exp_alerts: []
  - eval_time: 150m
    alertname: ObjectStoragePublicEgressCritical
    exp_alerts: []
- name: a crossing shorter than five minutes does not warn, a longer one does
  interval: 1m
  input_series:
  - series: bex_usage_object_storage_egress_month_bytes{job="bex-api",instance="short"}
    values: 25e9x20 35e9x4 25e9x70
  - series: bex_usage_object_storage_egress_month_bytes{job="bex-api",instance="long"}
    values: _x20 35e9x8 _x70
  alert_rule_test:
  - eval_time: 24m
    alertname: ObjectStoragePublicEgressHigh
    exp_alerts: []
  - eval_time: 26m
    alertname: ObjectStoragePublicEgressHigh
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: Object storage egress is 35GB this month
        description: "bex has served over 30 GB from the object store this month. Wasabi's egress is free only while monthly downloads stay at or below the active storage volume, and this account is shared with the platform's backups, so a limit on it would reach the restore paths. The shared account stored 67 GB when measured on 2026-11-16 (w21/m417 t008), so this is about 45% of that allowance; re-measure and reset the threshold if its storage has changed. Find the source on the Billing and metering dashboard (Object storage egress: month to date, bytes by origin, requests by result), then scale objectgw to zero if public reads are the cause. Runbook: docs/runbooks/objectgw-kill-switch.md"
- name: above 50 GB for five minutes is critical and the warning fires too
  interval: 1m
  input_series:
  - series: bex_usage_object_storage_egress_month_bytes{job="bex-api",instance="api-1"}
    values: 55e9x120
  alert_rule_test:
  - eval_time: 4m
    alertname: ObjectStoragePublicEgressCritical
    exp_alerts: []
  - eval_time: 30m
    alertname: ObjectStoragePublicEgressCritical
    exp_alerts:
    - exp_labels:
        severity: critical
      exp_annotations:
        summary: Object storage egress is 55GB this month, near the fair-use limit
        description: "bex has served over 50 GB from the object store this month. Wasabi's egress is free only while monthly downloads stay at or below the active storage volume, and this account is shared with the platform's backups, so a limit on it would reach the restore paths. The shared account stored 67 GB when measured on 2026-11-16 (w21/m417 t008), so this is about 75% of that allowance; re-measure and reset the threshold if its storage has changed. Scale objectgw to zero now with the kill switch (one reviewed change in lego/operator/config/prod/kustomization.yaml), then find the bucket. Runbook: docs/runbooks/objectgw-kill-switch.md"
  - eval_time: 30m
    alertname: ObjectStoragePublicEgressHigh
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: Object storage egress is 55GB this month
        description: "bex has served over 30 GB from the object store this month. Wasabi's egress is free only while monthly downloads stay at or below the active storage volume, and this account is shared with the platform's backups, so a limit on it would reach the restore paths. The shared account stored 67 GB when measured on 2026-11-16 (w21/m417 t008), so this is about 45% of that allowance; re-measure and reset the threshold if its storage has changed. Find the source on the Billing and metering dashboard (Object storage egress: month to date, bytes by origin, requests by result), then scale objectgw to zero if public reads are the cause. Runbook: docs/runbooks/objectgw-kill-switch.md"
- name: two replicas publish the same total and fire once
  interval: 1m
  input_series:
  - series: bex_usage_object_storage_egress_month_bytes{job="bex-api",instance="api-1"}
    values: 35e9x120
  - series: bex_usage_object_storage_egress_month_bytes{job="bex-api",instance="api-2"}
    values: 35e9x120
  alert_rule_test:
  - eval_time: 30m
    alertname: ObjectStoragePublicEgressHigh
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: Object storage egress is 35GB this month
        description: "bex has served over 30 GB from the object store this month. Wasabi's egress is free only while monthly downloads stay at or below the active storage volume, and this account is shared with the platform's backups, so a limit on it would reach the restore paths. The shared account stored 67 GB when measured on 2026-11-16 (w21/m417 t008), so this is about 45% of that allowance; re-measure and reset the threshold if its storage has changed. Find the source on the Billing and metering dashboard (Object storage egress: month to date, bytes by origin, requests by result), then scale objectgw to zero if public reads are the cause. Runbook: docs/runbooks/objectgw-kill-switch.md"
- name: the month reset clears both alerts
  interval: 1m
  input_series:
  - series: bex_usage_object_storage_egress_month_bytes{job="bex-api",instance="api-1"}
    values: 55e9x100 2e9x60
  alert_rule_test:
  - eval_time: 90m
    alertname: ObjectStoragePublicEgressCritical
    exp_alerts:
    - exp_labels:
        severity: critical
      exp_annotations:
        summary: Object storage egress is 55GB this month, near the fair-use limit
        description: "bex has served over 50 GB from the object store this month. Wasabi's egress is free only while monthly downloads stay at or below the active storage volume, and this account is shared with the platform's backups, so a limit on it would reach the restore paths. The shared account stored 67 GB when measured on 2026-11-16 (w21/m417 t008), so this is about 75% of that allowance; re-measure and reset the threshold if its storage has changed. Scale objectgw to zero now with the kill switch (one reviewed change in lego/operator/config/prod/kustomization.yaml), then find the bucket. Runbook: docs/runbooks/objectgw-kill-switch.md"
  - eval_time: 150m
    alertname: ObjectStoragePublicEgressHigh
    exp_alerts: []
  - eval_time: 150m
    alertname: ObjectStoragePublicEgressCritical
    exp_alerts: []
