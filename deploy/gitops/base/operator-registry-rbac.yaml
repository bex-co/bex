# Operator's namespace-scoped Secrets access for the Zot registry namespace
# (w7/m36, docs/ADR022-tenant-isolation.md). The manager-role ClusterRole
# deliberately omits secrets — it only holds cluster-wide grants for resources
# that genuinely span all namespaces. Scoping the registry-namespace grants here
# means a compromised operator pod cannot read platform credentials (Kratos/Hydra,
# OpenBao, CNPG creds in bex-system) via registry-namespace secrets.
#
# What the operator needs in bex-registry:
#   app_controller.ensurePerAppRegistryCreds: get/list/watch/create/update/patch
#     — reads and writes the zot-htpasswd Secret (per-App htpasswd entry) and
#     creates/reads/updates the zot-config Secret (per-App Zot ACL entry).
#   app_controller.handleAppDeletion (RevokeCreds): same — removes htpasswd+ACL
#     on App delete. The running zot keeps accepting removed entries until it
#     restarts, so revocation also triggers the rate-limited bounce below.
#   registry.EnsureActive/tryBounce (w9/m43): pods get/list/delete — zot loads
#     credentials only at process start (lego/operator/internal/registry/verify.go,
#     docs/ADR022-tenant-isolation.md § Credential activation), so the operator
#     bounces the zot pod to activate new entries and deactivate removed ones.
#     Scoped here, not in the manager ClusterRole: the operator must never gain
#     pod-delete on tenant or platform namespaces. Deliberately "delete", never
#     "deletecollection" (bounceZot lists then deletes each pod).
#
# This file lives in deploy/gitops (not lego/operator/config/rbac) because
# config/default's kustomize namePrefix+namespace transform would rewrite any
# namespace field to "bex-system", breaking the Role's target namespace. Same
# pattern as operator-apps-rbac.yaml and bex-api-apps-rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bex-operator-registry
  namespace: bex-registry
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bex-operator-registry
  namespace: bex-registry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bex-operator-registry
subjects:
  # The operator ServiceAccount lives in bex-system (rendered from config/rbac with
  # the bex- namePrefix); a RoleBinding may reference a ServiceAccount in another ns.
  - kind: ServiceAccount
    name: bex-controller-manager
    namespace: bex-system
