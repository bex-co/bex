# Operator's namespace-scoped Secrets access for the Zot registry namespace
# (w7/m36, docs/ADR022-tenant-isolation.md). The manager-role ClusterRole
# deliberately omits secrets — it only holds cluster-wide grants for resources
# that genuinely span all namespaces. Scoping the registry-namespace grants here
# means a compromised operator pod cannot read platform credentials (Kratos/Hydra,
# OpenBao, CNPG creds in bex-system) via registry-namespace secrets.
#
# What the operator needs in bex-registry:
#   app_controller.ensurePerAppRegistryCreds: get/list/watch/create/update/patch
#     — reads and writes the zot-htpasswd Secret (per-App htpasswd entry) and
#     creates/reads/updates the zot-config Secret (per-App Zot ACL entry).
#   app_controller.handleAppDeletion (RevokeCreds): same — removes htpasswd+ACL
#     on App delete; the nudge below makes zot drop the entry within seconds.
#   registry.nudgeZot (w4/m347): pods patch on zot-0 only — zot v2.1.22
#     hot-reloads htpasswd and accessControl once the kubelet projects a Secret
#     write into its pod, and the kubelet does that at once when the pod object
#     changes. After every credential write the operator merge-patches one
#     annotation (bex.co/registry-credentials-written) onto the zot pod, so new
#     entries activate and removed ones stop working without a restart
#     (lego/operator/internal/registry/verify.go, docs/ADR022-tenant-isolation.md
#     § Credential activation). resourceNames pins it to the chart's single
#     StatefulSet replica, so the grant cannot patch any other pod here.
#   registry.EnsureActive last resort + ensureStorageActive: pods get/list/delete
#     — a credential still rejected after the 3m activation grace (hot reload is
#     broken; RegistryCredentialActivationRestarted alerts) or a new storage
#     block (w8/m156) restarts zot. Scoped here, not in the manager ClusterRole:
#     the operator must never gain pod-delete on tenant or platform namespaces.
#     Deliberately "delete", never "deletecollection" (bounceZot lists then
#     deletes each pod).
#
# This file lives in deploy/gitops (not lego/operator/config/rbac) because
# config/default's kustomize namePrefix+namespace transform would rewrite any
# namespace field to "bex-system", breaking the Role's target namespace. Same
# pattern as operator-apps-rbac.yaml and bex-api-apps-rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bex-operator-registry
  namespace: bex-registry
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["zot-0"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bex-operator-registry
  namespace: bex-registry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bex-operator-registry
subjects:
  # The operator ServiceAccount lives in bex-system (rendered from config/rbac with
  # the bex- namePrefix); a RoleBinding may reference a ServiceAccount in another ns.
  - kind: ServiceAccount
    name: bex-controller-manager
    namespace: bex-system
