# Tenant apps namespace: where bex projects App CRs (BEX_CP_APPS_NAMESPACE /
# BEX_API_NAMESPACE, default "default"). PSS baseline enforced at admission —
# blocks privileged containers, hostPath, hostNetwork, hostPID, hostIPC, and
# other high-risk capabilities at the kubelet (w7/m2/t001). warn+audit at
# restricted surfaces how far tenant images are from the stricter tier without
# enforcing it; tenant images may legitimately run as root (see
# docs/ADR022-tenant-isolation.md §mechanism-choice: restricted deliberately deferred).
apiVersion: v1
kind: Namespace
metadata:
  name: default
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
---
# Attach the Zot pull credential to the default ServiceAccount so kubelet
# authenticates pulls on any fresh node (autoscaler scale-up, node replacement,
# k8s upgrade roll). The operator also attaches it per-Deployment
# (BEX_REGISTRY_PULL_SECRET in manager.yaml), but this SA-level injection is a
# belt-and-suspenders fallback that Argo owns — closing the undeclared prod drift
# exposed by the w1/m36 node roll (w7/001).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: default
imagePullSecrets:
  - name: bex-registry-pull
