# API-server enforcement for the sandbox host boundary (ADR042 / w3/m35).
#
# The OpenSandbox server/controller need Pod or Job mutation inside provisioned
# `<ws>-sandbox` namespaces. Their checked-in template is not an authorization
# boundary: a compromised component could otherwise create an ordinary runc Pod
# and bypass gVisor. This policy applies to every Pod creator, including the
# Kubernetes Job controller, based on the trusted namespace regime label.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bex-sandbox-pods
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        app.bex.co/regime: sandbox
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.metadata.?labels['app.bex.co/regime'].orValue('') == 'sandbox' &&
        has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'gvisor' &&
        has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false &&
        has(object.spec.nodeSelector) &&
        'bex.co/pool' in object.spec.nodeSelector && object.spec.nodeSelector['bex.co/pool'] == 'sandbox' &&
        (request.operation != 'CREATE' || !has(object.spec.nodeName) || object.spec.nodeName == '')
      reason: Forbidden
      message: sandbox Pods must retain the gVisor runtime, scheduler-enforced sandbox placement, regime identity, and disabled ServiceAccount token
    - expression: >-
        (object.metadata.?labels['bex.co/sandbox-group'].orValue('') == '' ||
         (object.metadata.?labels['bex.co/sandbox-group'].orValue('').matches('^sbg-[0-9a-v]{20}$') &&
          object.metadata.?labels['bex.co/agent-session'].orValue('') == '')) &&
        (request.operation != 'UPDATE' ||
         (object.metadata.?labels['bex.co/sandbox-group'].orValue('') == oldObject.metadata.?labels['bex.co/sandbox-group'].orValue('') &&
          object.metadata.?labels['bex.co/sandbox-id'].orValue('') == oldObject.metadata.?labels['bex.co/sandbox-id'].orValue('') &&
          object.metadata.?labels['bex.co/workspace'].orValue('') == oldObject.metadata.?labels['bex.co/workspace'].orValue('') &&
          object.metadata.?labels['bex.co/agent-session'].orValue('') == oldObject.metadata.?labels['bex.co/agent-session'].orValue('') &&
          object.metadata.?labels['bex.co/egress'].orValue('') == oldObject.metadata.?labels['bex.co/egress'].orValue('')))
      reason: Forbidden
      message: sandbox Pod identity and egress labels (bex.co/sandbox-group, bex.co/sandbox-id, bex.co/workspace, bex.co/agent-session, bex.co/egress) must be valid at CREATE, exclude agent-session Pods from sandbox-group, and remain strictly immutable on UPDATE
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bex-sandbox-pods
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  policyName: bex-sandbox-pods
  validationActions: [Deny, Audit]
