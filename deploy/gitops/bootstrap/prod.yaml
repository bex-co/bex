# Per-env app-of-apps entrypoint (prod). Applied once by deploy.yml after Argo CD is
# installed on the app cluster; Argo then reconciles the prod overlay = the whole
# platform (zot, opensandbox-controller, bex operator, …) continuously from git.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bex-bootstrap
  namespace: argocd
spec:
  description: Production app-of-apps; only reviewed bex Git may define children
  sourceRepos:
    - git@github.com:bex-co/bex.git
  destinations:
    - { server: https://kubernetes.default.svc, namespace: "*" }
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bex-platform-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: bex-bootstrap
  source:
    repoURL: git@github.com:bex-co/bex.git
    targetRevision: main
    path: deploy/gitops/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
