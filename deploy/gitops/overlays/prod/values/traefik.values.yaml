# Prod (Hetzner CAPH) Traefik overrides (w1/m7 t005, re-done as a live smoke test
# 2026-07-08): swap the base single-node hostNetwork edge for fixed NodePorts
# behind a Terraform-owned Hetzner Cloud Load Balancer whose stable public IP
# survives node and cluster replacement. Terraform owns the LB network, dynamic
# worker selector, and every listener; Kubernetes never adopts the shared LB.
# Layered over
# base/values/traefik.values.yaml by the prod overlay kustomization — Argo
# deep-merges valueFiles in order, later wins.
#
# The LB targets CAPH workers over their private IPs. Local traffic policy keeps
# the client source IP and makes each listener's TCP health check select only
# workers with a local Traefik endpoint. See infra/terraform/main.tf and
# docs/ADR002-architecture.md.
hostNetwork: false # LB -> NodePort -> pod; no host-port binding
deployment:
  replicas: 2 # one edge remains behind the stable LB during a node drain
  dnsPolicy: ClusterFirst # back to normal cluster DNS (not the host netns)
  # The ssh entrypoint's hour (ports.ssh below) plus Traefik's own close and a
  # margin, or the kubelet kills a draining edge pod mid-session (w6/164).
  terminationGracePeriodSeconds: 3660
# Behind the LB the edge rolls (chart default 0 unavailable / 1 surge, which
# needs a spare platform node under the spread below); base's Recreate is only
# for the single hostNetwork edge (w4/338).
updateStrategy:
  type: RollingUpdate
# One live edge pod per node. A topology spread, not required pod anti-affinity
# (w6/164): an old pod drains open SSH sessions for up to an hour, and the
# scheduler counts a terminating pod for anti-affinity, so the roll's second new
# pod would wait Pending behind it for that hour. A spread does not count it,
# so the new pod starts beside the draining one. No matchLabelKeys: spreading
# per pod-template-hash would let two live pods share a node.
topologySpreadConstraints:
  - labelSelector:
      matchLabels:
        app.kubernetes.io/instance: traefik-traefik
        app.kubernetes.io/name: traefik
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
podDisruptionBudget:
  enabled: true
  minAvailable: 1
# Bind non-privileged container ports (the LB does the public :80/:443 exposure),
# so drop the root + NET_BIND_SERVICE edge-proxy exception the hostNetwork path
# needed. `add: []` clears the base's NET_BIND_SERVICE (maps deep-merge).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
securityContext:
  capabilities:
    add: []
    drop: [ALL]
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
ports:
  web:
    port: 8000 # exposedPort defaults to 80 -> LB listens :80, forwards to :8000
    nodePort: 31218
    # w1/m150: the Hetzner :80/:443 listeners send PROXY protocol
    # (infra/terraform/main.tf), so the allow-list middleware and the request log
    # see the real client, not 10.10.0.7. Trust ONLY the load balancer's private
    # address: anything wider lets that peer assert a client address. A trusted
    # peer with no header is still served (go-proxyproto v0.12.0, Traefik v3.7.5–v3.7.17), which keeps the LB's
    # plain-TCP health checks green. Pinned by scripts/edge-proxyprotocol-validate.sh.
    proxyProtocol:
      trustedIPs:
        - 10.10.0.7/32
  websecure:
    port: 8443 # exposedPort defaults to 443 -> LB listens :443
    nodePort: 31976
    # Same contract as web (w1/m150).
    proxyProtocol:
      trustedIPs:
        - 10.10.0.7/32
  ssh:
    port: 2222 # exposedPort 22 -> LB listens :22 without root in the pod
    exposedPort: 22
    nodePort: 32207
    expose:
      default: true
    protocol: TCP
    # Render's SSH maintenance hour (w6/164, docs/ADR035-ssh.md § Sessions
    # across an edge roll): a terminating edge pod keeps the SSH streams it
    # carries for up to an hour instead of Traefik's default 10 s, and exits
    # as soon as the last one ends. It takes no new connection meanwhile; the
    # HTTP entrypoints keep their 10 s. Production only: base's Recreate edge
    # would have no pod at all while one drained.
    transport:
      lifeCycle:
        graceTimeOut: 3600s
    # w9/m451 t010: the same contract as web, so the client address Traefik
    # forwards to the ssh-gateway (its own PROXY v2 hop, w4/m82) is the SSH
    # client's, not 10.10.0.7. This trust rolls out before the Terraform :22
    # listener sends a header. A trusted peer with no header is still served,
    # but Traefik then holds the server's banner until the client speaks, which
    # every SSH client does at once (RFC 4253 §4.2).
    proxyProtocol:
      trustedIPs:
        - 10.10.0.7/32
  # postgres entrypoint removed (w1/m29): the bex-pg-sni-proxy DaemonSet now
  # owns :5432 through a dedicated NodePort behind the Terraform listener (see
  # pg-sni-proxy-lb.yaml below).
  postgres:
    port: 5432
    expose:
      default: false  # remove :5432 from the Hetzner LB; the proxy LB service adds it back
service:
  spec:
    type: NodePort
    externalTrafficPolicy: Local
