# Prod (Hetzner CAPH) Traefik overrides (w1/m7 t005, re-done as a live smoke test
# 2026-07-08): swap the base single-node hostNetwork edge for fixed NodePorts
# behind a Terraform-owned Hetzner Cloud Load Balancer whose stable public IP
# survives node and cluster replacement. Terraform owns the LB network, dynamic
# worker selector, and every listener; Kubernetes never adopts the shared LB.
# Layered over
# base/values/traefik.values.yaml by the prod overlay kustomization — Argo
# deep-merges valueFiles in order, later wins.
#
# The LB targets CAPH workers over their private IPs. Local traffic policy keeps
# the client source IP and makes each listener's TCP health check select only
# workers with a local Traefik endpoint. See infra/terraform/main.tf and
# docs/ADR002-architecture.md.
hostNetwork: false # LB -> NodePort -> pod; no host-port binding
deployment:
  replicas: 2 # one edge remains behind the stable LB during a node drain
  dnsPolicy: ClusterFirst # back to normal cluster DNS (not the host netns)
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/instance: traefik-traefik
            app.kubernetes.io/name: traefik
        topologyKey: kubernetes.io/hostname
podDisruptionBudget:
  enabled: true
  minAvailable: 1
# Bind non-privileged container ports (the LB does the public :80/:443 exposure),
# so drop the root + NET_BIND_SERVICE edge-proxy exception the hostNetwork path
# needed. `add: []` clears the base's NET_BIND_SERVICE (maps deep-merge).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
securityContext:
  capabilities:
    add: []
    drop: [ALL]
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
ports:
  web:
    port: 8000 # exposedPort defaults to 80 -> LB listens :80, forwards to :8000
    nodePort: 31218
    # w1/m150 t001: accept PROXY protocol ONLY from the Hetzner load balancer's
    # private address, so the allow-list middleware and the request log see the
    # real client instead of 10.10.0.7. Verified on Traefik v3.7.5 (the build the
    # pinned chart ships): trustedIPs is TRUST, not a requirement — a trusted
    # peer that sends no header is still served, so the load balancer's plain-TCP
    # health checks keep passing while its listeners still send no header. The
    # listener flip itself is t002 and is applied separately, after this rolls.
    proxyProtocol:
      trustedIPs:
        - 10.10.0.7/32
  websecure:
    port: 8443 # exposedPort defaults to 443 -> LB listens :443
    nodePort: 31976
    # w1/m150 t001: accept PROXY protocol ONLY from the Hetzner load balancer's
    # private address, so the allow-list middleware and the request log see the
    # real client instead of 10.10.0.7. Verified on Traefik v3.7.5 (the build the
    # pinned chart ships): trustedIPs is TRUST, not a requirement — a trusted
    # peer that sends no header is still served, so the load balancer's plain-TCP
    # health checks keep passing while its listeners still send no header. The
    # listener flip itself is t002 and is applied separately, after this rolls.
    proxyProtocol:
      trustedIPs:
        - 10.10.0.7/32
  ssh:
    port: 2222 # exposedPort 22 -> LB listens :22 without root in the pod
    exposedPort: 22
    nodePort: 32207
    expose:
      default: true
    protocol: TCP
  # postgres entrypoint removed (w1/m29): the bex-pg-sni-proxy DaemonSet now
  # owns :5432 through a dedicated NodePort behind the Terraform listener (see
  # pg-sni-proxy-lb.yaml below).
  postgres:
    port: 5432
    expose:
      default: false  # remove :5432 from the Hetzner LB; the proxy LB service adds it back
service:
  spec:
    type: NodePort
    externalTrafficPolicy: Local
