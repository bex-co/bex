# Prod (Hetzner CAPH) Traefik overrides (w1/m7 t005, re-done as a live smoke test
# 2026-07-08): swap the base single-node hostNetwork edge for a real Hetzner Cloud
# LoadBalancer with a STABLE IP that survives node replacement. The Hetzner CCM
# provisions the LB from the Service annotations below. Layered over
# base/values/traefik.values.yaml by the prod overlay kustomization — Argo
# deep-merges valueFiles in order, later wins.
#
# LB targets nodes over their PRIVATE IPs (use-private-ip, enabled 2026-07-09). The
# first attempt failed because the node wasn't on the `bex` network; it now is
# (attached live on the bex `10.10.0.0/16` network), and the CCM is network-aware
# (HCLOUD_NETWORK=bex, HCLOUD_NETWORK_ROUTES_ENABLED=false — LB uses the private
# net, route-controller stays OFF so it can't fight Cilium tunnel-mode routing).
# The LB→node hop rides that 10.10.0.0/16 private net; the LB's public IP is
# unchanged. See app-cluster.yml (CCM) + docs/ADR019-infra-credentials.md.
hostNetwork: false # LB -> NodePort -> pod; no host-port binding
deployment:
  dnsPolicy: ClusterFirst # back to normal cluster DNS (not the host netns)
# Bind non-privileged container ports (the LB does the public :80/:443 exposure),
# so drop the root + NET_BIND_SERVICE edge-proxy exception the hostNetwork path
# needed. `add: []` clears the base's NET_BIND_SERVICE (maps deep-merge).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
securityContext:
  capabilities:
    add: []
    drop: [ALL]
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
ports:
  web:
    port: 8000 # exposedPort defaults to 80 -> LB listens :80, forwards to :8000
  websecure:
    port: 8443 # exposedPort defaults to 443 -> LB listens :443
  # postgres entrypoint removed (w1/m29): the bex-pg-sni-proxy DaemonSet now
  # owns :5432 via the bex-traefik Hetzner LB (see pg-sni-proxy-lb.yaml below).
  # Port 5432 is re-added to the same LB via the proxy's LoadBalancer Service.
  postgres:
    port: 5432
    expose:
      default: false  # remove :5432 from the Hetzner LB; the proxy LB service adds it back
service:
  annotations:
    load-balancer.hetzner.cloud/name: bex-traefik
    load-balancer.hetzner.cloud/location: fsn1
    load-balancer.hetzner.cloud/use-private-ip: "true" # LB→node hop over the bex private net
    load-balancer.hetzner.cloud/uses-proxyprotocol: "false"
  spec:
    type: LoadBalancer # CCM provisions the Hetzner LB (stable IP)
