# Production snapshot transport — ENABLED (w3/m42 t002, ADR042 D5).
# The full chain is live: the patched controller (immutable CI-maintained
# digest, base values) runs commit/unpause Jobs in the dedicated
# `opensandbox-snapshot` namespace (privileged PSS) and nests snapshot repos
# per tenant namespace (`snapshots/<ws>-sandbox/…`). Credentials:
#   - push: `opensandbox-snapshot/bex-snapshot-push` (out-of-band,
#     scripts/snapshot-registry-secrets.sh — bex-builder holds Zot's
#     adminPolicy, so no ACL change);
#   - resume-pull: the operator mints per-workspace `bex-snapshot-pull`
#     Secrets into every `app.bex.co/regime=sandbox` namespace, each backed by
#     a read-only `snap-<ns>` Zot user scoped to `snapshots/<ns>/**`
#     (SandboxNamespaceRegistryReconciler, gated on BEX_REGISTRY_NS) — a
#     shared read credential would allow cross-tenant snapshot-rootfs pulls,
#     so the transport flip is atomic with that per-workspace minting.
# registryInsecure: the in-cluster Zot is HTTP; Cilium WireGuard node
# encryption is the transport mitigation (w7/008).
controller:
  snapshot:
    registry: zot.bex-registry.svc:5000/snapshots
    registryInsecure: true
    snapshotPushSecret: bex-snapshot-push
    resumePullSecret: bex-snapshot-pull
    # k3s nodes expose containerd at the k3s-specific socket path.
    containerdSocketPath: /run/k3s/containerd/containerd.sock
