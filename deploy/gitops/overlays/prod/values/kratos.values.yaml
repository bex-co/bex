# Production auth-plane availability: keep identity serving on a second node
# while one platform node drains. The courier remains single-copy; it is
# asynchronous and does not sit on the login/session request path.
replicaCount: 2

deployment:
  affinity:
    podAntiAffinity:
      # w2/029: preferred, not required — required anti-affinity left every
      # rollout's surge pod Pending (FailedScheduling) on the 3-node platform
      # pool until an old pod finished terminating. Steady-state spreading is
      # unchanged; the scheduler still prefers separate nodes.
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/instance: kratos
                app.kubernetes.io/name: kratos
            topologyKey: kubernetes.io/hostname

pdb:
  enabled: true
  spec:
    minAvailable: 1
