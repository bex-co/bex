# Production auth-plane availability: a drain may evict one Hydra pod while a
# second, node-separated replica continues serving OAuth and admin traffic.
replicaCount: 2

affinity:
  podAntiAffinity:
    # w2/029: preferred, not required — same surge-pod FailedScheduling noise
    # as kratos/bex-api on the 3-node platform pool.
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: hydra
              app.kubernetes.io/name: hydra
          topologyKey: kubernetes.io/hostname

pdb:
  enabled: true
  spec:
    minAvailable: 1
