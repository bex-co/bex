# Production-only fallback TLS. The externally issued certificate is installed
# before this Application; local/CAPD never require production key material.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onbex-default-tls
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: bex-platform
  source:
    repoURL: git@github.com:bex-co/bex.git
    targetRevision: main
    path: deploy/gitops/charts/onbex-default-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated: { prune: true, selfHeal: true }
