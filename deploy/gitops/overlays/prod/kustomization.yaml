# Prod overlay (Hetzner CAPH). References the shared base; prod-only patches go here
# as they materialize (e.g. real-TLS Zot, higher replicas). Applied via the
# ../../bootstrap/prod.yaml app-of-apps entrypoint.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # OpenBao: layer the prod values file (server.ha.replicas: 3 for quorum, no
  # local-path storageClass — falls back to the cluster's default provisioner)
  # over the base values. Argo merges valueFiles in order, later wins — the
  # same patch shape the local overlay uses for its openbao values.
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: openbao
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/deploy/gitops/overlays/prod/values/openbao.values.yaml
  # Traefik: layer the prod values file — Hetzner LoadBalancer with a stable IP,
  # public-IP targets (w1/m7 t005, re-done 2026-07-08 as the live smoke test the
  # original deferred). The first attempt bundled use-private-ip + the private
  # network and took prod down; this public-IP version needs no private network.
  # Provision is one-way visible: after ship, watch the bex-traefik LB get an IP,
  # curl it, THEN repoint Cloudflare — the switch has downtime until DNS moves.
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: traefik
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/deploy/gitops/overlays/prod/values/traefik.values.yaml
