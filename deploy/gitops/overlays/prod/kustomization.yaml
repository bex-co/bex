# Prod overlay (Hetzner CAPH). References the shared base; prod-only patches go here
# as they materialize (e.g. real-TLS Zot, higher replicas). Applied via the
# ../../bootstrap/prod.yaml app-of-apps entrypoint.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # OpenBao: layer the prod values file (server.ha.replicas: 3 for quorum, no
  # local-path storageClass — falls back to the cluster's default provisioner)
  # over the base values. Argo merges valueFiles in order, later wins — the
  # same patch shape the local overlay uses for its openbao values.
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: openbao
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/deploy/gitops/overlays/prod/values/openbao.values.yaml
  # Traefik LoadBalancer overlay (w1/m7 t005) REVERTED 2026-07-08: flipping the edge
  # to a Hetzner LB (hostNetwork:false + new LB IP) took prod down — Cloudflare DNS
  # still points at the node's public IP that hostNetwork bound, so :80/:443 went dark
  # → 521 on every fronted domain (dashboard.bex.co, tenant apps). The base hostNetwork
  # edge is restored here. Redo the LB migration deliberately: provision + verify the
  # LB, repoint Cloudflare to its IP, THEN set hostNetwork:false. The prod values file
  # (values/traefik.values.yaml) is kept for that follow-up but is no longer layered.
