# Local (OrbStack / kind) overlay. References the shared base and applies
# local-only differences (insecure registry, single replicas, CAPD provider).
# Apply via ../../bootstrap/local.yaml (the per-env app-of-apps entrypoint).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  # Local-only mail catcher (docs/ADR012-auth.md §11) — layered on top of base, so it
  # renders in this overlay only and never in prod.
  - mailpit.yaml
patches:
  # The local CAPD mock cluster runs Calico, not Cilium (scripts/mock-cluster.sh),
  # so the Cilium-native node/metadata egressDeny CRD doesn't exist here. Drop it;
  # the portable per-App k8s NetworkPolicy (which excepts 169.254.0.0/16) still
  # applies, and the node-entity deny is a prod-cluster concern.
  - patch: |-
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: deny-tenant-node-and-metadata-egress
        namespace: default
      $patch: delete
  - patch: |-
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: deny-build-node-and-metadata-egress
        namespace: bex-build
      $patch: delete
  # No etcd backups locally: the CAPD cluster is disposable and has no
  # object-storage creds.
  - patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: etcd-backup
        namespace: argocd
      $patch: delete
  # Likewise no OpenBao Raft snapshots locally (disposable cluster, no S3 creds).
  - patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: openbao-backup
        namespace: argocd
      $patch: delete
  # The plugin itself remains installed for local migration tests, but the
  # disposable cluster has no object-store credential Secrets.
  - patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: barman-cloud-objectstores
        namespace: argocd
      $patch: delete
  # Auth DBs: shrink to CAPD scale — 1Gi on local-path (no hcloud-volumes here;
  # the CAPD cluster needs the local-path provisioner installed, see docs/ADR012-auth.md).
  - patch: |-
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: auth-dbs
        namespace: argocd
      spec:
        source:
          kustomize:
            patches:
              - target: { kind: Cluster }
                patch: |-
                  - { op: replace, path: /spec/storage/size, value: 1Gi }
                  - { op: replace, path: /spec/storage/storageClass, value: local-path }
  # Loki: shrink the durable-log PVC to CAPD scale (the disposable mock cluster
  # doesn't need 7d of platform-scale history on local-path). Layered as a Helm
  # parameter so it overrides the base values' singleBinary.persistence.size.
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: loki
    patch: |-
      - op: add
        path: /spec/source/helm/parameters
        value:
          - { name: singleBinary.persistence.size, value: 2Gi }
  # Prometheus: disable Alertmanager locally — the disposable CAPD cluster has no
  # SMTP cred (the `alertmanager-smtp` Secret is out-of-band, prod-only),
  # exactly as it has no backup S3 creds, so we drop the workload rather than let
  # it sit permanently pending on a missing secret mount (mirrors the
  # $patch:delete of the backup Applications above). kube-state-metrics stays on,
  # so the server still evaluates the rule pack (visible in the Prometheus UI).
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: prometheus
    patch: |-
      - op: add
        path: /spec/source/helm/parameters
        value:
          - { name: alertmanager.enabled, value: "false" }
  # Kratos/Hydra: layer the local values files (hosts, plain HTTP, dev mode)
  # over the base values — Argo merges valueFiles in order, later wins.
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: kratos
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/deploy/gitops/overlays/local/values/kratos.values.yaml
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: hydra
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/deploy/gitops/overlays/local/values/hydra.values.yaml
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: openbao
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/deploy/gitops/overlays/local/values/openbao.values.yaml
