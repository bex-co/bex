# Local overrides for Ory Kratos: local host, plain HTTP (no ACME/DNS on the
# mock cluster). Layered over base/values/kratos.values.yaml by the Application
# patch in ../kustomization.yaml (later valueFiles win).
#
# base_url/return_url point at localhost:4433 (reached via
# `kubectl -n auth port-forward service/kratos-public 4433:80`), matching how
# scripts/auth-verify.sh and scripts/auth-e2e.sh already reach these services
# locally — auth.bex.local has no DNS/hosts entry and Traefik isn't exposed to
# the host, so a hostname-based URL here would never actually be reachable.
kratos:
  config:
    serve:
      public:
        base_url: http://localhost:4433/
        cors:
          enabled: true
          allowed_origins:
            - http://localhost:5173
          allow_credentials: true
    selfservice:
      default_browser_return_url: http://localhost:5173/
      allowed_return_urls:
        - http://localhost:5173
      # WebAuthn RP is registrable-parent-scoped (w4/m11): the base value
      # `bex.co` can't sign ceremonies served from localhost, so the mock stack
      # registers keys under `localhost`. Deep-merged over base, so
      # passwordless:false / display_name / totp / lookup_secret all carry
      # through; `origins` (a list) is replaced wholesale, which is intended.
      methods:
        webauthn:
          config:
            rp:
              id: localhost
              origins:
                - http://localhost:5173
      flows:
        login:
          ui_url: http://localhost:5173/auth/login
        registration:
          enabled: true
          ui_url: http://localhost:5173/auth/sign-up
        recovery:
          enabled: true
          ui_url: http://localhost:5173/auth/forgot-password
        settings:
          ui_url: http://localhost:5173/settings
        # Flipped on to match base (w4/m7): Argo merges valueFiles later-wins, so
        # leaving this false here would override base's `enabled: true`. `use: code`
        # deep-merges through from base. (docs/ADR012-auth.md §11.)
        verification:
          enabled: true
          ui_url: http://localhost:5173/auth/verification
        error:
          ui_url: http://localhost:5173/auth/error
    session:
      cookie:
        # Override base's `domain: bex.co` (a bare "domain" attribute isn't
        # valid for `localhost` — leaving it empty makes it a host-only
        # cookie, which is what we want since 4433/5173 are already same-site).
        domain: ""
        same_site: Lax

# Social login (docs/ADR012-auth.md § Social login) inherits from base: the mock
# cluster's kratos still loads the second --config file (`oidc.yaml` from the
# `kratos` Secret), which scripts/auth-secrets.sh writes disabled unless
# BEX_GITHUB_OIDC_* are in .env — GitHub OAuth apps can't redirect to localhost the
# way prod does. The credible local check is scripts/auth-oidc-e2e.sh, a
# self-contained Dex + Kratos harness (mirrors auth-oauth21-e2e.sh), not this
# overlay.

ingress:
  public:
    hosts:
      - host: auth.bex.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
