# Bex DB for the dev-4 isolated environment (workstream w4) — sized down
# for local (1Gi, local-path). A distinct namespace (dev-4-auth) means this
# never collides with the shared cluster's or another workstream's bex-db.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bex-db
  namespace: dev-4-auth
spec:
  instances: 1
  affinity:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
  storage:
    size: 1Gi
    storageClass: local-path
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  bootstrap:
    initdb:
      database: bex
      owner: bex
