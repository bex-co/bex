# dev-4 overlay for Ory Hydra (workstream w4) — sibling of
# kratos.values.yaml in this directory; see its header for why each
# workstream needs its own Ory stack instead of reusing the shared cluster's
# "auth" namespace.
#
# Ports here MUST match .pm/w4/dev-4/ports.env:
#   dashboard        -> http://localhost:50040
#   hydra-admin port-forward -> http://localhost:52040
hydra:
  dev: true # plain-HTTP issuer, dev-only
  config:
    urls:
      self:
        issuer: http://localhost:57040
      login: http://localhost:50040/auth/login
      consent: http://localhost:50040/auth/consent
