# dev-5 overlay for Ory Hydra (workstream w5) — sibling of
# kratos.values.yaml in this directory; see its header for why each
# workstream needs its own Ory stack instead of reusing the shared cluster's
# "auth" namespace.
#
# Ports here MUST match .pm/w5/dev-5/ports.env:
#   dashboard        -> http://localhost:50050
#   hydra-admin port-forward -> http://localhost:52050
hydra:
  dev: true # plain-HTTP issuer, dev-only
  config:
    urls:
      self:
        issuer: http://localhost:57050
      login: http://localhost:50050/auth/login
      consent: http://localhost:50050/auth/consent
