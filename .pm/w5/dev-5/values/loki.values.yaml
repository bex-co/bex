# dev-5 Loki values — the local counterpart of deploy/gitops/base/loki.yaml's
# Argo Application (w5/m62). Same SingleBinary/filesystem posture bex-api's
# NewLokiSource queries, but adapted for the disposable kind cluster:
#   - no platform nodeSelector/tolerations (the kind node carries no bex.co/pool
#     label — the block that kept Loki off dev-5), so it schedules anywhere;
#   - a 2Gi PVC instead of 20Gi (local scale);
#   - otherwise byte-for-byte the prod values so the query path bex-api exercises
#     is the same one that runs in production.
# Installed by up.sh into the `monitoring` namespace; bex-api reaches it through
# a host port-forward (BEX_LOKI_URL=http://localhost:$LOKI_PORT).
fullnameOverride: loki # => Service `loki` on :3100
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config:
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester: { enabled: false }
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
# No platform nodeSelector/tolerations — dev-5's kind node is unlabeled.
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
minio: { enabled: false }
monitoring:
  selfMonitoring: { enabled: false }
  serviceMonitor: { enabled: false }
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
