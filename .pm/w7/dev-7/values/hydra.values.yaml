# dev-7 overlay for Ory Hydra (workstream w7) — sibling of
# kratos.values.yaml in this directory; see its header for why each
# workstream needs its own Ory stack instead of reusing the shared cluster's
# "auth" namespace.
#
# Ports here MUST match .pm/w7/dev-7/ports.env:
#   dashboard        -> http://localhost:50070
#   hydra-admin port-forward -> http://localhost:52070
hydra:
  dev: true # plain-HTTP issuer, dev-only
  config:
    urls:
      self:
        issuer: http://localhost:57070
      login: http://localhost:50070/auth/login
      consent: http://localhost:50070/auth/consent
