# Hydra DB for the dev-7 isolated environment (workstream w7) — sized down
# for local (1Gi, local-path). A distinct namespace (dev-7-auth) means this
# never collides with the shared cluster's or another workstream's hydra-db.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hydra-db
  namespace: dev-7-auth
spec:
  instances: 1
  affinity:
    nodeSelector:
      bex.co/pool: platform
    tolerations:
      - key: bex.co/platform
        operator: Equal
        value: "true"
        effect: NoSchedule
  storage:
    size: 1Gi
    storageClass: local-path
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  bootstrap:
    initdb:
      database: hydra
      owner: hydra
