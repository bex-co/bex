# The dev-10 app namespace's copy of deploy/gitops/base/operator-apps-rbac.yaml
# (namespace default -> dev-10) — the operator's manager-role ClusterRole
# deliberately has no secrets create/update/delete (least-privilege, w7/m7); a
# tenant apps namespace needs its own Role+RoleBinding granting the operator's
# ServiceAccount secrets CRUD there, same as the shared cluster's "default"
# namespace already has. Without this, KeyValue/Database CRs in dev-10 fail
# with "secrets is forbidden ... in the namespace dev-10" (SecretFailed).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bex-operator-apps
  namespace: dev-10
rules:
  - apiGroups: [""]
    resources: ["secrets", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bex-operator-apps
  namespace: dev-10
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bex-operator-apps
subjects:
  - kind: ServiceAccount
    name: bex-controller-manager
    namespace: bex-system
