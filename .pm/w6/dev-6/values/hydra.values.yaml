# dev-6 overlay for Ory Hydra (workstream w6) — sibling of
# kratos.values.yaml in this directory; see its header for why each
# workstream needs its own Ory stack instead of reusing the shared cluster's
# "auth" namespace.
#
# Ports here MUST match .pm/w6/dev-6/ports.env:
#   dashboard        -> http://localhost:50060
#   hydra-admin port-forward -> http://localhost:52060
hydra:
  dev: true # plain-HTTP issuer, dev-only
  config:
    urls:
      self:
        issuer: http://localhost:57060
      login: http://localhost:50060/auth/login
      consent: http://localhost:50060/auth/consent
