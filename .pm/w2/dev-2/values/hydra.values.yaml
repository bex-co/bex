# dev-2 overlay for Ory Hydra (workstream w2) — sibling of
# kratos.values.yaml in this directory; see its header for why each
# workstream needs its own Ory stack instead of reusing the shared cluster's
# "auth" namespace.
#
# Ports here MUST match .pm/w2/dev-2/ports.env:
#   dashboard        -> http://localhost:50020
#   hydra-admin port-forward -> http://localhost:52020
hydra:
  dev: true # plain-HTTP issuer, dev-only
  config:
    urls:
      self:
        issuer: http://localhost:57020
      login: http://localhost:50020/auth/login
      consent: http://localhost:50020/auth/consent
