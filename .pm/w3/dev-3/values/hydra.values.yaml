# dev-3 overlay for Ory Hydra (workstream w3) — sibling of
# kratos.values.yaml in this directory; see its header for why each
# workstream needs its own Ory stack instead of reusing the shared cluster's
# "auth" namespace.
#
# Ports here MUST match .pm/w3/dev-3/ports.env:
#   dashboard        -> http://localhost:50030
#   hydra-admin port-forward -> http://localhost:52030
hydra:
  dev: true # plain-HTTP issuer, dev-only
  config:
    urls:
      self:
        issuer: http://localhost:57030
      login: http://localhost:50030/auth/login
      consent: http://localhost:50030/auth/consent
