# Kratos DB for the dev-9 isolated environment (workstream w9) — sized down
# for local (1Gi, local-path). A distinct namespace (dev-9-auth) means this
# never collides with the shared cluster's or another workstream's kratos-db.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kratos-db
  namespace: dev-9-auth
spec:
  instances: 1
  affinity:
    nodeSelector:
      bex.co/pool: platform
    tolerations:
      - key: bex.co/platform
        operator: Equal
        value: "true"
        effect: NoSchedule
  storage:
    size: 1Gi
    storageClass: local-path
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  bootstrap:
    initdb:
      database: kratos
      owner: kratos
