# dev-9 overlay for Ory Hydra (workstream w9) — sibling of
# kratos.values.yaml in this directory; see its header for why each
# workstream needs its own Ory stack instead of reusing the shared cluster's
# "auth" namespace.
#
# Ports here MUST match .pm/w9/dev-9/ports.env:
#   dashboard        -> http://localhost:50090
#   hydra-admin port-forward -> http://localhost:52090
hydra:
  dev: true # plain-HTTP issuer, dev-only
  config:
    urls:
      self:
        issuer: http://localhost:57090
      login: http://localhost:50090/auth/login
      consent: http://localhost:50090/auth/consent
