services:
  - type: web
    name: qa316-830c50-consumer
    runtime: image
    image:
      url: nginx:1.27
    plan: free
    envVars:
      - key: UPSTREAM
        fromService:
          type: web
          name: qa316-9b5ec0-static
          property: host
  - name: qa316-9b5ec0-static
    type: web
    runtime: static
    repo: https://github.com/expressjs/serve-static
    branch: master
    buildCommand: mkdir -p public
    staticPublishPath: public
