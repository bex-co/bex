databases:
  - name: qa313-c2ebae-shared
    plan: free
services:
  - type: web
    name: qa313-c2ebae-consumer
    runtime: image
    image:
      url: nginx:1.27
    plan: free
    envVars:
      - key: QA313_DB
        fromDatabase:
          name: qa313-c2ebae-shared
          property: connectionString
      - key: QA313_HOST
        fromService:
          type: web
          name: qa313-c2ebae-shared
          property: host
