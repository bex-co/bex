# dev-1 overlay for Ory Hydra (workstream w1) — sibling of
# kratos.values.yaml in this directory; see its header for why each
# workstream needs its own Ory stack instead of reusing the shared cluster's
# "auth" namespace.
#
# Ports here MUST match .pm/w1/dev-1/ports.env:
#   dashboard        -> http://localhost:50010
#   hydra-admin port-forward -> http://localhost:52010
hydra:
  dev: true # plain-HTTP issuer, dev-only
  config:
    urls:
      self:
        issuer: http://localhost:57010
      login: http://localhost:50010/auth/login
      consent: http://localhost:50010/auth/consent
