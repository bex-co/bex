# dev-alpha overlay for Ory Hydra — sibling of kratos.values.yaml in this
# directory; see its header for why dev-alpha needs its own Ory stack instead
# of reusing the shared cluster's "auth" namespace.
#
# Ports here MUST match env/dev-alpha/ports.env:
#   dashboard        -> http://localhost:5273
#   hydra-admin port-forward -> http://localhost:15445
hydra:
  dev: true # plain-HTTP issuer, dev-only
  config:
    urls:
      self:
        issuer: http://localhost:15444
      login: http://localhost:5273/auth/login
      consent: http://localhost:5273/auth/consent
