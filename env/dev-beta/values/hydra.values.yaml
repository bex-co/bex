# dev-beta overlay for Ory Hydra — sibling of kratos.values.yaml in this
# directory; see its header for why dev-beta needs its own Ory stack instead
# of reusing the shared cluster's "auth" namespace.
#
# Ports here MUST match env/dev-beta/ports.env:
#   dashboard        -> http://localhost:5373
#   hydra-admin port-forward -> http://localhost:25445
hydra:
  dev: true # plain-HTTP issuer, dev-only
  config:
    urls:
      self:
        issuer: http://localhost:25444
      login: http://localhost:5373/auth/login
      consent: http://localhost:5373/auth/consent
