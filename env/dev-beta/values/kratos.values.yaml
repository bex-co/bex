# dev-beta overlay for Ory Kratos — layered on top of the repo's own
# ../../../deploy/gitops/base/values/kratos.values.yaml (helm -f order: base
# first, this second, later wins), the same later-wins pattern
# deploy/gitops/overlays/local/values/kratos.values.yaml uses for the shared
# cluster's "auth" namespace. This is the dev-beta sibling of that file: same
# idea, different ports/namespace so it never collides with a concurrent
# session using the shared cluster's Kratos on :5173/:4433 (ui_url and
# allowed_return_urls are single-valued / allowlist entries — two dashboards
# on two different ports cannot share one Kratos deployment cleanly).
#
# Ports here MUST match env/dev-beta/ports.env:
#   dashboard  -> http://localhost:5373
#   kratos-public port-forward -> http://localhost:25433
kratos:
  config:
    oauth2_provider:
      url: http://hydra-admin.dev-beta-auth.svc.cluster.local:4445
    serve:
      public:
        base_url: http://localhost:25433/
        cors:
          enabled: true
          allowed_origins:
            - http://localhost:5373
          allow_credentials: true
    selfservice:
      default_browser_return_url: http://localhost:5373/
      allowed_return_urls:
        - http://localhost:5373
      methods:
        webauthn:
          config:
            rp:
              id: localhost
              origins:
                - http://localhost:5373
      flows:
        login:
          ui_url: http://localhost:5373/auth/login
        registration:
          enabled: true
          ui_url: http://localhost:5373/auth/sign-up
        recovery:
          enabled: true
          ui_url: http://localhost:5373/auth/forgot-password
        settings:
          ui_url: http://localhost:5373/settings
        verification:
          enabled: true
          ui_url: http://localhost:5373/auth/verification
        error:
          ui_url: http://localhost:5373/auth/error
    session:
      cookie:
        domain: ""
        same_site: Lax
