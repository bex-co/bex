# The dev-beta control-plane DB (CNPG Cluster) — same shape as
# deploy/gitops/charts/bex-postgres/cluster.yaml, sized down for local and
# with no backup config (disposable dev cluster). BEX_CP_DB_URI wires this
# into dev-beta's local bex-api: without it, `workspaces` (and everything
# gated on a resolvable workspace, including creating a KeyValue) 503s —
# `internal/workspaces/service.go`'s `s.Store == nil` guard.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bex-db
  namespace: dev-beta-auth
spec:
  instances: 1
  affinity:
    nodeSelector:
      bex.co/pool: platform
    tolerations:
      - key: bex.co/platform
        operator: Equal
        value: "true"
        effect: NoSchedule
  storage:
    size: 1Gi
    storageClass: local-path
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  bootstrap:
    initdb:
      database: bex
      owner: bex
