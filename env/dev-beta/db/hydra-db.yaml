# Hydra OAuth2 DB for the dev-beta isolated environment — see kratos-db.yaml
# for the sizing/namespace rationale.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hydra-db
  namespace: dev-beta-auth
spec:
  instances: 1
  affinity:
    nodeSelector:
      bex.co/pool: platform
    tolerations:
      - key: bex.co/platform
        operator: Equal
        value: "true"
        effect: NoSchedule
  storage:
    size: 1Gi
    storageClass: local-path
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  bootstrap:
    initdb:
      database: hydra
      owner: hydra
