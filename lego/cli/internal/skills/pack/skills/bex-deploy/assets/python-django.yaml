# Django Application with Worker and Databases
# Full Django stack with Celery worker, PostgreSQL, and Key Value

services:
  # Django web service
  - type: web
    name: django-web
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    # Free web services do not support preDeployCommand, so migrations run during the build.
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    # In settings.py, append RENDER_EXTERNAL_HOSTNAME to ALLOWED_HOSTS and add any
    # custom domains explicitly. bex injects this hostname at runtime.
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        sync: false  # User provides in Dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: redis
          type: keyvalue
          property: connectionString

  # Celery worker for background tasks
  - type: worker
    name: celery-worker
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        sync: false  # Same as web service
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: redis
          type: keyvalue
          property: connectionString

  # Celery beat for periodic tasks (optional)
  - type: worker
    name: celery-beat
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config.celery_app beat --loglevel=info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: REDIS_URL
        fromService:
          name: redis
          type: keyvalue
          property: connectionString

  # Key Value for Celery and caching. Queue brokers must not evict queued jobs.
  - type: keyvalue
    name: redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []  # Internal access only

databases:
  # PostgreSQL database
  - name: postgres
    databaseName: django_production
    user: django_user
    plan: free
    postgresMajorVersion: "15"
    ipAllowList: []  # Internal access only
