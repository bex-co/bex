# Prometheus Monitor Service (Metrics)
#
# UNUSED SCAFFOLDING, kept for portability: it is commented out of
# config/default/kustomization.yaml, and the platform's Prometheus is the
# community chart (no Prometheus Operator, so no ServiceMonitor CRD). The
# manager's build-plane SLIs are scraped by the static `bex-operator` job in
# deploy/gitops/base/prometheus.yaml. Kept in sync with the metrics Service so
# enabling this never lands on a port that does not exist.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-monitor
  namespace: system
spec:
  endpoints:
    - path: /metrics
      # = the metrics Service's port name (config/default/metrics_service.yaml),
      # which the manager serves as plain HTTP on the pod network — the same
      # trust model as every other bex component's metrics endpoint.
      port: metrics
      scheme: http
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: control-plane
