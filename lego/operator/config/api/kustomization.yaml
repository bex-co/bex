# bex-api: the control-plane-seed service (REST + GraphQL for restart/suspend/
# resume). Ships in the operator image (command: /api) and is reached at
# api.<BEX_BASE_DOMAIN> via Traefik + a cert-manager cert. namePrefix/namespace
# come from config/default (bex-, bex-system).
resources:
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # objects.<base domain>: the direct, DNS-only host of the Cloudflare-shaped
  # object storage routes, because Cloudflare's proxy in front of api.<base
  # domain> refuses a body over 100 MiB while wrangler puts up to 300 MiB
  # (docs/ADR112-object-storage.md D3).
  - ingressroute-objects.yaml

# Teach Kustomize that Traefik's IngressRoute names a Service, so the namePrefix
# rewrite reaches it (the same wiring as config/objectgw and config/ssh).
configurations:
  - kustomizeconfig.yaml
