# The direct (not Cloudflare-proxied) host of the Cloudflare-shaped object
# storage API (docs/ADR112-object-storage.md D3, w21/m416 t013).
#
# Why a second host. api.bex.co is Cloudflare-proxied, and Cloudflare's edge
# refuses a request body over 100 MiB (Free and Pro plans) with its own HTML 413
# before bex sees it. Measured on production 2026-11-15: 104857600 bytes passed
# and 104857601 did not. wrangler sends an object in the API call itself and
# allows 300 MiB, so through api.bex.co only objects up to 100 MiB can be put.
# objects.<base domain> sits under the DNS-only *.onbex.co wildcard, which
# resolves straight to Traefik's load balancer, so the same bex-api handlers
# take the full 300 MiB (verified on production 2026-11-15 with stock
# wrangler 4.162.0: 300 MiB in and out, sha256 equal, and 300 MiB + 1 refused).
#
# Only the Cloudflare-shaped surface is routed: every other path of this host
# falls through to the platform-host fallback (a 404), so this adds no door to
# the rest of the API, and Traefik's :8091 control-plane port is never named.
# The routes need an Authorization: Bearer token and no cookie is ever sent to
# an onbex.co host, so a tenant page on a sibling label gains no authority.
#
# TLS: the host is ONE label under the shared platform suffix, so Traefik's
# default store certificate, the *.onbex.co wildcard, serves it (`tls: {}`
# names no Secret; docs/ADR093-onbex-wildcard-tls.md). No plain-HTTP route: a
# bearer token must not travel over it, so http:// meets the fallback.
#
# Precedence: an explicit priority above every App route (a service named
# "objects" cannot shadow this path; the label is also reserved as a service
# slug, publichost.Reserved), as for the pub- routes of config/objectgw. The
# suffix is "." + BEX_BASE_DOMAIN; keep it in sync with the other platform
# hosts (scripts/gitops-validate.sh checks it still names the prod suffix).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api-objects
  namespace: system
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      priority: 10000
      match: Host(`objects.onbex.co`) && PathPrefix(`/cloudflare/client/v4/`)
      services:
        - name: api # kustomize rewrites to bex-api (namePrefix)
          port: 80
  tls: {}
