apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: system
  labels:
    app.kubernetes.io/name: bex-api
    app.kubernetes.io/component: control-plane-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bex-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bex-api
    spec:
      serviceAccountName: api
      # w1/m19 t003: platform pool
      nodeSelector:
        bex.co/pool: platform
      tolerations:
        - key: bex.co/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Same image as the operator; Argo's image override (controller=...)
          # rewrites this tag. The command selects the api binary.
          image: controller:latest
          # See manager.yaml: :latest is mutable, so the deploy workflow
          # rollout-restarts this Deployment and Always re-pulls the new image.
          imagePullPolicy: Always
          command: ["/api"]
          env:
            - name: BEX_API_ADDR
              value: ":8090"
            - name: BEX_API_PUBLIC_URL # public origin used in copy-ready deploy-hook URLs
              value: https://api.bex.co
            - name: BEX_SSH_HOST # Render-compatible serviceDetails.sshAddress host
              valueFrom:
                configMapKeyRef:
                  # Created only after DNS/TCP/22/host-fingerprint verification;
                  # absent means the API honestly omits sshAddress.
                  name: bex-ssh
                  key: host
                  optional: true
            - name: BEX_DASHBOARD_URL # trusted browser origin for callbacks, invites, and resource links
              value: https://dashboard.bex.co
            - name: BEX_REGION # explicit platform placement for Render resource metadata
              value: fsn1
            - name: BEX_API_NAMESPACE # Apps live in the default namespace
              value: default
            # Auth (docs/ADR012-auth.md): OAuth2 API keys introspected at Hydra's
            # admin API; Kratos sessions for humans. No shared static token —
            # the bootstrap client is seeded by scripts/auth-bootstrap-client.sh.
            - name: BEX_HYDRA_ADMIN_URL # required; the binary refuses to start without it
              value: http://hydra-admin.auth.svc:4445
            - name: BEX_KRATOS_URL # optional; unset disables session auth
              value: http://kratos-public.auth.svc:80
            # Owner/member identity lookup (w6/m2 owners API): Kratos' admin
            # port, distinct from the public port above — resolving another
            # member's email/MFA needs the admin API, not a session. Optional;
            # unset omits those fields from the owners/members responses.
            - name: BEX_KRATOS_ADMIN_URL
              value: http://kratos-admin.auth.svc:80
            # OAuth 2.1 discovery for MCP/agent clients (w4/m9, docs/ADR012-auth.md):
            # issuer = Hydra's public URL; resource = this API's canonical URI.
            # Drives the RFC 9728 metadata endpoint, the 401 WWW-Authenticate
            # resource_metadata hint, and the token-audience check.
            - name: BEX_OAUTH_ISSUER
              value: https://oauth.bex.co
            - name: BEX_OAUTH_RESOURCE
              value: https://api.bex.co/mcp
            - name: BEX_PROM_URL # Prometheus scraping Traefik => request metrics
              value: http://prometheus-server.monitoring.svc.cluster.local
            - name: BEX_LOKI_URL # Loki (log-shipper DaemonSet) => durable log history
              value: http://loki.monitoring.svc:3100
            - name: BEX_API_CORS_ORIGIN # comma-separated origins for the dashboard's credentialed
              # cross-origin GraphQL calls; localhost:5173 lets a local dashboard
              # dev server (Vite) hit the deployed API — fine while dev-stage,
              # drop it when real tenants have sessions worth riding.
              value: https://dashboard.bex.co,http://localhost:5173
            # Authorization (docs/ADR012-auth.md#authorization): BEX_OPENFGA_URL is the
            # enforcement flip — every verb then requires a tenant permission, and
            # identities without tuples get 403. On since w1/m9: a human's first
            # login mints a workspace (tenant onboarding), and minted API keys get
            # their membership grant, so enforced authz no longer 403s every key.
            # Paired with BEX_CP_DB_URI below — the store that resolves callers to
            # their workspace; without it every tenant key would 403.
            - name: BEX_OPENFGA_URL
              value: http://openfga.auth.svc:8080
            - name: BEX_OPENFGA_TOKEN # OpenFGA preshared key
              valueFrom:
                secretKeyRef:
                  name: bex-openfga
                  key: token
                  optional: true
            # Tenant secrets (docs/ADR013-secrets.md): the env-vars API stores values in
            # OpenBao KV v2, reached cluster-internally. bex-api authenticates as
            # its own ServiceAccount via OpenBao's Kubernetes auth (role bex-api,
            # scripts/bao-k8s-auth.sh). Unset => the env-vars verbs 503; everything
            # else is unchanged.
            - name: BEX_OPENBAO_URL
              value: http://openbao.secrets.svc:8200
            # Control plane (source of truth, w1/m2): BEX_CP_DB_URI turns on the
            # Postgres store + the projector (apps rows -> App CRs) + the
            # cluster-internal tenant API on :8091 + tenant onboarding (w1/m9:
            # mint-on-first-login, key->tenant binding, workspace-scoped authz).
            # On since w1/m9 — flipped together with BEX_OPENFGA_URL above (the
            # store resolves callers to their workspace). The projector no-ops on
            # an empty DB, so it was safe to flip first.
            - name: BEX_CP_DB_URI
              valueFrom:
                secretKeyRef:
                  name: bex-db-app # CNPG-generated by the bex-db Cluster
                  key: uri
            - name: BEX_CP_APPS_NAMESPACE # namespace the projector writes App CRs into
              value: default
            # Cancel (w2/m10) computes a repo-backed App's in-flight build
            # Job's identity to delete it — must match manager.yaml's
            # BEX_BUILD_NAMESPACE so the Job's namespace resolves the same way.
            - name: BEX_BUILD_NAMESPACE
              value: bex-system
            # GitHub App integration (docs/ADR026-github-integration.md): private-repo
            # deploys + zero-config push-to-deploy. Created out-of-band by
            # scripts/github-app-secret.sh (reads .env). optional:true so bex-api
            # still starts on a cluster with no GitHub App configured — the
            # git-connect verbs then 503 (any BEX_GITHUB_APP_* empty).
            - name: BEX_GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: bex-github-app
                  key: app-id
                  optional: true
            - name: BEX_GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: bex-github-app
                  key: private-key
                  optional: true
            - name: BEX_GITHUB_APP_SLUG
              valueFrom:
                secretKeyRef:
                  name: bex-github-app
                  key: slug
                  optional: true
            # Second accepted webhook HMAC key (w2/m9) so app-signed pushes
            # redeploy hands-free. Empty => only BEX_WEBHOOK_SECRET is accepted.
            - name: BEX_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: bex-github-app
                  key: webhook-secret
                  optional: true
            # Invite mailer (docs/ADR012-auth.md §11, w4/m12): the same SMTP relay Kratos's
            # courier uses. ADDR/FROM are non-secret prod values (SendGrid); the
            # credentials ride the out-of-band bex-smtp Secret (scripts/auth-secrets.sh,
            # .env BEX_SMTP_USERNAME/PASSWORD). optional:true ⇒ absent Secret leaves
            # the mailer nil, so invites are recorded but not emailed (best-effort
            # delivery — an invite is accepted on the recipient's first login).
            # Local: run bex-api on the host with BEX_SMTP_ADDR=localhost:1025 pointed
            # at a port-forwarded Mailpit.
            - name: BEX_SMTP_ADDR
              value: smtp.sendgrid.net:587
            - name: BEX_SMTP_FROM
              value: bex <no-reply@bex.co>
            - name: BEX_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bex-smtp
                  key: username
                  optional: true
            - name: BEX_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bex-smtp
                  key: password
                  optional: true
            # Browser Web Shell (w2/m55, docs/ADR035-ssh.md § Browser Web Shell):
            # bex-api mints the short-lived exec ticket the isolated ssh-gateway
            # verifies, signed with the HMAC key BOTH processes share via the
            # bex-shell-ticket Secret (the gateway mounts the same Secret). bex-api
            # never gains pods/exec — it only authorizes (can_operate) and signs.
            # BEX_SHELL_WS_URL is the browser-reachable, Traefik-terminated gateway
            # WebSocket origin handed to the dashboard terminal. optional:true ⇒ an
            # absent Secret leaves the ticket verb 503 ("web shell transport not
            # configured"); native ssh is unaffected. The Secret is the activation
            # gate: install it (scripts/shell-ticket-secret.sh) only after the
            # ssh.bex.co /shell edge route + gateway are verified reachable.
            - name: BEX_SHELL_TICKET_SECRET
              valueFrom:
                secretKeyRef:
                  name: bex-shell-ticket
                  key: secret
                  optional: true
            - name: BEX_SHELL_WS_URL
              value: wss://ssh.bex.co/shell
          ports:
            - name: http
              containerPort: 8090
            # bex-api's tenant API (:8091) — only listens when BEX_CP_DB_URI is set.
            - name: internal
              containerPort: 8091
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
