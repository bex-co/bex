apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: system
  labels:
    app.kubernetes.io/name: bex-api
    app.kubernetes.io/component: control-plane-api
spec:
  replicas: 1
  # w1/m52: explicit surge-then-kill so a roll never kills an old pod before
  # its ready replacement exists (the 2026-07-18 06:54 incident had an old pod
  # deleted while its replacement was still FailedScheduling). With prod's
  # 2 replicas + required anti-affinity across 3 platform nodes, maxSurge: 1
  # always has a schedulable free node. minReadySeconds holds the handover
  # until a new pod has been Ready long enough to be trusted.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: bex-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bex-api
    spec:
      serviceAccountName: api
      # w1/m19 t003: platform pool
      nodeSelector:
        bex.co/pool: platform
      tolerations:
        - key: bex.co/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Same image as the operator; Argo's image override (controller=...)
          # rewrites this tag. The command selects the api binary.
          image: controller:latest
          # See manager.yaml: :latest is mutable, so the deploy workflow
          # rollout-restarts this Deployment and Always re-pulls the new image.
          imagePullPolicy: Always
          command: ["/api"]
          env:
            - name: BEX_API_ADDR
              value: ":8090"
            - name: BEX_API_PUBLIC_URL # public origin used in copy-ready deploy-hook URLs
              value: https://api.bex.co
            - name: BEX_SSH_HOST # Render-compatible serviceDetails.sshAddress host
              valueFrom:
                configMapKeyRef:
                  # Created only after DNS/TCP/22/host-fingerprint verification;
                  # absent means the API honestly omits sshAddress.
                  name: bex-ssh
                  key: host
                  optional: true
            - name: BEX_DASHBOARD_URL # trusted browser origin for callbacks, invites, and resource links
              value: https://dashboard.bex.co
            # Shared platform hosting suffix — must match the operator so
            # platformHost() derives "<slug>.onbex.co" and it drops out of the
            # Custom Domains list. bex-api does not crash-gate on the PSL.
            # Do not unset: the PSL gap is an accepted risk (`.pm/DO_NOT_DO.md`
            # #PSL), and an empty value here reports a null URL for every App.
            - name: BEX_BASE_DOMAIN
              value: onbex.co
            - name: BEX_REGION # explicit platform placement for Render resource metadata
              value: fsn1
            - name: BEX_API_NAMESPACE # Apps live in the default namespace
              value: default
            # Hosted agent sandboxes (pillar 5, ADR042/w3/m32): point bex-api at
            # the in-cluster OpenSandbox lifecycle server so `render ea sandbox`
            # (the /v1/sandboxes REST/GraphQL/MCP surface) works. Sandboxes run
            # under gVisor on the dedicated sandbox node pool. Unset => the
            # sandbox verbs 503.
            - name: BEX_OPENSANDBOX_URL
              value: http://opensandbox-server.opensandbox-system.svc:8077
            # ADR047 D1/D3: the separate `agent` sandbox template. deploy.yml
            # builds and publishes this image from lego/agent-image/.
            - name: BEX_AGENT_SESSION_IMAGE
              value: ghcr.io/bex-co/bex-agent-sandbox@sha256:a85dc8d4029ed937739e20b4814950c24f3413aaf22019918bd0674c244c0cd6
            # ADR062 / security round 10: mandatory credential-injecting model
            # proxy. Agent-session sandboxes receive only a session placeholder;
            # the reusable workspace key stays on the gateway→vendor hop.
            - name: BEX_AGENT_MODEL_PROXY_URL
              value: http://bex-ssh-gateway.bex-system.svc.cluster.local:8084
            # Auth (docs/ADR012-auth.md): OAuth2 API keys introspected at Hydra's
            # admin API; Kratos sessions for humans. No shared static token —
            # the bootstrap client is seeded by scripts/auth-bootstrap-client.sh.
            - name: BEX_HYDRA_ADMIN_URL # required; the binary refuses to start without it
              value: http://hydra-admin.auth.svc:4445
            - name: BEX_KRATOS_URL # optional; unset disables session auth
              value: http://kratos-public.auth.svc:80
            # Owner/member identity lookup (w6/m2 owners API): Kratos' admin
            # port, distinct from the public port above — resolving another
            # member's email/MFA needs the admin API, not a session. Optional;
            # unset omits those fields from the owners/members responses.
            - name: BEX_KRATOS_ADMIN_URL
              value: http://kratos-admin.auth.svc:80
            # OAuth 2.1 discovery for MCP/agent clients (w4/m9, docs/ADR012-auth.md):
            # issuer = Hydra's public URL; resource = this API's canonical URI.
            # Drives the RFC 9728 metadata endpoint, the 401 WWW-Authenticate
            # resource_metadata hint, and the token-audience check.
            - name: BEX_OAUTH_ISSUER
              value: https://oauth.bex.co
            - name: BEX_OAUTH_RESOURCE
              value: https://api.bex.co/mcp
            # codex F6: narrows the empty-audience exception to bex-provisioned
            # OAuth clients (the Hydra client-metadata marker
            # `bex.co/platform-client`, stamped by scripts/auth-bootstrap-client.sh).
            # Without it, a consented token from ANY self-registered client
            # authorizes the human's full workspace rights here — a cross-tenant
            # escalation.
            # ACTIVATED 2026-08-13 (w1/m68 t007, docs/ADR012-auth.md §7) after
            # verifying the LIVE Hydra records for the official Render CLI and
            # bex-mobile clients both carry the marker. Flipping back to "0"
            # reopens the audience-less-token escalation; only do so if the
            # platform clients lose the marker (their legitimately audience-less
            # device-flow logins would otherwise be refused).
            - name: BEX_OAUTH_REQUIRE_AUDIENCE
              value: "1"
            # Round-14 #1 (docs/ADR069-security-review-round14.md): the
            # control-plane capability scope — an API-audience HUMAN token
            # must carry it (identity-only scopes never are API authority).
            # Machine API-key tokens and bex-provisioned platform clients
            # (the marker the bootstrap script stamps) are exempt. Must equal
            # the dashboard's OAUTH_API_SCOPE; default "bex.api" on both
            # sides, spelled out here so the coupling is visible.
            - name: BEX_OAUTH_API_SCOPE
              value: bex.api
            - name: BEX_PROM_URL # Prometheus scraping Traefik => request metrics
              value: http://prometheus-server.monitoring.svc.cluster.local
            - name: BEX_LOKI_URL # Loki (log-shipper DaemonSet) => durable log history
              value: http://loki.monitoring.svc:3100
            - name: BEX_API_CORS_ORIGIN # comma-separated origins for the dashboard's credentialed
              # cross-origin GraphQL calls. Only the dashboard origin —
              # localhost:5173 was dropped (codex-security 2026-08 F10): the
              # supported "local dev against prod" workflow tunnels through
              # vite.config.ts's same-origin /graphql proxy (dashboard/.env.example
              # documents exactly this), so the loopback entry granted credentialed
              # cross-origin reads to whatever local process binds 5173 first
              # with nothing that needs it.
              value: https://dashboard.bex.co
            # Authorization (docs/ADR012-auth.md#authorization): BEX_OPENFGA_URL is the
            # enforcement flip — every verb then requires a tenant permission, and
            # identities without tuples get 403. On since w1/m9: a human's first
            # login mints a workspace (tenant onboarding), and minted API keys get
            # their membership grant, so enforced authz no longer 403s every key.
            # Paired with BEX_CP_DB_URI below — the store that resolves callers to
            # their workspace; without it every tenant key would 403.
            - name: BEX_OPENFGA_URL
              value: http://openfga.auth.svc:8080
            - name: BEX_OPENFGA_TOKEN # OpenFGA preshared key
              valueFrom:
                secretKeyRef:
                  name: bex-openfga
                  key: token
                  optional: true
            # Tenant secrets (docs/ADR013-secrets.md): the env-vars API stores values in
            # OpenBao KV v2, reached cluster-internally. bex-api authenticates as
            # its own ServiceAccount via OpenBao's Kubernetes auth (role bex-api,
            # scripts/bao-k8s-auth.sh). Unset => the env-vars verbs 503; everything
            # else is unchanged.
            - name: BEX_OPENBAO_URL
              value: http://openbao.secrets.svc:8200
            # Control plane (source of truth, w1/m2): BEX_CP_DB_URI turns on the
            # Postgres store + the projector (apps rows -> App CRs) + the
            # cluster-internal tenant API on :8091 + tenant onboarding (w1/m9:
            # mint-on-first-login, key->tenant binding, workspace-scoped authz).
            # On since w1/m9 — flipped together with BEX_OPENFGA_URL above (the
            # store resolves callers to their workspace). The projector no-ops on
            # an empty DB, so it was safe to flip first.
            - name: BEX_CP_DB_URI
              valueFrom:
                secretKeyRef:
                  name: bex-db-app # CNPG-generated by the bex-db Cluster
                  key: uri
            - name: BEX_CP_APPS_NAMESPACE # namespace the projector writes App CRs into
              value: default
            # Direct Stripe Billing (w7/m50, docs/ADR040-billing-metronome.md):
            # all values arrive together in the out-of-band bex-stripe Secret
            # installed by scripts/stripe-billing-secret.sh. Every reference is
            # optional so a cluster with no Secret remains byte-identical:
            # estimate-only usage, no Stripe client/network, and no public Stripe
            # webhook route. The installer requires an explicit epoch and a
            # restricted rk_test_/rk_live_ runtime key before it will create the
            # Secret; BEX_STRIPE_API_URL is intentionally never set in a cluster.
            - name: BEX_STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bex-stripe
                  key: BEX_STRIPE_SECRET_KEY
                  optional: true
            - name: BEX_STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: bex-stripe
                  key: BEX_STRIPE_PUBLISHABLE_KEY
                  optional: true
            # ADR046 paid-intent gate. Kept in the same optional out-of-band
            # bundle so enabling it cannot race the Stripe key it requires.
            - name: BEX_REQUIRE_PAYMENT_METHOD
              valueFrom:
                secretKeyRef:
                  name: bex-stripe
                  key: BEX_REQUIRE_PAYMENT_METHOD
                  optional: true
            - name: BEX_STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: bex-stripe
                  key: BEX_STRIPE_WEBHOOK_SECRET
                  optional: true
            - name: BEX_STRIPE_EPOCH
              valueFrom:
                secretKeyRef:
                  name: bex-stripe
                  key: BEX_STRIPE_EPOCH
                  optional: true
            - name: BEX_STRIPE_SEAL_HOURS
              valueFrom:
                secretKeyRef:
                  name: bex-stripe
                  key: BEX_STRIPE_SEAL_HOURS
                  optional: true
            - name: BEX_STRIPE_COMP_COUPON_ID
              valueFrom:
                secretKeyRef:
                  name: bex-stripe
                  key: BEX_STRIPE_COMP_COUPON_ID
                  optional: true
            - name: BEX_STRIPE_PORTAL_CONFIGURATION_ID
              valueFrom:
                secretKeyRef:
                  name: bex-stripe
                  key: BEX_STRIPE_PORTAL_CONFIGURATION_ID
                  optional: true
            - name: BEX_STRIPE_TAX_CODE
              valueFrom:
                secretKeyRef:
                  name: bex-stripe
                  key: BEX_STRIPE_TAX_CODE
                  optional: true
            - name: BEX_STRIPE_TAX_BEHAVIOR
              valueFrom:
                secretKeyRef:
                  name: bex-stripe
                  key: BEX_STRIPE_TAX_BEHAVIOR
                  optional: true
            # w7/m52: durable dunning is an explicit, test-mode-only opt-in.
            # The process refuses rk_live_* when enabled; omitting these keys
            # preserves payment onboarding without enforcement.
            - name: BEX_STRIPE_DUNNING_ENABLED
              valueFrom:
                secretKeyRef:
                  name: bex-stripe
                  key: BEX_STRIPE_DUNNING_ENABLED
                  optional: true
            - name: BEX_STRIPE_GRACE_PERIOD
              valueFrom:
                secretKeyRef:
                  name: bex-stripe
                  key: BEX_STRIPE_GRACE_PERIOD
                  optional: true
            - name: BEX_STRIPE_RECONCILE_INTERVAL
              valueFrom:
                secretKeyRef:
                  name: bex-stripe
                  key: BEX_STRIPE_RECONCILE_INTERVAL
                  optional: true
            # Native push (ADR048 D2): all values arrive atomically in the
            # out-of-band bex-push Secret. Every reference is optional, so a
            # cluster with no Secret constructs no transport and makes no Expo
            # network calls. The installer/runbook owns safe token rotation.
            - name: BEX_PUSH_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: bex-push
                  key: BEX_PUSH_PROVIDER
                  optional: true
            - name: BEX_EXPO_PUSH_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bex-push
                  key: BEX_EXPO_PUSH_ACCESS_TOKEN
                  optional: true
            # Browser web push (VAPID): all three values arrive atomically in
            # the out-of-band bex-webpush Secret. Every reference is optional,
            # so a cluster with no Secret constructs no transport. A partial
            # Secret fails bex-api startup rather than delivering unsigned
            # pushes. scripts/webpush-secret.sh owns mint/rotation.
            - name: BEX_WEBPUSH_VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: bex-webpush
                  key: BEX_WEBPUSH_VAPID_PUBLIC_KEY
                  optional: true
            - name: BEX_WEBPUSH_VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: bex-webpush
                  key: BEX_WEBPUSH_VAPID_PRIVATE_KEY
                  optional: true
            - name: BEX_WEBPUSH_SUBSCRIBER
              valueFrom:
                secretKeyRef:
                  name: bex-webpush
                  key: BEX_WEBPUSH_SUBSCRIBER
                  optional: true
            # REQUIRED once BEX_CP_DB_URI is set: the internal tenant API (:8091)
            # grants workspace-admin and cross-tenant writes, so bex-api refuses
            # to start with an empty BEX_CP_TOKEN (w1/m53 requireCPAuth — the token
            # was previously set nowhere, leaving the API open behind the
            # NetworkPolicy alone). Create the Secret out of band BEFORE deploying
            # this change (scripts/cp-token-secret.sh) or the pod crash-loops with
            # a clear fatal log. optional:true keeps the manifest applyable; the
            # in-process guard is the real fail-closed control.
            - name: BEX_CP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bex-control-plane
                  key: token
                  optional: true
            # Cancel (w2/m10) computes a repo-backed App's in-flight build
            # Job's identity to delete it — must match manager.yaml's
            # BEX_BUILD_NAMESPACE so the Job's namespace resolves the same way.
            - name: BEX_BUILD_NAMESPACE
              value: bex-build
            # GitHub App integration (docs/ADR026-github-integration.md): private-repo
            # deploys + zero-config push-to-deploy. Created out-of-band by
            # scripts/github-app-secret.sh (reads .env). optional:true so bex-api
            # still starts on a cluster with no GitHub App configured — the
            # git-connect verbs then 503 (any BEX_GITHUB_APP_* empty).
            - name: BEX_GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: bex-github-app
                  key: app-id
                  optional: true
            - name: BEX_GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: bex-github-app
                  key: private-key
                  optional: true
            - name: BEX_GITHUB_APP_SLUG
              valueFrom:
                secretKeyRef:
                  name: bex-github-app
                  key: slug
                  optional: true
            # Installation binding fails closed unless GitHub's user OAuth proof
            # is configured. Both values come from the same out-of-band Secret.
            - name: BEX_GITHUB_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: bex-github-app
                  key: client-id
                  optional: true
            - name: BEX_GITHUB_APP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bex-github-app
                  key: client-secret
                  optional: true
            # Second accepted webhook HMAC key (w2/m9) so app-signed pushes
            # redeploy hands-free. Empty => only BEX_WEBHOOK_SECRET is accepted.
            - name: BEX_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: bex-github-app
                  key: webhook-secret
                  optional: true
            # Invite mailer (docs/ADR012-auth.md §11, w4/m12): the same SMTP relay Kratos's
            # courier uses. ADDR/FROM are non-secret prod values (SendGrid); the
            # credentials ride the out-of-band bex-smtp Secret (scripts/auth-secrets.sh,
            # .env BEX_SMTP_USERNAME/PASSWORD). optional:true ⇒ absent Secret leaves
            # the mailer nil, so invites are recorded but not emailed (best-effort
            # delivery — an invite is accepted on the recipient's first login).
            # Local: run bex-api on the host with BEX_SMTP_ADDR=localhost:1025 pointed
            # at a port-forwarded Mailpit.
            - name: BEX_SMTP_ADDR
              value: smtp.sendgrid.net:587
            - name: BEX_SMTP_FROM
              value: bex <no-reply@bex.co>
            - name: BEX_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bex-smtp
                  key: username
                  optional: true
            - name: BEX_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bex-smtp
                  key: password
                  optional: true
            # Browser Web Shell (w2/m55, docs/ADR035-ssh.md § Browser Web Shell):
            # bex-api mints the short-lived exec ticket the isolated ssh-gateway
            # verifies, signed with the HMAC key BOTH processes share via the
            # bex-shell-ticket Secret (the gateway mounts the same Secret). bex-api
            # never gains pods/exec — it only authorizes (can_operate) and signs.
            # BEX_SHELL_WS_URL is the browser-reachable, Traefik-terminated gateway
            # WebSocket origin handed to the dashboard terminal. optional:true ⇒ an
            # absent Secret leaves the ticket verb 503 ("web shell transport not
            # configured"); native ssh is unaffected. The Secret is the activation
            # gate: install it (scripts/shell-ticket-secret.sh) only after the
            # ssh.bex.co /shell edge route + gateway are verified reachable.
            - name: BEX_SHELL_TICKET_SECRET
              valueFrom:
                secretKeyRef:
                  name: bex-shell-ticket
                  key: secret
                  optional: true
            - name: BEX_SHELL_WS_URL
              value: wss://ssh.bex.co/shell
            # Agent-session attach handoff (ADR047 D3 / w3/m39). The API mints
            # a distinct subject+session+sandbox-pod+workspace ticket with the
            # same HMAC key and shared-DB nonce design, then returns this origin;
            # the wave-2 gateway proxy consumes it. bex-api never connects to
            # the sandbox driver's network path.
            - name: BEX_AGENT_SESSION_GATEWAY_URL
              value: wss://ssh.bex.co/agent-sessions
            # `render ea sandbox exec` (w3/m33): bex-api authorizes can_operate and
            # signs a ticket, then reverse-proxies the SSE stream from the isolated
            # SSH gateway (which alone holds pods/exec, Option A). The secret must
            # match the gateway's BEX_SANDBOX_EXEC_SECRET; the URL is the gateway's
            # internal exec listener. optional ⇒ absent Secret leaves the exec verb
            # 503; create/list/stop are unaffected.
            - name: BEX_SANDBOX_EXEC_SECRET
              valueFrom:
                secretKeyRef:
                  name: bex-sandbox-exec
                  key: secret
                  optional: true
            - name: BEX_SANDBOX_EXEC_URL
              value: http://bex-ssh-gateway.bex-system.svc:8081/sandbox-exec
            # ADR059 D3 hibernation (w2/m77): all six coordinates arrive together
            # in the out-of-band bex-agent-snapshot Secret installed by
            # scripts/agent-snapshot-secret.sh. Every reference is optional so a
            # cluster with no Secret stays Terminate-only (byte-identical to
            # w2/m67). Partial keys fail bex-api startup rather than silently
            # disabling the tier. Rollback: delete the Secret (or leave it
            # absent) ⇒ reclaim reverts to Terminate. The bucket MUST be
            # dedicated and SSE-enabled — never bex-tfstate.
            # Retention (default 168h, dirty-git doubling) and pin quota
            # (default 10) stay the m68 defaults on purpose. The Secret can
            # land before this env is live; Argo applying this block is what
            # arms the process.
            # Disk-snapshot LISTING (ADR082 D5/D6). bex-api only ever LISTS:
            # it never writes, never decrypts, and never holds the age key —
            # which is why these come from a separate, READ-ONLY identity
            # (bex-disk-snapshot-read) rather than the operator's write
            # credential. Installed by scripts/disk-snapshot-secret.sh.
            #
            # Optional throughout: with no Secret, GET /v1/disks/{diskId}/
            # snapshots and the restore verb answer a coded
            # DISK_SNAPSHOTS_NOT_CONFIGURED 503 and the dashboard says so
            # plainly. Disks themselves are unaffected.
            #
            # The 24h snapshotKey is signed with BEX_SHELL_TICKET_SECRET — a
            # reference to an object, not its contents.
            - name: BEX_DISK_SNAPSHOT_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: bex-disk-snapshot-read
                  key: BEX_DISK_SNAPSHOT_ENDPOINT
                  optional: true
            - name: BEX_DISK_SNAPSHOT_BUCKET
              valueFrom:
                secretKeyRef:
                  name: bex-disk-snapshot-read
                  key: BEX_DISK_SNAPSHOT_BUCKET
                  optional: true
            - name: BEX_DISK_SNAPSHOT_REGION
              valueFrom:
                secretKeyRef:
                  name: bex-disk-snapshot-read
                  key: BEX_DISK_SNAPSHOT_REGION
                  optional: true
            - name: BEX_DISK_SNAPSHOT_PREFIX
              valueFrom:
                secretKeyRef:
                  name: bex-disk-snapshot-read
                  key: BEX_DISK_SNAPSHOT_PREFIX
                  optional: true
            - name: BEX_DISK_SNAPSHOT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: bex-disk-snapshot-read
                  key: BEX_DISK_SNAPSHOT_ACCESS_KEY
                  optional: true
            - name: BEX_DISK_SNAPSHOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bex-disk-snapshot-read
                  key: BEX_DISK_SNAPSHOT_SECRET_KEY
                  optional: true
            - name: BEX_AGENT_SNAPSHOT_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: bex-agent-snapshot
                  key: BEX_AGENT_SNAPSHOT_S3_ENDPOINT
                  optional: true
            - name: BEX_AGENT_SNAPSHOT_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: bex-agent-snapshot
                  key: BEX_AGENT_SNAPSHOT_S3_BUCKET
                  optional: true
            - name: BEX_AGENT_SNAPSHOT_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: bex-agent-snapshot
                  key: BEX_AGENT_SNAPSHOT_S3_REGION
                  optional: true
            - name: BEX_AGENT_SNAPSHOT_S3_PREFIX
              valueFrom:
                secretKeyRef:
                  name: bex-agent-snapshot
                  key: BEX_AGENT_SNAPSHOT_S3_PREFIX
                  optional: true
            - name: BEX_AGENT_SNAPSHOT_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: bex-agent-snapshot
                  key: BEX_AGENT_SNAPSHOT_S3_ACCESS_KEY
                  optional: true
            - name: BEX_AGENT_SNAPSHOT_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bex-agent-snapshot
                  key: BEX_AGENT_SNAPSHOT_S3_SECRET_KEY
                  optional: true
            # Login-time invite redemption requires a Kratos-VERIFIED email
            # (w1/040, closing w1/m53's V1 window: an attacker who registered
            # with a victim's not-yet-signed-up invited address could otherwise
            # claim their invite on first login). Safe to enforce now that the
            # dashboard's /auth/verification page completes the verification
            # loop (w4/008); the token link path is unaffected — its capability
            # is the unguessable token, not an email claim
            # (docs/ADR024-members.md § Email verification).
            - name: BEX_REQUIRE_VERIFIED_INVITE_EMAIL
              value: "1"
            # w1/m68 F3 (round-5): every IP-keyed budget in bex-api — the m67
            # pre-auth failure limiter above all — keys on the request's
            # immediate peer unless that peer is inside a trusted CIDR. Public
            # traffic arrives through Traefik, so with this UNSET (as it shipped
            # until m68) every external client collapsed onto one Traefik pod IP
            # and shared a single 60/min failure bucket: one anonymous client
            # could drain it and 429 every uncached login in the platform.
            #
            # The value is the cluster POD CIDR, because prod Traefik runs as
            # ordinary pods (hostNetwork: false — see
            # deploy/gitops/overlays/prod/values/traefik.values.yaml) and its
            # replicas' IPs are not stable enough to enumerate. Kept in lockstep
            # with clusterNetwork.pods.cidrBlocks in
            # infra/clusterapi/overlays/hetzner-caph/cluster.yaml by a
            # scripts/gitops-validate.sh check.
            #
            # ⚠️ This trusts X-Forwarded-For from ANY pod in that CIDR, so it
            # leans on the ADR043 default-deny east-west policy keeping tenant
            # workloads off bex-api: if that lockdown is ever relaxed, a tenant
            # pod reaching bex-api directly could spoof a client IP. Narrow this
            # to the Traefik pods before relaxing it.
            - name: BEX_TRUSTED_PROXY_CIDRS
              value: 10.244.0.0/16
          ports:
            - name: http
              containerPort: 8090
            # bex-api's tenant API (:8091) — only listens when BEX_CP_DB_URI is set.
            - name: internal
              containerPort: 8091
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          # w1/m52: readiness split off /healthz onto /readyz, which flips to
          # 503 on SIGTERM while the pod keeps serving through its in-process
          # drain window (internal/serve) — liveness must NOT flip with it or
          # the kubelet would restart a pod that is merely draining. Fast
          # cadence + failureThreshold 1: /readyz is deterministic (only 503s
          # when draining), so one failure means "stop routing here" and the
          # endpoint drops well inside the 15s drain window.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
