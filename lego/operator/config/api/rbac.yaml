# bex-api writes intent (App/Database CRs) and reads the App pods' logs + resource
# metrics — least privilege. The App/Database verbs are cluster-wide (tenant
# namespaces may be dynamic); the secrets/pods/pods-log/metrics grants are scoped
# to the apps namespace in deploy/gitops/base/bex-api-apps-rbac.yaml (w6/002), so
# a compromised bex-api pod can't read platform secrets (Kratos/Hydra/OpenBao/CNPG
# in auth/secrets/bex-system) or tail arbitrary pods — only the tenant apps
# namespace it actually serves (BEX_API_NAMESPACE, default "default").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: api-role
rules:
  # Render verbs patch Apps; the control-plane projector (w1/m2) also creates
  # and deletes them (projecting/pruning apps rows), so create + delete are here.
  - apiGroups: ["app.bex.co"]
    resources: ["apps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["app.bex.co"]
    resources: ["apps/status"]
    verbs: ["get"]
  - apiGroups: ["app.bex.co"]
    resources: ["databases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["app.bex.co"]
    resources: ["databases/status"]
    verbs: ["get"]
  # keyvalue service (bex-api/internal/keyvalue) creates, deletes, lists, and reads
  # KeyValue CRs exactly as the app and database services do for App/Database CRs.
  - apiGroups: ["app.bex.co"]
    resources: ["keyvalues"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["app.bex.co"]
    resources: ["keyvalues/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: api-role
subjects:
  - kind: ServiceAccount
    name: api
    namespace: system
---
# Cancel (w2/m10): best-effort delete a repo-backed App's in-flight build Job
# (bld-<name>-gen-<generation>, lego/operator/internal/build.JobName). Build
# Jobs run in BEX_BUILD_NAMESPACE (deployment.yaml sets it to bex-system, same
# as the operator's own manager.yaml) — namespaced here rather than folded
# into the cluster-wide app.bex.co ClusterRole above, and left in "system" so
# config/default's namespace transform rewrites it alongside the rest of this
# kustomization (unlike bex-api-apps-rbac.yaml, which deliberately escapes
# that transform to land in the apps namespace instead). No create/update —
# bex-api only ever tears a build Job down, never starts one.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-build-jobs
  namespace: system
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "delete"]
  # Live build following (w3/m14): select the App-labelled build pod and read
  # only its log subresource in BEX_BUILD_NAMESPACE.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["kpack.io"]
    resources: ["images"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-build-jobs
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-build-jobs
subjects:
  - kind: ServiceAccount
    name: api
    namespace: system
