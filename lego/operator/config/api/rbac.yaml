# bex-api touches Apps and Databases (the product resources), reads the
# CNPG-generated connection Secrets, reads App pods' logs, and reads pod resource
# usage from metrics-server — least privilege. It writes intent (App lifecycle
# fields, Database CRs); the operator does all the mechanism. Pod read + pods/log
# is where the list_logs verb (REST/GraphQL/MCP) tails an App's instance logs;
# metrics.k8s.io/pods backs the resource-metrics verb (cpu/memory).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: api-role
rules:
  # Render verbs patch Apps; the control-plane projector (w1/m2) also creates
  # and deletes them (projecting/pruning apps rows), so create + delete are here.
  - apiGroups: ["app.bex.co"]
    resources: ["apps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["app.bex.co"]
    resources: ["apps/status"]
    verbs: ["get"]
  - apiGroups: ["app.bex.co"]
    resources: ["databases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["app.bex.co"]
    resources: ["databases/status"]
    verbs: ["get"]
  # read the CNPG-generated "<db>-app" Secret to assemble connection strings;
  # create/update the per-app "<app>-env" Secret the env-vars API materializes
  # from OpenBao (docs/secrets.md) so the Deployment can consume it via envFrom.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  # Read-only pod access for the logs + metrics verbs: list pods by App label,
  # read logs, and read pod resource limits for percentage-mode metrics.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Resource metrics (cpu/memory) read metrics-server's aggregated API.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: api-role
subjects:
  - kind: ServiceAccount
    name: api
    namespace: system
