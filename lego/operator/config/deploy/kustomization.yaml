apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Disposable local/build overlay. Make copies this file beside config/default,
# sets controller and both SNI proxy placeholders to IMG in the copy, builds
# it, then removes the copy. Keeping the image transform above default updates
# every binary in the shared image without rewriting the checked-in default
# kustomization. Production pins the SNI proxies separately (w6/m470,
# deploy/gitops/base/bex.yaml); a local deploy runs them on IMG like the rest.
resources:
  - ../default

images:
  - name: controller
    newName: bex-operator
    newTag: dev
  - name: kv-sni-proxy
    newName: bex-operator
    newTag: dev
  - name: pg-sni-proxy
    newName: bex-operator
    newTag: dev

# The local CAPD cluster runs Kubernetes v1.36, where ImageVolume is GA, so the
# operator mounts its health-probe helper from an image volume of its own image
# instead of the bex-health-probe-install init container (w6/m624). Production
# turns it on in config/prod once its API servers and App kubelets carry the
# gate (infra/clusterapi/overlays/hetzner-caph/cluster.yaml).
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: controller-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_HEALTH_PROBE_IMAGE_VOLUME
          value: "true"
