# The platform-host fallback route's HTTPS redirect (w8/320). Render redirects
# a host it routes nowhere from http to https before answering its 404, as
# every App route here does through its own middleware (httpsRedirectSpec,
# w8/m118), with the same codes: 301 for GET and HEAD, 307 for every other
# method (w8/357). Traefik's redirectScheme cannot send those, so the edge
# plugin's redirect instance does (deploy/gitops/charts/traefik-plugins). A
# request already on https passes through, and its answer, the activator's
# 404, reads cf-cache-status DYNAMIC with no rndr-id, as Render's
# no-such-service answer does (platformFallback, w4/m703); a plugin from
# before that field ignores it and still redirects. A static manifest, so the
# operator's BEX_HTTPS_REDIRECT switch does not govern it. Synced a wave ahead
# of the Ingress that names it, because Traefik disables a router whose
# middleware is missing.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: platform-host-fallback-https
  namespace: bex-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  plugin:
    bexClientIPHeaders:
      httpsRedirect: true
      platformFallback: true
