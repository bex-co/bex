apiVersion: apps/v1
kind: Deployment
metadata:
  name: activator
  namespace: bex-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.bex.co/component: activator
  template:
    metadata:
      labels:
        app.bex.co/component: activator
    spec:
      serviceAccountName: activator
      # w1/m19 t003: platform pool
      nodeSelector:
        bex.co/pool: platform
      tolerations:
        - key: bex.co/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: activator
          image: controller:latest  # overridden by kustomize; same image as the manager, different entrypoint
          command: ["/activator"]
          ports:
            - containerPort: 8888
          env:
            - name: BEX_ACTIVATOR_ADDR
              value: ":8888"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8888
            initialDelaySeconds: 2
            periodSeconds: 5
