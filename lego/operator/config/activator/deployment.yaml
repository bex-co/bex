apiVersion: apps/v1
kind: Deployment
metadata:
  name: activator
  namespace: bex-system
spec:
  # Two replicas behind a PodDisruptionBudget so a node drain, a roll or one
  # crash never takes this platform-wide path down (w3/m175).
  replicas: 2
  selector:
    matchLabels:
      app.bex.co/component: activator
  template:
    metadata:
      labels:
        app.bex.co/component: activator
    spec:
      serviceAccountName: activator
      # Preferred, not required: on three platform nodes a required rule
      # strands the rollout surge pod (the w2/029 bex-api lesson).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.bex.co/component: activator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # w1/m19 t003: platform pool
      nodeSelector:
        bex.co/pool: platform
      tolerations:
        - key: bex.co/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: activator
          image: controller:latest  # overridden by kustomize; same image as the manager, different entrypoint
          command: ["/activator"]
          ports:
            - containerPort: 8888
          env:
            - name: BEX_ACTIVATOR_ADDR
              value: ":8888"
            # Shared platform hosting suffix — must match the operator/bex-api.
            # The activator names a new service's platform host from its spec,
            # so the host answers the first-deploy response before the operator
            # has written any status (w4/m235).
            - name: BEX_BASE_DOMAIN
              value: onbex.co
          # TCP, not an HTTP path: every path on this listener belongs to a
          # tenant host (w4/m162), so a platform /healthz would shadow theirs.
          readinessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
