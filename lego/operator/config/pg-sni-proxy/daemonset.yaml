apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pg-sni-proxy
  namespace: system
spec:
  selector:
    matchLabels:
      app.bex.co/component: pg-sni-proxy
  template:
    metadata:
      labels:
        app.bex.co/component: pg-sni-proxy
    spec:
      serviceAccountName: pg-sni-proxy
      # Platform-pod hardening parity (w7/m58): runAsNonRoot + seccompProfile
      # match kv-sni-proxy and the other platform pods. hostPort binding is
      # kubelet-side and does not need the container to run as root, so the proxy
      # runs as the non-root uid 65532 (below), same as kv-sni-proxy.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Run on platform nodes alongside Traefik so the proxy binds :5432 on the
      # same host that Traefik exposes :80/:443 (docs/ADR009-postgresql-management.md).
      nodeSelector:
        bex.co/pool: platform
      tolerations:
        - key: bex.co/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: pg-sni-proxy
          image: controller:latest  # overridden by kustomize; same image as the manager
          command: ["/pg-sni-proxy"]
          ports:
            - containerPort: 5432
              hostPort: 5432  # bind the node's :5432 directly (dev hostNetwork edge)
              protocol: TCP
            - name: metrics
              containerPort: 9092
              protocol: TCP
          env:
            - name: BEX_PROXY_ADDR
              value: ":5432"
            # Must match the operator manager's BEX_DB_DOMAIN (manager.yaml).
            - name: BEX_DB_DOMAIN
              value: db.bex.co
            - name: BEX_PROXY_METRICS_ADDR
              value: ":9092"
            # The Terraform-owned Hetzner LB has this fixed private address.
            # Only it may assert the original public client via PROXY protocol.
            - name: BEX_PROXY_PROTOCOL_TRUSTED_CIDRS
              value: "10.10.0.7/32"
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 96Mi }
