apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pg-sni-proxy
  namespace: system
spec:
  selector:
    matchLabels:
      app.bex.co/component: pg-sni-proxy
  # A roll starts each node's new pod and waits for it to be Ready before the
  # old one gets SIGTERM, so the node keeps a local endpoint for the edge LB's
  # Local NodePort throughout (w6/m515). The pods ask for no hostPort, which
  # would keep the new pod off the node until the old one had gone.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.bex.co/component: pg-sni-proxy
    spec:
      serviceAccountName: pg-sni-proxy
      # Platform-pod hardening parity (w7/m58): runAsNonRoot + seccompProfile
      # match kv-sni-proxy and the other platform pods. The proxy runs as the
      # non-root uid 65532 (below), same as kv-sni-proxy.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Run on platform nodes alongside Traefik. Production's edge LB reaches
      # the proxy through the Local NodePort bex-pg-sni-proxy-public
      # (config/prod, docs/ADR009-postgresql-management.md).
      nodeSelector:
        bex.co/pool: platform
      # Covers the preStop pause, the drain below, the wait for a scrape of the
      # last streams' bytes (sniproxy.FinalScrapeWait, w6/151) and a SIGKILL
      # margin (5 + 3600 + 35 + 5). Kubernetes evicts no DaemonSet pod in a node
      # drain, so no node drain waits for it.
      terminationGracePeriodSeconds: 3645
      tolerations:
        - key: bex.co/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: pg-sni-proxy
          # The operator image under its own kustomize pin (w6/m470): deploy.yml
          # keeps that pin while /pg-sni-proxy is byte-identical in a new
          # operator image, so a deploy that leaves this code alone closes no
          # connection. Never map it to `controller` in config/default.
          image: pg-sni-proxy:latest
          command: ["/pg-sni-proxy"]
          lifecycle:
            # A terminating pod's endpoint takes a moment to leave every node's
            # service rules, so the old pod keeps accepting for 5 s before
            # SIGTERM starts its drain, and a client routed to it meanwhile is
            # served rather than refused (w6/m515).
            preStop:
              sleep:
                seconds: 5
          ports:
            - containerPort: 5432
              protocol: TCP
            - name: metrics
              containerPort: 9092
              protocol: TCP
          env:
            - name: BEX_PROXY_ADDR
              value: ":5432"
            # Must match the operator manager's BEX_DB_DOMAIN (manager.yaml).
            - name: BEX_DB_DOMAIN
              value: db.bex.co
            - name: BEX_PROXY_METRICS_ADDR
              value: ":9092"
            # The Terraform-owned Hetzner LB has this fixed private address.
            # Only it may assert the original public client via PROXY protocol.
            - name: BEX_PROXY_PROTOCOL_TRUSTED_CIDRS
              value: "10.10.0.7/32"
            # The GC ramps before the 512Mi limit below; what the heap cannot
            # free is the connections themselves (w6/m457).
            - name: GOMEMLIMIT
              value: 400MiB
            # The old pod stops accepting on SIGTERM and relays its open streams
            # for up to this many seconds (w6/m515), so a command in flight
            # gets its reply and a session that ends within the hour is never
            # cut by a roll. Whatever is still open then closes. The bound is
            # an hour and never above it: the edge LB closes a stream that
            # carries no data for an hour anyway (w6/149), and one that never
            # ends is closed once whatever the bound (w6/m518). Neither the
            # deploy's wait (operator-pins.sh) nor bex-operator's Argo health
            # waits for a draining pod.
            - name: BEX_PROXY_DRAIN_SECONDS
              value: "3600"
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            # The process admits 4,096 connections (BEX_*PROXY_MAX_CONNS, its
            # share of the edge LB's 10,000). 4,096 idle routed connections
            # measured 412 MB in the container's cgroup (374 MB anonymous,
            # 36 MB kernel), about 95 KB each (w6/m457, linux/arm64).
            limits: { cpu: 100m, memory: 512Mi }
