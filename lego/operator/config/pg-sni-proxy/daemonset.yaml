apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pg-sni-proxy
  namespace: system
spec:
  selector:
    matchLabels:
      app.bex.co/component: pg-sni-proxy
  template:
    metadata:
      labels:
        app.bex.co/component: pg-sni-proxy
    spec:
      serviceAccountName: pg-sni-proxy
      # Run on platform nodes alongside Traefik so the proxy binds :5432 on the
      # same host that Traefik exposes :80/:443 (docs/ADR009-postgresql-management.md).
      nodeSelector:
        bex.co/pool: platform
      tolerations:
        - key: bex.co/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: pg-sni-proxy
          image: controller:latest  # overridden by kustomize; same image as the manager
          command: ["/pg-sni-proxy"]
          ports:
            - containerPort: 5432
              hostPort: 5432  # bind the node's :5432 directly (dev hostNetwork edge)
              protocol: TCP
          env:
            - name: BEX_PROXY_ADDR
              value: ":5432"
            # Must match the operator manager's BEX_DB_DOMAIN (manager.yaml).
            - name: BEX_DB_DOMAIN
              value: db.bex.co
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]  # required to bind privileged port :5432
            readOnlyRootFilesystem: true
