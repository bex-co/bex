apiVersion: apps/v1
kind: Deployment
metadata:
  name: bex-drain-guard
  namespace: bex-system
spec:
  # One replica: CAPI waits on the hook, so a restarting guard only delays a
  # drain, and two replicas would need leader election for no gain.
  replicas: 1
  selector:
    matchLabels:
      app.bex.co/component: drain-guard
  template:
    metadata:
      labels:
        app.bex.co/component: drain-guard
    spec:
      serviceAccountName: bex-drain-guard
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Platform pool: never on a node it may be asked to drain.
      nodeSelector:
        bex.co/pool: platform
      tolerations:
        - key: bex.co/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: drain-guard
          image: controller:latest  # overridden by kustomize; same image as the manager, different entrypoint
          command: ["/drain-guard"]
          args:
            - --machine-namespace=bex-capi
            # The serving pool. The build pools (bex-tenant-burst, bex-tenant-lg)
            # carry the build-only taint, so no App runs there to hand over.
            - --machine-selector=nodepool=bex-tenant-0
          ports:
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
