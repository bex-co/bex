apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kv-sni-proxy
  namespace: system
spec:
  selector:
    matchLabels:
      app.bex.co/component: kv-sni-proxy
  # A roll starts each node's new pod and waits for it to be Ready before the
  # old one gets SIGTERM, so the node keeps a local endpoint for the edge LB's
  # Local NodePort throughout (w6/m515). The pods ask for no hostPort, which
  # would keep the new pod off the node until the old one had gone.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.bex.co/component: kv-sni-proxy
    spec:
      serviceAccountName: kv-sni-proxy
      # Platform-pod hardening parity (w7/m58): the pod already runs as non-root
      # uid 65532 (container securityContext below); add the pod-level
      # seccompProfile so it carries the full baseline like every other platform
      # pod (runAsNonRoot is also restated at the pod level for the CI guard).
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        bex.co/pool: platform
      # Covers the preStop pause, the drain below and a SIGKILL margin.
      terminationGracePeriodSeconds: 40
      tolerations:
        - key: bex.co/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: kv-sni-proxy
          # The operator image under its own kustomize pin (w6/m470): deploy.yml
          # keeps that pin while /kv-sni-proxy is byte-identical in a new
          # operator image, so a deploy that leaves this code alone closes no
          # connection. Never map it to `controller` in config/default.
          image: kv-sni-proxy:latest
          command: ["/kv-sni-proxy"]
          lifecycle:
            # A terminating pod's endpoint takes a moment to leave every node's
            # service rules, so the old pod keeps accepting for 5 s before
            # SIGTERM starts its drain, and a client routed to it meanwhile is
            # served rather than refused (w6/m515).
            preStop:
              sleep:
                seconds: 5
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
            - name: metrics
              containerPort: 9093
              protocol: TCP
          env:
            - name: BEX_KV_PROXY_ADDR
              value: ":6379"
            - name: BEX_KV_PROXY_METRICS_ADDR
              value: ":9093"
            - name: BEX_KV_DOMAIN
              value: kv.bex.co
            # Keep in sync with infra/terraform's traefik_private_ip. Direct
            # NodePort clients cannot forge an allowlisted PROXY source.
            - name: BEX_PROXY_PROTOCOL_TRUSTED_CIDRS
              value: "10.10.0.7/32"
            # The GC ramps before the 512Mi limit below; what the heap cannot
            # free is the connections themselves (w6/m457).
            - name: GOMEMLIMIT
              value: 400MiB
            # The old pod stops accepting on SIGTERM and relays its open streams
            # for up to this many seconds, so a command in flight at a roll gets
            # its reply (w6/m515). Whatever is still open then closes.
            - name: BEX_KV_PROXY_DRAIN_SECONDS
              value: "30"
          readinessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            # The process admits 4,096 connections (BEX_*PROXY_MAX_CONNS, its
            # share of the edge LB's 10,000). 4,096 idle routed connections
            # measured 412 MB in the container's cgroup (374 MB anonymous,
            # 36 MB kernel), about 95 KB each (w6/m457, linux/arm64).
            limits: { cpu: 100m, memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
