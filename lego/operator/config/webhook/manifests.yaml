---
# Service that exposes the operator's webhook server (port 9443) so the
# Kubernetes API server can reach it for admission reviews.
apiVersion: v1
kind: Service
metadata:
  name: webhook-service
  namespace: system
spec:
  ports:
    - port: 443
      targetPort: 9443
      protocol: TCP
  selector:
    control-plane: controller-manager
---
# ValidatingWebhookConfiguration that intercepts only Pods explicitly labeled
# for tenant-image verification by the operator. The label is absent when
# signing is disabled, so disabled mode never calls the webhook. When enabled,
# failurePolicy Fail makes verifier/certificate/service outages deny admission.
#
# The caBundle field is injected by cert-manager's CA injector once
# config/certmanager/ resources are deployed. See config/default/kustomization.yaml
# for the replacement rule that sets cert-manager.io/inject-ca-from.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: system/serving-cert
# webhooks is a TOP-LEVEL field on ValidatingWebhookConfiguration (like
# ClusterRole/ClusterRoleBinding, this kind has no .spec) — nesting it under
# spec: is rejected by the real apiserver's OpenAPI schema (server-side
# apply: ".spec: field not declared in schema"), which is why ArgoCD could
# never actually sync this resource.
webhooks:
  - name: vpod.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    objectSelector:
      matchLabels:
        app.bex.co/verify-image: enabled
    timeoutSeconds: 10
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: Namespaced
    clientConfig:
      service:
        namespace: system
        name: webhook-service
        path: /validate-v1-pod
        port: 443
