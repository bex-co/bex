# bex-s3 has no Kubernetes API access: it reads Postgres, OpenFGA, Kratos' admin
# API and OpenBao over the network. Its own ServiceAccount with no Role or binding
# keeps it that way. The token is mounted because OpenBao's Kubernetes auth logs
# the pod in with it: scripts/bao-k8s-auth.sh binds this ServiceAccount to the
# bex-api role (docs/ADR112-object-storage.md D3, docs/ADR013-secrets.md §5).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3gw
  namespace: bex-system
