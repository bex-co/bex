apiVersion: v1
kind: Service
metadata:
  name: s3gw
  namespace: bex-system
spec:
  selector:
    app.bex.co/component: s3gw
  ports:
    # S3 traffic, reached only through Traefik (ingressroute.yaml in
    # config/api: the objects.<base domain> host).
    - name: http
      port: 8080
      targetPort: 8080
    # Internal: /healthz, /readyz and the Prometheus /metrics scrape.
    - name: metrics
      port: 9090
      targetPort: 9090
