# bex-s3: the S3-compatible API (docs/ADR112-object-storage.md D3, w21/m498).
# The bex-api image started with its /s3gw entrypoint, so the S3 surface has the
# core service, Postgres, OpenFGA, OpenBao and the read-write Wasabi pair, and
# mounts no REST, GraphQL, MCP or OAuth route. A stream of up to 5 GiB for up to
# 30 minutes does not belong on the pods that serve REST (bex-api's limit is
# 512Mi, and a comment in config/api/deployment.yaml records both replicas
# OOM-killed together once), and a rollout must not cut an upload in flight.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3gw
  namespace: bex-system
  labels:
    app.kubernetes.io/name: bex-s3
spec:
  replicas: 2
  # A replica is replaced only after its successor is Ready, so a roll never
  # leaves fewer than two; the old pod then finishes its streams (grace period).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.bex.co/component: s3gw
  template:
    metadata:
      labels:
        app.bex.co/component: s3gw
        # The label the network policies admit to OpenFGA and Kratos' admin API
        # (deploy/gitops/base/network-policies.yaml).
        app.kubernetes.io/name: bex-s3
    spec:
      serviceAccountName: s3gw
      # Longer than the 30-minute stream deadline plus the drain window and the
      # shutdown margin (cmd/s3gw/main.go: 1,800 + 10 + 60): on SIGTERM the pod
      # stops taking new requests and lets its streams finish. A rollout or a
      # node drain waits for them up to this.
      terminationGracePeriodSeconds: 2100
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.bex.co/component: s3gw
      # Platform-pod hardening parity (w7/m58): bex-system is privileged-PSS, so
      # this context is the only control on an internet-facing server that fronts
      # tenant bytes. It writes no files.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        bex.co/pool: platform
      tolerations:
        - key: bex.co/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: s3gw
          image: controller:latest # overridden by kustomize; same image as the manager, different entrypoint
          command: ["/s3gw"]
          # Sized from the production walk of 2026-11-19 (w21/m500 t001,
          # ADR112 § Not verified): memory is flat in the number and length of
          # streams (16 concurrent 256 MiB puts, 40 slow ones and a real
          # 5 GiB put peaked at 33 MiB against 16 to 19 MiB idle), so 768Mi is
          # headroom for the 64-stream replica cap and a Go runtime spike, not a
          # need; CPU is the figure that scales, about 25 millicores for each
          # MiB/s of aws-cli's default CRC64NVME-trailered upload (408m at the
          # 16 MiB/s pace of one workspace), so one replica's limit of 1 CPU
          # holds about 40 MiB/s before it throttles, and a request of 250m
          # covers one workspace at full pace. GOMEMLIMIT ramps the GC before
          # the cgroup OOM killer fires.
          resources:
            requests:
              cpu: 250m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          env:
            - name: GOMEMLIMIT
              value: 600MiB
            # Never fall back to a node or cloud metadata credential if the
            # Wasabi Secret is absent or malformed.
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            # The control plane's database, OpenFGA and Kratos' admin API: what
            # an S3 request is authorized with, as bex-api does.
            - name: BEX_CP_DB_URI
              valueFrom:
                secretKeyRef:
                  name: bex-db-app # CNPG-generated by the bex-db Cluster
                  key: uri
                  optional: true
            - name: BEX_OPENFGA_URL
              value: http://openfga.auth.svc:8080
            - name: BEX_OPENFGA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bex-openfga
                  key: token
                  optional: true
            # An access key's secret is in OpenBao, reached cluster-internally
            # as this pod's ServiceAccount (docs/ADR013-secrets.md §5).
            - name: BEX_OPENBAO_URL
              value: http://openbao-active.secrets.svc:8200
            - name: BEX_KRATOS_ADMIN_URL
              value: http://kratos-admin.auth.svc:80
            # The Traefik pods whose forwarding headers name the real client, as
            # bex-api trusts them: the failed-authentication budget is kept per
            # client address, and without this it is one shared budget for the
            # edge (docs/ADR112-object-storage.md D3).
            - name: BEX_TRUSTED_PROXY_CIDRS
              value: 10.244.0.0/16
          # The out-of-band bex-object-storage Secret installed by
          # scripts/object-storage-s3-credentials.sh: the read-write Wasabi pair
          # (BEX_OBJECT_STORAGE_ACCESS_KEY / _SECRET_KEY, the same Secret bex-api
          # reads). Optional: without it the surface starts degraded, answers
          # 503 and stays Ready, so a local cluster does not crash-loop.
          envFrom:
            - secretRef:
                name: bex-object-storage
                optional: true
          # /healthz and /readyz are on the 9090 listener, not on :8080, where
          # every path belongs to a bucket. Readiness flips to 503 on SIGTERM and
          # the pod keeps serving through the drain window.
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 20
