apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-server
  namespace: bex-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.bex.co/component: static-server
  template:
    metadata:
      labels:
        app.bex.co/component: static-server
    spec:
      serviceAccountName: static-server
      # Platform-pod hardening parity (w7/m58): bex-system is deliberately
      # privileged-PSS (egress-meter needs BPF caps), so there is no namespace
      # PodSecurity backstop — this per-pod context is the only control on the
      # internet-facing static-server. Matches bex-api / ssh-gateway / manager /
      # activator. The static-server writes no temp files, so readOnlyRootFilesystem
      # needs no writable emptyDir.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # w1/m19 t003: platform pool (same placement as the activator/operator).
      nodeSelector:
        bex.co/pool: platform
      tolerations:
        - key: bex.co/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: static-server
          image: controller:latest # overridden by kustomize; same image as the manager, different entrypoint
          command: ["/staticserver"]
          # Memory budgets the server self-enforces (staticserver.go): 256 MiB
          # default object cache + 512 MiB live-body lease budget + 1 GiB
          # worst-case fetch-gate in-flight reservation (32 fetches x 32 MiB)
          # ~= 1.75 GiB; the limit leaves headroom for the process itself.
          resources:
            requests:
              cpu: 10m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          env:
            - name: BEX_STATIC_ADDR
              value: ":8080"
            # Shared platform hosting suffix — must match the operator/bex-api so
            # a static_site's platform host "<slug>.onbex.co" resolves.
            - name: BEX_BASE_DOMAIN
              value: onbex.co
            # Never fall back to a node/cloud metadata credential if the
            # namespace-local reader Secret is malformed.
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          # Object-store config (endpoint/bucket/region) comes from an optional
          # ConfigMap; the S3 credentials come from a dedicated,
          # bucket-scoped read-only identity. Endpoint/bucket may stay optional
          # for an intentionally disabled deployment, but once configured the
          # credential Secret is required and startup verifies ListBucket access.
          # Publishing uses a different Secret and identity in bex-build.
          # The bex-static-config ConfigMap is git-owned in config/prod
          # (config/prod/static-config.yaml, w1/m57) — prod-only so local stays
          # degraded-503-but-Ready without a Wasabi read credential. It is
          # `optional: true` precisely so config/default (local) renders without
          # it; do not require it here.
          envFrom:
            - configMapRef:
                name: bex-static-config
                optional: true
            - secretRef:
                name: bex-static-read-s3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
