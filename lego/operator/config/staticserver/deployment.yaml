apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-server
  namespace: bex-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.bex.co/component: static-server
  template:
    metadata:
      labels:
        app.bex.co/component: static-server
    spec:
      serviceAccountName: static-server
      # w1/m19 t003: platform pool (same placement as the activator/operator).
      nodeSelector:
        bex.co/pool: platform
      tolerations:
        - key: bex.co/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: static-server
          image: controller:latest # overridden by kustomize; same image as the manager, different entrypoint
          command: ["/staticserver"]
          ports:
            - containerPort: 8080
          env:
            - name: BEX_STATIC_ADDR
              value: ":8080"
            # Never fall back to a node/cloud metadata credential if the
            # namespace-local reader Secret is malformed.
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          # Object-store config (endpoint/bucket/region + base domain) comes from
          # an optional ConfigMap; the S3 credentials come from a dedicated,
          # bucket-scoped read-only identity. Endpoint/bucket may stay optional
          # for an intentionally disabled deployment, but once configured the
          # credential Secret is required and startup verifies ListBucket access.
          # Publishing uses a different Secret and identity in bex-build.
          envFrom:
            - configMapRef:
                name: bex-static-config
                optional: true
            - secretRef:
                name: bex-static-read-s3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
