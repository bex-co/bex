apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/managed-by: kustomize
    # Node-local platform agents (egress meter / SNI proxies) require host
    # capabilities, so this platform namespace remains privileged. Tenant-
    # controlled execution is isolated in the separate bex-build namespace.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: control-plane
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: control-plane
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      # w1/m19 t003: platform pool
      nodeSelector:
        bex.co/pool: platform
      tolerations:
        - key: bex.co/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          # The build-plane SLIs (docs/ADR060 D5) are emitted on the manager's
          # controller-runtime registry, and controller-runtime disables that
          # endpoint by default ("0") — so until w7/m83 every bex_build_* series
          # existed only inside the process, and the alerts built on them could
          # never fire. Plain HTTP on the pod network, matching every sibling
          # component here (bex-api :8091, ssh-gateway :9090, egress-meter :9091):
          # bex-system's deny-tenant-ingress admits only bex-system, traefik and
          # monitoring, and no tenant pod can reach it. :8080 is kubebuilder's own
          # documented HTTP metrics port and is free in this pod (:8081 health,
          # :9443 webhook).
          - --metrics-bind-address=:8080
          - --metrics-secure=false
        image: controller:latest
        # The Argo override pins the mutable :latest tag, so a running pod must
        # re-pull to pick up a new push; the deploy workflow rollout-restarts this
        # Deployment, and Always makes that restart fetch the fresh image.
        imagePullPolicy: Always
        name: manager
        env:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          # The operator reads its own Pod to learn which image it is running
          # (internal/selfimage): the Key Value backup CronJob's encrypt stage
          # runs /backup-encrypt out of that same image, and only kustomize —
          # not any constant in the source — knows the digest deploy.yml pushed.
          # Dropping this makes ENCRYPTED Key Value backups fail closed.
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: BEX_RUNTIME
            value: kubernetes
          # In-cluster OCI registry (Zot). Build-from-git Jobs push here and app
          # nodes pull from here — no host docker daemon (w1/m5). Zot runs in the
          # bex-registry namespace on http:5000 (local/dev); front with TLS on prod.
          - name: BEX_REGISTRY
            value: zot.bex-registry.svc:5000
          # kpack's upstream registry client recognizes *.local as a plain-HTTP
          # development registry. deploy/gitops/charts/kpack provides zot.local
          # as a DNS alias of the SAME Zot Service; external/TLS registries leave
          # this unset and kpack uses BEX_REGISTRY directly.
          - name: BEX_KPACK_REGISTRY
            value: zot.local:5000
          # The kpack ClusterStore imports this complete Paketo builder image;
          # keep the value aligned with deploy/gitops/charts/kpack/platform.yaml.
          - name: BEX_CNB_BUILDER
            value: paketobuildpacks/builder-jammy-base@sha256:5799343cd316c1a03fa3ff7ab0915d9e6d134e95df4583016d70c6f5330d3898
          # Registry auth (w7/m8, docs/ADR022-tenant-isolation.md § Registry access
          # control): Zot denies anonymous catalog/pull/push. The build Job mounts
          # this build-namespace Secret to authenticate its push. Per-App pull
          # credentials below authenticate tenant workloads; the distinct static-site
          # build pull credential defaults from this setting.
          - name: BEX_REGISTRY_PUSH_SECRET
            value: bex-registry-push
          # Per-App pull credentials (w7/m36, docs/ADR022-tenant-isolation.md
          # § Per-App pull credentials): the operator manages the Zot config
          # (zot-config Secret) + htpasswd entries + per-App reg-pull-<name>
          # Secrets in this namespace.
          # The Zot chart (deploy/gitops/base/zot.yaml) mounts zot-config with
          # mountConfig=false and depends on the operator minting it — leaving
          # this unset strands the Zot pod on a missing-Secret mount.
          - name: BEX_REGISTRY_NS
            value: bex-registry
          # Namespace containing tenant App/Database/KeyValue CRs and their
          # credentials Secrets. The manager caches Secrets only in this namespace
          # so its namespace Role is sufficient; keep aligned with bex-api's
          # BEX_API_NAMESPACE / BEX_CP_APPS_NAMESPACE.
          - name: BEX_APPS_NAMESPACE
            value: default
          # Dedicated namespace for every tenant-controlled build, publish, and
          # pre-deploy execution workload.
          - name: BEX_BUILD_NAMESPACE
            value: bex-build
          # Build-plane concurrency baseline, checked in rather than ambient
          # (docs/ADR060 D7). All three are set explicitly here so the ADR034
          # baseline is auditable in git instead of living in whoever last set
          # the deployment's env.
          #
          # POST-D1 (shipped as w2/m72, 2026-08-16) this is a pure RESPONSIVENESS
          # knob: builds are observed non-blocking, one create + one read per
          # reconcile, so a worker is no longer parked for the minutes a build
          # takes. The old "workers == concurrent builds" equation is retired —
          # the two caps below carry the concurrency policy now. Do not restore
          # the coupling by raising this to track build capacity.
          - name: BEX_APP_RECONCILE_WORKERS
            value: "2"
          # Per-workspace concurrent-build cap: one tenant may hold at most half
          # the cluster's build slots, so a single busy workspace cannot starve
          # every other one. 0 = unlimited.
          - name: BEX_MAX_CONCURRENT_BUILDS
            value: "2"
          # Cluster-wide active-build ceiling (docs/ADR060 D6). Set to the build
          # pools' PHYSICAL concurrency target from D8 — 2 warm slots on
          # bex-tenant-lg (cx43) + 2 elastic slots on bex-tenant-burst (cx33) — so
          # it can never throttle below what the pools can actually run; what it
          # bounds is a dispatch storm queueing unbounded Jobs against shared
          # capacity. Raise it only together with the pools' max-size. 0 =
          # unlimited (the pre-w7/m83 behavior).
          - name: BEX_MAX_ACTIVE_BUILDS
            value: "4"
          # cert-manager ClusterIssuer for App Ingresses. Start on staging; flip to
          # letsencrypt-prod once the chain verifies (changing this re-rolls the pod
          # -> re-pulls :latest -> re-reconciles Apps with the new issuer).
          - name: BEX_CLUSTER_ISSUER
            value: letsencrypt-prod
          # Shared platform hosting suffix: exposed web services auto-serve
          # "<slug>.onbex.co" (derived by effectiveHosts, kept out of spec.hosts).
          #
          # DO NOT UNSET THIS TO "FIX" THE PSL FINDING. onbex.co is not in the
          # browser Public Suffix List, and that gap is an ACCEPTED risk, not an
          # open remediation — see `.pm/DO_NOT_DO.md` #PSL. Unsetting it does not
          # narrow the risk, it deletes platform hosting for every App and takes
          # production down; it has now done so twice (e0468cf2 2026-08-08,
          # 815e003b 2026-08-16). The manager warns loudly and keeps serving
          # (84ec2a9d). `scripts/gitops-validate.sh` fails closed if this value
          # goes missing from the prod render.
          - name: BEX_BASE_DOMAIN
            value: onbex.co
          # Managed-Postgres external endpoints: Database{public:true} is exposed
          # at "<name>.db.bex.co" via Traefik TCP/SNI. Needs a DNS-only (gray-cloud)
          # wildcard *.db.bex.co -> node IP (Cloudflare can't proxy raw TCP:5432).
          - name: BEX_DB_DOMAIN
            value: db.bex.co
          # Postgres disk autoscaling reads the already-scraped kubelet PVC
          # used/capacity series from Prometheus. Unset disables only the
          # automatic loop; the API field continues to round-trip.
          - name: BEX_PROM_URL
            value: http://prometheus-server.monitoring.svc
          # Managed key-value (Valkey) external endpoints: KeyValue{public:true}
          # is exposed at "<name>.kv.bex.co" via Traefik TCP/SNI on the valkey
          # entrypoint (:6379). Same DNS-only wildcard caveat as Postgres above.
          - name: BEX_KV_DOMAIN
            value: kv.bex.co
          # Static sites (w1/m21, docs/ADR029-static-sites.md): the object-store
          # origin a static_site publishes to + the shared static-server its host
          # Ingress backs onto. Endpoint/bucket/region are deployment-time config
          # (a bucket DEDICATED to static content — never bex-tfstate); the S3
          # publish/purge credentials come from the out-of-band, bucket-scoped
          # `bex-static-publish-s3` Secret in BEX_BUILD_NAMESPACE. The shared
          # static-server uses a separate read-only identity in bex-system.
          # Any unset => static_site is rejected.
          - name: BEX_STATIC_S3_ENDPOINT
            value: https://s3.eu-central-2.wasabisys.com
          - name: BEX_STATIC_S3_BUCKET
            value: bex-static
          - name: BEX_STATIC_S3_REGION
            value: eu-central-2
          - name: BEX_STATIC_PUBLISH_S3_SECRET
            value: bex-static-publish-s3
          # Rollout compatibility: an older manager can briefly run with this
          # newer manifest while Argo and the image write-back converge. Keep
          # the legacy input pointed at the same least-privilege publisher
          # Secret; current managers ignore it.
          - name: BEX_STATIC_S3_SECRET
            value: bex-static-publish-s3
          - name: BEX_STATIC_SERVER_SERVICE
            value: bex-static-server
          # The activator (w1/m4 wake-on-request, w1/m37 maintenance mode):
          # the Ingress backend swaps to this Service in either state.
          - name: BEX_ACTIVATOR_SERVICE
            value: bex-activator
          - name: BEX_ACTIVATOR_PORT
            value: "8888"
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        - containerPort: 8080
          name: metrics
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
