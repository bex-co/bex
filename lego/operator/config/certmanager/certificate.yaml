---
# Self-signed Issuer used only to sign the operator webhook TLS certificate.
# A SelfSigned issuer is appropriate here because the CA bundle is injected
# into the ValidatingWebhookConfiguration by cert-manager's CA injector, so
# the Kubernetes API server trusts exactly the cert serving the webhook.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: system
spec:
  selfSigned: {}
---
# Intermediate CA certificate whose public key is injected as caBundle into
# the ValidatingWebhookConfiguration by the cert-manager CA injector.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: serving-cert
  namespace: system
spec:
  # dnsNames components are replaced by kustomize replacements in
  # config/default/kustomization.yaml with the actual service + namespace.
  dnsNames:
    - webhook-service.system.svc
    - webhook-service.system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
  secretName: webhook-server-cert
---
# Cluster-private Sandbox Broker CA (w2/m535, docs/ADR122-sandbox-credential-brokering.md D6).
# Signs short-lived (1h) exact-hostname ECDSA P-256 leaf certificates in memory
# inside bex-ssh-gateway for selectively intercepted credentialed HTTPS hosts.
# The Secret (`bex-sandbox-broker-ca`) stays exclusively in bex-system and is
# mounted ONLY into bex-ssh-gateway — never into bex-api or any tenant namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sandbox-broker-ca
  namespace: system
spec:
  isCA: true
  commonName: bex-sandbox-credential-broker-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - cert sign
    - crl sign
    - digital signature
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
  secretName: bex-sandbox-broker-ca
