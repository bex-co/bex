# objectgw needs no Kubernetes API access: it resolves hosts through bex-api's
# internal :8091 listener and reads bytes from the object store. A dedicated
# ServiceAccount with no Role or binding, and no mounted token, keeps it that
# way (docs/ADR112-object-storage.md D4, D9).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: objectgw
  namespace: bex-system
automountServiceAccountToken: false
