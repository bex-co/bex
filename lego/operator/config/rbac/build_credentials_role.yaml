# Namespace-scoped write access for the kpack adapter's derived credentials.
# The source registry/clone/signing Secrets remain out-of-band; the operator
# creates only kpack-compatible copies and one per-App ServiceAccount in the
# configured build namespace (bex-system in the checked-in deployment).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: build-credentials
rules:
  - apiGroups: [""]
    resources: ["secrets", "serviceaccounts"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: build-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: build-credentials
subjects:
  - kind: ServiceAccount
    name: controller-manager
    namespace: system
