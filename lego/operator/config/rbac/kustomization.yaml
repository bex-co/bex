resources:
# All RBAC will be applied under this service account in
# the deployment namespace. You may comment out this resource
# if your manager will use a service account that exists at
# runtime. Be sure to update RoleBinding and ClusterRoleBinding
# subjects if changing service account names.
- service_account.yaml
- role.yaml
- role_binding.yaml
- leader_election_role.yaml
- leader_election_role_binding.yaml
# Namespace-scoped secrets read for the admission webhook (w7/m11).
- webhook_secret_role.yaml
# w6/m6 RBAC least-privilege audit: removed the kubebuilder-scaffolded
# metrics + service helper roles. The metrics_auth_role / metrics_reader_role
# granted tokenreview/subjectaccessreview (auth delegation) and /metrics read
# for a kube-rbac-proxy sidecar that this repo does not run — dead privileges.
# The service_admin/editor/viewer roles targeted a non-existent app.bex.co
# "services" CRD (the CRD group defines apps/databases/keyvalues only) and
# service_admin_role carried an unjustified verbs: ['*'] wildcard. Re-add these
# only alongside the consumer that actually needs them (e.g. kube-rbac-proxy).
