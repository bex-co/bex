# Role that grants the operator manager read access to the cosign signing
# Secret (cosign.pub key) and the registry push Secret (docker auth) that the
# admission-time signature verifier needs at startup (w7/m11).
#
# Scoped to the manager namespace (bex-system after kustomize transform) to
# follow least-privilege: the operator reads these specific secrets only to
# extract the public key and registry credentials — it never writes them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webhook-secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webhook-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webhook-secret-reader
subjects:
  - kind: ServiceAccount
    name: controller-manager
    namespace: system
