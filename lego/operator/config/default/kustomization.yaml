# Adds namespace to all resources.
namespace: bex-system

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "alices-wordpress".
# Note that it should also match with the prefix (text before '-') of the namespace
# field above.
namePrefix: bex-

# Labels to add to all resources and selectors.
#labels:
#- includeSelectors: true
#  pairs:
#    someName: someValue

resources:
- ../crd
- ../rbac
- ../manager
# The control-plane-seed API (REST + GraphQL for restart/suspend/resume).
- ../api
# The shared interstitial responder (w1/m4): wakes auto-hibernated free-tier
# apps on request, and serves the maintenance-mode page (w1/m37) — same
# component, two states. Same image as the manager, different entrypoint
# (/activator). Previously built but never wired into this kustomization
# (w1/m37 t003 fix) — auto-sleep and maintenance mode were both unroutable
# until now, since BEX_ACTIVATOR_SERVICE below had nothing to point at.
- ../activator
# The shared static-site origin proxy (w1/m21): serves static_site Apps from the
# object store. Same image as the manager, different entrypoint (/staticserver).
- ../staticserver
# The Postgres SNI front-door (w1/m29): handles the PostgreSQL SSLRequest preamble
# so standard preamble-mode clients can connect to external managed databases.
- ../pg-sni-proxy
# Admission-time tenant-image signature verification webhook (w7/m11).
# Requires cert-manager to be installed (it signs the TLS cert and injects
# the caBundle into the ValidatingWebhookConfiguration).
- ../webhook
- ../certmanager
# [PROMETHEUS] To enable prometheus monitor, uncomment all sections with 'PROMETHEUS'.
#- ../prometheus
# [METRICS] Expose the controller manager metrics service.
- metrics_service.yaml
# [NETWORK POLICY] Protect the /metrics endpoint and Webhook Server with NetworkPolicy.
# Only Pod(s) running a namespace labeled with 'metrics: enabled' will be able to gather the metrics.
# Only CR(s) which requires webhooks and are applied on namespaces labeled with 'webhooks: enabled' will
# be able to communicate with the Webhook Server.
#- ../network-policy

# The one image reference every component's manifest carries as the literal
# placeholder "controller:latest" (manager, activator, static-server — same
# image, different entrypoints per Deployment's `command:`). Set here, at the
# top-level kustomization, not in config/manager/ alone — an `images:`
# transformer only rewrites resources within the SAME kustomization's own
# build tree, so scoping it to config/manager (kubebuilder's original
# scaffold location) silently missed the sibling ../activator and
# ../staticserver components once they started sharing the placeholder
# (w1/m37 fix; `make deploy IMG=...` — see the Makefile — now edits this
# file's `images:` entry instead of config/manager's). Matches how the real
# deploy already works: Argo CD's own `kustomize.images` override targets
# this exact path (deploy/gitops/base/bex.yaml), so this bootstrap value only
# matters locally.
images:
- name: controller
  newName: controller
  newTag: latest

# Uncomment the patches line if you enable Metrics
patches:
# [METRICS] The following patch will enable the metrics endpoint using HTTPS and the port :8443.
# More info: https://book.kubebuilder.io/reference/metrics
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment
    name: controller-manager # scope to the operator only; the api Deployment has no metrics args

# Uncomment the patches line if you enable Metrics and CertManager
# [METRICS-WITH-CERTS] To enable metrics protected with certManager, uncomment the following line.
# This patch will protect the metrics with certManager self-signed certs.
#- path: cert_metrics_manager_patch.yaml
#  target:
#    kind: Deployment

# Add webhook TLS cert volume + --webhook-cert-path arg to the operator (w7/m11).
- path: manager_webhook_patch.yaml
  target:
    kind: Deployment
    name: controller-manager

# cert-manager CA injection: replaces the webhook Service name + namespace into
# the Certificate dnsNames, and the Certificate namespace/name into the
# ValidatingWebhookConfiguration cert-manager.io/inject-ca-from annotation.
replacements:
  # Inject the webhook Service name into the Certificate dnsNames (component 0).
  - source:
      kind: Service
      version: v1
      name: webhook-service
      fieldPath: .metadata.name
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
          name: serving-cert
        fieldPaths:
          - .spec.dnsNames.0
          - .spec.dnsNames.1
        options:
          delimiter: '.'
          index: 0
          create: true
  # Inject the webhook Service namespace into the Certificate dnsNames (component 1).
  - source:
      kind: Service
      version: v1
      name: webhook-service
      fieldPath: .metadata.namespace
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
          name: serving-cert
        fieldPaths:
          - .spec.dnsNames.0
          - .spec.dnsNames.1
        options:
          delimiter: '.'
          index: 1
          create: true
  # Inject the Certificate namespace into the VWC cert-manager inject annotation (component 0).
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert
      fieldPath: .metadata.namespace
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: '/'
          index: 0
          create: true
  # Inject the Certificate name into the VWC cert-manager inject annotation (component 1).
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert
      fieldPath: .metadata.name
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - .metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: '/'
          index: 1
          create: true

