apiVersion: v1
kind: Service
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-service
  namespace: system
spec:
  ports:
  # Must equal the manager's --metrics-bind-address (config/manager/manager.yaml).
  # This Service shipped pointing at 8443 while the manager bound nothing at all,
  # so it had no endpoints and the build-plane series were unreachable —
  # scripts/gitops-validate.sh now fails closed if the two drift apart again.
  - name: metrics
    port: 8080
    protocol: TCP
    targetPort: metrics
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: control-plane
