apiVersion: v1
kind: Service
metadata:
  name: ssh-gateway
  namespace: system
spec:
  selector:
    app.kubernetes.io/name: bex-ssh-gateway
  ports:
    - name: ssh
      port: 2222
      targetPort: ssh
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
    # Browser Web Shell WebSocket (w2/m55). Traefik terminates TLS and routes
    # wss://ssh.bex.co/shell here; the listener runs only when the shared
    # BEX_SHELL_TICKET_SECRET is installed.
    - name: shell
      port: 8080
      targetPort: shell
      protocol: TCP
    # Sandbox-exec SSE (w3/m33). Internal-only — bex-api reverse-proxies
    # `render ea sandbox exec` here; the listener runs only when the shared
    # BEX_SANDBOX_EXEC_SECRET is installed. Never exposed at the edge.
    - name: sandbox-exec
      port: 8081
      targetPort: sandbox-exec
      protocol: TCP
    # Agent-session credential helper → gateway. Cluster-internal only: there is
    # no edge Ingress; Cilium admits only sandbox-regime source identities.
    - name: agent-credential
      port: 8082
      targetPort: agent-credential
      protocol: TCP
