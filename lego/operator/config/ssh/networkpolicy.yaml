apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ssh-gateway-ingress
  namespace: system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bex-ssh-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 2222
          protocol: TCP
        # Browser Web Shell WebSocket (w2/m55): Traefik terminates TLS for
        # wss://ssh.bex.co/shell and forwards to the gateway's plain-HTTP
        # BEX_SHELL_WS_ADDR (:8080). The listener runs only when the shared
        # BEX_SHELL_TICKET_SECRET is installed.
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
          protocol: TCP
    # Sandbox-exec SSE (w3/m33): bex-api (bex-system) reverse-proxies
    # `render ea sandbox exec` to the gateway's internal BEX_SANDBOX_EXEC_ADDR
    # (:8081). Internal-only — never reachable from traefik/the edge.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bex-system
      ports:
        - port: 8081
          protocol: TCP
