apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ssh-gateway-ingress
  namespace: system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bex-ssh-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 2222
          protocol: TCP
        # Browser Web Shell WebSocket (w2/m55): Traefik terminates TLS for
        # wss://ssh.bex.co/shell and forwards to the gateway's plain-HTTP
        # BEX_SHELL_WS_ADDR (:8080). The listener runs only when the shared
        # BEX_SHELL_TICKET_SECRET is installed.
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
          protocol: TCP
    # Sandbox-exec SSE (:8081) is intentionally absent here. The base's Cilium
    # identity policy admits only the exact bex-api ServiceAccount/workload and
    # denies the broader same-namespace/Traefik/monitoring allows on that port.
    # Agent Git/model credentials (:8082/:8084), the full-tier egress proxy
    # (:8085, w10/m19), and the /v1/sandboxes credential broker (:8086,
    # w2/m534-m535) flow in the opposite direction: sandbox-regime Pods call
    # the gateway, which verifies direct source Pod IP + immutable labels
    # (narrowed further by Cilium ingress policies in tenant-node-egress.yaml).
    - from:
        - namespaceSelector:
            matchLabels:
              app.bex.co/regime: sandbox
      ports:
        - port: 8082
          protocol: TCP
        - port: 8084
          protocol: TCP
        - port: 8085
          protocol: TCP
        - port: 8086
          protocol: TCP
