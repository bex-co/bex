apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ssh-gateway-ingress
  namespace: system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bex-ssh-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 2222
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
          protocol: TCP
