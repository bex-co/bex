apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-gateway
  namespace: system
  labels:
    app.kubernetes.io/name: bex-ssh-gateway
    app.kubernetes.io/component: ssh-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bex-ssh-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bex-ssh-gateway
        app.kubernetes.io/component: ssh-gateway
    spec:
      serviceAccountName: ssh-gateway
      nodeSelector:
        bex.co/pool: platform
      tolerations:
        - key: bex.co/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ssh-gateway
          image: controller:latest
          imagePullPolicy: Always
          command: ["/ssh-gateway"]
          env:
            - name: BEX_SSH_ADDR
              value: ":2222"
            - name: BEX_SSH_METRICS_ADDR
              value: ":9090"
            - name: BEX_SSH_HOST_KEY_PATH
              value: /var/run/bex-ssh-host-key/ssh_host_ed25519_key
            - name: BEX_API_NAMESPACE
              value: default
            # Least-privilege control-plane credential (w7/m56, docs/ADR035-ssh.md
            # §116): the gateway connects as the scoped `bex_ssh_gateway` role
            # (key lookup + its own session/nonce/audit rows only) via its OWN
            # Secret, NOT bex-api's full-privilege bex-db-app. The Secret is
            # installed out of band by scripts/ssh-gateway-db-role.sh (never
            # committed). The gateway does not migrate or own the schema — bex-api
            # (on bex-db-app) does — so this role needs no DDL privilege.
            - name: BEX_CP_DB_URI
              valueFrom:
                secretKeyRef:
                  name: bex-db-ssh-gateway
                  key: uri
            - name: BEX_OPENFGA_URL
              value: http://openfga.auth.svc:8080
            - name: BEX_OPENFGA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bex-openfga
                  key: token
                  optional: true
            - name: BEX_SSH_HANDSHAKE_TIMEOUT
              value: 10s
            - name: BEX_SSH_SESSION_TIMEOUT
              value: 4h
            - name: BEX_SSH_MAX_SESSIONS
              value: "100"
            - name: BEX_SSH_MAX_SESSIONS_PER_IDENTITY
              value: "5"
            # Traefik's ssh IngressRouteTCP forwards every connection wrapped in
            # a PROXY protocol v2 header (config/ssh/ingressroutetcp.yaml). The
            # gateway MUST be told which immediate peers may assert that header,
            # or proxyproto.Wrap is a no-op and the un-stripped binary header is
            # fed into the SSH version exchange — the handshake then never sends
            # KEXINIT and every `ssh <svc>@ssh.bex.co` hangs to the handshake
            # timeout (w6/m132, the regression w4/m82 opened by turning the
            # Traefik sender on without this receiver). The value is the cluster
            # pod CIDR (kept in lockstep with clusterNetwork.pods.cidrBlocks in
            # infra/clusterapi/overlays/hetzner-caph/cluster.yaml and bex-api's
            # BEX_TRUSTED_PROXY_CIDRS by a scripts/gitops-validate.sh check);
            # trusting the whole pod range is safe because networkpolicy.yaml
            # already admits :2222 ingress only from the traefik namespace.
            - name: BEX_SSH_PROXY_PROTOCOL_TRUSTED_CIDRS
              value: 10.244.0.0/16
            # Browser Web Shell (w2/m55, docs/ADR035-ssh.md § Browser Web Shell):
            # the plain-HTTP WebSocket Traefik terminates TLS onto. The listener
            # starts only when BEX_SHELL_TICKET_SECRET is present (optional), so
            # the feature stays disabled until the shared secret is installed and
            # must match bex-api's BEX_SHELL_TICKET_SECRET.
            - name: BEX_SHELL_WS_ADDR
              value: ":8080"
            - name: BEX_SHELL_TICKET_SECRET
              valueFrom:
                secretKeyRef:
                  name: bex-shell-ticket
                  key: secret
                  optional: true
            # Sandbox-exec SSE transport (w3/m33, `render ea sandbox exec`). An
            # INTERNAL-only listener bex-api reverse-proxies to (NOT browser-facing,
            # so distinct from the Web Shell on :8080). Started only when
            # BEX_SANDBOX_EXEC_SECRET is present; must match bex-api's. pods/exec
            # stays confined to this gateway (Option A).
            - name: BEX_SANDBOX_EXEC_ADDR
              value: ":8081"
            - name: BEX_SANDBOX_EXEC_SECRET
              valueFrom:
                secretKeyRef:
                  name: bex-sandbox-exec
                  key: secret
                  optional: true
            # Agent-session Git credential broker (ADR047 D2). This listener is
            # reached only by sandbox-regime Pods; it authenticates their source
            # Pod and HMAC-proxies a scoped mint to bex-api's :8091 route. Reuses
            # BEX_SANDBOX_EXEC_SECRET with a domain-separated signature.
            - name: BEX_AGENT_CREDENTIAL_ADDR
              value: ":8082"
            - name: BEX_AGENT_CREDENTIAL_API_URL
              value: http://bex-api.bex-system.svc:8091/v1/agent-session-credentials
            # Credential-injecting model proxy (ADR062 / security round 10).
            # Internal-only: sandbox Pods reach :8084 through their exact Cilium
            # policy; the listener HMAC-mints the workspace key from bex-api and
            # permits only registered inference operations.
            - name: BEX_AGENT_MODEL_PROXY_ADDR
              value: ":8084"
            - name: BEX_AGENT_MODEL_CREDENTIAL_API_URL
              value: http://bex-api.bex-system.svc:8091/v1/agent-session-model-credentials
            - name: BEX_AGENT_MODEL_MAX_CONNS
              value: "32"
            - name: BEX_AGENT_MODEL_MAX_CONNS_PER_POD
              value: "2"
            - name: BEX_AGENT_MODEL_READ_TIMEOUT
              value: 2m
            - name: BEX_AGENT_MODEL_MAX_DURATION
              value: 2h
            # Agent-session conversation transport (ADR047 D9, w3/m43). A
            # browser-facing plain-HTTP SSE listener Traefik terminates TLS onto:
            # the edge path-routes api.bex.co/v1/agent-sessions/{id}/stream here
            # (ingressroute-agent-attach.yaml). The gateway verifies the
            # agent-session ticket (reusing BEX_SHELL_TICKET_SECRET, so the
            # listener starts only when that shared secret is installed) and dials
            # the in-sandbox driver's stream port directly. Distinct from the Web
            # Shell (:8080) so their routing/limits stay independent.
            - name: BEX_AGENT_ATTACH_ADDR
              value: ":8083"
            - name: BEX_AGENT_SESSION_DRIVER_PORT
              value: "8787"
            # The stream endpoint publishes on api.bex.co but the dashboard calls
            # it cross-subdomain (dashboard.bex.co); the gateway must echo CORS
            # for that origin or the browser blocks the stream. Same value as
            # bex-api's BEX_API_CORS_ORIGIN.
            - name: BEX_API_CORS_ORIGIN
              value: https://dashboard.bex.co
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: shell
              containerPort: 8080
              protocol: TCP
            - name: sandbox-exec
              containerPort: 8081
              protocol: TCP
            - name: agent-creds
              containerPort: 8082
              protocol: TCP
            - name: agent-attach
              containerPort: 8083
              protocol: TCP
            - name: agent-model
              containerPort: 8084
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: host-key
              mountPath: /var/run/bex-ssh-host-key
              readOnly: true
      volumes:
        - name: host-key
          secret:
            secretName: bex-ssh-host-key
            defaultMode: 0440
