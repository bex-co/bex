# Static-server object-store config (w1/m57, docs/ADR029-static-sites.md).
#
# The shared static-server (config/staticserver/deployment.yaml) `envFrom`s this
# ConfigMap — optionally — for its object-store origin (endpoint/bucket/region)
# and the platform base domain it derives each static_site's host from
# (`<subdomain>.onbex.co`). Without it the server has no origin, so it stays in
# the intentional degraded-503 mode (cmd/staticserver/main.go: `configured` is
# false when endpoint or bucket is empty).
#
# PROD-ONLY placement (not config/staticserver base): these are the same
# Wasabi/onbex.co values the manager already carries inline (config/manager/
# manager.yaml BEX_STATIC_S3_* + BEX_BASE_DOMAIN), but the static-server verifies
# the read credential at startup and os.Exit(1)s on failure (s3origin Check).
# Baking a real origin into the base would make the local CAPD static-server —
# which has no bex-static-read-s3 Wasabi credential — CrashLoop instead of
# serving 503. config/default (local) therefore renders NO bex-static-config and
# the static-server stays degraded-503-but-Ready; only config/prod supplies it.
#
# Keep these four values in lockstep with the manager's inline BEX_STATIC_S3_*
# and BEX_BASE_DOMAIN (the manager publishes to the same bucket the server reads).
apiVersion: v1
kind: ConfigMap
metadata:
  name: bex-static-config
  namespace: bex-system
data:
  BEX_STATIC_S3_ENDPOINT: https://s3.eu-central-2.wasabisys.com
  BEX_STATIC_S3_BUCKET: bex-static
  BEX_STATIC_S3_REGION: eu-central-2
  BEX_BASE_DOMAIN: onbex.co
