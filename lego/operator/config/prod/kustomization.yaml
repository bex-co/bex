apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../default
  - api-pdb.yaml
  - pg-sni-proxy-lb.yaml
  - kv-sni-proxy-lb.yaml
  - edge-proxy-network-policy.yaml
  # Object-store origin + base domain for the shared static-server (w1/m57,
  # docs/ADR029-static-sites.md). Prod-only: the base static-server stays
  # degraded-503 without it, so local (config/default) does not CrashLoop on a
  # missing Wasabi read credential.
  - static-config.yaml
  # The CAPI pre-drain hook for node rolls (w1/m186). Prod-only: production
  # CAPI manages its own cluster; the local mock keeps it in kind-bex-mgmt.
  - ../drain-guard
patches:
  # Tenant Postgres physical backups resolve through the namespaced Barman
  # Cloud ObjectStore, while logical exports and finalizer purge Jobs consume
  # the same non-secret coordinates directly. Keep this prod-only: the local
  # overlay intentionally excludes credential-backed ObjectStores.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: controller-manager
    patch: |-
      # w6/m151: render-v1 runtime pods in every workspace run in a pod user
      # namespace (hostUsers: false). Widened 2026-10-21 after the `bex` canary
      # proved Hetzner hcloud-volumes accept idmapped mounts (disk-backed
      # ClickHouse Live, data intact across a restart, uid_map 0 2104885248
      # 65536). Roll back by removing this; on-disk UIDs are unshifted, so no
      # data migration either way.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_RENDER_V1_USER_NAMESPACES
          value: "*"
      # w9/m492: every workspace's Dockerfile and native builds reuse BuildKit
      # layers across deploys through the bex-build-cache Wasabi bucket (30-day
      # expiry), off Zot's single PVC that the w7/047 registry trial would have
      # grown by ~0.5 GB per App (docs/ADR060 D3 S3 amendment). Render caches
      # every workspace's builds, so there is no allowlist. The credential is
      # bex-build/bex-build-cache-s3, installed out of band by
      # scripts/build-cache-s3-credentials.sh provision; BuildKit never sees it.
      # A missing Secret costs builds their cache, never the build. Rollback:
      # remove these five; caches age out of the bucket on their own.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_BUILD_CACHE
          value: s3
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_BUILD_CACHE_S3_ENDPOINT
          value: https://s3.eu-central-2.wasabisys.com
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_BUILD_CACHE_S3_BUCKET
          value: bex-build-cache
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_BUILD_CACHE_S3_REGION
          value: eu-central-2
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_BUILD_CACHE_S3_SECRET
          value: bex-build-cache-s3
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_DB_BACKUP_DESTINATION
          value: s3://bex-tfstate/postgres
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_DB_BACKUP_ENDPOINT
          value: https://s3.eu-central-2.wasabisys.com
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_DB_BACKUP_S3_SECRET
          value: bex-db-backup-s3
      # Paid KeyValue plans take coherent remote RDB snapshots, then upload and
      # prune under the dedicated keyvalue/ prefix. The Secret is provisioned
      # out of band in the apps namespace; local/default stays disabled.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_KV_BACKUP_DESTINATION
          value: s3://bex-tfstate/keyvalue
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_KV_BACKUP_ENDPOINT
          value: https://s3.eu-central-2.wasabisys.com
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_KV_BACKUP_S3_SECRET
          value: bex-kv-backup-s3
      # ADR050 Tier A: age recipient PUBLIC key (non-secret) — makes the paid
      # KeyValue backup Job age-encrypt each RDB before upload. The private half
      # is out-of-band (.env/CI, AGE_BACKUP_PRIVATE_KEY); empty/removed ⇒ plain
      # upload. The etcd/OpenBao CronJobs read the same key from the out-of-band
      # bex-backup-age ConfigMap instead (docs/ADR050-encrypted-platform-backups.md).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_BACKUP_AGE_PUBLIC_KEY
          value: age1vw2pwheyy0ufvpt72pkhqrfnrx7f5sg0t3xl5key0n8ncv354pcqq8k3n7
      # Persistent service disks provision on the LUKS-encrypted class
      # (deploy/gitops/base/disk-storageclass.yaml), closing ADR082 D3's
      # encryption-at-rest gap. Prod-only for the same reason as the backup
      # coordinates above: the class exists only where the hcloud CSI driver
      # runs, and naming it on the CAPD mock would strand every disk PVC.
      # Both recorded prerequisites were verified live on production
      # 2026-09-02 (w2/m86): cryptsetup ships inside the hcloud-csi-driver
      # v2.22.0 image (the node image needs nothing), and the per-disk
      # passphrase Secret is fetched by the kubelet under the node authorizer
      # (no CSI ServiceAccount RBAC). Disks created before this flip stay on
      # hcloud-volumes — a claim's class is immutable; migrate via
      # snapshot-restore if ever needed.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_DISK_STORAGE_CLASS
          value: hcloud-volumes-luks-bounded
      # w2/m245: every public Database gets a Let's Encrypt certificate for
      # its <dpg-id>.db.bex.co names (HTTP-01 through Traefik on :80), served
      # by CNPG, so the copied external URL connects from a stock client with
      # no downloaded CA, as on Render. Prod-only: a local/dev cluster cannot
      # answer HTTP-01 for production names and would only burn the shared
      # bex.co rate limit (50 new certificates/week). Unset => CNPG's own
      # certificate + sslmode=verify-full against serverCaCertificate.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_DB_CLUSTER_ISSUER
          value: letsencrypt-prod
      # w6/m624: a pod that carries the health-probe helper mounts it from an
      # `image` volume of bex's own image instead of the
      # bex-health-probe-install init container, so the kubelet starts the
      # app in the pass that starts the pod rather than on its next relist
      # (0-1 s). It needs ImageVolume (beta, off by default on v1.34) on
      # kube-apiserver and on the kubelet of every node that runs an App:
      # the control plane rolled onto it in 30588c6353 and bex-tenant-0 in
      # c98690e829, and the bex-tenant-0/-xl/-xxl templates carry it
      # (scripts/clusterapi-validate.sh). Each template adopts it on its next
      # deploy, restart or settings change; turning it on rolls no service.
      # Rollback: remove this; templates return to the installer the same way.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_HEALTH_PROBE_IMAGE_VOLUME
          value: "true"
  # THE objectgw KILL SWITCH (docs/ADR112-object-storage.md D4,
  # docs/runbooks/objectgw-kill-switch.md). Argo CD syncs production from this
  # overlay with selfHeal, so a `kubectl scale` is reverted within minutes;
  # this value is the one reviewed change that stops every pub-<obk-xid> host.
  # Normal value: 2. To stop public reads set it to 0, merge, and let Argo
  # sync; to restore set it back to 2. Contract A and B object routes live in
  # bex-api and are not affected. Never leave it at 0 after an incident.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: bex-objectgw
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  # THE bex-s3 KILL SWITCH (docs/ADR112-object-storage.md D3,
  # docs/runbooks/objectgw-kill-switch.md "The S3 API switch"). Same mechanism and
  # the same reason as the objectgw one above: Argo CD's selfHeal reverts a
  # `kubectl scale`, so this reviewed value is what stops the S3 API on
  # objects.<base domain> (Traefik then answers 503). Normal value: 2. Contract A
  # and B object routes, the pub- hosts and every access key are unaffected.
  # Never leave it at 0 after an incident.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: bex-s3gw
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: bex-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      # Every workspace's new Docker/image services get the render-v1 container
      # policy: Render's measured capability set plus bex's render-v1 seccomp
      # profile (ADR089 D2, ADR008 § Render parity first). Widened from the
      # `bex` canary on 2026-10-21 (w6/m149 t009) after unchanged ClickHouse and
      # the in-pod probe passed there. Rollback: set it back to
      # tea-d98210cbbpdc73dcrkvg; existing services keep their persisted policy
      # either way. Image-derived private ports are a separate default
      # (BEX_PRIVATE_IMAGE_PORTS, unset = on).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_IMAGE_COMPATIBILITY_WORKSPACES
          value: "*"
      # One agent turn's wall-clock bound. The 30m code default killed every
      # scheduled rt-* routine on 2026-11-11 while it was still building and
      # testing (ADR047 § turn timeout), losing the unpushed work. 4h leaves a
      # routine room to finish. It is only the ceiling: a turn that stops
      # making progress fails at the inactivity bound
      # (BEX_AGENT_TURN_IDLE_TIMEOUT, default 30m), and one hung tool call at
      # BEX_AGENT_TOOL_CALL_TIMEOUT (default 2h).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_AGENT_TURN_TIMEOUT
          value: 4h
      # w2/029: preferred, not required. With 2 replicas + required anti-affinity
      # on 3 platform nodes, every rollout's surge pod (plus the 15s-drain
      # terminating pod it replaces) momentarily needs a 4th node and sat
      # Pending with FailedScheduling on each deploy-per-push roll. Preferred
      # keeps steady-state spreading while letting surge pods schedule
      # immediately; maxUnavailable: 0 (config/api) still guarantees an old pod
      # is never killed before its ready replacement exists.
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: bex-api
                  topologyKey: kubernetes.io/hostname
