apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../default
  - api-pdb.yaml
  - pg-sni-proxy-lb.yaml
  - kv-sni-proxy-lb.yaml
  - edge-proxy-network-policy.yaml
  # Object-store origin + base domain for the shared static-server (w1/m57,
  # docs/ADR029-static-sites.md). Prod-only: the base static-server stays
  # degraded-503 without it, so local (config/default) does not CrashLoop on a
  # missing Wasabi read credential.
  - static-config.yaml
patches:
  # Tenant Postgres physical backups resolve through the namespaced Barman
  # Cloud ObjectStore, while logical exports and finalizer purge Jobs consume
  # the same non-secret coordinates directly. Keep this prod-only: the local
  # overlay intentionally excludes credential-backed ObjectStores.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: controller-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_DB_BACKUP_DESTINATION
          value: s3://bex-tfstate/postgres
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_DB_BACKUP_ENDPOINT
          value: https://s3.eu-central-2.wasabisys.com
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_DB_BACKUP_S3_SECRET
          value: bex-db-backup-s3
      # Paid KeyValue plans take coherent remote RDB snapshots, then upload and
      # prune under the dedicated keyvalue/ prefix. The Secret is provisioned
      # out of band in the apps namespace; local/default stays disabled.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_KV_BACKUP_DESTINATION
          value: s3://bex-tfstate/keyvalue
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_KV_BACKUP_ENDPOINT
          value: https://s3.eu-central-2.wasabisys.com
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_KV_BACKUP_S3_SECRET
          value: bex-kv-backup-s3
      # ADR050 Tier A: age recipient PUBLIC key (non-secret) — makes the paid
      # KeyValue backup Job age-encrypt each RDB before upload. The private half
      # is out-of-band (.env/CI, AGE_BACKUP_PRIVATE_KEY); empty/removed ⇒ plain
      # upload. The etcd/OpenBao CronJobs read the same key from the out-of-band
      # bex-backup-age ConfigMap instead (docs/ADR050-encrypted-platform-backups.md).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEX_BACKUP_AGE_PUBLIC_KEY
          value: age1vw2pwheyy0ufvpt72pkhqrfnrx7f5sg0t3xl5key0n8ncv354pcqq8k3n7
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: bex-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      # w2/029: preferred, not required. With 2 replicas + required anti-affinity
      # on 3 platform nodes, every rollout's surge pod (plus the 15s-drain
      # terminating pod it replaces) momentarily needs a 4th node and sat
      # Pending with FailedScheduling on each deploy-per-push roll. Preferred
      # keeps steady-state spreading while letting surge pods schedule
      # immediately; maxUnavailable: 0 (config/api) still guarantees an old pod
      # is never killed before its ready replacement exists.
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: bex-api
                  topologyKey: kubernetes.io/hostname
