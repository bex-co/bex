version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
  settings:
    depguard:
      rules:
        # The workspace import DAG is operator → types ← backend (lego/AGENTS.md):
        # this module is mechanism only — it reconciles App CRs into runtime
        # objects and holds no business logic or DB access. Importing backend/
        # would erase that split in one direction the compiler accepts. Deny the
        # prefix so every subpackage is covered without listing them.
        module-dag:
          files:
            - "$all"
          deny:
            - pkg: github.com/bex-co/bex/lego/backend
              desc: "operator must not import backend; cross through lego/types and the App CR instead — see lego/AGENTS.md"
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
    goconst:
      # goconst 1.11 (golangci-lint v2.13) widened detection to package scope, so
      # a literal repeated three times across sibling files now reports. For this
      # module that mostly surfaces container args, env-var names and label keys
      # that read better inline than behind a const; keep the linter for literals
      # repeated often enough to actually drift.
      min-occurrences: 5
      # "name" is an unstructured-object field key and a Prometheus label, not a
      # domain value — a constant would obscure both call sites.
      ignore-string-values:
        - '^name$'
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # Repeated string literals in tests (fixtures / expected values like
      # "256Mi") are intentional and read better inline than behind a const.
      - linters:
          - goconst
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
