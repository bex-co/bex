# bex price sheet — 30% off Render on workspace-plan fees, compute/Postgres/
# KeyValue/build-minute and Postgres storage, 90% off on bandwidth.
# Source: docs/render-artifacts/pricing.md (captured 2026-07-13; workspace
# plans from Render's April 2026 lineup, render.com/pricing).
# Policy: docs/ADR030-pricing.md
#
# All rates are in USD per unit of the matching meter kind:
#   instance_seconds → usdPerSecond
#   egress_bytes     → bandwidth.usdPerByte
#   build_seconds    → build.usdPerSecond
#   storage_gb_seconds → storage.usdPerGBSecond
#   sandbox_compute_seconds → sandbox.usdPerWeightedSecond
#   agent_model_cost_microusd → $0.000001 per unit (the row already carries
#                           upstream cost × agentModel.markup, ADR091 D1)
#   agent_model_{input,output,cache_read,cache_write}_tokens → $0 (display only)
#
# Derivation for per-second rates:
#   bex_monthly = render_monthly × discount
#   usdPerSecond = bex_monthly / (730 h/mo × 3600 s/h)   [2,628,000 s/mo]
#
# These numbers drive both the advisory estimate and the Stripe Billing catalog
# provisioned by scripts/stripe-billing-setup.py. Stripe's invoice remains the
# authoritative charge; the estimate is informational (ADR030, ADR040).

version: "4"

# Workspace plan fees (licensed monthly SKU, not a usage meter). Render's
# post-2026-04-23 flat workspace subscriptions × 0.70. Hobby stays free.
# Enterprise is custom and has no catalog rate. These amounts are the
# display/catalog source of truth (dashboard PlanPicker, ADR030). They are
# not Stripe usage meters; attaching them as licensed subscription items
# is a billing follow-up, not part of BillableMeterNames.
workspace:
  - plan: hobby
    usdPerMonth: 0.0 # Render $0 × 0.70
  - plan: pro
    usdPerMonth: 17.50 # Render $25 × 0.70
  - plan: scale
    usdPerMonth: 349.30 # Render $499 × 0.70

# instance_seconds rates for App (web-service / worker / cron) services
compute:
  - tier: free
    usdPerSecond: 0.0
  - tier: starter
    usdPerSecond: 0.000001864535768645   # $4.90/mo  (Render $7.00 × 0.70)
  - tier: standard
    usdPerSecond: 0.000006659056316591   # $17.50/mo (Render $25.00 × 0.70)
  - tier: pro
    usdPerSecond: 0.000022640791476408   # $59.50/mo (Render $85.00 × 0.70)
  - tier: pro-plus
    usdPerSecond: 0.000046613394216134   # $122.50/mo (Render $175.00 × 0.70)
  - tier: pro-max
    usdPerSecond: 0.000059931506849315   # $157.50/mo (Render $225.00 × 0.70)
  - tier: pro-ultra
    usdPerSecond: 0.000119863013698630   # $315.00/mo (Render $450.00 × 0.70)

# instance_seconds rates for managed Postgres (Database CR), per instance: a
# high-availability database runs a primary + standby and meters two instances,
# as Render bills its standby like the primary. Render prices fetched
# 2026-10-19 (render.com/pricing: 0.1c-256mb $6, 0.5c-1g $19, 1c-2g $40, 1c-4g
# $55, 2c-4g $75; w2/m171).
postgres:
  - tier: free
    usdPerSecond: 0.0
  - tier: basic-256mb
    usdPerSecond: 0.000001598173515982   # $4.20/mo  (Render $6.00 × 0.70)
  - tier: basic-1gb
    usdPerSecond: 0.000005060882800609   # $13.30/mo (Render $19.00 × 0.70)
  - tier: 1c-2g
    usdPerSecond: 0.000010654490106545   # $28.00/mo (Render $40.00 × 0.70)
  - tier: pro-4gb
    usdPerSecond: 0.000014649923896499   # $38.50/mo (Render $55.00 × 0.70; Render 1c-4g)
  - tier: basic-4gb
    usdPerSecond: 0.000019977168949772   # $52.50/mo (Render $75.00 × 0.70; Render 2c-4g)

# instance_seconds rates for managed Key Value / Valkey (KeyValue CR)
keyvalue:
  - tier: free
    usdPerSecond: 0.0
  - tier: starter
    usdPerSecond: 0.000002663622526636   # $7.00/mo  (Render $10.00 × 0.70)
  - tier: standard
    usdPerSecond: 0.000005327245053272   # $14.00/mo (Render 1g $20.00 × 0.70)
  - tier: 3g
    usdPerSecond: 0.000015981735159817   # $42.00/mo (Render 3g $60.00 × 0.70)
  - tier: pro
    usdPerSecond: 0.000026636225266362   # $70.00/mo (Render 5g $100.00 × 0.70)
  - tier: pro_plus
    usdPerSecond: 0.000053272450532725   # $140.00/mo (Render 10g $200.00 × 0.70)
  - tier: pro_max
    usdPerSecond: 0.000093226788432268   # $245.00/mo (Render 20g $350.00 × 0.70)
  - tier: pro_ultra
    usdPerSecond: 0.000159817351598174   # $420.00/mo (Render 40g $600.00 × 0.70)
  - tier: 50g
    usdPerSecond: 0.000199771689497717   # $525.00/mo (Render 50g $750.00 × 0.70)

# Composed public outbound egress_bytes rate: $0.015/GiB
# (Render's current $0.15/GB × 0.10 = 90% off; bex's transparent meter uses
# binary GiB, preserving its existing byte basis).
# includedGB: each workspace's outbound bandwidth a month, Render's figures
# (render.com/docs/outbound-bandwidth, read 2026-11-10; docs/ADR030 §14) in the
# GB (2^30 bytes) bandwidth is billed in. Enterprise takes Scale's until its
# contract says otherwise.
bandwidth:
  usdPerByte: 0.000000000013969838619232177734375   # $0.015 / 1,073,741,824 bytes
  includedGB:
    - plan: hobby
      gb: 5
    - plan: pro
      gb: 25
    - plan: scale
      gb: 1000
    - plan: enterprise
      gb: 1000

# build_seconds rate: $0.0035/min (Render $0.005/min × 0.70 = 30% off)
# includedMinutes: each workspace's Starter-tier pipeline minutes a month, as on
# Render (render.com/docs/build-pipeline, read 2026-11-10; docs/ADR030 §13).
# Enterprise takes Scale's until its contract says otherwise.
build:
  usdPerSecond: 0.000058333333333333333333333333   # $0.0035 / 60 s
  includedMinutes:
    - plan: hobby
      minutes: 500
    - plan: pro
      minutes: 1000
    - plan: scale
      minutes: 5000
    - plan: enterprise
      minutes: 5000

# storage_gb_seconds rate: $0.21/GB-month (Render Postgres $0.30 × 0.70).
# One pricing month is 730 h = 2,628,000 seconds. Render has no separate Key
# Value storage line; bex deliberately applies the same transparent rate to
# actual used PVC bytes for both managed datastore kinds.
storage:
  usdPerGBSecond: 0.000000079908675799086757990868   # $0.21 / 2,628,000 GB-seconds

# sandbox_compute_seconds uses milli-vCPU-equivalent seconds. The sandbox
# meter folds memory into the quantity at the AgentCore reference ratio
# ($0.00945/GB-hour ÷ $0.0895/vCPU-hour), so this one rate is the AgentCore CPU
# reference divided by 3,600 seconds and 1,000 milli-vCPU per vCPU.
sandbox:
  usdPerWeightedSecond: 0.000000024861111111111111111111   # $0.0895 / 3,600 / 1,000

# disk_gb_seconds rate: $0.175/GB-month of PROVISIONED capacity
# (Render's service disk $0.25 × 0.70). Unlike the storage rate above, which
# meters USED bytes on a datastore volume, this one bills what was reserved —
# Render bills provisioned disk capacity, and Hetzner charges bex for the whole
# volume whether it is attached, idle, or detached, so parity and cost recovery
# point the same way here. It is the one SKU whose estimate equals its invoice.
# Policy: docs/ADR082-persistent-disks.md D8.
disk:
  usdPerGBSecond: 0.000000066590563165905631659056   # $0.175 / 2,628,000 GB-seconds

# sandbox_snapshot_gb_seconds rate: $0.056/GB-month of a suspended sandbox's
# retained image (Render's snapshot storage $0.08/GB-month × 0.70; Render's
# comparison article render-sandboxes-vs-vercel-sandboxes, published 2026-11-06 —
# render.com/pricing and /docs/sandboxes carry no sandbox prices, so re-read it
# before changing this). Decimal GB, like storage_gb_seconds; one pricing month
# is 730 h = 2,628,000 seconds. A suspended sandbox pays this and no compute.
# Policy: docs/ADR104-sandbox-render-parity.md D8, docs/ADR023-usage-metering.md.
sandboxSnapshot:
  usdPerGBSecond: 0.0000000213089802130898   # $0.056 / 2,628,000 GB-seconds

# Platform model route (ADR091 D1–D3, ADR090 § Platform
# OpenRouter route). Every platform-key exchange is priced at its upstream
# cost (OpenRouter's reported usage.cost, else computed from the cached
# https://openrouter.ai/api/v1/models price table with its time-of-day
# overrides) × markup, rounded half-up to micro-USD per request, and metered
# into agent_model_cost_microusd. That one model-agnostic meter is the only
# agent-model Stripe meter ($0.000001 per unit; lookup key
# agent_model_cost_microusd — run scripts/stripe-billing-setup.py against
# test AND live Stripe before the deploy that adds it). The four
# agent_model_*_tokens meters stay as the per-model usage breakdown and rate
# $0. markup must be between 1 and 10.
#
# Spend caps and trust tiers (ADR091 D5, D10.1). monthlySpendCapUsd is each
# plan's default monthly cap on month-to-date agent_model_cost_microusd
# (customer price); enterprise (no row) takes the highest listed plan's cap.
# Workspace admins may override it up to maxCapMultiplier × the plan default.
# trustTiers is ordered T0..T4; a workspace sits in the highest tier whose
# minLifetimePaidUsd AND minPaidCycleInvoices it meets (successful, non-zero
# bex invoices only), and a failed charge or dispute holds it at T0 for 30
# days after settlement. chargeThresholdUsd null = month-end only (no
# threshold); inFlightAllowanceUsd is how far past its threshold a workspace
# may spend while that charge is unpaid, so the tier's cap ceiling is
# chargeThresholdUsd + inFlightAllowanceUsd (ADR091 D10.2a: a paid charge moves
# it up a tier; null = no ceiling beyond the plan/override cap);
# maxConcurrentSessions null = no tier limit on live platform-model sessions.
agentModel:
  markup: 1.30
  maxCapMultiplier: 10
  monthlySpendCapUsd:
    - plan: hobby
      usd: 20
    - plan: pro
      usd: 200
    - plan: scale
      usd: 2000
  trustTiers:
    - tier: T0
      minLifetimePaidUsd: 0
      minPaidCycleInvoices: 0
      chargeThresholdUsd: 10
      inFlightAllowanceUsd: 5
      maxConcurrentSessions: 2
    - tier: T1
      minLifetimePaidUsd: 10
      minPaidCycleInvoices: 0
      chargeThresholdUsd: 25
      maxConcurrentSessions: null
    - tier: T2
      minLifetimePaidUsd: 100
      minPaidCycleInvoices: 1
      chargeThresholdUsd: 50
      maxConcurrentSessions: null
    - tier: T3
      minLifetimePaidUsd: 500
      minPaidCycleInvoices: 3
      chargeThresholdUsd: 250
      maxConcurrentSessions: null
    - tier: T4
      minLifetimePaidUsd: 2000
      minPaidCycleInvoices: 6
      chargeThresholdUsd: null
      maxConcurrentSessions: null
