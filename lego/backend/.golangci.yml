# golangci-lint config for the backend module (bex-api). The operator module has
# its own richer config; this one is deliberately narrow — its job today is to
# enforce the resource-id convention (docs/ADR020-identifiers.md), not a repo-wide style
# sweep. Grow the enabled set later; keep it green so `make lint` stays trusted.
version: "2"
linters:
  default: none
  enable:
    - depguard
    - forbidigo
  settings:
    depguard:
      rules:
        # Only internal/id may import xid — the one legitimate way to mint the
        # random id suffix. Anywhere else, importing xid means someone is
        # hand-rolling an id (bypassing id.New), which the compiler and the
        # id-package guard test can't see. This is the lint layer of the
        # identifiers ADR (docs/ADR020-identifiers.md §Enforcement).
        hand-minted-ids:
          files:
            - "$all"
            - "!**/internal/id/**"
          deny:
            - pkg: github.com/rs/xid
              desc: mint ids via internal/id (id.New); only internal/id may import xid — see docs/ADR020-identifiers.md
    forbidigo:
      # Resolve through the type checker so an aliased import or an explicit
      # generic instantiation is caught too, not just the literal text.
      analyze-types: true
      forbid:
        # Registering a tool with the SDK directly drops a *core.CodedError's
        # code: the SDK converts a handler error into a text-only result before
        # anything else can read it, so the wrap has to happen at registration.
        # internal/mcputil.AddTool does it for every tool; it is the one
        # legitimate caller of the SDK function (nolint'd there).
        - pattern: ^mcp\.AddTool$
          msg: register MCP tools via internal/mcputil.AddTool so coded errors keep their code
