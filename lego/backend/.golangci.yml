# golangci-lint config for the backend module (bex-api). The operator module has
# its own richer config; this one is deliberately narrow — it rejects dead code
# and enforces the resource-id convention (docs/ADR020-identifiers.md), rather
# than attempting a repo-wide style sweep. Keep it green so `make lint` stays
# trusted.
version: "2"
linters:
  default: none
  enable:
    - depguard
    - forbidigo
    - unused
  settings:
    depguard:
      rules:
        # The workspace import DAG is operator → types ← backend (lego/AGENTS.md):
        # the operator converges App intent into runtime objects and the backend
        # writes that intent, so they meet only in the types/ CRD contract. An
        # import of operator/ from here would let API business logic reach
        # straight into k8s mechanism — the operator's DB-free, business-free
        # rule and the CRD seam both assume it can't. Deny the prefix so the
        # guard covers every subpackage without listing them.
        module-dag:
          files:
            - "$all"
          deny:
            - pkg: github.com/bex-co/bex/lego/operator
              desc: "backend must not import operator; cross through lego/types and the App CR instead — see lego/AGENTS.md"
        # The sshgateway transports (agentcred, modelproxy, egressproxy,
        # sandboxfiles, sandboxsse, …) share the parent internal/sshgateway
        # kernel (session Pod resolution, exec revalidation) instead of
        # importing each other: sideways imports re-couple doors that deploy,
        # scale and fail independently. Deny the child prefix with its trailing
        # slash so the kernel import itself (no slash) stays allowed. Test
        # fakes still cross-wire through gatewaytest, so this guards
        # production code only.
        sshgateway-kernel:
          files:
            - "**/internal/sshgateway/*/**"
            - "!$test"
          deny:
            - pkg: github.com/bex-co/bex/lego/backend/internal/sshgateway/
              desc: "sshgateway transports must not import each other; move the shared piece to the parent internal/sshgateway kernel"
        # internal/authz is the production core.Checker: it answers authorization
        # questions and must lean on the leaf kernel, never on a feature package.
        # A sideways import here (it once reached into agentsession for a
        # one-line object helper) drags a feature's store/github dependencies
        # into every authorization check. Allow-list the leaf, the stdlib and the
        # one external concurrency helper instead of enumerating features.
        checker-leans-on-core:
          files:
            - "**/internal/authz/**"
          allow:
            - $gostd
            - github.com/bex-co/bex/lego/backend/internal/core
            - golang.org/x/sync/singleflight
        # Only internal/id may import xid — the one legitimate way to mint the
        # random id suffix. Anywhere else, importing xid means someone is
        # hand-rolling an id (bypassing id.New), which the compiler and the
        # id-package guard test can't see. This is the lint layer of the
        # identifiers ADR (docs/ADR020-identifiers.md §Enforcement).
        hand-minted-ids:
          files:
            - "$all"
            - "!**/internal/id/**"
          deny:
            - pkg: github.com/rs/xid
              desc: mint ids via internal/id (id.New); only internal/id may import xid — see docs/ADR020-identifiers.md
        # cmd/ssh-gateway resolves tenants through internal/tenancy, never the
        # bex-api HTTP surface: importing internal/api would link the whole
        # server package (handlers, GraphQL, MCP) into the gateway binary and
        # re-couple doors that deploy, scale and fail independently.
        gateway-stays-lean:
          files:
            - "**/cmd/ssh-gateway/**"
          deny:
            - pkg: github.com/bex-co/bex/lego/backend/internal/api
              desc: "ssh-gateway must not import the bex-api HTTP surface; resolve tenancy through internal/tenancy"
        # internal/rendertest validates responses against the pinned Render
        # spec for tests (w3/m272). It fails a testing.TB, so production code
        # importing it is always a mistake.
        test-helpers-stay-in-tests:
          files:
            - "$all"
            - "!$test"
          deny:
            - pkg: github.com/bex-co/bex/lego/backend/internal/rendertest
              desc: internal/rendertest is a test helper; import it only from _test.go files
    forbidigo:
      # Resolve through the type checker so an aliased import or an explicit
      # generic instantiation is caught too, not just the literal text.
      analyze-types: true
      forbid:
        # Registering a tool with the SDK directly drops a *core.CodedError's
        # code: the SDK converts a handler error into a text-only result before
        # anything else can read it, so the wrap has to happen at registration.
        # internal/mcputil.AddTool does it for every tool; it is the one
        # legitimate caller of the SDK function (nolint'd there).
        - pattern: ^mcp\.AddTool$
          msg: register MCP tools via internal/mcputil.AddTool so coded errors keep their code
