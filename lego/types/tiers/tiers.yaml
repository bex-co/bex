# The bex instance-size catalog — one reviewed file, one family per product
# surface, mirroring render.com's split:
#
#   compute:  web-service instance types (render.com/docs/compute-plans,
#             verified 2026-07-08). id is the App CRD's spec.tier value (and
#             the store's app/tenant "plan" column); renderPlan is Render's
#             own REST `plan` spelling, used only at the public API boundary.
#             The operator sets pod requests == limits (Guaranteed QoS) across
#             cpu, memory, AND ephemeralStorage — the writable-layer/log disk
#             bound every tenant execution mode (serving, cron, pre-deploy)
#             carries, so tenant code cannot fill a node's filesystem
#             (round-14 #2). 1→32Gi scales with the tier; a runaway writer is
#             evicted at its own limit instead of pressuring co-tenants.
#
#   postgres: managed-Postgres instance types (the Database CRD's spec.plan),
#             named in Render's newer family-size style (their Postgres
#             instance-type redesign: basic-256mb, basic-1gb, ...). storageGB
#             is the plan's volume floor — spec.storageGB can grow past it,
#             never below; instances is the CNPG cluster size.
#
#   valkey:   managed key-value (Valkey) instance types (the KeyValue CRD's
#             spec.plan), the Redis-compatible sibling of the postgres family —
#             single-instance tiers differing by compute (requests==limits) and
#             storage, using Render's Key Value vocabulary (free / starter /
#             standard / …, shared with the web-service ladder).
#
# No pricing here — backend-only internal/pricing/pricing.yaml drives advisory
# estimates and the Stripe Billing catalog (ADR030/ADR040). This file is a
# resource catalog imported by the operator, so mechanism never has money to
# depend on.
compute:
  # The tier a plan-less App/tenant defaults to (mirrors the store's prior
  # normalizeTier("") => "free" default).
  default: free
  tiers:
    - id: free
      renderPlan: free
      cpu: 100m
      memory: 512Mi
      ephemeralStorage: 1Gi
      # Free compute is rated $0.00/second (internal/pricing), so N free
      # instances would be N× capacity for $0. Pinned to a single instance,
      # matching Render — its free instance types offer no horizontal scaling
      # (render.com/docs/scaling, docs/render-artifacts/free-tier-scaling.md).
      # Paid tiers below omit maxInstances → no plan cap (only MaxReplicas=100).
      maxInstances: 1
    - id: starter
      renderPlan: starter
      cpu: 500m
      memory: 512Mi
      ephemeralStorage: 2Gi
    - id: standard
      renderPlan: standard
      cpu: "1"
      memory: 2Gi
      ephemeralStorage: 4Gi
    - id: pro
      renderPlan: pro
      cpu: "2"
      memory: 4Gi
      ephemeralStorage: 8Gi
    - id: pro-plus
      renderPlan: pro_plus
      cpu: "4"
      memory: 8Gi
      ephemeralStorage: 16Gi
    - id: pro-max
      renderPlan: pro_max
      cpu: "4"
      memory: 16Gi
      ephemeralStorage: 16Gi
    - id: pro-ultra
      renderPlan: pro_ultra
      cpu: "8"
      memory: 32Gi
      ephemeralStorage: 32Gi

postgres:
  # Unknown/empty Database plans resolve to free (the operator's prior
  # dbPlans fallback).
  default: free
  # Render's normal product/API ceiling. The operator and backend consume this
  # value directly; the dashboard carries a build-tested mirror.
  diskAutoscalingCapGB: 16384
  tiers:
    - id: free
      cpu: 100m
      memory: 256Mi
      storageGB: 1
      instances: 1
      backup: false # Render's Free Postgres is ephemeral — no backups, expires
    - id: basic-256mb
      cpu: 100m
      memory: 256Mi
      storageGB: 1
      instances: 1
      backup: true # daily base backup + WAL archiving => PITR
    - id: basic-1gb
      cpu: 500m
      memory: 1Gi
      storageGB: 5
      instances: 1
      backup: true

valkey:
  # Managed key-value (Valkey) instance types — the KeyValue CRD's spec.plan.
  # Plan IDs use the SAME vocabulary as Render's Key Value product (free /
  # starter / standard / pro / pro_plus / ...), which Render shares with its
  # web-service ladder — NOT the Postgres family's basic-* names. (Render's KV
  # free tier is 25MB / no persistence; bex's is more generous at 128Mi.) When a
  # spelling-divergent tier is added (pro_plus ↔ pro-plus), introduce a
  # renderPlan field here like the compute family has.
  default: free
  tiers:
    - id: free
      cpu: 100m
      memory: 128Mi
      storageGB: 1
      instances: 1
    - id: starter
      cpu: 100m
      memory: 256Mi
      storageGB: 1
      instances: 1
    - id: standard
      cpu: 500m
      memory: 1Gi
      storageGB: 5
      instances: 1
