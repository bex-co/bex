# The bex instance-size catalog — one reviewed file, one family per product
# surface, mirroring render.com's split:
#
#   compute:  web-service instance types (render.com/docs/compute-plans,
#             verified 2026-07-08). id is the App CRD's spec.tier value (and
#             the store's app/tenant "plan" column); renderPlan is Render's
#             own REST `plan` spelling, used only at the public API boundary.
#             The operator sets pod requests == limits (Guaranteed QoS) across
#             cpu, memory, AND ephemeralStorage — the writable-layer/log disk
#             bound every tenant execution mode (serving, cron, pre-deploy)
#             carries, so tenant code cannot fill a node's filesystem
#             (round-14 #2). 1→32Gi scales with the tier; a runaway writer is
#             evicted at its own limit instead of pressuring co-tenants.
#             servingPool names the dedicated serving node pool a tier that
#             cannot fit a standard bex-tenant-0 node (cx33, ~7.47Gi
#             allocatable) runs on (w2/m250). The operator turns it into a
#             toleration of, and a required node affinity to,
#             bex.co/serving-pool=<servingPool>; the CAPH overlay's
#             MachineDeployment carrying that label + NoSchedule taint is the
#             pool (bex-tenant-xl: cx53, bex-tenant-xxl: ccx43), and
#             scripts/clusterapi-validate.sh fails when a tier no longer fits
#             the pool it names — or bex-tenant-0, when it names none.
#             paused: true temporarily refuses a tier for new selections
#             (service create, Blueprint, plan change) while services already
#             on it keep running and instance-type listings still show it, as
#             unavailable. Each use is an ADR018-recorded divergence from
#             Render; deleting the field releases the tier.
#
#   postgres: managed-Postgres instance types (the Database CRD's spec.plan),
#             named in Render's newer family-size style (their Postgres
#             instance-type redesign: basic-256mb, basic-1gb, ...). storageGB
#             is the plan's volume floor — spec.storageGB can grow past it,
#             never below; instances is the CNPG cluster size.
#
#   valkey:   managed key-value (Valkey) instance types (the KeyValue CRD's
#             spec.plan), the Redis-compatible sibling of the postgres family —
#             single-instance tiers differing by compute (requests==limits) and
#             storage, using Render's Key Value vocabulary (free / starter /
#             standard / …, shared with the web-service ladder).
#
# No pricing here — backend-only internal/pricing/pricing.yaml drives advisory
# estimates and the Stripe Billing catalog (ADR030/ADR040). This file is a
# resource catalog imported by the operator, so mechanism never has money to
# depend on.
compute:
  # The tier a plan-less App/tenant defaults to (mirrors the store's prior
  # normalizeTier("") => "free" default).
  default: free
  tiers:
    - id: free
      renderPlan: free
      cpu: 100m
      memory: 512Mi
      ephemeralStorage: 1Gi
      # Free compute is rated $0.00/second (internal/pricing), so N free
      # instances would be N× capacity for $0. Pinned to a single instance,
      # matching Render — its free instance types offer no horizontal scaling
      # (render.com/docs/scaling, docs/render-artifacts/free-tier-scaling.md).
      # Paid tiers below omit maxInstances → no plan cap (only MaxReplicas=100).
      maxInstances: 1
    - id: starter
      renderPlan: starter
      cpu: 500m
      memory: 512Mi
      ephemeralStorage: 2Gi
    - id: standard
      renderPlan: standard
      cpu: "1"
      memory: 2Gi
      ephemeralStorage: 4Gi
    - id: pro
      renderPlan: pro
      cpu: "2"
      memory: 4Gi
      ephemeralStorage: 8Gi
    - id: pro-plus
      renderPlan: pro_plus
      cpu: "4"
      memory: 8Gi
      ephemeralStorage: 16Gi
      servingPool: xl
    - id: pro-max
      renderPlan: pro_max
      cpu: "4"
      memory: 16Gi
      ephemeralStorage: 16Gi
      servingPool: xl
    - id: pro-ultra
      renderPlan: pro_ultra
      cpu: "8"
      memory: 32Gi
      ephemeralStorage: 32Gi
      servingPool: xxl
      # Temporarily paused (w2/m250, user decision 2026-11-02): Pro Ultra's
      # only node, a Hetzner ccx43, cannot be created while the Hetzner
      # project's dedicated vCPU limit refuses it ("dedicated core limit
      # exceeded"). New selections (create, Blueprint, plan change) are
      # refused with 400 INSTANCE_TYPE_UNAVAILABLE; services already on
      # pro-ultra are left alone. Release condition: once Hetzner raises the
      # dedicated vCPU limit, delete this field (and the ADR018 divergence).
      paused: true

postgres:
  # Unknown/empty Database plans resolve to free (the operator's prior
  # dbPlans fallback).
  default: free
  # Render's normal product/API ceiling. The operator and backend consume this
  # value directly; the dashboard reads per-plan API capability metadata.
  diskAutoscalingCapGB: 16384
  tiers:
    - id: free
      cpu: 100m
      memory: 256Mi
      storageGB: 1
      instances: 1
      backup: false # Render's Free Postgres is ephemeral — no backups, expires
    - id: basic-256mb
      cpu: 100m
      memory: 256Mi
      storageGB: 1
      instances: 1
      backup: true # daily base backup + WAL archiving => PITR
    - id: basic-1gb
      cpu: 500m
      memory: 1Gi
      storageGB: 5
      instances: 1
      backup: true
    # The ≥1-CPU rungs (w2/m171): the first plans that can run high
    # availability (Render: "at least 1 CPU"). ids follow the catalog's
    # legacy-name convention where Render has one (pro-4gb, basic-4gb); 1c-2g
    # has no legacy name and keeps Render's flexible id. Render's flexible
    # aliases (1c-4g, 2c-4g) live in aliases.go. instances stays 1 — HA raises
    # the CNPG cluster to a primary + standby. storageGB 10 is the default
    # volume (Render sells storage separately; 10 GB is Hetzner's smallest
    # volume and the read-replica minimum), and like every paid plan it grows.
    - id: 1c-2g
      cpu: "1"
      memory: 2Gi
      storageGB: 10
      instances: 1
      backup: true
    - id: pro-4gb
      cpu: "1"
      memory: 4Gi
      storageGB: 10
      instances: 1
      backup: true
    - id: basic-4gb
      cpu: "2"
      memory: 4Gi
      storageGB: 10
      instances: 1
      backup: true

valkey:
  # Managed key-value (Valkey) instance types — the KeyValue CRD's spec.plan.
  # Plan IDs use the SAME vocabulary as Render's Key Value product (free /
  # starter / standard / pro / pro_plus / ...), which Render shares with its
  # web-service ladder — NOT the Postgres family's basic-* names. (Render's KV
  # free tier is 25MB / no persistence; bex's is more generous at 128Mi.) When a
  # spelling-divergent tier is added (pro_plus ↔ pro-plus), introduce a
  # renderPlan field here like the compute family has. The Key Value ids keep
  # Render's own underscore spellings, so none is needed.
  default: free
  tiers:
    - id: free
      cpu: 100m
      memory: 128Mi
      storageGB: 1
      instances: 1
    - id: starter
      cpu: 100m
      memory: 256Mi
      storageGB: 1
      instances: 1
    - id: standard
      cpu: 500m
      memory: 1Gi
      storageGB: 5
      instances: 1
    # w5/m266: Render's larger Key Value plans (render.com/docs/compute-plans,
    # read 2026-11-05) — memory is the plan's RAM like the rungs above, storage
    # twice it for snapshot + AOF rewrite headroom. pro_plus and pro_max need
    # the xl pool; pro_ultra and 50g the xxl pool, paused with Pro Ultra until
    # the Hetzner dedicated-vCPU limit is raised (user decision D3,
    # 2026-11-05; ADR018). Size names alias in aliases.go.
    - id: 3g
      cpu: "1"
      memory: 3Gi
      storageGB: 6
      instances: 1
    - id: pro
      cpu: "1"
      memory: 5Gi
      storageGB: 10
      instances: 1
    - id: pro_plus
      cpu: "2"
      memory: 10Gi
      storageGB: 20
      instances: 1
      servingPool: xl
    - id: pro_max
      cpu: "4"
      memory: 20Gi
      storageGB: 40
      instances: 1
      servingPool: xl
    - id: pro_ultra
      cpu: "4"
      memory: 40Gi
      storageGB: 80
      instances: 1
      servingPool: xxl
      paused: true
    - id: 50g
      cpu: "8"
      memory: 50Gi
      storageGB: 100
      instances: 1
      servingPool: xxl
      paused: true
