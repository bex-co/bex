name: runner link

# The runner host's internet link (w6/m160). On 2026-11-06 it carried ~1 MB/s
# in total for hours: every job stalled on downloads, runners sat busy at ~0 %
# CPU and deploys took 2-5 h, and only a manual check found why. Every 30 min
# this measures the link twice, two minutes apart, and keeps one
# `runner-link-slow` issue open while both readings are below the threshold.
# All pools share the host's one link; this runs on bex-production because it
# writes issues. Like ci-red-streak it gates nothing.

on:
  workflow_dispatch:
    inputs:
      min_mbps:
        description: "MB/s below which the link is slow"
        required: false
        default: "3"
  schedule:
    - cron: "13,43 * * * *"

permissions:
  contents: read
  issues: write

jobs:
  link:
    runs-on: [self-hosted, Linux, ARM64, bex-production]
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUNNER_LINK_MIN_MBPS: ${{ inputs.min_mbps || '3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
          persist-credentials: false
      - name: Self-test the classification
        run: bash scripts/runner-link-probe.test.sh
      - name: Measure the link twice
        id: probe
        run: |
          slow=0
          for reading in 1 2; do
            [ "$reading" = 1 ] || sleep 120
            set +e
            bash scripts/runner-link-probe.sh > "reading-$reading.txt" 2>&1
            rc=$?
            set -e
            cat "reading-$reading.txt"
            if [ "$rc" = 2 ]; then
              exit 2 # unusable: an operator problem, never a silent pass
            fi
            [ "$rc" = 1 ] && slow=$((slow + 1))
          done
          cat reading-1.txt reading-2.txt > link.txt
          if [ "$slow" = 2 ]; then echo "slow=true" >> "$GITHUB_OUTPUT"; else echo "slow=false" >> "$GITHUB_OUTPUT"; fi
      - name: Open or update the tracking issue
        if: steps.probe.outputs.slow == 'true'
        run: |
          body="$(printf 'Two readings two minutes apart were below %s MB/s. Every CI job and deploy is network-bound until this clears (w6/m160).\n\n```\n%s\n```\n\nSee scripts/runner-link-probe.sh.' "$RUNNER_LINK_MIN_MBPS" "$(cat link.txt)")"
          printf '%s\n' "$body" > issue-body.md
          bash scripts/lib/tracking-issue.sh open --label runner-link-slow \
            --color B60205 --description "The CI runner host's internet link is degraded" \
            --title "The CI runner host's internet link is slow" --body-file issue-body.md
      - name: Close the tracking issue once the link recovers
        if: steps.probe.outputs.slow == 'false'
        run: |
          bash scripts/lib/tracking-issue.sh close --label runner-link-slow --comment "$(printf 'Recovered:\n\n```\n%s\n```' "$(cat link.txt)")"
