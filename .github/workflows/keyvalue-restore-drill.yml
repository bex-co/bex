name: KeyValue restore drill (manual)

# AGE_BACKUP_PRIVATE_KEY intentionally exists only in GitHub Actions custody.
# This workflow runs the production restore script against a scheduled snapshot
# and tears the isolated target down after both AOF-state checks pass.
on:
  workflow_dispatch:
    inputs:
      source_namespace:
        description: Tenant namespace containing the paid KeyValue
        required: true
        type: string
      keyvalue_id:
        description: KeyValue resource id (red-...)
        required: true
        type: string
      snapshot_not_before:
        description: Earliest accepted scheduled success (RFC3339 UTC)
        required: true
        type: string
      verify_key:
        description: Non-sensitive marker key already present before the snapshot
        required: true
        type: string
      expected_value:
        description: Non-sensitive expected marker value
        required: true
        type: string
      target_namespace:
        description: Throwaway namespace (must start restore-)
        required: true
        default: restore-kv-manual
        type: string
      confirm:
        description: Retype the exact target namespace to authorize mutations
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: keyvalue-production-restore-drill
  cancel-in-progress: false

jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on:
      group: bex-production
      labels: [self-hosted, Linux, ARM64]
    timeout-minutes: 30
    environment: production-restore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.1

      - name: install age (checksum-pinned, rootless)
        env:
          AGE_VERSION: "1.3.1"
          AGE_LINUX_ARM64_SHA256: c6878a324421b69e3e20b00ba17c04bc5c6dab0030cfe55bf8f68fa8d9e9093a
        run: |
          archive="$RUNNER_TEMP/age-v${AGE_VERSION}-linux-arm64.tar.gz"
          install_dir="$RUNNER_TEMP/age-bin"
          curl -fsSLo "$archive" \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-arm64.tar.gz"
          printf '%s  %s\n' "$AGE_LINUX_ARM64_SHA256" "$archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" age/age
          install -d "$install_dir"
          install -m755 "$RUNNER_TEMP/age/age" "$install_dir/age"
          echo "$install_dir" >>"$GITHUB_PATH"
          "$install_dir/age" --version

      - name: Fetch production kubeconfig
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          BEX_SSH_PRIVATE_KEY: ${{ secrets.BEX_SSH_PRIVATE_KEY }}
          BEX_SSH_KNOWN_HOSTS: ${{ secrets.BEX_SSH_KNOWN_HOSTS }}
        run: |
          install -m700 -d "$RUNNER_TEMP/bex-ssh"
          printf '%s\n' "$BEX_SSH_PRIVATE_KEY" >"$RUNNER_TEMP/bex-ssh/id_bex"
          chmod 600 "$RUNNER_TEMP/bex-ssh/id_bex"
          export BEX_SSH_KEY_PATH="$RUNNER_TEMP/bex-ssh/id_bex"
          export BEX_SSH_REQUIRE_KNOWN_HOSTS=1
          if [ -n "${BEX_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$BEX_SSH_KNOWN_HOSTS" >"$RUNNER_TEMP/bex-ssh/bex_known_hosts"
            chmod 600 "$RUNNER_TEMP/bex-ssh/bex_known_hosts"
            export BEX_SSH_KNOWN_HOSTS_FILE="$RUNNER_TEMP/bex-ssh/bex_known_hosts"
          fi
          bash scripts/fetch-app-kubeconfig.sh "$RUNNER_TEMP/app.kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/app.kubeconfig" >>"$GITHUB_ENV"

      - name: scrub SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/bex-ssh"

      - name: Scheduled snapshot restore, verification, teardown
        env:
          SOURCE_NAMESPACE: ${{ inputs.source_namespace }}
          KEYVALUE_ID: ${{ inputs.keyvalue_id }}
          SNAPSHOT_NOT_BEFORE: ${{ inputs.snapshot_not_before }}
          VERIFY_KEY: ${{ inputs.verify_key }}
          EXPECTED_VALUE: ${{ inputs.expected_value }}
          TARGET_NAMESPACE: ${{ inputs.target_namespace }}
          CONFIRM: ${{ inputs.confirm }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_ENDPOINT: ${{ secrets.TF_STATE_ENDPOINT }}
          TF_STATE_REGION: ${{ secrets.TF_STATE_REGION }}
          TF_STATE_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY }}
          TF_STATE_SECRET_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
          AGE_BACKUP_PRIVATE_KEY: ${{ secrets.AGE_BACKUP_PRIVATE_KEY }}
          RESTORE_SKIP_DOTENV: "1"
        run: |
          set -euo pipefail
          [[ "$SOURCE_NAMESPACE" =~ ^tea-[a-z0-9]+$ ]] \
            || { echo "source_namespace must be a tenant namespace" >&2; exit 1; }
          [[ "$KEYVALUE_ID" =~ ^red-[a-z0-9]+$ ]] \
            || { echo "keyvalue_id must be a red- resource id" >&2; exit 1; }
          [[ "$SNAPSHOT_NOT_BEFORE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || { echo "snapshot_not_before must be RFC3339 UTC" >&2; exit 1; }
          [[ "$TARGET_NAMESPACE" =~ ^restore-[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]] \
            || { echo "target_namespace must be a restore-* DNS label" >&2; exit 1; }
          [ "$CONFIRM" = "$TARGET_NAMESPACE" ] \
            || { echo "confirm must exactly match target_namespace" >&2; exit 1; }

          plan="$(kubectl -n "$SOURCE_NAMESPACE" get keyvalue.app.bex.co "$KEYVALUE_ID" \
            -o jsonpath='{.spec.plan}')"
          [ "$plan" != free ] || { echo "source KeyValue must use a paid plan" >&2; exit 1; }
          last_success="$(kubectl -n "$SOURCE_NAMESPACE" get cronjob "kvbak-$KEYVALUE_ID" \
            -o jsonpath='{.status.lastSuccessfulTime}')"
          [[ "$last_success" > "$SNAPSHOT_NOT_BEFORE" || "$last_success" == "$SNAPSHOT_NOT_BEFORE" ]] \
            || { echo "no scheduled snapshot has succeeded after the marker was written" >&2; exit 1; }

          live_value="$(kubectl -n "$SOURCE_NAMESPACE" exec "statefulset/$KEYVALUE_ID" -c valkey -- \
            /bin/sh -ec 'REDISCLI_AUTH="$VALKEY_PASSWORD" valkey-cli --raw GET "$1"' -- "$VERIFY_KEY")"
          [ "$live_value" = "$EXPECTED_VALUE" ] \
            || { echo "live source marker does not match expected value" >&2; exit 1; }
          unset live_value

          DRY_RUN=1 scripts/restore-keyvalue.sh \
            --id "$KEYVALUE_ID" \
            --target-namespace "$TARGET_NAMESPACE" \
            --verify-key "$VERIFY_KEY" \
            --expect "$EXPECTED_VALUE"
          scripts/restore-keyvalue.sh \
            --id "$KEYVALUE_ID" \
            --target-namespace "$TARGET_NAMESPACE" \
            --verify-key "$VERIFY_KEY" \
            --expect "$EXPECTED_VALUE" \
            --confirm "$TARGET_NAMESPACE" \
            --teardown-on-success

          kubectl -n "$SOURCE_NAMESPACE" wait --for=jsonpath='{.status.phase}'=Ready \
            "keyvalue.app.bex.co/$KEYVALUE_ID" --timeout=2m >/dev/null
          if kubectl get namespace "$TARGET_NAMESPACE" >/dev/null 2>&1; then
            echo "restore target survived teardown" >&2
            exit 1
          fi
          echo "scheduled KeyValue snapshot restored with AOF off/on and teardown verified"

      - name: final credential scrub
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/bex-ssh"
          rm -f -- "$RUNNER_TEMP/app.kubeconfig"
          unset KUBECONFIG || true
