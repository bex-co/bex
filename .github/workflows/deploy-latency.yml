name: deploy latency

# A green main that does not reach production is invisible: every deploy run
# can end cancelled or superseded without failing, and ci-red-streak counts
# only failures. Gaps of 15.7 h and 24.9 h with 16 and 29 deployable commits
# waiting went unnoticed in one week (w6/m156; w6/087's ">12 h means reopen"
# rule had no check). Every three hours, this measures how long main's oldest
# deployable commit has waited for a production pin and why, and keeps one
# issue open while it is over the threshold. Like ci-red-streak it gates nothing.
#
# deploy.yml deploys at most every 6 hours (block-eden-mono w1/m25): on the
# next push after the pin turns 6 hours old, or on its best-effort hourly cron
# once main goes quiet. The 16 h threshold covers 6 h plus a long cron gap
# (6-10 h measured on 2026-11-10); it trips when a deploy failed or nothing
# triggered one.

on:
  workflow_dispatch:
    inputs:
      threshold:
        description: "Hours a deployable commit may wait before reporting"
        required: false
        default: "16"
  schedule:
    - cron: "41 */3 * * *"

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  latency:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      THRESHOLD: ${{ inputs.threshold || '16' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The walk from the pinned commit to main needs commits and trees,
          # never file contents: a full clone of this repository outran the
          # 15-minute budget (w6/100: .pm is 93% of its bytes). A blobless
          # partial clone with a sparse worktree fetches only what is read.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts
            .github
          persist-credentials: false
      - name: Self-test the classification
        run: python3 -B -m unittest scripts/test_deploy_latency.py
      - name: Measure the oldest waiting deployable commit
        id: check
        run: |
          set +e
          python3 scripts/deploy_latency.py --threshold-hours "$THRESHOLD" > latency.txt 2>&1
          rc=$?
          set -e
          cat latency.txt
          if [ "$rc" -eq 2 ]; then
            exit 2 # unusable: an operator problem, never a silent pass
          fi
          if [ "$rc" -eq 1 ]; then echo "late=true" >> "$GITHUB_OUTPUT"; else echo "late=false" >> "$GITHUB_OUTPUT"; fi
      - name: Open or update the tracking issue
        if: steps.check.outputs.late == 'true'
        run: |
          body="$(printf 'A deployable commit on main has waited more than %s h for a production pin (state, age, commit, run, cause, subject):\n\n```\n%s\n```\n\nSee scripts/deploy_latency.py for the states.' "$THRESHOLD" "$(cat latency.txt)")"
          printf '%s\n' "$body" > issue-body.md
          bash scripts/lib/tracking-issue.sh open --label deploy-latency \
            --color B60205 --description "A deployable commit on main has waited too long for production" \
            --title "main is not reaching production" --body-file issue-body.md
      - name: Close the tracking issue once main deploys again
        if: steps.check.outputs.late == 'false'
        run: |
          bash scripts/lib/tracking-issue.sh close --label deploy-latency --comment "$(printf 'Recovered: %s' "$(cat latency.txt)")"
