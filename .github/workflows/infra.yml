name: infra (terraform)

# The bex infra-cluster base as IDEMPOTENT IaC — not a one-shot. PRs get a
# CREDENTIAL-LESS fmt/validate check; merges plan+apply, a daily schedule does
# drift detection. Runs in CI (an ephemeral runner), NEVER on a laptop.
#
# SECURITY (w1/m65 F3): pull-request Terraform is UNTRUSTED — a same-repo branch
# contributor could otherwise modify it to exfiltrate credentials during `plan`.
# So the two are split: the `validate` job (pull_request) gets NO cloud token,
# NO remote-state credential, and never runs `terraform plan` against real
# infrastructure; the credentialed `terraform` job (push / schedule / manual)
# runs only from reviewed main and is gated on the `production-infra` protected
# environment, whose secrets are scoped to that job's steps.
#
# Required repo secrets (exposed only to the `terraform` job):
#   HCLOUD_TOKEN          Hetzner Cloud API token
#   BEX_SSH_PUBLIC_KEY    public key uploaded as the `bex` hcloud key
#   TF_STATE_BUCKET       Hetzner Object Storage bucket for remote state (create once, out-of-band)
#   TF_STATE_ENDPOINT     e.g. https://fsn1.your-objectstorage.com
#   TF_STATE_REGION       e.g. fsn1
#   TF_STATE_ACCESS_KEY / TF_STATE_SECRET_KEY   Object Storage S3 credentials

on:
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/terraform/**", ".github/workflows/infra.yml"]
  schedule:
    - cron: "17 6 * * *" # daily drift detection (plan only)
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

defaults:
  run:
    working-directory: infra/terraform

jobs:
  # Credential-less validation for pull requests. PR-controlled Terraform is
  # untrusted, so this job holds no cloud token or remote-state credential and
  # never runs `terraform plan` against real infrastructure: fmt + a
  # backend-less validate catch structural errors, and anything that needs
  # credentials or state runs only from reviewed main in the `terraform` job.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"

      - name: fmt
        run: terraform fmt -check -recursive

      # -backend=false: no remote-state credential is read, and no provider
      # credential is needed — validate checks configuration + provider schemas
      # offline, never calling the cloud API.
      - name: init (no backend, no credentials)
        run: terraform init -backend=false

      - name: validate
        run: terraform validate

  # Credentialed plan/apply — main-branch pushes, the daily drift schedule, and
  # manual runs only (never pull_request). Gated on the `production-infra`
  # protected environment so the Hetzner + remote-state secrets are reachable
  # only after that environment's protection rules pass; secrets are scoped to
  # this job, not the workflow.
  terraform:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production-infra
    env:
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
      TF_VAR_ssh_public_key: ${{ secrets.BEX_SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=infra/terraform.tfstate" \
            -backend-config="region=${{ secrets.TF_STATE_REGION }}" \
            -backend-config="endpoints={s3=\"${{ secrets.TF_STATE_ENDPOINT }}\"}" \
            -backend-config="access_key=${{ secrets.TF_STATE_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.TF_STATE_SECRET_KEY }}"

      # CAPH creates the app-cluster network after the day-0 Terraform pass.
      # Discover it on every stateful run; zero keeps the durable LB object but
      # defers its cluster projection until the network exists.
      - name: discover app-cluster network
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
            'https://api.hetzner.cloud/v1/networks?name=bex')"
          count="$(jq -r '.networks | length' <<<"${response}")"
          case "${count}" in
            0) app_network_id=0 ;;
            1) app_network_id="$(jq -r '.networks[0].id' <<<"${response}")" ;;
            *)
              echo "expected at most one app-cluster network named bex, found ${count}" >&2
              exit 1
              ;;
          esac
          echo "TF_VAR_app_network_id=${app_network_id}" >>"${GITHUB_ENV}"
          echo "APP_NETWORK_ID=${app_network_id}" >>"${GITHUB_ENV}"

      - name: validate
        run: terraform validate

      # w1/m41: the production edge predates full Terraform ownership. On the
      # first main-branch run, adopt the named LB and every existing projection
      # object before apply can consider recreating them. A fresh installation
      # falls through to normal creation. PRs and scheduled checks stay read-only.
      - name: adopt existing production edge
        if: github.event_name == 'push'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
            'https://api.hetzner.cloud/v1/load_balancers?name=bex-traefik')"
          count="$(jq -r '.load_balancers | length' <<<"${response}")"
          case "${count}" in
            0)
              echo "no existing bex-traefik load balancer; Terraform will create it"
              exit 0
              ;;
            1)
              lb_id="$(jq -r '.load_balancers[0].id' <<<"${response}")"
              ;;
            *)
              echo "expected at most one bex-traefik load balancer, found ${count}" >&2
              exit 1
              ;;
          esac

          if ! terraform state show hcloud_load_balancer.traefik >/dev/null 2>&1; then
            terraform import hcloud_load_balancer.traefik "${lb_id}"
          fi
          if [ "${APP_NETWORK_ID}" = 0 ]; then
            echo "app-cluster network is absent; edge projection remains deferred"
            exit 0
          fi

          edge="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
            "https://api.hetzner.cloud/v1/load_balancers/${lb_id}")"

          if jq -e --argjson network "${APP_NETWORK_ID}" \
            '.load_balancer.private_net[]? | select(.network == $network)' \
            <<<"${edge}" >/dev/null && \
            ! terraform state show 'hcloud_load_balancer_network.traefik[0]' >/dev/null 2>&1; then
            terraform import 'hcloud_load_balancer_network.traefik[0]' \
              "${lb_id}-${APP_NETWORK_ID}"
          fi

          selector='caph-cluster-bex=owned,machine_type=worker'
          if jq -e --arg selector "${selector}" \
            '.load_balancer.targets[]? | select(.type == "label_selector" and .label_selector.selector == $selector)' \
            <<<"${edge}" >/dev/null && \
            ! terraform state show 'hcloud_load_balancer_target.traefik_workers[0]' >/dev/null 2>&1; then
            terraform import 'hcloud_load_balancer_target.traefik_workers[0]' \
              "${lb_id}__label_selector__${selector}"
          fi

          while read -r name port; do
            address="hcloud_load_balancer_service.${name}[0]"
            if jq -e --argjson port "${port}" \
              '.load_balancer.services[]? | select(.listen_port == $port)' \
              <<<"${edge}" >/dev/null && \
              ! terraform state show "${address}" >/dev/null 2>&1; then
              terraform import "${address}" "${lb_id}__${port}"
            fi
          done <<'SERVICES'
          ssh 22
          http 80
          https 443
          postgres 5432
          valkey 6379
          SERVICES

      # Save one reviewed plan for every event. Push applies this exact plan
      # after the compatibility gate below; schedules and manual runs remain
      # read-only.
      - name: plan
        run: terraform plan -no-color -out=tfplan

      # PROXY protocol is wire-incompatible with the old datastore proxies:
      # enabling it first would make the old binaries parse "PROXY ..." as a
      # PostgreSQL/TLS preamble. The deploy workflow for this same source SHA
      # waits until both proxy DaemonSets run the freshly built digest. Only a
      # plan that changes either datastore listener from false to true needs
      # the cross-workflow handoff; every other Terraform apply proceeds
      # normally. A missing/failed deploy fails closed and leaves the LB alone.
      - name: wait for PROXY-compatible datastore proxy rollout
        if: github.event_name == 'push'
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          needs_rollout="$(terraform show -json tfplan | jq -r '
            any(.resource_changes[]?;
              .type == "hcloud_load_balancer_service" and
              (.name == "postgres" or .name == "valkey") and
              .change.after.proxyprotocol == true and
              .change.before.proxyprotocol != true)
          ')"
          if [ "${needs_rollout}" != true ]; then
            echo "plan does not enable datastore PROXY protocol"
            exit 0
          fi

          echo "waiting for deploy.yml at ${GITHUB_SHA} before enabling datastore PROXY protocol"
          for _ in $(seq 1 160); do
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?head_sha=${GITHUB_SHA}&per_page=20")"
            read -r status conclusion < <(jq -r '
              [.workflow_runs[] | select(.event == "push")] |
              sort_by(.created_at) | reverse | .[0] // {} |
              [.status // "missing", .conclusion // "pending"] | @tsv
            ' <<<"${response}")
            case "${status}:${conclusion}" in
              completed:success)
                echo "deploy workflow completed; datastore proxies are digest-ready"
                exit 0
                ;;
              completed:*)
                echo "deploy workflow concluded ${conclusion}; refusing to enable datastore PROXY protocol" >&2
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "timed out waiting for deploy workflow; refusing to enable datastore PROXY protocol" >&2
          exit 1

      # Merge to main: converge. Idempotent — a no-op when nothing changed.
      - name: apply
        if: github.event_name == 'push'
        run: terraform apply -auto-approve -no-color tfplan

      # The one-time CCM target migration is complete. Keep the cloud boundary
      # fail-closed: Terraform owns one private worker selector, no explicit
      # server targets, and every declared listener has a healthy backend.
      - name: verify canonical edge target shape
        if: github.event_name == 'push'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          if [ "${APP_NETWORK_ID}" = 0 ]; then
            exit 0
          fi
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
            'https://api.hetzner.cloud/v1/load_balancers?name=bex-traefik')"
          count="$(jq -r '.load_balancers | length' <<<"${response}")"
          if [ "${count}" -ne 1 ]; then
            echo "expected exactly one bex-traefik load balancer, found ${count}" >&2
            exit 1
          fi
          lb_id="$(jq -r '.load_balancers[0].id' <<<"${response}")"
          selector='caph-cluster-bex=owned,machine_type=worker'

          for _ in $(seq 1 30); do
            edge="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
              "https://api.hetzner.cloud/v1/load_balancers/${lb_id}")"
            read -r explicit selector_count resolved ports missing_healthy <<<"$(
              jq -r --arg selector "${selector}" '
                (.load_balancer.targets // []) as $targets
                | ([ $targets[] | select(.type == "server") ] | length) as $explicit
                | ([ $targets[]
                    | select(.type == "label_selector"
                        and .label_selector.selector == $selector
                        and .use_private_ip == true) ]) as $canonical
                | ([ .load_balancer.services[].listen_port ] | sort) as $ports
                | ([ $canonical[]
                    | (.targets // [])[]
                    | .health_status[]?
                    | select(.status == "healthy")
                    | .listen_port ] | unique) as $healthy_ports
                | [ $explicit, ($canonical | length),
                    ([ $canonical[] | (.targets // [])[] ] | length),
                    ($ports | join(",")), (($ports - $healthy_ports) | length) ]
                | @tsv
              ' <<<"${edge}"
            )"
            if [ "${explicit}" -ne 0 ] || [ "${selector_count}" -ne 1 ] || [ "${resolved}" -eq 0 ] || [ "${ports}" != '22,80,443,5432,6379' ]; then
              echo "invalid bex-traefik target/listener shape: explicit=${explicit} selectors=${selector_count} resolved=${resolved} ports=${ports}" >&2
              exit 1
            fi
            if [ "${missing_healthy}" -eq 0 ]; then
              echo "canonical edge target shape is healthy: selector=${selector} resolved=${resolved} ports=${ports}"
              exit 0
            fi
            sleep 2
          done
          echo "bex-traefik has listeners without a healthy selector-resolved backend" >&2
          exit 1
