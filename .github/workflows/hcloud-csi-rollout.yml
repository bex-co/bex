name: hcloud CSI rollout (manual, reviewed digest)

# This workflow changes only the existing CSI Helm release. It never applies
# infrastructure/CAPI, rotates provider credentials, or flips the disk class.
# The image comes solely from a reviewed, committed digest values file.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hcloud-csi-rollout
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, bex-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: require a reviewed committed derivative digest
        run: bash scripts/install-hcloud-csi.sh validate-pin

  rollout:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, bex-production]
    environment: production-cluster
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: fetch production kubeconfig with authoritative SSH trust
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          BEX_SSH_PRIVATE_KEY: ${{ secrets.BEX_SSH_PRIVATE_KEY }}
          BEX_SSH_KNOWN_HOSTS: ${{ secrets.BEX_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          install -m700 -d "$RUNNER_TEMP/bex-ssh"
          printf '%s\n' "$BEX_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/bex-ssh/id_bex"
          printf '%s\n' "$BEX_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/bex-ssh/bex_known_hosts"
          export BEX_SSH_KEY_PATH="$RUNNER_TEMP/bex-ssh/id_bex"
          export BEX_SSH_KNOWN_HOSTS_FILE="$RUNNER_TEMP/bex-ssh/bex_known_hosts"
          export BEX_SSH_REQUIRE_KNOWN_HOSTS=1
          bash scripts/fetch-app-kubeconfig.sh "$RUNNER_TEMP/app.kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/app.kubeconfig" >> "$GITHUB_ENV"
      - name: scrub SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/bex-ssh"
      - name: upgrade only CSI and verify every controller/node driver pod
        run: bash scripts/install-hcloud-csi.sh rollout
      - name: scrub kubeconfig
        if: always()
        run: rm -f -- "$RUNNER_TEMP/app.kubeconfig"
