name: test (mobile)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "lego/backend/internal/**/graphql.go"
      - "lego/backend/internal/api/schema_dump_test.go"
      - ".github/workflows/mobile-test.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "lego/backend/internal/**/graphql.go"
      - "lego/backend/internal/api/schema_dump_test.go"
      - ".github/workflows/mobile-test.yml"

permissions:
  contents: read

jobs:
  mobile:
    runs-on: [self-hosted, Linux, X64]
    env:
      # Same workspace/toolchain split as backend-test.yml/operator-test.yml:
      # lego/go.work requires go >= 1.26.0 (lego/cli) while this job installs
      # the 1.25 line from lego/backend/go.mod and setup-go pins
      # GOTOOLCHAIN=local. The schema-dump `go test` the codegen script runs
      # resolves the backend module standalone via its `replace …/lego/types`
      # directive, so run it with the workspace off.
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lego/backend/go.mod
          cache-dependency-path: lego/backend/go.sum
      - name: enable corepack
        run: corepack enable
      - name: install dependencies
        working-directory: mobile
        run: yarn install --frozen-lockfile
      - name: verify GraphQL types match the backend schema
        working-directory: mobile
        run: yarn codegen:backend && git diff --exit-code -- src/generated-graphql
      - name: format, typecheck, lint, unit tests, Expo config
        working-directory: mobile
        run: yarn test
      - name: bundle iOS and Android
        working-directory: mobile
        run: yarn bundle:ios && yarn bundle:android
