name: test (mobile)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "lego/backend/internal/**/graphql.go"
      - "lego/backend/internal/api/schema_dump_test.go"
      - ".github/workflows/mobile-test.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "lego/backend/internal/**/graphql.go"
      - "lego/backend/internal/api/schema_dump_test.go"
      - ".github/workflows/mobile-test.yml"

permissions:
  contents: read

jobs:
  mobile:
    # Public-repo safety: fork PR code must never reach persistent self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, bex-ci]
    timeout-minutes: 70
    env:
      # GOWORK=off, same as backend-test.yml/operator-test.yml: the schema-dump
      # `go test` the codegen script runs resolves the backend module standalone
      # via its `replace …/lego/types` directive (Go version from
      # lego/backend/go.mod, the 1.26 line), so run it with the workspace off.
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lego/backend/go.mod
          # Multi-GB remote Go caches outlive signed download URLs and stall
          # uploads on this fleet; keep the runner-local Go caches instead.
          cache: false
      - name: enable corepack
        run: corepack enable
      - name: install dependencies
        working-directory: mobile
        run: yarn install --frozen-lockfile
      - name: verify GraphQL types match the backend schema
        working-directory: mobile
        run: yarn codegen:backend && git diff --exit-code -- src/generated-graphql
      - name: format, typecheck, lint, unit tests, Expo config
        working-directory: mobile
        run: yarn test
      - name: bundle iOS and Android
        working-directory: mobile
        run: yarn bundle:ios && yarn bundle:android
