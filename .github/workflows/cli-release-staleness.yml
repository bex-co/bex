name: CLI release staleness

# w4/032.md piece 1: releasing the CLI depends on this reminder, not on
# memory. Weekly, compares the latest bex-cli/v* tag against commits touching
# lego/cli/**, scripts/bex-cli-*, scripts/install-bex*, or this workflow's own
# release workflow — opening/updating a tracking issue when a release is
# owed, and closing it once /release catches the repo back up.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  staleness:
    runs-on: [self-hosted, Linux, ARM64, bex-production]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
          fetch-depth: 0
      - name: Check CLI release staleness
        id: check
        run: |
          set +e
          scripts/cli-release-staleness.sh > staleness.txt 2>&1
          rc=$?
          set -e
          cat staleness.txt
          # Exit 2 means the script cannot tell (w6/112): fail the run rather
          # than ask for a release.
          case "$rc" in
            0) echo "stale=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "stale=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac
      - name: Open or update the tracking issue
        if: steps.check.outputs.stale == 'true'
        run: |
          body="$(cat staleness.txt)"
          body+=$'\n\nRun `/release cli` to cut a release and close this out.'
          printf '%s\n' "$body" > issue-body.md
          bash scripts/lib/tracking-issue.sh open --label cli-release-stale \
            --color FBCA04 --description "The CLI has unreleased commits (w4/032.md)" \
            --title "CLI release is stale" --body-file issue-body.md
      - name: Close the tracking issue once caught up
        if: steps.check.outputs.stale == 'false'
        run: |
          bash scripts/lib/tracking-issue.sh close --label cli-release-stale --comment "The CLI is caught up with the latest \`bex-cli/v*\` tag."
