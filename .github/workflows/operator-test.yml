name: test (operator)

# Run the operator test suite (unit + envtest) on every PR touching
# lego/operator or lego/types, and as a reusable workflow called by deploy.yml
# to gate the build+push+deploy job.
# `make test` auto-runs manifests/generate/fmt/vet before the test run.
# Main pushes run once through deploy.yml; avoid duplicate gates competing for
# runners. deploy.yml includes this workflow and all test inputs.
on:
  pull_request:
    paths:
      - "lego/operator/**"
      - "lego/types/**"
      - ".github/workflows/operator-test.yml"
  workflow_call: {}

permissions:
  contents: read

# A PR's newer push cancels its superseded run. Inside deploy.yml's
# workflow_call `github.workflow` names the caller, so the group uses a fixed
# prefix and the caller's run id: deploy runs never cancel each other's gates.
concurrency:
  group: operator-test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  operator:
    # Public-repo safety (github-actions-validate.sh rule 7): fork PR heads never run this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    env:
      # GOWORK=off: the operator module resolves standalone via its
      # `replace …/lego/types => ../types` directive — exactly how the release
      # image (lego/Dockerfile golang:1.26, no go.work) compiles it — so test
      # with the workspace off, matching prod. Go version follows
      # lego/operator/go.mod (the 1.26 line); setup-go pins GOTOOLCHAIN=local.
      GOWORK: "off"
      # Exercise persistence conversion with the pinned Valkey 7/8 images.
      BEX_TEST_VALKEY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lego/operator/go.mod
          # Hosted runners start empty: restore the module + build caches
          # (shared by every job with the same Go version and go.sum set).
          cache-dependency-path: |
            lego/operator/go.sum
            lego/types/go.sum
      # TestValkeyPersistenceEngine's `docker run` of the pinned Valkey images
      # was killed at its 240s budget while the runner's Docker Hub pull stalled
      # (run 39524511518). Pull the exact pins the operator ships, read from its
      # source so they cannot drift, with retries, so the test starts from cache.
      - name: pull pinned Valkey images (with retries)
        run: |
          for image in $(grep -oE 'valkey/valkey:[0-9]+-alpine@sha256:[0-9a-f]{64}' lego/operator/internal/controller/keyvalue_controller.go | sort -u); do
            for i in 1 2 3 4 5; do
              docker pull "$image" && break
              [ "$i" -lt 5 ] || exit 1
              echo "pull $image attempt $i failed, retrying in $((i * 20))s..."; sleep $((i * 20))
            done
          done
      # One proxy.golang.org fetch failure inside `make vet` failed a deploy's
      # test stage (run 42069264215, gomega). Fill the module cache first, with
      # retries, so make test reads it.
      - name: download Go modules (with retries)
        working-directory: lego/operator
        run: |
          for i in 1 2 3; do
            go mod download && break
            [ "$i" -lt 3 ] || exit 1
            echo "go mod download attempt $i failed, retrying in $((i * 15))s..."; sleep $((i * 15))
          done
      # The envtest control plane (the Makefile's ENVTEST_ASSETS_DIR) is
      # restored from the Actions cache, so a version already there is used
      # without contacting GitHub releases. The key follows go.mod, which picks
      # the Kubernetes version (k8s.io/api) and setup-envtest's release branch.
      - name: restore envtest binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bex-envtest
          key: bex-envtest-operator-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lego/operator/go.mod') }}
      - name: make test (operator + envtest)
        working-directory: lego/operator
        run: ENVTEST_ASSETS_DIR="$HOME/.cache/bex-envtest" make test
      # w1/m68: `make test` REGENERATES manifests/deepcopy before running, so a
      # stale committed CRD is silently repaired in the runner and the job stays
      # green — drift ships. That is not hypothetical: `spec.deletedUsers` was
      # added to the Database types on 2026-08-09 without regenerating the CRD,
      # so the API server pruned the field and the security fix that introduced
      # it (a deleted Postgres login role must actually be dropped) was inert in
      # production from the day it shipped. Fail on any codegen the tree is
      # missing.
      - name: generated output is committed (codegen drift)
        run: |
          if ! git diff --exit-code -- lego/types lego/operator/config; then
            echo "::error::committed codegen is stale — run 'make manifests generate' from lego/operator/ and commit the result" >&2
            exit 1
          fi
