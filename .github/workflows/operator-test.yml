name: test (operator)

# Run the operator test suite (unit + envtest) on every push/PR touching
# lego/operator or lego/types, and as a reusable workflow called by deploy.yml
# to gate the build+push+deploy job.
# `make test` auto-runs manifests/generate/fmt/vet before the test run.
on:
  push:
    branches: [main]
    paths:
      - "lego/operator/**"
      - "lego/types/**"
      - ".github/workflows/operator-test.yml"
  pull_request:
    paths:
      - "lego/operator/**"
      - "lego/types/**"
      - ".github/workflows/operator-test.yml"
  workflow_call: {}

permissions:
  contents: read

jobs:
  operator:
    # Public-repo safety: fork PR code must never reach persistent self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: bex-ci
      labels: [self-hosted, Linux, ARM64]
    env:
      # lego/go.work requires go >= 1.26.0 (lego/cli's pinned upstream CLI),
      # but this job deliberately installs the 1.25 line the release image
      # ships (lego/Dockerfile golang:1.25) and setup-go pins GOTOOLCHAIN=local.
      # The operator module resolves standalone via its
      # `replace …/lego/types => ../types` directive — exactly how the image
      # build compiles it — so test with the workspace off, matching prod.
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lego/operator/go.mod
          cache-dependency-path: lego/operator/go.sum
      - name: make test (operator + envtest)
        working-directory: lego/operator
        run: make test
      # w1/m68: `make test` REGENERATES manifests/deepcopy before running, so a
      # stale committed CRD is silently repaired in the runner and the job stays
      # green — drift ships. That is not hypothetical: `spec.deletedUsers` was
      # added to the Database types on 2026-08-09 without regenerating the CRD,
      # so the API server pruned the field and the security fix that introduced
      # it (a deleted Postgres login role must actually be dropped) was inert in
      # production from the day it shipped. Fail on any codegen the tree is
      # missing.
      - name: generated output is committed (codegen drift)
        run: |
          if ! git diff --exit-code -- lego/types lego/operator/config; then
            echo "::error::committed codegen is stale — run 'make manifests generate' from lego/operator/ and commit the result" >&2
            exit 1
          fi
