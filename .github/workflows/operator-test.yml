name: test (operator)

# Run the operator test suite (unit + envtest) on every PR touching
# lego/operator or lego/types, and as a reusable workflow called by deploy.yml
# to gate the build+push+deploy job.
# `make test` auto-runs manifests/generate/fmt/vet before the test run.
# Main pushes run once through deploy.yml; avoid duplicate gates competing on
# the shared Mac host. deploy.yml includes this workflow and all test inputs.
on:
  pull_request:
    paths:
      - "lego/operator/**"
      - "lego/types/**"
      - ".github/workflows/operator-test.yml"
  workflow_call: {}

permissions:
  contents: read

jobs:
  operator:
    # Public-repo safety: fork PR code must never reach persistent self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, bex-ci]
    env:
      # GOWORK=off: the operator module resolves standalone via its
      # `replace …/lego/types => ../types` directive — exactly how the release
      # image (lego/Dockerfile golang:1.26, no go.work) compiles it — so test
      # with the workspace off, matching prod. Go version follows
      # lego/operator/go.mod (the 1.26 line); setup-go pins GOTOOLCHAIN=local.
      GOWORK: "off"
      # Exercise persistence conversion with the pinned Valkey 7/8 images.
      BEX_TEST_VALKEY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lego/operator/go.mod
          # Multi-GB remote Go caches outlive signed download URLs and stall
          # uploads on this fleet; keep the runner-local Go caches instead.
          cache: false
      # TestValkeyPersistenceEngine's `docker run` of the pinned Valkey images
      # was killed at its 240s budget while the runner's Docker Hub pull stalled
      # (run 39524511518). Pull the exact pins the operator ships, read from its
      # source so they cannot drift, with retries, so the test starts from cache.
      - name: pull pinned Valkey images (with retries)
        run: |
          for image in $(grep -oE 'valkey/valkey:[0-9]+-alpine@sha256:[0-9a-f]{64}' lego/operator/internal/controller/keyvalue_controller.go | sort -u); do
            for i in 1 2 3 4 5; do
              docker pull "$image" && break
              [ "$i" -lt 5 ] || exit 1
              echo "pull $image attempt $i failed, retrying in $((i * 20))s..."; sleep $((i * 20))
            done
          done
      - name: make test (operator + envtest)
        working-directory: lego/operator
        run: make test
      # w1/m68: `make test` REGENERATES manifests/deepcopy before running, so a
      # stale committed CRD is silently repaired in the runner and the job stays
      # green — drift ships. That is not hypothetical: `spec.deletedUsers` was
      # added to the Database types on 2026-08-09 without regenerating the CRD,
      # so the API server pruned the field and the security fix that introduced
      # it (a deleted Postgres login role must actually be dropped) was inert in
      # production from the day it shipped. Fail on any codegen the tree is
      # missing.
      - name: generated output is committed (codegen drift)
        run: |
          if ! git diff --exit-code -- lego/types lego/operator/config; then
            echo "::error::committed codegen is stale — run 'make manifests generate' from lego/operator/ and commit the result" >&2
            exit 1
          fi
