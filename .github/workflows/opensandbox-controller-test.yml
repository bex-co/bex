name: test (OpenSandbox controller patches)

on:
  push:
    branches: [main]
    paths:
      - "deploy/opensandbox/controller.Dockerfile"
      - "deploy/opensandbox/patches/**"
      - ".github/workflows/opensandbox-controller-test.yml"
  pull_request:
    paths:
      - "deploy/opensandbox/controller.Dockerfile"
      - "deploy/opensandbox/patches/**"
      - ".github/workflows/opensandbox-controller-test.yml"
  workflow_call: {}

permissions:
  contents: read

jobs:
  controller:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      # A self-hosted runner REUSES its _work directory between runs, unlike an
      # ephemeral hosted one. This job's envtest step downloads the Kubernetes
      # control-plane binaries into .opensandbox-upstream/kubernetes/bin/k8s/…
      # and setup-envtest marks those directories read-only (0555) — so on the
      # NEXT run actions/checkout cannot clean the workspace and the job dies at
      # step 2 with `EACCES: permission denied, unlink '…/bin/k8s/…/etcd'`,
      # before a single test runs. Restore write permission and drop the tree
      # before checkout looks at it. Idempotent, and a no-op on a clean runner.
      - name: reclaim the persistent runner workspace
        run: |
          stale="${GITHUB_WORKSPACE}/.opensandbox-upstream"
          [ -e "$stale" ] || exit 0
          chmod -R u+w "$stale" 2>/dev/null || true
          rm -rf "$stale"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: upstream
        name: Apply carried patches to the pinned upstream controller
        run: |
          commit="$(sed -n 's/^ARG OPENSANDBOX_COMMIT=//p' deploy/opensandbox/controller.Dockerfile)"
          test "$(printf '%s' "$commit" | wc -c | tr -d ' ')" = 40
          upstream="$GITHUB_WORKSPACE/.opensandbox-upstream"
          echo "path=.opensandbox-upstream" >> "$GITHUB_OUTPUT"
          git init -q "$upstream"
          git -C "$upstream" remote add origin https://github.com/alibaba/OpenSandbox
          git -C "$upstream" fetch -q --depth 1 origin "$commit"
          git -C "$upstream" checkout -q FETCH_HEAD
          git -C "$upstream" apply "$GITHUB_WORKSPACE/deploy/opensandbox/patches/controller-snapshot-job-namespace.patch"
          git -C "$upstream" apply "$GITHUB_WORKSPACE/deploy/opensandbox/patches/controller-terminal-pod-status.patch"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.7
          cache-dependency-path: ${{ steps.upstream.outputs.path }}/kubernetes/go.sum
      - name: Real-controller envtest suite
        working-directory: ${{ steps.upstream.outputs.path }}/kubernetes
        run: make test
