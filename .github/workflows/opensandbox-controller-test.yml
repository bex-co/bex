name: test (OpenSandbox controller patches)

# Main pushes run once through deploy.yml; avoid duplicate gates competing for
# runners. deploy.yml includes this workflow and all test inputs.
on:
  pull_request:
    paths:
      - "deploy/opensandbox/controller.Dockerfile"
      - "deploy/opensandbox/patches/**"
      - ".github/workflows/opensandbox-controller-test.yml"
  workflow_call: {}

permissions:
  contents: read

# A PR's newer push cancels its superseded run. Inside deploy.yml's
# workflow_call `github.workflow` names the caller, so the group uses a fixed
# prefix and the caller's run id: deploy runs never cancel each other's gates.
concurrency:
  group: opensandbox-controller-test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  controller:
    # Public-repo safety (github-actions-validate.sh rule 7): fork PR heads never run this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
      - id: upstream
        name: Apply carried patches to the pinned upstream controller
        run: |
          commit="$(sed -n 's/^ARG OPENSANDBOX_COMMIT=//p' deploy/opensandbox/controller.Dockerfile)"
          test "$(printf '%s' "$commit" | wc -c | tr -d ' ')" = 40
          upstream="$GITHUB_WORKSPACE/.opensandbox-upstream"
          echo "path=.opensandbox-upstream" >> "$GITHUB_OUTPUT"
          git init -q "$upstream"
          git -C "$upstream" remote add origin https://github.com/alibaba/OpenSandbox
          git -C "$upstream" fetch -q --depth 1 origin "$commit"
          git -C "$upstream" checkout -q FETCH_HEAD
          git -C "$upstream" apply "$GITHUB_WORKSPACE/deploy/opensandbox/patches/controller-snapshot-job-namespace.patch"
          git -C "$upstream" apply "$GITHUB_WORKSPACE/deploy/opensandbox/patches/controller-terminal-pod-status.patch"
          git -C "$upstream" apply "$GITHUB_WORKSPACE/deploy/opensandbox/patches/controller-pool-recycle-test-conflict.patch"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.7
          # Hosted runners start empty. The old runner kept ~/go/pkg/mod, so a
          # restore there only re-extracted identical files (w8/m42 t003); on a
          # fresh VM it replaces every module download of the upstream tree.
          cache-dependency-path: .opensandbox-upstream/kubernetes/go.sum
      # Upstream's Makefile downloads the envtest control plane into its own
      # bin/ with a single attempt, so every run fetched it from GitHub
      # releases, whose 502/503s failed two deploys' test stages on 2026-11-08
      # (runs 42463190719, 42471620968). Keep the binaries in a home cache
      # restored from the Actions cache (keyed on the pinned upstream commit,
      # which fixes the Kubernetes version), fetched with retries only when
      # missing, and point upstream's bin/k8s at it: setup-envtest then finds
      # the version on disk and never contacts GitHub.
      - name: restore envtest binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bex-envtest
          key: bex-envtest-opensandbox-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deploy/opensandbox/controller.Dockerfile') }}
      - name: Envtest binaries from the cache
        working-directory: ${{ steps.upstream.outputs.path }}/kubernetes
        run: |
          cache="$HOME/.cache/bex-envtest"
          mkdir -p "$cache" bin
          make envtest
          version="$(go list -m -f '{{ .Version }}' k8s.io/api | awk -F'[v.]' '{printf "1.%d", $3}')"
          for attempt in 1 2 3 4 5; do
            bin/setup-envtest use "$version" --bin-dir "$cache" -p path && break
            [ "$attempt" -lt 5 ] || exit 1
            echo "envtest $version attempt $attempt failed; retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          ln -sfn "$cache/k8s" bin/k8s
      - name: Real-controller envtest suite
        working-directory: ${{ steps.upstream.outputs.path }}/kubernetes
        run: make test
