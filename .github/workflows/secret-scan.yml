name: secret scan
# Scans each push to main for credentials (ADR019 §6). A finding, or a scan
# that did not finish, lists the run on the `secret-scan` tracking issue.
on:
  push:
    branches: [main]

permissions:
  contents: read

# No concurrency group: each run scans only its own push, so a run superseded
# while pending would leave that push unscanned.
jobs:
  scan:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    outputs:
      leak: ${{ steps.scan.outputs.leak }}
    steps:
      # History without blobs (about 12 MiB): scripts/gitleaks.sh fetches the
      # pushed commits' blobs, and nothing else in the tree is read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/gitleaks.sh
            /scripts/ci-fetch-verified.sh
      - name: scan the pushed commits for secrets
        id: scan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          # main refuses deletion and force-pushes, so BEFORE is always behind
          # AFTER; anything else fails here rather than guess a range.
          GIT_NO_LAZY_FETCH=1 git merge-base --is-ancestor "$BEFORE_SHA" "$AFTER_SHA"
          rc=0
          bash scripts/gitleaks.sh "$BEFORE_SHA..$AFTER_SHA" || rc=$?
          [ "$rc" != 1 ] || echo "leak=true" >> "$GITHUB_OUTPUT"
          exit "$rc"

  alert:
    needs: scan
    # Also when the scan was cancelled or never ran: the push is unscanned.
    if: always() && needs.scan.result != 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/secret-scan-alert.sh
            /scripts/lib/
      - name: list this run on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          LEAK: ${{ needs.scan.outputs.leak }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$LEAK" = true ]; then kind=leak; else kind=error; fi
          bash scripts/secret-scan-alert.sh "$kind" "$RUN_URL"
