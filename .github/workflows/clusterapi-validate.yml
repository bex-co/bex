name: clusterapi (validate)

# Structural guard for the CAPH overlay + packer bake (w1/m36 t007): keeps the
# baked-worker-image win from silently regressing. Fails if a worker template
# drifts back to ubuntu-24.04, or a worker preKubeadmCommands block re-adds the
# runc/containerd/kubelet download, the `kubeadm config images pull`, a
# pkgs.k8s.io apt install, or a trimmed apt package. Pure client-side (yq only),
# no cluster. Fix locally with: bash scripts/clusterapi-validate.sh
on:
  pull_request:
    paths:
      - "infra/clusterapi/overlays/hetzner-caph/**"
      # w2/m81: the kubelet serving-cert rotation guard also asserts against
      # the CAPD mock overlay (kubeletExtraArgs list form vs CAPH's map form).
      - "infra/clusterapi/overlays/local-capd/**"
      - "infra/packer/**"
      - ".github/workflows/snapshot.yml"
      - "scripts/clusterapi-validate.sh"
      - ".github/workflows/clusterapi-validate.yml"
      # w7/m83: the build-pool scheduling floor is computed from the gitops
      # DaemonSets and build.go's memory request, so a change to either can
      # break the overlay's arithmetic without touching infra/.
      - "deploy/gitops/base/**"
      - "lego/operator/config/**"
      - "lego/operator/internal/build/build.go"
  push:
    branches: [main]
    paths:
      - "infra/clusterapi/overlays/hetzner-caph/**"
      - "infra/clusterapi/overlays/local-capd/**"
      - "infra/packer/**"
      - ".github/workflows/snapshot.yml"
      - "scripts/clusterapi-validate.sh"
      - ".github/workflows/clusterapi-validate.yml"
      # w7/m83: the build-pool scheduling floor is computed from the gitops
      # DaemonSets and build.go's memory request, so a change to either can
      # break the overlay's arithmetic without touching infra/.
      - "deploy/gitops/base/**"
      - "lego/operator/config/**"
      - "lego/operator/internal/build/build.go"

permissions:
  contents: read

concurrency:
  group: clusterapi-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Public-repo safety: fork PR code must never reach persistent self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, bex-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install yq
        # Always download + checksum-verify into the ephemeral $RUNNER_TEMP and
        # prepend it to PATH — never short-circuit on a yq already in PATH. On a
        # persistent self-hosted runner a prior (possibly attacker-planted) yq
        # could otherwise be reused unverified across jobs (codex-security
        # target #2); $RUNNER_TEMP is per-job, so the verified binary always wins.
        run: |
          YQ_VERSION=4.44.6
          YQ_LINUX_ARM64_SHA256=9477ac3cc447b6c083986129e35af8122eb2b938fe55c9c3e40436fb966e5813
          archive="$RUNNER_TEMP/yq"
          curl -fsSL -o "$archive" \
            "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_arm64"
          echo "$YQ_LINUX_ARM64_SHA256  $archive" | sha256sum -c -
          chmod +x "$archive"
          install -m755 -D "$archive" "$RUNNER_TEMP/bin/yq"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/yq" --version
      - name: validate CAPH overlay shape
        run: bash scripts/clusterapi-validate.sh
