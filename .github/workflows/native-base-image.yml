name: native base images (build + verify)

# Shared publication gates. The user selected one common Bookworm foundation.
# Existing per-line requests may finish through explicit singleton dispatches;
# changing a runtime or recipe must never launch another automatic C matrix.
on:
  workflow_dispatch:
    inputs:
      runtime:
        description: "One existing reviewed runtime to finish, or common-bookworm; never an empty/full C matrix"
        required: true
        type: string
  workflow_call:
    inputs:
      runtime:
        required: true
        type: string
    outputs:
      ref:
        description: Immutable image after every publication gate succeeds
        value: ${{ jobs.build.outputs.ref }}
      producer:
        description: Source which produced the published image
        value: ${{ jobs.build.outputs.producer }}
      verification:
        description: Source which completed runtime, scan and signing gates
        value: ${{ jobs.build.outputs.verification }}

permissions:
  contents: read

# Reuse an existing public package so tenants can pull without registry credentials.
env:
  NATIVE_IMAGE: ghcr.io/bex-co/bex-cnb-run

jobs:
  matrix:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, bex-ci]
    outputs:
      images: ${{ steps.matrix.outputs.images }}
      publish: ${{ steps.matrix.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: test verified OCI staging and publication gates
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_native_oci_*.py'
          python3 -B -m unittest discover -s deploy/native-base -p '*_test.py'
          python3 -B -m unittest discover -s deploy/native-common -p '*_test.py'
      - id: matrix
        env:
          TARGET_RUNTIME: ${{ inputs.runtime }}
        run: |
          if [ "$TARGET_RUNTIME" = common-bookworm ]; then
            images=$(python3 deploy/native-common/matrix.py)
          else
            images=$(python3 deploy/native-base/matrix.py)
            images=$(IMAGES="$images" python3 - <<'PY'
          import json, os
          matrix = json.loads(os.environ['IMAGES'])
          rows = [row for row in matrix['include'] if row['name'] == os.environ['TARGET_RUNTIME']]
          if len(rows) != 1:
              raise SystemExit('runtime must match one reviewed matrix name')
          print(json.dumps({'include': rows}, separators=(',', ':')))
          PY
            )
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: github.ref == 'refs/heads/main' && needs.matrix.outputs.publish == 'true'
    runs-on: [self-hosted, Linux, ARM64, bex-production]
    permissions:
      contents: read
      packages: write
      id-token: write
    # The input contract selects exactly one row; these are never a matrix
    # aggregation or the pre-gate candidate digest.
    outputs:
      ref: ${{ steps.published.outputs.ref }}
      producer: ${{ steps.published.outputs.producer }}
      verification: ${{ steps.published.outputs.verification }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.matrix.outputs.images) }}
    # Finish an expensive running build instead of losing its work.
    # New recipes replace pending work, never the same runtime already running.
    concurrency:
      group: native-base-${{ matrix.name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: log in to GHCR with bounded transport retries
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if printf '%s' "$GHCR_TOKEN" | timeout 60s docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin; then
              exit 0
            fi
            [ "$attempt" -lt 3 ] || exit 1
            sleep "$((attempt * 5))"
          done
      - name: select a reviewed recovery artifact when its recipe is unchanged
        id: recovery
        if: matrix.name != 'common-bookworm'
        env:
          MATRIX_NAME: ${{ matrix.name }}
          BASE_IMAGE: ${{ matrix.base }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          path = Path('.github/native-base-recovery.json')
          if not path.exists():
              raise SystemExit(0)
          data = json.loads(path.read_text())
          if data.get('schema') != 'bex.native-publisher-recovery/v1':
              raise SystemExit('invalid recovery authorization schema')
          entry = data['images'].get(os.environ['MATRIX_NAME'])
          if entry is None or entry['base'] != os.environ['BASE_IMAGE']:
              raise SystemExit(0)
          ref, producer = entry['ref'], entry['producer']
          prefix = os.environ['NATIVE_IMAGE'] + '@'
          if not ref.startswith(prefix) or not re.fullmatch(r'sha256:[0-9a-f]{64}', ref[len(prefix):]) or not re.fullmatch(r'[0-9a-f]{40}', producer):
              raise SystemExit('recovery requires a reviewed same-package digest and producer')
          if subprocess.run(['git', 'cat-file', '-e', producer + '^{commit}'], capture_output=True).returncode:
              subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', producer], check=True)
          changed = subprocess.check_output(['git', 'diff', '--no-renames', '--name-only', producer, 'HEAD', '--', 'deploy/native-base'], text=True).splitlines()
          if any(not name.endswith('.md') for name in changed):
              print('Recovery recipe changed; building from source')
              raise SystemExit(0)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('digest=' + ref[len(prefix):] + '\nproducer=' + producer + '\n')
          print('Rechecking reviewed artifact ' + ref + '; producer ' + producer + '; original job ' + str(entry['job_id']))
          PY
      - id: build
        if: steps.recovery.outputs.digest == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.name == 'common-bookworm' && 'deploy' || 'deploy/native-base' }}
          file: ${{ matrix.name == 'common-bookworm' && 'deploy/native-common/Dockerfile' || 'deploy/native-base/Dockerfile' }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ env.NATIVE_IMAGE }}:native-${{ matrix.name }}
          cache-to: type=inline
          build-args: BASE_IMAGE=${{ matrix.base }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.NATIVE_IMAGE }}:native-${{ matrix.name }}-${{ github.sha }}
      - id: candidate
        env:
          RECOVERED: ${{ steps.recovery.outputs.digest }}
          PRODUCER: ${{ steps.recovery.outputs.producer }}
          BUILT: ${{ steps.build.outputs.digest }}
        run: |
          digest="${RECOVERED:-$BUILT}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "producer=${PRODUCER:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: verify real native tool transformations without network on both architectures
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: deploy/native-base
          file: deploy/native-base/check.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: NATIVE_BASE=${{ env.NATIVE_IMAGE }}@${{ steps.candidate.outputs.digest }}
      # Runtime probes above gate the repaired system and bundled decoders.
      # Report every known vulnerability as well, including unfixed findings;
      # old Node versions may still match version-only CVE rules after backport.
      # Never hide these with a global CVE ignore or treat an SBOM as a probe.
      - name: prepare bounded full-scan retries
        run: |
          # Keep all scans and subjects unchanged; stage verified complete layers.
          cat > "$RUNNER_TEMP/native-trivy" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          set +o posix
          : "${TRIVY_OUTPUT:?missing scan report path}"
          : "${TRIVY_CACHE_DIR:?missing shared Trivy cache}"
          : "${TRIVY_PLATFORM:?missing explicit architecture}"
          max_image_bytes=$((8 * 1024 * 1024 * 1024))
          minimum_kib=$(((3 * max_image_bytes + 4 * 1024 * 1024 * 1024) / 1024))
          mkdir -p "$TRIVY_CACHE_DIR"
          require_space() {
            local space
            space=$(df -Pk "$RUNNER_TEMP" "$TRIVY_CACHE_DIR")
            printf '%s\n' "$space"
            printf '%s\n' "$space" | awk -v minimum="$minimum_kib" '
              NR > 1 { if ($4 !~ /^[0-9]+$/ || $4 < minimum) exit 1; rows++ }
              END { if (rows != 2) exit 1 }
            '
          }
          rm -f -- "$TRIVY_OUTPUT"
          require_space
          work_dir=$(mktemp -d "$RUNNER_TEMP/native-trivy.XXXXXXXX")
          trap 'rm -rf -- "$work_dir"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          # Bash uses KiB for RLIMIT_FSIZE. Bound each staged layer before copying it.
          ulimit -c 0
          ulimit -f "$((max_image_bytes / 1024))"
          mkdir "$work_dir/db"
          # Finish both databases before starting any complete 20m image scan.
          for database in --download-db-only --download-java-db-only; do
            # JavaDB is almost 1GiB; keep its fetch outside the complete scan budget.
            database_timeout=21m
            if [ "$database" = --download-java-db-only ]; then database_timeout=30m; fi
            TMPDIR="$work_dir/db" env -u TRIVY_OUTPUT timeout --kill-after=10s "$database_timeout" trivy image "$database"
          done
          # Retry and SHA/size-verify individual public blobs before Trivy starts.
          # Keep the original index bytes: a projected OCI index changes identity.
          [ "$1" = image ] && [ "$#" -ge 2 ]
          ref="$2"
          arch="${TRIVY_PLATFORM#linux/}"
          stage_proof="$PWD/native-$arch-trivy-oci-stage.json"
          timeout --kill-after=10s 30m python3 .github/scripts/native-oci-stage.py \
            --ref "$ref" --platform "$TRIVY_PLATFORM" --output "$work_dir/layout" --proof "$stage_proof"
          for attempt in 1 2 3; do
            require_space
            rm -f -- "$TRIVY_OUTPUT"
            attempt_dir="$work_dir/attempt-$attempt"
            mkdir "$attempt_dir"
            # The helper enforces the same complete 21m scan + 10s termination
            # budget and owns the loopback server, config and scan process group.
            if TMPDIR="$attempt_dir" python3 .github/scripts/native-oci-mirror.py \
              --ref "$ref" --platform "$TRIVY_PLATFORM" --layout "$work_dir/layout" \
              --stage-proof "$stage_proof" --proof "$PWD/native-$arch-trivy-mirror-$attempt.json" \
              --parent-pid "$$" -- trivy "$@" --image-src remote --parallel 1 --max-image-size "${max_image_bytes}B"; then
              exit 0
            fi
            echo "Trivy scan attempt $attempt failed" >&2
            rm -f -- "$TRIVY_OUTPUT"
            rm -rf -- "$attempt_dir"
            [ "$attempt" -lt 3 ] || exit 1
            sleep "$((attempt * 5))"
          done
          SH
          chmod 755 "$RUNNER_TEMP/native-trivy"
      - name: scan amd64 candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
          # Long layer streams failed twice with peer HTTP/2 PROTOCOL_ERROR.
          GODEBUG: http2client=0
          TRIVY_CMD: ${{ runner.temp }}/native-trivy
        with:
          cache: false
          image-ref: ${{ env.NATIVE_IMAGE }}@${{ steps.candidate.outputs.digest }}
          format: json
          output: native-amd64.trivy.json
          timeout: "20m"
          exit-code: "0"
      - name: scan arm64 candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
          GODEBUG: http2client=0
          TRIVY_CMD: ${{ runner.temp }}/native-trivy
        with:
          cache: false
          image-ref: ${{ env.NATIVE_IMAGE }}@${{ steps.candidate.outputs.digest }}
          format: json
          output: native-arm64.trivy.json
          timeout: "20m"
          exit-code: "0"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.55.0
      - name: sign and attest the immutable candidate
        env:
          REF: ${{ env.NATIVE_IMAGE }}@${{ steps.candidate.outputs.digest }}
          PRODUCER: ${{ steps.candidate.outputs.producer }}
        run: |
          syft_work_dir="$(mktemp -d "$RUNNER_TEMP/native-syft.XXXXXX")"
          trap 'rm -rf -- "$syft_work_dir"' EXIT
          # Staged compressed blobs and Syft's cache share this checked filesystem.
          # This is a capacity check, not a reservation against parallel jobs.
          available_kib="$(df -Pk "$syft_work_dir" | awk 'NR == 2 {print $4}')"
          if ! [[ "$available_kib" =~ ^[0-9]+$ ]] || (( available_kib < 28 * 1024 * 1024 )); then
            echo 'Native SBOM staging needs at least 28 GiB of free space' >&2
            exit 1
          fi
          # Rekor v2 logs signed PAE hashes; complete predicates remain
          # in signed OCI bundles. Exhausted retries stop tag publication.
          retry_signing() {
            for attempt in 1 2 3; do
              if timeout --kill-after=10s 5m "$@"; then
                return 0
              fi
              [ "$attempt" -lt 3 ] || return 1
              sleep "$((attempt * 5))"
            done
          }
          generate_sbom() {
            local arch="$1"
            local output="native-$arch.spdx.json"
            local layout="$syft_work_dir/$arch/layout"
            local cache="$syft_work_dir/$arch/cache"
            local proof="$PWD/native-$arch-oci-stage.json"
            local stage_status=0
            mkdir -p -- "$cache"
            rm -f -- "$output"
            # Retry individual authenticated blobs, retaining verified progress.
            # Syft then reads exact OCI bytes locally, with no registry stream.
            timeout --kill-after=10s 30m python3 .github/scripts/native-oci-stage.py \
              --ref "$REF" --platform "linux/$arch" --output "$layout" --proof "$proof" \
              || stage_status=$?
            if [ -f "$proof" ]; then cat "$proof"; fi
            if [ "$stage_status" -ne 0 ]; then
              echo "Native OCI staging $arch failed with exit $stage_status" >&2
              return "$stage_status"
            fi
            for attempt in 1 2 3; do
              rm -f -- "$output"
              rm -rf -- "${cache:?}"
              mkdir -p -- "$cache"
              if TMPDIR="$cache" GODEBUG=http2client=0 SYFT_CHECK_FOR_APP_UPDATE=false \
                timeout --kill-after=10s 30m syft scan "oci-dir:$layout" \
                  --source-name "$NATIVE_IMAGE" --source-version "${REF##*@}" \
                  --platform "linux/$arch" -o spdx-json > "$output"; then
                rm -rf -- "${syft_work_dir:?}/${arch:?}"
                return 0
              fi
              echo "Syft $arch attempt $attempt failed" >&2
              rm -f -- "$output"
              [ "$attempt" -lt 3 ] || return 1
              sleep "$((attempt * 5))"
            done
          }
          retry_signing cosign signing-config create --with-default-rekor-v2 --out "$RUNNER_TEMP/native-signing-config.json"
          retry_signing cosign sign --yes --oidc-provider=github-actions --signing-config "$RUNNER_TEMP/native-signing-config.json" "$REF"
          for arch in amd64 arm64; do
            generate_sbom "$arch"
            retry_signing cosign attest --yes --oidc-provider=github-actions --signing-config "$RUNNER_TEMP/native-signing-config.json" --type spdxjson --predicate "native-$arch.spdx.json" "$REF"
            retry_signing cosign attest --yes --oidc-provider=github-actions --signing-config "$RUNNER_TEMP/native-signing-config.json" --type https://aquasecurity.github.io/trivy/attestation/vuln/v1 --predicate "native-$arch.trivy.json" "$REF"
          done
          # Only verified, scanned and signed candidates reach this discovery
          # tag. Adopting its immutable digest still requires a reviewed commit.
          docker buildx imagetools create --tag "${{ env.NATIVE_IMAGE }}:native-${{ matrix.name }}-${GITHUB_SHA}" "$REF"
          docker buildx imagetools create --tag "${{ env.NATIVE_IMAGE }}:native-${{ matrix.name }}" "$REF"
          echo "${{ matrix.base }} -> $REF (producer $PRODUCER; verification $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - id: published
        name: expose the fully gated immutable image
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          PRODUCER: ${{ steps.candidate.outputs.producer }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$PRODUCER" =~ ^[a-f0-9]{40}$ ]]
          {
            echo "ref=${NATIVE_IMAGE}@${DIGEST}"
            echo "producer=$PRODUCER"
            echo "verification=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
      - name: remove GHCR credentials
        if: always()
        run: docker logout ghcr.io
