name: native base images (build + verify)

# Publishes immutable candidates. The operator adopts only reviewed digests
# in a subsequent commit, per ADR060 D7.
on:
  push:
    branches: [main]
    paths:
      - "deploy/native-base/**"
      - ".github/workflows/native-base-image.yml"
      - "lego/operator/internal/build/native.go"
  workflow_dispatch: {}

permissions:
  contents: read

# Reuse an existing public package so tenants can pull without registry credentials.
env:
  NATIVE_IMAGE: ghcr.io/bex-co/bex-cnb-run

jobs:
  matrix:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, bex-ci]
    outputs:
      images: ${{ steps.matrix.outputs.images }}
      publish: ${{ steps.matrix.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: matrix
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "images=$(python3 deploy/native-base/matrix.py)" >> "$GITHUB_OUTPUT"
          publish=true
          if [ "$EVENT_NAME" = push ] && [ -n "$BEFORE" ] && [[ ! "$BEFORE" =~ ^0+$ ]]; then
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BEFORE"
            fi
            if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- deploy/native-base .github/workflows/native-base-image.yml; then
              git show "$BEFORE:lego/operator/internal/build/native.go" > "$RUNNER_TEMP/previous-native.go"
              publish=$(python3 deploy/native-base/matrix.py --changed-from "$RUNNER_TEMP/previous-native.go")
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: github.ref == 'refs/heads/main' && needs.matrix.outputs.publish == 'true'
    runs-on: [self-hosted, Linux, ARM64, bex-production]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.matrix.outputs.images) }}
    # An adoption-only commit must not cancel other candidates still building.
    # Supersede only the same runtime when its publishing inputs really change.
    concurrency:
      group: native-base-${{ matrix.name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: deploy/native-base
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ env.NATIVE_IMAGE }}:native-${{ matrix.name }}
          cache-to: type=inline
          build-args: BASE_IMAGE=${{ matrix.base }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.NATIVE_IMAGE }}:native-${{ matrix.name }}-${{ github.sha }}
      - name: verify real native tool transformations without network on both architectures
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: deploy/native-base
          file: deploy/native-base/check.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: NATIVE_BASE=${{ env.NATIVE_IMAGE }}@${{ steps.build.outputs.digest }}
      # Runtime probes above gate the repaired system and bundled decoders.
      # Report every known vulnerability as well, including unfixed findings;
      # old Node versions may still match version-only CVE rules after backport.
      # Never hide these with a global CVE ignore or treat an SBOM as a probe.
      - name: scan amd64 candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          cache: false
          image-ref: ${{ env.NATIVE_IMAGE }}@${{ steps.build.outputs.digest }}
          format: json
          output: native-amd64.trivy.json
          exit-code: "0"
      - name: scan arm64 candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          cache: false
          image-ref: ${{ env.NATIVE_IMAGE }}@${{ steps.build.outputs.digest }}
          format: json
          output: native-arm64.trivy.json
          exit-code: "0"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: sign and attest the immutable candidate
        env:
          REF: ${{ env.NATIVE_IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes --oidc-provider=github-actions "$REF"
          for arch in amd64 arm64; do
            syft "$REF" --platform "linux/$arch" -o spdx-json > "native-$arch.spdx.json"
            cosign attest --yes --oidc-provider=github-actions --type spdxjson --predicate "native-$arch.spdx.json" "$REF"
            cosign attest --yes --oidc-provider=github-actions --type https://aquasecurity.github.io/trivy/attestation/vuln/v1 --predicate "native-$arch.trivy.json" "$REF"
          done
          # Only verified, scanned and signed candidates reach this discovery
          # tag. Adopting its immutable digest still requires a reviewed commit.
          docker buildx imagetools create --tag "${{ env.NATIVE_IMAGE }}:native-${{ matrix.name }}" "$REF"
          echo "${{ matrix.base }} -> $REF" >> "$GITHUB_STEP_SUMMARY"
