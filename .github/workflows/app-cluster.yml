name: app-cluster (CAPH)

# Phase 2: reconcile the SELF-MANAGED app cluster (w1/m19.1 pivot — CAPI lives
# in the cluster it manages; no mgmt cluster). It:
#   1. fetches the cluster's own kubeconfig (hcloud API -> CP node -> SSH admin.conf)
#   2. ensures CAPH at the pinned version (clusterctl, in-cluster)
#   3. pins every CAPI/CAPH controller to the tainted control-plane pool
#   4. applies the CAPH overlay -> the cluster reconciles its own machines
#   5. ensures the addons: CNI (Cilium) + Hetzner CCM + CSI
#
# Runs in CI, never a laptop. Idempotent: re-runnable (clusterctl init / kubectl
# apply / helm upgrade --install / secret apply are all no-ops when unchanged).
#
# Prereq: the app cluster exists and a CP node is SSH-reachable (initial
# bring-up / DR bootstrap happens elsewhere: infra.yml + a temporary mgmt
# cluster, then clusterctl move — docs/ADR002-architecture.md).
# Secrets: HCLOUD_TOKEN, BEX_SSH_PRIVATE_KEY (to read admin.conf off a CP node).

on:
  push:
    branches: [main]
    paths:
      - "infra/clusterapi/overlays/hetzner-caph/**"
      - "scripts/fetch-app-kubeconfig.sh"
      - "scripts/helm-artifact.sh"
      - "scripts/wait-capi-rollout.sh"
      - "deploy/helm-artifacts.lock"
      - ".github/workflows/app-cluster.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
  CLUSTER_NAME: bex
  POD_CIDR: 10.244.0.0/16 # must match the overlay's clusterNetwork.pods.cidrBlocks
  CAPH_VERSION: v1.1.7 # v1.0.x webhook had a stale server-type enum (rejected cx33); v1.1.x dropped it
  CLUSTERCTL_VERSION: v1.13.2
  CLUSTERCTL_LINUX_ARM64_SHA256: d1b97f0a31180accf73a20112a5e746c6cadcd58324b38bc8438a591ef9ecaa1

jobs:
  bootstrap-app-cluster:
    # Ref guard (scan finding #2): this job SSH-fetches admin.conf and reconciles
    # the cluster with HCLOUD_TOKEN + BEX_SSH_PRIVATE_KEY, so it must run ONLY from
    # the reviewed default branch — a workflow_dispatch from a same-repo branch is
    # skipped before any secret is touched. Defense in depth alongside GitHub-side
    # protected environments (see infra.yml).
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64]
    # codex-security round-19 #1: this job's own comments named "GitHub-side
    # protected environments (see infra.yml)" as the authoritative control, but
    # unlike infra.yml's `terraform` job it carried no `environment:` — so the
    # ref guard above was the ONLY gate, and a malicious change merged to main
    # reached HCLOUD_TOKEN + admin.conf automatically with no independent
    # approval. Matches the infra.yml/snapshot.yml/cli-release.yml pattern:
    # configure required reviewers on this environment in repo settings.
    environment: production-cluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0

      # --- fetch the cluster's own kubeconfig via a CP node (self-managed, w1/m19.1) ---
      # codex-security 2026-08 F6: credentials stage under $RUNNER_TEMP
      # (auto-deleted at job end; scrubbed again by the final step) — never
      # ~/.ssh or $PWD, which persist on the shared self-hosted runner.
      - name: fetch app cluster kubeconfig (via a CP node)
        env:
          # Funneled through env rather than interpolated into the script body,
          # the repo's standing injection-safety convention for secrets.
          BEX_SSH_PRIVATE_KEY: ${{ secrets.BEX_SSH_PRIVATE_KEY }}
          BEX_SSH_KNOWN_HOSTS: ${{ secrets.BEX_SSH_KNOWN_HOSTS }}
        run: |
          install -m700 -d "$RUNNER_TEMP/bex-ssh"
          printf '%s\n' "$BEX_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/bex-ssh/id_bex"
          chmod 600 "$RUNNER_TEMP/bex-ssh/id_bex"
          export BEX_SSH_KEY_PATH="$RUNNER_TEMP/bex-ssh/id_bex"
          # Authenticate the control-plane host key (w1/m66 F7): the pin makes
          # the fetch fail closed on an unknown/changed key instead of trusting
          # it on first use. w1/m68 t006 captured + provisioned the
          # BEX_SSH_KNOWN_HOSTS secret (2026-08-13), so mandatory-pin mode is
          # asserted: a missing/empty pin aborts rather than reverting to TOFU.
          # Re-capture on control-plane template rotation (ADR053).
          export BEX_SSH_REQUIRE_KNOWN_HOSTS=1
          if [ -n "${BEX_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "${BEX_SSH_KNOWN_HOSTS}" > "$RUNNER_TEMP/bex-ssh/bex_known_hosts"
            chmod 600 "$RUNNER_TEMP/bex-ssh/bex_known_hosts"
            export BEX_SSH_KNOWN_HOSTS_FILE="$RUNNER_TEMP/bex-ssh/bex_known_hosts"
          fi
          bash scripts/fetch-app-kubeconfig.sh "$RUNNER_TEMP/app.kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/app.kubeconfig" >> "$GITHUB_ENV"

      - name: scrub job credentials
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/bex-ssh"
          rm -f -- "$RUNNER_TEMP/app.kubeconfig"

      # --- tools ---
      # Cache the ~65MB clusterctl binary keyed on its version (w1/m36 t004): a
      # warm cache skips the download; bumping CLUSTERCTL_VERSION busts the key.
      - name: cache clusterctl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/clusterctl
          key: clusterctl-${{ env.CLUSTERCTL_VERSION }}-linux-arm64
      - name: install clusterctl
        run: |
          if [ ! -x /tmp/clusterctl ]; then
            curl -fsSL -o /tmp/clusterctl \
              "https://github.com/kubernetes-sigs/cluster-api/releases/download/${CLUSTERCTL_VERSION}/clusterctl-linux-arm64"
          fi
          printf '%s  %s\n' "$CLUSTERCTL_LINUX_ARM64_SHA256" /tmp/clusterctl | sha256sum --check --strict
          sudo install -m755 /tmp/clusterctl /usr/local/bin/clusterctl
          clusterctl version

      # --- install/upgrade CAPH in the app cluster itself (idempotent across version bumps) ---
      # clusterctl init is one-shot; to change provider version we delete just the
      # infrastructure provider (keeps CAPI core + CRDs + any Cluster objects) and
      # re-init it. The canonical version lives on the clusterctl Provider object.
      - name: ensure CAPH at desired version
        run: |
          cur=$(kubectl get providers -A -o jsonpath='{.items[?(@.metadata.name=="infrastructure-hetzner")].version}' 2>/dev/null || true)
          if [ -z "$cur" ]; then
            echo "CAPH not installed — init ${CAPH_VERSION}"
            clusterctl init --infrastructure "hetzner:${CAPH_VERSION}"
          elif [ "$cur" != "${CAPH_VERSION}" ]; then
            echo "CAPH ${cur} -> ${CAPH_VERSION} (replace infrastructure provider)"
            clusterctl delete --infrastructure hetzner
            clusterctl init --infrastructure "hetzner:${CAPH_VERSION}"
          else
            echo "CAPH already at ${CAPH_VERSION}"
          fi
      # clusterctl's upstream provider manifests tolerate control-plane taints but
      # do not select those nodes. In the self-managed cluster that lets all four
      # infrastructure-critical controllers drift onto disposable tenant nodes.
      # Reapply this desired placement after every init/upgrade because clusterctl
      # remains the owner of the provider manifests.
      - name: pin CAPI/CAPH controllers to control-plane nodes
        run: |
          for ns in \
            capi-system \
            caph-system \
            capi-kubeadm-bootstrap-system \
            capi-kubeadm-control-plane-system; do
            kubectl -n "$ns" get deployment -o name |
              while IFS= read -r deployment; do
                kubectl -n "$ns" patch "$deployment" --type=merge \
                  -p '{"spec":{"template":{"spec":{"nodeSelector":{"node-role.kubernetes.io/control-plane":""}}}}}'
              done
          done
      - name: wait for CAPI/CAPH controllers
        run: |
          for ns in \
            cert-manager \
            capi-system \
            caph-system \
            capi-kubeadm-bootstrap-system \
            capi-kubeadm-control-plane-system; do
            kubectl -n "$ns" wait --for=condition=Available deploy --all --timeout=300s
          done

      # Namespaces are immutable and two Cluster objects named bex would race to
      # manage the same Hetzner fleet. Refuse an ordinary workflow run until the
      # one-time migration runbook has moved the existing object graph.
      - name: require locked-down CAPI namespace migration
        run: |
          if kubectl -n default get cluster "$CLUSTER_NAME" >/dev/null 2>&1; then
            echo "legacy default/$CLUSTER_NAME still exists; run docs/runbooks/operator-kubeconfig-isolation.md before applying the bex-capi overlay" >&2
            exit 1
          fi

      # --- credential Secret (hcloud-only; robot keys only needed for bare-metal) ---
      - name: hetzner credential secret (app cluster, locked-down CAPI namespace)
        run: |
          kubectl create namespace bex-capi --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic hetzner -n bex-capi \
            --from-literal=hcloud="$HCLOUD_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      # --- apply the overlay -> the cluster reconciles its own machines ---
      - name: apply CAPH overlay
        run: kubectl apply -f infra/clusterapi/overlays/hetzner-caph/cluster.yaml
      # A version bump is not complete when the desired object merely applies.
      # Wait for KCP and every MachineDeployment to finish their own staged
      # rollout and for every replacement Node's kubelet to report that version.
      - name: wait for app cluster fleet rollout
        run: bash scripts/wait-capi-rollout.sh

      # cluster-autoscaler is Argo-managed post-pivot (deploy/gitops/base/autoscaler.yaml).

      # ====== addons ======
      # hcloud token secret the CCM + CSI both read. `network` is the CAPH-managed
      # private network name (= the cluster name, w1/m7 t005); the CCM reads it as
      # HCLOUD_NETWORK when networking.enabled=true to program pod-CIDR routes and
      # private-IP LoadBalancer targets.
      - name: hcloud secret (app cluster, ns kube-system)
        run: |
          kubectl -n kube-system create secret generic hcloud \
            --from-literal=token="$HCLOUD_TOKEN" \
            --from-literal=network="$CLUSTER_NAME" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Hetzner CCM: initializes nodes (clears the cloud-provider taint) + LoadBalancers.
      # Network-aware (HCLOUD_NETWORK=bex from the secret above) so the Traefik LB
      # attaches to the bex private network and targets nodes by PRIVATE IP
      # (load-balancer.hetzner.cloud/use-private-ip, w1/m7 t005, enabled live 2026-07-09).
      # The CCM ROUTE controller stays OFF (HCLOUD_NETWORK_ROUTES_ENABLED=false): Cilium
      # owns pod routing (tunnel mode), so CCM-programmed pod-CIDR routes are redundant
      # and can fight it. NOTE: CAPH attaches nodes born after hcloudNetwork.enabled=true
      # to the network automatically; the pre-existing single node was attached out-of-band
      # (hcloud API attach_to_network + netplan apply → 10.0.1.2). See docs/ADR019-infra-credentials.md.
      # Scheduling (w1/m19 t003): CCM is bootstrap-critical — it initializes nodes
      # (clears the cloud-provider taint), so it cannot wait for a worker pool to be
      # Ready. It already tolerates the control-plane taint by default; pinning it
      # to the CP makes that its home (the recorded CP exemption, not platform pool).
      - name: install Hetzner CCM
        run: |
          chart_dir=$(mktemp -d)
          trap 'rm -rf -- "$chart_dir"' EXIT
          chart=$(bash scripts/helm-artifact.sh pull hcloud-cloud-controller-manager "$chart_dir")
          helm upgrade --install hccm "$chart" \
            -n kube-system \
            --set networking.enabled=true \
            --set networking.clusterCIDR="${POD_CIDR}" \
            --set-string env.HCLOUD_NETWORK_ROUTES_ENABLED.value=false \
            --set 'nodeSelector.node-role\.kubernetes\.io/control-plane='

      # CNI: Cilium in tunnel mode (works without a private network / native routing).
      # WireGuard node-to-node encryption is ON (w1/m7 t004): Cilium establishes a
      # WireGuard tunnel between every pair of nodes and routes all pod-to-pod (and,
      # with nodeEncryption, host-to-host) traffic through it. Essential while nodes
      # gossip etcd/kubelet/pod traffic over the network — transparently encrypted
      # even before the private network (t005) lands. The KubeadmConfigTemplate
      # already ships the `net.ipv4.conf.lxc*.rp_filter=0` sysctl WireGuard needs.
      # Scheduling (w1/m19 t003): the cilium + cilium-envoy DaemonSets tolerate
      # everything by default (they run on ALL nodes, both pools + CP). The operator
      # is bootstrap-critical (no CNI anywhere until it runs) and already tolerates
      # the CP taint — pin it to the CP like the CCM.
      # bpf.hostLegacyRouting keeps pod egress on the host netfilter path after
      # Cilium policy. The outbound meter attaches at POST_ROUTING there so denied
      # traffic is excluded while the original pod source address is still visible.
      - name: install Cilium (CNI)
        run: |
          # devices/direct-routing-device pinned to the CAPH private interface
          # (enp7s0, the first attached hcloud network): with two NICs and no
          # node addresses yet (CCM waits on cilium's own agent-not-ready taint),
          # cilium 1.19's auto-detection fails fatally — and east-west belongs on
          # the private net anyway (w1/m19 t006).
          chart_dir=$(mktemp -d)
          trap 'rm -rf -- "$chart_dir"' EXIT
          chart=$(bash scripts/helm-artifact.sh pull cilium "$chart_dir")
          helm upgrade --install cilium "$chart" -n kube-system \
            --set ipam.mode=cluster-pool \
            --set ipam.operator.clusterPoolIPv4PodCIDRList="{${POD_CIDR}}" \
            --set encryption.enabled=true \
            --set encryption.type=wireguard \
            --set encryption.nodeEncryption=true \
            --set bpf.hostLegacyRouting=true \
            --set l7Proxy=true \
            --set devices=enp7s0 \
            --set extraConfig.direct-routing-device=enp7s0 \
            --set 'operator.nodeSelector.node-role\.kubernetes\.io/control-plane='

      # hcloud-csi: PersistentVolumes (registry volume, stateful apps like a Postgres).
      # Scheduling (w1/m19 t003): the node DaemonSet tolerates everything by default;
      # the controller is not bootstrap-critical (PVs are first needed by the platform
      # charts, by which time the platform pool is Ready) → platform pool.
      - name: install hcloud CSI
        run: |
          chart_dir=$(mktemp -d)
          trap 'rm -rf -- "$chart_dir"' EXIT
          chart=$(bash scripts/helm-artifact.sh pull hcloud-csi "$chart_dir")
          helm upgrade --install hcloud-csi "$chart" -n kube-system \
            --set 'controller.nodeSelector.bex\.co/pool=platform' \
            --set 'controller.tolerations[0].key=bex.co/platform' \
            --set 'controller.tolerations[0].operator=Equal' \
            --set-string 'controller.tolerations[0].value=true' \
            --set 'controller.tolerations[0].effect=NoSchedule'

      - name: wait for app cluster nodes Ready
        run: |
          kubectl wait --for=condition=Ready node --all --timeout=600s
          kubectl get nodes -o wide

      - name: summary
        run: |
          echo "app cluster '$CLUSTER_NAME' is up. Next: deploy bex (operator + registry)"
          echo "via Argo/deploy or 'make deploy', then kubectl apply an App."

      # F6 final scrub: runs regardless of the job's outcome.
      - name: final credential scrub
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/bex-ssh"
          rm -f -- "$RUNNER_TEMP/app.kubeconfig"
