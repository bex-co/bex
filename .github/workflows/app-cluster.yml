name: app-cluster (CAPH)

# Phase 2: turn the infra cluster (single-node k3s, built by infra.yml/terraform)
# into a running APP CLUSTER on Hetzner. It:
#   1. discovers the infra cluster IP from terraform state, fetches its kubeconfig
#   2. installs CAPH into the infra cluster (clusterctl init)
#   3. applies the CAPH overlay -> CAPH provisions Hetzner servers -> app cluster
#   4. installs the bootstrap addons on the app cluster: CNI (Cilium) + Hetzner CCM + CSI
#
# Runs in CI, never a laptop. Idempotent: re-runnable (clusterctl init / kubectl
# apply / helm upgrade --install / secret apply are all no-ops when unchanged).
#
# Prereq: infra.yml has applied (infra cluster + remote state exist).
# Extra secret beyond infra.yml's:
#   BEX_SSH_PRIVATE_KEY   private key matching BEX_SSH_PUBLIC_KEY (to read k3s.yaml over SSH)
#
# ⚠ Untested against a live Hetzner account — structurally correct, but chart
#   versions / values may need tuning on the first real run (see NOTE comments).

on:
  push:
    branches: [main]
    paths:
      - "infra/clusterapi/overlays/hetzner-caph/**"
      - "infra/clusterapi/autoscaler-values.yaml"
      - "scripts/install-autoscaler.sh"
      - ".github/workflows/app-cluster.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
  CLUSTER_NAME: bex
  POD_CIDR: 10.244.0.0/16 # must match the overlay's clusterNetwork.pods.cidrBlocks
  CAPH_VERSION: v1.1.7 # v1.0.x webhook had a stale server-type enum (rejected cx33); v1.1.x dropped it
  CLUSTERCTL_VERSION: v1.13.2

jobs:
  bootstrap-app-cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- discover the infra cluster from terraform state ---
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: terraform init (read state only)
        working-directory: infra/terraform
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_public_key: ${{ secrets.BEX_SSH_PUBLIC_KEY }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=infra/terraform.tfstate" \
            -backend-config="region=${{ secrets.TF_STATE_REGION }}" \
            -backend-config="endpoints={s3=\"${{ secrets.TF_STATE_ENDPOINT }}\"}" \
            -backend-config="access_key=${{ secrets.TF_STATE_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.TF_STATE_SECRET_KEY }}"
      - name: discover infra cluster IP
        id: infra
        working-directory: infra/terraform
        run: echo "ip=$(terraform output -raw infra_server_ipv4)" >> "$GITHUB_OUTPUT"

      # --- fetch the infra cluster kubeconfig over SSH (becomes the default context) ---
      - name: fetch infra kubeconfig
        run: |
          install -m700 -d ~/.ssh ~/.kube
          printf '%s\n' "${{ secrets.BEX_SSH_PRIVATE_KEY }}" > ~/.ssh/id_bex
          chmod 600 ~/.ssh/id_bex
          IP="${{ steps.infra.outputs.ip }}"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_bex "root@${IP}" \
            'cat /etc/rancher/k3s/k3s.yaml' \
            | sed "s#https://127.0.0.1:6443#https://${IP}:6443#" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      # --- tools ---
      - name: install clusterctl
        run: |
          curl -fsSL -o /tmp/clusterctl \
            "https://github.com/kubernetes-sigs/cluster-api/releases/download/${CLUSTERCTL_VERSION}/clusterctl-linux-amd64"
          sudo install -m755 /tmp/clusterctl /usr/local/bin/clusterctl
          clusterctl version

      # --- install/upgrade CAPH on the infra cluster (idempotent across version bumps) ---
      # clusterctl init is one-shot; to change provider version we delete just the
      # infrastructure provider (keeps CAPI core + CRDs + any Cluster objects) and
      # re-init it. The canonical version lives on the clusterctl Provider object.
      - name: ensure CAPH at desired version
        run: |
          cur=$(kubectl get providers -A -o jsonpath='{.items[?(@.metadata.name=="infrastructure-hetzner")].version}' 2>/dev/null || true)
          if [ -z "$cur" ]; then
            echo "CAPH not installed — init ${CAPH_VERSION}"
            clusterctl init --infrastructure "hetzner:${CAPH_VERSION}"
          elif [ "$cur" != "${CAPH_VERSION}" ]; then
            echo "CAPH ${cur} -> ${CAPH_VERSION} (replace infrastructure provider)"
            clusterctl delete --infrastructure hetzner
            clusterctl init --infrastructure "hetzner:${CAPH_VERSION}"
          else
            echo "CAPH already at ${CAPH_VERSION}"
          fi
      - name: wait for CAPI/CAPH controllers
        run: |
          for ns in cert-manager capi-system caph-system; do
            kubectl -n "$ns" wait --for=condition=Available deploy --all --timeout=300s
          done

      # --- credential Secret (hcloud-only; robot keys only needed for bare-metal) ---
      - name: hetzner credential secret (infra cluster, ns default)
        run: |
          kubectl create secret generic hetzner -n default \
            --from-literal=hcloud="$HCLOUD_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      # --- apply the overlay -> CAPH provisions the app cluster ---
      - name: apply CAPH overlay
        run: kubectl apply -f infra/clusterapi/overlays/hetzner-caph/cluster.yaml
      # NOTE: `kubectl wait --for=condition=ControlPlaneInitialized` is unreliable on
      # CAPI v1beta2 clusters (the condition reads True via jsonpath but `wait`'s
      # matcher times out). Poll the jsonpath directly instead — bulletproof.
      - name: wait for app cluster control plane
        run: |
          for i in $(seq 1 120); do
            s=$(kubectl get cluster "${CLUSTER_NAME}" -o jsonpath='{.status.conditions[?(@.type=="ControlPlaneInitialized")].status}' 2>/dev/null || true)
            [ "$s" = "True" ] && break
            echo "  [$i/120] ControlPlaneInitialized=${s:-<none>}; retrying in 10s"; sleep 10
          done
          if [ "$s" != "True" ]; then
            echo "control plane not initialized in time"; kubectl get cluster,kcp,machines -A -o wide; exit 1
          fi
          kubectl get cluster,machines -A -o wide

      # --- cluster-autoscaler on the INFRA cluster, beside CAPI (w1/m3) ---
      # Why here and not Argo: infra/clusterapi/autoscaler-values.yaml (decision record).
      # CA_TAG matches the app cluster's k8s minor (overlay `version:`) — a newer
      # CA's DRA informers never sync against a v1.31 apiserver and the main loop
      # silently never starts. Bump together with the overlay's k8s version.
      - name: cluster-autoscaler (infra cluster)
        run: CA_TAG=v1.31.5 bash scripts/install-autoscaler.sh

      # --- pull the app cluster kubeconfig; switch default context to it ---
      - name: app cluster kubeconfig
        run: |
          clusterctl get kubeconfig "$CLUSTER_NAME" > "$PWD/app.kubeconfig"
          echo "KUBECONFIG=$PWD/app.kubeconfig" >> "$GITHUB_ENV"

      # ====== addons on the APP cluster (KUBECONFIG now points at it) ======
      - name: helm repos
        run: |
          helm repo add hcloud https://charts.hetzner.cloud
          helm repo add cilium https://helm.cilium.io
          helm repo update

      # hcloud token secret the CCM + CSI both read. `network` is the CAPH-managed
      # private network name (= the cluster name, w1/m7 t005); the CCM reads it as
      # HCLOUD_NETWORK when networking.enabled=true to program pod-CIDR routes and
      # private-IP LoadBalancer targets.
      - name: hcloud secret (app cluster, ns kube-system)
        run: |
          kubectl -n kube-system create secret generic hcloud \
            --from-literal=token="$HCLOUD_TOKEN" \
            --from-literal=network="$CLUSTER_NAME" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Hetzner CCM: initializes nodes (clears the cloud-provider taint) + LoadBalancers.
      # Network-aware (HCLOUD_NETWORK=bex from the secret above) so the Traefik LB
      # attaches to the bex private network and targets nodes by PRIVATE IP
      # (load-balancer.hetzner.cloud/use-private-ip, w1/m7 t005, enabled live 2026-07-09).
      # The CCM ROUTE controller stays OFF (HCLOUD_NETWORK_ROUTES_ENABLED=false): Cilium
      # owns pod routing (tunnel mode), so CCM-programmed pod-CIDR routes are redundant
      # and can fight it. NOTE: CAPH attaches nodes born after hcloudNetwork.enabled=true
      # to the network automatically; the pre-existing single node was attached out-of-band
      # (hcloud API attach_to_network + netplan apply → 10.0.1.2). See docs/infra-credentials.md.
      # Scheduling (w1/m19 t003): CCM is bootstrap-critical — it initializes nodes
      # (clears the cloud-provider taint), so it cannot wait for a worker pool to be
      # Ready. It already tolerates the control-plane taint by default; pinning it
      # to the CP makes that its home (the recorded CP exemption, not platform pool).
      - name: install Hetzner CCM
        run: |
          helm upgrade --install hccm hcloud/hcloud-cloud-controller-manager \
            -n kube-system \
            --set networking.enabled=true \
            --set networking.clusterCIDR="${POD_CIDR}" \
            --set-string env.HCLOUD_NETWORK_ROUTES_ENABLED.value=false \
            --set 'nodeSelector.node-role\.kubernetes\.io/control-plane='

      # CNI: Cilium in tunnel mode (works without a private network / native routing).
      # WireGuard node-to-node encryption is ON (w1/m7 t004): Cilium establishes a
      # WireGuard tunnel between every pair of nodes and routes all pod-to-pod (and,
      # with nodeEncryption, host-to-host) traffic through it. Essential while nodes
      # gossip etcd/kubelet/pod traffic over the network — transparently encrypted
      # even before the private network (t005) lands. The KubeadmConfigTemplate
      # already ships the `net.ipv4.conf.lxc*.rp_filter=0` sysctl WireGuard needs.
      # Scheduling (w1/m19 t003): the cilium + cilium-envoy DaemonSets tolerate
      # everything by default (they run on ALL nodes, both pools + CP). The operator
      # is bootstrap-critical (no CNI anywhere until it runs) and already tolerates
      # the CP taint — pin it to the CP like the CCM.
      - name: install Cilium (CNI)
        run: |
          helm upgrade --install cilium cilium/cilium -n kube-system \
            --set ipam.mode=cluster-pool \
            --set ipam.operator.clusterPoolIPv4PodCIDRList="{${POD_CIDR}}" \
            --set encryption.enabled=true \
            --set encryption.type=wireguard \
            --set encryption.nodeEncryption=true \
            --set 'operator.nodeSelector.node-role\.kubernetes\.io/control-plane='

      # hcloud-csi: PersistentVolumes (registry volume, stateful apps like a Postgres).
      # Scheduling (w1/m19 t003): the node DaemonSet tolerates everything by default;
      # the controller is not bootstrap-critical (PVs are first needed by the platform
      # charts, by which time the platform pool is Ready) → platform pool.
      - name: install hcloud CSI
        run: |
          helm upgrade --install hcloud-csi hcloud/hcloud-csi -n kube-system \
            --set 'controller.nodeSelector.bex\.co/pool=platform' \
            --set 'controller.tolerations[0].key=bex.co/platform' \
            --set 'controller.tolerations[0].operator=Equal' \
            --set-string 'controller.tolerations[0].value=true' \
            --set 'controller.tolerations[0].effect=NoSchedule'

      - name: wait for app cluster nodes Ready
        run: |
          kubectl wait --for=condition=Ready node --all --timeout=600s
          kubectl get nodes -o wide

      - name: summary
        run: |
          echo "app cluster '$CLUSTER_NAME' is up. Next: deploy bex (operator + registry)"
          echo "via Argo/deploy or 'make deploy', then kubectl apply an App."
