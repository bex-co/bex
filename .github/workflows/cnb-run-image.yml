name: cnb run image (build + verify)

# Publishes ghcr.io/bex-co/bex-cnb-run: Paketo's run-jammy-base plus libatomic1
# (deploy/cnb-run/Dockerfile, w1/m169), the run image of the buildpack path's
# kpack ClusterStack. Node 25+ linux binaries link libatomic.so.1 and no Paketo
# Jammy run image ships it, so an open `engines.node` range (Render resolves
# `>=20` to the latest Node) built green and then crash-looped.
#
# This workflow publishes; it never pins. Pinning the published digest in
# deploy/gitops/charts/kpack/platform.yaml is a reviewed commit under
# docs/ADR060 D7, like every other build-toolchain pin
# (lego/operator/internal/build/toolchain-freshness.json, id `cnb-run-image`).
# It runs only when the image recipe changes, so the published digest moves
# only when the reviewed base pin or the recipe does.

on:
  push:
    branches: [main]
    paths:
      - "deploy/cnb-run/**"
      - ".github/workflows/cnb-run-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cnb-run-image
  cancel-in-progress: false

env:
  CNB_RUN_IMAGE: ghcr.io/bex-co/bex-cnb-run

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
    # Ref guard: only reviewed main may publish a platform image.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, bex-production]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both architectures, like the run-jammy-base index it replaces: production
      # is linux/amd64 and local CAPD clusters on Apple silicon are linux/arm64.
      # The Dockerfile's own ldconfig check fails the build if libatomic.so.1
      # does not resolve on either platform.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: deploy/cnb-run
          file: deploy/cnb-run/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.CNB_RUN_IMAGE }}:${{ github.sha }}

      # Regression gate: the official Node 26 binary must start on the exact
      # pushed digest, per platform. Never pushed.
      - name: verify Node 26 starts on the pushed digest
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: deploy/cnb-run
          file: deploy/cnb-run/node-check.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            RUN_IMAGE=${{ env.CNB_RUN_IMAGE }}@${{ steps.build.outputs.digest }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: sign image + attest SBOM, then move latest
        env:
          REF: ${{ env.CNB_RUN_IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes --oidc-provider=github-actions "$REF"
          syft "$REF" -o spdx-json > "$RUNNER_TEMP/sbom.spdx.json"
          cosign attest --yes --oidc-provider=github-actions --type spdxjson --predicate "$RUNNER_TEMP/sbom.spdx.json" "$REF"
          # `latest` moves only after the regression gate and signature, so the
          # freshness resolver never reports an unverified digest.
          docker buildx imagetools create --tag "$CNB_RUN_IMAGE:latest" "$REF"
          echo "Published $REF — pin it per docs/ADR060 D7 (inventory id cnb-run-image)." >> "$GITHUB_STEP_SUMMARY"
