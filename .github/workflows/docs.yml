name: docs (prettier)

# Keep Markdown consistently formatted. Markdown-only (`**/*.md`) so it never touches
# the k8s/Helm YAML; .prettierignore excludes vendored/gitignored docs. Fix locally with:
#   npx prettier@3.4.2 --write "**/*.md"
on:
  pull_request:
    paths:
      - "**/*.md"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  prettier:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npx --yes prettier@3.4.2 --check "**/*.md"
