name: docs (prettier)

# Keep Markdown consistently formatted. Markdown-only (`**/*.md`) so it never touches
# the k8s/Helm YAML; .prettierignore excludes vendored/gitignored docs and .pm. It
# also owns the ADR registry check, which greps every md, go, sh, yaml, yml, ts
# and tsx file in the checkout, the board and the prettier-ignored trees
# included, for a dangling ADR reference, so the path filter lists those
# extensions whole. Fix formatting locally with:
#   npx prettier@3.4.2 --write "**/*.md"
on:
  pull_request:
    paths:
      - "**/*.md"
      # The ADR registry check's scan_filters in adr-registry-validate.sh.
      - "**/*.go"
      - "**/*.sh"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.ts"
      - "**/*.tsx"
      - ".prettierrc.json"
      - ".prettierignore"
      - "scripts/adr-registry-validate.sh"
      - "scripts/adr-registry-validate.test.sh"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      # The ADR registry check's scan_filters in adr-registry-validate.sh.
      - "**/*.go"
      - "**/*.sh"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.ts"
      - "**/*.tsx"
      - ".prettierrc.json"
      - ".prettierignore"
      - "scripts/adr-registry-validate.sh"
      - "scripts/adr-registry-validate.test.sh"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

# One running + one pending run per branch: without a group every main push
# queued a full run, which starved the old CI runner pool; hosted jobs still
# share the org's concurrent-job limit. Only PRs cancel a running check.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prettier:
    # Public-repo safety (github-actions-validate.sh rule 7): fork PR heads never run this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      # full-checkout: prettier and the ADR registry check read every markdown file (w6/m157)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npx --yes prettier@3.4.2 --check "**/*.md"
      - name: ADR registry integrity (no duplicate numbers, all indexed, no dangling refs)
        run: bash scripts/adr-registry-validate.sh
      - name: ADR registry guard self-test
        run: bash scripts/adr-registry-validate.test.sh
