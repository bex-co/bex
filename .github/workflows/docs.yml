name: docs (prettier)

# Keep Markdown consistently formatted. Markdown-only (`**/*.md`) so it never touches
# the k8s/Helm YAML; .prettierignore excludes vendored/gitignored docs. Fix locally with:
#   npx prettier@3.4.2 --write "**/*.md"
on:
  pull_request:
    paths:
      - "**/*.md"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

# One running + one pending run per branch: without a group every main push
# queued a full run, which starved the bex-ci pool. Only PRs cancel a running
# check.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prettier:
    # Public-repo safety: fork PR code must never reach persistent self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, bex-ci]
    timeout-minutes: 30
    steps:
      # full-checkout: prettier checks every markdown file, .pm included (w6/m157)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npx --yes prettier@3.4.2 --check "**/*.md"
