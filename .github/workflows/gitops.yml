name: gitops (render)

# The GitOps tree must always render: kustomize build of base + overlays and
# helm template of the pinned Ory charts against the vendored values. Catches
# broken manifests/values before Argo CD ever sees them. Fix locally with:
#   bash scripts/gitops-validate.sh
on:
  pull_request:
    paths:
      - "deploy/gitops/**"
      - "lego/operator/config/**"
      - "scripts/gitops-validate.sh"
      - "scripts/cnpg-backup-guard.sh"
      - "scripts/gitops-hardening-guard-test.sh"
      - "scripts/lib/platform-pod-hardening-guard.yq"
      - "scripts/platform-deprecations-validate.sh"
      - "scripts/lib/ssh-edge.sh"
      - "scripts/ssh-activate.sh"
      - "scripts/ssh-activate.test.sh"
      - "scripts/ssh-dns-cloudflare.sh"
      - "scripts/ssh-dns-cloudflare.test.sh"
      - "scripts/datastore-dns-cloudflare.sh"
      - "scripts/datastore-dns-cloudflare.test.sh"
      - "scripts/ssh-verify.sh"
      - "scripts/ssh-verify-openssh.sh"
      - "scripts/ssh-verify.test.sh"
      - ".github/workflows/gitops.yml"
  push:
    branches: [main]
    paths:
      - "deploy/gitops/**"
      - "lego/operator/config/**"
      - "scripts/gitops-validate.sh"
      - "scripts/cnpg-backup-guard.sh"
      - "scripts/gitops-hardening-guard-test.sh"
      - "scripts/lib/platform-pod-hardening-guard.yq"
      - "scripts/platform-deprecations-validate.sh"
      - "scripts/lib/ssh-edge.sh"
      - "scripts/ssh-activate.sh"
      - "scripts/ssh-activate.test.sh"
      - "scripts/ssh-dns-cloudflare.sh"
      - "scripts/ssh-dns-cloudflare.test.sh"
      - "scripts/datastore-dns-cloudflare.sh"
      - "scripts/datastore-dns-cloudflare.test.sh"
      - "scripts/ssh-verify.sh"
      - "scripts/ssh-verify-openssh.sh"
      - "scripts/ssh-verify.test.sh"
      - ".github/workflows/gitops.yml"

permissions:
  contents: read

concurrency:
  group: gitops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest # ships kubectl, helm 3, and yq v4 preinstalled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install fga CLI # model.fga <-> model.json drift gate
        run: |
          curl -fsSL https://github.com/openfga/cli/releases/download/v0.7.17/fga_0.7.17_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin fga
      - name: install promtool # alerting-rule check + unit tests (w3/m6); matches the pinned chart appVersion
        run: |
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz \
            | tar -xz -C /tmp prometheus-2.55.1.linux-amd64/promtool
          sudo install /tmp/prometheus-2.55.1.linux-amd64/promtool /usr/local/bin/promtool
      - name: validate
        run: bash scripts/gitops-validate.sh
      - name: platform-pod hardening guard self-test # w7/m58: proves the guard bites
        run: bash scripts/gitops-hardening-guard-test.sh
