name: gitops (render)

# The GitOps tree must always render: kustomize build of base + overlays and
# helm template of the pinned Ory charts against the vendored values. Catches
# broken manifests/values before Argo CD ever sees them. Fix locally with:
#   bash scripts/gitops-validate.sh
on:
  pull_request:
    paths:
      - "deploy/gitops/**"
      - "lego/operator/config/**"
      - "scripts/gitops-validate.sh"
      - "scripts/edge-proxyprotocol-validate.sh"
      - "scripts/test_log_shipper.py"
      - "lego/backend/internal/logs/testdata/tenant-log-lines.json"
      - "scripts/test_log_delivery.py"
      - "scripts/test_platform_metrics.py"
      - "scripts/helm-artifact*.sh"
      - "deploy/helm-artifacts.lock"
      - "scripts/onbex-dns01-token-secret.sh"
      - "scripts/onbex-dns01-token-secret.test.sh"
      - "scripts/onbex-default-tls-verify.sh"
      - "scripts/lib/onbex-default-tls.sh"
      - ".github/workflows/ssh-edge-liveness.yml"
      - "scripts/edge-probe.sh"
      - "scripts/cnpg-backup-guard.sh"
      - "scripts/obs-coverage-check.sh"
      - "scripts/obs-scrape-keep-check*.sh"
      - "scripts/cli-analytics*"
      - "scripts/test_cli_analytics.py"
      - "scripts/product-analytics*"
      - "scripts/test_product_analytics.py"
      - "scripts/lib/analytics-bootstrap.sh"
      - "scripts/analytics-bootstrap.test.sh"
      - "scripts/lib/secret-install.sh"
      - "lego/backend/internal/store/migrations/**"
      - "scripts/gitops-hardening-guard-test.sh"
      - "scripts/lib/platform-pod-hardening-guard.yq"
      - "scripts/platform-deprecations-validate.sh"
      - "scripts/lib/ssh-edge.sh"
      - "scripts/ssh-activate.sh"
      - "scripts/ssh-activate.test.sh"
      - "scripts/ssh-dns-cloudflare.sh"
      - "scripts/ssh-dns-cloudflare.test.sh"
      - "scripts/datastore-dns-cloudflare.sh"
      - "scripts/datastore-dns-cloudflare.test.sh"
      - "scripts/capi-sandbox-bootstrap.test.sh"
      - "scripts/capi-template-drift.sh"
      - "scripts/capi-template-drift.test.sh"
      - "infra/clusterapi/**"
      - "scripts/ssh-verify.sh"
      - "scripts/ssh-verify-openssh.sh"
      - "scripts/ssh-verify.test.sh"
      - ".github/workflows/gitops.yml"
      - "scripts/ci-fetch-verified.sh"
  push:
    branches: [main]
    paths:
      - "deploy/gitops/**"
      - "lego/operator/config/**"
      - "scripts/gitops-validate.sh"
      - "scripts/edge-proxyprotocol-validate.sh"
      - "scripts/test_log_shipper.py"
      - "lego/backend/internal/logs/testdata/tenant-log-lines.json"
      - "scripts/test_log_delivery.py"
      - "scripts/test_platform_metrics.py"
      - "scripts/helm-artifact*.sh"
      - "deploy/helm-artifacts.lock"
      - "scripts/onbex-dns01-token-secret.sh"
      - "scripts/onbex-dns01-token-secret.test.sh"
      - "scripts/onbex-default-tls-verify.sh"
      - "scripts/lib/onbex-default-tls.sh"
      - ".github/workflows/ssh-edge-liveness.yml"
      - "scripts/edge-probe.sh"
      - "scripts/cnpg-backup-guard.sh"
      - "scripts/obs-coverage-check.sh"
      - "scripts/obs-scrape-keep-check*.sh"
      - "scripts/cli-analytics*"
      - "scripts/test_cli_analytics.py"
      - "scripts/product-analytics*"
      - "scripts/test_product_analytics.py"
      - "scripts/lib/analytics-bootstrap.sh"
      - "scripts/analytics-bootstrap.test.sh"
      - "scripts/lib/secret-install.sh"
      - "lego/backend/internal/store/migrations/**"
      - "scripts/gitops-hardening-guard-test.sh"
      - "scripts/lib/platform-pod-hardening-guard.yq"
      - "scripts/platform-deprecations-validate.sh"
      - "scripts/lib/ssh-edge.sh"
      - "scripts/ssh-activate.sh"
      - "scripts/ssh-activate.test.sh"
      - "scripts/ssh-dns-cloudflare.sh"
      - "scripts/ssh-dns-cloudflare.test.sh"
      - "scripts/datastore-dns-cloudflare.sh"
      - "scripts/datastore-dns-cloudflare.test.sh"
      - "scripts/capi-sandbox-bootstrap.test.sh"
      - "scripts/capi-template-drift.sh"
      - "scripts/capi-template-drift.test.sh"
      - "infra/clusterapi/**"
      - "scripts/ssh-verify.sh"
      - "scripts/ssh-verify-openssh.sh"
      - "scripts/ssh-verify.test.sh"
      - ".github/workflows/gitops.yml"
      - "scripts/ci-fetch-verified.sh"

permissions:
  contents: read

concurrency:
  group: gitops-${{ github.ref }}
  # Only PRs cancel a running check: on main, steady pushes cancelled every
  # run before it finished, so main's state was never reported.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli-analytics:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
      # Postgres runs as a step, not a `services:` container, for the same
      # reason as backend-test.yml: a services: pull gets only the runner's
      # short retry, and a registry-1.docker.io TLS handshake timeout turned
      # run 39406673216 red before any step ran (w1/141).
      - name: start Postgres (pull with retries)
        run: |
          image=postgres:17@sha256:e2fddda1fea39c634dccdae58dba5448eb3efb85aaa4054cf45cbed28f35d296
          for i in 1 2 3 4 5; do
            docker pull "$image" && break
            [ "$i" -lt 5 ] || exit 1
            echo "pull $image attempt $i failed, retrying in $((i * 20))s..."; sleep $((i * 20))
          done
          docker rm -f gitops-cli-analytics-postgres >/dev/null 2>&1 || true
          docker run -d --name gitops-cli-analytics-postgres -e POSTGRES_PASSWORD=pw "$image"
          timeout 90 bash -c 'until docker exec gitops-cli-analytics-postgres pg_isready -U postgres -h 127.0.0.1; do sleep 2; done'
      - name: verify CLI and product analytics SQL and restricted readers
        env:
          BEX_CLI_ANALYTICS_TEST_CONTAINER: gitops-cli-analytics-postgres
        run: python3 -m unittest scripts/test_cli_analytics.py scripts/test_product_analytics.py -v
      - name: stop Postgres
        if: always()
        run: docker rm -f gitops-cli-analytics-postgres

  render:
    # Public-repo safety (github-actions-validate.sh rule 7): fork PR heads never run this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.36.1
      - name: install helm
        # Downloaded with retries and checksum-verified, like promtool below:
        # azure/setup-helm made one attempt at get.helm.sh, and a failed fetch
        # turned run 39530428078 red (w1/141). The sha256 is get.helm.sh's
        # published helm-v3.19.0-linux-arm64.tar.gz.sha256sum.
        run: |
          curl -fsSL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 300 \
            -o "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v3.19.0-linux-arm64.tar.gz
          echo "440cf7add0aee27ebc93fada965523c1dc2e0ab340d4348da2215737fc0d76ad  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-arm64/helm
          install -m755 -D "$RUNNER_TEMP/linux-arm64/helm" "$RUNNER_TEMP/bin/helm"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/helm" version --short
      - name: install yq
        # Always download + checksum-verify into the ephemeral $RUNNER_TEMP and
        # prepend it to PATH — never short-circuit on a yq already in PATH: the
        # hosted image's own yq is unpinned, and a reviewed version must not
        # depend on runner image contents (codex-security target #2).
        # $RUNNER_TEMP is per-job, so the verified binary always wins.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          YQ_VERSION=4.44.6
          YQ_LINUX_ARM64_SHA256=9477ac3cc447b6c083986129e35af8122eb2b938fe55c9c3e40436fb966e5813
          archive="$RUNNER_TEMP/yq"
          bash scripts/ci-fetch-verified.sh \
            "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_arm64" \
            "$YQ_LINUX_ARM64_SHA256" "$archive"
          chmod +x "$archive"
          install -m755 -D "$archive" "$RUNNER_TEMP/bin/yq"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/yq" --version
      - name: install fga CLI # model.fga <-> model.json drift gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          # To a file, not a pipe: a retried transfer would re-send bytes into tar.
          bash scripts/ci-fetch-verified.sh \
            https://github.com/openfga/cli/releases/download/v0.7.17/fga_0.7.17_linux_arm64.tar.gz \
            5722e27529f0cb8e977e4eb456f0fd7ac23044cbb2126bf3ae82f0922e792316 \
            "$RUNNER_TEMP/fga.tar.gz"
          tar -xzf "$RUNNER_TEMP/fga.tar.gz" -C "$RUNNER_TEMP/bin" fga
          chmod +x "$RUNNER_TEMP/bin/fga"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: install promtool # alerting-rule check + unit tests (w3/m6); matches the explicitly pinned server image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resumed across attempts: the 95 MB tarball outlasts single attempts
          # on a slow link (scripts/ci-fetch-verified.sh).
          bash scripts/ci-fetch-verified.sh \
            https://github.com/prometheus/prometheus/releases/download/v3.13.5/prometheus-3.13.5.linux-arm64.tar.gz \
            e705357ffa5b3189e98bf145d044364d75dd994470c706a07731292932b2ee0f \
            "$RUNNER_TEMP/prometheus.tar.gz"
          tar -xzf "$RUNNER_TEMP/prometheus.tar.gz" -C "$RUNNER_TEMP" prometheus-3.13.5.linux-arm64/promtool
          install -m755 -D "$RUNNER_TEMP/prometheus-3.13.5.linux-arm64/promtool" \
            "$RUNNER_TEMP/bin/promtool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: validate
        env:
          GITOPS_TEST_FILESYSTEM_COLLECTOR: "1"
        run: bash scripts/gitops-validate.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: deploy/gitops/charts/traefik-plugins/clientipheaders/go.mod
          # The plugins are standard-library only (no go.sum): nothing worth a
          # slot in the 10 GB repository cache.
          cache: false
      - name: Traefik local plugins # the edge loads them; a broken one is an outage (abortOnPluginFailure)
        run: |
          for plugin in deploy/gitops/charts/traefik-plugins/*/; do
            (cd "$plugin" && GOWORK=off go vet ./... && GOWORK=off go test ./...)
          done
      # The edge runs the plugins interpreted, and Yaegi differs from compiled
      # Go: compiled code sees an interpreted ResponseWriter without Flush, so
      # a wrapper that passes go test can still buffer every stream (w8/321).
      # Yaegi v0.16.1 is the version traefik v3.7.17 (base/values image.tag)
      # pins; bump it with the image. Only the plugin and its Yaegi-safe
      # origin-server tests run here: the sanitizer tests panic in v0.16.1's
      # type checker, the compiled-only test uses a fake Yaegi would hide, and
      # the egress plugin's fakes do not type-check under it.
      - name: Traefik client-identity plugin under Yaegi
        run: |
          GOWORK=off GOBIN="$RUNNER_TEMP/bin" go install github.com/traefik/yaegi/cmd/yaegi@v0.16.1
          plugin=deploy/gitops/charts/traefik-plugins/clientipheaders
          gopath="$RUNNER_TEMP/yaegi"
          module="$(awk '/^module/ {print $2}' "$plugin/go.mod")"
          mkdir -p "$gopath/src/$module"
          cp "$plugin/clientipheaders.go" "$plugin/originserver_test.go" "$gopath/src/$module/"
          cd "$gopath" && GOPATH="$gopath" GO111MODULE=off timeout 300 "$RUNNER_TEMP/bin/yaegi" test "$module"
      - name: app log severity parsing in the pinned Alloy image
        run: python3 -m unittest scripts/test_log_shipper.py -v
      - name: log delivery failure and recovery in pinned Alloy and Loki
        run: python3 -m unittest scripts/test_log_delivery.py -v
      - name: platform-pod hardening guard self-test # w7/m58: proves the guard bites
        run: bash scripts/gitops-hardening-guard-test.sh
