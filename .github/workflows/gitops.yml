name: gitops (render)

# The GitOps tree must always render: kustomize build of base + overlays and
# helm template of the pinned Ory charts against the vendored values. Catches
# broken manifests/values before Argo CD ever sees them. Fix locally with:
#   bash scripts/gitops-validate.sh
on:
  pull_request:
    paths:
      - "deploy/gitops/**"
      - "lego/operator/config/**"
      - "scripts/gitops-validate.sh"
      - "scripts/cnpg-backup-guard.sh"
      - "scripts/gitops-hardening-guard-test.sh"
      - "scripts/lib/platform-pod-hardening-guard.yq"
      - "scripts/platform-deprecations-validate.sh"
      - "scripts/lib/ssh-edge.sh"
      - "scripts/ssh-activate.sh"
      - "scripts/ssh-activate.test.sh"
      - "scripts/ssh-dns-cloudflare.sh"
      - "scripts/ssh-dns-cloudflare.test.sh"
      - "scripts/datastore-dns-cloudflare.sh"
      - "scripts/datastore-dns-cloudflare.test.sh"
      - "scripts/ssh-verify.sh"
      - "scripts/ssh-verify-openssh.sh"
      - "scripts/ssh-verify.test.sh"
      - ".github/workflows/gitops.yml"
  push:
    branches: [main]
    paths:
      - "deploy/gitops/**"
      - "lego/operator/config/**"
      - "scripts/gitops-validate.sh"
      - "scripts/cnpg-backup-guard.sh"
      - "scripts/gitops-hardening-guard-test.sh"
      - "scripts/lib/platform-pod-hardening-guard.yq"
      - "scripts/platform-deprecations-validate.sh"
      - "scripts/lib/ssh-edge.sh"
      - "scripts/ssh-activate.sh"
      - "scripts/ssh-activate.test.sh"
      - "scripts/ssh-dns-cloudflare.sh"
      - "scripts/ssh-dns-cloudflare.test.sh"
      - "scripts/datastore-dns-cloudflare.sh"
      - "scripts/datastore-dns-cloudflare.test.sh"
      - "scripts/ssh-verify.sh"
      - "scripts/ssh-verify-openssh.sh"
      - "scripts/ssh-verify.test.sh"
      - ".github/workflows/gitops.yml"

permissions:
  contents: read

concurrency:
  group: gitops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    # Public-repo safety: fork PR code must never reach persistent self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: install yq
        # Always download + checksum-verify into the ephemeral $RUNNER_TEMP and
        # prepend it to PATH — never short-circuit on a yq already in PATH. On a
        # persistent self-hosted runner a prior (possibly attacker-planted) yq
        # could otherwise be reused unverified across jobs (codex-security
        # target #2); $RUNNER_TEMP is per-job, so the verified binary always wins.
        run: |
          YQ_VERSION=4.44.6
          YQ_LINUX_ARM64_SHA256=9477ac3cc447b6c083986129e35af8122eb2b938fe55c9c3e40436fb966e5813
          archive="$RUNNER_TEMP/yq"
          curl -fsSL -o "$archive" \
            "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_arm64"
          echo "$YQ_LINUX_ARM64_SHA256  $archive" | sha256sum -c -
          chmod +x "$archive"
          install -m755 -D "$archive" "$RUNNER_TEMP/bin/yq"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/yq" --version
      - name: install fga CLI # model.fga <-> model.json drift gate
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL https://github.com/openfga/cli/releases/download/v0.7.17/fga_0.7.17_linux_arm64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/bin" fga
          chmod +x "$RUNNER_TEMP/bin/fga"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: install promtool # alerting-rule check + unit tests (w3/m6); matches the pinned chart appVersion
        run: |
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-arm64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" prometheus-2.55.1.linux-arm64/promtool
          install -m755 -D "$RUNNER_TEMP/prometheus-2.55.1.linux-arm64/promtool" \
            "$RUNNER_TEMP/bin/promtool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: validate
        run: bash scripts/gitops-validate.sh
      - name: platform-pod hardening guard self-test # w7/m58: proves the guard bites
        run: bash scripts/gitops-hardening-guard-test.sh
