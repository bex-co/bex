name: Egress meter live matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cilium-live-matrix:
    # The product image currently targets the production arm64 node pool.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.6"
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.1
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.30.0
      - name: Run isolated Cilium traffic matrix
        run: bash scripts/verify-egress-meter.sh
