name: deploy (bex via Argo)

# Phase 3: deploy the bex platform onto the app cluster via GitOps.
#   1. build + push the operator + dashboard images to GHCR (linux/amd64 = Hetzner cpx)
#   2. fetch the app cluster kubeconfig (hcloud API -> CP node IP -> SSH admin.conf)
#   3. install Argo CD on the app cluster (idempotent)
#   4. apply the prod app-of-apps -> Argo reconciles deploy/gitops/overlays/prod
#      (zot, opensandbox-controller, the bex operator, the bex dashboard) continuously from git
#
# After this the operator is running; deploy a user App with `kubectl apply`
# (that's the product runtime — NOT GitOps). CI-only, idempotent.
#
# Secrets: same as app-cluster.yml (HCLOUD_TOKEN, BEX_SSH_PRIVATE_KEY).
# GITHUB_TOKEN (auto) pushes to GHCR. ⚠ Make the GHCR packages public, or add an
# imagePullSecret in bex-system / dashboard, so app-cluster nodes can pull the images.
# ⚠ If this repo is private, give Argo CD repo credentials (else it can't read git).

on:
  push:
    branches: [main]
    paths:
      - "lego/**"
      # The CLI (lego/cli/) ships as user-installed binaries via the
      # bex-cli/v* tag train (cli-release.yml), not via the platform image —
      # its commits must not trigger a production platform redeploy.
      - "!lego/cli/**"
      - "dashboard/**"
      - "deploy/opensandbox/**"
      - "deploy/gitops/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# Digest write-back and the subsequent Argo rollout are one production
# transaction. Queue main pushes so two runs cannot race their four image
# digests or deploy an older commit after a newer one.
concurrency:
  group: bex-production-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bex-co/bex-operator
  DASHBOARD_IMAGE: ghcr.io/bex-co/bex-dashboard
  OPENSANDBOX_IMAGE: ghcr.io/bex-co/opensandbox-server
  OPENSANDBOX_CONTROLLER_IMAGE: ghcr.io/bex-co/opensandbox-controller
  OPENSANDBOX_CONTROLLER_TAG: v0.2.0-bex-snapjobns-terminalpod
  AGENT_SANDBOX_IMAGE: ghcr.io/bex-co/bex-agent-sandbox

jobs:
  # --- gates: all product + carried-controller tests pass before any image build ---
  test-backend:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/backend-test.yml

  test-operator:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/operator-test.yml

  test-dashboard:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/dashboard-test.yml

  test-opensandbox-controller:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/opensandbox-controller-test.yml

  # --- secret scanning: gitleaks over the pushed commits (w7/002) ---
  # Runs in parallel with the test gates. Findings are warn-first and do not
  # block CI until the historical baseline is tuned; scanner setup failures do.
  # Distinct from trivy CVE scanning (w7/m10 — image vulnerabilities) and
  # Dependabot (w1/006 — dependency CVEs): this catches secrets in the repo itself.
  secret-scan:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history so gitleaks can walk the pushed commit range
      # The maintained gitleaks-action requires a separate license for GitHub
      # organization repositories. Run the official open-source CLI directly so
      # this gate performs a real scan without a JavaScript action runtime.
      - name: install Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_LINUX_X64_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: scan pushed commits for secrets
        # Warn-first: findings fail this step but never block deploy.
        continue-on-error: true
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          before="$BEFORE_SHA"
          if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then
            before="$(git rev-parse "${AFTER_SHA}^" 2>/dev/null || true)"
          fi
          if [ -n "$before" ]; then
            log_opts="$before..$AFTER_SHA"
          else
            log_opts="$AFTER_SHA"
          fi
          gitleaks git --no-banner --redact --exit-code 1 --log-opts="$log_opts" .

  # --- supersession pre-check (w1/m59): if a newer deploy-triggering commit has
  # already landed on main (this run was queued behind it), skip build-and-deploy
  # BEFORE it wastes an image build — the job is then reported skipped (neutral),
  # not failed. Optimization only: the write-back guard below stays the
  # correctness gate (never pin stale images), so scripts/deploy-superseded.sh
  # reporting "not superseded" on any error just lets the build proceed to be
  # re-checked there. cancel-in-progress:false is untouched — a running build is
  # never cancelled; only a not-yet-started one is skipped. ---
  check-supersession:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    outputs:
      superseded: ${{ steps.check.outputs.superseded }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          if bash scripts/deploy-superseded.sh "$GITHUB_SHA"; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    permissions:
      contents: write
      packages: write
      id-token: write
    needs: [test-backend, test-operator, test-dashboard, test-opensandbox-controller, secret-scan, check-supersession]
    # A run superseded before its build starts is skipped here (neutral, no
    # build). A run superseded DURING its build is caught by the write-back guard
    # (it concludes neutral instead). w1/m59.
    #
    # Ref guard (scan finding #2): this job checks out the dispatched ref and then
    # exposes cluster/SSH/OpenBao production secrets, so it must run ONLY from the
    # reviewed default branch. Without this, a same-repo collaborator could
    # workflow_dispatch a modified branch and reach production credentials without
    # merging to main. Defense in depth alongside GitHub-side protected
    # environments + branch policies (the infra.yml `production-infra` pattern),
    # which are the authoritative control but live in repo settings, not YAML.
    if: needs.check-supersession.outputs.superseded != 'true' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    # codex-security round-19 #2: the comment above named the infra.yml
    # `production-infra` pattern as authoritative but this job never actually
    # carried an `environment:` — unlike infra.yml/snapshot.yml/cli-release.yml,
    # which all do — so the ref guard was the ONLY gate before this job's build,
    # release, and admin.conf/OpenBao-root/unseal steps ran. Attach it here so a
    # protected `production-deploy` environment with required reviewers can gate
    # the credentialed steps exactly like the sibling workflows.
    #
    # This does not yet split secretless build from credentialed deploy (the
    # finding's fuller remediation) — that stays a follow-up; every step in this
    # job still shares the same environment-scoped secrets.
    environment: production-deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.1

      # --- 1. build + push the operator image ---
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build_operator
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: lego
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      # --- 1b. build + push the dashboard image (docs/ADR012-auth.md §5) ---
      # VITE_* are Vite build-time values baked into the JS bundle — the SSR
      # ones use in-cluster Service DNS (the dashboard's own pod reaches
      # Kratos/bex-api directly, not back out through the public ingress).
      - id: build_dashboard
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: dashboard
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=https://api.bex.co/graphql
            VITE_SSR_API_URL=http://bex-api.bex-system.svc:8090/graphql
            VITE_KRATOS_PUBLIC_URL=https://auth.bex.co
            VITE_KRATOS_SSR_URL=http://kratos-public.auth.svc:80
            BEX_MOBILE_APPLE_TEAM_ID=${{ vars.BEX_MOBILE_APPLE_TEAM_ID }}
            BEX_MOBILE_ANDROID_SHA256_CERT_FINGERPRINTS=${{ vars.BEX_MOBILE_ANDROID_SHA256_CERT_FINGERPRINTS }}
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}
            ${{ env.DASHBOARD_IMAGE }}:latest

      # --- 1c. build the pinned OpenSandbox lifecycle server image (w3/m35) ---
      - id: build_opensandbox
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: deploy/opensandbox
          file: deploy/opensandbox/server.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: OPENSANDBOX_SERVER_VERSION=0.2.2
          tags: |
            ${{ env.OPENSANDBOX_IMAGE }}:${{ github.sha }}
            ${{ env.OPENSANDBOX_IMAGE }}:0.2.2

      # --- 1c'. build the patched OpenSandbox controller image ---
      # Upstream at a pinned commit plus the carried snapshot-job-namespace
      # (w3/m42) and terminal-child-Pod (w5/m72) patches. The reusable envtest
      # workflow above applies both to this exact pin before any image is built.
      - id: build_opensandbox_controller
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: deploy/opensandbox
          file: deploy/opensandbox/controller.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.OPENSANDBOX_CONTROLLER_IMAGE }}:${{ github.sha }}
            ${{ env.OPENSANDBOX_CONTROLLER_IMAGE }}:${{ env.OPENSANDBOX_CONTROLLER_TAG }}

      # --- 1d. build the ADR047 agent sandbox template image (w3/m37) ---
      - id: build_agent_sandbox
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: lego
          file: lego/agent-image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.AGENT_SANDBOX_IMAGE }}:${{ github.sha }}
            ${{ env.AGENT_SANDBOX_IMAGE }}:latest

      # --- 1e. supply chain: cosign sign + SBOM every pushed image (w6/m6 t002) ---
      # Keyless Sigstore signing (the workflow's own GitHub Actions OIDC identity,
      # recorded in the Rekor transparency log — no signing key to custody) plus an
      # SPDX SBOM generated by syft and attached as a referrer to each image. Both
      # legs ride the digest build-push-action just emitted, so a tag can never be
      # re-pointed under a signature. Verify a pulled image with:
      #   cosign verify \
      #     --certificate-identity-regexp 'https://github.com/bex-co/bex/.github' \
      #     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
      #     ghcr.io/bex-co/bex-operator@sha256:<digest>
      # CNB tenant images (in-cluster BuildKit → internal Zot) are deferred: no OIDC
      # identity is available in the build Job, and admission-time verification is out
      # of scope for this task — see docs/security-review.md §supply-chain.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: sign images + attest SBOM
        env:
          # One content-addressed ref per line. The loop signs each image keyless
          # and records an SPDX SBOM as an in-toto attestation (cosign attest —
          # the attach+sign-attachment flow is deprecated upstream); each
          # platform image is one line here, not a copied signing step.
          REFS: |-
            ${{ env.IMAGE }}@${{ steps.build_operator.outputs.digest }}
            ${{ env.DASHBOARD_IMAGE }}@${{ steps.build_dashboard.outputs.digest }}
            ${{ env.OPENSANDBOX_IMAGE }}@${{ steps.build_opensandbox.outputs.digest }}
            ${{ env.OPENSANDBOX_CONTROLLER_IMAGE }}@${{ steps.build_opensandbox_controller.outputs.digest }}
            ${{ env.AGENT_SANDBOX_IMAGE }}@${{ steps.build_agent_sandbox.outputs.digest }}
        run: |
          for ref in $REFS; do
            cosign sign --yes "$ref"
            syft "$ref" -o spdx-json > /tmp/sbom.spdx.json
            cosign attest --yes --type spdxjson --predicate /tmp/sbom.spdx.json "$ref"
          done

      # --- 1f. CVE scan: CRITICAL fails CI, HIGH warns (w7/m10 t001) ---
      # Trivy scans both built+pushed images for known CVEs. Two passes per image:
      # a non-blocking HIGH+CRITICAL report (always exits 0, shows the full picture)
      # and a blocking CRITICAL-only gate (exit-code 1 if any CRITICAL is found).
      # `ignore-unfixed: true` suppresses findings where no fix is yet available
      # (noise without an actionable path — revisit when vendor ships a patch).
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        name: CVE scan — operator image HIGH+CRITICAL (report)
        with:
          image-ref: '${{ env.IMAGE }}@${{ steps.build_operator.outputs.digest }}'
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        name: CVE scan — operator image CRITICAL (gate)
        with:
          image-ref: '${{ env.IMAGE }}@${{ steps.build_operator.outputs.digest }}'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        name: CVE scan — dashboard image HIGH+CRITICAL (report)
        with:
          image-ref: '${{ env.DASHBOARD_IMAGE }}@${{ steps.build_dashboard.outputs.digest }}'
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        name: CVE scan — dashboard image CRITICAL (gate)
        with:
          image-ref: '${{ env.DASHBOARD_IMAGE }}@${{ steps.build_dashboard.outputs.digest }}'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        name: CVE scan — OpenSandbox server HIGH+CRITICAL (report)
        with:
          image-ref: '${{ env.OPENSANDBOX_IMAGE }}@${{ steps.build_opensandbox.outputs.digest }}'
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        name: CVE scan — OpenSandbox server CRITICAL (gate)
        with:
          image-ref: '${{ env.OPENSANDBOX_IMAGE }}@${{ steps.build_opensandbox.outputs.digest }}'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        name: CVE scan — OpenSandbox controller HIGH+CRITICAL (report)
        with:
          image-ref: '${{ env.OPENSANDBOX_CONTROLLER_IMAGE }}@${{ steps.build_opensandbox_controller.outputs.digest }}'
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        name: CVE scan — OpenSandbox controller CRITICAL (gate)
        with:
          image-ref: '${{ env.OPENSANDBOX_CONTROLLER_IMAGE }}@${{ steps.build_opensandbox_controller.outputs.digest }}'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        name: CVE scan — agent sandbox image HIGH+CRITICAL (report)
        with:
          image-ref: '${{ env.AGENT_SANDBOX_IMAGE }}@${{ steps.build_agent_sandbox.outputs.digest }}'
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        name: CVE scan — agent sandbox image CRITICAL (gate)
        with:
          image-ref: '${{ env.AGENT_SANDBOX_IMAGE }}@${{ steps.build_agent_sandbox.outputs.digest }}'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

      # --- 1g. GitOps write-back: pin deployed control-plane images ---
      # Argo syncs git, not image tags, so a mutable :latest override never rolls pods on
      # its own AND leaves the running Deployment pinned to a tag whose contents can change
      # under it. Rewrite the kustomize image overrides in deploy/gitops to the exact
      # @sha256 digests docker just pushed, and commit them back to main. Argo then deploys
      # a content-addressed, immutable reference — no more :latest in the running spec.
      # `[skip ci]` keeps this commit from re-triggering deploy.yml (it touches deploy/gitops/**).
      - name: pin image digests in GitOps (write-back)
        env:
          OP_DIGEST: ${{ steps.build_operator.outputs.digest }}
          DASH_DIGEST: ${{ steps.build_dashboard.outputs.digest }}
          OPENSANDBOX_DIGEST: ${{ steps.build_opensandbox.outputs.digest }}
          CONTROLLER_DIGEST: ${{ steps.build_opensandbox_controller.outputs.digest }}
          AGENT_DIGEST: ${{ steps.build_agent_sandbox.outputs.digest }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Runs are serialized above, but ordinary pushes can still advance
          # main while images are building. Never attach images built from this
          # event to newer production source/manifests: the newer queued run
          # must build and pin its own digests. A preceding run can legitimately
          # finish its [skip ci] digest write-back after this event was created,
          # so scripts/deploy-superseded.sh permits only the five generated image
          # fields to differ; every other production-input change is a supersession.
          # When superseded (the pre-check job could not catch a commit that landed
          # DURING this build), conclude NEUTRAL: flag the rollout steps below to
          # skip, pin nothing, and exit 0 (green, not red). w1/m59.
          set +e
          bash scripts/deploy-superseded.sh "$GITHUB_SHA"
          superseded_rc=$?
          set -e
          if [ "$superseded_rc" -eq 0 ]; then
            echo "SUPERSEDED=true" >> "$GITHUB_ENV"
            echo "::notice::superseded by a newer run — images built but intentionally not pinned; skipping the rollout"
            exit 0
          elif [ "$superseded_rc" -ne 1 ]; then
            echo "supersession check errored (rc=$superseded_rc); refusing stale digest write-back" >&2
            exit 1
          fi
          python3 - "$GITHUB_SHA" origin/main <<'PY'
          import re
          import subprocess
          import sys

          revisions = sys.argv[1:]
          generated = {
              "deploy/gitops/base/bex.yaml":
                  r"(?m)^(\s+- controller=[^@\n]+@sha256:)[0-9a-f]{64}$",
              "deploy/gitops/base/dashboard.yaml":
                  r"(?m)^(\s+- dashboard=[^@\n]+@sha256:)[0-9a-f]{64}$",
              "deploy/opensandbox/kustomization.yaml":
                  r"(?m)(^  - name: opensandbox-server\n    newName: [^\n]+\n    digest: sha256:)[0-9a-f]{64}$",
              "deploy/gitops/base/values/opensandbox-controller.values.yaml":
                  r"(?m)^(\s+tag: [^@\s]+@sha256:)[0-9a-f]{64}$",
              "lego/operator/config/api/deployment.yaml":
                  r"(?m)^(\s+value: ghcr.io/bex-co/bex-agent-sandbox)(?::[^@\s]+|@sha256:[0-9a-f]{64})$",
          }

          def normalized(revision, path, pattern):
              text = subprocess.check_output(
                  ["git", "show", f"{revision}:{path}"], text=True
              )
              rendered, count = re.subn(pattern, r"\g<1><generated>", text)
              if count != 1:
                  raise SystemExit(f"expected exactly one generated digest field in {path}")
              return rendered

          for path, pattern in generated.items():
              if normalized(revisions[0], path, pattern) != normalized(revisions[1], path, pattern):
                  raise SystemExit(
                      f"production input {path} changed beyond its generated digest; "
                      "refusing stale digest write-back"
                  )
          PY
          git rebase origin/main
          for digest in "$OP_DIGEST" "$DASH_DIGEST" "$OPENSANDBOX_DIGEST" "$CONTROLLER_DIGEST" "$AGENT_DIGEST"; do
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "build emitted an invalid image digest" >&2
              exit 1
            fi
          done
          sed -Ei "s#(controller=${IMAGE})(:[^@[:space:]]+|@sha256:[a-f0-9]+)#\1@${OP_DIGEST}#" \
            deploy/gitops/base/bex.yaml
          sed -Ei "s#(dashboard=${DASHBOARD_IMAGE})(:[^@[:space:]]+|@sha256:[a-f0-9]+)#\1@${DASH_DIGEST}#" \
            deploy/gitops/base/dashboard.yaml
          sed -Ei "s#(value: ${AGENT_SANDBOX_IMAGE})(:[^@[:space:]]+|@sha256:[a-f0-9]+)#\1@${AGENT_DIGEST}#" \
            lego/operator/config/api/deployment.yaml
          python3 - "${OPENSANDBOX_DIGEST}" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path("deploy/opensandbox/kustomization.yaml")
          text = path.read_text()
          pattern = r"(?m)(^  - name: opensandbox-server\n    newName: [^\n]+\n)    (?:newTag|digest): [^\n]+$"
          rendered, count = re.subn(pattern, rf"\1    digest: {sys.argv[1]}", text)
          if count != 1:
              raise SystemExit("expected exactly one opensandbox-server image override")
          path.write_text(rendered)
          PY
          python3 - "${CONTROLLER_DIGEST}" "${OPENSANDBOX_CONTROLLER_TAG}" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path("deploy/gitops/base/values/opensandbox-controller.values.yaml")
          text = path.read_text()
          pattern = rf"(?m)^(\s+tag: {re.escape(sys.argv[2])}@)sha256:[0-9a-f]{{64}}$"
          rendered, count = re.subn(pattern, rf"\g<1>{sys.argv[1]}", text)
          if count != 1:
              raise SystemExit("expected exactly one OpenSandbox controller digest")
          path.write_text(rendered)
          PY
          grep -qF "controller=${IMAGE}@${OP_DIGEST}" deploy/gitops/base/bex.yaml
          grep -qF "dashboard=${DASHBOARD_IMAGE}@${DASH_DIGEST}" deploy/gitops/base/dashboard.yaml
          grep -qF "digest: ${OPENSANDBOX_DIGEST}" deploy/opensandbox/kustomization.yaml
          grep -qF "tag: ${OPENSANDBOX_CONTROLLER_TAG}@${CONTROLLER_DIGEST}" deploy/gitops/base/values/opensandbox-controller.values.yaml
          grep -qF "value: ${AGENT_SANDBOX_IMAGE}@${AGENT_DIGEST}" lego/operator/config/api/deployment.yaml
          if git diff --quiet -- deploy/gitops/base/bex.yaml deploy/gitops/base/dashboard.yaml deploy/opensandbox/kustomization.yaml deploy/gitops/base/values/opensandbox-controller.values.yaml lego/operator/config/api/deployment.yaml; then
            echo "digests already pinned — nothing to write back"
          else
            git add deploy/gitops/base/bex.yaml deploy/gitops/base/dashboard.yaml deploy/opensandbox/kustomization.yaml deploy/gitops/base/values/opensandbox-controller.values.yaml lego/operator/config/api/deployment.yaml
            git commit -m "chore(deploy): pin platform images to ${GITHUB_SHA::12} [skip ci]"
            git push origin HEAD:main
          fi

      # --- 2. fetch the app cluster kubeconfig via a CP node (self-managed, w1/m19.1) ---
      - name: get app cluster kubeconfig
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          # Funneled through env rather than interpolated into the script body,
          # the repo's standing injection-safety convention for secrets.
          BEX_SSH_KNOWN_HOSTS: ${{ secrets.BEX_SSH_KNOWN_HOSTS }}
        run: |
          install -m700 -d ~/.ssh
          printf '%s\n' "${{ secrets.BEX_SSH_PRIVATE_KEY }}" > ~/.ssh/id_bex
          chmod 600 ~/.ssh/id_bex
          # Authenticate the control-plane host key (w1/m66 F7): the pin makes
          # the fetch fail closed on an unknown/changed key instead of trusting
          # it on first use and handing every later step an attacker-supplied
          # admin.conf.
          #
          # codex F10 / w1/m68 t006: BEX_SSH_REQUIRE_KNOWN_HOSTS=1 asserts
          # mandatory-pin mode — the BEX_SSH_KNOWN_HOSTS secret was captured and
          # provisioned 2026-08-13 (fingerprints verified out of band via the
          # cluster-private network, docs/ADR019-infra-credentials.md), so a
          # missing/empty pin now aborts the run rather than silently reverting
          # to trust-on-first-use. Re-capture on control-plane template rotation
          # (ADR053) BEFORE the rotation's first deploy, or that deploy aborts here.
          export BEX_SSH_REQUIRE_KNOWN_HOSTS=1
          if [ -n "${BEX_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "${BEX_SSH_KNOWN_HOSTS}" > ~/.ssh/bex_known_hosts
            chmod 600 ~/.ssh/bex_known_hosts
            export BEX_SSH_KNOWN_HOSTS_FILE=~/.ssh/bex_known_hosts
          fi
          bash scripts/fetch-app-kubeconfig.sh "$PWD/app.kubeconfig"
          echo "KUBECONFIG=$PWD/app.kubeconfig" >> "$GITHUB_ENV"

      # Mirror only archives whose upstream bytes and resulting OCI manifests
      # match deploy/helm-artifacts.lock. Argo consumes these packages by digest,
      # never by an upstream chart-repository version label. GHCR chart packages
      # must be public so Argo can pull without a durable registry credential.
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        if: ${{ env.SUPERSEDED != 'true' }}
        with:
          version: 1.3.1

      - name: mirror reviewed Helm charts
        if: ${{ env.SUPERSEDED != 'true' }}
        run: |
          chart_dir=$(mktemp -d)
          trap 'rm -rf -- "$chart_dir"' EXIT
          bash scripts/helm-artifact.sh mirror "$chart_dir"

      # --- 3. install Argo CD on the app cluster (idempotent) ---
      # --server-side: the argo install bundles CRDs (applicationsets) whose schema
      # exceeds kubectl's 256KB last-applied-config annotation limit; SSA avoids it.
      - name: install Argo CD
        env:
          ARGO_INSTALL_COMMIT: e1becb74c728a992804d39c3ceb2e9e6ae58f0ae
          ARGO_INSTALL_SHA256: 752b5a2681f2522fc78ea12ba2d23be44a4523cfa5d9a55cf1907909cc23fc5d
        run: |
          argo_manifest="$RUNNER_TEMP/argocd-install.yaml"
          curl -fsSLo "$argo_manifest" \
            "https://raw.githubusercontent.com/argoproj/argo-cd/${ARGO_INSTALL_COMMIT}/manifests/install.yaml"
          printf '%s  %s\n' "$ARGO_INSTALL_SHA256" "$argo_manifest" | sha256sum -c -
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply --server-side --force-conflicts -n argocd \
            -f "$argo_manifest"
          # w1/m19 t003: Argo CD itself rides the platform pool (upstream install
          # carries no scheduling; patching here keeps us on the stock manifest).
          # Idempotent: re-patching the same values causes no rollout.
          SCHED='{"spec":{"template":{"spec":{"nodeSelector":{"bex.co/pool":"platform"},"tolerations":[{"key":"bex.co/platform","operator":"Equal","value":"true","effect":"NoSchedule"}]}}}}'
          for d in argocd-server argocd-repo-server argocd-applicationset-controller \
                   argocd-notifications-controller argocd-dex-server argocd-redis; do
            kubectl -n argocd patch deployment "$d" --type strategic -p "$SCHED"
          done
          kubectl -n argocd patch statefulset argocd-application-controller --type strategic -p "$SCHED"
          kubectl -n argocd rollout status deploy/argocd-repo-server --timeout=300s
          kubectl -n argocd rollout status deploy/argocd-server --timeout=300s

      # --- 3b. give Argo a read-only SSH deploy key for the private repo ---
      # The app-of-apps and the bex-operator child app source from this private
      # repo over SSH; without this credential Argo can't clone it. github.com host
      # keys ship in argocd-ssh-known-hosts-cm (part of the install), so no extra
      # known_hosts config is needed.
      - name: configure Argo repo credentials
        run: |
          printf '%s\n' "${{ secrets.ARGOCD_REPO_SSH_KEY }}" > /tmp/argo_deploy_key
          kubectl -n argocd create secret generic bex-repo \
            --from-literal=type=git \
            --from-literal=url=git@github.com:bex-co/bex.git \
            --from-file=sshPrivateKey=/tmp/argo_deploy_key \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n argocd label secret bex-repo argocd.argoproj.io/secret-type=repository --overwrite
          rm -f /tmp/argo_deploy_key

      # --- 4. point Argo at the repo; it reconciles the whole platform ---
      - name: apply prod app-of-apps
        run: kubectl apply -f deploy/gitops/bootstrap/prod.yaml

      - name: install internal control-plane credential
        run: |
          timeout 300 bash -c 'until kubectl get namespace bex-system >/dev/null 2>&1; do sleep 5; done'
          bash scripts/cp-token-secret.sh

      # The lifecycle server reuses the already-custodied internal control-plane
      # bearer, but receives it through a namespace-local out-of-band Secret.
      # Git owns the Secret reference and all non-secret config; CI never prints
      # or commits the token bytes.
      - name: mirror OpenSandbox control-plane credential
        run: |
          timeout 300 bash -c 'until kubectl get namespace opensandbox-system >/dev/null 2>&1; do sleep 5; done'
          bash scripts/opensandbox-server-secret.sh

      # The OpenSandbox Applications are independent Argo children, so waiting
      # only for bex/dashboard can report a green deployment while the sandbox
      # control plane is CrashLooping. Require the just-built server digest and
      # both lifecycle/controller Deployments to become fully available.
      - name: wait for OpenSandbox control plane
        # A superseded run built images but deliberately pinned nothing, so this
        # digest can never appear in the cluster — waiting for it burns the full
        # 10-minute budget and then fails a run the supersession check already
        # concluded NEUTRAL, and the rollout restart below needlessly bounces the
        # prod control plane. Skip it exactly like the rollout steps do. (No
        # always() here: unlike those, this step should still skip when an
        # earlier step failed, which is its current behavior.)
        if: ${{ env.SUPERSEDED != 'true' }}
        timeout-minutes: 12
        env:
          BEX_EXPECTED_OPENSANDBOX_IMAGE: ${{ env.OPENSANDBOX_IMAGE }}@${{ steps.build_opensandbox.outputs.digest }}
          # The upstream Helm chart always renders repository:tag, even when
          # the tag carries an immutable digest. Kubernetes preserves that
          # human-readable tag in the Deployment image string.
          BEX_EXPECTED_OPENSANDBOX_CONTROLLER_IMAGE: ${{ env.OPENSANDBOX_CONTROLLER_IMAGE }}:${{ env.OPENSANDBOX_CONTROLLER_TAG }}@${{ steps.build_opensandbox_controller.outputs.digest }}
        run: |
          deadline=$((SECONDS + 600))
          actual=""
          controller_actual=""
          while ((SECONDS < deadline)); do
            actual="$(kubectl -n opensandbox-system get deployment opensandbox-server -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
            controller_actual="$(kubectl -n opensandbox-system get deployment opensandbox-controller-manager -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
            [ "$actual" = "$BEX_EXPECTED_OPENSANDBOX_IMAGE" ] \
              && [ "$controller_actual" = "$BEX_EXPECTED_OPENSANDBOX_CONTROLLER_IMAGE" ] \
              && break
            sleep 5
          done
          if [ "$actual" != "$BEX_EXPECTED_OPENSANDBOX_IMAGE" ]; then
            echo "opensandbox-server image is ${actual:-missing}, want $BEX_EXPECTED_OPENSANDBOX_IMAGE" >&2
            kubectl -n argocd get applications
            exit 1
          fi
          if [ "$controller_actual" != "$BEX_EXPECTED_OPENSANDBOX_CONTROLLER_IMAGE" ]; then
            echo "opensandbox-controller image is ${controller_actual:-missing}, want $BEX_EXPECTED_OPENSANDBOX_CONTROLLER_IMAGE" >&2
            kubectl -n argocd get applications
            exit 1
          fi
          # Reset crash backoff and stale ProgressDeadlineExceeded conditions
          # from a previously degraded release, then level-check availability.
          kubectl -n opensandbox-system rollout restart \
            deploy/opensandbox-controller-manager deploy/opensandbox-server
          for deployment in opensandbox-controller-manager opensandbox-server; do
            deadline=$((SECONDS + 600))
            available=0
            desired=1
            while ((SECONDS < deadline)); do
              state="$(kubectl -n opensandbox-system get deployment "$deployment" -o json 2>/dev/null \
                | jq -r '[.metadata.generation, (.status.observedGeneration // 0), (.spec.replicas // 1), (.status.availableReplicas // 0)] | @tsv' \
                || true)"
              read -r generation observed desired available <<<"$state"
              if [ -n "${generation:-}" ] && ((observed >= generation && available >= desired)); then
                break
              fi
              sleep 5
            done
            if [ -z "${generation:-}" ] || ((observed < generation || available < desired)); then
              echo "$deployment has ${available:-0}/${desired:-1} available replicas" >&2
              kubectl -n opensandbox-system get pods
              exit 1
            fi
          done

      # --- 4b. auth substrate secrets (docs/ADR012-auth.md) — out-of-band of GitOps ---
      # Argo creates the CNPG Clusters (auth-dbs, sync-wave 2); once CNPG has
      # generated their DB credentials, auth-secrets.sh composes the DSNs and
      # writes the auth/kratos + auth/hydra Secrets that the kratos/hydra
      # Applications (wave 3) consume. Idempotent — safe on every deploy.
      - name: apply auth secrets
        env:
          KRATOS_SECRETS_DEFAULT: ${{ secrets.KRATOS_SECRETS_DEFAULT }}
          KRATOS_SECRETS_COOKIE: ${{ secrets.KRATOS_SECRETS_COOKIE }}
          KRATOS_SECRETS_CIPHER: ${{ secrets.KRATOS_SECRETS_CIPHER }}
          HYDRA_SECRETS_SYSTEM: ${{ secrets.HYDRA_SECRETS_SYSTEM }}
          HYDRA_SECRETS_COOKIE: ${{ secrets.HYDRA_SECRETS_COOKIE }}
          HYDRA_OIDC_PAIRWISE_SALT: ${{ secrets.HYDRA_OIDC_PAIRWISE_SALT }}
          OPENFGA_PRESHARED_KEY: ${{ secrets.OPENFGA_PRESHARED_KEY }}
          # Optional social login (docs/ADR012-auth.md § Social login) — unset secrets
          # resolve empty, so auth-secrets.sh writes the oidc.yaml fragment disabled.
          BEX_GITHUB_OIDC_CLIENT_ID: ${{ secrets.BEX_GITHUB_OIDC_CLIENT_ID }}
          BEX_GITHUB_OIDC_CLIENT_SECRET: ${{ secrets.BEX_GITHUB_OIDC_CLIENT_SECRET }}
          # Shared SMTP relay (docs/ADR012-auth.md §11): the courier URI (required — the
          # courier is enabled) into the kratos Secret, and the bex-api invite
          # mailer's credentials into bex-system/bex-smtp.
          KRATOS_COURIER_SMTP_URI: ${{ secrets.KRATOS_COURIER_SMTP_URI }}
          BEX_SMTP_USERNAME: ${{ secrets.BEX_SMTP_USERNAME }}
          BEX_SMTP_PASSWORD: ${{ secrets.BEX_SMTP_PASSWORD }}
        run: |
          for s in kratos-db-app hydra-db-app openfga-db-app; do
            timeout 300 bash -c "until kubectl -n auth get secret $s >/dev/null 2>&1; do sleep 5; done" \
              || { echo "CNPG credentials $s never appeared — Argo status:"; kubectl -n argocd get applications; exit 1; }
          done
          bash scripts/auth-secrets.sh

      # --- 4c. bootstrap API key --------------------------------------------
      # bex-api has no shared static token (docs/ADR006-bex-api.md#auth): seed the
      # `bex-bootstrap` OAuth2 client once Hydra is Ready. Idempotent.
      # This is a rollout gate: both the confidential bootstrap client and the
      # fixed secretless Render CLI client are required platform configuration.
      # A kubelet TLS failure must be repaired rather than silently shipping a
      # production API whose interactive login route cannot exchange tokens.
      - name: seed bootstrap client
        timeout-minutes: 5
        env:
          BEX_BOOTSTRAP_CLIENT_SECRET: ${{ secrets.BEX_BOOTSTRAP_CLIENT_SECRET }}
        run: |
          timeout 600 bash -c "until kubectl -n auth get deploy/hydra >/dev/null 2>&1; do sleep 10; done" \
            || { echo "hydra Deployment never appeared — Argo status:"; kubectl -n argocd get applications; exit 1; }
          kubectl -n auth rollout status deploy/hydra --timeout=600s \
            || { echo "hydra not ready — Argo status:"; kubectl -n argocd get applications; exit 1; }
          for i in 1 2 3; do
            bash scripts/auth-bootstrap-client.sh && break
            [ "$i" -lt 3 ] && { echo "attempt $i failed, retrying in 15s..."; sleep 15; }
          done

      # --- 4d. authorization model + seed tuples (docs/ADR012-auth.md) ---------------
      # Idempotent: store `bex` ensured, deploy/gitops/authz/model.json written
      # only when changed, bootstrap tuples tolerated as already-present.
      # continue-on-error: same kubelet-TLS caveat as 4c above; model changes
      # are rare and the last applied model stays in OpenFGA until next success.
      - name: apply authorization model
        continue-on-error: true
        timeout-minutes: 12
        env:
          OPENFGA_PRESHARED_KEY: ${{ secrets.OPENFGA_PRESHARED_KEY }}
        run: |
          # A sync can wedge mid-operation (e.g. a hook that can never fire —
          # the original openfga revision's PostSync deadlock) and the wedged
          # state survives operation patches. Deterministic recovery: recreate
          # the Application. It carries no resources finalizer, so deletion is
          # non-cascading, and the app-of-apps (selfHeal) recreates it fresh;
          # a fresh app auto-syncs with hooks.
          if [ "$(kubectl -n argocd get application openfga -o jsonpath='{.status.health.status}' 2>/dev/null)" = "Degraded" ]; then
            echo "openfga app Degraded — recreating the Application to clear wedged sync state"
            kubectl -n argocd delete application openfga --ignore-not-found --wait=true
            timeout 300 bash -c 'until kubectl -n argocd get application openfga >/dev/null 2>&1; do sleep 10; done' \
              || { echo "app-of-apps did not recreate openfga"; kubectl -n argocd get applications; exit 1; }
            kubectl -n argocd patch application openfga --type=merge \
              -p '{"operation":{"sync":{"prune":true}}}' 2>/dev/null || true
          fi
          # Poll actual availability: `rollout status` returns instantly on a
          # deployment whose progress deadline already lapsed, even as the fix
          # is still converging.
          timeout 600 bash -c 'until available="$(kubectl -n auth get deploy openfga -o jsonpath="{.status.availableReplicas}" 2>/dev/null)"; [ "${available:-0}" -ge 1 ]; do sleep 10; done' || {
            echo "openfga not ready — diagnosis:"
            kubectl -n auth get pods -o wide
            kubectl -n auth describe deploy openfga | tail -20
            kubectl -n auth describe pods -l app.kubernetes.io/name=openfga | grep -A12 "Events:" || true
            kubectl -n auth logs deploy/openfga --all-containers --tail=30 || true
            kubectl -n auth get jobs || true
            kubectl -n argocd get application openfga -o yaml | grep -B2 -A25 "operationState:" || true
            kubectl -n argocd get applications
            exit 1
          }
          bash scripts/authz-model.sh

      # --- 4e. OpenBao init/unseal + Kubernetes auth (docs/ADR013-secrets.md) --------
      # OpenBao ships sealed by design (no auto-unseal, docs/ADR013-secrets.md §3):
      # without this step the env-vars verbs 503 in prod even though bex-api
      # already points at the store (BEX_OPENBAO_URL in the api Deployment).
      # Idempotent — safe on every deploy: a re-run detects "already
      # initialized" and just unseals each pod. The unseal keys + root token
      # come from GitHub Actions secrets (seeded by the one-time manual
      # bao-init.sh run against prod, pushed via scripts/gh-secrets.sh). In HA
      # (prod replicas: 3) bao-init reaches each pod directly — the readiness
      # probe (`bao status`) fails while sealed, so wait for Running, not Ready
      # (same approach as scripts/bao-verify.sh's wait_pod_running).
      # continue-on-error: same kubelet-TLS caveat as 4c; OpenBao stays unsealed
      # across bex operator/api restarts (only seals on its own pod restart).
      # If the pod restarted and this step fails, unseal manually via bao-init.sh.
      - name: unseal OpenBao + configure Kubernetes auth
        continue-on-error: true
        timeout-minutes: 5
        env:
          BAO_UNSEAL_KEY_1: ${{ secrets.BAO_UNSEAL_KEY_1 }}
          BAO_UNSEAL_KEY_2: ${{ secrets.BAO_UNSEAL_KEY_2 }}
          BAO_UNSEAL_KEY_3: ${{ secrets.BAO_UNSEAL_KEY_3 }}
          BAO_ROOT_TOKEN: ${{ secrets.BAO_ROOT_TOKEN }}
        run: |
          timeout 600 bash -c 'until kubectl -n secrets get sts openbao >/dev/null 2>&1; do sleep 5; done' \
            || { echo "openbao StatefulSet never appeared — Argo status:"; kubectl -n argocd get applications; exit 1; }
          timeout 600 bash -c 'until kubectl -n secrets get pods -l app.kubernetes.io/name=openbao --no-headers 2>/dev/null | grep -q .; do sleep 5; done' \
            || { echo "openbao pods never appeared — Argo status:"; kubectl -n argocd get applications; exit 1; }
          kubectl -n secrets wait --for=jsonpath='{.status.phase}'=Running pod -l app.kubernetes.io/name=openbao --timeout=600s \
            || { echo "openbao pods never reached Running:"; kubectl -n secrets get pods; exit 1; }
          bash scripts/bao-init.sh
          bash scripts/bao-k8s-auth.sh

      - name: wait for the bex operator
        if: ${{ always() && env.SUPERSEDED != 'true' }}
        run: |
          kubectl -n bex-system rollout status deploy/bex-controller-manager --timeout=600s \
            || { echo "operator not ready — Argo status:"; kubectl -n argocd get applications; exit 1; }
          echo "bex operator running. Deploy an App: kubectl apply -f examples/whoami-app.yaml"

      # --- 5. roll bex onto the freshly-pushed image ---
      # The Argo image override pins the mutable :latest tag (deploy/gitops/base/
      # bex.yaml), so pushing a new :latest does NOT change the Deployment spec —
      # Kubernetes sees no diff and never rolls the pods, which keep the image they
      # pulled on a prior deploy. Force a fresh pull (both Deployments declare
      # imagePullPolicy: Always) so every push actually takes effect. Idempotent:
      # on a no-op deploy this just recreates identical pods.
      # if: always() — rollout restart is the primary deploy fast-path; it must
      # run even when earlier idempotent steps fail (e.g. kubelet TLS cert expiry
      # blocking exec/port-forward). Argo also deploys via the digest pin (slower).
      - name: roll bex onto the freshly-pushed image
        if: ${{ always() && env.SUPERSEDED != 'true' }}
        run: |
          kubectl -n bex-system rollout status deploy/bex-api --timeout=300s
          kubectl -n bex-system rollout restart deploy/bex-controller-manager deploy/bex-api
          kubectl -n bex-system rollout status deploy/bex-controller-manager --timeout=300s
          kubectl -n bex-system rollout status deploy/bex-api --timeout=300s
          # bex-api owns schema migration. Once its new pods are Ready, reconcile
          # the existing gateway role to THIS release's exact dbrole.sql without
          # rotating the credential/Secret, then roll the gateway onto the new
          # image. A new gateway DB method can no longer reach users before its
          # accompanying grant is installed (w5/m72).
          GRANTS_ONLY=1 bash scripts/ssh-gateway-db-role.sh
          kubectl -n bex-system rollout restart deploy/bex-ssh-gateway
          kubectl -n bex-system rollout status deploy/bex-ssh-gateway --timeout=300s

      # The infra workflow may be waiting to enable PROXY protocol on the two
      # raw datastore listeners. Do not report this deploy successful until
      # Argo has put the freshly built, header-capable digest on every proxy
      # pod. Merely calling `rollout status` is insufficient: an old, already-
      # Ready DaemonSet would return immediately before Argo observes the digest
      # write-back above.
      - name: wait for PROXY-compatible datastore proxies
        if: ${{ always() && steps.build_operator.outputs.digest != '' && env.SUPERSEDED != 'true' }}
        timeout-minutes: 12
        env:
          BEX_EXPECTED_PROXY_IMAGE: ${{ env.IMAGE }}@${{ steps.build_operator.outputs.digest }}
        run: |
          for daemonset in bex-pg-sni-proxy bex-kv-sni-proxy; do
            deadline=$((SECONDS + 600))
            actual=""
            while ((SECONDS < deadline)); do
              actual="$(kubectl -n bex-system get daemonset "${daemonset}" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
              [ "${actual}" = "${BEX_EXPECTED_PROXY_IMAGE}" ] && break
              sleep 5
            done
            if [ "${actual}" != "${BEX_EXPECTED_PROXY_IMAGE}" ]; then
              echo "${daemonset} image is ${actual:-missing}, want ${BEX_EXPECTED_PROXY_IMAGE}" >&2
              exit 1
            fi
            kubectl -n bex-system rollout status "daemonset/${daemonset}" --timeout=300s
          done

      # --- 6. roll the dashboard onto the freshly-pushed image ---
      # Same mutable-:latest caveat as step 5 (deploy/gitops/base/dashboard.yaml).
      - name: roll dashboard onto the freshly-pushed image
        if: ${{ always() && env.SUPERSEDED != 'true' }}
        run: |
          kubectl -n dashboard rollout status deploy/dashboard --timeout=300s \
            || { echo "dashboard not ready — Argo status:"; kubectl -n argocd get applications; exit 1; }
          kubectl -n dashboard rollout restart deploy/dashboard
          kubectl -n dashboard rollout status deploy/dashboard --timeout=300s
