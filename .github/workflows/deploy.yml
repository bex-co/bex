name: deploy (bex via Argo)

# Phase 3: deploy the bex platform onto the app cluster via GitOps.
#   1. build + push the operator + dashboard images to GHCR (linux/amd64 = Hetzner cpx)
#   2. fetch the app cluster kubeconfig (hcloud API -> CP node IP -> SSH admin.conf)
#   3. install Argo CD on the app cluster (idempotent)
#   4. apply the prod app-of-apps -> Argo reconciles deploy/gitops/overlays/prod
#      (zot, opensandbox-controller, the bex operator, the bex dashboard) continuously from git
#
# After this the operator is running; deploy a user App with `kubectl apply`
# (that's the product runtime — NOT GitOps). CI-only, idempotent.
#
# Secrets: same as app-cluster.yml (HCLOUD_TOKEN, BEX_SSH_PRIVATE_KEY).
# GITHUB_TOKEN (auto) pushes to GHCR. ⚠ Make the GHCR packages public, or add an
# imagePullSecret in bex-system / dashboard, so app-cluster nodes can pull the images.
# ⚠ If this repo is private, give Argo CD repo credentials (else it can't read git).

on:
  push:
    branches: [main]
    paths:
      - "lego/**"
      - "dashboard/**"
      - "deploy/gitops/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: write # GitOps write-back: pin the pushed image digests into git (w1/m7 t002)
  packages: write
  id-token: write # w6/m6 t002: keyless cosign signing (GitHub Actions OIDC identity)

env:
  IMAGE: ghcr.io/bex-co/bex-operator
  DASHBOARD_IMAGE: ghcr.io/bex-co/bex-dashboard

jobs:
  # --- gates: all three test suites must pass before any image is built or deployed ---
  test-backend:
    uses: ./.github/workflows/backend-test.yml

  test-operator:
    uses: ./.github/workflows/operator-test.yml

  test-dashboard:
    uses: ./.github/workflows/dashboard-test.yml

  build-and-deploy:
    needs: [test-backend, test-operator, test-dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- 1. build + push the operator image ---
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build_operator
        uses: docker/build-push-action@v6
        with:
          context: lego
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      # --- 1b. build + push the dashboard image (docs/ADR012-auth.md §5) ---
      # VITE_* are Vite build-time values baked into the JS bundle — the SSR
      # ones use in-cluster Service DNS (the dashboard's own pod reaches
      # Kratos/bex-api directly, not back out through the public ingress).
      - id: build_dashboard
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=https://api.bex.co/graphql
            VITE_SSR_API_URL=http://bex-api.bex-system.svc:8090/graphql
            VITE_KRATOS_PUBLIC_URL=https://auth.bex.co
            VITE_KRATOS_SSR_URL=http://kratos-public.auth.svc:80
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}
            ${{ env.DASHBOARD_IMAGE }}:latest

      # --- 1c. supply chain: cosign sign + SBOM every pushed image (w6/m6 t002) ---
      # Keyless Sigstore signing (the workflow's own GitHub Actions OIDC identity,
      # recorded in the Rekor transparency log — no signing key to custody) plus an
      # SPDX SBOM generated by syft and attached as a referrer to each image. Both
      # legs ride the digest build-push-action just emitted, so a tag can never be
      # re-pointed under a signature. Verify a pulled image with:
      #   cosign verify \
      #     --certificate-identity-regexp 'https://github.com/bex-co/bex/.github' \
      #     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
      #     ghcr.io/bex-co/bex-operator@sha256:<digest>
      # CNB tenant images (in-cluster BuildKit → internal Zot) are deferred: no OIDC
      # identity is available in the build Job, and admission-time verification is out
      # of scope for this task — see docs/security-review.md §supply-chain.
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - name: sign images + attest SBOM
        env:
          # One content-addressed ref per line. The loop signs each image keyless
          # and records an SPDX SBOM as an in-toto attestation (cosign attest —
          # the attach+sign-attachment flow is deprecated upstream); a third
          # platform image would be one line here, not a copied step.
          REFS: |-
            ${{ env.IMAGE }}@${{ steps.build_operator.outputs.digest }}
            ${{ env.DASHBOARD_IMAGE }}@${{ steps.build_dashboard.outputs.digest }}
        run: |
          for ref in $REFS; do
            cosign sign --yes "$ref"
            syft "$ref" -o spdx-json > /tmp/sbom.spdx.json
            cosign attest --yes --type spdxjson --predicate /tmp/sbom.spdx.json "$ref"
          done

      # --- 1d. CVE scan: CRITICAL fails CI, HIGH warns (w7/m10 t001) ---
      # Trivy scans both built+pushed images for known CVEs. Two passes per image:
      # a non-blocking HIGH+CRITICAL report (always exits 0, shows the full picture)
      # and a blocking CRITICAL-only gate (exit-code 1 if any CRITICAL is found).
      # `ignore-unfixed: true` suppresses findings where no fix is yet available
      # (noise without an actionable path — revisit when vendor ships a patch).
      - uses: aquasecurity/trivy-action@v0.36.0
        name: CVE scan — operator image HIGH+CRITICAL (report)
        with:
          image-ref: '${{ env.IMAGE }}@${{ steps.build_operator.outputs.digest }}'
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - uses: aquasecurity/trivy-action@v0.36.0
        name: CVE scan — operator image CRITICAL (gate)
        with:
          image-ref: '${{ env.IMAGE }}@${{ steps.build_operator.outputs.digest }}'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

      - uses: aquasecurity/trivy-action@v0.36.0
        name: CVE scan — dashboard image HIGH+CRITICAL (report)
        with:
          image-ref: '${{ env.DASHBOARD_IMAGE }}@${{ steps.build_dashboard.outputs.digest }}'
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - uses: aquasecurity/trivy-action@v0.36.0
        name: CVE scan — dashboard image CRITICAL (gate)
        with:
          image-ref: '${{ env.DASHBOARD_IMAGE }}@${{ steps.build_dashboard.outputs.digest }}'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

      # --- 1e. GitOps write-back: pin BOTH images to their immutable digests (w1/m7 t002) ---
      # Argo syncs git, not image tags, so a mutable :latest override never rolls pods on
      # its own AND leaves the running Deployment pinned to a tag whose contents can change
      # under it. Rewrite the kustomize image overrides in deploy/gitops to the exact
      # @sha256 digests docker just pushed, and commit them back to main. Argo then deploys
      # a content-addressed, immutable reference — no more :latest in the running spec.
      # `[skip ci]` keeps this commit from re-triggering deploy.yml (it touches deploy/gitops/**).
      - name: pin image digests in GitOps (write-back)
        env:
          OP_DIGEST: ${{ steps.build_operator.outputs.digest }}
          DASH_DIGEST: ${{ steps.build_dashboard.outputs.digest }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Retry loop: concurrent runs on main can race on the push. On rejection
          # we rebase onto the latest tip and re-apply the patches (sed is idempotent)
          # before retrying. Three attempts cover any realistic burst of concurrent pushes.
          for i in 1 2 3; do
            git pull --rebase origin main
            sed -Ei "s#(controller=${IMAGE})(:[^@[:space:]]+|@sha256:[a-f0-9]+)#\1@${OP_DIGEST}#" \
              deploy/gitops/base/bex.yaml
            sed -Ei "s#(dashboard=${DASHBOARD_IMAGE})(:[^@[:space:]]+|@sha256:[a-f0-9]+)#\1@${DASH_DIGEST}#" \
              deploy/gitops/base/dashboard.yaml
            if git diff --quiet -- deploy/gitops/base/bex.yaml deploy/gitops/base/dashboard.yaml; then
              echo "digests already pinned — nothing to write back"
              break
            fi
            git add deploy/gitops/base/bex.yaml deploy/gitops/base/dashboard.yaml
            git commit -m "chore(deploy): pin operator+dashboard to ${GITHUB_SHA::12} [skip ci]"
            git push origin HEAD:main && break
            echo "write-back push rejected (attempt $i/3) — retrying after rebase"
            git reset --soft HEAD~1
          done

      # --- 2. fetch the app cluster kubeconfig via a CP node (self-managed, w1/m19.1) ---
      - name: get app cluster kubeconfig
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          install -m700 -d ~/.ssh
          printf '%s\n' "${{ secrets.BEX_SSH_PRIVATE_KEY }}" > ~/.ssh/id_bex
          chmod 600 ~/.ssh/id_bex
          bash scripts/fetch-app-kubeconfig.sh "$PWD/app.kubeconfig"
          echo "KUBECONFIG=$PWD/app.kubeconfig" >> "$GITHUB_ENV"

      # --- 3. install Argo CD on the app cluster (idempotent) ---
      # --server-side: the argo install bundles CRDs (applicationsets) whose schema
      # exceeds kubectl's 256KB last-applied-config annotation limit; SSA avoids it.
      - name: install Argo CD
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply --server-side --force-conflicts -n argocd \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          # w1/m19 t003: Argo CD itself rides the platform pool (upstream install
          # carries no scheduling; patching here keeps us on the stock manifest).
          # Idempotent: re-patching the same values causes no rollout.
          SCHED='{"spec":{"template":{"spec":{"nodeSelector":{"bex.co/pool":"platform"},"tolerations":[{"key":"bex.co/platform","operator":"Equal","value":"true","effect":"NoSchedule"}]}}}}'
          for d in argocd-server argocd-repo-server argocd-applicationset-controller \
                   argocd-notifications-controller argocd-dex-server argocd-redis; do
            kubectl -n argocd patch deployment "$d" --type strategic -p "$SCHED"
          done
          kubectl -n argocd patch statefulset argocd-application-controller --type strategic -p "$SCHED"
          kubectl -n argocd rollout status deploy/argocd-repo-server --timeout=300s
          kubectl -n argocd rollout status deploy/argocd-server --timeout=300s

      # --- 3b. give Argo a read-only SSH deploy key for the private repo ---
      # The app-of-apps and the bex-operator child app source from this private
      # repo over SSH; without this credential Argo can't clone it. github.com host
      # keys ship in argocd-ssh-known-hosts-cm (part of the install), so no extra
      # known_hosts config is needed.
      - name: configure Argo repo credentials
        run: |
          printf '%s\n' "${{ secrets.ARGOCD_REPO_SSH_KEY }}" > /tmp/argo_deploy_key
          kubectl -n argocd create secret generic bex-repo \
            --from-literal=type=git \
            --from-literal=url=git@github.com:bex-co/bex.git \
            --from-file=sshPrivateKey=/tmp/argo_deploy_key \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n argocd label secret bex-repo argocd.argoproj.io/secret-type=repository --overwrite
          rm -f /tmp/argo_deploy_key

      # --- 4. point Argo at the repo; it reconciles the whole platform ---
      - name: apply prod app-of-apps
        run: kubectl apply -f deploy/gitops/bootstrap/prod.yaml

      # --- 4b. auth substrate secrets (docs/ADR012-auth.md) — out-of-band of GitOps ---
      # Argo creates the CNPG Clusters (auth-dbs, sync-wave 2); once CNPG has
      # generated their DB credentials, auth-secrets.sh composes the DSNs and
      # writes the auth/kratos + auth/hydra Secrets that the kratos/hydra
      # Applications (wave 3) consume. Idempotent — safe on every deploy.
      - name: apply auth secrets
        env:
          KRATOS_SECRETS_DEFAULT: ${{ secrets.KRATOS_SECRETS_DEFAULT }}
          KRATOS_SECRETS_COOKIE: ${{ secrets.KRATOS_SECRETS_COOKIE }}
          KRATOS_SECRETS_CIPHER: ${{ secrets.KRATOS_SECRETS_CIPHER }}
          HYDRA_SECRETS_SYSTEM: ${{ secrets.HYDRA_SECRETS_SYSTEM }}
          HYDRA_SECRETS_COOKIE: ${{ secrets.HYDRA_SECRETS_COOKIE }}
          HYDRA_OIDC_PAIRWISE_SALT: ${{ secrets.HYDRA_OIDC_PAIRWISE_SALT }}
          OPENFGA_PRESHARED_KEY: ${{ secrets.OPENFGA_PRESHARED_KEY }}
          # Optional social login (docs/ADR012-auth.md § Social login) — unset secrets
          # resolve empty, so auth-secrets.sh writes the oidc.yaml fragment disabled.
          BEX_GITHUB_OIDC_CLIENT_ID: ${{ secrets.BEX_GITHUB_OIDC_CLIENT_ID }}
          BEX_GITHUB_OIDC_CLIENT_SECRET: ${{ secrets.BEX_GITHUB_OIDC_CLIENT_SECRET }}
          # Shared SMTP relay (docs/ADR012-auth.md §11): the courier URI (required — the
          # courier is enabled) into the kratos Secret, and the bex-api invite
          # mailer's credentials into bex-system/bex-smtp.
          KRATOS_COURIER_SMTP_URI: ${{ secrets.KRATOS_COURIER_SMTP_URI }}
          BEX_SMTP_USERNAME: ${{ secrets.BEX_SMTP_USERNAME }}
          BEX_SMTP_PASSWORD: ${{ secrets.BEX_SMTP_PASSWORD }}
        run: |
          for s in kratos-db-app hydra-db-app openfga-db-app; do
            timeout 300 bash -c "until kubectl -n auth get secret $s >/dev/null 2>&1; do sleep 5; done" \
              || { echo "CNPG credentials $s never appeared — Argo status:"; kubectl -n argocd get applications; exit 1; }
          done
          bash scripts/auth-secrets.sh

      # --- 4c. bootstrap API key --------------------------------------------
      # bex-api has no shared static token (docs/ADR006-bex-api.md#auth): seed the
      # `bex-bootstrap` OAuth2 client once Hydra is Ready. Idempotent.
      # continue-on-error: the client was seeded in a prior deploy; if the
      # kubelet TLS cert on a cluster node is expired (exec/port-forward both
      # route through the kubelet), this step fails safely — re-seeding is only
      # needed if the client secret rotates. Fix: renew kubelet certs on the node.
      - name: seed bootstrap client
        continue-on-error: true
        timeout-minutes: 5
        env:
          BEX_BOOTSTRAP_CLIENT_SECRET: ${{ secrets.BEX_BOOTSTRAP_CLIENT_SECRET }}
        run: |
          timeout 600 bash -c "until kubectl -n auth get deploy/hydra >/dev/null 2>&1; do sleep 10; done" \
            || { echo "hydra Deployment never appeared — Argo status:"; kubectl -n argocd get applications; exit 1; }
          kubectl -n auth rollout status deploy/hydra --timeout=600s \
            || { echo "hydra not ready — Argo status:"; kubectl -n argocd get applications; exit 1; }
          for i in 1 2 3; do
            bash scripts/auth-bootstrap-client.sh && break
            [ "$i" -lt 3 ] && { echo "attempt $i failed, retrying in 15s..."; sleep 15; }
          done

      # --- 4d. authorization model + seed tuples (docs/ADR012-auth.md) ---------------
      # Idempotent: store `bex` ensured, deploy/gitops/authz/model.json written
      # only when changed, bootstrap tuples tolerated as already-present.
      # continue-on-error: same kubelet-TLS caveat as 4c above; model changes
      # are rare and the last applied model stays in OpenFGA until next success.
      - name: apply authorization model
        continue-on-error: true
        timeout-minutes: 12
        env:
          OPENFGA_PRESHARED_KEY: ${{ secrets.OPENFGA_PRESHARED_KEY }}
        run: |
          # A sync can wedge mid-operation (e.g. a hook that can never fire —
          # the original openfga revision's PostSync deadlock) and the wedged
          # state survives operation patches. Deterministic recovery: recreate
          # the Application. It carries no resources finalizer, so deletion is
          # non-cascading, and the app-of-apps (selfHeal) recreates it fresh;
          # a fresh app auto-syncs with hooks.
          if [ "$(kubectl -n argocd get application openfga -o jsonpath='{.status.health.status}' 2>/dev/null)" = "Degraded" ]; then
            echo "openfga app Degraded — recreating the Application to clear wedged sync state"
            kubectl -n argocd delete application openfga --ignore-not-found --wait=true
            timeout 300 bash -c 'until kubectl -n argocd get application openfga >/dev/null 2>&1; do sleep 10; done' \
              || { echo "app-of-apps did not recreate openfga"; kubectl -n argocd get applications; exit 1; }
            kubectl -n argocd patch application openfga --type=merge \
              -p '{"operation":{"sync":{"prune":true}}}' 2>/dev/null || true
          fi
          # Poll actual availability: `rollout status` returns instantly on a
          # deployment whose progress deadline already lapsed, even as the fix
          # is still converging.
          timeout 600 bash -c 'until [ "$(kubectl -n auth get deploy openfga -o jsonpath="{.status.availableReplicas}" 2>/dev/null)" = "1" ]; do sleep 10; done' || {
            echo "openfga not ready — diagnosis:"
            kubectl -n auth get pods -o wide
            kubectl -n auth describe deploy openfga | tail -20
            kubectl -n auth describe pods -l app.kubernetes.io/name=openfga | grep -A12 "Events:" || true
            kubectl -n auth logs deploy/openfga --all-containers --tail=30 || true
            kubectl -n auth get jobs || true
            kubectl -n argocd get application openfga -o yaml | grep -B2 -A25 "operationState:" || true
            kubectl -n argocd get applications
            exit 1
          }
          bash scripts/authz-model.sh

      # --- 4e. OpenBao init/unseal + Kubernetes auth (docs/ADR013-secrets.md) --------
      # OpenBao ships sealed by design (no auto-unseal, docs/ADR013-secrets.md §3):
      # without this step the env-vars verbs 503 in prod even though bex-api
      # already points at the store (BEX_OPENBAO_URL in the api Deployment).
      # Idempotent — safe on every deploy: a re-run detects "already
      # initialized" and just unseals each pod. The unseal keys + root token
      # come from GitHub Actions secrets (seeded by the one-time manual
      # bao-init.sh run against prod, pushed via scripts/gh-secrets.sh). In HA
      # (prod replicas: 3) bao-init reaches each pod directly — the readiness
      # probe (`bao status`) fails while sealed, so wait for Running, not Ready
      # (same approach as scripts/bao-verify.sh's wait_pod_running).
      # continue-on-error: same kubelet-TLS caveat as 4c; OpenBao stays unsealed
      # across bex operator/api restarts (only seals on its own pod restart).
      # If the pod restarted and this step fails, unseal manually via bao-init.sh.
      - name: unseal OpenBao + configure Kubernetes auth
        continue-on-error: true
        timeout-minutes: 5
        env:
          BAO_UNSEAL_KEY_1: ${{ secrets.BAO_UNSEAL_KEY_1 }}
          BAO_UNSEAL_KEY_2: ${{ secrets.BAO_UNSEAL_KEY_2 }}
          BAO_UNSEAL_KEY_3: ${{ secrets.BAO_UNSEAL_KEY_3 }}
          BAO_ROOT_TOKEN: ${{ secrets.BAO_ROOT_TOKEN }}
        run: |
          timeout 600 bash -c 'until kubectl -n secrets get sts openbao >/dev/null 2>&1; do sleep 5; done' \
            || { echo "openbao StatefulSet never appeared — Argo status:"; kubectl -n argocd get applications; exit 1; }
          timeout 600 bash -c 'until kubectl -n secrets get pods -l app.kubernetes.io/name=openbao --no-headers 2>/dev/null | grep -q .; do sleep 5; done' \
            || { echo "openbao pods never appeared — Argo status:"; kubectl -n argocd get applications; exit 1; }
          kubectl -n secrets wait --for=jsonpath='{.status.phase}'=Running pod -l app.kubernetes.io/name=openbao --timeout=600s \
            || { echo "openbao pods never reached Running:"; kubectl -n secrets get pods; exit 1; }
          bash scripts/bao-init.sh
          bash scripts/bao-k8s-auth.sh

      - name: wait for the bex operator
        if: always()
        run: |
          kubectl -n bex-system rollout status deploy/bex-controller-manager --timeout=600s \
            || { echo "operator not ready — Argo status:"; kubectl -n argocd get applications; exit 1; }
          echo "bex operator running. Deploy an App: kubectl apply -f examples/whoami-app.yaml"

      # --- 5. roll bex onto the freshly-pushed image ---
      # The Argo image override pins the mutable :latest tag (deploy/gitops/base/
      # bex.yaml), so pushing a new :latest does NOT change the Deployment spec —
      # Kubernetes sees no diff and never rolls the pods, which keep the image they
      # pulled on a prior deploy. Force a fresh pull (both Deployments declare
      # imagePullPolicy: Always) so every push actually takes effect. Idempotent:
      # on a no-op deploy this just recreates identical pods.
      # if: always() — rollout restart is the primary deploy fast-path; it must
      # run even when earlier idempotent steps fail (e.g. kubelet TLS cert expiry
      # blocking exec/port-forward). Argo also deploys via the digest pin (slower).
      - name: roll bex onto the freshly-pushed image
        if: always()
        run: |
          kubectl -n bex-system rollout status deploy/bex-api --timeout=300s
          kubectl -n bex-system rollout restart deploy/bex-controller-manager deploy/bex-api
          kubectl -n bex-system rollout status deploy/bex-controller-manager --timeout=300s
          kubectl -n bex-system rollout status deploy/bex-api --timeout=300s

      # --- 6. roll the dashboard onto the freshly-pushed image ---
      # Same mutable-:latest caveat as step 5 (deploy/gitops/base/dashboard.yaml).
      - name: roll dashboard onto the freshly-pushed image
        if: always()
        run: |
          kubectl -n dashboard rollout status deploy/dashboard --timeout=300s \
            || { echo "dashboard not ready — Argo status:"; kubectl -n argocd get applications; exit 1; }
          kubectl -n dashboard rollout restart deploy/dashboard
          kubectl -n dashboard rollout status deploy/dashboard --timeout=300s
