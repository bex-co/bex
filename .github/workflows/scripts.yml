name: scripts (test)

# Pure-bash unit tests and source-absence guards for production-sensitive paths.
# They use shell fakes or static inspection, so no live credentials are required.
on:
  pull_request:
    paths:
      - "lego/**"
      - "dashboard/Dockerfile"
      - "dashboard/deploy/**"
      - "deploy/gitops/**"
      - "deploy/hcloud-csi/**"
      - "infra/**"
      - "scripts/**"
      # render-schema-drift.test.sh reads its fixture here; the ADR registry
      # check that read all of docs/ moved to docs.yml.
      - "docs/render-artifacts/**"
      - "AGENTS.md"
      - ".agents/skills/**"
      - ".claude/commands/**"
      - ".claude/skills/**"
      - ".env.example"
      - ".gitleaks.toml"
      - ".github/workflows/**"
      - "skills-lock.json"
  push:
    branches: [main]
    paths:
      - "lego/**"
      - "dashboard/Dockerfile"
      - "dashboard/deploy/**"
      - "deploy/gitops/**"
      - "deploy/hcloud-csi/**"
      - "infra/**"
      - "scripts/**"
      # render-schema-drift.test.sh reads its fixture here; the ADR registry
      # check that read all of docs/ moved to docs.yml.
      - "docs/render-artifacts/**"
      - "AGENTS.md"
      - ".agents/skills/**"
      - ".claude/commands/**"
      - ".claude/skills/**"
      - ".env.example"
      - ".gitleaks.toml"
      - ".github/workflows/**"
      - "skills-lock.json"

permissions:
  contents: read

concurrency:
  group: scripts-${{ github.ref }}
  # Only PRs cancel a running check: on main, steady pushes cancelled every
  # run before it finished, so main's state was never reported.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Public-repo safety (github-actions-validate.sh rule 7): fork PR heads never run this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
            /.pm/w*/dev-*/
      - name: Skill layout consistency
        run: bash scripts/skill-layout-validate.sh
      # The /loopx guard is the Stop hook of every Claude Code session in this
      # checkout and the scheduler behind a drained workstream; proven against
      # temporary repositories with a real bare remote and a fake gh.
      - name: loopx guard self-test
        run: python3 -B -m unittest scripts/test_loopx_guard.py -v
      - name: Retired platform paths remain absent
        run: bash scripts/platform-deprecations-validate.sh
      - name: GitHub Actions SHA-pin + inventory guard
        run: bash scripts/github-actions-validate.sh
      - name: GitHub Actions guard self-test
        run: bash scripts/github-actions-validate.test.sh
      - name: Platform Syft install transport and integrity controls
        run: python3 -B -m unittest scripts/test_install_syft.py -v
      - name: Platform Trivy install reviewed-release controls
        run: python3 -B -m unittest scripts/test_install_trivy.py -v
      # w6/m156: deploy latency classification and the oldest-commit walk.
      - name: Deploy latency watchdog self-test
        run: python3 -B -m unittest scripts/test_deploy_latency.py -v
      # Each test suite's trigger paths cover the files its tests read.
      - name: Test suite trigger paths self-test
        run: python3 -B -m unittest scripts/test_ci_test_inputs.py -v
      # w8/331: ship-gates refuses a manifest flag the pinned image does not define.
      - name: Manifest flag guard self-test
        run: python3 -B -m unittest scripts/test_manifest_flag_guard.py -v
      # w4/701: ship-gates and the backend suite refuse a migration numbered below
      # its base's highest, which a database already past it would skip.
      - name: Migration order guard self-test
        run: python3 -B -m unittest scripts/test_migration_order_guard.py -v
      # w6/m153: the admin.conf fetch retries only mid-roll host-key failures.
      # w21/097: it loads HCLOUD_TOKEN from the repository-root .env only when
      # the caller has not exported one.
      # w3/m472: the stable control-plane key pins the fetch, trust-on-first-use
      # never retries, and HCLOUD_TOKEN stays off curl's argv.
      - name: Kubeconfig fetch self-test (mid-roll retry, .env fallback, pin tiers, token off argv)
        run: bash scripts/fetch-app-kubeconfig.test.sh
      # w21: a worker Machine Hetzner refused a server for (a stock-out) is retried
      # by the fleet-rollout wait instead of wedging the app-cluster workflow.
      - name: CAPI fleet wait server-create retry self-test
        run: bash scripts/wait-capi-rollout.test.sh
      # w9/119: the sandbox isolation wrapper's cleanup survives an expired
      # bootstrap token and a refused workspace delete, and its sweep removes an
      # earlier run's m35 fixtures and nothing else.
      - name: Sandbox isolation fixture cleanup self-test
        run: bash scripts/verify-sandbox-isolation-live.test.sh
      # w21/089: the QA login helper (curl replaced by a scripted mock) decodes the
      # percent-encoded login challenge Hydra's redirect carries before it encodes it.
      - name: QA login helper self-test
        run: python3 -B -m unittest scripts/test_qa_login.py -v
      # The /qa-find-bugs-mcp helper, against a loopback stand-in for bex-api:
      # the bearer and the session cookie are never printed, a key file others
      # can read is refused, and a failed revoke keeps the only handle on a key.
      - name: QA MCP helper self-test
        run: python3 -B -m unittest scripts/test_qa_mcp.py -v
      - name: CSI reviewed pin and scoped rollout guards
        run: |
          bash scripts/install-hcloud-csi.test.sh
          python3 -m unittest scripts/test_hcloud_csi.py -v
          bash scripts/service-disk-inventory.test.sh
          python3 -m unittest scripts/test_service_disk_inventory.py -v
          python3 -m unittest scripts/test_disk_fixture.py -v
          if [ -e deploy/hcloud-csi/reviewed.values.json ] || [ -L deploy/hcloud-csi/reviewed.values.json ]; then
            bash scripts/install-hcloud-csi.sh validate-pin
          fi
      # w3/m173: the live-settings reader behind production-secret confinement.
      - name: GitHub environment drift self-test
        run: bash scripts/github-environments-drift.test.sh
      # w3/m365: secret scanning, push protection and main's history rules.
      - name: GitHub repository security drift self-test
        run: bash scripts/github-repo-security-drift.test.sh
      # w2/m476 (ADR116): the Managed OIDC production check passes a healthy
      # issuer and fails a cross-workspace accept, Render drift or a 200 for a
      # malformed workspace id.
      - name: OIDC issuer verify self-test
        run: bash scripts/oidc-issuer-verify.test.sh
      # w2/m477 (ADR116 D9): the in-cluster AWS token proof passes a healthy
      # service and fails a writable token file, a claim off Render's
      # template, an STS for another audience accepting it, or no refresh.
      - name: OIDC AWS verify self-test
        run: bash scripts/oidc-aws-verify.test.sh
      # w2/m478 (ADR116 D10): the cross-audience check passes a service with
      # two or three providers and fails an STS taking another audience's
      # token, a token with another provider's audience, a file variable
      # without its trigger, and a provider table that drifted from the
      # operator's.
      - name: OIDC audience verify self-test
        run: bash scripts/oidc-audience-verify.test.sh
      # w6/110 (#134): an activator-held wake is a wake, and stage 4 polls.
      - name: Tenant-view canary stage 4 self-test
        run: bash scripts/tenant-view-liveness.test.sh
      # w6/112 (#111): a release tag left off main by a rewrite counts from its copy.
      - name: CLI release staleness self-test
        run: bash scripts/cli-release-staleness.test.sh
      # w3/m173 t006 (ADR079 F1): .env loaders refuse a group/world-readable file.
      - name: .env permission guard self-test
        run: bash scripts/env-file.test.sh
      - name: gh-secrets environment-scope self-test
        run: bash scripts/gh-secrets.test.sh
      # w3/m174: the out-of-cluster alert-pipeline heartbeat.
      - name: Alerting heartbeat self-test
        run: bash scripts/alerting-heartbeat.test.sh
      # The daily CI-red-streak job is the thing that would have caught
      # `gitops (render)` shipping broken and staying red for five days. Its
      # arithmetic has one edge case that decides whether it reports anything at
      # all — a workflow with NO success in the window — so the detector is
      # proven here on every push, not only when the daily job happens to run.
      - name: CI red-streak detector self-test
        run: bash scripts/ci-red-streak.test.sh
      - name: Edge probe retry and failure classes (w1/131)
        run: bash scripts/edge-probe.test.sh
      # w5/m112: /ship's pre-push gate reports a red main (never blocks on it,
      # 2026-10-21) and picks the newest real verdict; proven with a stubbed
      # gh, no network.
      - name: ship gates self-test
        run: bash scripts/ship-gates.test.sh
      # The real pinned binary and .gitleaks.toml: a credential-shaped value is
      # reported, the allowlisted shapes are not.
      - name: secret scanner self-test
        run: bash scripts/gitleaks.test.sh
      - name: gh retry helper self-test
        run: bash scripts/gh-retry.test.sh
      # w22/m312 t006: the Docker-in-gVisor spike script refuses the production
      # sandbox pool; proven with stubbed kubectl/docker, no cluster.
      - name: Sandbox Docker spike guard self-test
        run: bash scripts/sandbox-docker-spike.test.sh
      # w8/248: a deploy restarts the one-replica sandbox lifecycle server only
      # for a changed credential or a Deployment that did not converge.
      - name: OpenSandbox server restart guards self-test
        run: bash scripts/opensandbox-server-secret.test.sh
      # w8/254: a deploy reuses the lifecycle server image built from the same
      # inputs, so an unchanged server is not restarted; stubbed docker/trivy.
      - name: OpenSandbox server image reuse self-test
        run: bash scripts/opensandbox-server-image.test.sh
      - name: Tracking-issue helper self-test
        run: bash scripts/tracking-issue.test.sh
      - name: Repo artifact guard self-test
        run: bash scripts/repo-artifact-guard.test.sh
      # w3/m472: no production credential in a curl command line, where ps
      # shows it to every local user; HCLOUD_TOKEN goes to curl on stdin.
      - name: Production credential argv guard + self-test
        run: |
          bash scripts/secret-argv-validate.sh
          bash scripts/secret-argv-validate.test.sh
      # w3/042. Its sibling for a probe that is green but late. Two things are
      # proven on every push rather than only when the daily job runs: every
      # scheduled workflow declares a drift window (a new probe without one
      # would otherwise go silently unwatched), and the never-fired and
      # all-cancelled cases, where a naive gap computation reports nothing.
      - name: CI schedule-drift windows + detector self-test
        run: |
          bash scripts/ci-schedule-drift.sh validate
          bash scripts/ci-schedule-drift.test.sh
      # w7/m85. Six security rounds re-reported the same unpinned-image finding
      # because an inventory sweep is only true on the day it is done; this
      # re-derives the inventory every run and fails closed on anything it
      # cannot classify.
      - name: Image digest-pin guard
        run: bash scripts/image-pin-validate.sh
      - name: Image digest-pin guard self-test
        run: bash scripts/image-pin-validate.test.sh
      - name: Build-toolchain freshness inventory + self-test
        run: |
          bash scripts/build-toolchain-freshness.sh validate
          bash scripts/build-toolchain-freshness.test.sh
      # The build-pool guards read across three trees (the CAPI overlay, the
      # gitops DaemonSets, and build.go's request constant), so they run here
      # where the triggers already cover all three — clusterapi-validate.yml's
      # own paths are overlay/packer-scoped.
      - name: Build-pool scheduling guard self-test
        run: bash scripts/clusterapi-validate.test.sh
      # Reads infra/terraform/main.tf and the prod Traefik values, so it runs
      # here where both trees trigger — infra.yml's PR job is fmt/validate only
      # and gitops.yml does not trigger on infra/ (w1/m150).
      - name: Edge PROXY-protocol guard self-test
        run: bash scripts/edge-proxyprotocol-validate.test.sh
      - name: bao-init unit tests
        run: bash scripts/bao-init.test.sh
      - name: bex CLI installer + formula renderer offline tests
        run: bash scripts/install-bex.test.sh
      - name: Official Key Value CLI verifier safety tests
        run: bash scripts/keyvalue-cli-verify.test.sh
      - name: Render Terraform provider harness offline tests
        run: bash scripts/terraform-provider-verify.test.sh
      - name: Key Value deletion audit residue tests
        run: bash scripts/delete-audit.test.sh
      - name: Rename-verify snapshot error-handling unit tests
        run: bash scripts/rename-verify.test.sh
      - name: Deploy supersession detection unit tests
        run: bash scripts/deploy-superseded.test.sh
      - name: Operator image pin write-back and SNI proxy wait unit tests
        run: bash scripts/operator-pins.test.sh
      - name: Packer plugin pin/verify unit tests
        run: bash scripts/packer-plugin-install.test.sh
      - name: HashiCorp rootless installer unit tests
        run: bash scripts/hashicorp-install.test.sh
      - name: SSH host-key policy unit tests
        run: bash scripts/ssh-hostkey.test.sh
      - name: SSH gateway grant reconciliation unit tests
        run: bash scripts/ssh-gateway-db-role.test.sh
      - name: Render MCP tool-pin drift detection unit tests
        run: bash scripts/render-mcp-drift.test.sh
      - name: Render Blueprint/webhook schema drift reporting unit tests
        run: bash scripts/render-schema-drift.test.sh
      - name: Render examples corpus fetch unit tests
        run: bash scripts/render-examples-corpus.test.sh
      - name: Verified CI download fallback unit tests
        run: bash scripts/ci-fetch-verified.test.sh
      - name: dev-N harness derivation + isolation unit tests
        run: bash scripts/dev-env.test.sh
      - name: Install ShellCheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHELLCHECK_VERSION=0.11.0
          SHELLCHECK_LINUX_ARM64_SHA256=12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          bash scripts/ci-fetch-verified.sh \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.aarch64.tar.xz" \
            "$SHELLCHECK_LINUX_ARM64_SHA256" "$archive"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" --version
      - name: Production script shellcheck
        run: >-
          shellcheck --severity=warning scripts/lib/restore.sh scripts/restore-etcd.sh
          scripts/restore-openbao.sh scripts/restore-postgres.sh
          scripts/restore-keyvalue.sh scripts/restore.test.sh
          scripts/ssh-gateway-db-role.sh scripts/ssh-gateway-db-role.test.sh
          scripts/agent-session-verify.sh
          scripts/adr-registry-validate.sh scripts/adr-registry-validate.test.sh
          scripts/render-mcp-drift.sh scripts/render-mcp-drift.test.sh
          scripts/render-schema-drift.sh scripts/render-schema-drift.test.sh
          scripts/render-examples-corpus.sh scripts/render-examples-corpus.test.sh
          scripts/dev-env.sh scripts/dev-env.test.sh
          scripts/sandbox-docker-spike.sh scripts/sandbox-docker-spike.test.sh
          scripts/fetch-app-kubeconfig.test.sh
          scripts/lib/ssh-hostkey.sh scripts/lib/curl-auth.sh scripts/ssh-hostkey.test.sh
          scripts/secret-argv-validate.sh scripts/secret-argv-validate.test.sh
          scripts/wait-capi-rollout.sh scripts/wait-capi-rollout.test.sh
          scripts/verify-sandbox-isolation-live.sh scripts/verify-sandbox-isolation-live.test.sh
          scripts/stale-key-name-validate.sh scripts/stale-key-name-validate.test.sh
          scripts/mock-cluster.sh scripts/mock-cluster.test.sh scripts/lib/helm-isolated.sh
          scripts/build-toolchain-freshness.sh scripts/build-toolchain-freshness.test.sh
          scripts/ci-schedule-drift.sh scripts/ci-schedule-drift.test.sh
          scripts/image-pin-validate.sh scripts/image-pin-validate.test.sh
          scripts/hashicorp-install.sh scripts/hashicorp-install.test.sh
          scripts/gitleaks.sh scripts/gitleaks.test.sh scripts/secret-scan-alert.sh
          scripts/lib/image-digest-exists.sh
          scripts/disk-snapshot-secret.sh scripts/disk-snapshot-secret.test.sh
          scripts/object-storage-s3-credentials.sh scripts/object-storage-s3-credentials.test.sh
          scripts/build-cache-s3-credentials.sh scripts/build-cache-s3-credentials.test.sh
          scripts/wrangler-r2-contract.sh
          scripts/request-logs-liveness.sh
          scripts/lib/canary-api.sh scripts/tenant-view-liveness.sh scripts/tenant-view-liveness.test.sh
          scripts/cli-release-staleness.sh scripts/cli-release-staleness.test.sh
          scripts/deploy-canary.sh
          scripts/funnel-counters.sh
      - name: Local cluster lock and kubeconfig publication contracts
        run: bash scripts/mock-cluster.test.sh
      - name: Restore script hermetic safety tests
        run: bash scripts/restore.test.sh
      # ADR082 D5: the disk-snapshot provisioner's refusals — a shared bucket, a
      # bucket the committed IAM policies do not cover, an unpinned aws-cli
      # image, and any policy edit that would let bex-api write or delete a
      # tenant's backups.
      - name: Disk snapshot provisioner guards
        run: bash scripts/disk-snapshot-secret.test.sh
      # ADR112 D9: the object storage provisioner's refusals and the committed
      # policies: objectgw's identity can read but never write or delete, and
      # neither identity names a bucket but the two object buckets on the shared
      # Wasabi account.
      - name: Object storage provisioner guards
        run: bash scripts/object-storage-s3-credentials.test.sh
      # w9/m492: the build-cache provisioner's refusals and the committed policy
      # and expiry: the bucket-wide credential that sits beside tenant builds
      # names only bex-build-cache and cannot lift its own 30-day expiry.
      - name: Build cache provisioner guards
        run: bash scripts/build-cache-s3-credentials.test.sh
