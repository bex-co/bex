name: scripts (test)

# Pure-bash unit tests for production-sensitive scripts. The test harnesses use
# shell fakes, so no live cluster or credentials are required.
on:
  pull_request:
    paths:
      - "scripts/bao-init.sh"
      - "scripts/bao-init.test.sh"
      - "scripts/bao-endpoints.sh"
      - "scripts/bao-k8s-auth.sh"
      - "scripts/gh-secrets.sh"
      - "scripts/postgres-name-migrate.sh"
      - "scripts/postgres-name-migrate.test.sh"
      - ".env.example"
      - ".env.template"
      - ".github/workflows/scripts.yml"
  push:
    branches: [main]
    paths:
      - "scripts/bao-init.sh"
      - "scripts/bao-init.test.sh"
      - "scripts/bao-endpoints.sh"
      - "scripts/bao-k8s-auth.sh"
      - "scripts/gh-secrets.sh"
      - "scripts/postgres-name-migrate.sh"
      - "scripts/postgres-name-migrate.test.sh"
      - ".env.example"
      - ".env.template"
      - ".github/workflows/scripts.yml"

permissions:
  contents: read

concurrency:
  group: scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bao-init unit tests
        run: bash scripts/bao-init.test.sh
      - name: Postgres name-migration unit tests
        run: bash scripts/postgres-name-migrate.test.sh
