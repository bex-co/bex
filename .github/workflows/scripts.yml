name: scripts (test)

# Pure-bash unit tests and source-absence guards for production-sensitive paths.
# They use shell fakes or static inspection, so no live credentials are required.
on:
  pull_request:
    paths:
      - "lego/**"
      - "dashboard/Dockerfile"
      - "dashboard/deploy/**"
      - "deploy/gitops/**"
      - "infra/**"
      - "scripts/**"
      - "docs/**"
      - "CLAUDE.md"
      - ".agents/skills/**"
      - ".claude/commands/**"
      - ".claude/skills/**"
      - ".env.example"
      - ".github/workflows/**"
      - "skills-lock.json"
  push:
    branches: [main]
    paths:
      - "lego/**"
      - "dashboard/Dockerfile"
      - "dashboard/deploy/**"
      - "deploy/gitops/**"
      - "infra/**"
      - "scripts/**"
      - "docs/**"
      - "CLAUDE.md"
      - ".agents/skills/**"
      - ".claude/commands/**"
      - ".claude/skills/**"
      - ".env.example"
      - ".github/workflows/**"
      - "skills-lock.json"

permissions:
  contents: read

concurrency:
  group: scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Public-repo safety: fork PR code must never reach persistent self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, bex-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skill layout consistency
        run: bash scripts/skill-layout-validate.sh
      - name: Retired platform paths remain absent
        run: bash scripts/platform-deprecations-validate.sh
      - name: GitHub Actions SHA-pin + inventory guard
        run: bash scripts/github-actions-validate.sh
      - name: GitHub Actions guard self-test
        run: bash scripts/github-actions-validate.test.sh
      # w7/m85. Six security rounds re-reported the same unpinned-image finding
      # because an inventory sweep is only true on the day it is done; this
      # re-derives the inventory every run and fails closed on anything it
      # cannot classify.
      - name: Image digest-pin guard
        run: bash scripts/image-pin-validate.sh
      - name: Image digest-pin guard self-test
        run: bash scripts/image-pin-validate.test.sh
      - name: Build-toolchain freshness inventory + self-test
        run: |
          bash scripts/build-toolchain-freshness.sh validate
          bash scripts/build-toolchain-freshness.test.sh
      - name: ADR registry integrity (no duplicate numbers, all indexed, no dangling refs)
        run: bash scripts/adr-registry-validate.sh
      - name: ADR registry guard self-test
        run: bash scripts/adr-registry-validate.test.sh
      # The build-pool guards read across three trees (the CAPI overlay, the
      # gitops DaemonSets, and build.go's request constant), so they run here
      # where the triggers already cover all three — clusterapi-validate.yml's
      # own paths are overlay/packer-scoped.
      - name: Build-pool scheduling guard self-test
        run: bash scripts/clusterapi-validate.test.sh
      - name: bao-init unit tests
        run: bash scripts/bao-init.test.sh
      - name: bex CLI installer + formula renderer offline tests
        run: bash scripts/install-bex.test.sh
      - name: Official Key Value CLI verifier safety tests
        run: bash scripts/keyvalue-cli-verify.test.sh
      - name: Rename-verify snapshot error-handling unit tests
        run: bash scripts/rename-verify.test.sh
      - name: Deploy supersession detection unit tests
        run: bash scripts/deploy-superseded.test.sh
      - name: Packer plugin pin/verify unit tests
        run: bash scripts/packer-plugin-install.test.sh
      - name: Terraform rootless installer unit tests
        run: bash scripts/terraform-install.test.sh
      - name: SSH host-key policy unit tests
        run: bash scripts/ssh-hostkey.test.sh
      - name: SSH gateway grant reconciliation unit tests
        run: bash scripts/ssh-gateway-db-role.test.sh
      - name: Render MCP tool-pin drift detection unit tests
        run: bash scripts/render-mcp-drift.test.sh
      - name: dev-N harness derivation + isolation unit tests
        run: bash scripts/dev-env.test.sh
      - name: Install ShellCheck
        run: |
          SHELLCHECK_VERSION=0.10.0
          SHELLCHECK_LINUX_ARM64_SHA256=324a7e89de8fa2aed0d0c28f3dab59cf84c6d74264022c00c22af665ed1a09bb
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSLo "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.aarch64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_LINUX_ARM64_SHA256" "$archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" --version
      - name: Production script shellcheck
        run: >-
          shellcheck --severity=warning scripts/lib/restore.sh scripts/restore-etcd.sh
          scripts/restore-openbao.sh scripts/restore-postgres.sh
          scripts/restore-keyvalue.sh scripts/restore.test.sh
          scripts/ssh-gateway-db-role.sh scripts/ssh-gateway-db-role.test.sh
          scripts/agent-session-verify.sh
          scripts/adr-registry-validate.sh scripts/adr-registry-validate.test.sh
          scripts/render-mcp-drift.sh scripts/render-mcp-drift.test.sh
          scripts/dev-env.sh scripts/dev-env.test.sh
          scripts/build-toolchain-freshness.sh scripts/build-toolchain-freshness.test.sh
          scripts/image-pin-validate.sh scripts/image-pin-validate.test.sh
          scripts/terraform-install.sh scripts/terraform-install.test.sh
          scripts/lib/image-digest-exists.sh
          scripts/disk-snapshot-secret.sh scripts/disk-snapshot-secret.test.sh
          scripts/request-logs-liveness.sh
          scripts/lib/canary-api.sh scripts/tenant-view-liveness.sh
          scripts/deploy-canary.sh
          scripts/funnel-counters.sh
      - name: Restore script hermetic safety tests
        run: bash scripts/restore.test.sh
      # ADR082 D5: the disk-snapshot provisioner's refusals — a shared bucket, a
      # bucket the committed IAM policies do not cover, an unpinned aws-cli
      # image, and any policy edit that would let bex-api write or delete a
      # tenant's backups.
      - name: Disk snapshot provisioner guards
        run: bash scripts/disk-snapshot-secret.test.sh
