name: scripts (test)

# Pure-bash unit tests and source-absence guards for production-sensitive paths.
# They use shell fakes or static inspection, so no live credentials are required.
on:
  pull_request:
    paths:
      - "lego/operator/**"
      - "lego/backend/**"
      - "deploy/gitops/**"
      - "infra/**"
      - "scripts/**"
      - "docs/**"
      - "CLAUDE.md"
      - ".agents/skills/**"
      - ".claude/commands/**"
      - ".claude/skills/**"
      - ".env.example"
      - ".github/workflows/**"
      - "skills-lock.json"
  push:
    branches: [main]
    paths:
      - "lego/operator/**"
      - "lego/backend/**"
      - "deploy/gitops/**"
      - "infra/**"
      - "scripts/**"
      - "docs/**"
      - "CLAUDE.md"
      - ".agents/skills/**"
      - ".claude/commands/**"
      - ".claude/skills/**"
      - ".env.example"
      - ".github/workflows/**"
      - "skills-lock.json"

permissions:
  contents: read

concurrency:
  group: scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skill layout consistency
        run: bash scripts/skill-layout-validate.sh
      - name: Retired platform paths remain absent
        run: bash scripts/platform-deprecations-validate.sh
      - name: GitHub Actions SHA-pin + inventory guard
        run: bash scripts/github-actions-validate.sh
      - name: GitHub Actions guard self-test
        run: bash scripts/github-actions-validate.test.sh
      - name: ADR registry integrity (no duplicate numbers, all indexed, no dangling refs)
        run: bash scripts/adr-registry-validate.sh
      - name: ADR registry guard self-test
        run: bash scripts/adr-registry-validate.test.sh
      # The build-pool guards read across three trees (the CAPI overlay, the
      # gitops DaemonSets, and build.go's request constant), so they run here
      # where the triggers already cover all three — clusterapi-validate.yml's
      # own paths are overlay/packer-scoped.
      - name: Build-pool scheduling guard self-test
        run: bash scripts/clusterapi-validate.test.sh
      - name: bao-init unit tests
        run: bash scripts/bao-init.test.sh
      - name: bex CLI installer + formula renderer offline tests
        run: bash scripts/install-bex.test.sh
      - name: Official Key Value CLI verifier safety tests
        run: bash scripts/keyvalue-cli-verify.test.sh
      - name: Rename-verify snapshot error-handling unit tests
        run: bash scripts/rename-verify.test.sh
      - name: Deploy supersession detection unit tests
        run: bash scripts/deploy-superseded.test.sh
      - name: Packer plugin pin/verify unit tests
        run: bash scripts/packer-plugin-install.test.sh
      - name: SSH host-key policy unit tests
        run: bash scripts/ssh-hostkey.test.sh
      - name: SSH gateway grant reconciliation unit tests
        run: bash scripts/ssh-gateway-db-role.test.sh
      - name: Render MCP tool-pin drift detection unit tests
        run: bash scripts/render-mcp-drift.test.sh
      - name: dev-N harness derivation + isolation unit tests
        run: bash scripts/dev-env.test.sh
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Production script shellcheck
        run: >-
          shellcheck scripts/lib/restore.sh scripts/restore-etcd.sh
          scripts/restore-openbao.sh scripts/restore-postgres.sh
          scripts/restore-keyvalue.sh scripts/restore.test.sh
          scripts/ssh-gateway-db-role.sh scripts/ssh-gateway-db-role.test.sh
          scripts/agent-session-verify.sh
          scripts/adr-registry-validate.sh scripts/adr-registry-validate.test.sh
          scripts/render-mcp-drift.sh scripts/render-mcp-drift.test.sh
          scripts/dev-env.sh scripts/dev-env.test.sh
      - name: Restore script hermetic safety tests
        run: bash scripts/restore.test.sh
