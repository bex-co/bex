name: hugo image (build + verify)

# Publishes ghcr.io/bex-co/bex-hugo from deploy/hugo/ (rationale in its
# Dockerfile, w8/m148): the reviewed Hugo every native static build copies,
# so a static build no longer downloads it from GitHub's release CDN.
#
# This workflow publishes; it never pins. Pinning the published digest in
# lego/operator/internal/build/nativehugo.go is a reviewed commit under
# docs/ADR060 D7, like every other build-toolchain pin
# (lego/operator/internal/build/toolchain-freshness.json, id
# `native-hugo-image`). It runs only when the recipe changes.

on:
  push:
    branches: [main]
    paths:
      - "deploy/hugo/**"
      - ".github/workflows/hugo-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hugo-image
  cancel-in-progress: false

env:
  HUGO_IMAGE: ghcr.io/bex-co/bex-hugo
  HUGO_VERSION: "0.111.3"

jobs:
  build:
    permissions:
      contents: read
      packages: write
    # Ref guard: only reviewed main may publish a platform image.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both architectures bex builds on: production is linux/amd64 and local
      # CAPD clusters on Apple silicon are linux/arm64. The image unpacks on the
      # build platform, so neither leg needs emulation.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/hugo
          file: deploy/hugo/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            HUGO_VERSION=${{ env.HUGO_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.HUGO_VERSION }}
          tags: |
            ${{ env.HUGO_IMAGE }}:${{ github.sha }}

  # Regression gate: the pushed digest's /hugo is the extended release on a
  # Debian 12 base, per platform, each on its own native runner. Never pushed.
  # Hugo 0.111.3's Go runtime aborts under QEMU user emulation on an arm64
  # host (`fatal error: lfstack.push`, run 42799059196), so the amd64 leg runs
  # on amd64 hardware — the linux/amd64 image work ubuntu-latest is reserved
  # for (DO_NOT_DO.md #CI-RUNNERS).
  verify-arm64:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy/hugo
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/hugo
          file: deploy/hugo/version-check.Dockerfile
          platforms: linux/arm64
          push: false
          build-args: |
            HUGO_IMAGE=${{ env.HUGO_IMAGE }}@${{ needs.build.outputs.digest }}
            HUGO_VERSION=${{ env.HUGO_VERSION }}

  verify-amd64:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy/hugo
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/hugo
          file: deploy/hugo/version-check.Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            HUGO_IMAGE=${{ env.HUGO_IMAGE }}@${{ needs.build.outputs.digest }}
            HUGO_VERSION=${{ env.HUGO_VERSION }}

  publish:
    needs: [build, verify-arm64, verify-amd64]
    permissions:
      contents: read
      packages: write
      id-token: write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install reviewed Syft with bounded transport retries
        timeout-minutes: 15
        run: python3 scripts/install-syft.py
      - name: sign image + attest SBOM, then move the version tag
        env:
          REF: ${{ env.HUGO_IMAGE }}@${{ needs.build.outputs.digest }}
        run: |
          cosign sign --yes --oidc-provider=github-actions "$REF"
          syft "$REF" -o spdx-json > "$RUNNER_TEMP/sbom.spdx.json"
          cosign attest --yes --oidc-provider=github-actions --type spdxjson --predicate "$RUNNER_TEMP/sbom.spdx.json" "$REF"
          # The version tag moves only after both platforms' gate and the
          # signature, so the freshness resolver never reports an unverified
          # digest.
          docker buildx imagetools create --tag "$HUGO_IMAGE:$HUGO_VERSION" "$REF"
          echo "Published $REF — pin it per docs/ADR060 D7 (inventory id native-hugo-image)." >> "$GITHUB_STEP_SUMMARY"
