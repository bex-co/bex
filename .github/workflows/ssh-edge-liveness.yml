name: Production edge liveness

# w6/m132/t004: a dead SSH handshake at ssh.bex.co went unnoticed for weeks
# because the acceptance script for that surface (scripts/ssh-verify.sh) was
# never wired to run on its own. This scheduled synthetic closes that gap with
# the cheapest possible check — the credential-free KEXINIT probe from the
# milestone README (scripts/ssh-kexinit-probe.sh): connect, complete the version
# exchange, and require an SSH_MSG_KEXINIT, exactly as github.com/gitlab.com do.
# It needs no key, fixture, or eligible service because the failure it catches is
# pre-authentication and hits every connection alike.
#
# This is the shared carrier reconciled with w6/m131/t004 (the identical gap for
# scripts/logs-verify.sh): a periodic, loud, production liveness gate. The heavy
# scripts/ssh-verify.sh matrix (which needs a paid fixture) stays a
# manual/less-frequent run; this is the always-on floor.
#
# w6/m131/t004 took that slot: request-logs-liveness below. Same shape, same
# failure class — an acceptance script (scripts/logs-verify.sh) that was written,
# never scheduled, and so never noticed that type=request had been silently empty
# for every tenant service in production. w2/m85 adds the public fallback-TLS
# synthetic to the same carrier. w2/m90 adds the Web Shell WS-edge probe
# (scripts/shell-ws-probe.sh): ticketless upgrade to wss://ssh.bex.co/shell must
# get the deterministic 401 "missing ticket" refusal — alive-but-refusing — so a
# dead or unactivated WS edge cannot fail silently the way the TCP edge did
# pre-m132.
#
# w3/m83 adds the fifth: tenant-view-liveness. Every probe above is
# credential-free and platform-side. None of them can catch bex-api asking Loki
# or Prometheus the WRONG QUESTION about a service that is demonstrably serving
# (the w6/m110 class: the series existed, the query named them wrong), because
# answering that needs a tenant's credential and a service whose answer is known
# to be non-empty. The tenant-view job supplies both. Five probes, one schedule.

on:
  workflow_dispatch:
    inputs:
      address:
        description: "SSH edge to probe (host:port)"
        required: false
        default: ssh.bex.co:22
      host:
        description: "Unknown first-level onbex.co hostname to probe"
        required: false
        default: notfound.onbex.co
      shell_ws_url:
        description: "Web Shell WS edge to probe"
        required: false
        default: wss://ssh.bex.co/shell
  schedule:
    # Every six hours. "Unnoticed for weeks" is the bar this must beat; a dead
    # edge now surfaces within hours, not on the next human's manual check.
    - cron: "37 */6 * * *"

permissions:
  contents: read
  issues: write

jobs:
  public-edge-liveness:
    runs-on: [self-hosted, Linux, ARM64, bex-production]
    env:
      GH_TOKEN: ${{ github.token }}
      # Same workspace/toolchain split as backend-test.yml: the backend module
      # resolves standalone with the workspace off.
      GOWORK: "off"
      SSH_EDGE: ${{ github.event.inputs.address || 'ssh.bex.co:22' }}
      SHELL_WS_URL: ${{ github.event.inputs.shell_ws_url || 'wss://ssh.bex.co/shell' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lego/backend/go.mod
          # Multi-GB remote caches stall transfers on this fleet.
          cache: false
      # The bex-production pool is not homogeneous: one host lacks the gh CLI,
      # and the issue-bookkeeping steps below fail on `gh: command not found`
      # even when the probe itself is healthy (observed run 33961859926,
      # 2026-09-05). Pinned + checksummed so a compromised release mirror
      # fails closed rather than executing arbitrary code on the runner.
      - name: Ensure gh CLI
        run: |
          command -v gh >/dev/null && exit 0
          v=2.100.0
          curl -fsSL -o "$RUNNER_TEMP/gh.tgz" "https://github.com/cli/cli/releases/download/v${v}/gh_${v}_linux_arm64.tar.gz"
          echo "ea4e7a581a32ccad6cc7923cb1576ac5859ba4b9a16ab22eb8f8a96e78e2e961  $RUNNER_TEMP/gh.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${v}_linux_arm64/bin" >> "$GITHUB_PATH"
      - name: Probe the SSH edge for KEXINIT
        id: probe
        run: |
          if bash scripts/ssh-kexinit-probe.sh "$SSH_EDGE" > probe.txt 2>&1; then
            echo "down=false" >> "$GITHUB_OUTPUT"
          else
            echo "down=true" >> "$GITHUB_OUTPUT"
          fi
          cat probe.txt
      - name: Open or update the tracking issue
        if: steps.probe.outputs.down == 'true'
        run: |
          gh label create ssh-edge-down --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "ssh.bex.co is not completing the SSH handshake (w6/m132)" --force
          body="$SSH_EDGE wrote its SSH banner but did not send SSH_MSG_KEXINIT — the handshake never reaches authentication."$'\n\n'
          body+="Probe output:"$'\n\n```\n'"$(cat probe.txt)"$'\n```\n\n'
          body+="Likely a PROXY-protocol mismatch between Traefik and the gateway (w6/m132): confirm the gateway Deployment sets BEX_SSH_PROXY_PROTOCOL_TRUSTED_CIDRS to the cluster pod CIDR while the ssh IngressRouteTCP sets proxyProtocol. \`scripts/gitops-validate.sh\` guards the manifests; this checks the live edge."
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label ssh-edge-down --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "SSH edge is down: no KEXINIT from $SSH_EDGE" \
              --label ssh-edge-down \
              --body "$body"
          fi
      - name: Close the tracking issue once the edge recovers
        if: steps.probe.outputs.down == 'false'
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label ssh-edge-down --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "$SSH_EDGE completed the version exchange and sent KEXINIT again."
          fi
      - name: Probe trusted wildcard TLS and intentional 404
        id: tls_probe
        if: always()
        env:
          ONBEX_PROBE_HOST: ${{ github.event.inputs.host || 'notfound.onbex.co' }}
        run: |
          if bash scripts/onbex-default-tls-verify.sh "$ONBEX_PROBE_HOST" > tls-probe.txt 2>&1; then
            echo "down=false" >> "$GITHUB_OUTPUT"
          else
            echo "down=true" >> "$GITHUB_OUTPUT"
          fi
          cat tls-probe.txt
      - name: Open a fallback-TLS tracking issue
        if: always() && steps.tls_probe.outputs.down == 'true'
        env:
          ONBEX_PROBE_HOST: ${{ github.event.inputs.host || 'notfound.onbex.co' }}
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label onbex-fallback-tls-down --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh label create onbex-fallback-tls-down --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "Unknown onbex.co hosts lack trusted fallback TLS" --force
            {
              printf 'The public fallback TLS synthetic failed for `%s`. This checks browser trust, the exact `*.onbex.co` SAN, at least 30 days of validity, and the intentional HTTP 404.\n\n' "$ONBEX_PROBE_HOST"
              printf 'Probe output:\n\n```\n%s\n```\n\n' "$(cat tls-probe.txt)"
              printf 'Rotate the externally issued certificate through `BEX_ONBEX_TLS_CERT_FILE` / `BEX_ONBEX_TLS_KEY_FILE`, run `scripts/gh-secrets.sh`, and dispatch `deploy.yml`. bex does not call a DNS provider.\n'
            } > issue-body.md
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "onbex.co fallback TLS is invalid or expiring" \
              --label onbex-fallback-tls-down --body-file issue-body.md
          fi
      - name: Close the fallback-TLS issue after recovery
        if: always() && steps.tls_probe.outputs.down == 'false'
        env:
          ONBEX_PROBE_HOST: ${{ github.event.inputs.host || 'notfound.onbex.co' }}
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label onbex-fallback-tls-down --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "$ONBEX_PROBE_HOST again has trusted wildcard TLS and returns the intentional 404."
          fi
      - name: Probe the Web Shell WS edge for refusal-shape
        id: shell_ws_probe
        if: always()
        run: |
          if bash scripts/shell-ws-probe.sh "$SHELL_WS_URL" > shell-ws-probe.txt 2>&1; then
            echo "down=false" >> "$GITHUB_OUTPUT"
          else
            echo "down=true" >> "$GITHUB_OUTPUT"
          fi
          cat shell-ws-probe.txt
      - name: Open or update the Web Shell WS tracking issue
        if: always() && steps.shell_ws_probe.outputs.down == 'true'
        run: |
          gh label create shell-ws-edge-down --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "wss://ssh.bex.co/shell is not returning the 401 missing-ticket refusal (w2/m90)" --force
          body="$SHELL_WS_URL did not return the deterministic 401 \"missing ticket\" refusal — the Web Shell edge is dead, misrouted, or unactivated."$'\n\n'
          body+="Probe output:"$'\n\n```\n'"$(cat shell-ws-probe.txt)"$'\n```\n\n'
          body+="Alive-but-refusing (401 missing ticket) is healthy; timeout/refused/TLS/wrong-route/503 are not. Confirm Ingress \`bex-ssh-shell\`, cert \`bex-ssh-shell-tls\`, gateway listener on :8080, and Secret \`bex-shell-ticket\` (scripts/shell-ticket-secret.sh)."
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label shell-ws-edge-down --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Web Shell WS edge is down: no 401 refusal from $SHELL_WS_URL" \
              --label shell-ws-edge-down \
              --body "$body"
          fi
      - name: Close the Web Shell WS tracking issue once the edge recovers
        if: always() && steps.shell_ws_probe.outputs.down == 'false'
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label shell-ws-edge-down --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "$SHELL_WS_URL again returns 401 missing ticket (alive-but-refusing)."
          fi
      - name: Fail the run when a public edge is unhealthy
        if: always() && (steps.probe.outputs.down == 'true' || steps.tls_probe.outputs.down == 'true' || steps.shell_ws_probe.outputs.down == 'true')
        env:
          ONBEX_PROBE_HOST: ${{ github.event.inputs.host || 'notfound.onbex.co' }}
        run: |
          if [[ "${{ steps.probe.outputs.down }}" == true ]]; then
            echo "::error::$SSH_EDGE did not send KEXINIT — SSH is down" >&2
          fi
          if [[ "${{ steps.tls_probe.outputs.down }}" == true ]]; then
            echo "::error::$ONBEX_PROBE_HOST fallback TLS is invalid, expiring, or no longer returns 404" >&2
          fi
          if [[ "${{ steps.shell_ws_probe.outputs.down }}" == true ]]; then
            echo "::error::$SHELL_WS_URL did not return 401 missing ticket — Web Shell WS edge is down" >&2
          fi
          exit 1

  # w6/m131/t004. The request-log pipeline's silent-zero failure: type=request
  # returned 200 with no rows for every tenant service while app and build logs
  # kept working, because the shipper's ServiceName attribution regex was
  # anchored to the literal `default` namespace and every ADR043 `tea-<xid>`
  # tenant access line was dropped as not_a_tenant_app.
  #
  # scripts/logs-verify.sh could not have caught this even if it HAD been run in
  # production — it deploys its fixture into APP_NS=default, the one namespace
  # the broken regex still matched. So this probe asserts the property that
  # actually failed: request streams exist FOR A TENANT NAMESPACE. It reads
  # Loki's label index (no line scan, no API credential, no fixture) and needs
  # only cluster access.
  #
  # w3/m83/t002 adds the sibling assertion for `type=app`, the pipeline w3/m36
  # found empty for every tenant. One probe, one cluster read per type, and two
  # independent tracking issues: `request-logs-down` and `app-logs-down`. The
  # types are kept separate all the way to the issue because their remediations
  # are unrelated (an attribution regex vs. the Alloy DaemonSet's reach), and a
  # healthy sibling must never mask a dark pipeline.
  request-logs-liveness:
    runs-on: [self-hosted, Linux, ARM64, bex-production]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.1
      # Same not-every-host-has-gh guard as public-edge-liveness above — this
      # job is the one observed failing its close-issue step on the gh-less host.
      - name: Ensure gh CLI
        run: |
          command -v gh >/dev/null && exit 0
          v=2.100.0
          curl -fsSL -o "$RUNNER_TEMP/gh.tgz" "https://github.com/cli/cli/releases/download/v${v}/gh_${v}_linux_arm64.tar.gz"
          echo "ea4e7a581a32ccad6cc7923cb1576ac5859ba4b9a16ab22eb8f8a96e78e2e961  $RUNNER_TEMP/gh.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${v}_linux_arm64/bin" >> "$GITHUB_PATH"
      # Same credential staging as deploy.yml: everything under $RUNNER_TEMP
      # (auto-deleted at job end), never ~/.ssh or a fixed path on the shared
      # self-hosted runner, and the control-plane host key is pinned so the
      # fetch fails closed rather than trusting an unknown key.
      - name: Get app cluster kubeconfig
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          BEX_SSH_PRIVATE_KEY: ${{ secrets.BEX_SSH_PRIVATE_KEY }}
          BEX_SSH_KNOWN_HOSTS: ${{ secrets.BEX_SSH_KNOWN_HOSTS }}
        run: |
          install -m700 -d "$RUNNER_TEMP/bex-ssh"
          printf '%s\n' "$BEX_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/bex-ssh/id_bex"
          chmod 600 "$RUNNER_TEMP/bex-ssh/id_bex"
          export BEX_SSH_KEY_PATH="$RUNNER_TEMP/bex-ssh/id_bex"
          export BEX_SSH_REQUIRE_KNOWN_HOSTS=1
          if [ -n "${BEX_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "${BEX_SSH_KNOWN_HOSTS}" > "$RUNNER_TEMP/bex-ssh/bex_known_hosts"
            chmod 600 "$RUNNER_TEMP/bex-ssh/bex_known_hosts"
            export BEX_SSH_KNOWN_HOSTS_FILE="$RUNNER_TEMP/bex-ssh/bex_known_hosts"
          fi
          bash scripts/fetch-app-kubeconfig.sh "$RUNNER_TEMP/app.kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/app.kubeconfig" >> "$GITHUB_ENV"
      # The SSH key was only ever needed to fetch admin.conf.
      - name: Scrub SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/bex-ssh"
      # One probe, one RESULT line per stream type. The per-type verdict comes
      # from those lines rather than the exit status, because exit 2 already
      # means "the probe could not run" — see the script's header. A type with
      # no RESULT line stays `unknown`: its issue is neither opened nor closed
      # on evidence the probe never gathered, while `rc` still fails the run.
      - name: Probe the tenant log pipelines for tenant streams
        id: probe
        run: |
          rc=0
          bash scripts/request-logs-liveness.sh 6h > logs-probe.txt 2>&1 || rc=$?
          cat logs-probe.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          for t in request app; do
            status=unknown
            if grep -qx "RESULT type=$t status=live" logs-probe.txt; then
              status=live
            elif grep -qx "RESULT type=$t status=dark" logs-probe.txt; then
              status=dark
            fi
            echo "$t=$status" >> "$GITHUB_OUTPUT"
          done
      - name: Open or update the request-log tracking issue
        if: steps.probe.outputs.request == 'dark'
        run: |
          gh label create request-logs-down --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "type=request is producing no tenant lines (w6/m131)" --force
          body="The Traefik request-log pipeline is not attributing lines to tenant namespaces, so \`type=request\` is silently empty for every service — a 200 with no rows, indistinguishable from a quiet service."$'\n\n'
          body+="Probe output:"$'\n\n```\n'"$(cat logs-probe.txt)"$'\n```\n\n'
          body+="First suspect is the ServiceName attribution regex in \`deploy/gitops/base/log-shipper.yaml\` drifting from where App CRs actually live (ADR043 \`tea-<xid>\` namespaces) — the w6/m131 root cause. \`TestShipperRegexAttributesTenantNamespaceServices\` guards the regex in CI; this checks the live pipeline."
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label request-logs-down --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Request logs are dark: no type=request streams for any tenant" \
              --label request-logs-down \
              --body "$body"
          fi
      - name: Close the request-log tracking issue once it recovers
        if: steps.probe.outputs.request == 'live'
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label request-logs-down --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "type=request streams are being attributed to tenant namespaces again."
          fi
      - name: Open or update the app-log tracking issue
        if: always() && steps.probe.outputs.app == 'dark'
        run: |
          gh label create app-logs-down --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "type=app is producing no tenant lines (w3/m36, w3/m83)" --force
          body="The App container-log pipeline is not attributing lines to tenant namespaces, so \`type=app\` — the default log view for every service — is silently empty. A 200 with no rows reads as a quiet service, which is how w3/m36 stayed hidden."$'\n\n'
          body+="Probe output:"$'\n\n```\n'"$(cat logs-probe.txt)"$'\n```\n\n'
          body+="This pipeline reads the namespace straight from pod metadata, so an attribution regex is NOT the suspect (that is the request-log failure mode). Check the Alloy DaemonSet instead: it must be running on every tenant node (\`kubectl -n monitoring get ds\`), its \`app.bex.co/app\` pod selector must still match what the operator stamps, and Loki must be accepting its pushes. Config: \`deploy/gitops/base/log-shipper.yaml\` (\`app_pods\` pipeline)."
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label app-logs-down --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "App logs are dark: no type=app streams for any tenant" \
              --label app-logs-down \
              --body "$body"
          fi
      - name: Close the app-log tracking issue once it recovers
        if: always() && steps.probe.outputs.app == 'live'
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label app-logs-down --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "type=app streams are being attributed to tenant namespaces again."
          fi
      - name: Fail the run when a tenant log pipeline is dark
        if: always() && steps.probe.outputs.rc != '0'
        env:
          REQUEST_STATUS: ${{ steps.probe.outputs.request }}
          APP_STATUS: ${{ steps.probe.outputs.app }}
          PROBE_RC: ${{ steps.probe.outputs.rc }}
        run: |
          dark=0
          if [[ "$REQUEST_STATUS" == dark ]]; then
            echo "::error::no type=request streams for any tenant namespace — request logs are dark" >&2
            dark=1
          fi
          if [[ "$APP_STATUS" == dark ]]; then
            echo "::error::no type=app streams for any tenant namespace — app logs are dark" >&2
            dark=1
          fi
          if [[ "$dark" == 0 ]]; then
            echo "::error::the log-pipeline probe could not run (exit $PROBE_RC) — Loki or the cluster read failed, so no pipeline was assessed" >&2
          fi
          exit 1
      # Last, and only after every cluster read: admin.conf outlives the SSH key
      # because the probe needs it, so it is scrubbed here rather than above.
      - name: Scrub the cluster kubeconfig
        if: always()
        run: rm -f -- "$RUNNER_TEMP/app.kubeconfig"

  # w3/m83/t003. The tenant's own view of a running service, asked with a
  # tenant's credential. The two jobs above read the platform's internals; this
  # one reads the product, which is the only place the w6/m110 failure class
  # shows up — bex-api returning 200 with an empty body for a service that is
  # provably serving traffic, because its Loki/Prometheus query named the wrong
  # selector. The probe makes the traffic itself so "empty" is never ambiguous.
  #
  # Fixture (created out of band by an authorized operator, docs/ADR088 §6): a
  # first-party `bex-canary` workspace holding one free web service from
  # examples/hello-go, plus a workspace-scoped API key. Free-tier hibernation is
  # wanted, not tolerated — the probe's request wakes the service, exercising the
  # activator, and the wake lands in the events feed that stage 4 reads.
  #
  # Configuration is deliberately split: the key is a repository SECRET
  # (BEX_CANARY_API_KEY, in .env + scripts/gh-secrets.sh), while the fixture's
  # ids are repository VARIABLES (BEX_CANARY_SERVICE_ID, BEX_CANARY_URL) because
  # they are not secret and a wrong value should be readable in the run log. If
  # any of the three is missing the job SOFT-SKIPS with a notice rather than
  # failing: an unconfigured fixture is an operator to-do, not a production
  # incident, and a red run here must always mean "production is broken".
  tenant-view-liveness:
    runs-on: [self-hosted, Linux, ARM64, bex-production]
    env:
      GH_TOKEN: ${{ github.token }}
      BEX_API_URL: ${{ vars.BEX_API_URL || 'https://api.bex.co' }}
      BEX_OAUTH_ISSUER: ${{ vars.BEX_OAUTH_ISSUER || 'https://oauth.bex.co' }}
      BEX_CANARY_SERVICE_ID: ${{ vars.BEX_CANARY_SERVICE_ID }}
      BEX_CANARY_URL: ${{ vars.BEX_CANARY_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same not-every-host-has-gh guard as the jobs above.
      - name: Ensure gh CLI
        run: |
          command -v gh >/dev/null && exit 0
          v=2.100.0
          curl -fsSL -o "$RUNNER_TEMP/gh.tgz" "https://github.com/cli/cli/releases/download/v${v}/gh_${v}_linux_arm64.tar.gz"
          echo "ea4e7a581a32ccad6cc7923cb1576ac5859ba4b9a16ab22eb8f8a96e78e2e961  $RUNNER_TEMP/gh.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${v}_linux_arm64/bin" >> "$GITHUB_PATH"
      - name: Check whether the canary fixture is configured
        id: fixture
        env:
          BEX_CANARY_API_KEY: ${{ secrets.BEX_CANARY_API_KEY }}
        run: |
          missing=""
          [ -n "${BEX_CANARY_API_KEY:-}" ] || missing="$missing BEX_CANARY_API_KEY(secret)"
          [ -n "${BEX_CANARY_SERVICE_ID:-}" ] || missing="$missing BEX_CANARY_SERVICE_ID(var)"
          [ -n "${BEX_CANARY_URL:-}" ] || missing="$missing BEX_CANARY_URL(var)"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tenant-view canary skipped — not configured yet:$missing. Create the bex-canary workspace + service, mint the scoped key, then run scripts/gh-secrets.sh and set the two repository variables (docs/ADR088 §6)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Probe the tenant view (url -> logs -> metrics -> events)
        id: probe
        if: steps.fixture.outputs.configured == 'true'
        env:
          BEX_CANARY_API_KEY: ${{ secrets.BEX_CANARY_API_KEY }}
        run: |
          code=0
          bash scripts/tenant-view-liveness.sh > tenant-view.txt 2>&1 || code=$?
          case "$code" in
            0) stage="none" ;;
            3) stage="1/4 wake (the canary service does not serve)" ;;
            4) stage="2/4 logs (bex-api does not report the request it just served)" ;;
            5) stage="3/4 metrics (empty series for a serving service)" ;;
            6) stage="4/4 events (the feed did not advance)" ;;
            *) stage="configuration/probe error" ;;
          esac
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          if [ "$code" = 0 ]; then echo "down=false" >> "$GITHUB_OUTPUT"; else echo "down=true" >> "$GITHUB_OUTPUT"; fi
          cat tenant-view.txt
      - name: Open or update the tracking issue
        if: steps.probe.outputs.down == 'true'
        run: |
          gh label create tenant-view-down --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "The tenant view of a running service is broken (w3/m83)" --force
          body="The production canary service is not answering a tenant correctly. Failing stage: **${{ steps.probe.outputs.stage }}** (exit ${{ steps.probe.outputs.code }})."$'\n\n'
          body+="Probe output:"$'\n\n```\n'"$(cat tenant-view.txt)"$'\n```\n\n'
          body+="Read the stage before the pipeline: stage 1 red is a hosting/activator failure, stages 2-4 red with stage 1 green mean the service IS serving and bex-api is answering wrongly — the w6/m110 class, where the series exist and the query names them wrong. Cross-check \`request-logs-liveness\` in this same workflow: green there plus red here isolates the fault to bex-api's query rather than the shipper."
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label tenant-view-down --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Tenant view is broken: ${{ steps.probe.outputs.stage }}" \
              --label tenant-view-down \
              --body "$body"
          fi
      - name: Close the tracking issue once the tenant view recovers
        if: steps.probe.outputs.down == 'false'
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label tenant-view-down --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "The canary served this probe's request and bex-api reported it back through logs, metrics, and events."
          fi
      - name: Fail the run when the tenant view is broken
        if: steps.probe.outputs.down == 'true'
        run: |
          echo "::error::tenant-view canary failed at ${{ steps.probe.outputs.stage }}" >&2
          exit 1
