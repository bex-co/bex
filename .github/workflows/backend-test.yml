name: test (backend)

# Run the backend and agent-driver suites on every PR and main push touching
# their inputs, and as a reusable workflow called by deploy.yml to gate the
# build+push+deploy job on the exact commit it deploys.
# Integration tests run against real ephemeral Postgres, OpenFGA, and OpenBao
# containers started as steps, all digest-pinned and enforced by scripts/image-pin-validate.sh.
on:
  pull_request:
    paths:
      - "lego/backend/**"
      - "lego/agent-image/**"
      - "lego/types/**"
      # Files outside those trees that the tests read. push and pull_request
      # keep one list; scripts/ci_test_inputs.py fails on a read it misses.
      - "dashboard/src/features/deploys/locales/en.ts"
      - "deploy/gitops/authz/**"
      - "deploy/gitops/base/log-shipper.yaml"
      - "deploy/gitops/base/values/kratos-email-templates.values.yaml"
      - "deploy/gitops/base/values/traefik.values.yaml"
      - "docs/ADR018-render-parity.md"
      - "docs/ADR101-agent-automations.md"
      - "docs/render-artifacts/fixtures/render-webhook-vocabulary-*.json"
      - "lego/cli/testdata/**"
      - "lego/operator/config/api/deployment.yaml"
      - "scripts/stripe-billing-*.sh"
      - "scripts/stripe-billing-setup.py"
      - "scripts/stripe_billing_*.py"
      - "scripts/test_stripe_billing_*.py"
      - "scripts/lib/stripe-billing.sh"
      - "scripts/stripe_orphan_audit.py"
      - "scripts/test_stripe_orphan_audit.py"
      - "scripts/ci-fetch-verified.sh"
      - ".github/workflows/backend-test.yml"
  push:
    branches: [main]
    paths:
      - "lego/backend/**"
      - "lego/agent-image/**"
      - "lego/types/**"
      - "dashboard/src/features/deploys/locales/en.ts"
      - "deploy/gitops/authz/**"
      - "deploy/gitops/base/log-shipper.yaml"
      - "deploy/gitops/base/values/kratos-email-templates.values.yaml"
      - "deploy/gitops/base/values/traefik.values.yaml"
      - "docs/ADR018-render-parity.md"
      - "docs/ADR101-agent-automations.md"
      - "docs/render-artifacts/fixtures/render-webhook-vocabulary-*.json"
      - "lego/cli/testdata/**"
      - "lego/operator/config/api/deployment.yaml"
      - "scripts/stripe-billing-*.sh"
      - "scripts/stripe-billing-setup.py"
      - "scripts/stripe_billing_*.py"
      - "scripts/test_stripe_billing_*.py"
      - "scripts/lib/stripe-billing.sh"
      - "scripts/stripe_orphan_audit.py"
      - "scripts/test_stripe_orphan_audit.py"
      - "scripts/ci-fetch-verified.sh"
      - ".github/workflows/backend-test.yml"
  workflow_call: {}

permissions:
  contents: read

# A PR's newer push cancels its superseded run; each main push runs to the
# end, so every code push gets its own verdict. Inside deploy.yml's
# workflow_call `github.workflow` names the caller, so the group uses a fixed
# prefix and the caller's run id: deploy runs never cancel each other's gates.
concurrency:
  group: backend-test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    # Public-repo safety (github-actions-validate.sh rule 7): fork PR heads never run this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      # GOWORK=off, same as operator-test.yml: the backend module resolves
      # standalone via `replace …/lego/types => ../types` — exactly how the
      # release image (lego/Dockerfile golang:1.26, no go.work) compiles it —
      # so test with the workspace off, matching prod. Go version follows
      # lego/backend/go.mod (the 1.26 line); setup-go pins GOTOOLCHAIN=local.
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
      # The trigger paths above must cover every file these tests read
      # outside their tree. Only in this workflow's own runs: a gap in the
      # trigger list is no reason to hold deploy.yml's gate.
      - name: trigger paths cover the files the tests read
        if: github.workflow == 'test (backend)'
        run: python3 -B scripts/ci_test_inputs.py .github/workflows/backend-test.yml
      # The runner's Docker Hub pulls intermittently time out on
      # registry-1.docker.io (run 39504771495: three postgres pulls in under a
      # minute, then the job failed). A `services:` container is pulled before
      # any step with only the runner's short retry, so every dependency image
      # is pulled here with a longer backoff, and each one starts from the
      # local cache.
      - name: pull dependency images (with retries)
        run: |
          for image in \
            postgres:17@sha256:e2fddda1fea39c634dccdae58dba5448eb3efb85aaa4054cf45cbed28f35d296 \
            grafana/loki:3.6.7@sha256:3c8fd3570dd9219951a60d3f919c7f31923d10baee578b77bc26c4a0b32d092d \
            openfga/openfga:latest@sha256:01a6000aa6040a4d0bde6ea1d3359ac3b9f21dc972ac6103a87b38659a836776 \
            quay.io/openbao/openbao:2.5.5@sha256:6150c4a6b62067db6141c8da7a6a6b5763f4f47c315343d0c848b40fecdfd452; do
            for i in 1 2 3 4 5; do
              docker pull "$image" && break
              [ "$i" -lt 5 ] || exit 1
              echo "pull $image attempt $i failed, retrying in $((i * 20))s..."; sleep $((i * 20))
            done
          done
      # Postgres runs as a step rather than a `services:` container so its pull
      # gets the retries above. Digest-pinned like every other image bex
      # resolves (w7/m85): the integration suite runs real SQL against it.
      # Pinned to the linux/arm64/v8 manifest, not the multi-arch index: this
      # job runs on ubuntu-24.04-arm, and a services: pull once resolved the
      # index to a wrong-arch binary (entrypoint exec EINVAL).
      - name: start Postgres
        run: |
          docker rm -f backend-test-postgres >/dev/null 2>&1 || true
          docker run -d --name backend-test-postgres \
            -e POSTGRES_PASSWORD=pw \
            -p 127.0.0.1:5432:5432 \
            postgres:17@sha256:e2fddda1fea39c634dccdae58dba5448eb3efb85aaa4054cf45cbed28f35d296
          timeout 90 bash -c 'until docker exec backend-test-postgres pg_isready -U postgres -h 127.0.0.1; do sleep 2; done'
      # TestLokiRequestMetricsClipToWindowOnLoki runs the request-metrics LogQL in
      # the pinned Loki engine (w4/m175; 3.6.7 is production's version). Started
      # first so its ~20 s warm-up overlaps setup; readiness is awaited before go test.
      - name: start Loki (request-log metric reads)
        run: |
          docker rm -f backend-test-loki >/dev/null 2>&1 || true
          docker run -d --name backend-test-loki \
            -p 127.0.0.1:3100:3100 \
            grafana/loki:3.6.7@sha256:3c8fd3570dd9219951a60d3f919c7f31923d10baee578b77bc26c4a0b32d092d \
            -config.file=/etc/loki/local-config.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lego/backend/go.mod
          # Hosted runners start empty: restore the module + build caches
          # (shared by every job with the same Go version and go.sum set).
          cache-dependency-path: |
            lego/backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lego/agent-image/driver/package-lock.json
      - name: test agent session driver (ACP spawn, streams, resume gate, overlay, delivery check, bex MCP)
        working-directory: lego/agent-image/driver
        run: npm ci --ignore-scripts && npm test
      # OpenFGA runs as a step, not a `services:` container: its image entrypoint
      # is the bare binary and the HTTP server only starts under the `run`
      # subcommand — which a services: block can't supply, so a service container
      # exits immediately (help text) and the seed below would time out.
      - name: start OpenFGA (in-memory)
        run: |
          docker run -d --name openfga \
            -e OPENFGA_DATASTORE_ENGINE=memory \
            -p 8080:8080 -p 8081:8081 \
            openfga/openfga:latest@sha256:01a6000aa6040a4d0bde6ea1d3359ac3b9f21dc972ac6103a87b38659a836776 run
      - name: seed OpenFGA (bex store + authz model)
        run: |
          # Wait for OpenFGA to accept connections (no HEALTHCHECK in its image).
          timeout 60 bash -c 'until curl -sf http://localhost:8080/healthz; do sleep 2; done'
          store_id=$(curl -sf -X POST http://localhost:8080/stores \
            -H 'Content-Type: application/json' \
            -d '{"name":"bex"}' | jq -r '.id')
          curl -sf -X POST "http://localhost:8080/stores/$store_id/authorization-models" \
            -H 'Content-Type: application/json' \
            -d @deploy/gitops/authz/model.json
      - name: start OpenBao (ephemeral KV v2)
        run: |
          docker run -d --name backend-test-openbao \
            -e BAO_DEV_ROOT_TOKEN_ID=backend-test-only \
            -p 127.0.0.1:8200:8200 \
            quay.io/openbao/openbao:2.5.5@sha256:6150c4a6b62067db6141c8da7a6a6b5763f4f47c315343d0c848b40fecdfd452 \
            server -dev -dev-listen-address=0.0.0.0:8200
          timeout 60 bash -c 'until curl -sf http://localhost:8200/v1/sys/health; do sleep 2; done'
      - name: install promtool # TestInstanceSecondsQueryOnPrometheus runs the billing query in Prometheus's engine (w5/m111); same 3.13 LTS line as the production server and gitops.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          # Bounded, resumed and checksum-verified: a stalled download held this
          # step 36 minutes (run 39524511518), and six restarts from byte zero
          # each timed out short of the 95 MB tarball (run 41585192817).
          bash scripts/ci-fetch-verified.sh \
            https://github.com/prometheus/prometheus/releases/download/v3.13.5/prometheus-3.13.5.linux-arm64.tar.gz \
            e705357ffa5b3189e98bf145d044364d75dd994470c706a07731292932b2ee0f \
            "$RUNNER_TEMP/prometheus.tar.gz"
          tar -xzf "$RUNNER_TEMP/prometheus.tar.gz" -C "$RUNNER_TEMP" prometheus-3.13.5.linux-arm64/promtool
          install -m755 -D "$RUNNER_TEMP/prometheus-3.13.5.linux-arm64/promtool" \
            "$RUNNER_TEMP/bin/promtool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: wait for Loki
        run: timeout 90 bash -c 'until curl -sf http://localhost:3100/ready; do sleep 2; done'
      # Every Render-shaped /v1 response the internal/api and internal/apps
      # suites produce is validated against the pinned Render OpenAPI
      # (internal/api/openapi/render-public-api-1.json) by internal/rendertest
      # (w3/m272), as part of go test ./... below (no extra step needed).
      #
      # Pin-update workflow (when Render ships a spec change):
      #  1. Re-pin per docs/render-artifacts/openapi-request-validation.md.
      #  2. Run this job's go test ./... (with the test database).
      #  3. Fix each new response failure. rendertest.Allowlist only shrinks
      #     (TestAllowlistOnlyShrinks); each entry cites a row of ADR018's
      #     "Allowlisted response-schema divergences" table.
      #  4. A full run fails any allowlist entry no response reproduces any
      #     more (bex now conforms there): remove it and lower allowlistSize.
      # Fill the module cache first, with retries: a single proxy.golang.org
      # fetch failure otherwise fails the suite (operator run 42069264215).
      - name: download Go modules (with retries)
        working-directory: lego/backend
        run: |
          for i in 1 2 3; do
            go mod download && break
            [ "$i" -lt 3 ] || exit 1
            echo "go mod download attempt $i failed, retrying in $((i * 15))s..."; sleep $((i * 15))
          done
      # The shared CRD contract's own tests: no other job runs them, so a
      # regression there passed CI while its importers still compiled (w4/589).
      - name: go test ./... (types)
        working-directory: lego/types
        run: go test ./...
      - name: go test ./... (backend)
        working-directory: lego/backend
        env:
          BEX_TEST_DB_URI: postgres://postgres:pw@localhost:5432/postgres?sslmode=disable
          BEX_TEST_OPENFGA_URL: http://localhost:8080
          BEX_TEST_OPENBAO_KV_URL: http://localhost:8200
          BEX_TEST_OPENBAO_KV_TOKEN: backend-test-only
          BEX_TEST_LOKI_URL: http://localhost:3100
          # This job provisions every dependency above (and promtool): a test
          # that would skip for want of one fails here instead (testenv.Skip,
          # w5/m112), so the job can't quietly stop running it.
          BEX_TEST_REQUIRE_DEPS: "1"
        # The integration packages share this one ephemeral database, and
        # legacy store suites intentionally TRUNCATE their fixtures. Serialize
        # package test binaries so those resets cannot erase another package's
        # live rows; tests within each package remain normally parallelizable.
        run: go test -p 1 ./...
      - name: test Stripe billing operations (offline guards + reconciliation)
        run: >-
          python3 -m unittest
          scripts/test_stripe_billing_secret.py
          scripts/test_stripe_billing_operations.py
          scripts/test_stripe_billing_reconcile.py
          scripts/test_stripe_orphan_audit.py
      - name: stop test Postgres, OpenBao and Loki
        if: always()
        run: docker rm -f backend-test-postgres backend-test-openbao backend-test-loki
