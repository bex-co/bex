name: test (backend)

# Run the backend and agent-driver suites on every relevant push/PR, and as a
# reusable workflow called by deploy.yml to gate the build+push+deploy job.
# Integration tests gated on BEX_TEST_DB_URI / BEX_TEST_OPENFGA_URL run against real
# ephemeral service containers (postgres:17 + openfga/openfga in-memory), both
# digest-pinned and enforced by scripts/image-pin-validate.sh.
on:
  push:
    branches: [main]
    paths:
      - "lego/backend/**"
      - "lego/agent-image/**"
      - "lego/types/**"
      - "lego/agent-image/**"
      - "scripts/stripe-billing-*.sh"
      - "scripts/stripe_billing_*.py"
      - "scripts/test_stripe_billing_*.py"
      - "scripts/lib/stripe-billing.sh"
      - ".github/workflows/backend-test.yml"
  pull_request:
    paths:
      - "lego/backend/**"
      - "lego/agent-image/**"
      - "lego/types/**"
      - "lego/agent-image/**"
      - "scripts/stripe-billing-*.sh"
      - "scripts/stripe_billing_*.py"
      - "scripts/test_stripe_billing_*.py"
      - "scripts/lib/stripe-billing.sh"
      - ".github/workflows/backend-test.yml"
  workflow_call: {}

permissions:
  contents: read

jobs:
  backend:
    # Public-repo safety: fork PR code must never reach persistent self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: bex-ci
      labels: [self-hosted, Linux, ARM64]
    env:
      # Same workspace/toolchain split as operator-test.yml: lego/go.work
      # requires go >= 1.26.0 (lego/cli) while this job installs the 1.25 line
      # the release image ships and setup-go pins GOTOOLCHAIN=local. The
      # backend module resolves standalone via `replace …/lego/types =>
      # ../types` — exactly how the image build compiles it — so test with
      # the workspace off, matching prod.
      GOWORK: "off"
    services:
      postgres:
        # Digest-pinned like every other image bex resolves (w7/m85): the
        # integration suite runs real SQL against this container, so a retagged
        # postgres:17 changes what the backend is certified against. Pinned to
        # the linux/arm64/v8 manifest specifically, not the multi-arch index —
        # this runner is self-hosted ARM64 (runs-on above), and GitHub Actions'
        # `services:` container pull does not reliably resolve an OCI index to
        # the host's own platform (it failed here with the entrypoint script
        # exec-ing with EINVAL, the signature of a wrong-arch binary, even
        # though the index digest we previously pinned did include an arm64/v8
        # manifest). Pinning the platform-specific digest removes that
        # resolution step entirely.
        image: postgres:17@sha256:e2fddda1fea39c634dccdae58dba5448eb3efb85aaa4054cf45cbed28f35d296
        env:
          POSTGRES_PASSWORD: pw
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lego/backend/go.mod
          cache-dependency-path: lego/backend/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lego/agent-image/driver/package-lock.json
      - name: test agent session driver (ACP spawn, streams, resume gate, scrub)
        working-directory: lego/agent-image/driver
        run: npm ci --ignore-scripts && npm test
      # OpenFGA runs as a step, not a `services:` container: its image entrypoint
      # is the bare binary and the HTTP server only starts under the `run`
      # subcommand — which a services: block can't supply, so a service container
      # exits immediately (help text) and the seed below would time out.
      - name: start OpenFGA (in-memory)
        run: |
          docker run -d --name openfga \
            -e OPENFGA_DATASTORE_ENGINE=memory \
            -p 8080:8080 -p 8081:8081 \
            openfga/openfga:latest@sha256:01a6000aa6040a4d0bde6ea1d3359ac3b9f21dc972ac6103a87b38659a836776 run
      - name: seed OpenFGA (bex store + authz model)
        run: |
          # Wait for OpenFGA to accept connections (no HEALTHCHECK in its image).
          timeout 60 bash -c 'until curl -sf http://localhost:8080/healthz; do sleep 2; done'
          store_id=$(curl -sf -X POST http://localhost:8080/stores \
            -H 'Content-Type: application/json' \
            -d '{"name":"bex"}' | jq -r '.id')
          curl -sf -X POST "http://localhost:8080/stores/$store_id/authorization-models" \
            -H 'Content-Type: application/json' \
            -d @deploy/gitops/authz/model.json
      # TestRenderConformance (internal/api/conformance_test.go) validates bex's
      # REST responses against the pinned Render OpenAPI schemas in
      # internal/api/testdata/render-openapi.json. It runs as part of go test
      # ./... below (no extra step needed).
      #
      # Pin-update workflow (when Render ships a spec change):
      #  1. Replace lego/backend/internal/api/testdata/render-openapi.json with
      #     the new spec (or its response-schema subset for the covered operationIds).
      #  2. Run: cd lego/backend && go test ./internal/api/... -run TestRenderConformance -v
      #  3. For each new failure, decide keep-or-fix:
      #     - Keep (bex intentionally diverges): add an entry to conformanceAllowlist
      #       in conformance_allowlist_test.go, citing the ADR018 row.
      #     - Fix: update bex's response to match Render's schema, remove the entry.
      #  4. TestConformanceAllowlistEntries will flag any allowlist entry that no
      #     longer matches a real divergence (bex now conforms on that point).
      - name: go test ./... (backend)
        working-directory: lego/backend
        env:
          BEX_TEST_DB_URI: postgres://postgres:pw@localhost:5432/postgres?sslmode=disable
          BEX_TEST_OPENFGA_URL: http://localhost:8080
        # The integration packages share this one ephemeral database, and
        # legacy store suites intentionally TRUNCATE their fixtures. Serialize
        # package test binaries so those resets cannot erase another package's
        # live rows; tests within each package remain normally parallelizable.
        run: go test -p 1 ./...
      - name: test agent credential snapshot scrub
        run: bash lego/agent-image/credential-scrub-test.sh
      - name: test Stripe billing operations (offline guards + reconciliation)
        run: >-
          python3 -m unittest
          scripts/test_stripe_billing_secret.py
          scripts/test_stripe_billing_operations.py
          scripts/test_stripe_billing_reconcile.py
