name: test (backend)

# Run the backend test suite on every push/PR touching lego/backend or lego/types,
# and as a reusable workflow called by deploy.yml to gate the build+push+deploy job.
# Integration tests gated on BEX_TEST_DB_URI / BEX_TEST_OPENFGA_URL run against real
# ephemeral service containers (postgres:17 + openfga/openfga in-memory).
on:
  push:
    branches: [main]
    paths:
      - "lego/backend/**"
      - "lego/types/**"
      - "scripts/stripe-billing-*.sh"
      - "scripts/stripe_billing_*.py"
      - "scripts/test_stripe_billing_*.py"
      - "scripts/lib/stripe-billing.sh"
      - ".github/workflows/backend-test.yml"
  pull_request:
    paths:
      - "lego/backend/**"
      - "lego/types/**"
      - "scripts/stripe-billing-*.sh"
      - "scripts/stripe_billing_*.py"
      - "scripts/test_stripe_billing_*.py"
      - "scripts/lib/stripe-billing.sh"
      - ".github/workflows/backend-test.yml"
  workflow_call: {}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: lego/backend/go.mod
          cache-dependency-path: lego/backend/go.sum
      # OpenFGA runs as a step, not a `services:` container: its image entrypoint
      # is the bare binary and the HTTP server only starts under the `run`
      # subcommand — which a services: block can't supply, so a service container
      # exits immediately (help text) and the seed below would time out.
      - name: start OpenFGA (in-memory)
        run: |
          docker run -d --name openfga \
            -e OPENFGA_DATASTORE_ENGINE=memory \
            -p 8080:8080 -p 8081:8081 \
            openfga/openfga:latest run
      - name: seed OpenFGA (bex store + authz model)
        run: |
          # Wait for OpenFGA to accept connections (no HEALTHCHECK in its image).
          timeout 60 bash -c 'until curl -sf http://localhost:8080/healthz; do sleep 2; done'
          store_id=$(curl -sf -X POST http://localhost:8080/stores \
            -H 'Content-Type: application/json' \
            -d '{"name":"bex"}' | jq -r '.id')
          curl -sf -X POST "http://localhost:8080/stores/$store_id/authorization-models" \
            -H 'Content-Type: application/json' \
            -d @deploy/gitops/authz/model.json
      # TestRenderConformance (internal/api/conformance_test.go) validates bex's
      # REST responses against the pinned Render OpenAPI schemas in
      # internal/api/testdata/render-openapi.json. It runs as part of go test
      # ./... below (no extra step needed).
      #
      # Pin-update workflow (when Render ships a spec change):
      #  1. Replace lego/backend/internal/api/testdata/render-openapi.json with
      #     the new spec (or its response-schema subset for the covered operationIds).
      #  2. Run: cd lego/backend && go test ./internal/api/... -run TestRenderConformance -v
      #  3. For each new failure, decide keep-or-fix:
      #     - Keep (bex intentionally diverges): add an entry to conformanceAllowlist
      #       in conformance_allowlist_test.go, citing the ADR018 row.
      #     - Fix: update bex's response to match Render's schema, remove the entry.
      #  4. TestConformanceAllowlistEntries will flag any allowlist entry that no
      #     longer matches a real divergence (bex now conforms on that point).
      - name: go test ./... (backend)
        working-directory: lego/backend
        env:
          BEX_TEST_DB_URI: postgres://postgres:pw@localhost:5432/postgres?sslmode=disable
          BEX_TEST_OPENFGA_URL: http://localhost:8080
        # The integration packages share this one ephemeral database, and
        # legacy store suites intentionally TRUNCATE their fixtures. Serialize
        # package test binaries so those resets cannot erase another package's
        # live rows; tests within each package remain normally parallelizable.
        run: go test -p 1 ./...
      - name: test Stripe billing operations (offline guards + reconciliation)
        run: >-
          python3 -m unittest
          scripts/test_stripe_billing_secret.py
          scripts/test_stripe_billing_operations.py
          scripts/test_stripe_billing_reconcile.py
