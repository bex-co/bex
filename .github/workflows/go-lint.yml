name: go lint

# Runs `make lint` from lego/operator — golangci-lint over all four modules
# (operator + backend + types + cli), followed by whole-program dead-code
# analysis across every executable and test root (including e2e build tags).
#
# Notable enforced conventions: the backend config's depguard forbids importing
# github.com/rs/xid outside internal/id (the resource-id convention,
# docs/ADR020-identifiers.md — a hand-rolled id fails CI), and the operator
# config gates line length (lll ≤120), complexity, modernization, and
# staticcheck hygiene. Fix locally with:
#   cd lego/operator && make lint        # check
#   cd lego/operator && make lint-fix    # auto-fix what's fixable
#
# The Makefile builds its pinned custom golangci-lint (v2.15.0 + operator
# plugins) and deadcode analyzer on first use, so this job needs no separate
# tool install. Go comes from lego/cli/go.mod (1.27, since render-oss/cli
# v2.26.0 moved cli + lego/go.work onto Go 1.27 — w8/m33); that one workspace
# toolchain lints every module, and the 1.26 platform modules build unchanged
# under it (language semantics come from each module's own go directive). The
# Makefile pins the golangci-lint BUILD toolchain to that same version
# (GO_LINT_TOOLCHAIN, from lego/cli/go.mod): golangci-lint's own go.mod targets
# 1.26, and a 1.26-built binary refuses to analyze the 1.27 cli module.
on:
  pull_request:
    paths:
      - "lego/operator/**"
      - "lego/backend/**"
      - "lego/types/**"
      - "lego/cli/**"
      - ".github/workflows/go-lint.yml"
  push:
    branches: [main]
    paths:
      - "lego/operator/**"
      - "lego/backend/**"
      - "lego/types/**"
      - "lego/cli/**"
      - ".github/workflows/go-lint.yml"

permissions:
  contents: read

# One running + one pending run per branch: without a group every main push
# queued a full run, which starved the old CI runner pool; hosted jobs still
# share the org's concurrent-job limit. Only PRs cancel a running check.
concurrency:
  group: go-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # Public-repo safety (github-actions-validate.sh rule 7): fork PR heads never run this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lego/cli/go.mod
          # Hosted runners start empty: restore the module + build caches for
          # all four modules (the custom golangci-lint build and whole-program
          # analysis). The old runner's save outran the home link and hung in
          # "Post Run setup-go"; hosted runners upload to the Actions cache
          # over GitHub's own network.
          cache-dependency-path: |
            lego/types/go.sum
            lego/operator/go.sum
            lego/backend/go.sum
            lego/cli/go.sum
      - name: lint and dead-code analysis (operator + backend + types + cli)
        working-directory: lego/operator
        run: make lint
