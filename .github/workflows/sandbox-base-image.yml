name: sandbox base image (build + verify)

# Publishes bex's default sandbox image from deploy/sandbox-base/ (ADR104 D2
# "Image", w22/m447): Node 24 on Debian 12 with curl, wget, git and busybox,
# which a sandbox created with no image runs, so Render's three first-party
# agent templates install their executors unchanged.
#
# This workflow publishes; it never pins. Pinning the published digest as the
# BEX_SANDBOX_IMAGE default in lego/backend/cmd/api/config.go is a reviewed
# commit, made once check.sh has passed on both platforms here. The tags live
# in the public bex-operator package, as the CSI derivative's and the Postgres
# operands' do: a new package starts private, and sandbox nodes pull the image
# without credentials. It runs only when the recipe changes.

on:
  push:
    branches: [main]
    paths:
      - "deploy/sandbox-base/**"
      - ".github/workflows/sandbox-base-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sandbox-base-image
  cancel-in-progress: false

env:
  SANDBOX_BASE_IMAGE: ghcr.io/bex-co/bex-operator

jobs:
  build:
    permissions:
      contents: read
      packages: write
    # Ref guard: only reviewed main may publish a platform image.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy/sandbox-base
          persist-credentials: false
      # Hosted runners register no binfmt handlers: install QEMU so the amd64
      # leg's RUN step executes on this arm64 runner. The binfmt image is
      # digest-pinned like every other image bex runs.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: amd64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Production's sandbox pool is linux/amd64; local CAPD clusters on Apple
      # silicon are linux/arm64.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/sandbox-base
          file: deploy/sandbox-base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.SANDBOX_BASE_IMAGE }}:sandbox-base-${{ github.sha }}

  # Regression gate: check.sh passes in the pushed digest, per platform, each
  # on its own native runner (ubuntu-latest is the linux/amd64 image work
  # DO_NOT_DO.md #CI-RUNNERS reserves it for). Never pushed.
  verify-arm64:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy/sandbox-base
          persist-credentials: false
      - name: check.sh in the pushed digest
        env:
          REF: ${{ env.SANDBOX_BASE_IMAGE }}@${{ needs.build.outputs.digest }}
        run: docker run --rm -i --platform linux/arm64 "$REF" /bin/sh -s < deploy/sandbox-base/check.sh

  verify-amd64:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy/sandbox-base
          persist-credentials: false
      - name: check.sh in the pushed digest
        env:
          REF: ${{ env.SANDBOX_BASE_IMAGE }}@${{ needs.build.outputs.digest }}
        run: docker run --rm -i --platform linux/amd64 "$REF" /bin/sh -s < deploy/sandbox-base/check.sh

  publish:
    needs: [build, verify-arm64, verify-amd64]
    permissions:
      contents: read
      packages: write
      id-token: write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install reviewed Syft with bounded transport retries
        timeout-minutes: 15
        run: python3 scripts/install-syft.py
      - name: sign image + attest SBOM
        env:
          REF: ${{ env.SANDBOX_BASE_IMAGE }}@${{ needs.build.outputs.digest }}
          TAG: ${{ env.SANDBOX_BASE_IMAGE }}:sandbox-base-${{ github.sha }}
        run: |
          cosign sign --yes --oidc-provider=github-actions "$REF"
          syft "$REF" -o spdx-json > "$RUNNER_TEMP/sbom.spdx.json"
          cosign attest --yes --oidc-provider=github-actions --type spdxjson --predicate "$RUNNER_TEMP/sbom.spdx.json" "$REF"
          echo "Published $TAG@${REF##*@} — pin it as the BEX_SANDBOX_IMAGE default in lego/backend/cmd/api/config.go (ADR104 D2)." >> "$GITHUB_STEP_SUMMARY"
