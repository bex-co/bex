name: govulncheck (Go workspace)

# Source-level, call-graph-aware vulnerability scanning (w7/m62 t001) — the
# complement to Trivy (container images) and gitleaks (commit secrets) in the CI
# security-guard family. govulncheck reports ONLY vulnerabilities in REACHABLE
# code, so it is low-false-positive and safe to GATE on.
#
# Gate policy: FAIL when a reachable vulnerability has a fixed version available
# (the actionable case) — govulncheck's non-zero exit blocks the merge. A finding
# with NO fix available would be triaged to a documented `warn` (exclude it and
# note it here) rather than blocking indefinitely; the current baseline has none.
#
# Baseline (2026-07-31, triaged before enabling the gate — all three modules now
# scan clean):
#   - GO-2026-5970 (golang.org/x/text < v0.39.0, reachable) — FIXED by bumping
#     x/text to v0.39.0 in lego/operator + lego/backend.
#   - GO-2026-5856 (crypto/tls ECH privacy leak, fixed in go1.25.12 / go1.26.5) —
#     resolved by scanning under the `1.26` Go line the release image builds with
#     (lego/Dockerfile `FROM golang:1.26`; setup-go's latest 1.26.x is >= 1.26.5),
#     so what govulncheck sees is the stdlib production actually ships.
#   - GO-2026-6354 / GO-2026-6355 (golang.org/x/crypto/ssh DoS, reachable via the
#     ssh-gateway) — FIXED by bumping x/crypto to v0.56.0, which requires go 1.26;
#     that bump is what moved the platform (and this scan) from the 1.25 line.
#
# Go version: pinned to the `1.26` line to MATCH lego/Dockerfile, never a newer
# toolchain — a newer Go would hide a stdlib vuln the release image still carries.
# Tool pin: govulncheck@v1.1.4 via `go install`, integrity-verified against the Go
# checksum database (GOSUMDB, on by default) — the go-install equivalent of the
# gitleaks/trivy version+sha256 binary pin.
on:
  pull_request:
    paths:
      - "lego/**"
      # lego/cli is the user-installed CLI (bex-cli/v* train), not part of the
      # shipped platform image — it is outside this gate's scope.
      - "!lego/cli/**"
      - ".github/workflows/govulncheck.yml"
  push:
    branches: [main]
    paths:
      - "lego/**"
      - "!lego/cli/**"
      - ".github/workflows/govulncheck.yml"

permissions:
  contents: read

jobs:
  govulncheck:
    # Public-repo safety: fork PR code must never reach persistent self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, bex-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the newest 1.26.x from go.dev (the golang:1.26 line)
        id: goline
        # The scan must run the SAME newest-1.26.x stdlib the release image
        # ships (lego/Dockerfile `FROM golang:1.26`). Neither the runner's
        # pre-installed toolchain nor setup-go's version manifest can be
        # trusted for that on a patch-release day — both lag go.dev by
        # hours-to-days, and the scan then flags stdlib vulns the image no
        # longer carries.
        #
        # go.dev's default `mode=json` feed is only the two currently
        # supported majors; query `include=all` so this keeps resolving the
        # newest 1.26.x patch even once 1.26 ages out of current-releases,
        # for as long as `golang:1.26` is what production builds.
        run: |
          v=$(curl -fsSL 'https://go.dev/dl/?mode=json&include=all' | jq -r '[.[] | select(.stable) | .version | select(startswith("go1.26."))][0] // empty' | sed 's/^go//')
          if [ -z "$v" ]; then
            echo "no stable 1.26.x in go.dev's archive feed" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "resolved go $v"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ steps.goline.outputs.version }}"
          cache: false
      - name: Install govulncheck (pinned, checksum-DB verified)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Scan the Go platform modules (fail on any reachable vuln)
        # GOWORK=off: scan each platform module exactly as lego/Dockerfile
        # builds it — standalone, with no go.work in play — so it resolves via
        # its own `replace …/lego/types => ../types` directive against the same
        # module graph production ships, not the workspace's unioned versions.
        run: |
          rc=0
          for mod in types operator backend; do
            echo "::group::govulncheck lego/$mod"
            (cd "lego/$mod" && GOWORK=off govulncheck ./...) || rc=1
            echo "::endgroup::"
          done
          exit $rc
