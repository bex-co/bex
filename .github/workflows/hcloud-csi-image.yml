name: hcloud CSI image (build + verify)

# Publishes the bounded-ext4 derivative; the reviewed digest is pinned only
# after the real LUKS/full/grow/remount/restore regression passes.
on:
  push:
    branches: [main]
    paths:
      - "deploy/hcloud-csi/Dockerfile"
      - "deploy/hcloud-csi/bounded-ext4.patch"
      - ".github/workflows/hcloud-csi-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hcloud-csi-image
  cancel-in-progress: false

env:
  CSI_IMAGE: ghcr.io/bex-co/bex-operator

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, bex-production]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - name: build disposable kernel regression image
        run: |
          docker build --target kernel-test -t "bex-csi-kernel:${GITHUB_SHA}" deploy/hcloud-csi
          # A container reference protects this owned image from concurrent
          # unused-image GC between build and verification steps.
          docker create --name "bex-csi-kernel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --privileged --network none -e BEX_CSI_KERNEL_TEST=1 "bex-csi-kernel:${GITHUB_SHA}"
      - name: verify encrypted bounded filesystem behavior
        run: |
          container="bex-csi-kernel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker start --attach "$container"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" -eq 0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/hcloud-csi
          file: deploy/hcloud-csi/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.CSI_IMAGE }}:hcloud-csi-${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: sign image and attest SBOM
        env:
          REF: ${{ env.CSI_IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes --oidc-provider=github-actions "$REF"
          syft "$REF" -o spdx-json > "$RUNNER_TEMP/sbom.spdx.json"
          cosign attest --yes --oidc-provider=github-actions --type spdxjson --predicate "$RUNNER_TEMP/sbom.spdx.json" "$REF"
          echo "Published $REF — pin both CSI controller/node images before enabling the bounded-ext4 StorageClass." >> "$GITHUB_STEP_SUMMARY"
      - name: remove owned kernel regression image
        if: always()
        run: |
          docker rm -f -v "bex-csi-kernel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
          docker image rm "bex-csi-kernel:${GITHUB_SHA}" || true
