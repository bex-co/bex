name: Cluster diagnose (manual, read-only)

# Read-only production view for an incident: why a service's pod is not
# running, whether the cluster autoscaler is adding nodes, and how full each
# node is (2026-10-24: beancount-cms-v2's pod stayed Pending after a node
# roll). It only gets/describes/reads logs — it never mutates anything.
#
# This repository is public, and so is this log (w5/m501, ADR019 §Decision 5):
# scripts/cluster-diagnose.sh --public-log prints counts, phases, reasons,
# readiness and allocation, with tenant namespaces, pod and service names,
# node names and addresses as keyed hashes and tenant event text left out.
# The service id is read from the event payload rather than an `env:` block
# (a step's env is printed in its log header) and masked before any step
# runs. Full detail is local: bash scripts/fetch-app-kubeconfig.sh <path>,
# then bash scripts/cluster-diagnose.sh <srv-id>.
on:
  workflow_dispatch:
    inputs:
      service_id:
        description: Service id (srv-...) whose pods to inspect
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cluster-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    # The production-cluster environment scopes the control-plane host-key pin
    # (BEX_SSH_KNOWN_HOSTS), as for app-cluster.yml.
    environment: production-cluster
    steps:
      - name: Mask and validate the service id
        run: |
          sid="$(jq -r '.inputs.service_id // ""' "$GITHUB_EVENT_PATH")"
          [ -z "$sid" ] || echo "::add-mask::$sid"
          [[ "$sid" =~ ^srv-[0-9a-v]{20}$ ]] || { echo "service_id must be srv-<20 chars>" >&2; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.36.1

      - name: Fetch production kubeconfig
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          BEX_SSH_PRIVATE_KEY: ${{ secrets.BEX_SSH_PRIVATE_KEY }}
          BEX_SSH_KNOWN_HOSTS: ${{ secrets.BEX_SSH_KNOWN_HOSTS }}
        run: |
          install -m700 -d "$RUNNER_TEMP/bex-ssh"
          printf '%s\n' "$BEX_SSH_PRIVATE_KEY" >"$RUNNER_TEMP/bex-ssh/bex"
          chmod 600 "$RUNNER_TEMP/bex-ssh/bex"
          export BEX_SSH_KEY_PATH="$RUNNER_TEMP/bex-ssh/bex"
          export BEX_SSH_REQUIRE_KNOWN_HOSTS=1
          if [ -n "${BEX_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$BEX_SSH_KNOWN_HOSTS" >"$RUNNER_TEMP/bex-ssh/bex_known_hosts"
            chmod 600 "$RUNNER_TEMP/bex-ssh/bex_known_hosts"
            export BEX_SSH_KNOWN_HOSTS_FILE="$RUNNER_TEMP/bex-ssh/bex_known_hosts"
          fi
          bash scripts/fetch-app-kubeconfig.sh "$RUNNER_TEMP/app.kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/app.kubeconfig" >>"$GITHUB_ENV"

      - name: scrub SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/bex-ssh"

      # The redactor once more on the way out: an error kubectl prints still
      # names what it was asked for.
      - name: Diagnose (public log)
        run: |
          set -o pipefail
          bash scripts/cluster-diagnose.sh "$(jq -r '.inputs.service_id' "$GITHUB_EVENT_PATH")" --public-log 2>&1 \
            | python3 scripts/lib/public_log.py

      - name: scrub kubeconfig
        if: always()
        run: rm -f -- "$RUNNER_TEMP/app.kubeconfig"
