name: test (bex CLI)

on:
  push:
    branches: [main]
    paths:
      - "lego/cli/**"
      - "scripts/bex-cli-*.sh"
      - "docs/bex-cli.md"
      - "docs/cli-compatibility-checklist.md"
      - ".github/workflows/cli-test.yml"
      - "lego/backend/internal/cliauth/**"
      - "lego/backend/internal/api/**"
  pull_request:
    paths:
      - "lego/cli/**"
      - "scripts/bex-cli-*.sh"
      - "docs/bex-cli.md"
      - "docs/cli-compatibility-checklist.md"
      - ".github/workflows/cli-test.yml"
      - "lego/backend/internal/cliauth/**"
      - "lego/backend/internal/api/**"

permissions:
  contents: read

# One running + one pending run per branch, as the other push/PR checks: a PR
# cancels its superseded run; main never cancels a running check, so main's
# state is always reported.
concurrency:
  group: cli-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli:
    # Public-repo safety (github-actions-validate.sh rule 7): fork PR heads never run this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lego/cli/go.mod
          # Hosted runners start empty: restore the module + build caches
          # (shared by every job with the same Go version and go.sum set).
          cache-dependency-path: |
            lego/cli/go.sum
      - name: validate upstream import pin
        run: bash scripts/bex-cli-validate.sh
      - name: test launcher
        working-directory: lego/cli
        run: go test ./...
      # The launcher test contains a complete local device-grant → token →
      # forced refresh → revoke lifecycle. These backend packages verify the
      # complementary Bex adapter still accepts the upstream Render CLI wire
      # shape. The browser/Hydra verifier remains an explicit release gate in
      # scripts/bex-cli-auth-e2e.sh because it needs disposable credentials.
      - name: test Bex device-flow adapter
        working-directory: lego/backend
        run: go test ./internal/cliauth ./internal/api
      - name: build release candidates
        run: bash scripts/bex-cli-build.sh dist
