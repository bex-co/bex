name: m114 existing snapshot preservation audit (temporary)

# Uses the EXISTING pre-cutover snapshot; never creates a marker, backup, restore
# namespace, or production KV/SQL write. Remove after the proof is recorded.
on:
  workflow_dispatch:
    inputs:
      snapshot_uri:
        description: Exact reviewed 07:26 pre-cutover S3 snapshot URI
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: openbao-production-restore-drill
  cancel-in-progress: false

jobs:
  compare:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, bex-production]
    environment: production-restore
    timeout-minutes: 25
    env:
      M114_CONTAINER: bex-m114-proof-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # The runner context is not available in job-level env, so the report
      # path is named here.
      - name: Name this run's report under runner scratch
        run: echo "M114_REPORT=$RUNNER_TEMP/m114-preservation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.1

      # Before any credential is in scope: which Docker limits this runner
      # enforces (the restore drops the ones it cannot apply).
      - name: Probe local Docker limits (no credentials)
        timeout-minutes: 4
        run: python3 scripts/audits/m114-preservation-audit.py --probe-limits

      - name: Install checksum-pinned age under runner scratch
        env:
          AGE_VERSION: "1.3.1"
          AGE_LINUX_ARM64_SHA256: c6878a324421b69e3e20b00ba17c04bc5c6dab0030cfe55bf8f68fa8d9e9093a
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/m114-age.tar.gz"
          curl --connect-timeout 15 --max-time 120 -fsSLo "$archive" \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-arm64.tar.gz"
          printf '%s  %s\n' "$AGE_LINUX_ARM64_SHA256" "$archive" | sha256sum --check --strict
          install -d "$RUNNER_TEMP/m114-age"
          tar -xzf "$archive" -C "$RUNNER_TEMP/m114-age" age/age
          echo "$RUNNER_TEMP/m114-age/age" >>"$GITHUB_PATH"

      - name: Fetch production kubeconfig with existing pinned SSH custody
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          BEX_SSH_PRIVATE_KEY: ${{ secrets.BEX_SSH_PRIVATE_KEY }}
          BEX_SSH_KNOWN_HOSTS: ${{ secrets.BEX_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          install -m700 -d "$RUNNER_TEMP/m114-ssh"
          printf '%s\n' "$BEX_SSH_PRIVATE_KEY" >"$RUNNER_TEMP/m114-ssh/id_bex"
          printf '%s\n' "$BEX_SSH_KNOWN_HOSTS" >"$RUNNER_TEMP/m114-ssh/known_hosts"
          export BEX_SSH_KEY_PATH="$RUNNER_TEMP/m114-ssh/id_bex"
          export BEX_SSH_REQUIRE_KNOWN_HOSTS=1
          export BEX_SSH_KNOWN_HOSTS_FILE="$RUNNER_TEMP/m114-ssh/known_hosts"
          bash scripts/fetch-app-kubeconfig.sh "$RUNNER_TEMP/app.kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/app.kubeconfig" >>"$GITHUB_ENV"

      - name: Scrub SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/m114-ssh"

      - name: Restore only into network-none local Docker and compare
        env:
          M114_SNAPSHOT_URI: ${{ inputs.snapshot_uri }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_ENDPOINT: ${{ secrets.TF_STATE_ENDPOINT }}
          TF_STATE_REGION: ${{ secrets.TF_STATE_REGION }}
          TF_STATE_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY }}
          TF_STATE_SECRET_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
          BEX_BACKUP_READER_OPENBAO_ACCESS_KEY_ID: ${{ secrets.BEX_BACKUP_READER_OPENBAO_ACCESS_KEY_ID }}
          BEX_BACKUP_READER_OPENBAO_SECRET_ACCESS_KEY: ${{ secrets.BEX_BACKUP_READER_OPENBAO_SECRET_ACCESS_KEY }}
          BAO_UNSEAL_KEY_1: ${{ secrets.BAO_UNSEAL_KEY_1 }}
          BAO_UNSEAL_KEY_2: ${{ secrets.BAO_UNSEAL_KEY_2 }}
          BAO_UNSEAL_KEY_3: ${{ secrets.BAO_UNSEAL_KEY_3 }}
          BAO_ROOT_TOKEN: ${{ secrets.BAO_ROOT_TOKEN }}
          AGE_BACKUP_PRIVATE_KEY: ${{ secrets.AGE_BACKUP_PRIVATE_KEY }}
          AGE_BACKUP_PRIVATE_KEY_PREVIOUS: ${{ secrets.AGE_BACKUP_PRIVATE_KEY_PREVIOUS }}
          RESTORE_SKIP_DOTENV: "1"
        run: timeout --signal=TERM --kill-after=120s 20m bash scripts/audits/m114-preservation-audit.sh

      - name: Publish sanitized equality evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m114-preservation-equality
          path: ${{ runner.temp }}/m114-preservation-${{ github.run_id }}-${{ github.run_attempt }}.json
          retention-days: 14
          if-no-files-found: error

      - name: Final local credential and restore cleanup
        if: always()
        run: |
          status=0
          python3 scripts/audits/m114-preservation-audit.py --cleanup-container "$M114_CONTAINER" || status=1
          rm -rf -- "$RUNNER_TEMP/m114-ssh" "$RUNNER_TEMP/m114-age"
          rm -f -- "$RUNNER_TEMP/app.kubeconfig"
          rm -f -- "$RUNNER_TEMP/m114-age.tar.gz"
          # Only this run/attempt's scratch and report; never Docker prune.
          find "$RUNNER_TEMP" -maxdepth 1 -type d -name "m114-preservation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.*" -exec rm -rf -- {} +
          rm -f -- "$M114_REPORT" "$M114_REPORT.writing"
          exit "$status"
