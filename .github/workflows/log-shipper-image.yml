name: log-shipper image (build + verify)

# Publishes ghcr.io/bex-co/bex-alloy from deploy/log-shipper/ (rationale in its
# Dockerfile). This workflow publishes; it never pins: pinning the digest in
# deploy/gitops/base/log-shipper.yaml is a reviewed commit, made after
# scripts/test_log_shipper.py passes on it.

on:
  push:
    branches: [main]
    paths:
      - "deploy/log-shipper/**"
      - ".github/workflows/log-shipper-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: log-shipper-image
  cancel-in-progress: false

env:
  ALLOY_IMAGE: ghcr.io/bex-co/bex-alloy

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
    # Ref guard: only reviewed main may publish a platform image.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, bex-production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One build step at a time: two concurrent Alloy compiles/links (one per
      # platform) took the runner down mid-build with no log, twice.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Production nodes are linux/amd64; local CAPD clusters and the
      # scripts/test_log_shipper.py replay on Apple silicon are linux/arm64.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: deploy/log-shipper
          file: deploy/log-shipper/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.ALLOY_IMAGE }}:v1.11.2-bex-cri-first-ts-${{ github.sha }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: sign image + attest SBOM
        env:
          REF: ${{ env.ALLOY_IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes --oidc-provider=github-actions "$REF"
          syft "$REF" -o spdx-json > "$RUNNER_TEMP/sbom.spdx.json"
          cosign attest --yes --oidc-provider=github-actions --type spdxjson --predicate "$RUNNER_TEMP/sbom.spdx.json" "$REF"
          echo "Published $REF — pin it in deploy/gitops/base/log-shipper.yaml after the replay passes." >> "$GITHUB_STEP_SUMMARY"
