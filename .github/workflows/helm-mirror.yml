name: Mirror reviewed Helm charts

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: reviewed-helm-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, bex-production]
    environment: production-deploy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.1
      # Chart-only maintenance uses the same verified bytes and deterministic
      # identities as deploy.yml, without writing platform image digests.
      - name: Mirror and verify reviewed charts
        run: |
          chart_dir=$(mktemp -d)
          trap 'rm -rf -- "$chart_dir"' EXIT
          bash scripts/helm-artifact.sh mirror "$chart_dir"
