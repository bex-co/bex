name: postgres operand image (build + verify)

# Publishes bex's managed-Postgres operand images (ADR092 D1, w8/m92 t008):
# one per major in deploy/pg-operand/matrix.json, each CNPG's reviewed system
# image plus Render's documented extensions and the pgextwlist allowlist.
#
# This workflow publishes; it never pins. Adopting a digest in
# lego/operator/internal/controller/database_exports.go (bexOperandImages) is
# a reviewed commit under docs/ADR060 D7, and it restarts every managed
# cluster of that major once (ADR092 D4). The tags live in the public
# bex-operator package, as the CSI derivative's do, and start with the
# PostgreSQL version because CloudNativePG reads the major from the tag.

on:
  push:
    branches: [main]
    paths:
      - "deploy/pg-operand/**"
      - ".github/workflows/pg-operand-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pg-operand-image
  cancel-in-progress: false

env:
  OPERAND_IMAGE: ghcr.io/bex-co/bex-operator

jobs:
  matrix:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, bex-production]
    outputs:
      majors: ${{ steps.read.outputs.majors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        run: echo "majors=$(jq -c 'keys' deploy/pg-operand/matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: [self-hosted, Linux, ARM64, bex-production]
    strategy:
      fail-fast: false
      # The runner pool also serves deploys (w4/439); two majors at a time.
      max-parallel: 2
      matrix:
        major: ${{ fromJSON(needs.matrix.outputs.majors) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: recipe
        env:
          MAJOR: ${{ matrix.major }}
        run: |
          m=deploy/pg-operand/matrix.json
          base=$(jq -er --arg m "$MAJOR" '.[$m].base' "$m")
          # The tag keeps the base's PostgreSQL version first (18.6-…).
          version=$(sed -E 's/^[^:]+:([0-9]+\.[0-9]+)-.*/\1/' <<<"$base")
          case "$version" in "$MAJOR".*) ;; *) echo "base $base is not PG$MAJOR" >&2; exit 1 ;; esac
          {
            echo "base=$base"
            echo "duckdb=$(jq -r --arg m "$MAJOR" '.[$m].duckdb // .[$m].base' "$m")"
            echo "packages=$(jq -er --arg m "$MAJOR" '.[$m].packages' "$m")"
            echo "timescale_packages=$(jq -r --arg m "$MAJOR" '.[$m].timescale_packages // ""' "$m")"
            echo "extensions=$(jq -er --arg m "$MAJOR" '.[$m].extensions | join(",")' "$m")"
            echo "tag=$version-postgres-$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Production nodes are linux/amd64; local CAPD clusters on Apple silicon
      # are linux/arm64.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: deploy/pg-operand
          file: deploy/pg-operand/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.recipe.outputs.base }}
            DUCKDB_IMAGE=${{ steps.recipe.outputs.duckdb }}
            PG_MAJOR=${{ matrix.major }}
            PGDG_PACKAGES=${{ steps.recipe.outputs.packages }}
            TIMESCALE_PACKAGES=${{ steps.recipe.outputs.timescale_packages }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=${{ steps.recipe.outputs.base }}
          tags: ${{ env.OPERAND_IMAGE }}:${{ steps.recipe.outputs.tag }}

      # The ADR092 D3 gate on the exact pushed digest, per platform, with
      # networking disabled: every allowlisted extension created and used by a
      # non-superuser owner, the closed list, and pg_dump/restore.
      - name: verify the allowlist on the pushed digest
        env:
          REF: ${{ env.OPERAND_IMAGE }}@${{ steps.build.outputs.digest }}
          MAJOR: ${{ matrix.major }}
          EXTENSIONS: ${{ steps.recipe.outputs.extensions }}
        run: |
          for platform in linux/arm64 linux/amd64; do
            docker run --rm --pull missing --platform "$platform" --network none \
              -v "$PWD/deploy/pg-operand:/check:ro" "$REF" bash /check/check.sh "$MAJOR" "$EXTENSIONS"
          done

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: sign image + attest SBOM
        env:
          REF: ${{ env.OPERAND_IMAGE }}@${{ steps.build.outputs.digest }}
          TAG: ${{ env.OPERAND_IMAGE }}:${{ steps.recipe.outputs.tag }}
          MAJOR: ${{ matrix.major }}
        run: |
          cosign sign --yes --oidc-provider=github-actions "$REF"
          syft "$REF" -o spdx-json > "$RUNNER_TEMP/sbom.spdx.json"
          cosign attest --yes --oidc-provider=github-actions --type spdxjson --predicate "$RUNNER_TEMP/sbom.spdx.json" "$REF"
          echo "Published PG$MAJOR \`${TAG}@${REF#*@}\` — pin it in bexOperandImages per docs/ADR060 D7 and ADR092 D4." >> "$GITHUB_STEP_SUMMARY"
