name: postgres operand image (build + verify)

# Publishes bex's managed-Postgres operand images (ADR092 D1, w8/m92 t008):
# one per major in deploy/pg-operand/matrix.json, each CNPG's reviewed system
# image plus Render's documented extensions and the pgextwlist allowlist.
#
# This workflow publishes; it never pins. Adopting a digest in
# lego/operator/internal/controller/database_operand.go (bexOperandImages) is
# a reviewed commit under docs/ADR060 D7, and it restarts every managed
# cluster of that major once (ADR092 D4). The tags live in the public
# bex-operator package, as the CSI derivative's do, and start with the
# PostgreSQL version because CloudNativePG reads the major from the tag.

on:
  push:
    branches: [main]
    paths:
      - "deploy/pg-operand/**"
      - ".github/workflows/pg-operand-image.yml"
      - "scripts/install-syft.py"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pg-operand-image
  cancel-in-progress: false

env:
  OPERAND_IMAGE: ghcr.io/bex-co/bex-operator

jobs:
  matrix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    # unit tests + matrix read; slowest recent success 6 min (github-actions-validate.sh check 10).
    timeout-minutes: 15
    outputs:
      majors: ${{ steps.read.outputs.majors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
          persist-credentials: false
      - id: read
        run: |
          python3 -B -m unittest discover -s deploy/pg-operand -p '*_test.py'
          for f in check.sh gate.sh; do bash -n "deploy/pg-operand/$f"; done
          for f in config.sh export.sh dump-snapshot.sh restore.sh; do sh -n "deploy/pg-operand/$f"; done
          echo "majors=$(jq -c 'keys' deploy/pg-operand/matrix.json)" >> "$GITHUB_OUTPUT"

  # Builds both platforms into one OCI layout and gates arm64 natively. The
  # layout goes to the native amd64 gate and then to publish as an artifact,
  # never to GHCR: only an image that passed both gates is ever published
  # (w6/109), and `oras cp` publishes the layout byte for byte, so the gated
  # digest is the published one.
  build:
    needs: matrix
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    # Build with the amd64 RUN steps under QEMU, the arm64 gate and the upload;
    # the slowest run before the per-extension gate took 20 min.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Two majors at a time keep image builds well inside the org's
      # concurrent hosted-job limit, leaving room for CI and deploys.
      max-parallel: 2
      matrix:
        major: ${{ fromJSON(needs.matrix.outputs.majors) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
          persist-credentials: false
      - id: recipe
        env:
          MAJOR: ${{ matrix.major }}
        run: |
          m=deploy/pg-operand/matrix.json
          base=$(jq -er --arg m "$MAJOR" '.[$m].base' "$m")
          # The tag keeps the base's PostgreSQL version first (18.6-…).
          version=$(sed -E 's/^[^:]+:([0-9]+\.[0-9]+)-.*/\1/' <<<"$base")
          case "$version" in "$MAJOR".*) ;; *) echo "base $base is not PG$MAJOR" >&2; exit 1 ;; esac
          {
            echo "base=$base"
            echo "duckdb=$(jq -r --arg m "$MAJOR" '.[$m].duckdb // .[$m].base' "$m")"
            echo "packages=$(jq -er --arg m "$MAJOR" '.[$m].packages' "$m")"
            echo "timescale_packages=$(jq -r --arg m "$MAJOR" '.[$m].timescale_packages // ""' "$m")"
            echo "extensions=$(jq -er --arg m "$MAJOR" '.[$m].extensions | join(",")' "$m")"
            echo "admitted=$(jq -er --arg m "$MAJOR" '.[$m].admitted | join(",")' "$m")"
            echo "tag=$version-postgres-$GITHUB_SHA"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      # Hosted runners register no binfmt handlers: install QEMU so the amd64
      # leg's RUN steps execute on this arm64 runner. The binfmt image is
      # digest-pinned like every other image bex runs.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: amd64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.1

      # Production nodes are linux/amd64; local CAPD clusters on Apple silicon
      # are linux/arm64.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/pg-operand
          file: deploy/pg-operand/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/artifact/operand,tar=false
          build-args: |
            BASE_IMAGE=${{ steps.recipe.outputs.base }}
            DUCKDB_IMAGE=${{ steps.recipe.outputs.duckdb }}
            PG_MAJOR=${{ matrix.major }}
            PGDG_PACKAGES=${{ steps.recipe.outputs.packages }}
            TIMESCALE_PACKAGES=${{ steps.recipe.outputs.timescale_packages }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=${{ steps.recipe.outputs.base }}
          tags: ${{ env.OPERAND_IMAGE }}:${{ steps.recipe.outputs.tag }}

      # The ADR092 D3 gate on the exact digest that will be published, with
      # networking disabled: every carried extension created and used by a
      # non-superuser owner, the closed list, and each extension's own owner
      # export/restore verdict, which must match matrix.json's "admitted"
      # list. dockerd shares the runner's network namespace and treats
      # 127.0.0.0/8 as plain HTTP, so it pulls from a job-local registry.
      - name: gate linux/arm64
        env:
          LAYOUT: ${{ runner.temp }}/artifact/operand@${{ steps.build.outputs.digest }}
          DIGEST: ${{ steps.build.outputs.digest }}
          MAJOR: ${{ matrix.major }}
          EXTENSIONS: ${{ steps.recipe.outputs.extensions }}
          ADMITTED: ${{ steps.recipe.outputs.admitted }}
          VERSION: ${{ steps.recipe.outputs.version }}
        run: |
          docker run -d --rm --name "pg-operand-gate-$MAJOR" -p 127.0.0.1::5000 registry:3 >/dev/null
          registry=$(docker port "pg-operand-gate-$MAJOR" 5000/tcp | head -1)
          for _ in $(seq 30); do curl -fsS "http://$registry/v2/" >/dev/null 2>&1 && break; sleep 1; done
          oras cp --from-oci-layout "$LAYOUT" "$registry/operand:gate" --to-plain-http
          bash deploy/pg-operand/gate.sh "$registry/operand" "$DIGEST" "$MAJOR" "$EXTENSIONS" "$ADMITTED" "$VERSION" arm64
      - name: stop the gate registry
        if: always()
        env:
          MAJOR: ${{ matrix.major }}
        run: docker rm -f "pg-operand-gate-$MAJOR" >/dev/null 2>&1 || true

      # The layout carries its recipe, so the matrix legs that follow need no
      # per-leg job outputs (GitHub keeps only one leg's).
      - name: record the recipe beside the layout
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          MAJOR: ${{ matrix.major }}
          EXTENSIONS: ${{ steps.recipe.outputs.extensions }}
          ADMITTED: ${{ steps.recipe.outputs.admitted }}
          VERSION: ${{ steps.recipe.outputs.version }}
          TAG: ${{ steps.recipe.outputs.tag }}
        run: |
          {
            echo "DIGEST=$DIGEST"
            echo "EXTENSIONS=$EXTENSIONS"
            echo "ADMITTED=$ADMITTED"
            echo "VERSION=$VERSION"
            echo "TAG=$TAG"
          } > "$RUNNER_TEMP/artifact/recipe.env"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pg-operand-${{ matrix.major }}
          path: ${{ runner.temp }}/artifact
          if-no-files-found: error
          # The blobs are already compressed.
          compression-level: 0
          retention-days: 1

  # The amd64 gate on amd64 hardware, the linux/amd64 image work ubuntu-latest
  # is reserved for (DO_NOT_DO.md #CI-RUNNERS): under QEMU the emulator's own
  # memory pushes two concurrent DuckDB scans past the 256 MiB cgroup
  # (OOM-killed backend, w21/m584), which says nothing about the image. Each
  # leg gates its own major's layout, so one major's failure never skips
  # another's gate.
  gate-amd64:
    needs: [matrix, build]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.matrix.result == 'success' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Download, registry copy and one native gate; new job, budget unmeasured.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        major: ${{ fromJSON(needs.matrix.outputs.majors) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy/pg-operand
          persist-credentials: false
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.1
      # A major whose build or arm64 gate failed uploaded no layout, so its
      # gate fails here and nothing of it is published.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pg-operand-${{ matrix.major }}
          path: ${{ runner.temp }}/artifact
      - name: gate linux/amd64
        env:
          MAJOR: ${{ matrix.major }}
        run: |
          . "$RUNNER_TEMP/artifact/recipe.env"
          docker run -d --rm --name "pg-operand-gate-$MAJOR" -p 127.0.0.1::5000 registry:3 >/dev/null
          registry=$(docker port "pg-operand-gate-$MAJOR" 5000/tcp | head -1)
          for _ in $(seq 30); do curl -fsS "http://$registry/v2/" >/dev/null 2>&1 && break; sleep 1; done
          oras cp --from-oci-layout "$RUNNER_TEMP/artifact/operand@$DIGEST" "$registry/operand:gate" --to-plain-http
          bash deploy/pg-operand/gate.sh "$registry/operand" "$DIGEST" "$MAJOR" "$EXTENSIONS" "$ADMITTED" "$VERSION" amd64
          mkdir -p "$RUNNER_TEMP/gated"
          echo "$DIGEST" > "$RUNNER_TEMP/gated/amd64"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pg-operand-${{ matrix.major }}-amd64-gated
          path: ${{ runner.temp }}/gated
          if-no-files-found: error
          retention-days: 1

  # Publishes a major only when both of its gates passed: the layout exists
  # only after its arm64 gate, the marker only after its amd64 gate, and both
  # name the same digest.
  # always(): a failed leg upstream must not skip the other majors' publish
  # (needs on a matrix job waits for every leg). The validator allows no
  # negation in a publishing job's condition, so a cancelled run stops in the
  # first step instead.
  publish:
    needs: [matrix, gate-amd64]
    if: github.ref == 'refs/heads/main' && always() && needs.matrix.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        major: ${{ fromJSON(needs.matrix.outputs.majors) }}
    steps:
      - name: stop if the run was cancelled
        if: cancelled()
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pg-operand-${{ matrix.major }}-amd64-gated
          path: ${{ runner.temp }}/gated
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pg-operand-${{ matrix.major }}
          path: ${{ runner.temp }}/artifact
      - id: recipe
        run: |
          . "$RUNNER_TEMP/artifact/recipe.env"
          [ "$(cat "$RUNNER_TEMP/gated/amd64")" = "$DIGEST" ] || { echo "amd64 gated $(cat "$RUNNER_TEMP/gated/amd64"), layout is $DIGEST" >&2; exit 1; }
          {
            echo "digest=$DIGEST"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.1
      - name: publish the gated image
        env:
          LAYOUT: ${{ runner.temp }}/artifact/operand@${{ steps.recipe.outputs.digest }}
          DIGEST: ${{ steps.recipe.outputs.digest }}
          TAG: ${{ env.OPERAND_IMAGE }}:${{ steps.recipe.outputs.tag }}
        run: |
          oras cp --from-oci-layout "$LAYOUT" "$TAG"
          published=$(oras manifest fetch --descriptor "$TAG" | jq -r .digest)
          [ "$published" = "$DIGEST" ] || { echo "published $published, gated $DIGEST" >&2; exit 1; }

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Install reviewed Syft with bounded transport retries
        timeout-minutes: 15
        run: python3 scripts/install-syft.py 1.55.0
      - name: sign image + attest SBOM
        env:
          REF: ${{ env.OPERAND_IMAGE }}@${{ steps.recipe.outputs.digest }}
          TAG: ${{ env.OPERAND_IMAGE }}:${{ steps.recipe.outputs.tag }}
          MAJOR: ${{ matrix.major }}
        run: |
          cosign sign --yes --oidc-provider=github-actions "$REF"
          syft "$REF" -o spdx-json > "$RUNNER_TEMP/sbom.spdx.json"
          cosign attest --yes --oidc-provider=github-actions --type spdxjson --predicate "$RUNNER_TEMP/sbom.spdx.json" "$REF"
          echo "Published PG$MAJOR \`${TAG}@${REF#*@}\` — pin it in bexOperandImages per docs/ADR060 D7 and ADR092 D4." >> "$GITHUB_STEP_SUMMARY"
