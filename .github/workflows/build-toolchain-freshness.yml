name: Build toolchain freshness

# Weekly re-resolve of digest-pinned builder, native-base, and helper images.
# Opens/updates one tracking issue when an upstream digest moves; closes it
# when drift clears. Never edits, commits, or merges a pin. Public registry
# metadata and github.token only — no cluster, registry-push, or tenant credentials.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 4"

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
      - name: Validate and resolve
        id: check
        run: |
          . scripts/lib/gh-retry.sh
          python3 scripts/lib/toolchain-freshness.py validate
          # Three attempts: one upstream 504 once failed the weekly check (run
          # 42046392479). The retry lives here, not in toolchain-freshness.py:
          # that file is a native-common image input (IMAGE_POLICY_FILES), so
          # changing its bytes stales the qualified candidate (w6/m163).
          for attempt in 1 2 3; do
            python3 scripts/lib/toolchain-freshness.py resolve > "$RUNNER_TEMP/resolve.json" && break
            [ "$attempt" -lt 3 ] || exit 1
            echo "::warning::resolve attempt $attempt failed; retrying in $((attempt * 30)) s"
            sleep $((attempt * 30))
          done
          existing="$(gh_retry gh issue list --repo "$GITHUB_REPOSITORY" --label build-toolchain-stale --state open --json number --jq '.[0].number // empty')"
          action="$(EXISTING_ISSUE="$existing" python3 scripts/lib/toolchain-freshness.py issue-action "$RUNNER_TEMP/resolve.json")"
          echo "action=$action" >> "$GITHUB_OUTPUT"
      - name: Open or update the tracking issue
        if: steps.check.outputs.action == 'open' || steps.check.outputs.action == 'update'
        run: |
          body="$(python3 scripts/lib/toolchain-freshness.py issue-body "$RUNNER_TEMP/resolve.json")"
          printf '%s\n' "$body" > issue-body.md
          bash scripts/lib/tracking-issue.sh open --label build-toolchain-stale \
            --color FBCA04 --description "Pinned build-toolchain digest drift" \
            --title "Build toolchain digest drift" --body-file issue-body.md
      - name: Close the tracking issue once drift clears
        if: steps.check.outputs.action == 'close'
        run: |
          bash scripts/lib/tracking-issue.sh close --label build-toolchain-stale --comment "Upstream digests match the committed pins again."
