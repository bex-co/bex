name: snapshot (bake node image)

# Bake the bex node image: a reviewed Hetzner snapshot carrying
# runc/containerd/kubelet for workers and replacement control-plane nodes.
# Recipe: infra/packer/bex-worker.pkr.hcl.
#
# Manual only (workflow_dispatch) — baking spins up a throwaway server and creates
# a billed snapshot, so it runs on demand (image bumps, k8s upgrades), not on push.
# After a successful bake the versioned `bex-worker-k8s-X-Y` snapshot exists in the project;
# ONLY THEN is it safe to apply the cluster.yaml overlay that points the node
# HCloudMachineTemplates at that exact imageName (app-cluster.yml). See
# infra/packer/README.md for the full bake -> verify -> roll -> measure runbook.
#
# Secret: HCLOUD_TOKEN (same token app-cluster.yml / infra.yml use).

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: snapshot-bake
  cancel-in-progress: false

jobs:
  bake:
    runs-on: [self-hosted, Linux, ARM64, bex-production]
    # Ref guard (codex-security round-6 #1): this job holds HCLOUD_TOKEN and
    # executes repository scripts + the Packer template from the dispatched
    # ref, so restrict dispatch to reviewed main — the same guard the other
    # credentialed workflows (app-cluster.yml, deploy.yml) already carry.
    if: github.ref == 'refs/heads/main'
    # The reviewed release manifest selects the version and label; this
    # protected environment supplies an independent production approval before
    # the billed HCLOUD_TOKEN-bearing job starts.
    environment: production-snapshot
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: load reviewed snapshot release manifest
        run: |
          source infra/packer/release.conf
          if ! [[ "${KUBERNETES_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::reviewed KUBERNETES_VERSION is not strict x.y.z semver"
            exit 1
          fi
          if ! [[ "${IMAGE_NAME}" =~ ^bex-worker-k8s-[0-9]+-[0-9]+$ ]]; then
            echo "::error::reviewed IMAGE_NAME is not a versioned worker selector"
            exit 1
          fi
          echo "KUBERNETES_VERSION=${KUBERNETES_VERSION}" >>"$GITHUB_ENV"
          echo "IMAGE_NAME=${IMAGE_NAME}" >>"$GITHUB_ENV"

      - name: install packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "1.11.2"

      # NOT `packer init` (w1/m66 F12): init resolves a version constraint over
      # the network and — since Packer 1.14 dropped .packer.lock.hcl — records no
      # checksum anywhere, so identical revisions could execute different plugin
      # bytes in this HCLOUD_TOKEN-bearing job. The installer verifies the
      # downloaded artifact against infra/packer/plugin-checksums.txt (reviewed,
      # in git) and refuses to install on mismatch.
      - name: install the pinned, checksum-verified hcloud plugin
        run: bash scripts/packer-plugin-install.sh

      - name: packer validate
        working-directory: infra/packer
        run: |
          packer validate \
            -var "kubernetes_version=${KUBERNETES_VERSION}" \
            -var "image_name=${IMAGE_NAME}" .

      - name: packer build (creates the bex-worker snapshot)
        working-directory: infra/packer
        run: |
          packer build \
            -var "kubernetes_version=${KUBERNETES_VERSION}" \
            -var "image_name=${IMAGE_NAME}" .

      # CAPH treats two images with the same caph-image-name as an ambiguity; it
      # does not choose the newest. Keep old snapshots for rollback but remove
      # them from the active selector immediately after a successful bake.
      - name: retire prior bex-worker snapshots
        run: |
          set -euo pipefail
          api='https://api.hetzner.cloud/v1/images'
          auth="Authorization: Bearer $HCLOUD_TOKEN"
          selector=$(jq -rn --arg value "caph-image-name=$IMAGE_NAME" '$value | @uri')
          images=$(curl -fsS -H "$auth" "$api?type=snapshot&label_selector=$selector&sort=created:desc")
          newest=$(jq -r '.images | max_by(.created) | .id' <<<"$images")
          test -n "$newest" && test "$newest" != null
          while read -r id; do
            [ "$id" = "$newest" ] && continue
            image=$(curl -fsS -H "$auth" "$api/$id")
            labels=$(jq --arg retired "${IMAGE_NAME}-retired" '.image.labels + {"caph-image-name":$retired}' <<<"$image")
            payload=$(jq -cn --argjson labels "$labels" '{labels:$labels}')
            curl -fsS -X PUT -H "$auth" -H 'Content-Type: application/json' --data "$payload" "$api/$id" >/dev/null
          done < <(jq -r '.images[].id' <<<"$images")
          active=$(curl -fsS -H "$auth" "$api?type=snapshot&label_selector=$selector" | jq '.images | length')
          test "$active" -eq 1

      - name: summary
        run: |
          echo "Baked the ${IMAGE_NAME} snapshot (k8s ${KUBERNETES_VERSION})."
          echo "Next: verify it provisions ONE worker (infra/packer/README.md runbook),"
          echo "then apply the CAPH overlay to roll workers and control plane onto ${IMAGE_NAME}."
