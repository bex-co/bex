name: Render schema drift

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  render-schema:
    runs-on: [self-hosted, Linux, ARM64, bex-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare Render's published schemas with reviewed pins
        run: scripts/render-schema-drift.sh

  render-mcp:
    runs-on: [self-hosted, Linux, ARM64, bex-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      # Builds render-oss/render-mcp-server and reads its own tools/list, so the
      # comparison is against what upstream actually registers (w1/m70).
      - name: Compare Render's MCP tool surface with the reviewed pin
        run: scripts/render-mcp-drift.sh
