name: Render schema drift

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  render-schema:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
      - name: Compare Render's published schemas with reviewed pins
        # The token only lifts the anonymous rate limit on the CLI release read.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/render-schema-drift.sh

  render-mcp:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      # Builds render-oss/render-mcp-server and reads its own tools/list, so the
      # comparison is against what upstream actually registers (w1/m70).
      - name: Compare Render's MCP tool surface with the reviewed pin
        run: scripts/render-mcp-drift.sh

  # Render's changelog (w4/m553). A feature Render ships only in its dashboard
  # moves none of the contracts above, so every changelog entry needs a row in
  # docs/render-artifacts/render-changelog.md: an owner, a non-goal or n/a.
  render-changelog:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
      - name: Every Render changelog entry has a disposition
        run: scripts/render-changelog-drift.sh

  # Render's dashboard bundle (w1/m645). A feature Render ships only in its
  # dashboard, or keeps behind a per-workspace flag, moves neither the API pins
  # above nor the changelog: every GraphQL operation and flag gate in the public
  # bundle needs a row in docs/render-artifacts/dashboard-operations.md, and a
  # flag gate that leaves the bundle names the item to reopen. Every URL the
  # bundle builds or routes needs a row in the URL table of
  # docs/render-artifacts/dashboard-routes.md (w3/m704), so a page Render adds
  # is found here within a week instead of by a user's 404.
  render-dashboard-ops:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
      - name: Every Render dashboard operation, flag gate and URL has a disposition
        run: scripts/render-dashboard-ops.sh

  # Render's docs pages (w4/m688). Render states its limits, defaults and
  # behaviours on its docs pages and rewrites them without a changelog entry,
  # so every page llms.txt lists needs a row in
  # docs/render-artifacts/docs-pages.md with the hash of the text it was read
  # at. Fails on a new, gone or rewritten page, naming its row's pointer. The
  # cache keeps each page's text under its hash (never in git), so a rewritten
  # page's failure quotes the paragraphs that changed since its row was read; a
  # green run saves the cache, so it always holds the rows' versions.
  render-docs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/render-docs
          key: render-docs-${{ github.run_id }}
          restore-keys: render-docs-
      - name: Every Render docs page has a row, and none changed since it was read
        env:
          RENDER_DOCS_CACHE: ${{ runner.temp }}/render-docs
        run: scripts/render-docs-drift.sh

  # Render's pricing pages (w4/m690). bex's prices are Render's less 30% and its
  # plan limits follow Render's plan tables, both held to fixtures captured by
  # hand in lego/backend/internal/pricing/testdata/. Fails on any changed, added
  # or removed row of the plan comparison table, the features-by-plan page, the
  # seven price tables or the FAQ, naming the pricing.yaml tier, gate or limit
  # it moves. The comparison is the backend's TestRenderPricingDrift, on the
  # backend's own go.mod (the script sets GOWORK=off).
  render-pricing:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lego/backend/go.mod
          cache-dependency-path: |
            lego/backend/go.sum
      - name: Every row of Render's pricing pages matches its fixture
        run: scripts/render-pricing-drift.sh

  # render-oss/skills (w4/m630). `bex skills install` ships a pack derived
  # from it at packgen.UpstreamCommit, and nothing watched it: the pin fell
  # behind Render's Blueprint plan-and-approve rewrite of the deploy skill.
  # Fails while upstream has an unreviewed commit to a skill bex ships.
  render-skills:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
      - name: The skills pack follows render-oss/skills
        run: scripts/render-skills-drift.sh

  # Render's own example Blueprints (w33/001). Each must validate, or fail only
  # for a refusal TestRenderExamplesCorpus lists as deliberate or as a filed
  # gap; anything else is a new class to triage. Nothing ran this opt-in test
  # before, and it went red unseen.
  render-examples:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      # As backend-test.yml: the module on its own go.mod, as the image builds it.
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lego/backend/go.mod
          cache-dependency-path: |
            lego/backend/go.sum
      # The files are third-party: fetched for each run, never vendored. The
      # token reads public repositories at the authenticated rate limit.
      - name: Fetch every render-examples render.yaml
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/render-examples-corpus.sh "$RUNNER_TEMP/render-examples"
      - name: Validate each as a Blueprint
        working-directory: lego/backend
        env:
          BEX_RENDER_EXAMPLES_DIR: ${{ runner.temp }}/render-examples
        run: go test -count=1 -run '^TestRenderExamplesCorpus$' -v ./internal/apps/
