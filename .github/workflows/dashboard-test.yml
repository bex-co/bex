name: test (dashboard)

# Run the dashboard test suite on every push/PR touching dashboard/, and as a
# reusable workflow called by deploy.yml to gate the build+push+deploy job.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-test.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-test.yml"
  workflow_call: {}

permissions:
  contents: read

jobs:
  dashboard:
    # Public-repo safety: fork PR code must never reach persistent self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Enable corepack BEFORE any `yarn` runs: package.json pins
      # packageManager: yarn@4.17.0, and the runner's classic global yarn aborts
      # on that pin ("current global version of Yarn ..."). setup-node's own
      # `cache: yarn` would trip it during cache probing, so we don't use it —
      # we cache Yarn's offline mirror (.yarn/cache) directly instead.
      - name: enable corepack (yarn 4.17.0 per packageManager)
        run: corepack enable
      - name: cache yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dashboard/.yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('dashboard/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: install dependencies
        working-directory: dashboard
        run: yarn install --immutable
      # Dependency vulnerability gate (w7/m65): the dashboard's npm tree gets the
      # gate Go (govulncheck, m62) and images (Trivy, m10) already have. The m10
      # policy is CRITICAL gates / HIGH warns. yarn 4.17's auditor ships inside
      # the corepack-pinned yarn and queries the npm advisory DB (no extra binary
      # to checksum-pin); it exits non-zero when an advisory at/above --severity
      # exists (verified against this yarn.lock). Suppress a non-exploitable
      # CRITICAL only via dashboard/.yarnrc.yml npmAudit{Exclude,Ignore}* with a
      # written justification — never by removing the gate.
      - name: dependency audit (HIGH — report only)
        working-directory: dashboard
        continue-on-error: true
        run: yarn npm audit --all --recursive --severity high
      - name: dependency audit (CRITICAL — gate)
        working-directory: dashboard
        run: yarn npm audit --all --recursive --severity critical
      - name: typecheck + lint + test
        working-directory: dashboard
        run: yarn typecheck && yarn lint && yarn test
      # Production build (w5/034): typecheck+lint+test don't exercise the SSR
      # production bundle, so an SSR-only break (e.g. the @ory/elements-react
      # extensionless-import gotcha, dashboard/CLAUDE.md § SSR gotcha) used to
      # pass PR CI and only surface post-merge in deploy.yml's image build. One
      # step closes the gap pre-merge.
      - name: production build
        working-directory: dashboard
        run: yarn build
