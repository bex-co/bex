name: test (dashboard)

# Run the dashboard test suite on every PR and main push touching its inputs,
# and as a reusable workflow called by deploy.yml to gate the
# build+push+deploy job on the exact commit it deploys.
on:
  pull_request:
    paths:
      - "dashboard/**"
      # Backend files the dashboard's drift guards read. push and pull_request
      # keep one list; scripts/ci_test_inputs.py fails on a read it misses.
      - "docs/render-artifacts/fixtures/render-webhook-vocabulary-*.json"
      - "lego/backend/internal/agentsession/agent-profiles.json"
      - "lego/backend/internal/agentsessions/secrets.go"
      - "lego/backend/internal/apps/testdata/cron-schedule-vectors.json"
      - "lego/backend/internal/core/testdata/config-key-vectors.json"
      - "lego/backend/internal/email/brand_gen.go"
      - "lego/backend/internal/events/service.go"
      - "lego/backend/internal/eventvocab/datastore.go"
      - "lego/backend/internal/keyvalue/status_reason.go"
      - "lego/backend/internal/logs/testdata/display-text-vectors.json"
      - "lego/backend/internal/logs/testdata/lowercase-runs.json"
      - "lego/backend/internal/postgres/service.go"
      - "lego/backend/internal/postgres/testdata/read-replica-name-vectors.json"
      - "lego/backend/internal/pricing/pricing.yaml"
      - "lego/backend/internal/sandbox/service.go"
      - "lego/backend/internal/agentsessions/repo_environment.go"
      - "lego/backend/internal/store/agentsession_pr_state.go"
      - "lego/backend/internal/store/event_facts.go"
      - "lego/types/tiers/tiers.yaml"
      - "lego/types/v1alpha1/testdata/postgres-identifiers.json"
      - "lego/types/v1alpha1/testdata/resource-names.json"
      - ".github/workflows/dashboard-test.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "docs/render-artifacts/fixtures/render-webhook-vocabulary-*.json"
      - "lego/backend/internal/agentsession/agent-profiles.json"
      - "lego/backend/internal/agentsessions/secrets.go"
      - "lego/backend/internal/apps/testdata/cron-schedule-vectors.json"
      - "lego/backend/internal/core/testdata/config-key-vectors.json"
      - "lego/backend/internal/email/brand_gen.go"
      - "lego/backend/internal/events/service.go"
      - "lego/backend/internal/eventvocab/datastore.go"
      - "lego/backend/internal/keyvalue/status_reason.go"
      - "lego/backend/internal/logs/testdata/display-text-vectors.json"
      - "lego/backend/internal/logs/testdata/lowercase-runs.json"
      - "lego/backend/internal/postgres/service.go"
      - "lego/backend/internal/postgres/testdata/read-replica-name-vectors.json"
      - "lego/backend/internal/pricing/pricing.yaml"
      - "lego/backend/internal/sandbox/service.go"
      - "lego/backend/internal/agentsessions/repo_environment.go"
      - "lego/backend/internal/store/agentsession_pr_state.go"
      - "lego/backend/internal/store/event_facts.go"
      - "lego/types/tiers/tiers.yaml"
      - "lego/types/v1alpha1/testdata/postgres-identifiers.json"
      - "lego/types/v1alpha1/testdata/resource-names.json"
      - ".github/workflows/dashboard-test.yml"
  workflow_call: {}

permissions:
  contents: read

# A PR's newer push cancels its superseded run; each main push runs to the
# end, so every code push gets its own verdict. Inside deploy.yml's
# workflow_call `github.workflow` names the caller, so the group uses a fixed
# prefix and the caller's run id: deploy runs never cancel each other's gates.
concurrency:
  group: dashboard-test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dashboard:
    # Public-repo safety (github-actions-validate.sh rule 7): fork PR heads never run this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    # The slowest successful run in the last 40 was 23 min. A starved host once
    # left vitest silent for 47 min after a forks worker would not terminate,
    # holding a deploy gate for most of an hour (w8/m42 t001). Fail it instead.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # w6/m157: .pm is 93% of the tree (board evidence); skip it.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
      # The trigger paths above must cover every file these tests read
      # outside their tree. Only in this workflow's own runs: a gap in the
      # trigger list is no reason to hold deploy.yml's gate.
      - name: trigger paths cover the files the tests read
        if: github.workflow == 'test (dashboard)'
        run: python3 -B scripts/ci_test_inputs.py .github/workflows/dashboard-test.yml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Enable corepack BEFORE any `yarn` runs: package.json pins
      # packageManager: yarn@4.17.0, and the runner's classic global yarn aborts
      # on that pin ("current global version of Yarn ..."). setup-node's own
      # `cache: yarn` would trip it during cache probing, so we don't use it —
      # we cache Yarn's offline mirror (.yarn/cache) directly instead.
      - name: enable corepack (yarn 4.17.0 per packageManager)
        run: corepack enable
      - name: cache yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dashboard/.yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('dashboard/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - name: install dependencies
        working-directory: dashboard
        run: yarn install --immutable
      # Dependency vulnerability gate (w7/m65): the dashboard's npm tree gets the
      # gate Go (govulncheck, m62) and images (Trivy, m10) already have. The m10
      # policy is CRITICAL gates / HIGH warns. yarn 4.17's auditor ships inside
      # the corepack-pinned yarn and queries the npm advisory DB (no extra binary
      # to checksum-pin); it exits non-zero when an advisory at/above --severity
      # exists (verified against this yarn.lock). Suppress a non-exploitable
      # CRITICAL only via dashboard/.yarnrc.yml npmAudit{Exclude,Ignore}* with a
      # written justification — never by removing the gate.
      - name: dependency audit (HIGH — report only)
        working-directory: dashboard
        continue-on-error: true
        run: yarn npm audit --all --recursive --severity high
      - name: dependency audit (CRITICAL — gate)
        working-directory: dashboard
        run: yarn npm audit --all --recursive --severity critical
      - name: typecheck + lint + test
        working-directory: dashboard
        run: yarn typecheck && yarn lint && yarn test
      # Production build (w5/034): typecheck+lint+test don't exercise the SSR
      # production bundle, so an SSR-only break (e.g. the @ory/elements-react
      # extensionless-import gotcha, dashboard/AGENTS.md § SSR gotcha) used to
      # pass PR CI and only surface post-merge in deploy.yml's image build. One
      # step closes the gap pre-merge.
      - name: production build
        working-directory: dashboard
        run: yarn build
      # The built server's cache contract (w4/m348): a missing asset answers
      # 404 no-store, never the HTML shell under an immutable header.
      - name: built server serving contract
        working-directory: dashboard
        run: yarn test:built-server
