name: common Bookworm native image (build + verify)

# One tools/system image, followed by independently selected runtime artifacts.
# Publication never fills the production common-base pin or adopts C images.
on:
  push:
    branches: [main]
    paths:
      - "deploy/native-common/**"
      - "deploy/native-base/**"
      - ".github/workflows/native-common-image.yml"
      - ".github/workflows/native-base-image.yml"
      - ".github/scripts/native-oci-stage.py"
      - ".github/scripts/native-oci-mirror.py"
      - ".github/scripts/test_native_oci_*.py"
      - ".github/scripts/native-common-qualify.py"
      - "scripts/install-syft.py"
      - "scripts/install-trivy.py"
      - "lego/operator/internal/build/native*.go"
      - "lego/operator/internal/build/testdata/native-utilities/**"
  workflow_dispatch:
    inputs:
      profile:
        description: AMD64 family cases after the complete original AMD64 utility cohort; families runs every case on this run's one image
        type: choice
        default: utilities
        options: [utilities, families, node-addon, node, node-donors, modern-python, legacy-python, ruby, go-rust, elixir, native-init]
      case:
        description: Exact allowlisted Go case, or pilot for the profile's first case; families always runs all
        type: string
        default: pilot

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    # Full-repository checkout has taken over seven minutes on these runners.
    # Keep the planning job bounded while allowing setup before validation.
    timeout-minutes: 15
    outputs:
      profile: ${{ steps.selection.outputs.profile }}
      case: ${{ steps.selection.outputs.case }}
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            !/**
            /.github/**
            /deploy/native-base/**
            /deploy/native-common/**
            /lego/operator/internal/build/**
            /lego/operator/cmd/native-init/**
            /lego/operator/internal/execution/**
            /lego/operator/internal/httpclient/**
            /lego/operator/internal/identity/**
            /lego/operator/internal/publish/**
            /lego/operator/internal/registry/**
            /lego/types/deploybudgets/**
            /lego/types/k8sname/**
            /lego/types/netutil/**
            /lego/types/v1alpha1/**
            /lego/operator/go.mod
            /lego/operator/go.sum
            /lego/types/go.mod
            /lego/types/go.sum
            /lego/Dockerfile
            /lego/.dockerignore
            /scripts/lib/toolchain-freshness.py
            /scripts/install-syft.py
      - id: selection
        name: validate the fixed profile and case before publication resources
        env:
          REQUESTED_PROFILE: ${{ inputs.profile || 'utilities' }}
          REQUESTED_CASE: ${{ inputs.case || 'pilot' }}
        run: python3 .github/scripts/native-common-qualify.py plan

  publish:
    needs: plan
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/native-base-image.yml
    with:
      runtime: common-bookworm

  qualify:
    needs: [plan, publish]
    # Qualify the image this run just published.
    if: >-
      ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.plan.result == 'success' &&
          needs.publish.result == 'success' && needs.publish.outputs.ref != '' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arch: [amd64]
    env:
      GOWORK: "off"
      GOMAXPROCS: "2"
      GODEBUG: http2client=0
    steps:
      # Hosted runners ship ~25 GB of preinstalled toolchains this job never
      # uses; free them before the multi-GB image builds, scans and SBOMs.
      - name: free preinstalled toolchains
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # ubuntu-latest enforces a host AppArmor profile for /usr/bin/gs. The
      # docker-container buildkitd is unconfined, so its RUN steps exec gs under
      # that host profile, which refuses the fixture's own files (qa-gs.pdf:
      # "/undefinedfilename ... Permission denied", run 42772567795; reproduced
      # only with the buildx container driver on x64, block-eden-mono w1/068).
      - name: unload the host Ghostscript AppArmor profile
        run: |
          if [ -f /etc/apparmor.d/gs ]; then
            sudo apparmor_parser -R /etc/apparmor.d/gs
          fi
      # Docker 29 on hosted runners defaults to the containerd image store, where
      # an image's ID is its manifest digest; Syft names the config digest, so
      # the SPDX custody binding refused the generated image ("Syft source
      # differs from actual generated Docker config", run 42799028971). The
      # former ARM runners' nested dockerd used the classic overlay2 store, on
      # which the qualification passed. Switch this VM's daemon back before any
      # image exists on it.
      - name: use the classic Docker image store
        run: |
          conf=/etc/docker/daemon.json
          current='{}'
          if [ -s "$conf" ]; then current="$(sudo cat "$conf")"; fi
          jq '.features = ((.features // {}) + {"containerd-snapshotter": false})' <<<"$current" | sudo tee "$conf" >/dev/null
          sudo systemctl restart docker
          driver="$(docker info --format '{{.Driver}}')"
          echo "storage driver: $driver"
          [ "$driver" = overlay2 ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            !/**
            /.github/**
            /deploy/native-base/**
            /deploy/native-common/**
            /lego/operator/internal/build/**
            /lego/operator/cmd/native-init/**
            /lego/operator/internal/execution/**
            /lego/operator/internal/httpclient/**
            /lego/operator/internal/identity/**
            /lego/operator/internal/publish/**
            /lego/operator/internal/registry/**
            /lego/types/deploybudgets/**
            /lego/types/k8sname/**
            /lego/types/netutil/**
            /lego/types/v1alpha1/**
            /lego/operator/go.mod
            /lego/operator/go.sum
            /lego/types/go.mod
            /lego/types/go.sum
            /lego/Dockerfile
            /lego/.dockerignore
            /scripts/lib/toolchain-freshness.py
            /scripts/install-syft.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lego/operator/go.mod
          # Hosted runners start empty; the x64 key is shared with
          # native-backport-acceptance.yml.
          cache-dependency-path: |
            lego/operator/go.sum
            lego/types/go.sum
      - id: owned
        name: record gated inputs and assign ownership before creating resources
        env:
          COMMON_IMAGE: ${{ needs.publish.outputs.ref }}
          PRODUCER_SHA: ${{ needs.publish.outputs.producer }}
          VERIFICATION_SHA: ${{ needs.publish.outputs.verification }}
          QUALIFICATION_PROFILE: utilities
          QUALIFICATION_CASE: all
          TARGET_PLATFORM: linux/${{ matrix.arch }}
        run: python3 .github/scripts/native-common-qualify.py init
      - id: buildkit
        name: pre-pull the pinned BuildKit image with bounded retries
        timeout-minutes: 11
        env:
          QUALIFICATION_ROOT: ${{ steps.owned.outputs.root }}
        run: python3 .github/scripts/native-common-qualify.py bootstrap "$QUALIFICATION_ROOT"
      - id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        timeout-minutes: 5
        with:
          name: ${{ steps.owned.outputs.owner }}
          driver-opts: image=${{ steps.buildkit.outputs.image }}
          use: false
          keep-state: false
          # The action's post cleanup also removes shared certificate files.
          # Our always step removes only the exact assigned builder instead.
          cleanup: false
      - name: Install reviewed Syft with bounded transport retries
        timeout-minutes: 15
        run: python3 scripts/install-syft.py 1.55.0
      - name: actual generated offline builds, original replays and exact-default SPDX
        working-directory: lego/operator
        env:
          BEX_BUILDKIT_INTEGRATION: "1"
          BEX_NATIVE_TEST_COMMON_IMAGE: ${{ needs.publish.outputs.ref }}
          BEX_NATIVE_TEST_BUILDER: ${{ steps.owned.outputs.owner }}
          BEX_NATIVE_TEST_OWNER: ${{ steps.owned.outputs.owner }}
          BEX_NATIVE_TEST_PLATFORM: linux/${{ matrix.arch }}
          BEX_NATIVE_TEST_PREPARE_WHEELS: "1"
          BEX_NATIVE_TEST_SYFT: syft
          BEX_NATIVE_TEST_OUTPUT: ${{ steps.owned.outputs.root }}/generated
        run: |
          set -o pipefail
          go test -p 1 -count=1 -timeout 150m ./internal/build \
            -run '^(TestNativeUtilityGeneratedImages|TestNativeOriginalReplayHTTPOracles)$' -v \
            2>&1 | tee "${{ steps.owned.outputs.root }}/qualification.log"
      - name: record capacity observations before owned cleanup
        timeout-minutes: 1
        if: always() && steps.owned.outputs.root != ''
        env:
          QUALIFICATION_ROOT: ${{ steps.owned.outputs.root }}
        run: python3 .github/scripts/native-common-qualify.py capacity "$QUALIFICATION_ROOT" after-tests
      - name: remove only this job's labeled resources, exact builder and credentials
        if: always() && steps.owned.outputs.root != ''
        timeout-minutes: 5
        env:
          QUALIFICATION_ROOT: ${{ steps.owned.outputs.root }}
          QUALIFICATION_BUILDX_SETUP_OUTCOME: ${{ steps.buildx.outcome }}
        run: python3 .github/scripts/native-common-qualify.py cleanup "$QUALIFICATION_ROOT"
      - name: hash retained successes and failures
        if: always() && steps.owned.outputs.root != ''
        env:
          QUALIFICATION_ROOT: ${{ steps.owned.outputs.root }}
        run: python3 .github/scripts/native-common-qualify.py manifest "$QUALIFICATION_ROOT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.owned.outputs.root != ''
        with:
          name: common-generated-${{ github.sha }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ steps.owned.outputs.root }}
          if-no-files-found: error
          # Only this fresh owned evidence root; render-env secrets stay in
          # Go's separate temporary fixture tree. Preserve the full manifest.
          include-hidden-files: true
          retention-days: 30

  qualify-profile:
    needs: [plan, publish, qualify]
    # The planned family cases, each on the image this run published, after
    # its complete utility cohort passed on that image. A families dispatch
    # runs every case here, so one digest is shown to pass all of them.
    if: >-
      ${{ always() && !cancelled() && github.ref == 'refs/heads/main' &&
          github.event_name == 'workflow_dispatch' && needs.plan.result == 'success' &&
          needs.plan.outputs.profile != 'utilities' && needs.publish.result == 'success' &&
          needs.qualify.result == 'success' && needs.publish.outputs.ref != '' }}
    permissions:
      contents: read
    name: qualify-profile (${{ matrix.leg.profile }}/${{ matrix.leg.case }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.leg.job_minutes }}
    strategy:
      fail-fast: false
      # Each leg is its own hosted VM; leave room for the repository's other CI.
      max-parallel: 8
      matrix:
        arch: [amd64]
        leg: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GOWORK: "off"
      GOMAXPROCS: "2"
      GODEBUG: http2client=0
    steps:
      # Hosted runners ship ~25 GB of preinstalled toolchains this job never
      # uses; free them before the multi-GB image builds, scans and SBOMs.
      - name: free preinstalled toolchains
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # ubuntu-latest enforces a host AppArmor profile for /usr/bin/gs. The
      # docker-container buildkitd is unconfined, so its RUN steps exec gs under
      # that host profile, which refuses the fixture's own files (qa-gs.pdf:
      # "/undefinedfilename ... Permission denied", run 42772567795; reproduced
      # only with the buildx container driver on x64, block-eden-mono w1/068).
      - name: unload the host Ghostscript AppArmor profile
        run: |
          if [ -f /etc/apparmor.d/gs ]; then
            sudo apparmor_parser -R /etc/apparmor.d/gs
          fi
      # Docker 29 on hosted runners defaults to the containerd image store, where
      # an image's ID is its manifest digest; Syft names the config digest, so
      # the SPDX custody binding refused the generated image ("Syft source
      # differs from actual generated Docker config", run 42799028971). The
      # former ARM runners' nested dockerd used the classic overlay2 store, on
      # which the qualification passed. Switch this VM's daemon back before any
      # image exists on it.
      - name: use the classic Docker image store
        run: |
          conf=/etc/docker/daemon.json
          current='{}'
          if [ -s "$conf" ]; then current="$(sudo cat "$conf")"; fi
          jq '.features = ((.features // {}) + {"containerd-snapshotter": false})' <<<"$current" | sudo tee "$conf" >/dev/null
          sudo systemctl restart docker
          driver="$(docker info --format '{{.Driver}}')"
          echo "storage driver: $driver"
          [ "$driver" = overlay2 ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            !/**
            /.github/**
            /deploy/native-base/**
            /deploy/native-common/**
            /lego/operator/internal/build/**
            /lego/operator/cmd/native-init/**
            /lego/operator/internal/execution/**
            /lego/operator/internal/httpclient/**
            /lego/operator/internal/identity/**
            /lego/operator/internal/publish/**
            /lego/operator/internal/registry/**
            /lego/types/deploybudgets/**
            /lego/types/k8sname/**
            /lego/types/netutil/**
            /lego/types/v1alpha1/**
            /lego/operator/go.mod
            /lego/operator/go.sum
            /lego/types/go.mod
            /lego/types/go.sum
            /lego/Dockerfile
            /lego/.dockerignore
            /scripts/lib/toolchain-freshness.py
            /scripts/install-syft.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lego/operator/go.mod
          # Hosted runners start empty; the x64 key is shared with
          # native-backport-acceptance.yml.
          cache-dependency-path: |
            lego/operator/go.sum
            lego/types/go.sum
      - name: export only the validated single-case profile environment
        env:
          QUALIFICATION_PROFILE: ${{ matrix.leg.profile }}
          QUALIFICATION_CASE: ${{ matrix.leg.case }}
        run: python3 .github/scripts/native-common-qualify.py profile-env
      - id: owned
        name: record gated inputs and assign ownership before creating resources
        env:
          COMMON_IMAGE: ${{ needs.publish.outputs.ref }}
          PRODUCER_SHA: ${{ needs.publish.outputs.producer }}
          VERIFICATION_SHA: ${{ needs.publish.outputs.verification }}
          TARGET_PLATFORM: linux/${{ matrix.arch }}
        run: python3 .github/scripts/native-common-qualify.py init
      - id: buildkit
        name: pre-pull the pinned BuildKit image with bounded retries
        timeout-minutes: 11
        env:
          QUALIFICATION_ROOT: ${{ steps.owned.outputs.root }}
        run: python3 .github/scripts/native-common-qualify.py bootstrap "$QUALIFICATION_ROOT"
      - id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        timeout-minutes: 5
        with:
          name: ${{ steps.owned.outputs.owner }}
          driver-opts: image=${{ steps.buildkit.outputs.image }}
          use: false
          keep-state: false
          # The action's post cleanup also removes shared certificate files.
          # Our always step removes only the exact assigned builder instead.
          cleanup: false
      - name: measure the selected family case without claiming full-family acceptance
        working-directory: lego/operator
        env:
          BEX_NATIVE_TEST_COMMON_IMAGE: ${{ needs.publish.outputs.ref }}
          BEX_NATIVE_TEST_BUILDER: ${{ steps.owned.outputs.owner }}
          BEX_NATIVE_TEST_OWNER: ${{ steps.owned.outputs.owner }}
          BEX_NATIVE_TEST_PLATFORM: linux/${{ matrix.arch }}
          BEX_NATIVE_TEST_OUTPUT: ${{ steps.owned.outputs.root }}/generated
          QUALIFICATION_ROOT: ${{ steps.owned.outputs.root }}
        run: |
          set -o pipefail
          go test -p 1 -count=1 -timeout "$QUALIFICATION_GO_TIMEOUT" ./internal/build \
            -run "$QUALIFICATION_SELECTOR" -v \
            2>&1 | tee "$QUALIFICATION_ROOT/qualification.log"
      - name: record capacity observations before owned cleanup
        timeout-minutes: 1
        if: always() && steps.owned.outputs.root != ''
        env:
          QUALIFICATION_ROOT: ${{ steps.owned.outputs.root }}
        run: python3 .github/scripts/native-common-qualify.py capacity "$QUALIFICATION_ROOT" after-tests
      - name: remove only this job's labeled resources, exact builder and credentials
        if: always() && steps.owned.outputs.root != ''
        timeout-minutes: 5
        env:
          QUALIFICATION_ROOT: ${{ steps.owned.outputs.root }}
          QUALIFICATION_BUILDX_SETUP_OUTCOME: ${{ steps.buildx.outcome }}
        run: python3 .github/scripts/native-common-qualify.py cleanup "$QUALIFICATION_ROOT"
      - name: hash retained successes and failures
        if: always() && steps.owned.outputs.root != ''
        env:
          QUALIFICATION_ROOT: ${{ steps.owned.outputs.root }}
        run: python3 .github/scripts/native-common-qualify.py manifest "$QUALIFICATION_ROOT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.owned.outputs.root != ''
        with:
          name: common-family-${{ matrix.leg.profile }}-${{ matrix.leg.case }}-${{ github.sha }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ steps.owned.outputs.root }}
          if-no-files-found: error
          # Only this fresh owned evidence root; render-env secrets stay in
          # Go's separate temporary fixture tree. Preserve the full manifest.
          include-hidden-files: true
          retention-days: 30

  common-arm64-local:
    # D3: one local-development variant, never a runtime-family/production gate.
    needs: plan
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    timeout-minutes: 180
    concurrency:
      group: native-common-arm64-local
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.pm/
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to GHCR with bounded transport retries
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if printf '%s' "$GHCR_TOKEN" | timeout 60s docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin; then
              exit 0
            fi
            [ "$attempt" -lt 3 ] || exit 1
            sleep "$((attempt * 5))"
          done
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy
          file: deploy/native-common/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          cache-from: type=registry,ref=ghcr.io/bex-co/bex-cnb-run:native-common-bookworm-arm64-local
          cache-to: type=inline
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            co.bex.native-scope=local-arm64-unqualified-for-production
          tags: ghcr.io/bex-co/bex-cnb-run:native-common-bookworm-arm64-local-candidate-${{ github.sha }}
      - name: check common ARM64 startup and core tools only
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/native-common
          file: deploy/native-common/check-local.Dockerfile
          platforms: linux/arm64
          push: false
          no-cache: true
          provenance: false
          sbom: false
          build-args: COMMON_IMAGE=ghcr.io/bex-co/bex-cnb-run@${{ steps.build.outputs.digest }}
      - name: expose only the lightly checked local ARM64 variant
        env:
          LOCAL_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$LOCAL_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          ref="ghcr.io/bex-co/bex-cnb-run@$LOCAL_DIGEST"
          docker buildx imagetools create --tag ghcr.io/bex-co/bex-cnb-run:native-common-bookworm-arm64-local "$ref"
          echo "D3 LOCAL ARM64 ONLY: $ref; startup/core tools checked; no full scan, SBOM, signature, runtime-family or production approval" >> "$GITHUB_STEP_SUMMARY"
      - name: record local ARM64 failure without changing production admission
        if: failure()
        run: echo 'D3 local ARM64 variant failed or is unproved; no local discovery update or production approval claimed' >> "$GITHUB_STEP_SUMMARY"
      - name: remove GHCR credentials
        if: always()
        run: docker logout ghcr.io
