name: CloudNativePG operator image (build + verify)

# Publishes bex's CloudNativePG operator (w21/m606, docs/ADR092 § The
# CloudNativePG build): the release deploy/cnpg-operator/UPSTREAM names plus
# every deploy/cnpg-operator/patches/*.patch. The Dockerfile fails the build
# when the release tag no longer names UPSTREAM's commit, when a patch no
# longer applies, or when the patched packages' tests fail.
#
# This workflow publishes; it never pins. Adopting a digest is a reviewed
# commit to deploy/gitops/base/cnpg-operator.yaml, after the restart test runs
# against it on a real CloudNativePG (w21/m606 t003). Production's in-place
# instance-manager updates then move every managed cluster onto the new
# binary without a PostgreSQL restart. The tag lives in the public
# bex-operator package beside the operand and CSI images.

on:
  push:
    branches: [main]
    paths:
      - "deploy/cnpg-operator/**"
      - ".github/workflows/cnpg-operator-image.yml"
      - "scripts/install-syft.py"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cnpg-operator-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bex-co/bex-operator

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    # Upstream's module download, the patched packages' tests, two
    # cross-compiles, the push and the signature; new job, budget unmeasured.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            deploy/cnpg-operator
            scripts
          persist-credentials: false
      - id: recipe
        run: |
          . deploy/cnpg-operator/UPSTREAM
          # The runtime image is the same release UPSTREAM patches.
          grep -Eq "^FROM ghcr\.io/cloudnative-pg/cloudnative-pg:${CNPG_VERSION//./\\.}@sha256:[0-9a-f]{64}$" deploy/cnpg-operator/Dockerfile \
            || { echo "Dockerfile's runtime image is not CloudNativePG $CNPG_VERSION by digest" >&2; exit 1; }
          {
            echo "version=$CNPG_VERSION-bex.$BEX_REVISION"
            echo "commit=${CNPG_COMMIT:0:9}-bex.$BEX_REVISION"
            echo "tag=cnpg-$CNPG_VERSION-bex.$BEX_REVISION-$GITHUB_SHA"
            echo "upstream=$CNPG_VERSION"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Production nodes are linux/amd64; local CAPD clusters on Apple silicon
      # are linux/arm64. Both images carry both binaries, built once on this
      # runner, so the amd64 image needs no emulation.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/cnpg-operator
          file: deploy/cnpg-operator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.recipe.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ steps.recipe.outputs.tag }}
      # What was published: both platforms, each carrying both architectures'
      # binaries of the bex build, and the arm64 one reporting the release
      # version and the bex commit suffix. Each platform is read by its own
      # manifest digest: Docker refuses a second platform of one index digest.
      - name: verify the published image
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          UPSTREAM: ${{ steps.recipe.outputs.upstream }}
          COMMIT: ${{ steps.recipe.outputs.commit }}
        run: |
          index=$(docker buildx imagetools inspect --raw "$REF")
          platforms=$(jq -r '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort | join(",")' <<<"$index")
          [ "$platforms" = "amd64,arm64" ] || { echo "published platforms: $platforms" >&2; exit 1; }
          for platform in amd64 arm64; do
            manifest=$(jq -er --arg arch "$platform" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' <<<"$index")
            docker create --name "cnpg-operator-$platform" "$IMAGE@$manifest" >/dev/null
            docker cp "cnpg-operator-$platform:/operator" "$RUNNER_TEMP/operator-$platform"
            docker rm "cnpg-operator-$platform" >/dev/null
            for arch in amd64 arm64; do
              grep -qa -- "$COMMIT" "$RUNNER_TEMP/operator-$platform/manager_$arch" \
                || { echo "the $platform image's manager_$arch is not the bex build" >&2; exit 1; }
            done
            if [ "$platform" = arm64 ]; then
              version=$(docker run --rm "$IMAGE@$manifest" version)
              echo "$version"
              case "$version" in
                *"Version:$UPSTREAM Commit:$COMMIT "*) ;;
                *) echo "manager version does not report $UPSTREAM and $COMMIT" >&2; exit 1 ;;
              esac
            fi
          done
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Install reviewed Syft with bounded transport retries
        timeout-minutes: 15
        run: python3 scripts/install-syft.py 1.55.0
      - name: sign image and attest SBOM
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          TAG: ${{ env.IMAGE }}:${{ steps.recipe.outputs.tag }}
        run: |
          cosign sign --yes --oidc-provider=github-actions "$REF"
          syft "$REF" -o spdx-json > "$RUNNER_TEMP/sbom.spdx.json"
          cosign attest --yes --oidc-provider=github-actions --type spdxjson --predicate "$RUNNER_TEMP/sbom.spdx.json" "$REF"
          echo "Published \`${TAG}@${REF#*@}\` — pin it in deploy/gitops/base/cnpg-operator.yaml (image.repository + image.tag) once the restart test passes against it." >> "$GITHUB_STEP_SUMMARY"
