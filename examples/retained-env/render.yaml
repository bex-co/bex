# render.yaml — the first of two manifests that show a variable a Blueprint
# dropped (w21/103). It declares three variables to be dropped (MESSAGE, EXTRA,
# CLICKME) and two to keep (KEEPME, WHOAMI_PORT_NUMBER) on one prebuilt-image
# service. Create a Blueprint on this file, sync, then point the Blueprint at
# dropped.yaml and sync again: the three dropped variables stay on the service
# with their values, as on Render ("Render preserves existing environment
# variables, even if you omit them from the Blueprint file"), and edit and
# delete as ordinary variables. Delete the service afterwards.
services:
  - name: retained-env
    type: web
    runtime: image
    image:
      url: traefik/whoami
    plan: free
    envVars:
      - key: WHOAMI_PORT_NUMBER
        value: "10000"
      - key: KEEPME
        value: "1"
      - key: MESSAGE
        value: hello from the manifest
      - key: EXTRA
        value: extra from the manifest
      - key: CLICKME
        value: click from the manifest
