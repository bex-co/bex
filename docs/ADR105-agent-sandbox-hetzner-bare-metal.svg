<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1430" viewBox="0 0 1480 1430" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
<rect width="1480" height="1430" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<style>
.t{font-weight:600;font-size:14px} .s{fill:#57606a;font-size:12px} .m{font-size:12px}
.lane{font-weight:700;font-size:12px;letter-spacing:.08em;fill:#57606a}
.ln{stroke:#57606a;stroke-width:1.6;fill:none;marker-end:url(#a)}
.both{stroke:#57606a;stroke-width:1.6;fill:none;marker-end:url(#a);marker-start:url(#a)}
.dash{stroke-dasharray:6 4}
.ext{fill:#f6f8fa;stroke:#8c959f} .proc{fill:#ddf4ff;stroke:#54aeff} .fs{fill:#dafbe1;stroke:#4ac26b}
.gv{fill:#ffe8d1;stroke:#fb8f44} .pend{fill:#f0fff4;stroke:#4ac26b;stroke-dasharray:6 3} .bad{fill:#ffebe9;stroke:#ff8182}
rect.b{stroke-width:1.5;rx:8}
</style></defs>

<text x="20" y="34" font-size="20" font-weight="700">ADR105 — the agent sandbox today, and the layers the proposal replaces</text>
<text x="20" y="56" class="s">Inside of the pod as observed in session ags-dbqdl84o6rds73e87pj0 on 2026-11-12. Everything outside the pod is abstracted; ADR042, ADR047 and ADR090 own those parts.</text>

<!-- left column: control plane -->
<text x="20" y="84" class="lane">CONTROL PLANE</text>
<rect class="b ext" x="20" y="92" width="250" height="70"/>
<text x="34" y="116" class="t">Clients</text>
<text x="34" y="136" class="s">dashboard, CLI, MCP, automations</text>

<rect class="b ext" x="20" y="200" width="250" height="150"/>
<text x="34" y="224" class="t">bex-api</text>
<text x="34" y="246" class="s">creates the session and its sandbox</text>
<text x="34" y="264" class="s">injects the driver environment,</text>
<text x="34" y="282" class="s">including the turn timeout (4h)</text>
<text x="34" y="300" class="s">meters allocated 2 vCPU / 4 GiB</text>
<text x="34" y="318" class="s">reads status, stores the transcript,</text>
<text x="34" y="336" class="s">reclaims the sandbox when done</text>

<rect class="b ext" x="20" y="400" width="250" height="90"/>
<text x="34" y="424" class="t">OpenSandbox controller</text>
<text x="34" y="446" class="s">turns a sandbox request into a Pod</text>
<text x="34" y="464" class="s">pause = commit rootfs to an image</text>

<rect class="b ext" x="20" y="540" width="250" height="80"/>
<text x="34" y="564" class="t">Zot registry</text>
<text x="34" y="586" class="s">agent image, rootfs snapshots</text>

<path class="ln" d="M145,162 L145,198"/>
<path class="ln" d="M145,350 L145,398"/>
<path class="ln" d="M270,445 L298,445"/>
<path class="ln dash" d="M270,580 L298,580"/>

<!-- node -->
<rect x="300" y="72" width="860" height="950" fill="#fbfcfd" stroke="#8c959f" stroke-width="1.5" rx="10"/>
<text x="320" y="96" class="lane">SANDBOX NODE — Hetzner Cloud cx33, 4 shared vCPU / 8 GB, tainted bex.co/sandbox, no /dev/kvm</text>
<rect class="b ext" x="320" y="108" width="820" height="40"/>
<text x="334" y="133" class="m"><tspan font-weight="600">containerd + runsc shim</tspan> — gVisor installed at node bootstrap; host kernel 6.8, host disk 75 GB shared by every sandbox on the node</text>

<!-- pod -->
<rect x="320" y="164" width="820" height="842" fill="#ffffff" stroke="#54aeff" stroke-width="2" rx="10"/>
<text x="340" y="188" class="lane">POD — namespace &lt;workspace&gt;-sandbox, runtimeClassName gvisor, limits 2 vCPU / 4 GiB, no swap</text>

<rect class="b gv" x="340" y="200" width="780" height="70"/>
<text x="354" y="224" class="t">gVisor Sentry — a user-space kernel between the processes and the host</text>
<text x="354" y="244" class="m">systrap platform: every system call is intercepted in software. Reports "Linux 4.19.0-gvisor".</text>
<text x="354" y="262" class="m">netstack: the pod's own TCP/IP stack; all traffic leaves through it under the Cilium egress policy.</text>

<text x="340" y="296" class="lane">PROCESSES — all run as uid 10001 (bex)</text>

<rect class="b proc" x="340" y="306" width="360" height="52"/>
<text x="354" y="328" class="t">execd  (/opt/opensandbox/execd)</text>
<text x="354" y="346" class="s">runs exec, file copy and SSH shells on request</text>

<rect class="b proc" x="740" y="306" width="380" height="52"/>
<text x="754" y="328" class="t">PID 1  bootstrap.sh</text>
<text x="754" y="346" class="s">starts execd, then the driver</text>

<rect class="b proc" x="740" y="382" width="380" height="150"/>
<text x="754" y="406" class="t">bex-agent-driver  (Node.js, port 8787)</text>
<text x="754" y="428" class="m">setup: clone the repo, check out bex-agent/&lt;id&gt;</text>
<text x="754" y="446" class="m">owns one ACP agent; sends the prompt as one turn</text>
<text x="754" y="464" class="m">turn timer: aborts at BEX_AGENT_TURN_TIMEOUT_MS</text>
<text x="754" y="482" class="m">after the turn: checks git for undelivered work</text>
<text x="754" y="500" class="m">writes the status file and the JSONL transcript</text>
<text x="754" y="518" class="s">GET /stream, POST /turn (signed grant only)</text>

<rect class="b proc" x="340" y="382" width="360" height="62"/>
<text x="354" y="406" class="t">claude-agent-acp  (Node.js)</text>
<text x="354" y="426" class="s">ACP adapter; Codex and Gemini adapters also in the image</text>

<rect class="b proc" x="340" y="468" width="360" height="64"/>
<text x="354" y="492" class="t">claude  (Claude Code CLI)</text>
<text x="354" y="512" class="s">the agent loop; model calls use a placeholder key</text>

<path class="ln" d="M930,358 L930,380"/>
<path class="both" d="M740,413 L702,413"/>
<text x="704" y="404" class="s">ACP</text>
<path class="ln" d="M520,444 L520,466"/>

<rect class="b proc" x="340" y="562" width="240" height="66"/>
<text x="354" y="586" class="t">MCP: bex</text>
<text x="354" y="606" class="s">open_or_update_draft_pr</text>

<rect class="b proc" x="600" y="562" width="240" height="66"/>
<text x="614" y="586" class="t">MCP: playwright</text>
<text x="614" y="606" class="s">Chromium; started in every session</text>

<rect class="b proc" x="860" y="562" width="260" height="66"/>
<text x="874" y="586" class="t">tool subprocesses</text>
<text x="874" y="606" class="s">bash → git, go build/test, tsc, yarn</text>

<path class="ln" d="M440,532 L440,560"/>
<path class="ln" d="M560,532 L700,560"/>
<path class="ln" d="M660,532 L940,560"/>

<text x="340" y="656" class="lane">FILESYSTEM — one root filesystem; every open, read and write crosses the gofer</text>

<rect class="b gv" x="340" y="666" width="780" height="46"/>
<text x="354" y="694" class="m"><tspan font-weight="600">gVisor gofer</tspan> — file proxy for the rootfs (9p, directfs). overlay2 = none, so writes go through it to the node's disk, not to memory.</text>

<rect class="b fs" x="340" y="726" width="250" height="100"/>
<text x="354" y="750" class="t">/workspace</text>
<text x="354" y="770" class="s">repo checkout on bex-agent/&lt;id&gt;</text>
<text x="354" y="788" class="s">about 67,000 files for bex-co/bex</text>
<text x="354" y="806" class="s">node_modules installed per session</text>

<rect class="b fs" x="605" y="726" width="250" height="100"/>
<text x="619" y="750" class="t">/home/bex</text>
<text x="619" y="770" class="s">.cache/go-build: empty at start</text>
<text x="619" y="788" class="s">go/pkg/mod: downloaded per session</text>
<text x="619" y="806" class="s">.claude: CLI state, shell snapshots</text>

<rect class="b fs" x="870" y="726" width="250" height="100"/>
<text x="884" y="750" class="t">/tmp and session state</text>
<text x="884" y="770" class="s">background-task output files</text>
<text x="884" y="788" class="s">status file, pull-request.json</text>
<text x="884" y="806" class="s">/attachments when files are attached</text>

<rect class="b bad" x="340" y="846" width="780" height="144"/>
<text x="354" y="870" class="t">Measured inside this pod while a routine was building (ADR105 § Context)</text>
<text x="354" y="894" class="m">Start a process: about 66 ms each (300 in 19.9 s). A Go build starts thousands.</text>
<text x="354" y="914" class="m">Read a small file: about 7.5 ms each (3,000 in 22.6 s). Create one: about 5.5 ms.</text>
<text x="354" y="934" class="m">Sequential write: 200 MB in 2.0 s. Bulk I/O is fine; the cost is per system call and per file open.</text>
<text x="354" y="954" class="m">CPU: 1.68 of 2 cores used on average over 54 minutes; 0.8 GB of 4 GB memory left at the end.</text>
<text x="354" y="974" class="m">Result: one "go build ./..." took 5 to 8 minutes, and the routine could not finish in 30.</text>

<!-- right column: data plane -->
<text x="1190" y="84" class="lane">OUTSIDE THE POD</text>
<rect class="b ext" x="1190" y="200" width="270" height="230"/>
<text x="1204" y="224" class="t">bex ssh-gateway</text>
<text x="1204" y="248" class="m" font-weight="600">Model proxy</text>
<text x="1204" y="266" class="s">swaps in the real key; enforces the</text>
<text x="1204" y="284" class="s">model pin and request budgets</text>
<text x="1204" y="308" class="m" font-weight="600">Git proxy</text>
<text x="1204" y="326" class="s">mints a repo-scoped GitHub token;</text>
<text x="1204" y="344" class="s">only bex-agent/* can be pushed</text>
<text x="1204" y="368" class="m" font-weight="600">Driver channel and SSH</text>
<text x="1204" y="386" class="s">only identity allowed to reach :8787;</text>
<text x="1204" y="404" class="s">live stream, steer, editor SSH</text>

<rect class="b ext" x="1190" y="470" width="128" height="60"/>
<text x="1204" y="494" class="t">Model</text>
<text x="1204" y="514" class="s">OpenRouter</text>
<rect class="b ext" x="1332" y="470" width="128" height="60"/>
<text x="1346" y="494" class="t">GitHub</text>
<text x="1346" y="514" class="s">clone, push, PR</text>

<rect class="b ext" x="1190" y="590" width="270" height="110"/>
<text x="1204" y="614" class="t">Package registries</text>
<text x="1204" y="636" class="s">Cilium FQDN allowlist per workspace:</text>
<text x="1204" y="654" class="s">npm, Go proxy, PyPI, crates, Docker Hub,</text>
<text x="1204" y="672" class="s">plus custom hosts on the custom tier.</text>
<text x="1204" y="690" class="s">Everything else is denied.</text>

<path class="ln" d="M1142,236 L1188,236"/>
<text x="1165" y="228" class="s" text-anchor="middle">HTTPS</text>
<path class="both" d="M1120,440 L1164,440 L1164,400 L1188,400"/>
<path class="ln" d="M1254,430 L1254,468"/>
<path class="ln" d="M1396,430 L1396,468"/>
<path class="ln dash" d="M1140,645 L1188,645"/>

<!-- what the proposal changes -->
<rect x="10" y="1040" width="1460" height="380" fill="#f6fbff" rx="10"/>
<text x="20" y="1066" class="lane">WHAT ADR105 CHANGES — only the layers under the pod's processes</text>
<text x="320" y="1082" class="s" font-weight="600">TODAY</text>
<text x="780" y="1082" class="s" font-weight="600">PROPOSED</text>
<text x="34" y="1124" class="t">Node</text>
<rect class="b ext" x="300" y="1088" width="410" height="62"/>
<text x="314" y="1113" class="t">Hetzner Cloud cx33</text><text x="314" y="1134" class="s">4 shared vCPU / 8 GB, no /dev/kvm</text>
<path class="ln" d="M710,1119 L758,1119"/>
<rect class="b fs" x="760" y="1088" width="700" height="62"/>
<text x="774" y="1113" class="t">Hetzner dedicated EX44</text><text x="774" y="1134" class="s">20 threads / 64 GB, KVM available; at most 12 agent sandboxes to start</text>
<text x="34" y="1202" class="t">Isolation layer</text>
<rect class="b gv" x="300" y="1166" width="410" height="62"/>
<text x="314" y="1191" class="t">gVisor Sentry</text><text x="314" y="1212" class="s">system calls intercepted in user space; about 66 ms to start a process</text>
<path class="ln" d="M710,1197 L758,1197"/>
<rect class="b pend" x="760" y="1166" width="700" height="62"/>
<text x="774" y="1191" class="t">Kata microVM per sandbox</text><text x="774" y="1212" class="s">a real Linux guest kernel under hardware virtualisation; VMM undecided (Firecracker, Cloud Hypervisor or QEMU)</text>
<text x="34" y="1280" class="t">File path</text>
<rect class="b gv" x="300" y="1244" width="410" height="62"/>
<text x="314" y="1269" class="t">gVisor gofer</text><text x="314" y="1290" class="s">file proxy to the node disk; about 7.5 ms to read a small file</text>
<path class="ln" d="M710,1275 L758,1275"/>
<rect class="b pend" x="760" y="1244" width="700" height="62"/>
<text x="774" y="1269" class="t">Guest block device or virtio-fs</text><text x="774" y="1290" class="s">follows the VMM choice; measured at the step 3 gate</text>
<text x="34" y="1358" class="t">Scheduling</text>
<rect class="b ext" x="300" y="1322" width="410" height="62"/>
<text x="314" y="1347" class="t">One cloud node</text><text x="314" y="1368" class="s">every agent sandbox lands on it</text>
<path class="ln" d="M710,1353 L758,1353"/>
<rect class="b fs" x="760" y="1322" width="700" height="62"/>
<text x="774" y="1347" class="t">Bare metal first, cloud as overflow</text><text x="774" y="1368" class="s">the agent template prefers the EX44; the gVisor cloud node stays as fallback</text>
<text x="20" y="1408" class="s">Unchanged: the processes and file layout inside the pod, bex-api, OpenSandbox (same RuntimeClass seam), the ssh-gateway and the egress policy. Dashed boxes are decided by measurement, not by this ADR.</text>
</svg>
