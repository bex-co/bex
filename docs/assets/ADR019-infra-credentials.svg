<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ADR019 — Bootstrap credential trust chain: the bex SSH key reaches a control-plane node, whose admin.conf gives the app admin kubeconfig, which reaches the app cluster kube-API, which exposes the CAPI PKI secrets, whose bex-ca key can mint any new app certificate</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .h { font-size: 15px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #4b5563; text-anchor: middle; }
      .flow { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .lbl { font-size: 12px; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .tag { font-size: 12px; font-weight: 700; fill: #dc2626; letter-spacing: 0.4px; }
      .control { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
      .reconcile { fill: #fffbeb; stroke: #d97706; stroke-width: 1.6; }
      .runtime { fill: #ecfdf5; stroke: #059669; stroke-width: 1.6; }
      .deny { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.6; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="899" rx="14" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="40" y="50" font-size="22" font-weight="700" fill="#111827">ADR019 — The trust chain</text>
  <text x="40" y="74" font-size="13" fill="#4b5563">Each hop grants the next. The chain has no branch: the bex SSH key is the root of trust.</text>

  <!-- 1 -->
  <rect class="deny" x="230" y="104" width="440" height="64" rx="10"/>
  <text class="h" x="450" y="130">bex (SSH private key)</text>
  <text class="m" x="450" y="152">~/.ssh/bex + GitHub secret BEX_SSH_PRIVATE_KEY</text>
  <text class="tag" x="216" y="141" text-anchor="end">ROOT OF TRUST</text>

  <!-- 2 -->
  <rect class="runtime" x="230" y="244" width="440" height="64" rx="10"/>
  <text class="h" x="450" y="281">control-plane node</text>

  <!-- 3 -->
  <rect class="control" x="230" y="384" width="440" height="64" rx="10"/>
  <text class="h" x="450" y="410">app admin kubeconfig</text>
  <text class="m" x="450" y="432">CN=kubernetes-admin, O=system:masters</text>

  <!-- 4 -->
  <rect class="control" x="230" y="524" width="440" height="64" rx="10"/>
  <text class="h" x="450" y="561">app cluster kube-API</text>

  <!-- 5 -->
  <rect class="reconcile" x="230" y="664" width="440" height="64" rx="10"/>
  <text class="h" x="450" y="690">CAPI PKI secrets (in-cluster)</text>
  <text class="m" x="450" y="712">bex-kubeconfig, bex-ca, bex-etcd, bex-proxy, bex-sa</text>

  <!-- 6 -->
  <rect class="deny" x="230" y="804" width="440" height="64" rx="10"/>
  <text class="h" x="450" y="830">mint ANY new app cert</text>
  <text class="m" x="450" y="852">(revocation-proof)</text>

  <!-- Edges -->
  <path class="flow" d="M450,168 L450,242"/>
  <text class="lbl" x="462" y="210">ssh :22 (CP node, IP via hcloud API)</text>

  <path class="flow" d="M450,308 L450,382"/>
  <text class="lbl" x="462" y="350">/etc/kubernetes/admin.conf</text>

  <path class="flow" d="M450,448 L450,522"/>
  <text class="lbl" x="462" y="490">kubectl :443 (apiserver LB) → CP :6443</text>

  <path class="flow" d="M450,588 L450,662"/>
  <text class="lbl" x="462" y="630">read CAPI secrets (bex-capi ns)</text>

  <path class="flow" d="M450,728 L450,802"/>
  <text class="lbl" x="462" y="770">bex-ca (CA key)</text>
</svg>
