<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ADR016 — Sealed Secrets: the operator seals a credential with kubeseal and the public key, the SealedSecret is committed to git, Argo CD applies it, the in-cluster controller decrypts it with a private key that never leaves the cluster, and the resulting Secret is consumed by a pod</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .h { font-size: 15px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .s { font-size: 12px; fill: #6b7280; text-anchor: middle; }
      .flow { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .lbl { font-size: 12px; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .actor { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
      .external { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.6; }
      .control { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
      .reconcile { fill: #fffbeb; stroke: #d97706; stroke-width: 1.6; }
      .runtime { fill: #ecfdf5; stroke: #059669; stroke-width: 1.6; }
      .security { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.6; }
      .icon { fill: none; stroke: #475569; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="399" rx="14" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="40" y="50" font-size="22" font-weight="700" fill="#111827">Sealed Secrets</text>
  <text x="40" y="74" font-size="13" fill="#4b5563">Credentials are sealed with the controller's public key, committed to git, and decrypted only inside the cluster.</text>

  <!-- Row 1: seal and commit -->
  <rect class="actor" x="25" y="120" width="210" height="66" rx="10"/>
  <circle class="icon" cx="62" cy="146" r="5"/>
  <path class="icon" d="M52,163 a10,8 0 0 1 20,0"/>
  <text class="h" x="140" y="148">operator</text>
  <text class="s" x="140" y="168">laptop / CI</text>

  <rect class="external" x="395" y="120" width="210" height="66" rx="10"/>
  <text class="h" x="500" y="148">SealedSecret YAML</text>
  <text class="s" x="500" y="168">encrypted, committed to git</text>

  <rect class="reconcile" x="765" y="120" width="210" height="66" rx="10"/>
  <text class="h" x="870" y="158">Argo CD</text>

  <!-- Row 2: decrypt and consume -->
  <rect class="security" x="765" y="290" width="210" height="66" rx="10"/>
  <text class="h" x="870" y="318">sealed-secrets controller</text>
  <text class="s" x="870" y="338">kube-system</text>

  <rect class="control" x="395" y="290" width="210" height="66" rx="10"/>
  <text class="h" x="500" y="318">Secret</text>
  <text class="s" x="500" y="338">real, in-namespace</text>

  <rect class="runtime" x="25" y="290" width="210" height="66" rx="10"/>
  <text class="h" x="130" y="318">consuming pod</text>
  <text class="s" x="130" y="338">operator / backup CronJob / …</text>

  <!-- Edges -->
  <path class="flow" d="M235,153 L393,153"/>
  <text class="lbl" x="315" y="144" text-anchor="middle">scripts/seal-secret.sh</text>
  <text class="lbl" x="315" y="171" text-anchor="middle">(kubeseal + public key)</text>

  <path class="flow" d="M605,153 L763,153"/>
  <text class="lbl" x="685" y="144" text-anchor="middle">git</text>

  <path class="flow" d="M870,186 L870,288"/>
  <text class="lbl" x="882" y="241">applies</text>

  <path class="flow" d="M765,323 L607,323"/>
  <text class="lbl" x="685" y="314" text-anchor="middle">decrypts with private key</text>
  <text class="lbl" x="685" y="341" text-anchor="middle">(never leaves the cluster)</text>

  <path class="flow" d="M395,323 L237,323"/>
</svg>
