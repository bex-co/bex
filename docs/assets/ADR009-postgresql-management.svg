<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ADR009 — Managed Postgres: a Database resource projects to a CNPG Cluster in the tenant namespace, which creates the cluster-rw Service and the credential Secret; tenant Apps use the internal URL through the Service, and external clients use the external URL through the Postgres-aware SNI proxy</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .h { font-size: 15px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .s { font-size: 12px; fill: #6b7280; text-anchor: middle; }
      .flow { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .actor { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
      .control { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
      .reconcile { fill: #fffbeb; stroke: #d97706; stroke-width: 1.6; }
      .runtime { fill: #ecfdf5; stroke: #059669; stroke-width: 1.6; }
      .external { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.6; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="399" rx="14" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="30" y="50" font-size="22" font-weight="700" fill="#111827">ADR009 — Managed Postgres</text>
  <text x="30" y="74" font-size="13" fill="#4b5563">A Database resource becomes a CNPG Cluster in the tenant namespace, reachable by two URLs over two network paths.</text>

  <!-- Row 1: resource to internal URL -->
  <rect class="control" x="30" y="110" width="205" height="80" rx="10"/>
  <text class="h" x="132.5" y="136">Database resource</text>
  <text class="s" x="132.5" y="156">control plane ·</text>
  <text class="s" x="132.5" y="172">plan/version/storage</text>

  <rect class="runtime" x="275" y="110" width="205" height="80" rx="10"/>
  <text class="h" x="377.5" y="144">CNPG Cluster</text>
  <text class="s" x="377.5" y="164">tenant namespace</text>

  <rect class="runtime" x="520" y="110" width="205" height="80" rx="10"/>
  <text class="h" x="622.5" y="144">cluster-rw Service</text>
  <text class="s" x="622.5" y="164">ClusterIP, in-cluster</text>

  <rect class="runtime" x="765" y="110" width="205" height="80" rx="10"/>
  <text class="h" x="867.5" y="144">tenant App</text>
  <text class="s" x="867.5" y="164">uses INTERNAL url</text>

  <!-- Row 2: credentials and external URL -->
  <rect class="runtime" x="275" y="240" width="205" height="80" rx="10"/>
  <text class="h" x="377.5" y="274">Secret</text>
  <text class="s" x="377.5" y="294">user + password</text>

  <rect class="reconcile" x="520" y="240" width="205" height="80" rx="10"/>
  <text class="h" x="622.5" y="266">Postgres-aware SNI proxy</text>
  <text class="s" x="622.5" y="286">TLS passthrough +</text>
  <text class="s" x="622.5" y="302">response meter · :5432</text>

  <rect class="external" x="765" y="240" width="205" height="80" rx="10"/>
  <text class="h" x="867.5" y="266">external client</text>
  <text class="s" x="867.5" y="286">uses EXTERNAL url ·</text>
  <text class="s" x="867.5" y="302">TLS, system roots</text>

  <!-- Edges -->
  <path class="flow" d="M235,150 L273,150"/>
  <path class="flow" d="M480,150 L518,150"/>
  <path class="flow" d="M725,150 L763,150"/>
  <path class="flow" d="M377.5,190 L377.5,238"/>
  <path class="flow" d="M622.5,190 L622.5,238"/>
  <path class="flow" d="M725,280 L763,280"/>

  <!-- Legend -->
  <g font-size="12" fill="#4b5563">
    <rect class="control" x="30" y="356" width="14" height="14" rx="3"/>
    <text x="52" y="367">control plane</text>
    <rect class="runtime" x="150" y="356" width="14" height="14" rx="3"/>
    <text x="172" y="367">tenant namespace</text>
    <rect class="reconcile" x="292" y="356" width="14" height="14" rx="3"/>
    <text x="314" y="367">platform proxy</text>
    <rect class="external" x="420" y="356" width="14" height="14" rx="3"/>
    <text x="442" y="367">external</text>
  </g>
</svg>
