<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ADR038 — the shape of a cron job: a git push or image reaches the operator, which optionally builds an OCI image into Zot, turns spec.schedule into a batch/v1 CronJob with ConcurrencyPolicy Forbid that runs a Job to completion on schedule, turns spec.runAt into a one-off manual Job, and turns spec.cancelRun into a foreground delete of the active Job; scheduled and manual Jobs both record into status.runs[]</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .h { font-size: 15px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .s { font-size: 12px; fill: #6b7280; text-anchor: middle; }
      .flow { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .bus { stroke: #334155; stroke-width: 1.6; fill: none; }
      .lbl { font-size: 12px; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; }
      .control { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
      .reconcile { fill: #fffbeb; stroke: #d97706; stroke-width: 1.6; }
      .runtime { fill: #ecfdf5; stroke: #059669; stroke-width: 1.6; }
      .deny { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.6; }
      .ext { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.6; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="459" rx="14" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="30" y="46" font-size="22" font-weight="700" fill="#111827">The shape of a cron job</text>
  <text x="30" y="70" font-size="13" fill="#4b5563">A cron_job reconciles to a batch/v1 CronJob only — no Deployment, no Service, no Ingress, no HTTP port.</text>

  <!-- Source and operator -->
  <rect class="ext" x="30" y="237" width="140" height="56" rx="10"/>
  <text class="h" x="100" y="270">git push / image</text>

  <rect class="reconcile" x="215" y="237" width="110" height="56" rx="10"/>
  <text class="h" x="270" y="270">operator</text>

  <path class="flow" d="M170,265 L213,265"/>

  <!-- Operator fan-out -->
  <path class="bus" d="M325,265 L350,265 M350,130 L350,400"/>

  <path class="flow" d="M350,130 L578,130"/>
  <text class="lbl" x="465" y="121">build (BuildKit, optional)</text>

  <path class="flow" d="M350,220 L578,220"/>
  <text class="lbl" x="465" y="196">spec.schedule → batch/v1 CronJob</text>
  <text class="lbl" x="465" y="211">ConcurrencyPolicy: Forbid</text>

  <path class="flow" d="M350,310 L578,310"/>
  <text class="lbl" x="465" y="301">spec.runAt → one-off Job</text>

  <path class="flow" d="M350,400 L578,400"/>
  <text class="lbl" x="465" y="391">spec.cancelRun → foreground delete</text>

  <!-- OCI image (cylinder) -->
  <path class="reconcile" d="M580,106 v48 a77.5,8 0 0 0 155,0 v-48"/>
  <ellipse class="reconcile" cx="657.5" cy="106" rx="77.5" ry="8"/>
  <text class="h" x="657" y="136">OCI image</text>
  <text class="s" x="657" y="154">Zot</text>

  <!-- CronJob -->
  <rect class="control" x="580" y="192" width="155" height="56" rx="10"/>
  <text class="h" x="657" y="225">CronJob</text>

  <!-- manual Job (cylinder) -->
  <path class="runtime" d="M580,286 v48 a77.5,8 0 0 0 155,0 v-48"/>
  <ellipse class="runtime" cx="657.5" cy="286" rx="77.5" ry="8"/>
  <text class="h" x="657" y="322">manual Job</text>

  <!-- cancel -->
  <rect class="deny" x="580" y="372" width="155" height="56" rx="10"/>
  <text class="h" x="657" y="405">cancel active Job</text>

  <!-- Job → Pod (cylinder) -->
  <path class="runtime" d="M815,196 v48 a77.5,8 0 0 0 155,0 v-48"/>
  <ellipse class="runtime" cx="892.5" cy="196" rx="77.5" ry="8"/>
  <text class="h" x="892" y="226">Job → Pod</text>
  <text class="s" x="892" y="244">run to completion</text>

  <!-- run history -->
  <rect class="control" x="815" y="290" width="155" height="56" rx="10"/>
  <text class="h" x="892" y="313">status.runs[]</text>
  <text class="s" x="892" y="333">≤10, survives GC</text>

  <!-- Run edges -->
  <path class="flow" d="M735,220 L813,220"/>
  <text class="lbl" x="774" y="211">on schedule</text>

  <path class="flow" d="M892,252 L892,288"/>
  <path class="flow" d="M735,318 L813,318"/>
</svg>
