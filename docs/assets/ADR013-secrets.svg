<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ADR013 — env-vars API: an API key or session writes through bex-api Core, which writes OpenBao (the source of truth), projects the k8s Secret, and updates the App CR; the operator rolls the app pods onto the new values with envFrom and a rolling restart</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .h { font-size: 15px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .s { font-size: 12px; fill: #6b7280; text-anchor: middle; }
      .flow { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .lbl { font-size: 12px; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .actor { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
      .control { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
      .reconcile { fill: #fffbeb; stroke: #d97706; stroke-width: 1.6; }
      .runtime { fill: #ecfdf5; stroke: #059669; stroke-width: 1.6; }
      .secret { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.6; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="659" rx="14" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="30" y="50" font-size="22" font-weight="700" fill="#111827">ADR013 — The env-vars API</text>
  <text x="30" y="74" font-size="13" fill="#4b5563">Values live in OpenBao under the service's path; the operator materializes them into the running app.</text>

  <!-- Caller -->
  <rect class="actor" x="410" y="104" width="180" height="46" rx="23"/>
  <text x="500" y="132" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">API key / session</text>

  <!-- bex-api -->
  <rect class="control" x="390" y="224" width="220" height="70" rx="10"/>
  <text class="h" x="500" y="253">bex-api Core</text>
  <text class="s" x="500" y="274">env-vars API</text>

  <!-- Write targets -->
  <rect class="secret" x="60" y="400" width="240" height="70" rx="10"/>
  <text class="h" x="180" y="429">OpenBao</text>
  <text class="s" x="180" y="450">tenants/&lt;tenant&gt;/services/&lt;svc&gt;/env</text>

  <rect class="secret" x="390" y="400" width="220" height="70" rx="10"/>
  <text class="h" x="500" y="429">k8s Secret &lt;svc&gt;-env</text>
  <text class="s" x="500" y="450">projection copy, in etcd</text>

  <rect class="control" x="700" y="400" width="240" height="70" rx="10"/>
  <text class="h" x="820" y="440">App CR</text>

  <!-- Operator and pods -->
  <rect class="reconcile" x="700" y="530" width="240" height="60" rx="10"/>
  <text class="h" x="820" y="565">operator</text>

  <rect class="runtime" x="360" y="530" width="220" height="60" rx="10"/>
  <text class="h" x="470" y="555">app pods</text>
  <text class="s" x="470" y="574">new values</text>

  <!-- Edges -->
  <path class="flow" d="M500,150 L500,222"/>
  <text class="lbl" x="512" y="191">legacy writes or PATCH /environment</text>

  <path class="flow" d="M450,294 L450,350 L180,350 L180,398"/>
  <text class="lbl" x="300" y="312" text-anchor="middle">ordinary KV v2 write or</text>
  <text class="lbl" x="300" y="326" text-anchor="middle">optional revision CAS</text>
  <text class="lbl" x="300" y="340" text-anchor="middle" font-weight="600">(source of truth)</text>

  <path class="flow" d="M500,294 L500,398"/>
  <text class="lbl" x="510" y="382">project</text>

  <path class="flow" d="M550,294 L550,350 L820,350 L820,398"/>
  <text class="lbl" x="700" y="326" text-anchor="middle">active spec ref or pending</text>
  <text class="lbl" x="700" y="340" text-anchor="middle">metadata + optional one roll</text>

  <path class="flow" d="M820,470 L820,528"/>

  <path class="flow" d="M700,560 L582,560"/>
  <text class="lbl" x="640" y="536" text-anchor="middle">envFrom +</text>
  <text class="lbl" x="640" y="550" text-anchor="middle">rolling restart</text>

  <!-- Legend -->
  <g font-size="12" fill="#4b5563">
    <rect class="control" x="30" y="618" width="14" height="14" rx="3"/>
    <text x="52" y="629">control plane</text>
    <rect class="secret" x="150" y="618" width="14" height="14" rx="3"/>
    <text x="172" y="629">secret values</text>
    <rect class="reconcile" x="270" y="618" width="14" height="14" rx="3"/>
    <text x="292" y="629">operator</text>
    <rect class="runtime" x="362" y="618" width="14" height="14" rx="3"/>
    <text x="384" y="629">app runtime</text>
  </g>
</svg>
