<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1005" viewBox="0 0 1000 1005" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ADR046 — Payment onboarding and paid gating: card-free sign-up through Kratos, PaymentGate checks the payment_method_bound_at marker or returns 402, the Stripe checkout.session.completed webhook stamps the marker, and the meter-event emitter only bills card-bound or comped workspaces</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .h { font-size: 15px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .s { font-size: 12px; fill: #6b7280; text-anchor: middle; }
      .flow { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .lbl { font-size: 12px; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .lbl-in { font-size: 12px; fill: #475569; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
      .grp { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .gl { font-size: 13px; font-weight: 700; fill: #475569; letter-spacing: 0.6px; }
      .actor { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
      .client { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.6; }
      .control { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
      .deny { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.6; }
      .ext { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.6; }
      .icon { fill: none; stroke: #475569; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="1004" rx="14" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="40" y="44" font-size="22" font-weight="700" fill="#111827">ADR046 — Payment onboarding and paid gating</text>
  <text x="40" y="68" font-size="13" fill="#4b5563">Registration touches only Kratos; paid intent hits PaymentGate's marker check; only the checkout webhook stamps the marker.</text>

  <!-- Identity provider and user -->
  <rect class="ext" x="40" y="94" width="150" height="56" rx="10"/>
  <text class="h" x="115" y="119">Ory Kratos</text>
  <text class="s" x="115" y="138">identity</text>

  <rect class="actor" x="230" y="100" width="140" height="44" rx="22"/>
  <circle class="icon" cx="256" cy="116" r="5"/>
  <path class="icon" d="M246,133 a10,8 0 0 1 20,0"/>
  <text x="278" y="127" font-size="14" font-weight="600" fill="#111827">user</text>

  <!-- Dashboard -->
  <rect class="grp" x="40" y="170" width="460" height="150" rx="16"/>
  <text class="gl" x="60" y="194">DASHBOARD</text>

  <rect class="client" x="60" y="214" width="200" height="70" rx="10"/>
  <text class="h" x="160" y="242">/auth/sign-up</text>
  <text class="s" x="160" y="263">card-free registration</text>

  <rect class="client" x="280" y="214" width="200" height="90" rx="10"/>
  <text class="h" x="380" y="239">paid-intent interception</text>
  <text class="s" x="380" y="259">catches 402, opens</text>
  <text class="s" x="380" y="275">BillingOnboardingView,</text>
  <text class="s" x="380" y="291">polls readiness</text>

  <!-- Stripe -->
  <rect class="ext" x="520" y="188" width="420" height="100" rx="10"/>
  <text class="h" x="730" y="222">Stripe</text>
  <text class="s" x="730" y="244">hosted Checkout, Customers + Subscriptions,</text>
  <text class="s" x="730" y="261">meter events</text>

  <!-- bex-api -->
  <rect class="grp" x="40" y="396" width="920" height="434" rx="16"/>
  <text class="gl" x="60" y="420">BEX-API (BEX-SYSTEM)</text>

  <rect class="control" x="330" y="450" width="140" height="60" rx="10"/>
  <text class="h" x="400" y="485">auth gate</text>

  <rect class="control" x="520" y="440" width="200" height="80" rx="10"/>
  <text class="h" x="620" y="467">internal/billing</text>
  <text class="s" x="620" y="487">checkout-session verb +</text>
  <text class="s" x="620" y="503">Stripe webhook handler</text>

  <rect class="control" x="740" y="440" width="200" height="70" rx="10"/>
  <text class="h" x="840" y="468">meter-event emitter</text>
  <text class="s" x="840" y="489">hourly background loop</text>

  <rect class="control" x="60" y="570" width="240" height="70" rx="10"/>
  <text class="h" x="180" y="598">apps / postgres / keyvalue</text>
  <text class="s" x="180" y="619">services: create + plan-change verbs</text>

  <rect class="deny" x="60" y="710" width="240" height="90" rx="10"/>
  <text class="h" x="180" y="736">PaymentGate</text>
  <text class="s" x="180" y="757">interface, impl. by internal/billing,</text>
  <text class="s" x="180" y="773">wired at composition root</text>

  <!-- Control-plane Postgres -->
  <path class="control" d="M40,900 v64 a460,10 0 0 0 920,0 v-64"/>
  <ellipse class="control" cx="500" cy="900" rx="460" ry="10"/>
  <text class="h" x="500" y="938">control-plane Postgres</text>
  <text class="s" x="500" y="959">tenants, billing_provider_mappings (payment_method_bound_at), usage_hourly outbox</text>

  <!-- Edges: user -->
  <path class="flow" d="M275,144 L206,212"/>
  <path class="flow" d="M330,144 L368,212"/>
  <path class="flow" d="M170,214 L170,152"/>
  <path class="flow" d="M370,122 L720,122 L720,186"/>
  <text class="lbl" x="545" y="114" text-anchor="middle">enters card on hosted Checkout</text>

  <!-- Edges: dashboard into bex-api -->
  <path class="flow" d="M400,320 L400,448"/>
  <text class="lbl" x="388" y="356" text-anchor="end">authenticated REST/GraphQL</text>

  <path class="flow" d="M350,510 L252,568"/>
  <path class="flow" d="M470,480 L518,480"/>

  <path class="flow" d="M400,510 L400,890"/>
  <text class="lbl-in" x="412" y="736">EnsureTenant — mints free</text>
  <text class="lbl-in" x="412" y="751">workspace on first call</text>

  <!-- Edges: paid gate -->
  <path class="flow" d="M180,640 L180,708"/>
  <text class="lbl-in" x="192" y="670">non-free tier create /</text>
  <text class="lbl-in" x="192" y="685">plan change</text>

  <path class="flow" d="M180,800 L180,892"/>
  <text class="lbl" x="192" y="854">payment_method_bound_at set?</text>
  <text class="lbl" x="192" y="869">else 402</text>

  <!-- Edges: billing and Stripe -->
  <path class="flow" d="M560,440 L560,290"/>
  <text class="lbl" x="548" y="342" text-anchor="end">EnsureContract +</text>
  <text class="lbl" x="548" y="357" text-anchor="end">Checkout session</text>
  <text class="lbl" x="548" y="372" text-anchor="end">(mode=setup)</text>

  <path class="flow" d="M600,288 L600,438"/>
  <text class="lbl" x="612" y="326">checkout.session.completed →</text>
  <text class="lbl" x="612" y="341">POST /v1/webhooks/stripe</text>

  <path class="flow" d="M620,520 L620,892"/>
  <text class="lbl-in" x="632" y="630">stamps</text>
  <text class="lbl-in" x="632" y="645">payment_method_bound_at</text>

  <!-- Edges: emitter -->
  <path class="flow" d="M900,440 L900,290"/>
  <text class="lbl-in" x="888" y="416" text-anchor="end">meter events — only card-bound</text>
  <text class="lbl-in" x="888" y="431" text-anchor="end">or comped workspaces</text>

  <path class="flow" d="M840,510 L840,892"/>
  <text class="lbl-in" x="828" y="730" text-anchor="end">sealed usage rows</text>
  <text class="lbl-in" x="828" y="745" text-anchor="end">+ marker gate</text>
</svg>
