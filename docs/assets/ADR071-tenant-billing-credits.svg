<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ADR071 — credit architecture and trust flow: requester and approver create durable intent in bex-api, only the background credit executor mutates Stripe, and signature-verified Stripe events reconcile the local audit ledger</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .h { font-size: 15px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .s { font-size: 12px; fill: #6b7280; text-anchor: middle; }
      .flow { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .lbl { font-size: 12px; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .lbl-in { font-size: 12px; fill: #475569; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
      .glabel { font-size: 13px; font-weight: 700; fill: #475569; letter-spacing: 0.6px; }
      .gsub { font-size: 12px; fill: #6b7280; }
      .actor { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
      .control { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
      .reconcile { fill: #fffbeb; stroke: #d97706; stroke-width: 1.6; }
      .deny { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.6; }
      .inert { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.6; }
      .icon { fill: none; stroke: #475569; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="729" rx="14" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="40" y="46" font-size="22" font-weight="700" fill="#111827">Credit architecture and trust flow</text>
  <text x="40" y="70" font-size="13" fill="#4b5563">Only the background executor mutates Stripe; signature-verified Stripe events reconcile the local audit ledger.</text>

  <!-- People -->
  <rect class="actor" x="30" y="100" width="180" height="44" rx="22"/>
  <circle class="icon" cx="56" cy="116" r="5"/>
  <path class="icon" d="M46,133 a10,8 0 0 1 20,0"/>
  <text x="76" y="127" font-size="14" font-weight="600" fill="#111827">credit requester</text>

  <rect class="actor" x="230" y="100" width="180" height="44" rx="22"/>
  <circle class="icon" cx="256" cy="116" r="5"/>
  <path class="icon" d="M246,133 a10,8 0 0 1 20,0"/>
  <text x="276" y="127" font-size="14" font-weight="600" fill="#111827">credit approver</text>

  <rect class="actor" x="735" y="100" width="240" height="44" rx="22"/>
  <circle class="icon" cx="761" cy="116" r="5"/>
  <path class="icon" d="M751,133 a10,8 0 0 1 20,0"/>
  <text x="781" y="127" font-size="14" font-weight="600" fill="#111827">workspace billing member</text>

  <!-- OpenFGA -->
  <rect class="deny" x="440" y="96" width="180" height="80" rx="10"/>
  <text class="h" x="530" y="131">OpenFGA</text>
  <text class="s" x="530" y="152">authorization service</text>

  <!-- bex-api process -->
  <rect x="225" y="244" width="550" height="426" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text class="glabel" x="245" y="657">BEX-API PROCESS</text>
  <text class="gsub" x="378" y="657">long-running service</text>

  <rect class="control" x="250" y="296" width="220" height="70" rx="10"/>
  <text class="h" x="360" y="325">platform credit endpoints</text>
  <text class="s" x="360" y="346">HTTP handlers, not services</text>

  <rect class="control" x="530" y="296" width="220" height="70" rx="10"/>
  <text class="h" x="640" y="325">tenant credit reads</text>
  <text class="s" x="640" y="346">API handlers, not services</text>

  <rect class="control" x="390" y="430" width="220" height="70" rx="10"/>
  <text class="h" x="500" y="459">Stripe webhook intake</text>
  <text class="s" x="500" y="480">HTTP handler, not a service</text>

  <rect class="reconcile" x="390" y="566" width="220" height="70" rx="10"/>
  <text class="h" x="500" y="595">credit executor</text>
  <text class="s" x="500" y="616">long-running background worker</text>

  <!-- Control-plane Postgres -->
  <path class="control" d="M25,430 v210 a87.5,10 0 0 0 175,0 v-210"/>
  <ellipse class="control" cx="112.5" cy="430" rx="87.5" ry="10"/>
  <text class="h" x="112.5" y="502">control-plane</text>
  <text class="h" x="112.5" y="521">Postgres</text>
  <text class="s" x="112.5" y="545">credit intent, approval,</text>
  <text class="s" x="112.5" y="561">outbox, audit</text>

  <!-- Stripe -->
  <rect class="inert" x="800" y="420" width="175" height="230" rx="10"/>
  <text class="h" x="887.5" y="512">Stripe</text>
  <text class="s" x="887.5" y="536">Billing Credits API</text>
  <text class="s" x="887.5" y="552">and authoritative ledger</text>

  <!-- Edges: people -->
  <path class="flow" d="M130,144 L280,294"/>
  <text class="lbl" x="196" y="236" text-anchor="end">request promotional</text>
  <text class="lbl" x="196" y="251" text-anchor="end">credit</text>

  <path class="flow" d="M320,144 L320,294"/>
  <text class="lbl" x="308" y="196" text-anchor="end">approve or deny</text>

  <path class="flow" d="M820,144 L722,294"/>
  <text class="lbl" x="790" y="222">read available</text>
  <text class="lbl" x="790" y="237">credit</text>

  <!-- Edges: authorization -->
  <path class="flow" d="M455,296 L455,178"/>
  <text class="lbl" x="443" y="208" text-anchor="end">authorize</text>
  <text class="lbl" x="443" y="223" text-anchor="end">platform role</text>

  <path class="flow" d="M590,296 L590,178"/>
  <text class="lbl" x="602" y="212">authorize workspace</text>
  <text class="lbl" x="602" y="227">billing role</text>

  <!-- Edges: durable intent and Stripe -->
  <path class="flow" d="M262,366 L176,424"/>
  <text class="lbl" x="198" y="376" text-anchor="end">persist immutable</text>
  <text class="lbl" x="198" y="391" text-anchor="end">intent and approval</text>

  <path class="flow" d="M738,366 L822,418"/>
  <text class="lbl" x="808" y="382">read balance summary</text>
  <text class="lbl" x="808" y="397">and transactions</text>

  <path class="flow" d="M800,465 L612,465"/>
  <text class="lbl-in" x="700" y="443" text-anchor="middle">signature-verified</text>
  <text class="lbl-in" x="700" y="457" text-anchor="middle">credit events</text>

  <path class="flow" d="M390,465 L202,465"/>
  <text class="lbl-in" x="307" y="443" text-anchor="middle">append normalized</text>
  <text class="lbl-in" x="307" y="457" text-anchor="middle">provider facts</text>

  <path class="flow" d="M390,601 L202,601"/>
  <text class="lbl-in" x="307" y="579" text-anchor="middle">lease approved</text>
  <text class="lbl-in" x="307" y="593" text-anchor="middle">operation</text>

  <path class="flow" d="M610,601 L798,601"/>
  <text class="lbl-in" x="700" y="579" text-anchor="middle">create, void, or expire</text>
  <text class="lbl-in" x="700" y="593" text-anchor="middle">with idempotency key</text>

  <!-- Legend -->
  <g font-size="12" fill="#4b5563">
    <rect class="control" x="40" y="692" width="14" height="14" rx="3"/>
    <text x="62" y="703">control plane</text>
    <rect class="reconcile" x="170" y="692" width="14" height="14" rx="3"/>
    <text x="192" y="703">background worker</text>
    <rect class="deny" x="330" y="692" width="14" height="14" rx="3"/>
    <text x="352" y="703">authorization</text>
    <rect class="inert" x="460" y="692" width="14" height="14" rx="3"/>
    <text x="482" y="703">external provider</text>
  </g>
</svg>
