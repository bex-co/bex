<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ADR002 ① day-0 infra provisioning — you or CI run terraform and clusterctl once from outside, making the clusters and machines exist</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .h { font-size: 15px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .s { font-size: 12px; fill: #6b7280; text-anchor: middle; }
      .flow { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .lbl { font-size: 12px; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .actor { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
      .control { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
      .reconcile { fill: #fffbeb; stroke: #d97706; stroke-width: 1.6; }
      .runtime { fill: #ecfdf5; stroke: #059669; stroke-width: 1.6; }
      .external { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.6; }
      .icon { fill: none; stroke: #475569; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="679" height="329" rx="14" fill="#ffffff" stroke="#e5e7eb"/>

  <circle cx="53" cy="43" r="13" fill="#1f2937"/>
  <text x="53" y="48" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="76" y="50" font-size="20" font-weight="700" fill="#111827">day-0 · infra provisioning</text>
  <text x="40" y="76" font-size="13" fill="#4b5563">Run once from outside: terraform / clusterctl make the cluster + machines exist.</text>

  <rect class="actor" x="120" y="104" width="220" height="44" rx="22"/>
  <circle class="icon" cx="146" cy="120" r="5"/>
  <path class="icon" d="M136,137 a10,8 0 0 1 20,0"/>
  <text x="166" y="131" font-size="14" font-weight="600" fill="#111827">you / CI · from outside</text>

  <path class="flow" d="M230,148 L230,226"/>
  <text class="lbl" x="242" y="192">terraform · clusterctl (run once)</text>

  <rect class="runtime" x="80" y="228" width="300" height="70" rx="10"/>
  <text class="h" x="230" y="257">day-0 · infra/</text>
  <text class="s" x="230" y="278">clusters + machines exist</text>
</svg>
