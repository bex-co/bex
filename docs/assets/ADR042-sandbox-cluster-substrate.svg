<svg xmlns="http://www.w3.org/2000/svg" width="980" height="990" viewBox="0 0 980 990" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Sandbox cluster substrate — agents, the Render CLI and MCP clients reach bex-api, the only caller allowed to reach the OpenSandbox server; the controller manages sandbox pods, maintains the warm Pool and commits paused rootfs to Zot; sandbox pods pull rootfs on resume and are blocked from reaching the OpenSandbox server</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <style>
      .h { font-size: 15px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .s { font-size: 12px; fill: #6b7280; text-anchor: middle; }
      .g { font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: 0.5px; }
      .flow { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .blocked { stroke: #dc2626; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow-red); }
      .lbl { font-size: 12px; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .lbl-in { font-size: 12px; fill: #475569; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
      .lbl-red { font-size: 12px; font-weight: 600; fill: #b91c1c; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
      .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .group-in { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .group-red { fill: #ffffff; stroke: #dc2626; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .actor { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
      .client { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.6; }
      .control { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
      .reconcile { fill: #fffbeb; stroke: #d97706; stroke-width: 1.6; }
      .deny { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.6; }
      .external { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.6; }
      .icon { fill: none; stroke: #475569; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="979" height="989" rx="14" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="40" y="50" font-size="22" font-weight="700" fill="#111827">Sandbox cluster substrate — architecture</text>
  <text x="40" y="74" font-size="13" fill="#4b5563">Every arrow is a dependency: A → B means A depends on B. The dashed ✗ edge is the load-bearing security constraint:</text>
  <text x="40" y="92" font-size="13" fill="#4b5563">untrusted sandbox pods cannot reach the OpenSandbox server, so the only path to the lifecycle API is through bex-api.</text>

  <g transform="translate(0,14)">
  <!-- Clients -->
  <rect class="actor" x="205" y="108" width="210" height="44" rx="22"/>
  <rect class="icon" x="224" y="121" width="18" height="14" rx="3"/>
  <circle cx="229.5" cy="128" r="1.6" fill="#475569"/>
  <circle cx="236.5" cy="128" r="1.6" fill="#475569"/>
  <path class="icon" d="M233,117 v4"/>
  <text x="252" y="135" font-size="14" font-weight="600" fill="#111827">Agent (Claude Code)</text>

  <rect class="client" x="435" y="108" width="210" height="44" rx="22"/>
  <text class="h" x="540" y="135" font-size="14">Render CLI — ea sandbox</text>

  <rect class="client" x="665" y="108" width="170" height="44" rx="22"/>
  <text class="h" x="750" y="135" font-size="14">bex MCP client</text>

  <!-- Cluster -->
  <rect class="group" x="30" y="186" width="920" height="730" rx="16"/>
  <text class="g" x="50" y="210">BEX APP CLUSTER</text>

  <!-- bex-system -->
  <rect class="group-in" x="200" y="226" width="500" height="114" rx="12"/>
  <text class="g" x="216" y="248">BEX-SYSTEM · TRUSTED</text>
  <rect class="control" x="410" y="258" width="260" height="66" rx="10"/>
  <text class="h" x="540" y="285">bex-api · sandbox gateway</text>
  <text class="s" x="540" y="305">authz · quota · identity · idle tracker</text>

  <!-- opensandbox-system -->
  <rect class="group-in" x="50" y="396" width="880" height="144" rx="12"/>
  <text class="g" x="914" y="418" text-anchor="end">OPENSANDBOX-SYSTEM · TRUSTED — ONLY BEX-API MAY REACH</text>
  <rect class="reconcile" x="70" y="436" width="280" height="80" rx="10"/>
  <text class="h" x="210" y="462">OpenSandbox server</text>
  <text class="s" x="210" y="482">lifecycle: create / pause /</text>
  <text class="s" x="210" y="498">resume / delete / exec</text>

  <rect class="reconcile" x="410" y="436" width="280" height="80" rx="10"/>
  <text class="h" x="550" y="470">OpenSandbox controller</text>
  <text class="s" x="550" y="491">BatchSandbox / Pool / SandboxSnapshot CRDs</text>

  <rect class="reconcile" x="772" y="446" width="140" height="60" rx="10"/>
  <text class="h" x="842" y="472">warm Pool CR</text>
  <text class="s" x="842" y="491">pre-warmed capacity</text>

  <!-- ws-sandbox -->
  <rect class="group-red" x="50" y="600" width="390" height="140" rx="12"/>
  <text class="g" x="112" y="622" style="fill:#b91c1c">WS-SANDBOX (ONE PER TENANT) · UNTRUSTED</text>
  <rect class="deny" x="70" y="636" width="340" height="90" rx="10"/>
  <text class="h" x="240" y="661">sandbox pods</text>
  <text class="s" x="240" y="681">agent code · gVisor RuntimeClass</text>
  <text class="s" x="240" y="698">tainted node pool · Cilium DNS/FQDN default-deny</text>

  <!-- bex-registry -->
  <rect class="group-in" x="450" y="770" width="480" height="130" rx="12"/>
  <text class="g" x="466" y="792">BEX-REGISTRY</text>
  <path class="external" d="M480,826 v54 a150,9 0 0 0 300,0 v-54"/>
  <ellipse class="external" cx="630" cy="826" rx="150" ry="9"/>
  <text class="h" x="630" y="858">Zot — snapshot store</text>
  <text class="s" x="630" y="877">per-tenant snapshots/&lt;ns&gt; repos</text>

  <!-- Edges: clients -->
  <path class="flow" d="M310,152 L450,256"/>
  <path class="flow" d="M540,152 L540,256"/>
  <path class="flow" d="M750,152 L630,256"/>

  <!-- Edges: control path -->
  <path class="flow" d="M430,324 L332,434"/>
  <text class="lbl-in" x="368" y="376" text-anchor="end">per-workspace key + NetworkPolicy (only bex-api)</text>

  <path class="flow" d="M350,476 L408,476"/>
  <path class="flow" d="M690,476 L770,476"/>
  <text class="lbl-in" x="730" y="466" text-anchor="middle">maintains</text>

  <!-- Edges: sandbox pods -->
  <path class="flow" d="M410,681 L500,681 L500,518"/>
  <text class="lbl-in" x="512" y="575">managed by</text>

  <path class="blocked" d="M96,636 L96,519"/>
  <text class="lbl-red" x="108" y="566">✗ blocked —</text>
  <text class="lbl-red" x="108" y="582">anti-lateral-movement</text>

  <path class="flow" d="M620,516 L620,815"/>
  <text class="lbl-in" x="632" y="650">pause: commit rootfs</text>
  <text class="lbl-in" x="632" y="666">(Job in opensandbox-snapshot, D5 resolved)</text>

  <path class="flow" d="M240,726 L240,856 L478,856"/>
  <text class="lbl-in" x="252" y="828">resume: pull rootfs —</text>
  <text class="lbl-in" x="252" y="844">v1 rootfs-only, no memory</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#4b5563">
    <rect class="client" x="40" y="950" width="14" height="14" rx="3"/>
    <text x="62" y="961">clients</text>
    <rect class="control" x="128" y="950" width="14" height="14" rx="3"/>
    <text x="150" y="961">bex (trusted)</text>
    <rect class="reconcile" x="246" y="950" width="14" height="14" rx="3"/>
    <text x="268" y="961">OpenSandbox (trusted)</text>
    <rect class="deny" x="420" y="950" width="14" height="14" rx="3"/>
    <text x="442" y="961">untrusted tenant code</text>
    <rect class="external" x="592" y="950" width="14" height="14" rx="3"/>
    <text x="614" y="961">snapshot store</text>
    <path d="M722,957 L758,957" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 5"/>
    <text x="766" y="961">blocked path</text>
  </g>
</svg>
