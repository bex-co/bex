<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ADR050 — Encrypted platform backups: Tier A CronJobs age-encrypt with the committed public key and Tier B uses SSE-S3, both upload through write-only S3 Secrets into the bex-tfstate bucket; restore needs the out-of-band read-only credentials and, for Tier A, the age private key</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .h { font-size: 15px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .s { font-size: 12px; fill: #6b7280; text-anchor: middle; }
      .g { font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: 0.6px; }
      .gs { font-size: 12px; fill: #6b7280; }
      .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .flow { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .lbl { font-size: 12px; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .lbl-in { font-size: 12px; fill: #475569; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
      .actor { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
      .external { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.6; }
      .control { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
      .runtime { fill: #ecfdf5; stroke: #059669; stroke-width: 1.6; }
      .security { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.6; }
      .icon { fill: none; stroke: #475569; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="829" rx="14" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="40" y="50" font-size="22" font-weight="700" fill="#111827">Encrypted platform backups</text>
  <text x="40" y="74" font-size="13" fill="#4b5563">Writers only move data into the bucket; reading back needs the out-of-band private key (Tier A) and/or the reader credential.</text>

  <!-- git -->
  <rect class="group" x="30" y="100" width="270" height="90" rx="12"/>
  <text class="g" x="48" y="122">GIT</text>
  <text class="gs" x="84" y="122">committed, public</text>
  <rect class="external" x="48" y="136" width="234" height="40" rx="10"/>
  <text class="h" x="165" y="161">age public key</text>

  <!-- disaster recovery -->
  <rect class="group" x="330" y="100" width="330" height="200" rx="12"/>
  <text class="g" x="348" y="122">DISASTER RECOVERY</text>
  <text class="gs" x="348" y="139">manual runbook, operator laptop</text>
  <rect class="actor" x="350" y="156" width="172" height="44" rx="22"/>
  <circle class="icon" cx="374" cy="172" r="5"/>
  <path class="icon" d="M364,189 a10,8 0 0 1 20,0"/>
  <text x="392" y="183" font-size="14" font-weight="600" fill="#111827">human operator</text>

  <!-- out-of-band custody -->
  <rect class="group" x="690" y="100" width="280" height="210" rx="12"/>
  <text class="g" x="706" y="122">OUT-OF-BAND OPERATOR CUSTODY</text>
  <text class="gs" x="706" y="139">.env / GitHub Actions secrets</text>
  <rect class="security" x="706" y="156" width="248" height="44" rx="10"/>
  <text class="h" x="830" y="183">age private key</text>
  <rect class="security" x="706" y="236" width="248" height="58" rx="10"/>
  <text class="h" x="830" y="260">per-store read-only</text>
  <text class="h" x="830" y="280">S3 credentials</text>

  <!-- app cluster -->
  <rect class="group" x="30" y="330" width="620" height="470" rx="16"/>
  <text x="50" y="355" font-size="13" font-weight="700" fill="#475569" letter-spacing="0.6">APP CLUSTER (HETZNER)</text>

  <rect x="50" y="372" width="260" height="256" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text class="g" x="66" y="394">TIER A</text>
  <text class="gs" x="66" y="410">bex-controlled upload pipelines</text>
  <rect class="runtime" x="66" y="424" width="228" height="56" rx="10"/>
  <text class="h" x="180" y="448">etcd-backup CronJob</text>
  <text class="s" x="180" y="467">nightly, exits when done</text>
  <rect class="runtime" x="66" y="492" width="228" height="56" rx="10"/>
  <text class="h" x="180" y="516">openbao-backup CronJob</text>
  <text class="s" x="180" y="535">nightly, exits when done</text>
  <rect class="runtime" x="66" y="560" width="228" height="56" rx="10"/>
  <text class="h" x="180" y="584">kvbak CronJob</text>
  <text class="s" x="180" y="603">nightly, exits when done</text>

  <rect x="50" y="648" width="260" height="132" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text class="g" x="66" y="670">TIER B</text>
  <text class="gs" x="66" y="686">Barman Cloud Plugin pipeline</text>
  <rect class="runtime" x="66" y="700" width="228" height="64" rx="10"/>
  <text class="h" x="180" y="727">Barman Cloud Plugin</text>
  <text class="s" x="180" y="747">bex-db / tenant-postgres / auth-dbs</text>

  <rect class="security" x="450" y="470" width="180" height="110" rx="10"/>
  <text class="h" x="540" y="498">per-store write-only</text>
  <text class="h" x="540" y="517">S3 Secrets</text>
  <text class="s" x="540" y="541">PutObject / DeleteObject /</text>
  <text class="s" x="540" y="559">ListBucket only</text>

  <!-- bucket -->
  <path class="control" d="M700,455 v140 a130,10 0 0 0 260,0 v-140"/>
  <ellipse class="control" cx="830" cy="455" rx="130" ry="10"/>
  <text class="h" x="830" y="502">bex-tfstate</text>
  <text class="s" x="830" y="526">etcd-snapshots/ openbao-snapshots/</text>
  <text class="s" x="830" y="544">keyvalue/ bex-db/ auth-dbs/</text>

  <!-- Edges: encrypt and upload -->
  <path class="flow" d="M265,176 L265,370"/>
  <text class="lbl" x="253" y="262" text-anchor="end">age -r (encrypt)</text>

  <path class="flow" d="M310,525 L448,525"/>
  <text class="lbl-in" x="380" y="499" text-anchor="middle">gzip, age-encrypt,</text>
  <text class="lbl-in" x="380" y="514" text-anchor="middle">upload</text>

  <path class="flow" d="M294,732 L540,732 L540,582"/>
  <text class="lbl-in" x="420" y="723" text-anchor="middle">SSE-S3 encryption: AES256</text>

  <path class="flow" d="M630,525 L698,525"/>

  <!-- Edges: restore -->
  <path class="flow" d="M522,178 L704,178"/>
  <text class="lbl-in" x="606" y="170" text-anchor="middle">age -d, Tier A only</text>

  <path class="flow" d="M425,200 L425,264 L704,264"/>
  <text class="lbl-in" x="545" y="256" text-anchor="middle">scripts/restore-*.sh</text>

  <path class="flow" d="M830,294 L830,443"/>
  <text class="lbl" x="842" y="378">GetObject</text>
</svg>
