<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1180" viewBox="0 0 1280 1180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ADR112 — bex object storage: the Render CLI and wrangler r2 contracts served by bex-api over one Wasabi store, with public buckets served by objectgw</title>
  <desc>render ea objects calls bex-api's Render routes, which authorize and sign a presigned URL, and the bytes move straight between the client and Wasabi. Stock wrangler r2 calls bex-api's Cloudflare-shaped routes and the bytes stream through bex-api. Buckets are rows in Postgres over one shared bucket per region on the platform's Wasabi account. A public bucket is served read-only by objectgw at pub-id.onbex.co. An hourly sweep feeds the quota gate, lifecycle rules and shadow meters. The platform's backups sit in other buckets of the same account, under other credentials.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .h { font-size: 15px; font-weight: 600; fill: #111827; }
      .t { font-size: 12.5px; fill: #374151; }
      .s { font-size: 11.5px; fill: #6b7280; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #111827; }
      .flow { stroke: #1f2937; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .flow2 { stroke: #1f2937; stroke-width: 1.8; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
      .back { stroke: #6b7280; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow-grey); }
      .badge circle { fill: #1f2937; }
      .badge text { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .mid { text-anchor: middle; }
    </style>
  </defs>

  <rect width="1280" height="1180" fill="#ffffff"/>

  <text x="30" y="40" font-size="20" font-weight="700" fill="#111827">ADR112 — bex object storage: two CLI contracts over Wasabi</text>
  <text x="30" y="64" class="t">render ea objects and wrangler r2 are served by bex-api. Wasabi holds the bytes, and a tenant never holds a Wasabi credential.</text>

  <!-- Path A bytes: the bytes bypass bex-api -->
  <path class="flow2" d="M180,120 L180,104 L1085,104 L1085,118"/>
  <g class="badge"><circle cx="232" cy="104" r="11"/><text x="232" y="108">A</text></g>
  <text x="252" y="97" class="t">Contract A: the bytes move client ⇄ Wasabi on the presigned URL and never pass through bex-api</text>

  <!-- Clients -->
  <rect x="30" y="120" width="290" height="215" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="48" y="148" class="h">Clients</text>
  <text x="48" y="172" class="m">render ea objects …</text>
  <text x="48" y="188" class="s">Render CLI and SDKs · presigned URLs (D2)</text>
  <text x="48" y="212" class="m">wrangler r2 … --remote</text>
  <text x="48" y="228" class="s">stock wrangler, three env vars (D3)</text>
  <text x="48" y="262" class="t">No bex CLI is added</text>
  <text x="48" y="278" class="s">bex ea objects passes through (D2)</text>
  <text x="48" y="304" class="t">Not here (D10)</text>
  <text x="48" y="320" class="s">S3 API · custom domains · multipart</text>

  <!-- bex-api -->
  <rect x="400" y="120" width="430" height="325" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="418" y="148" class="h">bex-api · internal/objectstorage</text>
  <text x="418" y="172" class="m">A  /v1/objects/{ownerId}/{region}[/{key}]</text>
  <text x="418" y="188" class="s">Render's four routes · mint a presigned URL</text>
  <text x="418" y="212" class="m">B  /cloudflare/client/v4/accounts/{id}/r2/…</text>
  <text x="418" y="228" class="s">buckets · objects · dev-url · cors · lifecycle</text>
  <text x="418" y="244" class="s">object bytes stream through bex-api (≤ 300 MiB)</text>
  <text x="418" y="272" class="t">a · authorize: FGA relation + OAuth scope class</text>
  <text x="418" y="288" class="s">get can_view_sensitive · write can_create · public can_manage</text>
  <text x="418" y="312" class="t">b · validate: bucket name, key, size</text>
  <text x="418" y="328" class="s">no . or .. segment · wrangler's bucket-name rule</text>
  <text x="418" y="352" class="t">c · quota gate: last sweep + size vs the caps</text>
  <text x="418" y="376" class="t">d · registry: bucket name → obk-id → region</text>
  <text x="418" y="392" class="s">the Wasabi key is &lt;tea-id&gt;/&lt;obk-id&gt;/&lt;key&gt;</text>
  <text x="418" y="424" class="t">credentials not set → today's 404 "not offered"</text>

  <!-- Wasabi, tenant buckets -->
  <rect x="920" y="120" width="330" height="685" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="936" y="146" class="h">Wasabi · tenant buckets (new)</text>
  <text x="936" y="164" class="s">same account as the platform's backups</text>
  <rect x="936" y="180" width="298" height="58" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="950" y="204" class="m">bex-objects-oregon</text>
  <text x="950" y="222" class="s">us-west-1 · hint wnam</text>
  <rect x="936" y="248" width="298" height="58" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="950" y="272" class="m">bex-objects-frankfurt</text>
  <text x="950" y="290" class="s">eu-central-2 · hint weur, jurisdiction eu</text>
  <text x="936" y="336" class="m">&lt;tea-id&gt;/&lt;obk-id&gt;/&lt;key&gt;</text>
  <text x="936" y="354" class="s">obk-id is the bucket's id, not its name</text>
  <text x="936" y="372" class="s">Contract A's namespace is the system</text>
  <text x="936" y="388" class="s">bucket render-&lt;region&gt; of the workspace</text>
  <text x="936" y="414" class="s">private · no versioning, CORS or ACLs here</text>
  <text x="936" y="430" class="s">one read-write IAM user, held by bex-api</text>
  <text x="936" y="446" class="s">one read-only IAM user, held by objectgw</text>
  <text x="936" y="462" class="s">AES-256 at rest is automatic on Wasabi</text>
  <text x="936" y="490" class="t">every other region or hint</text>
  <text x="936" y="506" class="s">→ 400 REGION_NOT_OFFERED (dated divergence)</text>
  <text x="936" y="540" class="t">Why one shared bucket per region</text>
  <text x="936" y="556" class="s">1000 buckets per account by default</text>
  <text x="936" y="572" class="s">free egress is a fair-use ratio (D4)</text>
  <text x="936" y="588" class="s">90-day minimum storage duration (D8)</text>

  <!-- Arrows: requests and answers -->
  <path class="flow" d="M320,172 L400,172"/>
  <g class="badge"><circle cx="360" cy="172" r="11"/><text x="360" y="176">A</text></g>
  <path class="flow" d="M320,212 L400,212"/>
  <g class="badge"><circle cx="360" cy="212" r="11"/><text x="360" y="216">B</text></g>
  <path class="back" d="M400,262 L320,262"/>
  <text x="360" y="254" class="s mid">answers</text>

  <path class="flow" d="M830,172 L920,172"/>
  <g class="badge"><circle cx="875" cy="172" r="11"/><text x="875" y="176">A</text></g>
  <path class="flow2" d="M830,212 L920,212"/>
  <g class="badge"><circle cx="875" cy="212" r="11"/><text x="875" y="216">B</text></g>
  <path class="back" d="M920,262 L830,262"/>
  <text x="875" y="254" class="s mid">answers</text>

  <!-- Bounds -->
  <rect x="30" y="355" width="290" height="235" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="48" y="383" class="h">Bounds · bex's own</text>
  <text x="48" y="407" class="t">100 GB per workspace per region</text>
  <text x="48" y="425" class="t">1M objects per workspace per region</text>
  <text x="48" y="443" class="t">5 GiB per object (A) · 300 MiB (B)</text>
  <text x="48" y="461" class="t">1,000 buckets per workspace</text>
  <text x="48" y="479" class="t">8 concurrent streams per workspace</text>
  <text x="48" y="497" class="t">list ≤ 1000 · presigned URL 15 min</text>
  <text x="48" y="523" class="s">No Render or Cloudflare value was found for</text>
  <text x="48" y="539" class="s">any of these; each is a dated ADR018 entry.</text>

  <!-- Sweep arrow and Postgres -->
  <path class="flow" d="M615,445 L615,483"/>
  <g class="badge"><circle cx="615" cy="464" r="11"/><text x="615" y="468">S</text></g>
  <rect x="400" y="485" width="430" height="165" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="418" y="513" class="h">bex-db · Postgres</text>
  <text x="418" y="535" class="m">object_buckets</text>
  <text x="418" y="551" class="s">obk-id · workspace · name · region · public · cors · lifecycle</text>
  <text x="418" y="573" class="m">object_storage_usage</text>
  <text x="418" y="589" class="s">per bucket: bytes, objects, observed_at</text>
  <text x="418" y="613" class="t">shadow meters · storage GB-s · bytes in and out</text>
  <text x="418" y="629" class="s">no Stripe Price yet · later one cost dimension (D8)</text>

  <!-- Public clients -->
  <rect x="30" y="610" width="290" height="170" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="48" y="638" class="h">Browsers and anyone</text>
  <text x="48" y="662" class="m">GET pub-&lt;id&gt;.onbex.co/&lt;key&gt;</text>
  <text x="48" y="678" class="s">a bucket whose dev-url is enabled (D4)</text>
  <text x="48" y="698" class="s">no credential · GET and HEAD · Range</text>
  <text x="48" y="724" class="t">Never reaches bex-api</text>
  <text x="48" y="740" class="s">objectgw serves it from Wasabi</text>

  <!-- objectgw -->
  <rect x="400" y="670" width="430" height="135" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="418" y="698" class="h">objectgw · public reads (D4, new)</text>
  <text x="418" y="722" class="t">GET and HEAD only · Range · no listing</text>
  <text x="418" y="740" class="s">host pub-&lt;obk-id&gt;.onbex.co → bucket, via bex-api, cached 30 s</text>
  <text x="418" y="756" class="s">bucket CORS rules · nosniff · rate and bandwidth caps</text>
  <text x="418" y="772" class="s">read-only Wasabi credential · kill switch</text>
  <text x="418" y="788" class="s">private or unknown host → 404</text>

  <path class="flow" d="M320,730 L400,730"/>
  <g class="badge"><circle cx="360" cy="730" r="11"/><text x="360" y="734">P</text></g>
  <path class="back" d="M400,768 L320,768"/>
  <path class="flow" d="M830,730 L920,730"/>
  <g class="badge"><circle cx="875" cy="730" r="11"/><text x="875" y="734">P</text></g>
  <path class="back" d="M920,768 L830,768"/>

  <!-- Platform buckets, same account, unchanged -->
  <rect x="30" y="825" width="1220" height="80" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="48" y="851" class="h">Same Wasabi account · platform buckets (unchanged)</text>
  <text x="48" y="871" class="s">bex-tfstate: etcd · OpenBao · CNPG · KV backups · static · disk snapshots · agent attachments</text>
  <text x="48" y="889" class="s">separate buckets and IAM users, one account · a Wasabi egress limit would reach the restore paths too (D1)</text>

  <!-- Flows -->
  <rect x="30" y="925" width="1220" height="235" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.4"/>
  <text x="48" y="952" class="h">Request flows</text>
  <text x="48" y="978" class="t">A · put: the CLI or an SDK posts {sizeBytes}. bex-api authorizes, checks the quota and signs a PUT with Content-Length = sizeBytes. The client uploads straight to Wasabi.</text>
  <text x="48" y="1000" class="t">A · get, delete, list: get and delete HEAD the key first and answer 404 for a missing one. List pages ListObjectsV2 over the system bucket render-&lt;region&gt;.</text>
  <text x="48" y="1022" class="t">B · put: wrangler PUTs the bytes to bex-api with Content-Length. bex-api checks the 300 MiB cap and the quota, then streams them to Wasabi on a server-signed URL.</text>
  <text x="48" y="1044" class="t">B · get, buckets: get HEADs the key and streams it back (a missing key is 404, code 10007). Bucket create, delete, cors, lifecycle and dev-url change Postgres rows only.</text>
  <text x="48" y="1066" class="t">P · public: dev-url enable returns pub-&lt;obk-id&gt;.onbex.co. objectgw looks the host up, applies the bucket's CORS and reads Wasabi with a read-only credential.</text>
  <text x="48" y="1088" class="t">S · sweep, hourly: list each workspace prefix, write usage per bucket, delete objects past a lifecycle rule, and retry the purge of a deleted workspace.</text>
  <text x="48" y="1110" class="t">Bytes in and out are counted exactly on B and on P, and estimated on A. Nothing is billed until the user sets a price, and then through one Stripe dimension.</text>
  <text x="48" y="1142" class="s">Solid arrows are requests. Dashed arrows are answers. Grey is unchanged. Amber marks limits bex chose itself. Badges: A Render contract · B wrangler contract · P public reads · S sweep.</text>
</svg>
