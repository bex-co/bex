<svg xmlns="http://www.w3.org/2000/svg" width="990" height="372" viewBox="0 0 990 372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ADR010 logs — REST, GraphQL and MCP all call Core.Logs / QueryLogs / FollowLogs; Core reads LogHistorySource (Loki, fed by the log-shipper DaemonSet) when BEX_LOKI_URL is set, falls back to PodLogSource, and tails through PodLogStream; every source ends at the App pods</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .h { font-size: 15px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .s { font-size: 12px; fill: #6b7280; text-anchor: middle; }
      .flow { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .fallback { stroke: #334155; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .lbl { font-size: 12px; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .client { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.6; }
      .control { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
      .runtime { fill: #ecfdf5; stroke: #059669; stroke-width: 1.6; }
      .ext { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.6; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="989" height="371" rx="14" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="30" y="46" font-size="22" font-weight="700" fill="#111827">Logs: one Core read, three adapters</text>
  <text x="30" y="70" font-size="13" fill="#4b5563">The dashed arrow is the live fallback when BEX_LOKI_URL is unset.</text>

  <!-- Adapters -->
  <rect class="client" x="30" y="100" width="165" height="76" rx="10"/>
  <text class="h" x="112" y="124">REST</text>
  <text class="s" x="112" y="145">GET /v1/logs</text>
  <text class="s" x="112" y="162">GET /v1/logs/subscribe</text>

  <rect class="client" x="30" y="196" width="165" height="56" rx="10"/>
  <text class="h" x="112" y="219">GraphQL</text>
  <text class="s" x="112" y="239">logs(...)</text>

  <rect class="client" x="30" y="272" width="165" height="56" rx="10"/>
  <text class="h" x="112" y="295">MCP</text>
  <text class="s" x="112" y="315">list_logs</text>

  <!-- Core -->
  <rect class="control" x="255" y="180" width="190" height="80" rx="10"/>
  <text class="h" x="350" y="214">Core</text>
  <text class="s" x="350" y="235">Logs / QueryLogs / FollowLogs</text>

  <!-- Sources -->
  <rect class="control" x="525" y="100" width="190" height="60" rx="10"/>
  <text class="h" x="620" y="125">LogHistorySource</text>
  <text class="s" x="620" y="145">BEX_LOKI_URL</text>

  <rect class="control" x="525" y="190" width="190" height="60" rx="10"/>
  <text class="h" x="620" y="225">PodLogSource</text>

  <rect class="control" x="525" y="280" width="190" height="60" rx="10"/>
  <text class="h" x="620" y="305">PodLogStream</text>
  <text class="s" x="620" y="325">tail</text>

  <!-- Backends -->
  <rect class="ext" x="775" y="100" width="185" height="60" rx="10"/>
  <text class="h" x="867" y="125">Loki</text>
  <text class="s" x="867" y="145">← log-shipper DaemonSet</text>

  <rect class="runtime" x="775" y="200" width="185" height="140" rx="10"/>
  <text class="h" x="867" y="264">App pods</text>
  <text class="s" x="867" y="284">app.bex.co/app label</text>

  <!-- Edges: adapters to Core -->
  <path class="flow" d="M195,138 L253,200"/>
  <path class="flow" d="M195,224 L253,220"/>
  <path class="flow" d="M195,300 L253,240"/>

  <!-- Edges: Core to sources -->
  <path class="flow" d="M445,198 L523,132"/>
  <path class="fallback" d="M445,220 L523,220"/>
  <text class="lbl" x="484" y="212" text-anchor="middle">fallback</text>
  <path class="flow" d="M445,242 L523,308"/>

  <!-- Edges: sources to backends -->
  <path class="flow" d="M715,130 L773,130"/>
  <path class="flow" d="M867,160 L867,198"/>
  <path class="flow" d="M715,220 L773,220"/>
  <path class="flow" d="M715,310 L773,310"/>
</svg>
