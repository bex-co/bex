# Dedicated gVisor sandbox node pool (ADR042 D3 as amended / w3/m32 t004).
#
# Applied to prod 2026-07-28 and validated: a stable (replicas=1, NOT autoscaled
# — an idle burst node gets reclaimed) node, tainted bex.co/sandbox, with
# gVisor (runsc) installed at BOOTSTRAP via preKubeadmCommands (an in-place
# containerd restart on a live node breaks the Cilium datapath). A Pod under
# runtimeClassName: gvisor on this node reports kernel "4.19.0-gvisor" (not the
# host 6.8.0) — confirmed gVisor isolation, no /dev/kvm needed (Hetzner Cloud
# cpx has none, so Kata is impossible here; see ADR042 D3).
#
# Mirrors bex-tenant-0 (baked bex-worker image) + adds: gVisor install, the
# bex.co/pool=sandbox label, the bex.co/sandbox NoSchedule taint and kubelet
# reservations. The generated kubeletExtraArgs use CAPI's list form
# (server-normalized). The MachineDeployment runs the cpx42 template since
# 2026-11-13; the cpx32 and cx33 templates stay for rollback.
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: bex-sandbox
  namespace: bex-capi
spec:
  template:
    spec:
      imageName: bex-worker-k8s-1-34
      placementGroupName: tenant-0
      type: cpx32
---
# cx33 (docs/ADR053): the pool's type until 2026-11-13, kept for rollback;
# cpx32 above is the older fallback for an fsn1 cx stock-out.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: bex-sandbox-cx33
  namespace: bex-capi
spec:
  template:
    spec:
      imageName: bex-worker-k8s-1-34
      placementGroupName: tenant-0
      type: cx33
---
# cpx42, 8 vCPU / 16 GB (ADR105 § Until the AX42-1 arrives, user decision
# 2026-11-12): the cx line is out of stock in eu-central, and four agent
# sandboxes' memory limits came to 2.1 times a cx33's. It has cx43's shape, so
# the pool returns to a cx43 template when stock does. tenant-large, because tenant-0 holds 9
# of the 10 servers a spread group allows.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: bex-sandbox-cpx42
  namespace: bex-capi
spec:
  template:
    spec:
      imageName: bex-worker-k8s-1-34
      placementGroupName: tenant-large
      type: cpx42
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: bex-sandbox
  namespace: bex-capi
spec:
  template:
    spec:
      files:
      - content: 'net.ipv4.conf.lxc*.rp_filter = 0

          '
        owner: root:root
        path: /etc/sysctl.d/99-cilium.conf
        permissions: '0744'
      - content: 'overlay

          br_netfilter

          '
        owner: root:root
        path: /etc/modules-load.d/crio.conf
        permissions: '0744'
      - content: 'net.bridge.bridge-nf-call-iptables  = 1

          net.bridge.bridge-nf-call-ip6tables = 1

          net.ipv4.ip_forward                 = 1

          '
        owner: root:root
        path: /etc/sysctl.d/99-kubernetes-cri.conf
        permissions: '0744'
      - content: 'vm.overcommit_memory=1

          kernel.panic=10

          kernel.panic_on_oops=1

          '
        owner: root:root
        path: /etc/sysctl.d/99-kubelet.conf
        permissions: '0744'
      - content: 'nameserver 1.1.1.1

          nameserver 1.0.0.1

          nameserver 2606:4700:4700::1111

          '
        owner: root:root
        path: /etc/kubernetes/resolv.conf
        permissions: '0744'
      - content: '# Copyright The containerd Authors.

          #

          # Licensed under the Apache License, Version 2.0 (the "License");

          # you may not use this file except in compliance with the License.

          # You may obtain a copy of the License at

          #

          #     http://www.apache.org/licenses/LICENSE-2.0

          #

          # Unless required by applicable law or agreed to in writing, software

          # distributed under the License is distributed on an "AS IS" BASIS,

          # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.

          # See the License for the specific language governing permissions and

          # limitations under the License.

          #

          # https://raw.githubusercontent.com/containerd/containerd/main/containerd.service


          [Unit]

          Description=containerd container runtime

          Documentation=https://containerd.io

          After=network.target local-fs.target dbus.service


          [Service]

          ExecStartPre=-/sbin/modprobe overlay

          ExecStart=/usr/local/bin/containerd


          Type=notify

          Delegate=yes

          KillMode=process

          Restart=always

          RestartSec=5


          # Having non-zero Limit*s causes performance problems due to accounting
          overhead

          # in the kernel. We recommend using cgroups to do container-local accounting.

          LimitNPROC=infinity

          LimitCORE=infinity


          # Comment TasksMax if your systemd version does not supports it.

          # Only systemd 226 and above support this version.

          TasksMax=infinity

          OOMScoreAdjust=-999


          [Install]

          WantedBy=multi-user.target

          '
        owner: root:root
        path: /etc/systemd/system/containerd.service
        permissions: '0744'
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
          - name: anonymous-auth
            value: 'false'
          - name: authentication-token-webhook
            value: 'true'
          - name: authorization-mode
            value: Webhook
          - name: cloud-provider
            value: external
          - name: event-qps
            value: '5'
          - name: eviction-hard
            value: memory.available<512Mi,nodefs.available<10%,imagefs.available<15%
          - name: feature-gates
            value: UserNamespacesSupport=true
          - name: kube-reserved
            value: cpu=500m,memory=512Mi
          - name: kubeconfig
            value: /etc/kubernetes/kubelet.conf
          - name: max-pods
            value: '220'
          - name: node-labels
            value: bex.co/pool=sandbox,bex.co/sandbox=true
          - name: read-only-port
            value: '0'
          - name: resolv-conf
            value: /etc/kubernetes/resolv.conf
          - name: rotate-server-certificates
            value: 'true'
          - name: system-reserved
            value: cpu=500m,memory=1Gi
          - name: tls-cipher-suites
            value: TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_128_GCM_SHA256
          - name: register-with-taints
            value: bex.co/sandbox=true:NoSchedule
      preKubeadmCommands:
      - set -x
      - grep VERSION= /etc/os-release; uname -a
      - /usr/local/bin/containerd --version | grep -q ' v2.3.3 '
      - sed -i '/swap/d' /etc/fstab
      - swapoff -a
      - modprobe overlay && modprobe br_netfilter && sysctl --system
      - mkdir -p /etc/containerd
      - containerd config default > /etc/containerd/config.toml
      - sed -i  "s/SystemdCgroup = false/SystemdCgroup = true/" /etc/containerd/config.toml
      # codex-security round 18 (CWE-494): runsc is the kernel boundary for
      # hostile tenant sandboxes, so the binaries are verified against SHA-512
      # digests pinned in THIS repository — never against checksum files
      # co-fetched from the same origin (a compromised release bucket/publisher
      # would replace binary + checksum together). Pins reviewed 2026-08-20
      # against upstream's published digests:
      #   https://storage.googleapis.com/gvisor/releases/release/20260622.0/x86_64/runsc.sha512
      #   https://storage.googleapis.com/gvisor/releases/release/20260622.0/x86_64/containerd-shim-runsc-v1.sha512
      # x86_64 is the only architecture this pool runs (cpx and cx). The
      # download retries a few times; the gate after the containerd config
      # below is what makes a wrong arch, a failed download or a digest
      # mismatch fatal (w9/074).
      # When bumping the gVisor release, fetch the new .sha512 files from the
      # versioned URL above, verify the binaries against them, and update the
      # two pinned digests in the same commit.
      - ARCH=$(uname -m); GVURL="https://storage.googleapis.com/gvisor/releases/release/20260622.0/${ARCH}";
        RUNSC_SHA512=6df95d09363dbd9ee5d5c889c1549b457e1783b039ff60a8f9f16f8c94c774a2ca2eef5b1c370e36b863f6b0407b53ba3c69051c6ef051253843dabf89a6de4e;
        SHIM_SHA512=87c63197836574b7a2c057d2c0647d2badb679187f0b9175ecf78ac52207cdaa3f101629d3e5d165c95930ca35fe81bc26bb90fcf08e09b99c2ee047b6235ce2;
        for attempt in 1 2 3 4 5; do cd /tmp && rm -f runsc containerd-shim-runsc-v1 &&
        wget -q -T 60 "${GVURL}/runsc" "${GVURL}/containerd-shim-runsc-v1" && break;
        sleep $((attempt * 10)); done;
        test "$ARCH" = x86_64 && echo "$RUNSC_SHA512  runsc" | sha512sum -c - &&
        echo "$SHIM_SHA512  containerd-shim-runsc-v1" | sha512sum -c - &&
        chmod a+rx runsc containerd-shim-runsc-v1 && cp runsc containerd-shim-runsc-v1 /usr/local/bin/
      # w3/m42 (ADR042 D5): disable runsc's default memory-backed rootfs
      # overlay. With the overlay on, tenant filesystem writes live only inside
      # the gVisor sandbox and never reach the host containerd rw layer, so the
      # snapshot commit Job captures a pristine rootfs and pause/resume loses
      # all work. overlay2=none writes through the gofer to the real rw layer —
      # slower FS I/O, correct hibernation.
      - printf '[runsc_config]\n  overlay2 = "none"\n' > /etc/containerd/runsc.toml
      - printf '\n[plugins.'"'"'io.containerd.cri.v1.runtime'"'"'.containerd.runtimes.runsc]\n  runtime_type
        = '"'"'io.containerd.runsc.v1'"'"'\n[plugins.'"'"'io.containerd.cri.v1.runtime'"'"'.containerd.runtimes.runsc.options]\n  TypeUrl
        = '"'"'io.containerd.runsc.v1.options'"'"'\n  ConfigPath = '"'"'/etc/containerd/runsc.toml'"'"'\n'
        >> /etc/containerd/config.toml
      # w9/074 gVisor gate. cloud-init runs every runcmd item from one /bin/sh
      # script without -e, and CAPI appends `kubeadm join` as the next item
      # (bootstrap/kubeadm/pkg/cloudinit/node.go), so a failing check above
      # does NOT stop the join: a node once joined with no runsc and every
      # agent sandbox failed (2026-11-04). This item exits the script before
      # the join unless both binaries are installed with their pinned digests
      # and containerd is configured for them; the bex-sandbox
      # MachineHealthCheck then replaces the machine.
      - test -x /usr/local/bin/runsc && test -x /usr/local/bin/containerd-shim-runsc-v1 &&
        echo "$RUNSC_SHA512  /usr/local/bin/runsc" | sha512sum -c - &&
        echo "$SHIM_SHA512  /usr/local/bin/containerd-shim-runsc-v1" | sha512sum -c - &&
        grep -q runtimes.runsc /etc/containerd/config.toml && grep -q runsc.toml /etc/containerd/config.toml ||
        { echo "bex gVisor bootstrap gate failed, not joining the cluster" >&2; exit 1; }
      - mkdir -p /etc/containerd/certs.d/zot.bex-registry.svc:5000 /etc/containerd/certs.d/zot.local:5000
      - printf 'server = "http://127.0.0.1:30500"\n[host."http://127.0.0.1:30500"]\n  skip_verify
        = true\n  capabilities = ["pull", "resolve"]\n' > /etc/containerd/certs.d/zot.bex-registry.svc:5000/hosts.toml
      - cp /etc/containerd/certs.d/zot.bex-registry.svc:5000/hosts.toml /etc/containerd/certs.d/zot.local:5000/hosts.toml
      - sed -i -E '/^[[:space:]]*\[plugins\..*cri.*\.registry\]$/,/^[[:space:]]*\[/
        s#^([[:space:]]*)config_path =.*#\1config_path = "/etc/containerd/certs.d"#'
        /etc/containerd/config.toml
      - test "$(sed -n '/^[[:space:]]*\[plugins\..*cri.*\.registry\]$/,/^[[:space:]]*\[/
        { /^[[:space:]]*config_path = "/p; }' /etc/containerd/config.toml | wc -l)"
        -eq 1
      - sed -n '/^[[:space:]]*\[plugins\..*cri.*\.registry\]$/,/^[[:space:]]*\[/ {
        /^[[:space:]]*config_path = "/p; }' /etc/containerd/config.toml | grep -q
        'config_path = "/etc/containerd/certs.d"'
      # w5/171: images come from any public registry, as on Render, and containerd
      # pulls them on the node network, outside every pod egress policy. Deny
      # containerd's own cgroup any link-local destination: the instance-metadata
      # service (169.254.169.254, with cloud-init user-data on Hetzner). The drop-in
      # re-applies it on every containerd start, since the rule binds that start's
      # cgroup; a load failure fails the start (ADR022 node-and-metadata-egress).
      - command -v nft
      - printf 'table inet bex_containerd_egress\ndelete table inet bex_containerd_egress\ntable inet bex_containerd_egress {\n  chain output {\n    type filter hook output priority filter; policy accept;\n    socket cgroupv2 level 2 "system.slice/containerd.service" ip daddr 169.254.0.0/16 counter reject\n  }\n}\n' > /etc/bex-containerd-egress.nft
      - mkdir -p /etc/systemd/system/containerd.service.d
      - printf '[Service]\nExecStartPost=/usr/sbin/nft -f /etc/bex-containerd-egress.nft\n' > /etc/systemd/system/containerd.service.d/20-bex-egress.conf
      - systemctl daemon-reload && systemctl enable containerd && systemctl restart
        containerd
      - nft list table inet bex_containerd_egress | grep -q '169.254.0.0/16'
      - systemctl enable kubelet
      - echo 'source <(kubectl completion bash)' >>/root/.bashrc
      - echo 'export KUBECONFIG=/etc/kubernetes/admin.conf' >>/root/.bashrc
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: bex-sandbox
  namespace: bex-capi
  labels: {nodepool: bex-sandbox}
spec:
  clusterName: bex
  replicas: 1
  rolloutAfter: "2026-11-12T09:29:32Z" # CVE-2026-98432: roll onto the kernel-6.8.0-149 snapshot (w1/144; apply out of band)
  selector: {matchLabels: null}
  template:
    metadata:
      labels: {nodepool: bex-sandbox}
    spec:
      clusterName: bex
      failureDomain: fsn1
      version: v1.34.9
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: bex-sandbox
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        name: bex-sandbox-cpx42
---
# w9/074: a sandbox machine whose bootstrap gate refused to join (or whose
# node goes NotReady) is deleted and recreated from the current template.
# No remediationTemplate on purpose: the HCloud remediation reboots the
# server, and cloud-init runcmd does not run again after a reboot.
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineHealthCheck
metadata:
  name: bex-sandbox-unhealthy
  namespace: bex-capi
spec:
  clusterName: bex
  maxUnhealthy: 100%
  nodeStartupTimeout: 20m
  selector:
    matchLabels:
      nodepool: bex-sandbox
  unhealthyConditions:
    - status: Unknown
      timeout: 600s
      type: Ready
    - status: "False"
      timeout: 600s
      type: Ready
