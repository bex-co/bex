apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: bex
  namespace: bex-capi
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.244.0.0/16
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: bex-control-plane
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: HetznerCluster
    name: bex
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  labels:
    nodepool: bex-tenant-0
  name: bex-tenant-0
  namespace: bex-capi
  annotations:
    # Elastic range for the cluster-autoscaler (w1/m3): it discovers this
    # MachineDeployment via clusterName=bex and scales replicas within [min,max].
    # min 1 (w1/m19.1 t005, user decision 2026-07-11): a hosting platform keeps
    # at least one tenant node warm — apps and ACME solvers must never wait for
    # a cold scale-from-zero. cx33 (Intel, 4 vCPU / 8 GB) capacity returned to
    # fsn1 (checked 2026-08-08; ~4.7x cheaper than cpx32 at identical specs), so
    # the immutable template is rotated back to cx33 (docs/ADR053). cpx32 stays
    # the documented fallback for the next fsn1 cx stock-out.
    # max 2 (2026-08-15, docs/ADR060 § dedicated build pool): serving overflow
    # must add a STABLE node here instead of leaking onto the burst/lg build
    # pools and pinning them (observed: single-instance CNPG PDBs made
    # bex-tenant-burst undrainable for 6 days).
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "1"
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "2"
    # Capacity hints (kept for DR bring-up / if min ever returns to 0):
    # cx33 = 4 vCPU / 8 GB (Hetzner API, 2026-08-08).
    capacity.cluster-autoscaler.kubernetes.io/cpu: "4"
    capacity.cluster-autoscaler.kubernetes.io/memory: "8G"
spec:
  clusterName: bex
  # replicas is deliberately UNSET: the autoscaler owns it (w1/m3). With the
  # min/max annotations above, CAPI's defaulting webhook seeds a fresh create at
  # min-size; a `kubectl apply` of this file then never stomps the live count.
  selector:
    matchLabels: null
  template:
    metadata:
      labels:
        nodepool: bex-tenant-0
    spec:
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: bex-tenant-0
      clusterName: bex
      failureDomain: fsn1
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        # Repointed to the rotated template (w1/m36 t001; cx33 rollback per
        # docs/ADR053) — this repoint is what rolls the pool onto the new shape.
        name: bex-tenant-0-k134-cx33
      version: v1.34.9
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  labels:
    nodepool: bex-tenant-burst
  name: bex-tenant-burst
  namespace: bex-capi
  annotations:
    # cx33 (Intel) capacity returned to fsn1 (docs/ADR053); this burst pool is
    # rotated back to cx33. Keep it cold at zero and let Cluster Autoscaler add
    # up to two builders, preserving the tenant pools' former aggregate 1→3 range.
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "0"
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "2"
    # cx33 = 4 vCPU / 8 GB. These hints are required for scale-from-zero.
    capacity.cluster-autoscaler.kubernetes.io/cpu: "4"
    capacity.cluster-autoscaler.kubernetes.io/labels: "bex.co/pool=tenant"
    capacity.cluster-autoscaler.kubernetes.io/memory: "8G"
    # Scale-from-zero simulation must know the build-only taint registered by
    # bex-tenant-build, or CA would scale this pool up for pods that then
    # cannot schedule on the real (tainted) node (docs/ADR060).
    capacity.cluster-autoscaler.kubernetes.io/taints: "bex.co/build-only=true:NoSchedule"
spec:
  clusterName: bex
  # replicas is deliberately unset: Cluster Autoscaler owns it and the CAPI
  # defaulting webhook seeds a fresh deployment at the annotated minimum (0).
  selector:
    matchLabels: null
  template:
    metadata:
      labels:
        bex.co/pool: tenant
        nodepool: bex-tenant-burst
    spec:
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          # bex-tenant-build = the tenant bootstrap + the build-only taint
          # (docs/ADR060 § dedicated build pool): only build pods land here,
          # so nothing long-lived can pin this pool above min-size 0.
          name: bex-tenant-build
      clusterName: bex
      failureDomain: fsn1
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        name: bex-tenant-burst-k134-cx33
      version: v1.34.9
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  labels:
    nodepool: bex-tenant-lg
  name: bex-tenant-lg
  namespace: bex-capi
  annotations:
    # A third tenant pool, ADDITIVE (docs/ADR053 § Large tenant pool). The other
    # two are untouched: this adds one node, it does not rotate any existing one.
    #
    # Why it exists: a build Job requests 2 CPU + 7Gi, and a cx33 has ~7.46 GiB
    # allocatable, so a build only fits on a node that is essentially EMPTY.
    # That makes every build wait for a fresh burst node, and with burst capped
    # at 2, two tenants building at once starve each other — observed 2026-08-11,
    # where a build sat Pending 22 minutes and its deploy was failed by the
    # control-plane gate while the build itself was still healthy.
    #
    # 16 GB changes the arithmetic: two builds fit side by side (2 x 7Gi).
    # min=max=1 keeps it always-on so a build never waits for a cold
    # scale-from-zero. Since docs/ADR060 § dedicated build pool, the node is
    # build-only (taint via bex-tenant-build): the earlier "one build + ~8 GB
    # of ordinary tenant workloads" sharing mode is retired — a long-lived
    # serving pod here would eat the second warm build slot.
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "1"
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "1"
    # cx43 = 8 vCPU / 16 GB (Hetzner API, 2026-08-11).
    capacity.cluster-autoscaler.kubernetes.io/cpu: "8"
    capacity.cluster-autoscaler.kubernetes.io/labels: "bex.co/pool=tenant"
    capacity.cluster-autoscaler.kubernetes.io/memory: "16G"
    # Scale-from-zero simulation hint mirrored from bex-tenant-burst; also
    # documents this pool's taint for operators reading the file.
    capacity.cluster-autoscaler.kubernetes.io/taints: "bex.co/build-only=true:NoSchedule"
spec:
  clusterName: bex
  # replicas deliberately unset, as in the sibling tenant pools: the autoscaler
  # owns it and CAPI's defaulting webhook seeds a fresh create at min-size (1).
  selector:
    matchLabels: null
  template:
    metadata:
      labels:
        bex.co/pool: tenant
        nodepool: bex-tenant-lg
    spec:
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          # bex-tenant-build (docs/ADR060 § dedicated build pool) still stamps
          # node-labels: bex.co/pool=tenant, and additionally registers the
          # build-only taint: this node is reserved for the two warm build
          # slots (2 x 7Gi fits the cx43), serving never lands here.
          name: bex-tenant-build
      clusterName: bex
