kind: HCloudMachineTemplate
metadata:
  name: bex-tenant-0-k134-cpx32
  namespace: bex-capi
spec:
  template:
    spec:
      imageName: bex-worker-k8s-1-34
      placementGroupName: tenant-0
      type: cpx32
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  # cx33 rollback (docs/ADR053): HCloudMachineTemplate.Spec is immutable, so the
  # return to cx33 needs a NEW template the tenant-0 MachineDeployment repoints
  # to — that repoint is what rolls the pool. Same x86 baked snapshot as the
  # -cpx32 sibling (cx33 and cpx32 are both x86_64, 4 vCPU / 8 GB — portable).
  name: bex-tenant-0-k134-cx33
  namespace: bex-capi
spec:
  template:
    spec:
      imageName: bex-worker-k8s-1-34
      placementGroupName: tenant-0
      type: cx33
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  # The bex-tenant-lg pool's shape: cx43, 8 vCPU / 16 GB (docs/ADR053 § Large
  # tenant pool). Same x86 baked snapshot and placement group as every other
  # tenant template — only the type differs, so nothing about bring-up changes.
  #
  # cx43, not the cx53 originally asked for: cx53 is NOT creatable. Hetzner's
  # datacenter `available` list is unreliable for the whole cx line (it reports
  # cx33/cx43/cx53 unavailable in all six DCs while cx33 nodes demonstrably
  # create), so each type was probed by actually creating and deleting one on
  # 2026-08-11 — cx43 and cx33 succeeded, cx53 failed `resource_unavailable —
  # error during placement`. Re-probe before assuming cx53 has returned.
  name: bex-tenant-lg-k134-cx43
  namespace: bex-capi
spec:
  template:
    spec:
      imageName: bex-worker-k8s-1-34
      placementGroupName: tenant-0
      type: cx43
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: bex-tenant-burst-k132
  namespace: bex-capi
spec:
  template:
    spec:
      imageName: bex-worker-k8s-1-32
      placementGroupName: tenant-0
      type: cpx32
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: bex-tenant-burst-k133
  namespace: bex-capi
spec:
  template:
    spec:
      imageName: bex-worker-k8s-1-33
      placementGroupName: tenant-0
      type: cpx32
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: bex-tenant-burst-k134
  namespace: bex-capi
spec:
  template:
    spec:
      imageName: bex-worker-k8s-1-34
      placementGroupName: tenant-0
      type: cpx32
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  # cx33 rollback (docs/ADR053): new immutable template the tenant-burst
  # MachineDeployment repoints to. Same x86 baked snapshot as the -cpx32
  # sibling; cx33 is the cheaper default now that fsn1 stock returned.
  name: bex-tenant-burst-k134-cx33
  namespace: bex-capi
spec:
  template:
    spec:
      imageName: bex-worker-k8s-1-34
      placementGroupName: tenant-0
      type: cx33
