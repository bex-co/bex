---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HetznerCluster
metadata:
  name: bex
  namespace: bex-capi
spec:
  controlPlaneEndpoint:
    host: ""
    port: 443
  controlPlaneLoadBalancer:
    region: fsn1
  controlPlaneRegions:
    - fsn1
  # Private network, CAPH-OWNED (docs/rearchitecture.md decision 1): CAPH
  # creates a network named after the cluster (`bex`), attaches every machine
  # it creates (CP + workers), validates their CSR addresses, and gives both
  # LBs private targets (kube-api via CAPH, Traefik via the CCM's
  # use-private-ip annotation — CCM's HCLOUD_NETWORK=bex matches this name).
  # ⚠ IMMUTABLE after cluster creation — this field only ever takes effect on
  # a fresh HetznerCluster (w1/m19 t006 rebuild); never edit it on a live one
  # (that deadlock is what rearchitecture.md exists to bury).
  # 10.10.0.0/16 deliberately differs from the infra cluster's `bex-infra`
  # network (10.0.0.0/16, Terraform): the two clusters share no L3, and the
  # distinct range makes any accidental cross-attachment obvious.
  hcloudNetwork:
    enabled: true
    cidrBlock: "10.10.0.0/16"
    subnetCidrBlock: "10.10.0.0/24"
    networkZone: eu-central
  hcloudPlacementGroups:
    - name: control-plane
      type: spread
    - name: tenant-0
      type: spread
    - name: platform
      type: spread
  hetznerSecretRef:
    key:
      hcloudToken: hcloud
      hetznerRobotPassword: robot-password
      hetznerRobotUser: robot-user
    name: hetzner
  sshKeys:
    hcloud:
      - name: bex
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: bex-platform
  namespace: bex-capi
spec:
  template:
    spec:
      files:
        - content: |
            net.ipv4.conf.lxc*.rp_filter = 0
          owner: root:root
          path: /etc/sysctl.d/99-cilium.conf
          permissions: "0744"
        - content: |
            overlay
            br_netfilter
          owner: root:root
          path: /etc/modules-load.d/crio.conf
          permissions: "0744"
        - content: |
            net.bridge.bridge-nf-call-iptables  = 1
            net.bridge.bridge-nf-call-ip6tables = 1
            net.ipv4.ip_forward                 = 1
          owner: root:root
          path: /etc/sysctl.d/99-kubernetes-cri.conf
          permissions: "0744"
        - content: |
            vm.overcommit_memory=1
            kernel.panic=10
            kernel.panic_on_oops=1
          owner: root:root
          path: /etc/sysctl.d/99-kubelet.conf
          permissions: "0744"
        - content: |
            nameserver 1.1.1.1
            nameserver 1.0.0.1
            nameserver 2606:4700:4700::1111
          owner: root:root
          path: /etc/kubernetes/resolv.conf
          permissions: "0744"
        - content: |
            # Copyright The containerd Authors.
            #
            # Licensed under the Apache License, Version 2.0 (the "License");
            # you may not use this file except in compliance with the License.
            # You may obtain a copy of the License at
            #
            #     http://www.apache.org/licenses/LICENSE-2.0
            #
            # Unless required by applicable law or agreed to in writing, software
            # distributed under the License is distributed on an "AS IS" BASIS,
            # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
            # See the License for the specific language governing permissions and
            # limitations under the License.
            #
            # https://raw.githubusercontent.com/containerd/containerd/main/containerd.service

            [Unit]
            Description=containerd container runtime
            Documentation=https://containerd.io
            After=network.target local-fs.target dbus.service

            [Service]
            ExecStartPre=-/sbin/modprobe overlay
            ExecStart=/usr/local/bin/containerd

            Type=notify
            Delegate=yes
            KillMode=process
            Restart=always
            RestartSec=5

            # Having non-zero Limit*s causes performance problems due to accounting overhead
            # in the kernel. We recommend using cgroups to do container-local accounting.
            LimitNPROC=infinity
            LimitCORE=infinity

            # Comment TasksMax if your systemd version does not supports it.
            # Only systemd 226 and above support this version.
            TasksMax=infinity
            OOMScoreAdjust=-999

            [Install]
            WantedBy=multi-user.target
          owner: root:root
          path: /etc/systemd/system/containerd.service
          permissions: "0744"
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            anonymous-auth: "false"
            authentication-token-webhook: "true"
            authorization-mode: Webhook
            cloud-provider: external
            event-qps: "5"
            feature-gates: UserNamespacesSupport=true
            kubeconfig: /etc/kubernetes/kubelet.conf
            max-pods: "220"
            read-only-port: "0"
            resolv-conf: /etc/kubernetes/resolv.conf
            rotate-server-certificates: "true"
            tls-cipher-suites: TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_128_GCM_SHA256
            node-labels: bex.co/pool=platform
          taints:
            - key: bex.co/platform
              value: "true"
              effect: NoSchedule
      preKubeadmCommands:
        - set -x
        - grep VERSION= /etc/os-release; uname -a
        # Same stale-snapshot guard as the tenant pool.
        - /usr/local/bin/containerd --version | grep -q ' v2.3.3 '
        - sed -i '/swap/d' /etc/fstab
        - swapoff -a
        - modprobe overlay && modprobe br_netfilter && sysctl --system
        - mkdir -p /etc/containerd
        - containerd config default > /etc/containerd/config.toml
        - sed -i  "s/SystemdCgroup = false/SystemdCgroup = true/" /etc/containerd/config.toml
        # containerd.io's package post-install may already have started the
        # service against its old config. Restart so the generated CRI config
        # above is loaded before kubeadm checks RuntimeService.
        - systemctl daemon-reload && systemctl enable containerd && systemctl restart containerd
        - systemctl enable kubelet
        - echo 'source <(kubectl completion bash)' >>/root/.bashrc
        - echo 'export KUBECONFIG=/etc/kubernetes/admin.conf' >>/root/.bashrc
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  labels:
    nodepool: bex-platform
  name: bex-platform
  namespace: bex-capi
  annotations:
    # Elastic range for the cluster-autoscaler (w1/m3): it discovers this
    # MachineDeployment via clusterName=bex and scales replicas within [min,max].
    # min 3: prod OpenBao runs three required-anti-affinity Raft members. A
    # two-node floor leaves one member Pending and lets an autoscaler scale-down
    # race an intentional MachineDeployment roll, draining two nodes together.
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "3"
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "3"
    # Capacity hints (used by scale-from-zero; kept for symmetry with the pools):
    # cx33 = 4 vCPU / 8 GB (Hetzner API, 2026-08-08).
    capacity.cluster-autoscaler.kubernetes.io/cpu: "4"
    capacity.cluster-autoscaler.kubernetes.io/memory: "8G"
spec:
  clusterName: bex
  # replicas is deliberately UNSET: the autoscaler owns it (w1/m3). With the
  # min/max annotations above, CAPI's defaulting webhook seeds a fresh create at
  # min-size; a `kubectl apply` of this file then never stomps the live count.
  selector:
    matchLabels: null
  template:
    metadata:
      labels:
        nodepool: bex-platform
    spec:
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: bex-platform
      clusterName: bex
      failureDomain: fsn1
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        name: bex-platform-k134-cx33
      version: v1.34.9
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: bex-platform-k132
  namespace: bex-capi
spec:
  template:
    spec:
      imageName: bex-worker-k8s-1-32
      placementGroupName: platform
      type: cx33
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  # A new immutable template name is required for the cx33 → cpx32 migration.
  name: bex-platform-k133-cpx32
  namespace: bex-capi
spec:
  template:
    spec:
      imageName: bex-worker-k8s-1-33
      placementGroupName: platform
      type: cpx32
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: bex-platform-k134-cpx32
  namespace: bex-capi
spec:
  template:
    spec:
      imageName: bex-worker-k8s-1-34
      placementGroupName: platform
      type: cpx32
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  # cx33 rollback (docs/ADR053): new immutable template the platform
  # MachineDeployment repoints to. Same x86 baked snapshot as the -cpx32
  # sibling; cx33 is the cheaper default now that fsn1 stock returned.
  name: bex-platform-k134-cx33
  namespace: bex-capi
spec:
  template:
    spec:
      imageName: bex-worker-k8s-1-34
      placementGroupName: platform
      type: cx33
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineHealthCheck
metadata:
  name: bex-platform-unhealthy-5m
  namespace: bex-capi
spec:
  clusterName: bex
  maxUnhealthy: 100%
  nodeStartupTimeout: 10m
  remediationTemplate:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: HCloudRemediationTemplate
    name: worker-remediation-request
  selector:
    matchLabels:
      nodepool: bex-platform
  unhealthyConditions: # Ready 600s (t006): fresh nodes stay NotReady until CNI converges (pulls + cilium init retries) — 180s remediated healthy joins mid-bring-up
    - status: Unknown
      timeout: 600s
      type: Ready
    - status: "False"
      timeout: 600s
      type: Ready
