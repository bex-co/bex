apiVersion: v1
kind: Namespace
metadata:
  name: bex-capi
  labels:
    app.kubernetes.io/part-of: bex
    app.kubernetes.io/managed-by: cluster-api
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: bex-tenant-0
  namespace: bex-capi
spec:
  template:
    spec:
      files:
        - content: |
            net.ipv4.conf.lxc*.rp_filter = 0
          owner: root:root
          path: /etc/sysctl.d/99-cilium.conf
          permissions: "0744"
        - content: |
            overlay
            br_netfilter
          owner: root:root
          path: /etc/modules-load.d/crio.conf
          permissions: "0744"
        - content: |
            net.bridge.bridge-nf-call-iptables  = 1
            net.bridge.bridge-nf-call-ip6tables = 1
            net.ipv4.ip_forward                 = 1
          owner: root:root
          path: /etc/sysctl.d/99-kubernetes-cri.conf
          permissions: "0744"
        - content: |
            vm.overcommit_memory=1
            kernel.panic=10
            kernel.panic_on_oops=1
          owner: root:root
          path: /etc/sysctl.d/99-kubelet.conf
          permissions: "0744"
        - content: |
            nameserver 1.1.1.1
            nameserver 1.0.0.1
            nameserver 2606:4700:4700::1111
          owner: root:root
          path: /etc/kubernetes/resolv.conf
          permissions: "0744"
        - content: |
            # Copyright The containerd Authors.
            #
            # Licensed under the Apache License, Version 2.0 (the "License");
            # you may not use this file except in compliance with the License.
            # You may obtain a copy of the License at
            #
            #     http://www.apache.org/licenses/LICENSE-2.0
            #
            # Unless required by applicable law or agreed to in writing, software
            # distributed under the License is distributed on an "AS IS" BASIS,
            # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
            # See the License for the specific language governing permissions and
            # limitations under the License.
            #
            # https://raw.githubusercontent.com/containerd/containerd/main/containerd.service

            [Unit]
            Description=containerd container runtime
            Documentation=https://containerd.io
            After=network.target local-fs.target dbus.service

            [Service]
            ExecStartPre=-/sbin/modprobe overlay
            ExecStart=/usr/local/bin/containerd

            Type=notify
            Delegate=yes
            KillMode=process
            Restart=always
            RestartSec=5

            # Having non-zero Limit*s causes performance problems due to accounting overhead
            # in the kernel. We recommend using cgroups to do container-local accounting.
            LimitNPROC=infinity
            LimitCORE=infinity

            # Comment TasksMax if your systemd version does not supports it.
            # Only systemd 226 and above support this version.
            TasksMax=infinity
            OOMScoreAdjust=-999

            [Install]
            WantedBy=multi-user.target
          owner: root:root
          path: /etc/systemd/system/containerd.service
          permissions: "0744"
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            anonymous-auth: "false"
            authentication-token-webhook: "true"
            authorization-mode: Webhook
            cloud-provider: external
            event-qps: "5"
            feature-gates: UserNamespacesSupport=true
            kubeconfig: /etc/kubernetes/kubelet.conf
            max-pods: "220"
            # Tenant Apps and every tenant-controlled execution Job are pinned
            # here; the separately tainted bex.co/pool=platform pool is never
            # eligible for them.
            node-labels: bex.co/pool=tenant
            read-only-port: "0"
            resolv-conf: /etc/kubernetes/resolv.conf
            rotate-server-certificates: "true"
            tls-cipher-suites: TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_128_GCM_SHA256
      # runc, containerd, and kubelet/kubeadm/kubectl are baked into the worker
      # snapshot this pool boots (HCloudMachineTemplate
      # bex-tenant-0-k134-cx33); imageName is selected by
      # infra/packer/release.conf and baked by infra/packer/bex-worker.pkr.hcl
      # (w1/m36 t001).
      # That took the ~350MB of github.com/pkgs.k8s.io downloads (runc+containerd
      # +kubelet, ~150MB) AND the CP image pre-pull (`kubeadm config images pull`,
      # ~200MB — t002) off the autoscaler scale-up hot path. What remains only
      # wires the runtime up from the baked binaries + the cloud-init files: above;
      # none of it touches the network. apt list trimmed to nothing here (socat/
      # logrotate are baked; at/jq/unzip/mtr/apt-transport-https were unused — t003).
      # ⚠️ These commands assume the baked image — a change that points imageName
      # back at ubuntu-24.04 boots a node with no container runtime (guarded by
      # scripts/clusterapi-validate.sh).
      preKubeadmCommands:
        - set -x
        - grep VERSION= /etc/os-release; uname -a
        # Fail closed if the labelled snapshot is stale: hostUsers=false build
        # Pods require containerd 2.x user-namespace support.
        - /usr/local/bin/containerd --version | grep -q ' v2.3.3 '
        - sed -i '/swap/d' /etc/fstab
        - swapoff -a
        - modprobe overlay && modprobe br_netfilter && sysctl --system
        - mkdir -p /etc/containerd
        - containerd config default > /etc/containerd/config.toml
        - sed -i  "s/SystemdCgroup = false/SystemdCgroup = true/" /etc/containerd/config.toml
        # w1/m26 t001: kubelet resolves "zot.bex-registry.svc" via host DNS
        # (not kube-dns), so the ClusterIP is unreachable. NodePort 30500 on
        # 127.0.0.1 is always reachable from any node; skip_verify permits the
        # plain-HTTP internal registry. Written here (not files:) because the
        # parent dir doesn't exist yet when cloud-init write_files runs.
        - mkdir -p /etc/containerd/certs.d/zot.bex-registry.svc:5000 /etc/containerd/certs.d/zot.local:5000
        - printf 'server = "http://127.0.0.1:30500"\n[host."http://127.0.0.1:30500"]\n  skip_verify = true\n  capabilities = ["pull", "resolve"]\n' > /etc/containerd/certs.d/zot.bex-registry.svc:5000/hosts.toml
        - cp /etc/containerd/certs.d/zot.bex-registry.svc:5000/hosts.toml /etc/containerd/certs.d/zot.local:5000/hosts.toml
        # Enable per-registry config so the hosts.toml above takes effect.
        # containerd 1.x and 2.x use different CRI plugin section names and
        # quote styles. Both also have an unrelated transfer config_path, so
        # update and verify only the CRI registry section.
        - sed -i -E '/^[[:space:]]*\[plugins\..*cri.*\.registry\]$/,/^[[:space:]]*\[/ s#^([[:space:]]*)config_path =.*#\1config_path = "/etc/containerd/certs.d"#' /etc/containerd/config.toml
        - test "$(sed -n '/^[[:space:]]*\[plugins\..*cri.*\.registry\]$/,/^[[:space:]]*\[/ { /^[[:space:]]*config_path = "/p; }' /etc/containerd/config.toml | wc -l)" -eq 1
        - sed -n '/^[[:space:]]*\[plugins\..*cri.*\.registry\]$/,/^[[:space:]]*\[/ { /^[[:space:]]*config_path = "/p; }' /etc/containerd/config.toml | grep -q 'config_path = "/etc/containerd/certs.d"'
        # containerd.io's package post-install may already have started the
        # service against its old config. Restart so the generated CRI config
        # above is loaded before kubeadm checks RuntimeService.
        - systemctl daemon-reload && systemctl enable containerd && systemctl restart containerd
        - systemctl enable kubelet
        - echo 'source <(kubectl completion bash)' >>/root/.bashrc
        - echo 'export KUBECONFIG=/etc/kubernetes/admin.conf' >>/root/.bashrc
---
# Bootstrap for the DEDICATED BUILD pools (bex-tenant-lg, bex-tenant-burst):
# byte-identical to bex-tenant-0 above except for the registered taint below.
# Keep the two templates in sync when touching files/preKubeadmCommands.
