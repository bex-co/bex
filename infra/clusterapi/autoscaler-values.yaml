# Cluster Autoscaler (clusterapi provider) — the reactive add/remove-machine
# engine (w1/m3). One SHARED values file, two lifecycle homes (w1/m19.1):
#   prod (steady state): IN the self-managed app cluster, Argo-managed
#     (deploy/gitops/base/autoscaler.yaml, clusterAPIMode=incluster-incluster —
#     CAPI objects live in the same cluster since the clusterctl-move pivot;
#     no kubeconfig secret needed)
#   bootstrap/DR + local mock: on the temporary mgmt cluster
#     (scripts/install-autoscaler.sh sets kubeconfig-incluster + the
#     CAPI-generated bex-kubeconfig secret; scripts/mock-cluster.sh — the
#     mock never pivots)
#
# Install into ns `default` — CAPI Cluster/MachineDeployment objects live there
# (and, bootstrap-phase, the chart mounts bex-kubeconfig from that namespace).
#
# Scaling behavior: only MachineDeployments of Cluster `bex` that carry the
# cluster-api-autoscaler-node-group-{min,max}-size annotations are managed
# (infra/clusterapi/overlays/*/cluster.yaml). Scale-up triggers on unschedulable
# pods; scale-from-zero reads the capacity.cluster-autoscaler annotations
# (tenant pool floor is min 1 since m19.1 t005). The autoscaler moves machines,
# never App spec.replicas.
cloudProvider: clusterapi

# clusterAPIMode is deliberately NOT set here — it differs by lifecycle phase
# and is passed by the caller (w1/m19 t004):
#   bootstrap (pre-pivot, mgmt cluster):  install-autoscaler.sh sets
#     kubeconfig-incluster + clusterAPIKubeconfigSecret=bex-kubeconfig
#   steady state (post-pivot, in-cluster): the Argo Application
#     (deploy/gitops/base/autoscaler.yaml) sets incluster-incluster (no secret)

autoDiscovery:
  clusterName: bex

rbac:
  # The chart's clusterapi rules stop at cluster.x-k8s.io; the provider also
  # reads infra machine templates (capacity for scale-from-zero): CAPD
  # dockermachinetemplates locally, CAPH hcloudmachinetemplates in prod.
  additionalRules:
    - apiGroups:
        - infrastructure.cluster.x-k8s.io
      resources:
        - "*"
      verbs:
        - get
        - list
        - watch

extraArgs:
  # Cilium deliberately registers each new node with this NoSchedule taint and
  # removes it once the agent is healthy. Tell CA it is a startup-only taint so
  # a scale-from-zero node template does not reject the very Pending pod that
  # should create the node (observed on prod after the Kubernetes 1.34 roll).
  startup-taint: node.cilium.io/agent-not-ready
  # Release emptied nodes faster than the 10m upstream defaults — density is the
  # economics here (bin-pack + free-tier sleep) — while staying well clear of
  # thrash. A drained node stops billing ~5m after its last pod leaves.
  scale-down-unneeded-time: 5m
  scale-down-delay-after-add: 5m
