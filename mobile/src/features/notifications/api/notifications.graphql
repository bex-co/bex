query MobileNotificationDeviceSubscriptions($ownerId: String!) {
  pushNotificationsAvailable(ownerId: $ownerId)
  notificationDeviceSubscriptions(ownerId: $ownerId) {
    deviceId
    provider
    platform
    preferenceRef
    createdAt
    updatedAt
    lastRegisteredAt
  }
}

mutation MobileRegisterNotificationDeviceSubscription(
  $ownerId: String!
  $deviceId: String!
  $sessionId: String!
  $provider: String!
  $platform: String!
  $token: String!
) {
  registerNotificationDeviceSubscription(
    ownerId: $ownerId
    deviceId: $deviceId
    sessionId: $sessionId
    provider: $provider
    platform: $platform
    token: $token
  ) {
    deviceId
    provider
    platform
    preferenceRef
    createdAt
    updatedAt
    lastRegisteredAt
  }
}

mutation MobileUnregisterNotificationDeviceSubscription(
  $ownerId: String!
  $deviceId: String!
) {
  unregisterNotificationDeviceSubscription(
    ownerId: $ownerId
    deviceId: $deviceId
  )
}

query MobileNotificationInbox($ownerId: String!, $limit: Int!) {
  notificationInbox(ownerId: $ownerId, limit: $limit) {
    id
    event
    title
    body
    deepLink
    occurredAt
    readAt
  }
  unreadPushNotificationCount(ownerId: $ownerId)
}

mutation MobileMarkPushNotificationRead($ownerId: String!, $id: String!) {
  markPushNotificationRead(ownerId: $ownerId, id: $id)
}
