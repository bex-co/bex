query MobileAgentSessions($ownerId: String!) {
  agentSessions(ownerId: $ownerId) {
    id
    repo
    branch
    phase
    status
    prNumber
    prUrl
    failureReason
    createdAt
    updatedAt
  }
}

query MobileAgentSessionCapabilities($ownerId: String!) {
  agentSessionCapabilities(ownerId: $ownerId) {
    enabled
    ready
    modelKeyReady
    github {
      connected
      accountLogin
      installUrl
    }
    agents {
      id
      label
    }
  }
}

query MobileAgentRepos($ownerId: String!) {
  repos(ownerId: $ownerId) {
    fullName
    defaultBranch
    private
  }
}

mutation MobileCreateAgentSession(
  $ownerId: String!
  $repo: String!
  $branch: String!
  $agentConfig: AgentSessionConfigInput!
) {
  createAgentSession(
    ownerId: $ownerId
    repo: $repo
    branch: $branch
    agentConfig: $agentConfig
  ) {
    id
    repo
    branch
    phase
    status
    createdAt
  }
}

query MobileAgentSession($id: String!) {
  agentSession(id: $id) {
    id
    repo
    branch
    sandboxId
    phase
    status
    headSha
    prUrl
    prNumber
    failureReason
    turns
    deliveryMode
    createdAt
    updatedAt
    canceledAt
  }
}

mutation MobileCancelAgentSession($id: String!) {
  cancelAgentSession(id: $id) {
    id
    phase
    status
    canceledAt
  }
}

query MobileAgentSessionConversation($id: String!) {
  agentSessionConversation(id: $id) {
    sessionId
    cursor
    turns {
      turn
      idempotencyKey
      role
      prompt
      status
      deliveryMode
      assistantStartSeq
      assistantEndSeq
      assistantParts
      failureReason
      acceptedAt
      completedAt
      failedAt
      canceledAt
    }
  }
}

mutation MobileAttachAgentSession($id: String!, $action: String!) {
  attachAgentSession(id: $id, action: $action) {
    id
    ticket
    url
    expiresAt
  }
}

query MobileAgentSessionDecisions($id: String!) {
  agentSessionDecisions(id: $id) {
    id
    sessionId
    turn
    type
    status
    version
    message
    responseSchemaJson
    actions {
      id
      label
      kind
    }
    externalUrl
    expiresAt
    updatedAt
  }
}

mutation MobileRespondAgentSessionDecision(
  $id: String!
  $decisionId: String!
  $version: Int!
  $action: String!
  $valueJson: String
) {
  respondAgentSessionDecision(
    id: $id
    decisionId: $decisionId
    version: $version
    action: $action
    valueJson: $valueJson
  ) {
    id
    status
    version
    updatedAt
  }
}
