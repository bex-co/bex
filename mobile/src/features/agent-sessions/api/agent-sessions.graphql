query MobileAgentSessions($ownerId: String!) {
  agentSessions(ownerId: $ownerId) {
    id
    repo
    branch
    phase
    status
    prNumber
    prUrl
    failureReason
    createdAt
    updatedAt
  }
}

# Each agent's `model` is what a session that names none runs and `models`
# what it may name (w10/m516): the platform catalog the workspace's admins left
# on (w10/m527), a fixed model's one entry, or empty on the workspace's own key.
# `templates` are the sandbox templates a session may name, smallest first, and
# `defaultTemplate` the one a session that names none runs on (w10/m519).
query MobileAgentSessionCapabilities($ownerId: String!) {
  agentSessionCapabilities(ownerId: $ownerId) {
    enabled
    ready
    modelKeyReady
    github {
      connected
      accountLogin
      installUrl
    }
    agents {
      id
      label
      model
      models
    }
    defaultTemplate
    templates {
      name
      cpu
      memoryGb
    }
  }
}

query MobileAgentRepos($ownerId: String!) {
  repos(ownerId: $ownerId) {
    fullName
    defaultBranch
    private
  }
}

mutation MobileCreateAgentSession(
  $ownerId: String!
  $repo: String!
  $branch: String!
  $agentConfig: AgentSessionConfigInput!
) {
  createAgentSession(
    ownerId: $ownerId
    repo: $repo
    branch: $branch
    agentConfig: $agentConfig
  ) {
    id
    repo
    branch
    phase
    status
    createdAt
  }
}

query MobileAgentSession($id: String!) {
  agentSession(id: $id) {
    id
    repo
    branch
    phase
    status
    headSha
    prUrl
    prNumber
    failureReason
    deliveryNote
    turns
    deliveryMode
    createdAt
    updatedAt
    canceledAt
  }
}

mutation MobileCancelAgentSession($id: String!) {
  cancelAgentSession(id: $id) {
    id
    phase
    status
    canceledAt
  }
}
