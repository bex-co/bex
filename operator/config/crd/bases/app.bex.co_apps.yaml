---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: apps.app.bex.co
spec:
  group: app.bex.co
  names:
    kind: App
    listKind: AppList
    plural: apps
    singular: app
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.activeRevision
      name: Revision
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .spec.repo
      name: Repo
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: App is the Schema for the services API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of App
            properties:
              autoDeploy:
                description: AutoDeploy triggers a deploy on each push to Branch.
                type: boolean
              branch:
                default: main
                description: Branch to track. Defaults to "main".
                type: string
              builder:
                default: auto
                description: |-
                  Builder selects how the image is built:
                  "auto" (Dockerfile if present, else Cloud Native Buildpacks), "buildpack", or "dockerfile".
                enum:
                - auto
                - buildpack
                - dockerfile
                type: string
              expose:
                description: |-
                  Expose, when true and the controller's BEX_BASE_DOMAIN env is set, serves the
                  App at the platform hostname "<name>.<BEX_BASE_DOMAIN>" (in addition to Host
                  and Hosts, if given). Requires wildcard DNS for the base domain.
                type: boolean
              healthCheckPath:
                default: /
                description: HealthCheckPath polled for 2xx before traffic is shifted
                  to a new revision.
                type: string
              host:
                description: |-
                  Host is the primary external FQDN to expose this App at (e.g.
                  "beancount.1.2.3.4.sslip.io", or a tenant's custom domain). On the kubernetes
                  runtime the operator creates an Ingress (+ TLS via cert-manager) routing this
                  host to the App's Service. When neither Host, Expose nor Hosts yields a host =>
                  in-cluster only (ClusterIP). Host keeps first position in the effective host
                  list, so existing Apps keep their "<name>-tls" certificate secret untouched.
                type: string
              hosts:
                description: |-
                  Hosts are additional external FQDNs to serve this App at — typically tenants'
                  custom domains, CNAME'd to the platform hostname. Every effective host gets its
                  own Ingress rule and its own cert-manager certificate/secret, so one domain's
                  broken DNS can never block another's issuance or renewal.
                items:
                  type: string
                type: array
              idleTTLSeconds:
                description: IdleTTLSeconds before the service hibernates ("sleep
                  = free"). 0 = controller default.
                format: int32
                type: integer
              image:
                description: Image is a prebuilt OCI image to run directly, skipping
                  the build plane.
                type: string
              port:
                default: 3000
                description: Port the application listens on (PORT is injected).
                format: int32
                type: integer
              replicas:
                default: 1
                description: Replicas for the kubernetes runtime (pods bin-packed
                  across machines/nodes).
                format: int32
                type: integer
              repo:
                description: |-
                  Repo is the git repository URL (or local path) to deploy from. Either Repo
                  (build-from-git) or Image (prebuilt) must be set.
                type: string
              tier:
                description: |-
                  Tier is the plan/size; the operator sets the pod's resources (requests==limits)
                  from it. Empty => no resource constraints (best-effort); the control plane sets
                  a tier explicitly. Resource ladder lives in docs/control-plane.md.
                enum:
                - free
                - starter
                - standard
                - pro
                - pro-plus
                - pro-max
                - pro-ultra
                type: string
            type: object
          status:
            description: status defines the observed state of App
            properties:
              activeRevision:
                description: ActiveRevision currently serving traffic (e.g. "rev_5").
                type: string
              conditions:
                description: Conditions represent the current state (Ready / Progressing
                  / Degraded).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: Endpoint is the raw runtime target for the edge ("host:port/prefix").
                type: string
              image:
                description: Image is the OCI image of the active revision.
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation the controller
                  last reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is the high-level lifecycle state.
                enum:
                - Pending
                - Building
                - Deploying
                - Running
                - Hibernated
                - Failed
                type: string
              sandboxID:
                description: SandboxID is the runtime handle of the active revision
                  (OpenSandbox sandbox id).
                type: string
              url:
                description: URL is the canonical serving URL (first effective host).
                type: string
              urls:
                description: URLs are all serving URLs when the App has multiple hosts
                  (canonical first).
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
