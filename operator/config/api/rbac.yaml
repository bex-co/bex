# bex-api touches Apps and Databases (the product resources) and reads the
# CNPG-generated connection Secrets — least privilege. It writes intent (App
# lifecycle fields, Database CRs); the operator does all the mechanism.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: api-role
rules:
  - apiGroups: ["app.bex.co"]
    resources: ["apps"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["app.bex.co"]
    resources: ["apps/status"]
    verbs: ["get"]
  - apiGroups: ["app.bex.co"]
    resources: ["databases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["app.bex.co"]
    resources: ["databases/status"]
    verbs: ["get"]
  # read the CNPG-generated "<db>-app" Secret to assemble connection strings
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: api-role
subjects:
  - kind: ServiceAccount
    name: api
    namespace: system
