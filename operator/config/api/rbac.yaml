# bex-api touches Apps and Databases (the product resources), reads the
# CNPG-generated connection Secrets, and reads App pods' logs — least privilege.
# It writes intent (App lifecycle fields, Database CRs); the operator does all
# the mechanism. Pod read + pods/log is where the list_logs verb
# (REST/GraphQL/MCP) tails an App's instance logs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: api-role
rules:
  - apiGroups: ["app.bex.co"]
    resources: ["apps"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["app.bex.co"]
    resources: ["apps/status"]
    verbs: ["get"]
  - apiGroups: ["app.bex.co"]
    resources: ["databases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["app.bex.co"]
    resources: ["databases/status"]
    verbs: ["get"]
  # read the CNPG-generated "<db>-app" Secret to assemble connection strings
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  # Read-only pod access for the logs verb: list pods by App label, read logs.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: api-role
subjects:
  - kind: ServiceAccount
    name: api
    namespace: system
