# bex-api can touch Apps and nothing else — least privilege. It patches
# spec.suspended / spec.restartedAt; the operator does all the mechanism.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: api-role
rules:
  - apiGroups: ["app.bex.co"]
    resources: ["apps"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["app.bex.co"]
    resources: ["apps/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: api-role
subjects:
  - kind: ServiceAccount
    name: api
    namespace: system
